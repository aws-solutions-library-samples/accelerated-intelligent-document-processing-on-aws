AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  AWS GenAI IDP Accelerator - Multi-Document Discovery Nested Stack.
  Deploys container-based Lambda functions for multi-doc discovery (embed, cluster, analyze, save).
  Uses Docker images because dependencies (scikit-learn, scipy, numpy, strands-agents) exceed
  Lambda's 250MB unzipped layer limit.

Parameters:
  StackName:
    Type: String
    Description: Parent stack name
  DiscoveryBucketName:
    Type: String
    Description: Discovery S3 bucket name
  DiscoveryBucketArn:
    Type: String
    Description: Discovery S3 bucket ARN
  InputBucketName:
    Type: String
    Description: Input S3 bucket name
    Default: ""
  TestSetBucketName:
    Type: String
    Description: Test Set S3 bucket name
    Default: ""
  ConfigurationTableName:
    Type: String
    Description: Configuration DynamoDB table name
  ConfigurationTableArn:
    Type: String
    Description: Configuration DynamoDB table ARN
  CustomerManagedEncryptionKeyArn:
    Type: String
    Description: KMS key ARN for encryption
  PermissionsBoundaryArn:
    Type: String
    Default: ""
    Description: Optional IAM permissions boundary ARN
  LogLevel:
    Type: String
    Default: "INFO"
  LogRetentionDays:
    Type: Number
    Default: 365
  BuildHash:
    Type: String
    Default: "initial"
    Description: Hash to trigger Docker image rebuild when source changes
  ArtifactBucket:
    Type: String
    Description: S3 bucket containing build artifacts (source zip for CodeBuild)
  SourceZipfile:
    Type: String
    Description: S3 key for the source zip file used by CodeBuild
  DiscoveryTrackingTableName:
    Type: String
    Description: >-
      DiscoveryTrackingTable name. Used to write job status directly to DynamoDB.
    Default: ""
  BedrockHubRoleArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:(aws|aws-cn|aws-us-gov|aws-iso|aws-iso-b):iam::[0-9]{12}:role/[\\w+=,.@\\-/]+$"
    ConstraintDescription: "Must be empty or a valid IAM role ARN. The ARN must NOT contain spaces — pass ExternalId via the separate BedrockHubRoleExternalId parameter."
    Description: >
      (Optional) ARN of an IAM role in a centralized hub account to assume for all
      Bedrock invocations. When set, Lambdas use sts:AssumeRole and route Bedrock
      data-plane and control-plane traffic through this role.
  BedrockHubRoleExternalId:
    Type: String
    Default: ""
    NoEcho: true
    Description: "(Optional) ExternalId for sts:AssumeRole into the Bedrock hub-account role."
  BedrockHubRoleSessionName:
    Type: String
    Default: ""
    Description: "(Optional) Session name for sts:AssumeRole into the Bedrock hub-account role."
  VpcId:
    Type: String
    Default: ""
    Description: "(Optional) VPC ID for CodeBuild to run in private network."
  PrivateSubnetIds:
    Type: CommaDelimitedList
    Default: ""
    Description: "(Optional) Private subnet IDs for CodeBuild VPC config."
  LambdaSecurityGroupId:
    Type: String
    Default: ""
    Description: "(Optional) Security group for CodeBuild VPC config."
  ArtifactsBucketKmsKeyArn:
    Type: String
    Description: >
      Optional KMS key ARN for the artifacts S3 bucket (if KMS-encrypted). When provided,
      the CodeBuildRole receives kms:Decrypt permission so it can download source zips.
    Default: ""

Conditions:
  HasPermissionsBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, ""]]
  DeployInVPC: !Not [!Equals [!Ref VpcId, ""]]
  HasBedrockHubRole: !Not [!Equals [!Ref BedrockHubRoleArn, ""]]
  HasBedrockHubRoleExternalId: !Not [!Equals [!Ref BedrockHubRoleExternalId, ""]]
  HasBedrockHubRoleSessionName: !Not [!Equals [!Ref BedrockHubRoleSessionName, ""]]
  HasArtifactsBucketKmsKey: !Not [!Equals [!Ref ArtifactsBucketKmsKeyArn, ""]]

Resources:
  ##########################################################################
  # ECR Repository
  ##########################################################################
  ECRRepository:
    Type: AWS::ECR::Repository
    # checkov:skip=CKV_AWS_51: "Mutable tags allowed for workflow flexibility"
    # checkov:skip=CKV_AWS_163: "ECR scanning optional per deployment requirements"
    Properties:
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last 10 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }
      EncryptionConfiguration:
        EncryptionType: KMS
        KmsKey: !Ref CustomerManagedEncryptionKeyArn
      # Durable pull permission for the container-image Lambda functions below.
      # Without an explicit repository policy, Lambda only auto-attaches a pull
      # policy at function CREATE time; it is NOT reapplied when a function is
      # updated (e.g. an env-var/IAM change), so the image re-pull on update
      # fails with "The function does not have permission to access the
      # specified image" and the function never stabilizes — breaking stack
      # updates. Scoped to Lambda functions in this account/region.
      RepositoryPolicyText:
        Version: "2012-10-17"
        Statement:
          - Sid: LambdaECRImageRetrieval
            Effect: Allow
            Principal:
              Service: !Sub "lambda.${AWS::URLSuffix}"
            Action:
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
            Condition:
              StringLike:
                aws:sourceArn: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:*"

  ##########################################################################
  # CodeBuild Project - builds Docker image and pushes to ECR
  ##########################################################################
  CodeBuildRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: "Wildcard permissions required for CloudWatch Logs creation and ECR auth"
    Properties:
      Path: /
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub "codebuild.${AWS::URLSuffix}"
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*"
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:BatchCheckLayerAvailability
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                Resource: !GetAtt ECRRepository.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${DiscoveryBucketName}"
                  - !Sub "arn:${AWS::Partition}:s3:::${DiscoveryBucketName}/*"
                  - !Sub "arn:${AWS::Partition}:s3:::${ArtifactBucket}"
                  - !Sub "arn:${AWS::Partition}:s3:::${ArtifactBucket}/*"
              - Effect: Allow
                Action:
                  - kms:Encrypt
                  - kms:Decrypt
                  - kms:ReEncrypt*
                  - kms:GenerateDataKey*
                  - kms:DescribeKey
                Resource: !Ref CustomerManagedEncryptionKeyArn
              - !If
                - DeployInVPC
                - Effect: Allow
                  Action:
                    - ec2:CreateNetworkInterface
                    - ec2:DescribeNetworkInterfaces
                    - ec2:DeleteNetworkInterface
                    - ec2:DescribeSubnets
                    - ec2:DescribeSecurityGroups
                    - ec2:DescribeVpcs
                    - ec2:DescribeDhcpOptions
                  Resource: "*"
                - !Ref AWS::NoValue
              - !If
                - DeployInVPC
                - Effect: Allow
                  Action:
                    - ec2:CreateNetworkInterfacePermission
                  Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*"
                  Condition:
                    StringEquals:
                      ec2:AuthorizedService: !Sub "codebuild.${AWS::URLSuffix}"
                - !Ref AWS::NoValue
              # Grant kms:Decrypt on the artifacts bucket KMS key when provided
              # This allows CodeBuild to download source zips from a KMS-encrypted artifact bucket
              - !If
                - HasArtifactsBucketKmsKey
                - Effect: Allow
                  Action:
                    - kms:Decrypt
                    - kms:GenerateDataKey*
                    - kms:DescribeKey
                  Resource: !Ref ArtifactsBucketKmsKeyArn
                - !Ref AWS::NoValue

  DockerBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Description: Build Docker image for Multi-Document Discovery Lambda functions
      ServiceRole: !GetAtt CodeBuildRole.Arn
      VpcConfig:
        !If
          - DeployInVPC
          - VpcId: !Ref VpcId
            Subnets: !Ref PrivateSubnetIds
            SecurityGroupIds:
              - !Ref LambdaSecurityGroupId
          - !Ref AWS::NoValue
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        Type: LINUX_CONTAINER
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: AWS_ACCOUNT_ID
            Value: !Ref AWS::AccountId
          - Name: AWS_DEFAULT_REGION
            Value: !Ref AWS::Region
          # The ECR registry host is <account>.dkr.ecr.<region>.<URLSuffix>; the
          # suffix is amazonaws.com.cn in aws-cn, so it must come from the template.
          - Name: AWS_URL_SUFFIX
            Value: !Ref AWS::URLSuffix
          - Name: ECR_REPO_URI
            Value: !GetAtt ECRRepository.RepositoryUri
          - Name: IMAGE_TAG
            Value: latest
      Source:
        Type: S3
        Location: !Sub "${ArtifactBucket}/${SourceZipfile}"
        # The Dockerfile and requirements.txt come from the source zip
        # (nested/multi-doc-discovery/{Dockerfile,requirements.txt}, packaged by
        # publish.py) rather than being written inline here. An earlier version
        # heredoc'd copies of both into this buildspec, which silently forked
        # from the real files - Dependabot bumped the on-disk requirements.txt
        # (e.g. the Pillow CVE bump in #530) while the image kept building the
        # stale inline pins. Never reintroduce inline copies.
        BuildSpec: |
          version: 0.2
          phases:
            pre_build:
              commands:
                - echo Logging in to Amazon ECR...
                - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.$AWS_URL_SUFFIX
            build:
              commands:
                - echo "Source directory contents:"
                - ls -la
                # Fail loudly if the source zip is missing the build inputs,
                # rather than falling through to an opaque `docker build` error.
                - |
                  for f in nested/multi-doc-discovery/Dockerfile nested/multi-doc-discovery/requirements.txt; do
                    if [ ! -f "$f" ]; then
                      echo "ERROR: required build input missing from source zip: $f"
                      exit 1
                    fi
                  done
                - echo "Using checked-in Dockerfile and requirements.txt:"
                - cat nested/multi-doc-discovery/requirements.txt
                # Build context is the zip root so the Dockerfile can COPY both
                # lib/idp_common_pkg and src/lambda/multi_doc_discovery.
                - echo "Building Docker image..."
                - docker build -f nested/multi-doc-discovery/Dockerfile -t $ECR_REPO_URI:$IMAGE_TAG .
            post_build:
              commands:
                - echo Pushing Docker image to ECR...
                # Transient ECR/network faults on a multi-hundred-MB push should
                # not fail a 30-minute stack deploy.
                - |
                  pushed=0
                  for attempt in 1 2 3; do
                    if docker push $ECR_REPO_URI:$IMAGE_TAG; then
                      pushed=1
                      break
                    fi
                    echo "docker push failed (attempt $attempt); retrying in $((attempt * 15))s..."
                    sleep $((attempt * 15))
                  done
                  if [ "$pushed" -ne 1 ]; then
                    echo "ERROR: docker push failed after 3 attempts"
                    exit 1
                  fi
                - echo Build completed on `date`
      TimeoutInMinutes: 30
      EncryptionKey: !Ref CustomerManagedEncryptionKeyArn

  ##########################################################################
  # Custom Resource Lambda - triggers CodeBuild during deployment
  ##########################################################################
  DockerBuildRunFunctionRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: "CloudWatch Logs require wildcard for log group creation"
    Properties:
      Path: /
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub "lambda.${AWS::URLSuffix}"
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DockerBuildRunPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource: !GetAtt DockerBuildProject.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"

  DockerBuildRunFunction:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function does not require VPC access"
          - id: W92
            reason: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_116: "DLQ not needed for custom resource Lambda"
    # checkov:skip=CKV_AWS_117: "No VPC needed"
    # checkov:skip=CKV_AWS_115: "No reserved concurrency needed"
    # checkov:skip=CKV_AWS_173: "No sensitive env vars"
    Properties:
      FunctionName: !Sub "GENAIIDP-${StackName}-MultiDocBuildRun"
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      Handler: index.handler
      Runtime: python3.12
      CodeUri: ./docker_build_lambda
      Description: Custom resource handler - triggers CodeBuild for multi-doc discovery image
      MemorySize: 128
      Timeout: 900
      Role: !GetAtt DockerBuildRunFunctionRole.Arn
      LoggingConfig:
        LogGroup: !Ref DockerBuildRunFunctionLogGroup

  DockerBuildRunFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn
      RetentionInDays: !Ref LogRetentionDays

  DockerBuildRun:
    Type: Custom::DockerBuild
    DependsOn:
      - DockerBuildProject
      - ECRRepository
    Properties:
      ServiceToken: !GetAtt DockerBuildRunFunction.Arn
      ProjectName: !Ref DockerBuildProject
      BuildHash: !Ref BuildHash

  ##########################################################################
  # Container Image Lambda Functions (4 heavy functions)
  ##########################################################################

  # --- Embed Function ---
  MultiDocDiscoveryEmbedFunction:
    Type: AWS::Serverless::Function
    DependsOn: DockerBuildRun
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function does not require VPC access"
          - id: W92
            reason: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_116: "DLQ handled at Step Functions level"
    # checkov:skip=CKV_AWS_117: "No VPC needed"
    # checkov:skip=CKV_AWS_115: "No reserved concurrency needed"
    # checkov:skip=CKV_AWS_173: "No sensitive env vars"
    Properties:
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      PackageType: Image
      ImageUri: !Sub "${ECRRepository.RepositoryUri}:latest"
      ImageConfig:
        Command: ["embed_handler.handler"]
      Description: Multi-doc discovery - generate multimodal embeddings
      MemorySize: 2048
      Timeout: 900
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          DISCOVERY_BUCKET: !Ref DiscoveryBucketName
          CONFIGURATION_TABLE_NAME: !Ref ConfigurationTableName
          DISCOVERY_TRACKING_TABLE: !Ref DiscoveryTrackingTableName
          BEDROCK_ASSUME_ROLE_ARN:
            !If [HasBedrockHubRole, !Ref BedrockHubRoleArn, !Ref AWS::NoValue]
          BEDROCK_ASSUME_ROLE_EXTERNAL_ID:
            !If [HasBedrockHubRoleExternalId, !Ref BedrockHubRoleExternalId, !Ref AWS::NoValue]
          BEDROCK_ASSUME_ROLE_SESSION_NAME:
            !If [HasBedrockHubRoleSessionName, !Ref BedrockHubRoleSessionName, !Ref AWS::NoValue]
      LoggingConfig:
        LogGroup: !Ref MultiDocDiscoveryEmbedFunctionLogGroup
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DiscoveryBucketName
        - S3ReadPolicy:
            BucketName: !Ref InputBucketName
        - S3ReadPolicy:
            BucketName: !Ref TestSetBucketName
        - DynamoDBReadPolicy:
            TableName: !Ref ConfigurationTableName
        - Statement:
            - Effect: Allow
              Action: [kms:Encrypt, kms:Decrypt, kms:ReEncrypt*, kms:GenerateDataKey*, kms:DescribeKey]
              Resource: !Ref CustomerManagedEncryptionKeyArn
            # OpenAI GPT-5.x models use the bedrock-mantle endpoint / IAM namespace.
            - Effect: Allow
              Action: [bedrock-mantle:CreateInference, bedrock-mantle:GetProject, bedrock-mantle:ListProjects, bedrock-mantle:ListTagsForResources]
              Resource: "*"
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:application-inference-profile/*"
            # Optional cross-account Bedrock invocation via hub-account role.
            - !If
              - HasBedrockHubRole
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: !Ref BedrockHubRoleArn
              - !Ref AWS::NoValue
            - Effect: Allow
              Action: [cloudwatch:PutMetricData]
              Resource: "*"
            # Write discovery job status straight to DynamoDB.
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
                - dynamodb:GetItem
              Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DiscoveryTrackingTableName}"

  MultiDocDiscoveryEmbedFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn
      RetentionInDays: !Ref LogRetentionDays

  # --- Cluster Function ---
  MultiDocDiscoveryClusterFunction:
    Type: AWS::Serverless::Function
    DependsOn: DockerBuildRun
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function does not require VPC access"
          - id: W92
            reason: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_116: "DLQ handled at Step Functions level"
    # checkov:skip=CKV_AWS_117: "No VPC needed"
    # checkov:skip=CKV_AWS_115: "No reserved concurrency needed"
    # checkov:skip=CKV_AWS_173: "No sensitive env vars"
    Properties:
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      PackageType: Image
      ImageUri: !Sub "${ECRRepository.RepositoryUri}:latest"
      ImageConfig:
        Command: ["cluster_handler.handler"]
      Description: Multi-doc discovery - cluster documents by embedding similarity
      MemorySize: 2048
      Timeout: 300
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          DISCOVERY_BUCKET: !Ref DiscoveryBucketName
          DISCOVERY_TRACKING_TABLE: !Ref DiscoveryTrackingTableName
          BEDROCK_ASSUME_ROLE_ARN:
            !If [HasBedrockHubRole, !Ref BedrockHubRoleArn, !Ref AWS::NoValue]
          BEDROCK_ASSUME_ROLE_EXTERNAL_ID:
            !If [HasBedrockHubRoleExternalId, !Ref BedrockHubRoleExternalId, !Ref AWS::NoValue]
          BEDROCK_ASSUME_ROLE_SESSION_NAME:
            !If [HasBedrockHubRoleSessionName, !Ref BedrockHubRoleSessionName, !Ref AWS::NoValue]
      LoggingConfig:
        LogGroup: !Ref MultiDocDiscoveryClusterFunctionLogGroup
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DiscoveryBucketName
        - Statement:
            - Effect: Allow
              Action: [kms:Encrypt, kms:Decrypt, kms:ReEncrypt*, kms:GenerateDataKey*, kms:DescribeKey]
              Resource: !Ref CustomerManagedEncryptionKeyArn
            # Optional cross-account Bedrock invocation via hub-account role.
            - !If
              - HasBedrockHubRole
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: !Ref BedrockHubRoleArn
              - !Ref AWS::NoValue
            # Write discovery job status straight to DynamoDB.
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
                - dynamodb:GetItem
              Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DiscoveryTrackingTableName}"

  MultiDocDiscoveryClusterFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn
      RetentionInDays: !Ref LogRetentionDays

  # --- Analyze Function ---
  MultiDocDiscoveryAnalyzeFunction:
    Type: AWS::Serverless::Function
    DependsOn: DockerBuildRun
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function does not require VPC access"
          - id: W92
            reason: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_116: "DLQ handled at Step Functions level"
    # checkov:skip=CKV_AWS_117: "No VPC needed"
    # checkov:skip=CKV_AWS_115: "No reserved concurrency needed"
    # checkov:skip=CKV_AWS_173: "No sensitive env vars"
    Properties:
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      PackageType: Image
      ImageUri: !Sub "${ECRRepository.RepositoryUri}:latest"
      ImageConfig:
        Command: ["analyze_handler.handler"]
      Description: Multi-doc discovery - analyze cluster with Strands agent
      MemorySize: 2048
      Timeout: 900
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          DISCOVERY_BUCKET: !Ref DiscoveryBucketName
          CONFIGURATION_TABLE_NAME: !Ref ConfigurationTableName
          BEDROCK_ASSUME_ROLE_ARN:
            !If [HasBedrockHubRole, !Ref BedrockHubRoleArn, !Ref AWS::NoValue]
          BEDROCK_ASSUME_ROLE_EXTERNAL_ID:
            !If [HasBedrockHubRoleExternalId, !Ref BedrockHubRoleExternalId, !Ref AWS::NoValue]
          BEDROCK_ASSUME_ROLE_SESSION_NAME:
            !If [HasBedrockHubRoleSessionName, !Ref BedrockHubRoleSessionName, !Ref AWS::NoValue]
      LoggingConfig:
        LogGroup: !Ref MultiDocDiscoveryAnalyzeFunctionLogGroup
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DiscoveryBucketName
        - S3ReadPolicy:
            BucketName: !Ref InputBucketName
        - S3ReadPolicy:
            BucketName: !Ref TestSetBucketName
        - DynamoDBReadPolicy:
            TableName: !Ref ConfigurationTableName
        - Statement:
            - Effect: Allow
              Action: [kms:Encrypt, kms:Decrypt, kms:ReEncrypt*, kms:GenerateDataKey*, kms:DescribeKey]
              Resource: !Ref CustomerManagedEncryptionKeyArn
            # OpenAI GPT-5.x models use the bedrock-mantle endpoint / IAM namespace.
            - Effect: Allow
              Action: [bedrock-mantle:CreateInference, bedrock-mantle:GetProject, bedrock-mantle:ListProjects, bedrock-mantle:ListTagsForResources]
              Resource: "*"
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream, bedrock:GetInferenceProfile]
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:application-inference-profile/*"
            # Optional cross-account Bedrock invocation via hub-account role.
            - !If
              - HasBedrockHubRole
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: !Ref BedrockHubRoleArn
              - !Ref AWS::NoValue
            - Effect: Allow
              Action: [cloudwatch:PutMetricData]
              Resource: "*"

  MultiDocDiscoveryAnalyzeFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn
      RetentionInDays: !Ref LogRetentionDays

  # --- Save Function ---
  MultiDocDiscoverySaveFunction:
    Type: AWS::Serverless::Function
    DependsOn: DockerBuildRun
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function does not require VPC access"
          - id: W92
            reason: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_116: "DLQ handled at Step Functions level"
    # checkov:skip=CKV_AWS_117: "No VPC needed"
    # checkov:skip=CKV_AWS_115: "No reserved concurrency needed"
    # checkov:skip=CKV_AWS_173: "No sensitive env vars"
    Properties:
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      PackageType: Image
      ImageUri: !Sub "${ECRRepository.RepositoryUri}:latest"
      ImageConfig:
        Command: ["save_handler.handler"]
      Description: Multi-doc discovery - save results and generate reflection
      MemorySize: 1024
      Timeout: 900
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          DISCOVERY_BUCKET: !Ref DiscoveryBucketName
          CONFIGURATION_TABLE_NAME: !Ref ConfigurationTableName
          DISCOVERY_TRACKING_TABLE: !Ref DiscoveryTrackingTableName
          BEDROCK_ASSUME_ROLE_ARN:
            !If [HasBedrockHubRole, !Ref BedrockHubRoleArn, !Ref AWS::NoValue]
          BEDROCK_ASSUME_ROLE_EXTERNAL_ID:
            !If [HasBedrockHubRoleExternalId, !Ref BedrockHubRoleExternalId, !Ref AWS::NoValue]
          BEDROCK_ASSUME_ROLE_SESSION_NAME:
            !If [HasBedrockHubRoleSessionName, !Ref BedrockHubRoleSessionName, !Ref AWS::NoValue]
      LoggingConfig:
        LogGroup: !Ref MultiDocDiscoverySaveFunctionLogGroup
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DiscoveryBucketName
        - DynamoDBCrudPolicy:
            TableName: !Ref ConfigurationTableName
        - Statement:
            - Effect: Allow
              Action: [kms:Encrypt, kms:Decrypt, kms:ReEncrypt*, kms:GenerateDataKey*, kms:DescribeKey]
              Resource: !Ref CustomerManagedEncryptionKeyArn
            # OpenAI GPT-5.x models use the bedrock-mantle endpoint / IAM namespace.
            - Effect: Allow
              Action: [bedrock-mantle:CreateInference, bedrock-mantle:GetProject, bedrock-mantle:ListProjects, bedrock-mantle:ListTagsForResources]
              Resource: "*"
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream, bedrock:GetInferenceProfile]
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:application-inference-profile/*"
            # Optional cross-account Bedrock invocation via hub-account role.
            - !If
              - HasBedrockHubRole
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: !Ref BedrockHubRoleArn
              - !Ref AWS::NoValue
            - Effect: Allow
              Action: [cloudwatch:PutMetricData]
              Resource: "*"
            # Write discovery job status straight to DynamoDB.
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
                - dynamodb:GetItem
              Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DiscoveryTrackingTableName}"

  MultiDocDiscoverySaveFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn
      RetentionInDays: !Ref LogRetentionDays

Outputs:
  EmbedFunctionArn:
    Description: ARN of the Embed Lambda function
    Value: !GetAtt MultiDocDiscoveryEmbedFunction.Arn
  ClusterFunctionArn:
    Description: ARN of the Cluster Lambda function
    Value: !GetAtt MultiDocDiscoveryClusterFunction.Arn
  AnalyzeFunctionArn:
    Description: ARN of the Analyze Lambda function
    Value: !GetAtt MultiDocDiscoveryAnalyzeFunction.Arn
  SaveFunctionArn:
    Description: ARN of the Save Lambda function
    Value: !GetAtt MultiDocDiscoverySaveFunction.Arn
  ECRRepositoryUri:
    Description: URI of the ECR repository
    Value: !GetAtt ECRRepository.RepositoryUri
