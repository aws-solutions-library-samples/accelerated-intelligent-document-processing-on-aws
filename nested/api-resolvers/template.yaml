  # SQS Queue for test file copying jobs
  ##########################################################################


  ##########################################################################
  # TestRunnerFunction
  ##########################################################################
  TestRunnerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function does not require VPC access as it only interacts with AWS services via APIs"
          - id: W92
            reason: "Function does not require reserved concurrency as it scales based on demand"
          - id: W12
            reason: "Lambda requires CloudWatch logs permissions"
    # checkov:skip=CKV_AWS_116: "DLQ not required for AppSync resolver function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only configuration values like feature flags and non-sensitive settings"
    Properties:
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      Handler: index.handler
      Runtime: python3.12
      CodeUri: ./src/lambda/test_runner
      Description: Lambda function to run test sets via GraphQL API
      MemorySize: 256
      Timeout: 300
      # Needed by _capture_config: a run pinned to a revision records THAT
      # revision's configuration and marks it exempt from retention pruning, so a
      # later comparison still has both runs' configurations to show.
      Layers:
        - !Ref IDPCommonBaseLayerArn

      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          INPUT_BUCKET: !Ref InputBucketName
          BASELINE_BUCKET: !If
            - ShouldCreateEvaluationBaselineBucket
            - !Ref EvaluationBaselineBucketName
            - !Ref EvaluationBaselineBucketName
          CONFIG_TABLE: !Ref ConfigurationTableName
          CONFIGURATION_TABLE_NAME: !Ref ConfigurationTableName
          CONFIGURATION_BUCKET: !Ref ConfigurationBucketName
          TRACKING_TABLE: !Ref TrackingTableName
          FILE_COPY_QUEUE_URL: !Ref TestFileCopyQueueUrl
      LoggingConfig:
        LogGroup: !Ref TestRunnerFunctionLogGroup
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TrackingTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref ConfigurationTableName
        # Read a pinned revision's stored configuration body.
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "arn:${AWS::Partition}:s3:::${ConfigurationBucketName}/config_revisions/*"
        - S3CrudPolicy:
            BucketName: !Ref InputBucketName
        - S3CrudPolicy:
            BucketName: !If
              - ShouldCreateEvaluationBaselineBucket
              - !Ref EvaluationBaselineBucketName
              - !Ref EvaluationBaselineBucketName
        - SQSSendMessagePolicy:
            QueueName: !Ref TestFileCopyQueueName
        - Statement:
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:ReEncrypt*
                - kms:GenerateDataKey*
                - kms:DescribeKey
              Resource: !Ref CustomerManagedEncryptionKeyArn
  TestSetResolverFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn
      RetentionInDays: !Ref LogRetentionDays


  ##########################################################################
  # TestSetResolverFunction
  ##########################################################################
  TestSetResolverFunction:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function does not require VPC access as it only interacts with AWS services via APIs"
          - id: W92
            reason: "Function does not require reserved concurrency as it scales based on demand"
          - id: W12
            reason: "Lambda requires CloudWatch logs permissions"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required for synchronous AppSync resolver"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_173: "Environment variables contain non-sensitive configuration values"
    Properties:
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      Handler: index.handler
      Runtime: python3.12
      CodeUri: ./src/lambda/test_set_resolver
      Description: GraphQL resolver for test set mutations
      MemorySize: 256
      Timeout: 60

      Layers:
        - !Ref IDPCommonBaseLayerArn
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          TRACKING_TABLE: !Ref TrackingTableName
          INPUT_BUCKET: !Ref InputBucketName
          TEST_SET_BUCKET: !Ref TestSetBucketName
          TEST_SET_COPY_QUEUE_URL: !Ref TestSetFileCopyQueueUrl
          # generateDraftLabels delegates run creation (config capture + version
          # pinning) to the test runner rather than duplicating it.
          TEST_RUNNER_FUNCTION_ARN: !GetAtt TestRunnerFunction.Arn
          # getAnnotationQueue enforces per-user allowedTestSets scope, which is
          # stored on the user record. Without this the scope lookup returns
          # "unrestricted" and a scoped Annotator would be denied everything.
          USERS_TABLE_NAME: !Ref UsersTableName
          BASELINE_BUCKET: !If
            - ShouldCreateEvaluationBaselineBucket
            - !Ref EvaluationBaselineBucketName
            - !Ref EvaluationBaselineBucketName
          S3_ENDPOINT_URL: !If [HasS3EndpointUrl, !Ref S3EndpointUrl, !Ref AWS::NoValue]
      LoggingConfig:
        LogGroup: !Ref TestSetResolverFunctionLogGroup
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TrackingTableName
        - S3ReadPolicy:
            BucketName: !Ref InputBucketName
        - S3CrudPolicy:
            BucketName: !Ref TestSetBucketName
        - S3ReadPolicy:
            BucketName: !If
              - ShouldCreateEvaluationBaselineBucket
              - !Ref EvaluationBaselineBucketName
              - !Ref EvaluationBaselineBucketName
        - SQSSendMessagePolicy:
            QueueName: !Ref TestSetFileCopyQueueName
        # The draft-label harvester reads the pipeline's section extraction
        # results (Sections[].OutputJSONUri) out of the output bucket and writes
        # them into the test set's baseline/ prefix as draft labels.
        - S3ReadPolicy:
            BucketName: !Ref OutputBucketName
        - Statement:
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:ReEncrypt*
                - kms:GenerateDataKey*
                - kms:DescribeKey
              Resource: !Ref CustomerManagedEncryptionKeyArn
        # generateDraftLabels invokes the test runner synchronously to start the
        # labeling run.
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt TestRunnerFunction.Arn
        # Read-only access on UsersTable + EmailIndex so the resolver can look up
        # the caller's allowedTestSets and enforce per-test-set annotation scope.
        # Unlike the config-version scope elsewhere, a failed lookup here denies a
        # scoped Annotator rather than granting unrestricted access (an Annotator
        # with no resolvable scope is refused), so a missing grant breaks the
        # annotation queue loudly instead of silently widening access.
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
              Resource:
                - !Ref UsersTableArn
                - !Sub "${UsersTableArn}/index/*"
  UploadResolverFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn
      RetentionInDays: !Ref LogRetentionDays

