  # Lambda function for deleting agent chat sessions

  ##########################################################################
  # GetAgentChatMessagesFunction
  ##########################################################################
  GetAgentChatMessagesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function does not require VPC access as it only interacts with AWS services via APIs"
          - id: W92
            reason: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required for AppSync resolver function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only configuration values like feature flags and non-sensitive settings"
    Properties:
      PermissionsBoundary:
        !If [
          HasPermissionsBoundary,
          !Ref PermissionsBoundaryArn,
          !Ref AWS::NoValue,
        ]
      CodeUri: ./src/lambda/get_agent_chat_messages_resolver/
      Handler: index.handler
      Runtime: python3.12
      Timeout: 60
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          CHAT_MESSAGES_TABLE: !Ref ChatMessagesTableName
          # ChatSessionsTable is consulted to verify that the calling Cognito
          # user owns the requested sessionId before returning messages.
          CHAT_SESSIONS_TABLE: !Ref ChatSessionsTableName
          # Document-chat sessions are owned in a separate table (keyed by
          # sessionId with ownerSub). This resolver also serves document chat in
          # the non-streaming (GovCloud) poll path, so it verifies ownership
          # against this table too.
          CHAT_DOCUMENT_SESSIONS_TABLE: !Ref ChatDocumentSessionsTable
          # Feature flag to disable ownership enforcement in case of legacy
          # session migration. Defaults to "true" (enforce). Customers should
          # only set this to "false" temporarily during data backfill.
          ENFORCE_CHAT_SESSION_OWNERSHIP: "true"
      LoggingConfig:
        LogGroup: !Ref GetAgentChatMessagesFunctionLogGroup
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ChatMessagesTableName
        # Read-only access to the sessions table is required to validate
        # that the caller owns the requested sessionId (authorization check).
        - DynamoDBReadPolicy:
            TableName: !Ref ChatSessionsTableName
        # Same ownership check for document-chat sessions.
        - DynamoDBReadPolicy:
            TableName: !Ref ChatDocumentSessionsTable
        - Statement:
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:ReEncrypt*
                - kms:GenerateDataKey*
                - kms:DescribeKey
              Resource: !Ref CustomerManagedEncryptionKeyArn
