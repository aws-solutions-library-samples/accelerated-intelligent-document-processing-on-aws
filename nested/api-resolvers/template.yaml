  ##########################################################################
  # UploadResolverFunction
  ##########################################################################
  UploadResolverFunction:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W12
            reason: "Lambda requires CloudWatch logs permissions"
          - id: W89
            reason: "Function does not require VPC access as it only interacts with AWS services via APIs"
          - id: W92
            reason: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required for AppSync resolver function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only configuration values like feature flags and non-sensitive settings"
    Properties:
      PermissionsBoundary:
        !If [
          HasPermissionsBoundary,
          !Ref PermissionsBoundaryArn,
          !Ref AWS::NoValue,
        ]
      Handler: index.handler
      Runtime: python3.12
      CodeUri: ./src/lambda/upload_resolver
      Description: Lambda function to return signed upload URL via GraphQL API
      MemorySize: 512
      Timeout: 60
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          INPUT_BUCKET: !Ref InputBucketName
          CONFIGURATION_BUCKET: !Ref ConfigurationBucketName
          S3_ENDPOINT_URL: !If [HasS3EndpointUrl, !Ref S3EndpointUrl, !Ref AWS::NoValue]
      LoggingConfig:
        LogGroup: !Ref UploadResolverFunctionLogGroup
      Policies:
        - S3WritePolicy:
            BucketName: !Ref InputBucketName
        - S3WritePolicy:
            BucketName: !Ref ConfigurationBucketName
        # Read access so uploadSampleDocument can copy bundled samples (and read
        # the samples manifest) from the ConfigurationBucket into the InputBucket.
        - S3ReadPolicy:
            BucketName: !Ref ConfigurationBucketName
        - S3WritePolicy:
            BucketName: !Ref OutputBucketName
        - S3WritePolicy:
            BucketName: !If
              - ShouldCreateEvaluationBaselineBucket
              - !Ref EvaluationBaselineBucketName
              - !Ref EvaluationBaselineBucketName
        # Test Studio's ground-truth editor saves edited baseline result.json
        # back to the TestSetBucket via uploadDocument's presigned POST.
        - S3WritePolicy:
            BucketName: !Ref TestSetBucketName
        - Statement:
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:ReEncrypt*
                - kms:GenerateDataKey*
                - kms:DescribeKey
              Resource: !Ref CustomerManagedEncryptionKeyArn
