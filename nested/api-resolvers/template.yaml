          # a generic S3-read gadget (Talos finding #4 hardening).
          INPUT_BUCKET: !Ref InputBucketName
          OUTPUT_BUCKET: !Ref OutputBucketName
          CONFIGURATION_BUCKET: !Ref ConfigurationBucketName
          EVALUATION_BASELINE_BUCKET: !Ref EvaluationBaselineBucketName
          REPORTING_BUCKET: !Ref ReportingBucketName
          # Test Studio's test set browser reads source docs + ground truth
          # (baseline result.json) from the TestSetBucket via this resolver.
          TEST_SET_BUCKET: !Ref TestSetBucketName
      LoggingConfig:
        LogGroup: !Ref GetFileContentsResolverFunctionLogGroup
      Policies:
        - S3ReadPolicy:

            BucketName: !If
              - ShouldCreateEvaluationBaselineBucket
              - !Ref EvaluationBaselineBucketName
              - !Ref EvaluationBaselineBucketName
        - S3ReadPolicy:
            BucketName: !Ref InputBucketName
        - S3ReadPolicy:
            BucketName: !Ref ConfigurationBucketName
        - S3ReadPolicy:
            BucketName: !Ref OutputBucketName
        - S3ReadPolicy:
            BucketName: !Ref TestSetBucketName
        # Read specific object versions (document version history: fetch the
        # exact bytes of a prior run's file via its S3 VersionId).
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObjectVersion
              Resource: !Sub "arn:${AWS::Partition}:s3:::${OutputBucketName}/*"
        - Statement:
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:ReEncrypt*
                - kms:GenerateDataKey*
                - kms:DescribeKey
              Resource: !Ref CustomerManagedEncryptionKeyArn
