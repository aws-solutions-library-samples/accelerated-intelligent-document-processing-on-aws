    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn
      RetentionInDays: !Ref LogRetentionDays


  ##########################################################################
  # QueryKnowledgeBaseResolverFunction
  ##########################################################################
  QueryKnowledgeBaseResolverFunction:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function does not require VPC access as it only interacts with AWS services via APIs"
          - id: W92
            reason: "Function does not require reserved concurrency as it scales based on demand"
          - id: W12
            reason: "Lambda requires CloudWatch logs permissions"
          - id: W11
            reason: "Role requires * resource access for Marketplace and CloudWatch Metrics and Logs"
    # checkov:skip=CKV_AWS_116: "DLQ not required for AppSync resolver function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only configuration values like feature flags and non-sensitive settings"
    Properties:
      PermissionsBoundary:
        !If [
          HasPermissionsBoundary,
          !Ref PermissionsBoundaryArn,
          !Ref AWS::NoValue,
        ]
      Handler: index.handler
      Runtime: python3.12
      CodeUri: ./src/lambda/query_knowledgebase_resolver
      Description: Lambda function to query Bedrock Knowledge Base via GraphQL API
      MemorySize: 512
      Timeout: 60

      Layers:
        - !Ref IDPCommonBaseLayerArn
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          KB_ACCOUNT_ID: !Ref AWS::AccountId
          KB_REGION: !Ref AWS::Region
          # The resolver builds the Bedrock inference-profile MODEL_ARN itself.
          # Pass the partition so that ARN resolves outside the commercial
          # partition (it previously hardcoded arn:aws:, which can never resolve
          # in GovCloud/China — AWS account ids do not span partitions).
          AWS_PARTITION: !Ref AWS::Partition
          MODEL_ID: !Ref KnowledgeBaseModelId
          SETTINGS_PARAMETER: !Ref SettingsParameterName
          GUARDRAIL_ID_AND_VERSION:
            !If [
              HasGuardrail,
              !Sub "${BedrockGuardrailId}:${BedrockGuardrailVersion}",
              "",
            ]
      LoggingConfig:
        LogGroup: !Ref QueryKnowledgeBaseResolverFunctionLogGroup
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:Retrieve
                - bedrock:RetrieveAndGenerate
              Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*"
            - Effect: Allow
              Action:
                - "bedrock:InvokeModel"
                - bedrock:GetInferenceProfile
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:application-inference-profile/*"
            - Effect: Allow
              Action:
                - "bedrock:GetInferenceProfile"
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:application-inference-profile/*"
            - Effect: Allow
              Action:
                - aws-marketplace:Subscribe
                - aws-marketplace:Unsubscribe
                - aws-marketplace:ViewSubscriptions
              Resource: "*"
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${SettingsParameterName}"
            - !If
              - HasGuardrail
              - Effect: Allow
                Action:
                  - "bedrock:ApplyGuardrail"
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/${BedrockGuardrailId}"
              - !Ref AWS::NoValue
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:ReEncrypt*
                - kms:GenerateDataKey*
                - kms:DescribeKey
              Resource: !Ref CustomerManagedEncryptionKeyArn
  ReprocessDocumentResolverFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn
      RetentionInDays: !Ref LogRetentionDays


  ##########################################################################
  # ReprocessDocumentResolverFunction
  ##########################################################################
  ReprocessDocumentResolverFunction:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function does not require VPC access as it only interacts with AWS services via APIs"
          - id: W92
            reason: "Function does not require reserved concurrency as it scales based on demand"
          - id: W12
            reason: "Lambda requires CloudWatch logs permissions"
    # checkov:skip=CKV_AWS_116: "DLQ not required for AppSync resolver function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only configuration values like feature flags and non-sensitive settings"
    Properties:
      PermissionsBoundary:
        !If [
          HasPermissionsBoundary,
          !Ref PermissionsBoundaryArn,
          !Ref AWS::NoValue,
        ]
      Handler: index.handler
      Runtime: python3.12
      CodeUri: ./src/lambda/reprocess_document_resolver
      Description: Lambda function to reprocess documents via GraphQL API
      MemorySize: 512
      Timeout: 60
      VpcConfig: !If
        - IsPrivateApi
        - SubnetIds: !Ref LambdaSubnetIds
          SecurityGroupIds:
            - !Ref LambdaSecurityGroupId
        - !Ref AWS::NoValue

      Layers:
        - !Ref IDPCommonBaseLayerArn
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          INPUT_BUCKET: !Ref InputBucketName
          OUTPUT_BUCKET: !Ref OutputBucketName
          QUEUE_URL: !Ref DocumentQueueUrl
          DATA_RETENTION_IN_DAYS: !Ref DataRetentionInDays
          # create_document_service() (imported at module load) builds a
          # DynamoDB doc service that reads TRACKING_TABLE; without it every
          # invocation fails at import with "DynamoDB table name must be
          # provided or set in TRACKING_TABLE" (surfaced as a 400 to all
          # callers). This was masked under AppSync (VTL, no Python service).
          TRACKING_TABLE: !Ref TrackingTableName
          # RBAC: resolve caller's allowedConfigVersions from UsersTable to
          # enforce config-version scope on the `version` argument. Empty
          # string in single-user / pre-RBAC deployments (fail-open).
          USERS_TABLE_NAME: !Ref UsersTableName
          # Namespace for the ``StaleOutputPurgeFailed`` metric emitted
          # on partial-purge failure — parity with queue_sender's #719
          # telemetry so operators can alarm on both ingest and
          # reprocess paths from a single metric. Uses the ROOT stack's
          # name (``!Ref StackName`` — the parameter, passed in by the
          # root template) NOT ``!Ref AWS::StackName``: this is a
          # nested template, so the pseudo-parameter would resolve to
          # the auto-generated nested stack name and the metric would
          # land in a different namespace than queue_sender's, defeating
          # the "single-alarm parity" this block sets up.
          METRIC_NAMESPACE: !Ref StackName
      LoggingConfig:
        LogGroup: !Ref ReprocessDocumentResolverFunctionLogGroup
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TrackingTableName
        - SQSSendMessagePolicy:
            QueueName: !Ref DocumentQueueName
        - S3ReadPolicy:
            BucketName: !Ref InputBucketName
        - S3CrudPolicy:
            BucketName: !Ref OutputBucketName
        # #719 parity: emit ``StaleOutputPurgeFailed`` on partial-purge
        # failure so operators can alarm on the metric rather than
        # scraping ERROR logs. Namespace-scoped to prevent this Lambda
        # from writing under any other stack's metrics.
        - Statement:
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
              Condition:
                StringEquals:
                  # Root-stack name via parameter, NOT ``!Ref AWS::StackName``
                  # (nested template) — see METRIC_NAMESPACE comment above.
                  cloudwatch:namespace: !Ref StackName
        - Statement:
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:ReEncrypt*
                - kms:GenerateDataKey*
                - kms:DescribeKey
              Resource: !Ref CustomerManagedEncryptionKeyArn
            # RBAC: read-only lookup of caller's `allowedConfigVersions`
            # via UsersTable `EmailIndex`.
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
              Resource:
                - !Ref UsersTableArn
                - !Sub "${UsersTableArn}/index/*"

  DocumentVersionsResolverFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn
      RetentionInDays: !Ref LogRetentionDays


  ##########################################################################
  # DocumentVersionsResolverFunction
  #
  # Serves document version-history fields: listDocumentVersions,
  # getDocumentVersion, compareDocumentVersions, deleteDocumentVersion.
  # Reads run records (PK=doc#<key>, SK=run#<id>) and manifest-pinned S3
  # object versions from the output bucket.
  ##########################################################################
  DocumentVersionsResolverFunction:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function does not require VPC access as it only interacts with AWS services via APIs"
          - id: W92
            reason: "Function does not require reserved concurrency as it scales based on demand"
          - id: W12
            reason: "Lambda requires CloudWatch logs permissions"
    # checkov:skip=CKV_AWS_116: "DLQ not required for AppSync resolver function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only configuration values like feature flags and non-sensitive settings"
    Properties:
      PermissionsBoundary:
        !If [
          HasPermissionsBoundary,
          !Ref PermissionsBoundaryArn,
          !Ref AWS::NoValue,
        ]
      Handler: index.handler
      Runtime: python3.12
      CodeUri: ./src/lambda/document_versions_resolver
      Description: Lambda function serving document version-history API fields
      MemorySize: 512
      Timeout: 60
      VpcConfig: !If
        - IsPrivateApi
        - SubnetIds: !Ref LambdaSubnetIds
          SecurityGroupIds:
            - !Ref LambdaSecurityGroupId
        - !Ref AWS::NoValue
      Layers:
        - !Ref IDPCommonBaseLayerArn
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          OUTPUT_BUCKET: !Ref OutputBucketName
          TRACKING_TABLE: !Ref TrackingTableName
      LoggingConfig:
        LogGroup: !Ref DocumentVersionsResolverFunctionLogGroup
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TrackingTableName
        # Read manifest-pinned output object versions; delete a version's
        # pinned S3 objects + manifest on deleteDocumentVersion.
        - Statement:
            - Effect: Allow
              Action:
                # ListBucketVersions: enumerate object versions for the manifest.
                # ListBucket: list_run_ids() enumerates run manifests under the
                # runs/ prefix via ListObjectsV2 (reference-counting on delete).
                - s3:ListBucketVersions
                - s3:ListBucket
              Resource: !Sub "arn:${AWS::Partition}:s3:::${OutputBucketName}"
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:GetObjectVersion
                - s3:DeleteObject
                - s3:DeleteObjectVersion
              Resource: !Sub "arn:${AWS::Partition}:s3:::${OutputBucketName}/*"
        - Statement:
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:ReEncrypt*
                - kms:GenerateDataKey*
                - kms:DescribeKey
              Resource: !Ref CustomerManagedEncryptionKeyArn

  SyncBdaIdpResolverFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn


  ##########################################################################
  # SyncBdaIdpResolverFunction
  ##########################################################################
  SyncBdaIdpResolverFunction:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W58
            reason: Lambda function has permission to write CloudWatch Logs via the attached IAM role
          - id: W89
            reason: Lambda function does not need to be deployed inside a VPC
          - id: W92
            reason: Lambda function does not need reserved concurrency
          - id: W11
            reason: CloudWatch does not support resource-level permissions
    # checkov:skip=CKV_AWS_116: "DLQ not required for AppSync resolver function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only configuration values like feature flags and non-sensitive settings"
    Properties:
      PermissionsBoundary:
        !If [
          HasPermissionsBoundary,
          !Ref PermissionsBoundaryArn,
          !Ref AWS::NoValue,
        ]
      Handler: index.handler
      Runtime: python3.12
      CodeUri: ./src/lambda/sync_bda_idp_resolver
      Timeout: 300  # 5 minutes for sync operation

      Layers:
        - !Ref IDPCommonBaseLayerArn
      Description: Lambda function to synchronously sync BDA blueprints with IDP classes
      MemorySize: 512
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          CONFIGURATION_TABLE_NAME: !Ref ConfigurationTableName
          STACK_NAME: !Ref StackName
          # Used for RBAC scope enforcement: the resolver queries the
          # UsersTable EmailIndex to look up `allowedConfigVersions` for
          # non-admin callers and rejects syncBdaIdp calls against a
          # version outside their scope.
          USERS_TABLE_NAME: !Ref UsersTableName
      LoggingConfig:
        LogGroup: !Ref SyncBdaIdpResolverFunctionLogGroup
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref ConfigurationTableName
        - S3ReadPolicy:
            BucketName: !Ref ConfigurationBucketName
        # Read-only access on UsersTable + EmailIndex for scope enforcement.
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
              Resource:
                - !Ref UsersTableArn
                - !Sub "${UsersTableArn}/index/*"

        - Statement:
            # CloudWatch metrics permission
            - Effect: Allow
              Action: cloudwatch:PutMetricData
              Resource: '*'
            # KMS permissions for encryption
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:ReEncrypt*
                - kms:GenerateDataKey*
                - kms:DescribeKey
              Resource: !Ref CustomerManagedEncryptionKeyArn
            # BDA permissions for blueprint management
            - Effect: Allow
              Action:
                - bedrock:InvokeDataAutomationAsync
                - bedrock:CreateDataAutomationProject
                - bedrock:DeleteDataAutomationProject
                - bedrock:UpdateDataAutomationProject
                - bedrock:GetDataAutomationProject
                - bedrock:GetDataAutomationStatus
                - bedrock:GetBlueprint
                - bedrock:UpdateBlueprint
                - bedrock:CreateBlueprint
                - bedrock:CreateBlueprintVersion
                - bedrock:ListBlueprints
                - bedrock:DeleteBlueprint
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:data-automation-project/*"
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:blueprint/*"
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:aws:blueprint/*"
  TestResultsResolverFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn
      RetentionInDays: !Ref LogRetentionDays


  ##########################################################################
  # TestResultsResolverFunction
  ##########################################################################
  TestResultsResolverFunction:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function does not require VPC access as it only interacts with AWS services via APIs"
          - id: W92
            reason: "Function does not require reserved concurrency as it scales based on demand"
          - id: W12
            reason: "Lambda requires CloudWatch logs permissions"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required for synchronous AppSync resolver"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_173: "Environment variables contain non-sensitive configuration values"
    Properties:
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      Handler: index.handler
      Runtime: python3.12
      CodeUri: ./src/lambda/test_results_resolver
      Description: GraphQL resolver for test results queries
      MemorySize: 512
      Timeout: 900
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          TRACKING_TABLE: !Ref TrackingTableName
          BASELINE_BUCKET: !Ref EvaluationBaselineBucketName
          OUTPUT_BUCKET: !Ref OutputBucketName
          TEST_RESULT_CACHE_UPDATE_QUEUE_URL: !Ref TestResultCacheUpdateQueueUrl
          ATHENA_DATABASE: !Ref ReportingDatabaseName
          ATHENA_OUTPUT_LOCATION: !Sub
            - "s3://${Bucket}/athena-results/"
            - Bucket: !If
                - ShouldCreateReportingBucket
                - !Ref ReportingBucketName
                - !Ref ReportingBucketName
          TEST_EXECUTION_AGGREGATION_FUNCTION_ARN: !Ref TestExecutionAggregationFunctionArn
          MLFLOW_LOGGER_FUNCTION_ARN: !If [HasMLflowLoggerFunction, !Ref MLflowLoggerFunctionArn, ""]
      # Round-21 review fix: attach the IDP common base layer so this
      # resolver can ``from idp_common.metrics import
      # emit_control_plane_cost_metric`` — required by the new Athena
      # cost emission wired in _execute_athena_query. Base layer is
      # the minimum needed here; other resolvers in this file use the
      # same layer for identical reasons.
      Layers:
        - !Ref IDPCommonBaseLayerArn
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !Ref TestResultCacheUpdateQueueArn
            BatchSize: 1
      LoggingConfig:
        LogGroup: !Ref TestResultsResolverFunctionLogGroup
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TrackingTableName
        - S3ReadPolicy:
            BucketName: !Ref EvaluationBaselineBucketName
        - S3ReadPolicy:
            BucketName: !Ref OutputBucketName
        - S3ReadPolicy:
            BucketName: !Ref ReportingBucketName
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:PutObjectAcl
              Resource: !Sub
                - "${BucketArn}/athena-results/*"
                - BucketArn: !If
                    - ShouldCreateReportingBucket
                    - !Sub "arn:${AWS::Partition}:s3:::${ReportingBucketName}"
                    - !Sub "arn:${AWS::Partition}:s3:::${ReportingBucketName}"
        - SQSSendMessagePolicy:
            QueueName: !Ref TestResultCacheUpdateQueueName
        - Statement:
            - Effect: Allow
              Action:
                - athena:StartQueryExecution
                - athena:GetQueryExecution
                - athena:GetQueryResults
                - athena:StopQueryExecution
              Resource:
                - !Sub "arn:${AWS::Partition}:athena:${AWS::Region}:${AWS::AccountId}:workgroup/primary"
                - !Sub "arn:${AWS::Partition}:athena:${AWS::Region}:${AWS::AccountId}:datacatalog/*"
        - Statement:
            # Round-21 review fix: emit_control_plane_cost_metric publishes
            # AthenaBytesScanned to the IDPControlPlane namespace after
            # each query so this resolver's Athena spend shows up in
            # ``control_plane_hourly`` under component=``test-results``.
            # Without this grant the emit call AccessDenies and 149
            # daily queries' cost stays invisible (verified via the
            # deployed idp-dev-qs1 stack: athena_bytes_sum=0 despite
            # 149 invocations). Scoped to the IDPControlPlane namespace
            # via a Condition since PutMetricData does not support
            # resource-level scoping.
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
              Condition:
                StringEquals:
                  "cloudwatch:namespace": IDPControlPlane
        - Statement:
            - Effect: Allow
              Action:
                - glue:GetTable
                - glue:GetPartitions
              Resource:
                - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog"
                - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${ReportingDatabaseName}"
                - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${ReportingDatabaseName}/*"
        - Statement:
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:ReEncrypt*
                - kms:GenerateDataKey*
                - kms:DescribeKey
              Resource: !Ref CustomerManagedEncryptionKeyArn
        - !If
          - HasTestExecutionAggregationFunction
          - Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !Ref TestExecutionAggregationFunctionArn
          - !Ref AWS::NoValue
        - !If
          - HasMLflowLoggerFunction
          - Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !Ref MLflowLoggerFunctionArn
          - !Ref AWS::NoValue
  TestRunnerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn
      RetentionInDays: !Ref LogRetentionDays

