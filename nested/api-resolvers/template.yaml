  CircuitBreakerResolverFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: CircuitBreakerEnabledCondition
    Properties:
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn
      RetentionInDays: !Ref LogRetentionDays

  CircuitBreakerResolverFunction:
    Type: AWS::Serverless::Function
    Condition: CircuitBreakerEnabledCondition
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "VPC attachment is conditional on ApiGatewayVisibility=PRIVATE (see VpcConfig below). The resolver must live in the same VPC as the private REST API so its DynamoDB reads can traverse a gateway endpoint. On the default/public path the resolver only talks to DynamoDB and Lambda over AWS-managed networking and VPC access is not required."
          - id: W92
            reason: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required for UI API resolver function"
    # checkov:skip=CKV_AWS_117: "VPC attachment is conditional on ApiGatewayVisibility=PRIVATE (see VpcConfig below); default path does not require VPC access"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data"
    Properties:
      PermissionsBoundary:
        !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      Handler: index.handler
      Runtime: python3.12
      CodeUri: ./src/lambda/circuit_breaker_resolver
      Description: AppSync resolver for circuit breaker status + admin controls
      MemorySize: 256
      Timeout: 30
      # With a PRIVATE AppSync API the resolver Lambda must live in the same
      # VPC so AppSync can invoke it and its DynamoDB reads traverse a
      # gateway endpoint rather than the public endpoint.
      VpcConfig: !If
        - IsPrivateApi
        - SubnetIds: !Ref LambdaSubnetIds
          SecurityGroupIds:
            - !Ref LambdaSecurityGroupId
        - !Ref AWS::NoValue
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          CONCURRENCY_TABLE: !Ref ConcurrencyTableName
          CIRCUIT_BREAKER_MANAGER_ARN: !Ref CircuitBreakerManagerFunctionArn
          CIRCUIT_BREAKER_ENABLED: !Ref CircuitBreakerEnabled
      LoggingConfig:
        LogGroup: !Ref CircuitBreakerResolverFunctionLogGroup
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ConcurrencyTableName
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Ref CircuitBreakerManagerFunctionArn
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:ReEncrypt*
                - kms:GenerateDataKey*
                - kms:DescribeKey
              Resource: !Ref CustomerManagedEncryptionKeyArn
  HttpApiFieldFunctionMapParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${StackName}/http-api/field-function-map"
      Type: String
      Tier: Advanced
      # One canonical entry per unique resolver function only — NOT one per
      # GraphQL field. Many fields share a resolver Lambda (e.g. 13 config
      # fields all route to ConfigurationResolverFunction); duplicating the
      # same ARN/name across every field name overflows the 8 KB Advanced-tier
      # value limit once ARNs are resolved (worse in GovCloud, where
      # arn:aws-us-gov:... is longer than arn:aws:...). Fields that share a
      # resolver with a canonical field below are routed via FIELD_ALIASES in
      # the dispatcher (index.py) instead of getting their own map entry.
      Value: !Sub
        - |
          {
            "abortTestRuns": "${AbortTestRunsResolverFunction}",
            "abortWorkflow": "${AbortWorkflowResolverFunction}",
            "addDocumentsToTestSet": "${TestSetResolverFunction}",
            "autoDetectSections": "${DiscoveryUploadResolverFunction}",
            "compareTestRuns": "${TestResultsResolverFunction}",
            "copyToBaseline": "${CopyToBaselineResolverFunction}",
            "deleteChatSession": "${DeleteAgentChatSessionFunction}",
            "compareDocumentVersions": "${DocumentVersionsResolverFunction}",
            "deleteConfigVersion": "${ConfigurationResolverFunction}",
            "deleteDocument": "${DeleteDocumentResolverFunction}",
            "deleteTests": "${DeleteTestsResolverFunction}",
            "getChatMessages": "${GetAgentChatMessagesFunction}",
            "getCircuitBreakerStatus": "${CircuitBreakerResolverFunctionArn}",
            "getDocumentCount": "${ListDocumentsGSIResolverFunction}",
            "getFileContents": "${GetFileContentsResolverFunction}",
            "getSampleDocumentUrl": "${GetSampleDocumentResolverFunction}",
            "getStepFunctionExecution": "${GetStepFunctionExecutionResolverFunction}",
            "listAvailableAgents": "${ListAvailableAgentsFunction}",
            "listChatSessions": "${ListAgentChatSessionsFunction}",
            "listDocumentsByDateRange": "${ListDocumentsByDateRangeResolverFunction}",
            "processChanges": "${ProcessChangesResolverFunction}",
            "queryKnowledgeBase": "${QueryKnowledgeBaseResolverFunction}",
            "reprocessDocument": "${ReprocessDocumentResolverFunction}",
            "sendAgentChatMessage": "${AgentChatResolverFunction}",
            "sendChatDocumentMessage": "${SendChatDocumentMessageResolverFunction}",
            "startTestRun": "${TestRunnerFunction}",
            "submitAgentQuery": "${AgentRequestHandlerFunction}",
            "syncBdaIdp": "${SyncBdaIdpResolverFunction}",
            "uploadDocument": "${UploadResolverFunction}",
            "claimReview": "${CompleteSectionReviewFunctionArn}",
            "createUser": "${UserManagementFunctionArn}",
            "createFinetuningJob": "${FinetuningJobsResolverFunctionArn}",
            "calculateCapacity": "${CalculateCapacityResolverFunctionArn}",
            "getLatestPublishedVersion": "${VersionCheckResolverFunctionArn}",
            "listCatalogFeatures": "${ListCatalogFeaturesFunctionArn}",
            "listInstalledFeatures": "${ListInstalledFeaturesFunctionArn}",
            "checkFeatureEntitlement": "${CheckFeatureEntitlementFunctionArn}",
            "getFeatureLaunchUrl": "${GetFeatureLaunchUrlFunctionArn}",
            "subscribeFeature": "${SubscribeFeatureFunctionArn}",
            "unsubscribeFeature": "${UnsubscribeFeatureFunctionArn}"
          }
        # CircuitBreakerResolverFunction is conditional (only created when the
        # circuit breaker is enabled). Resolve its ARN via a substitution
        # variable so the !Sub above never references the resource directly
        # (a direct ${CircuitBreakerResolverFunction.Arn} fails to resolve
        # when the function is absent). Empty string when disabled — those
        # circuit-breaker operations simply aren't routable then.
        - CircuitBreakerResolverFunctionArn: !If
            - CircuitBreakerEnabledCondition
            - !Ref CircuitBreakerResolverFunction
            - ""

  HttpApiDispatcherLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${StackName}-http-api-dispatcher"
      RetentionInDays: 30

  HttpApiDispatcherFunction:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function interacts only with AWS APIs; no VPC access required"
          - id: W92
            reason: "Reserved concurrency not required; scales on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required for synchronous API dispatcher"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access"
    # checkov:skip=CKV_AWS_115: "Reserved concurrency not required"
    # checkov:skip=CKV_AWS_173: "Env vars are non-sensitive (table names, ARNs)"
    Properties:
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      Handler: index.handler
      Runtime: python3.12
      CodeUri: ./src/lambda/http_api_dispatcher
      Description: HTTP API dispatcher — replaces AppSync for UI queries/mutations
      MemorySize: 512
      # 29s, matching the REST API integration ceiling below rather than
      # exceeding it. A 60s timeout here bought nothing: API Gateway had already
      # abandoned the integration and answered the browser 504 at 29s, so the
      # remaining 31s was billed compute producing a response nobody could
      # receive. The resolver invoke is bounded at 20s (see
      # _RESOLVER_READ_TIMEOUT_SECONDS in index.py) so the dispatcher returns a
      # 504 *with a body* naming the slow field before either ceiling is hit —
      # with headroom for cold-start init, which happens on API Gateway's clock
      # but not on this function's.
      Timeout: 29
      Layers:
        - !Ref IDPCommonBaseLayerArn
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          TRACKING_TABLE_NAME: !Ref TrackingTableName
          DISCOVERY_TABLE_NAME: !Ref DiscoveryTrackingTableName
          AGENT_TABLE_NAME: !Ref AgentTableName
          # field -> resolver function ARN. Fields absent here are served by
          # ddb_direct.py (discovery/agent jobs, getDocument, date queries).
          # field -> resolver function ARN map is large (~60 ARNs > 4KB env
          # limit), so it lives in an SSM parameter loaded once at cold start.
          FIELD_FUNCTION_MAP_PARAM: !Ref HttpApiFieldFunctionMapParam
      LoggingConfig:
        LogGroup: !Ref HttpApiDispatcherLogGroup
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TrackingTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref DiscoveryTrackingTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref AgentTableName
        # Invoke any resolver Lambda in this stack (scoped to the stack's
        # function name prefix) plus the named main-template resolver ARNs.
        # NB: the feature-platform UI-field resolvers (listCatalogFeatures, etc.)
        # live in the FeaturePlatformStack nested stack, whose resources are
        # named "<MainStackName>-FeaturePlatformStack-...". Since StackName here
        # is the MAIN stack name, the "${StackName}-*" wildcard already covers
        # them — no separate ARN entries needed (which would be invalid empty
        # strings when the feature platform is disabled).
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource:
                - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${StackName}-*"
                - !Ref CompleteSectionReviewFunctionArn
                - !Ref UserManagementFunctionArn
                - !Ref FinetuningJobsResolverFunctionArn
                - !Ref CalculateCapacityResolverFunctionArn
                - !Ref VersionCheckResolverFunctionArn
        # Read the field->ARN map from SSM at cold start.
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${StackName}/http-api/field-function-map"
        # The TrackingTable/DiscoveryTable/AgentTable are KMS-encrypted; the
        # DDB-direct operations (getDocument, date queries, discovery/agent jobs)
        # need kms:Decrypt/GenerateDataKey on the customer-managed key.
        - Statement:
            - Effect: Allow
              Action:
                - kms:Decrypt
                - kms:GenerateDataKey
              Resource: !Ref CustomerManagedEncryptionKeyArn

  # API Gateway REST API fronting the dispatcher. REST (not HTTP API) so it can
  # be made PRIVATE (VPC-only via an interface endpoint + resource policy) and
  # fronted by WAFv2 — neither of which HTTP APIs support. A Cognito User Pools
  # authorizer validates the same JWT the UI sends.
  HttpApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${StackName}-api"
      # Treat all media as binary so the S3-proxy web-UI routes (ServeWebUI)
      # can return images/fonts/js/css bytes intact. The JSON /op POST transport
      # is unaffected: the dispatcher base64-decodes isBase64Encoded request
      # bodies (idp_common.api_adapter._parse_body) and returns a JSON string
      # response, which API Gateway passes through unchanged. The CORS OPTIONS
      # preflight, however, DOES need CONVERT_TO_TEXT on its MOCK integration
      # (see HttpApiOptionsMethod) — otherwise */* makes API Gateway try to
      # base64-encode the empty preflight body and it 500s.
      BinaryMediaTypes:
        - "*/*"
      EndpointConfiguration: !If
        - IsPrivateApi
        - Types: [PRIVATE]
          VpcEndpointIds: [!Ref ApiGatewayVpcEndpointId]
        - Types: [REGIONAL]
      # When PRIVATE, restrict invocation to the supplied VPC endpoint; when
      # regional, allow normal invocation (auth is enforced by the authorizer).
      Policy: !If
        - IsPrivateApi
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal: "*"
              Action: execute-api:Invoke
              Resource: "execute-api:/*"
              Condition:
                StringEquals:
                  aws:SourceVpce: !Ref ApiGatewayVpcEndpointId
        - !Ref AWS::NoValue

  HttpApiAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: CognitoUserPoolsAuthorizer
      RestApiId: !Ref HttpApi
      Type: COGNITO_USER_POOLS
      IdentitySource: method.request.header.Authorization
      ProviderARNs:
        - !Sub "arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPoolId}"

  # /op resource + {field} path parameter
  HttpApiOpResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref HttpApi
      ParentId: !GetAtt HttpApi.RootResourceId
      PathPart: op

  HttpApiFieldResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref HttpApi
      ParentId: !Ref HttpApiOpResource
      PathPart: "{field}"

  HttpApiMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref HttpApi
      ResourceId: !Ref HttpApiFieldResource
      HttpMethod: POST
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref HttpApiAuthorizer
      RequestParameters:
        method.request.path.field: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        # Explicit rather than implicit. 29000ms is the REST API default (and,
        # without an account quota increase, the maximum): every operation the
        # UI reaches through POST /op/{field} must answer inside it or the
        # browser gets a bodiless 504. Stated here so the constraint is visible
        # to anyone adding a slow field — long-running work belongs behind a
        # start/poll pair (see startTestRun), not behind a longer timeout.
        TimeoutInMillis: 29000
        Uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${HttpApiDispatcherFunction.Arn}/invocations"

  # CORS preflight. Browsers send an unauthenticated OPTIONS request before each
  # cross-origin POST (from the CloudFront app origin to this API's domain). The
  # POST method is Cognito-authorized, so the preflight MUST be a separate,
  # auth-less method. A MOCK integration answers 200 with the CORS headers the
  # browser checks. Origin is "*": the UI's fetch sends no credentials/cookies
  # (see src/ui/src/api/rest-client.ts), so a wildcard is valid and avoids a
  # CloudFront -> API-stack CloudFormation dependency. The actual POST response
  # carries matching CORS headers from the dispatcher Lambda (api_adapter
  # _http_response), and GatewayResponses below cover authorizer 4xx/5xx.
  HttpApiOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref HttpApi
      ResourceId: !Ref HttpApiFieldResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      RequestParameters:
        method.request.path.field: true
      Integration:
        Type: MOCK
        # The API sets BinaryMediaTypes: */* (so the S3-proxy web-UI routes can
        # return raw bytes). Browsers send Accept: */* on the CORS preflight, so
        # without CONVERT_TO_TEXT API Gateway tries to base64-encode this MOCK
        # response as binary and the preflight fails with a 500 (which blocks the
        # subsequent POST with a browser "Failed to fetch"). Forcing text handling
        # on both the integration and its response keeps the preflight a clean 200.
        ContentHandling: CONVERT_TO_TEXT
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: "200"
            ContentHandling: CONVERT_TO_TEXT
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Headers: "'authorization,content-type'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.X-Content-Type-Options: "'nosniff'"
              method.response.header.Strict-Transport-Security: "'max-age=31536000; includeSubDomains'"
              method.response.header.X-Frame-Options: "'DENY'"
              method.response.header.Referrer-Policy: "'strict-origin-when-cross-origin'"
            ResponseTemplates:
              application/json: ""
      MethodResponses:
        - StatusCode: "200"
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.X-Content-Type-Options: true
            method.response.header.Strict-Transport-Security: true
            method.response.header.X-Frame-Options: true
            method.response.header.Referrer-Policy: true

  # CORS on error responses generated by API Gateway itself (before/around the
  # integration) — most importantly the Cognito authorizer's 401 UNAUTHORIZED
  # and 403 ACCESS_DENIED. Without these, a browser sees a header-less error and
  # reports a CORS failure instead of the real status. DEFAULT_4XX/5XX cover all
  # such gateway-level responses.
  HttpApiGatewayResponse4xx:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref HttpApi
      ResponseType: DEFAULT_4XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'authorization,content-type'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
        # Security headers on gateway-level errors too (see HttpApiOptionsMethod
        # note) so a client hitting execute-api directly still gets them.
        gatewayresponse.header.X-Content-Type-Options: "'nosniff'"
        gatewayresponse.header.Strict-Transport-Security: "'max-age=31536000; includeSubDomains'"
        gatewayresponse.header.X-Frame-Options: "'DENY'"
        gatewayresponse.header.Referrer-Policy: "'strict-origin-when-cross-origin'"

  HttpApiGatewayResponse5xx:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref HttpApi
      ResponseType: DEFAULT_5XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'authorization,content-type'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
        gatewayresponse.header.X-Content-Type-Options: "'nosniff'"
        gatewayresponse.header.Strict-Transport-Security: "'max-age=31536000; includeSubDomains'"
        gatewayresponse.header.X-Frame-Options: "'DENY'"
        gatewayresponse.header.Referrer-Policy: "'strict-origin-when-cross-origin'"

  # ---- Web UI S3 proxy (ServeWebUI=true / WebUIHosting=APIGateway) ----
  # Serve the React SPA from the Web UI bucket directly through this REST API,
  # on the same stage as the /op transport. Two GET routes:
  #   GET /            -> s3://<bucket>/index.html   (SPA shell)
  #   GET /{proxy+}    -> s3://<bucket>/{proxy}      (assets, favicon, etc.)
  # The explicit /op resource takes precedence over the greedy {proxy+} (API
  # Gateway matches specific path parts before catch-all), so the transport
  # route is unaffected. Both GETs are AuthorizationType NONE — the browser
  # fetches the SPA shell/assets with no JWT (auth happens later inside the app
  # against /op). Stage-level WAF (IsWafEnabled) and the PRIVATE endpoint policy
  # still apply to these routes. The app uses HashRouter, so client-side deep
  # links live in the URL fragment and need no server-side rewrite; only the
  # real files (index.html + hashed assets) must resolve.
  #
  # NOTE on base path: assets are referenced at absolute /assets/... but the API
  # serves under the stage prefix /api. The UI is therefore built with Vite
  # base=/api/ in this mode (see WEB_UI_HOSTING/VITE_UI_BASE_PATH in the root
  # CodeBuild project) so asset URLs become /api/assets/... and map through the
  # {proxy+} route to the correct S3 keys.
  WebUIRootMethod:
    Type: AWS::ApiGateway::Method
    Condition: ServeWebUICondition
    Properties:
      RestApiId: !Ref HttpApi
      ResourceId: !GetAtt HttpApi.RootResourceId
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS
        IntegrationHttpMethod: GET
        Credentials: !Ref WebUIProxyRoleArn
        Uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:s3:path/${WebUIBucketName}/index.html"
        PassthroughBehavior: WHEN_NO_MATCH
        IntegrationResponses:
          - StatusCode: "200"
            ContentHandling: CONVERT_TO_BINARY
            ResponseParameters:
              method.response.header.Content-Type: "integration.response.header.Content-Type"
              # Security headers on the SPA document itself (ServeWebUI mode has
              # no CloudFront ResponseHeadersPolicy in front, so set them here —
              # X-Frame-Options/nosniff matter MOST on the HTML document).
              method.response.header.X-Content-Type-Options: "'nosniff'"
              method.response.header.Strict-Transport-Security: "'max-age=31536000; includeSubDomains'"
              method.response.header.X-Frame-Options: "'DENY'"
              method.response.header.Referrer-Policy: "'strict-origin-when-cross-origin'"
          - StatusCode: "404"
            SelectionPattern: "4\\d{2}"
          - StatusCode: "500"
            SelectionPattern: "5\\d{2}"
      MethodResponses:
        - StatusCode: "200"
          ResponseParameters:
            method.response.header.Content-Type: true
            method.response.header.X-Content-Type-Options: true
            method.response.header.Strict-Transport-Security: true
            method.response.header.X-Frame-Options: true
            method.response.header.Referrer-Policy: true
        - StatusCode: "404"
        - StatusCode: "500"

  WebUIProxyResource:
    Type: AWS::ApiGateway::Resource
    Condition: ServeWebUICondition
    Properties:
      RestApiId: !Ref HttpApi
      ParentId: !GetAtt HttpApi.RootResourceId
      PathPart: "{proxy+}"

  WebUIProxyMethod:
    Type: AWS::ApiGateway::Method
    Condition: ServeWebUICondition
    Properties:
      RestApiId: !Ref HttpApi
      ResourceId: !Ref WebUIProxyResource
      HttpMethod: GET
      AuthorizationType: NONE
      RequestParameters:
        method.request.path.proxy: true
      Integration:
        Type: AWS
        IntegrationHttpMethod: GET
        Credentials: !Ref WebUIProxyRoleArn
        Uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:s3:path/${WebUIBucketName}/{proxy}"
        RequestParameters:
          integration.request.path.proxy: "method.request.path.proxy"
        PassthroughBehavior: WHEN_NO_MATCH
        IntegrationResponses:
          - StatusCode: "200"
            # Return the S3 object bytes verbatim. With BinaryMediaTypes: */*,
            # CONVERT_TO_BINARY makes API Gateway pass the raw payload through
            # for binary assets (images, fonts, wasm) instead of base64.
            ContentHandling: CONVERT_TO_BINARY
            ResponseParameters:
              method.response.header.Content-Type: "integration.response.header.Content-Type"
              # Security headers on served SPA assets too (ServeWebUI mode, no
              # CloudFront in front). Same static values as the root/OPTIONS methods.
              method.response.header.X-Content-Type-Options: "'nosniff'"
              method.response.header.Strict-Transport-Security: "'max-age=31536000; includeSubDomains'"
              method.response.header.X-Frame-Options: "'DENY'"
              method.response.header.Referrer-Policy: "'strict-origin-when-cross-origin'"
          # A missing S3 key surfaces as an S3 4xx (403 AccessDenied / 404
          # NoSuchKey) -> mapped to a 404 response. This is fine for the SPA:
          # the app uses HashRouter, so client-side routes live in the URL
          # fragment (/api/#/...) and are served by index.html at "/" — deep
          # links never hit the server as a distinct path, so no rewrite-to-
          # index.html fallback is needed. Only genuinely nonexistent asset
          # paths return 404, which is the correct behavior.
          - StatusCode: "404"
            SelectionPattern: "4\\d{2}"
          - StatusCode: "500"
            SelectionPattern: "5\\d{2}"
      MethodResponses:
        - StatusCode: "200"
          ResponseParameters:
            method.response.header.Content-Type: true
            method.response.header.X-Content-Type-Options: true
            method.response.header.Strict-Transport-Security: true
            method.response.header.X-Frame-Options: true
            method.response.header.Referrer-Policy: true
        - StatusCode: "404"
        - StatusCode: "500"

  # NB: an AWS::ApiGateway::Deployment only snapshots the API when the resource
  # itself is REPLACED (new logical id) — mutating a property like Description on
  # the existing resource does NOT create a new deployment, so method/CORS
  # changes would silently not reach the stage. Therefore, whenever the API's
  # methods/resources/gateway-responses change, BUMP THE LOGICAL ID SUFFIX below
  # (…CorsV2 -> …CorsV3 -> …) so CloudFormation creates a fresh snapshot and
  # repoints the stage. Update HttpApiStage.DeploymentId to match.
  #
  # Bumped CorsV2 -> WebUIV3 when the ServeWebUI S3-proxy routes were added.
  #
  # A Deployment's DependsOn CANNOT reference a resource dropped by a false
  # Condition — CloudFormation fails with "Unresolved resource dependencies
  # [WebUIRootMethod, WebUIProxyMethod]" (it does NOT silently ignore them).
  # So there are TWO condition-gated deployment resources with the same suffix:
  #   * WithWebUI  — includes the S3-proxy methods in DependsOn (ServeWebUI=true)
  #   * NoWebUI    — omits them (ServeWebUI=false / CloudFront default)
  # The stage selects whichever exists via Fn::If. Bump BOTH logical-id suffixes
  # (…WebUIV3 -> …WebUIV4) whenever methods/CORS/gateway-responses change, so a
  # fresh snapshot reaches the stage.
  # V3 -> V4: the OPTIONS MOCK integration gained ContentHandling: CONVERT_TO_TEXT
  # (CORS preflight fix). That is a method/integration change, so the deployment
  # logical id MUST be bumped to force a fresh snapshot onto the stage — mutating
  # an existing Deployment does not re-snapshot. Without the bump the stack update
  # succeeds but the stage keeps serving the pre-fix snapshot (preflight 500s).
  # V4 -> V5: security response headers (X-Content-Type-Options,
  # Strict-Transport-Security, X-Frame-Options, Referrer-Policy) were added to
  # the OPTIONS preflight, the DEFAULT_4XX/5XX gateway responses, and the Web UI
  # S3-proxy methods. Those are method/gateway-response changes, so the snapshot
  # must be re-cut or upgraded stacks keep serving the pre-fix responses (the
  # authorizer 401/403 + preflight would lack the new headers).
  HttpApiDeploymentWithWebUIV5:
    Type: AWS::ApiGateway::Deployment
    Condition: ServeWebUICondition
    DependsOn:
      - HttpApiMethod
      - HttpApiOptionsMethod
      - WebUIRootMethod
      - WebUIProxyMethod
    Properties:
      RestApiId: !Ref HttpApi
      Description: !Sub "Dispatcher API deployment for ${StackName} (CORS + Web UI proxy)"

  HttpApiDeploymentNoWebUIV5:
    Type: AWS::ApiGateway::Deployment
    Condition: DoNotServeWebUICondition
    DependsOn:
      - HttpApiMethod
      - HttpApiOptionsMethod
    Properties:
      RestApiId: !Ref HttpApi
      Description: !Sub "Dispatcher API deployment for ${StackName} (CORS)"

  # DependsOn: the stage rejects AccessLogSetting until the account-level
  # CloudWatch role is set. The stage itself cannot DependsOn ApiGatewayAccount
  # (DependsOn cannot name a resource dropped by a false Condition — see the
  # deployment NB above), so the ordering is chained through this log group,
  # which shares the condition: Stage -> (GetAtt) -> LogGroup -> Account.
  HttpApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: EnableApiAccessLogs
    DependsOn: ApiGatewayAccount
    Properties:
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn
      RetentionInDays: !Ref LogRetentionDays

  # REST API stages (unlike HTTP APIs) reject AccessLogSetting unless the
  # account-level API Gateway CloudWatch role is set ("CloudWatch Logs role ARN
  # must be set in account settings to enable logging"). AWS::ApiGateway::Account
  # is a PER-ACCOUNT PER-REGION singleton: multiple stacks that declare it
  # overwrite each other (last writer wins), which is harmless here because
  # every writer grants the same managed policy. DeletionPolicy: Retain keeps
  # stack deletion from clearing the account setting out from under other
  # stacks still using it (the role itself is retained for the same reason).
  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Condition: EnableApiAccessLogs
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PermissionsBoundary:
        !If [
          HasPermissionsBoundary,
          !Ref PermissionsBoundaryArn,
          !Ref AWS::NoValue,
        ]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub "apigateway.${AWS::URLSuffix}"
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs"

  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Condition: EnableApiAccessLogs
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRole.Arn

  # Execution logs (MethodSettings below) go to a log group whose name API
  # Gateway hardcodes: API-Gateway-Execution-Logs_<restApiId>/<stageName>.
  # Pre-declaring it is the only way to get retention + CMK encryption on it —
  # otherwise API Gateway auto-creates it with no retention and no KMS key.
  # DependsOn ApiGatewayAccount mirrors HttpApiAccessLogGroup's ordering chain.
  HttpApiExecutionLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: EnableApiAccessLogs
    DependsOn: ApiGatewayAccount
    Properties:
      LogGroupName: !Sub "API-Gateway-Execution-Logs_${HttpApi}/api"
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn
      RetentionInDays: !Ref LogRetentionDays

  HttpApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref HttpApi
      DeploymentId: !If
        - ServeWebUICondition
        - !Ref HttpApiDeploymentWithWebUIV5
        - !Ref HttpApiDeploymentNoWebUIV5
      StageName: api
      # JSON access-log format: request metadata only, never bodies. The error
      # and authorizer fields are what diagnose requests that never reach the
      # dispatcher Lambda.
      AccessLogSetting: !If
        - EnableApiAccessLogs
        - DestinationArn: !GetAtt HttpApiAccessLogGroup.Arn
          Format: >-
            {"requestId":"$context.requestId","extendedRequestId":"$context.extendedRequestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath","path":"$context.path","status":"$context.status","responseLength":"$context.responseLength","responseLatency":"$context.responseLatency","integrationStatus":"$context.integrationStatus","integrationLatency":"$context.integrationLatency","integrationError":"$context.integration.error","errorMessage":"$context.error.message","errorResponseType":"$context.error.responseType","authorizerError":"$context.authorizer.error","authorizerStatus":"$context.authorizer.status","principalId":"$context.authorizer.principalId","wafStatus":"$context.wafResponseCode","userAgent":"$context.identity.userAgent"}
        - !Ref AWS::NoValue
      # Execution logs at ERROR only: INFO-level execution logging echoes full
      # request/response payloads (customer document data) into CloudWatch,
      # which access logs never do. ERROR captures the gateway-side failures
      # access logs can't diagnose (integration mapping errors, MOCK/CORS
      # template failures). DataTraceEnabled stays false for the same
      # no-payloads reason. Logs land in HttpApiExecutionLogGroup above.
      MethodSettings: !If
        - EnableApiAccessLogs
        - - ResourcePath: "/*"
            HttpMethod: "*"
            LoggingLevel: ERROR
            DataTraceEnabled: false
            MetricsEnabled: true
        - !Ref AWS::NoValue
      # API Gateway addresses the execution log group by its hardcoded NAME, so
      # nothing above creates a CFN dependency on HttpApiExecutionLogGroup. This
      # tag's !Ref forges that edge (conditionally, matching the log group's
      # condition) so the KMS/retention-configured group exists before the stage
      # starts logging — otherwise API Gateway auto-creates an unencrypted one.
      Tags:
        - Key: ExecutionLogGroup
          Value:
            !If [EnableApiAccessLogs, !Ref HttpApiExecutionLogGroup, "disabled"]

  HttpApiDispatcherPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref HttpApiDispatcherFunction
      Principal: !Sub "apigateway.${AWS::URLSuffix}"
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/POST/op/*"

  # ---- Optional WAFv2 (REGIONAL) fronting the REST API stage ----
  # Enabled when WAFAllowedIPv4Ranges is not the allow-all default. REST API
  # stages support WAFv2 association (HTTP APIs do not).
  ApiWafIPv4Set:
    Type: AWS::WAFv2::IPSet
    Condition: IsWafEnabled
    Properties:
      Name: !Sub "${StackName}-api-allow-ipv4"
      Scope: REGIONAL
      IPAddressVersion: IPV4
      Addresses: !Ref WAFAllowedIPv4Ranges

  ApiWafWebACL:
    Type: AWS::WAFv2::WebACL
    # checkov:skip=CKV_AWS_192: "This WebACL uses DefaultAction: Block with an IP allowlist, so only explicitly allowlisted IPv4 ranges reach the API at all. The Log4Shell (CVE-2021-44228) managed rule group is defense-in-depth that is not required for this already-closed posture; the backend is Python (no Log4j2)."
    Condition: IsWafEnabled
    Properties:
      Name: !Sub "${StackName}-api-acl"
      Scope: REGIONAL
      DefaultAction:
        Block: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "${StackName}-api-acl"
      Rules:
        - Name: AllowListedIPv4
          Priority: 0
          Action:
            Allow: {}
          Statement:
            IPSetReferenceStatement:
              Arn: !GetAtt ApiWafIPv4Set.Arn
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AllowListedIPv4

  ApiWafAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Condition: IsWafEnabled
    Properties:
      ResourceArn: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/restapis/${HttpApi}/stages/${HttpApiStage}"
      WebACLArn: !GetAtt ApiWafWebACL.Arn


Outputs:
  HttpApiEndpoint:
    Description: Base URL of the REST API transport (stage 'api')
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/api"

  TestResultsResolverFunctionArn:
    Description: ARN of the Test Results Resolver Lambda function
    Value: !GetAtt TestResultsResolverFunction.Arn

  AbortTestRunsResolverFunctionArn:
    Description: ARN of the Abort Test Runs Lambda function
    Value: !GetAtt AbortTestRunsResolverFunction.Arn