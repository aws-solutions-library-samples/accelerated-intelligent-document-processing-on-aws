AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: AWS GenAI IDP Accelerator - API Resolvers Nested Stack - Lambda Functions and HTTP API dispatcher

Parameters:
  # Background worker ARNs (for resolver invocations)
  AgentChatProcessorFunctionArn:
    Type: String
    Description: ARN of the AgentChatProcessorFunction from main template

  ChatWithDocumentProcessorFunctionArn:
    Type: String
    Description: ARN of the ChatWithDocumentProcessorFunction from main template (long-running chat Lambda invoked async by the lightweight mutation resolver)
  
  AgentProcessorFunctionArn:
    Type: String
    Description: ARN of the AgentProcessorFunction from main template
  
  TestExecutionAggregationFunctionArn:
    Type: String
    Default: ""
    Description: ARN of the TestExecutionAggregationFunction from pattern stack (optional)

  MLflowLoggerFunctionArn:
    Type: String
    Default: ""
    Description: ARN of the MLflowLoggerFunction from pattern stack (optional)
  
  # DynamoDB Tables
  TrackingTableName:
    Type: String
  
  ConfigurationTableName:
    Type: String
  
  AgentTableName:
    Type: String
  
  ChatMessagesTableName:
    Type: String
  
  ChatSessionsTableName:
    Type: String
  
  IdHelperChatMemoryTableName:
    Type: String
  
  DiscoveryTrackingTableName:
    Type: String

  UsersTableName:
    Type: String
    Default: ""
    Description: DynamoDB table name for user management (config-version scoping)

  UsersTableArn:
    Type: String
    Default: ""
    Description: DynamoDB table ARN for user management (config-version scoping)
  
  # S3 Buckets
  InputBucketName:
    Type: String
  
  OutputBucketName:
    Type: String
  
  ConfigurationBucketName:
    Type: String
  
  TestSetBucketName:
    Type: String
  
  EvaluationBaselineBucketName:
    Type: String
  
  ReportingBucketName:
    Type: String
  
  WorkingBucketName:
    Type: String
  
  DiscoveryBucketName:
    Type: String

  MultiDocDiscoveryStateMachineArn:
    Type: String

  # SQS Queues
  DocumentQueueUrl:
    Type: String
  
  DiscoveryQueueUrl:
    Type: String
  
  TestFileCopyQueueUrl:
    Type: String
  
  TestSetFileCopyQueueUrl:
    Type: String
  
  TestResultCacheUpdateQueueUrl:
    Type: String
  
  TestResultCacheUpdateQueueArn:
    Type: String
    Description: ARN of the TestResultCacheUpdateQueue for Lambda event source
  
  # SQS Queue Names (for SQSSendMessagePolicy resources)
  DocumentQueueName:
    Type: String
    Description: Name of the document processing SQS queue
  
  DiscoveryQueueName:
    Type: String
    Description: Name of the discovery SQS queue
  
  TestFileCopyQueueName:
    Type: String
    Description: Name of the test file copy SQS queue
  
  TestSetFileCopyQueueName:
    Type: String
    Description: Name of the test set file copy SQS queue
  
  TestResultCacheUpdateQueueName:
    Type: String
    Description: Name of the test result cache update SQS queue

  # Other resources
  CustomerManagedEncryptionKeyArn:
    Type: String
  
  ReportingDatabaseName:
    Type: String
  
  LookupFunctionName:
    Type: String
  
  SaveReportingFunctionName:
    Type: String
  
  # Runtime settings (resolved from Parameter Store)
  SettingsParameterName:
    Type: String
    Description: Name of SSM parameter containing runtime settings
  
  # Configuration
  StackName:
    Type: String
  
  LogRetentionDays:
    Type: Number
  
  LogLevel:
    Type: String
  
  DataRetentionInDays:
    Type: Number
  
  PermissionsBoundaryArn:
    Type: String
  
  ExecutionTimeThresholdMs:
    Type: Number
  
  # Conditional flags and parameters
  HasGuardrailConfig:
    Type: String
    AllowedValues: ["true", "false"]
  
  BedrockGuardrailId:
    Type: String
  
  BedrockGuardrailVersion:
    Type: String
   
  KnowledgeBaseModelId:
    Type: String
    Description: Model ID for Knowledge Base queries
  
  ShouldCreateEvaluationBaselineBucket:
    Type: String
    AllowedValues: ["true", "false"]
  
  ShouldCreateReportingBucket:
    Type: String
    AllowedValues: ["true", "false"]
  
  # Lambda Layers from main template
  IDPCommonBaseLayerArn:
    Type: String
    Description: ARN of IDP Common Base Layer

  IDPCommonAgentsLayerArn:
    Type: String
    Description: ARN of IDP Common Agents Layer

  # Private-network config — passed from main template. When true, the REST API
  # is PRIVATE (VPC-only via ApiGatewayVpcEndpointId) and resolver Lambdas run in
  # the VPC.
  UsePrivateApi:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Set to "true" when ApiGatewayVisibility=PRIVATE — private REST API + VPC-resident Lambdas

  ApiGatewayVpcEndpointId:
    Type: String
    Default: ""
    Description: VPC interface endpoint id for execute-api (required when UsePrivateApi=true)

  WAFAllowedIPv4Ranges:
    Type: CommaDelimitedList
    Default: "0.0.0.0/0"
    Description: >-
      IPv4 CIDRs allowed to call the REST API. The allow-all default
      (0.0.0.0/0) disables WAF; any other value attaches a REGIONAL WAFv2
      WebACL that blocks non-listed IPs.

  LambdaSubnetIds:
    Type: CommaDelimitedList
    Default: ""
    Description: Subnet IDs for Lambda VpcConfig (required when UsePrivateApi=true)

  LambdaSecurityGroupId:
    Type: String
    Default: ""
    Description: Security group ID for Lambda VpcConfig (required when UsePrivateApi=true)

  # Circuit Breaker (feature-flagged — may be empty when disabled)
  ConcurrencyTableName:
    Type: String
    Default: ""
    Description: DynamoDB ConcurrencyTable — circuit breaker state lives here under counter_id=circuit_breaker
  CircuitBreakerManagerFunctionArn:
    Type: String
    Default: ""
    Description: ARN of the CircuitBreakerManagerFunction from main template (empty if disabled)
  CircuitBreakerEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Whether the circuit breaker feature is enabled

  S3EndpointUrl:
    Type: String
    Default: ""
    Description: >
      VPC-aware S3 endpoint URL injected by parent stack when private mode is
      active (e.g. https://bucket.<vpce-id>.s3.<region>.vpce.amazonaws.com).
      When set, presigner Lambdas use this endpoint with virtual-host
      addressing so browser uploads target the VPC interface endpoint.
      Empty in public mode.

  # ------------------------------------------------------------------ #
  # API Gateway HTTP API transport. The parent stack creates the HTTP API
  # + JWT authorizer + dispatcher Lambda here, reusing the resolver Lambdas.
  # ------------------------------------------------------------------ #
  UserPoolId:
    Type: String
    Default: ""
    Description: Cognito User Pool id — JWT authorizer issuer for the HTTP API.
  # ------------------------------------------------------------------ #
  # Web UI hosting via API Gateway S3 proxy (WebUIHosting=APIGateway). When
  # ServeWebUI=true the REST API also serves the React SPA directly from the
  # Web UI S3 bucket via S3 proxy integrations (GET / and GET /{proxy+}). This
  # co-locates the UI on the SAME REST API + stage as the /op transport, so it
  # inherits the private-endpoint (ApiGatewayVisibility=PRIVATE) and stage-level
  # WAFv2 configuration for free. Empty/false for CloudFront hosting.
  # ------------------------------------------------------------------ #
  ServeWebUI:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Set to "true" when WebUIHosting=APIGateway — adds S3-proxy routes that
      serve the React SPA from the Web UI bucket on this REST API's stage.
  WebUIBucketName:
    Type: String
    Default: ""
    Description: Name of the Web UI S3 bucket (required when ServeWebUI=true).
  WebUIProxyRoleArn:
    Type: String
    Default: ""
    Description: >-
      ARN of the IAM role API Gateway assumes to read objects from the Web UI
      bucket for the S3 proxy integration (required when ServeWebUI=true).

  # Main-template resolver function ARNs the dispatcher must invoke (the rest
  # are defined in this nested stack and referenced via GetAtt).
  CompleteSectionReviewFunctionArn:
    Type: String
    Default: ""
    Description: ARN of CompleteSectionReviewFunction (HITL) from main template.
  UserManagementFunctionArn:
    Type: String
    Default: ""
    Description: ARN of UserManagementFunction from main template.
  FinetuningJobsResolverFunctionArn:
    Type: String
    Default: ""
    Description: ARN of FinetuningJobsResolverFunction from main template.
  CalculateCapacityResolverFunctionArn:
    Type: String
    Default: ""
    Description: ARN of CalculateCapacityResolverFunction from main template.
  VersionCheckResolverFunctionArn:
    Type: String
    Default: ""
    Description: ARN of VersionCheckResolverFunction from main template.
  # Feature-platform UI-field resolver ARNs (from FeaturePlatformStack via the
  # main template). Empty when EnableFeaturePlatform=false — those 6 fields are
  # then absent from the map (dispatcher returns 404 if invoked).
  ListCatalogFeaturesFunctionArn:
    Type: String
    Default: ""
    Description: ARN of the listCatalogFeatures resolver (feature platform).
  ListInstalledFeaturesFunctionArn:
    Type: String
    Default: ""
    Description: ARN of the listInstalledFeatures resolver (feature platform).
  CheckFeatureEntitlementFunctionArn:
    Type: String
    Default: ""
    Description: ARN of the checkFeatureEntitlement resolver (feature platform).
  GetFeatureLaunchUrlFunctionArn:
    Type: String
    Default: ""
    Description: ARN of the getFeatureLaunchUrl resolver (feature platform).
  SubscribeFeatureFunctionArn:
    Type: String
    Default: ""
    Description: ARN of the subscribeFeature resolver (feature platform).
  UnsubscribeFeatureFunctionArn:
    Type: String
    Default: ""
    Description: ARN of the unsubscribeFeature resolver (feature platform).

Metadata:
  cfn-lint:
    config:
      ignore_checks:
        - W1030  # ARN pattern matching when Ref resolves to empty string (UsersTableArn default)
        - W1031  # ARN pattern matching when Fn::Sub resolves to empty string (UsersTableArn default)

Conditions:
  HasS3EndpointUrl: !Not [!Equals [!Ref S3EndpointUrl, ""]]
  HasPermissionsBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, ""]]
  HasGuardrail: !Equals [!Ref HasGuardrailConfig, "true"]
  ShouldCreateEvaluationBaselineBucket: !Equals [!Ref ShouldCreateEvaluationBaselineBucket, "true"]
  ShouldCreateReportingBucket: !Equals [!Ref ShouldCreateReportingBucket, "true"]
  HasTestExecutionAggregationFunction: !Not [!Equals [!Ref TestExecutionAggregationFunctionArn, ""]]
  IsPrivateApi: !Equals [!Ref UsePrivateApi, "true"]
  # WAF is enabled unless the IP allow-list is the allow-all default. CFN can't
  # compare a CommaDelimitedList directly, so compare its Fn::Join'd form.
  IsWafEnabled: !Not [!Equals [!Join [",", !Ref WAFAllowedIPv4Ranges], "0.0.0.0/0"]]
  HasMLflowLoggerFunction: !Not [!Equals [!Ref MLflowLoggerFunctionArn, ""]]
  CircuitBreakerEnabledCondition: !Equals [!Ref CircuitBreakerEnabled, "true"]
  # True when this REST API should also serve the Web UI SPA via S3 proxy
  # (WebUIHosting=APIGateway).
  ServeWebUICondition: !Equals [!Ref ServeWebUI, "true"]
  # Inverse of ServeWebUICondition — used to gate the no-Web-UI API deployment
  # so the stage always references a deployment that actually exists.
  DoNotServeWebUICondition: !Not [!Equals [!Ref ServeWebUI, "true"]]
  # API Gateway access logs are enabled at INFO and DEBUG. Access logs (unlike
  # execution logs) never contain request/response bodies, and capture requests
  # that fail before reaching the dispatcher Lambda (authorizer 401/403s, WAF
  # blocks, S3-proxy Web UI routes).
  EnableApiAccessLogs:
    !Or [!Equals [!Ref LogLevel, "DEBUG"], !Equals [!Ref LogLevel, "INFO"]]

Resources:
  AbortWorkflowResolverFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn
      RetentionInDays: !Ref LogRetentionDays


  ##########################################################################
  # AbortWorkflowResolverFunction
  ##########################################################################
  AbortWorkflowResolverFunction:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function does not require VPC access as it only interacts with AWS services via APIs"
          - id: W92
            reason: "Function does not require reserved concurrency as it scales based on demand"
          - id: W12
            reason: "Lambda requires CloudWatch logs permissions"
    # checkov:skip=CKV_AWS_116: "DLQ not required for AppSync resolver function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only configuration values like feature flags and non-sensitive settings"
    Properties:
      PermissionsBoundary:
        !If [
          HasPermissionsBoundary,
          !Ref PermissionsBoundaryArn,
          !Ref AWS::NoValue,
        ]
      Handler: index.handler
      Runtime: python3.12
      CodeUri: ./src/lambda/abort_workflow_resolver
      Description: Lambda function to abort document workflows via GraphQL API
      MemorySize: 512
      Timeout: 60
      VpcConfig: !If
        - IsPrivateApi
        - SubnetIds: !Ref LambdaSubnetIds
          SecurityGroupIds:
            - !Ref LambdaSecurityGroupId
        - !Ref AWS::NoValue

      Layers:
        - !Ref IDPCommonBaseLayerArn
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          SETTINGS_PARAMETER: !Ref SettingsParameterName
          # create_document_service() (imported at module load) reads
          # TRACKING_TABLE; without it every abortWorkflow call fails at import
          # with a 400 "DynamoDB table name must be provided". Masked under
          # AppSync (VTL). See ReprocessDocumentResolverFunction.
          TRACKING_TABLE: !Ref TrackingTableName
      LoggingConfig:
        LogGroup: !Ref AbortWorkflowResolverFunctionLogGroup
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TrackingTableName
        - Statement:
            - Effect: Allow
              Action:
                - states:StopExecution
              Resource:
                - !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:${StackName}-*:*"
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${SettingsParameterName}"
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:ReEncrypt*
                - kms:GenerateDataKey*
                - kms:DescribeKey
              Resource: !Ref CustomerManagedEncryptionKeyArn
  AgentChatResolverLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn
      RetentionInDays: !Ref LogRetentionDays

  # Lambda function for agent chat processor

  ##########################################################################
  # AgentChatResolverFunction
  ##########################################################################
  AgentChatResolverFunction:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function does not require VPC access as it only interacts with AWS services via APIs"
          - id: W92
            reason: "Function does not require reserved concurrency as it scales based on demand"
          - id: W58
            reason: "DLQ not required for AppSeync Resolver function"
          - id: W11
            reason: "Role requires * resource access for Marketplace, CloudWatch Metrics and Logs"
    # checkov:skip=CKV_AWS_116: "DLQ not required for analytics processor as it's invoked asynchronously by request handler with error handling and job status tracking in DynamoDB"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only configuration values like feature flags and non-sensitive settings"
    Properties:
      PermissionsBoundary:
        !If [
          HasPermissionsBoundary,
          !Ref PermissionsBoundaryArn,
          !Ref AWS::NoValue,
        ]
      CodeUri: ./src/lambda/agent_chat_resolver/
      Handler: index.handler
      Runtime: python3.12
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          CHAT_MESSAGES_TABLE: !Ref ChatMessagesTableName
          AGENT_CHAT_PROCESSOR_FUNCTION: !Ref AgentChatProcessorFunctionArn
          DATA_RETENTION_DAYS: !Ref DataRetentionInDays
          CHAT_SESSIONS_TABLE: !Ref ChatSessionsTableName
      LoggingConfig:
        LogGroup: !Ref AgentChatResolverLogGroup
      Policies:
        - Statement:
            Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !Ref AgentChatProcessorFunctionArn
        - DynamoDBCrudPolicy:
            TableName: !Ref ChatMessagesTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref ChatSessionsTableName
        - LambdaInvokePolicy:
            FunctionName: !Ref AgentChatProcessorFunctionArn
        - Statement:
            Effect: Allow
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: !Ref CustomerManagedEncryptionKeyArn
  AgentRequestHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-AgentRequestHandler"
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn
  

  ##########################################################################
  # AgentRequestHandlerFunction
  ##########################################################################
  AgentRequestHandlerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function does not require VPC access as it only interacts with AWS services via APIs"
          - id: W92
            reason: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required for analytics request handler as it's invoked synchronously via AppSync and errors are handled by the caller"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only configuration values like feature flags and non-sensitive settings"
    Properties:
      PermissionsBoundary:
        !If [
          HasPermissionsBoundary,
          !Ref PermissionsBoundaryArn,
          !Ref AWS::NoValue,
        ]
      CodeUri: ./src/lambda/agent_request_handler/
      Handler: index.handler
      Runtime: python3.12
      Timeout: 30
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          AGENT_TABLE: !Ref AgentTableName
          AGENT_PROCESSOR_FUNCTION: !Ref AgentProcessorFunctionArn
          DATA_RETENTION_DAYS: !Ref DataRetentionInDays
      LoggingConfig:
        LogGroup: !Ref AgentRequestHandlerLogGroup
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AgentTableName
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Ref AgentProcessorFunctionArn
        - Statement:
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:ReEncrypt*
                - kms:GenerateDataKey*
                - kms:DescribeKey
              Resource: !Ref CustomerManagedEncryptionKeyArn
  SendChatDocumentMessageResolverFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn
      RetentionInDays: !Ref LogRetentionDays

  SendChatDocumentMessageResolverFunction:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function does not require VPC access as it only interacts with AWS services via APIs"
          - id: W92
            reason: "Function does not require reserved concurrency as it scales based on demand"
          - id: W12
            reason: "Lambda requires CloudWatch logs permissions"
    # checkov:skip=CKV_AWS_116: "DLQ not required for AppSync resolver function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data"
    Properties:
      PermissionsBoundary:
        !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      Handler: index.handler
      Runtime: python3.12
      CodeUri: ./src/lambda/send_chat_document_message_resolver
      Description: Lightweight AppSync resolver for Chat-with-Document mutation
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          CHAT_DOCUMENT_SESSIONS_TABLE: !Ref ChatDocumentSessionsTable
          CHAT_DOCUMENT_PROCESSOR_FUNCTION_ARN: !Ref ChatWithDocumentProcessorFunctionArn
          DATA_RETENTION_DAYS: !Ref DataRetentionInDays
      LoggingConfig:
        LogGroup: !Ref SendChatDocumentMessageResolverFunctionLogGroup
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ChatDocumentSessionsTable
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Ref ChatWithDocumentProcessorFunctionArn
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:ReEncrypt*
                - kms:GenerateDataKey*
                - kms:DescribeKey
              Resource: !Ref CustomerManagedEncryptionKeyArn

  ##########################################################################
  # ChatDocumentSessionsTable
  # Tracks session ownership for Chat-with-Document so one user cannot
  # subscribe to or continue another user's chat session. Short TTL keeps
  # storage minimal since the UI discards history on leave anyway.
  ##########################################################################
  ChatDocumentSessionsTable:
    Type: AWS::DynamoDB::Table
    # cdk-nag AwsSolutions-DDB3: PITR not required — this table only stores
    # ephemeral session-ownership records (keyed by sessionId, short TTL);
    # losing the table has no business impact beyond forcing users to start
    # a new chat session.
    # checkov:skip=CKV_AWS_119: "CMK encryption enabled via SSESpecification (KMSMasterKeyId) below"
    # checkov:skip=CKV_AWS_28: "PITR intentionally disabled — ephemeral per-session ownership metadata with short TTL (see justification comment above)"
    Properties:
      AttributeDefinitions:
        - AttributeName: sessionId
          AttributeType: S
      KeySchema:
        - AttributeName: sessionId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ExpiresAfter
        Enabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref CustomerManagedEncryptionKeyArn
  ConfigurationResolverFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn
      RetentionInDays: !Ref LogRetentionDays


  ##########################################################################
  # ConfigurationResolverFunction
  ##########################################################################
  ConfigurationResolverFunction:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function does not require VPC access as it only interacts with AWS services via APIs"
          - id: W92
            reason: "Function does not require reserved concurrency as it scales based on demand"
          - id: W12
            reason: "Lambda requires CloudWatch logs permissions"
    # checkov:skip=CKV_AWS_116: "DLQ not required for AppSync resolver function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only configuration values like feature flags and non-sensitive settings"
    Properties:
      PermissionsBoundary:
        !If [
          HasPermissionsBoundary,
          !Ref PermissionsBoundaryArn,
          !Ref AWS::NoValue,
        ]
      Handler: index.handler
      Runtime: python3.12
      CodeUri: ./src/lambda/configuration_resolver
      Description: Lambda function to manage configuration through GraphQL API
      MemorySize: 512
      Timeout: 120

      Layers:
        - !Ref IDPCommonBaseLayerArn
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          CONFIGURATION_TABLE_NAME: !Ref ConfigurationTableName
          STACK_NAME: !Ref StackName
          CONFIGURATION_BUCKET: !Ref ConfigurationBucketName
          USERS_TABLE_NAME: !Ref UsersTableName
      LoggingConfig:
        LogGroup: !Ref ConfigurationResolverFunctionLogGroup
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConfigurationTableName
        - S3ReadPolicy:
            BucketName: !Ref ConfigurationBucketName
        - Statement:
            # Write/prune configuration-profile revision bodies. Scoped to the
            # revisions prefix: the resolver has no reason to write anywhere
            # else in the configuration bucket.
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:DeleteObject
              Resource:
                - !Sub "arn:${AWS::Partition}:s3:::${ConfigurationBucketName}/config_revisions/*"
        - Statement:
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:ReEncrypt*
                - kms:GenerateDataKey*
                - kms:DescribeKey
              Resource: !Ref CustomerManagedEncryptionKeyArn
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:PutParameter
              Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/FlowDefinitionArn"
            # BDA permissions for project lifecycle (delete linked BDA project when version is deleted)
            - Effect: Allow
              Action:
                - bedrock:DeleteDataAutomationProject
                - bedrock:GetDataAutomationProject
                - bedrock:DeleteBlueprint
                - bedrock:ListBlueprints
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:data-automation-project/*"
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:blueprint/*"
            # Bedrock InvokeModel for Z3 RuleJSON generation (translate natural language rules to SMT-LIB)
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
                - !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*"
                - !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:application-inference-profile/*"
        # Read-only access on UsersTable + EmailIndex so the resolver can look up
        # the caller's allowedConfigVersions and enforce config-version scope.
        # Without this, the scope query fails with AccessDenied, is caught, and
        # the caller silently defaults to UNRESTRICTED (scope bypass).
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
              Resource:
                - !Ref UsersTableArn
                - !Sub "${UsersTableArn}/index/*"
