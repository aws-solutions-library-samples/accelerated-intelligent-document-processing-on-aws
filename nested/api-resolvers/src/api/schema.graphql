type FinetuningJob @aws_cognito_user_pools @aws_iam {
  jobId: ID!
  jobName: String!
  testSetId: String!
  testSetName: String
  baseModelId: String!
  customModelName: String
  customModelArn: String
  customModelDeploymentArn: String
  status: FinetuningJobStatus!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime
  completedAt: AWSDateTime
  errorMessage: String
  trainingMetrics: AWSJSON
  hyperparameters: AWSJSON
  trainingDataConfig: AWSJSON
  validationDataConfig: AWSJSON
  outputDataConfig: AWSJSON
  deploymentId: String
  deploymentStatus: String
  deploymentEndpoint: String
  provisionedModelArn: String
}

enum FinetuningJobStatus {
  PENDING
  VALIDATING
  GENERATING_DATA
  TRAINING
  DEPLOYING
  COMPLETED
  FAILED
  CANCELLED
  STOPPING
  STOPPED
}

type TrainingMetrics @aws_cognito_user_pools @aws_iam {
  trainingLoss: Float
  validationLoss: Float
}

type TestSetValidationResult @aws_cognito_user_pools @aws_iam {
  isValid: Boolean!
  documentCount: Int!
  classCount: Int!
  classDistribution: AWSJSON
  trainCount: Int!
  validationCount: Int!
  warnings: [String!]
  errors: [String!]
}

type FinetuningJobConnection @aws_cognito_user_pools @aws_iam {
  items: [FinetuningJob]
  nextToken: String
}

input CreateFinetuningJobInput {
  testSetId: ID!
  baseModel: String!
  jobName: String!
  trainSplit: Float
}

# Available Models Types
type BaseModelInfo @aws_cognito_user_pools @aws_iam {
  id: String!
  name: String!
  provider: String!
}

type CustomModelInfo @aws_cognito_user_pools @aws_iam {
  id: String!
  name: String!
  baseModel: String!
  status: String!
}

type AvailableModelsResult @aws_cognito_user_pools @aws_iam {
  baseModels: [BaseModelInfo!]!
  customModels: [CustomModelInfo!]!
}

# =============================================================================
# === Feature Platform (optional) — BEGIN ====================================
# Added by prototype/feature-platform/main-stack-extensions/
# Guarded in CFN by the `EnableFeaturePlatform` parameter / `IsFeaturePlatformEnabled`
# condition. The block below can be lifted out cleanly by removing everything
# between BEGIN/END markers if the feature platform is ever removed.
# =============================================================================

"""A feature installed in this IDP stack via AWS Marketplace (or the simulator).

Authorized for BOTH Cognito user pool callers (the web UI reading
`listInstalledFeatures`) AND IAM callers (the ui-deployer Lambda in each
feature stack, which invokes the `registerFeature` mutation with SigV4
signing and then reads the returned `InstalledFeature` fields). Without
`@aws_iam`, the feature stack's `RegisterFeatureResource` custom resource
fails at CREATE time with:

    AppSync errors: Not Authorized to access featureId on type InstalledFeature

because AppSync's default auth mode (Cognito) denies field reads to the
IAM-signed caller even though the mutation itself is tagged `@aws_iam`.
"""
type InstalledFeature @aws_iam @aws_cognito_user_pools {
  featureId: String!
  displayName: String!
  installedVersion: String!
  latestVersion: String
  updateAvailable: Boolean!
  stackName: String!
  stackRegion: String!
  stackId: String
  uiBundlePath: String!
  featureApiEndpoint: String
  generationQueueArn: String
  iconUrl: String
  installedAt: AWSDateTime!
  installedBy: String
}

"""A feature published to the feature bucket (available in the catalog), whether
or not it is installed in this IDP stack. Drives the "Subscribe" CTA in the UI
for features that haven't been installed yet."""
type CatalogFeature @aws_cognito_user_pools {
  featureId: String!
  displayName: String!
  latestVersion: String!
  iconUrl: String
  # Short human-readable description shown in the UI (nav hover tooltip and the
  # not-yet-installed feature page). Sourced from the feature's manifest.
  description: String
  # "Learn more" doc link. For OSS features this is a docs-site slug (e.g.
  # "extensions/sample-document-status") the UI resolves against the published docs
  # site; may also be an absolute URL. Empty for marketplace features (the UI
  # falls back to marketplaceListingUrl).
  docsUrl: String
  # Whether the feature gets its own Extensions side-nav entry before it's
  # installed (installed features always appear). False for reference samples,
  # which are discoverable via the Browse catalog page only. Defaults to true
  # when absent.
  showInNav: Boolean
  # "oss" (open-source bundled feature, installable directly) or
  # "marketplace" (closed-source extension requiring an AWS Marketplace
  # subscription). Defaults to "oss" when absent.
  source: String
  # Marketplace-only: the AWS Marketplace product code GetEntitlements is
  # queried against, and the public listing page the Subscribe CTA links to.
  # Null/empty for OSS features.
  productCode: String
  marketplaceListingUrl: String
  # OSS-only: the artifacts bucket + key prefix where this feature's
  # template/ui-bundle were published (under sample-features/). The host builds
  # the Launch Stack URL from these. Null/empty for marketplace features (which
  # resolve a per-region sellerBucket from the catalog instead).
  artifactBucket: String
  artifactPrefix: String
  # Whether this feature can be installed in the host stack's own region.
  # Marketplace extensions are region-scoped because `sam package` bakes an
  # absolute, region-specific s3:// CodeUri into the published template, and a
  # Lambda's code bucket must be in the function's region. False means the UI
  # should explain "not available in <region>" rather than offer a Subscribe
  # button that dead-ends. Always true for OSS features.
  availableInRegion: Boolean
  # The regions this feature publishes artifacts to. Empty for OSS features
  # (not region-scoped — they ship with the host). Used to tell the admin where
  # the extension IS available when it isn't available here.
  availableRegions: [String]
}

"""Subscription / entitlement state for a feature."""
type FeatureEntitlement {
  featureId: String!
  state: FeatureEntitlementState!
  expiresAt: AWSDateTime
  customerIdentifier: String
  productCode: String
  # How the host arrived at the verdict — NOT the catalog's oss|marketplace.
  # "marketplace-live" | "simulated" | "advisory" | "auto" | "oss" | "none".
  # Only "marketplace-live" represents a real subscription check.
  source: String!
  # Which AUTHORITY the host checked this extension against, per-extension:
  # "none" | "simulated" | "marketplace-live". Answers "who did you ask?", where
  # `source` answers "what did they say, and can you trust it?".
  licenseMode: String
  # What the INSTALLED extension declares it enforces (propagated through
  # registerFeature at install). Null before install, or for an extension
  # installed before the field existed.
  declaredLicenseMode: String
  # What the HOST catalog declares it should check. Null for a catalog entry
  # published before the field existed.
  catalogLicenseMode: String
  # True when the two disagree — e.g. the catalog says `simulated` but the
  # extension enforces `marketplace-live`, so a simulator-backed "subscription
  # active" would be one the extension ignores. The host explains it rather than
  # blocking: the extension's own gate is already the answer.
  licenseModeMismatch: Boolean
  # Populated by subscribeFeature — the AWS Marketplace (or simulator) URL the
  # UI must redirect the admin to in order to accept terms and complete the
  # subscription. Null on all other resolvers.
  marketplaceUrl: String
}

enum FeatureEntitlementState {
  NONE
  ACTIVE
  EXPIRED
}

"""CloudFormation Console quick-create URL + metadata for installing/updating a feature."""
type FeatureLaunchUrl {
  featureId: String!
  version: String!
  launchUrl: String!          # https://console.aws.amazon.com/cloudformation/home?region=X#/stacks/quickcreate?...
  templateUrl: String!        # S3 https URL (or simulator URL) of the feature template
  stackName: String!          # Suggested stackName (e.g. idp-feature-docs-by-status)
  parameters: AWSJSON!        # Prefilled parameter values (JSON-encoded map)
}

"""Input passed by the feature stack's RegisterFeature custom resource."""
input RegisterFeatureInput {
  featureId: String!
  displayName: String!
  installedVersion: String!
  stackName: String!
  stackId: String!
  stackRegion: String!
  uiBundlePath: String!
  featureApiEndpoint: String
  generationQueueArn: String
  iconUrl: String
  installedBy: String
  productCode: String
  marketplaceListingUrl: String
  # Which authority the extension itself enforces against ("none" | "simulated" |
  # "marketplace-live"), baked from its manifest at publish time. Persisted on the
  # install row so the host can check the authority the extension actually
  # honours, and report a mismatch when its catalog disagrees.
  licenseMode: String
}

"""One pipeline hook registration the host's Step Functions workflow
dispatches to at the named pipeline point."""
input PipelineHookInput {
  point: String!     # preprocessing | postOcr | postClassification | postExtraction | postRuleValidation | postSummarization | postprocessing
                     # (preprocessing and postprocessing are single-hook points: one feature owns each)
  arn: String!       # Lambda ARN to invoke
  order: Int         # ordering within hooks at the same point (lower = earlier). Default 100.
  onError: String    # 'continue' | 'fail' | 'skip-remaining'. Default 'continue'.
}

"""Input for registerFeatureHooks. Replaces the prior hook set for this
feature in its entirety (idempotent)."""
input RegisterFeatureHooksInput {
  featureId: String!
  hooks: [PipelineHookInput!]!
}

"""Snapshot returned by registerFeatureHooks."""
type FeatureHooksRegistration @aws_iam {
  featureId: String!
  hookCount: Int!
  registeredAt: AWSDateTime!
}

"""Input for applyFeatureConfigPreset. `config` is the parsed preset
document (JSON-encoded); metadata fields (IsActive, Managed, …) are
stripped server-side."""
input ApplyFeatureConfigPresetInput {
  featureId: String!
  version: String!       # feature version, e.g. "0.1.0" → config version "<featureId>-v0.1.0"
  config: AWSJSON!
  description: String
}

"""Receipt returned by applyFeatureConfigPreset."""
type FeatureConfigPresetResult @aws_iam {
  featureId: String!
  configVersionName: String!   # e.g. "claims-review-v0.1.0" — what the admin sees in the Configuration UI
  appliedAt: AWSDateTime!
}

# NOTE: The feature-platform Query/Mutation fields are inlined into the main
# `type Query` / `type Mutation` declarations earlier in this file (search for
# "Feature Platform (optional) — queries" and "Feature Platform (optional) —
# mutations"). `extend type` blocks on the same schema file cause AppSync to
# reject the schema silently and fall back to the previously-deployed version,
# which is why listCatalogFeatures / subscribeFeature used to return
# "Field 'X' in type 'Query/Mutation' is undefined" even though the fields
# appeared in this file.
# =============================================================================
# === Feature Platform (optional) — END ======================================
# =============================================================================

schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}
