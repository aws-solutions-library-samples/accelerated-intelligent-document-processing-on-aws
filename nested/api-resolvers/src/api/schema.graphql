type Section @aws_cognito_user_pools @aws_iam {
  Id: String
  PageIds: [Int]
  Class: String
  OutputJSONUri: String
  # Confidence in this section's CLASS (0-1), aggregated from its pages as the
  # minimum. Null means NOT SCORED — the classifier produced no confidence for
  # at least one page, which is the default until the classification prompt asks
  # for one. Unrelated to ConfidenceThresholdAlerts below, which are per-field.
  Confidence: Float
  ConfidenceThresholdAlerts: [ConfidenceThresholdAlert]
  # Structured self-healing / quality issues detected for this section
  # (assessment incomplete, recovered-with-retries, geometry incomplete, …).
  # Drives the section Status icon + hover details in the UI.
  ProcessingIssues: [ProcessingIssue]
  # True when the class this section was classified as is marked with
  # x-aws-idp-exclude-from-processing: true (e.g., static instruction pages).
  # The UI uses this to render a "Skipped" badge and suppress empty
  # extraction/summary panels.
  Excluded: Boolean
  # Optional short category for why the section is excluded (e.g.,
  # "instructions", "legal", "cover-page"). Used for the UI badge text.
  ExclusionReason: String
  # How many separate documents (instances) of this section's Class extraction
  # found here. Absent/0 = undetermined, 1 = normal, >1 = the section spans
  # several distinct documents that classification did not split apart. The UI
  # surfaces >1 so a multi-document section is visible at a glance.
  InstanceCount: Int
}

