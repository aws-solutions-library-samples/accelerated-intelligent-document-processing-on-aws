type TestRun @aws_cognito_user_pools @aws_iam {
  testRunId: String!
  testSetId: String
  testSetName: String
  status: String!
  filesCount: Int!
  completedFiles: Int
  failedFiles: Int
  overallAccuracy: Float
  weightedOverallScores: AWSJSON
  # Count of documents in this run whose sections all have no extractable
  # schema (auto-detected no-op) — those docs are excluded from
  # ``weightedOverallScores`` and from the histogram / lowest-scores UI.
  # Surfaced so the UI can show "N excluded" next to the histogram instead
  # of leaving the drop from filesCount to len(weightedOverallScores)
  # unexplained.
  excludedDocumentCount: Int
  averageConfidence: Float
  confidenceMetrics: AWSJSON
  accuracyBreakdown: AWSJSON
  confusionMatrix: AWSJSON
  fieldMetrics: AWSJSON
  splitClassificationMetrics: AWSJSON
  gradedPacketMetrics: AWSJSON
  # Per-section classification mismatches behind the percentages in
  # splitClassificationMetrics: which documents were misclassified and as what.
  # ``{errors: [{doc_key, section_id, kind, expected_class, predicted_class,
  # expected_pages, predicted_pages}], total, documents_affected, truncated}``
  # where kind is "class" | "unmatched" | "order". Capped (see
  # MAX_CLASSIFICATION_ERRORS) because the whole run result is one DynamoDB
  # attribute; ``total`` is the uncapped count so the UI can say "200 of 340".
  # Empty on the Athena fallback path, which aggregates percentages only.
  classificationErrors: AWSJSON
  totalCost: Float
  costBreakdown: AWSJSON
  createdAt: AWSDateTime
  completedAt: AWSDateTime
  context: String
  configVersion: String
  # The configuration profile revision this run scored against, alongside the
  # test-set version above: a metric delta between two runs is attributable to
  # the configuration only when both are known.
  configRevision: Int
  # Pinned version scored against, or null when the run scored the set's current
  # labels. In that case testSetDraftVersion names the version those labels were
  # being annotated toward, if a transition was open — so a result can say
  # "current labels, draft toward v2" rather than nothing.
  testSetVersion: Int
  testSetDraftVersion: Int
  config: AWSJSON
  # True for a run that PRODUCES ground truth rather than being scored against it.
  # Such a run has no baseline by construction, so evaluation never runs and there
  # are no accuracy metrics to wait for — ever. Exposed so the UI can say that,
  # rather than warning that metrics "are not available" as though something had
  # gone wrong. The server owns the rule (see _is_draft_labeling_run, which prefers
  # the persisted Purpose and falls back to an exact Context match for runs created
  # before Purpose was written); duplicating it client-side would give it two homes
  # and let the fallback drift.
  isDraftLabeling: Boolean
}

