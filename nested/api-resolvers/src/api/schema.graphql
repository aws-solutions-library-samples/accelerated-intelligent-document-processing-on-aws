  updateFinetuningJobStatus(jobId: ID!, status: FinetuningJobStatus!, errorMessage: String): FinetuningJob @aws_iam

  # Admin-only operations
  deleteConfigVersion(versionName: String!): UpdateConfigurationResponse
    @aws_cognito_user_pools(cognito_groups: ["Admin"])
  createUser(email: String!, persona: String!, allowedConfigVersions: [String], allowedTestSets: [String]): User
