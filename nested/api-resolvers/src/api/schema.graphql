# Chat-with-Document async messages.
#
# The feature works via a long-running processor Lambda invoked async, which
# publishes status updates and token deltas back via this type so the UI can
# render activity while waiting for large-context models (e.g. Opus 4.7 1M).
# Mirrors the AgentChatMessage pattern.
#
# `method` values:
#   - "chat"                  — user-initiated request (from UI)
#   - "assistant_status"      — processor status transition (e.g. LOADING_DOCUMENT,
#                               CALLING_MODEL). `content` carries a human-readable
#                               status string; `status` carries the machine-readable
#                               state.
#   - "assistant_stream"      — streaming delta; `content` is the incremental text.
#   - "assistant_final"       — final assistant answer; `content` is the full text.
#   - "assistant_error"       — terminal error; `content` is the error message.
type ChatDocumentMessage @aws_cognito_user_pools @aws_iam {
  sessionId: String!
  role: String!          # "user" | "assistant"
  content: String!       # Full text, delta chunk, or status string
  timestamp: String!
  method: String         # See docstring above
  status: String         # Machine-readable: QUEUED | LOADING_DOCUMENT | CALLING_MODEL | STREAMING | COMPLETE | ERROR
  modelId: String        # The actual model invoked (may differ from UI selection if fallback kicked in)
  isProcessing: Boolean
}

