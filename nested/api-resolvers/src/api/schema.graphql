# One point on the error-burndown curve: residual error after reviewing N of the
# lowest-confidence documents.
type ReviewBurndownPoint @aws_cognito_user_pools @aws_iam {
  docsReviewed: Int!
  residualErrorPct: Float!
  cutoff: Float
}

# One confidence bin of the measured reliability table (the curve itself).
type ReliabilityBin @aws_cognito_user_pools @aws_iam {
  binStart: Float!
  binEnd: Float!
  observations: Int!
  observedAccuracy: Float
  blendedAccuracy: Float
}

# Whether confidence can be trusted to rank correctness on this set. When this
# is not reliable, a small worst-first review sample is not defensible and the
# estimate says so via recommendReviewAll.
type CalibrationHealth @aws_cognito_user_pools @aws_iam {
  # Expected Calibration Error. Null until something has been measured.
  ece: Float
  # P(a wrong field scores lower than a correct one) — whether confidence can
  # *rank* correctness, which is the only thing worst-first review needs. Null
  # until both correct and incorrect observations exist. A separate axis from
  # ECE: measured live, one grader scored ECE 0.032 / AUROC 0.480 and another
  # ECE 0.054 / AUROC 0.878 — better calibration, useless ranking.
  auroc: Float
  # Populated confidence bins. Low coverage means confidence barely varies, so
  # there is no worst-first signal — ECE alone does NOT detect this.
  binCoverage: Int!
  totalObservations: Int!
  degenerate: Boolean!
  overconfident: Boolean!
  # Confidence ranks correctness no better than chance. Distinct from
  # degenerate: scores may spread across many bins and still put every error in
  # the high-confidence end, where worst-first review never looks.
  undiscriminating: Boolean!
  reliable: Boolean!
}

type ReviewEffortEstimate @aws_cognito_user_pools @aws_iam {
  testSetId: String!
  # Label-quality tier: "gold" | "silver" | "bronze" | "unrated". Derived from the
  # measured curve, never set by a user, so it can be earned and lost. "unrated"
  # means confidence cannot rank errors on this set, so no accuracy claim is
  # defensible — deliberately not dressed up as a low tier.
  qualityTier: String
  # Plain-language reason for the tier, for a tooltip.
  qualityTierReason: String
  targetAccuracy: Float!
  configVersion: String
  docsToReview: Int!
  # Range, not a point: a prior-driven estimate should not imply precision.
  docsToReviewLow: Int!
  docsToReviewHigh: Int!
  totalDocs: Int!
  # How many documents' confidences were actually read. Below totalDocs on large
  # sets, where the estimate extrapolates from a sample — surfaced so the UI can
  # say so instead of implying every document was inspected.
  sampledDocs: Int
  # Confidence value at the boundary of the reviewed set.
  impliedCutoff: Float
  residualError: Float!
  baselineError: Float!
  effortMinutes: Float!
  # Cost of reviewing one document, so a caller can price a different review
  # depth without dividing the audit sample out of effortMinutes.
  effortMinutesPerDoc: Float
  # prior | partially-measured | measured | unreliable
  estimateConfidence: String!
  # Random sample of the high-confidence zone to spot-check. Worst-first review
  # is blind to confident errors, so this is the only way to catch them.
  auditSampleSize: Int!
  recommendReviewAll: Boolean!
  calibration: CalibrationHealth!
  burndown: [ReviewBurndownPoint!]!
  reliabilityTable: [ReliabilityBin!]!
}

# One document in an annotator's worst-first queue.
type AnnotationQueueItem @aws_cognito_user_pools @aws_iam {
  objectKey: String!
  inputKey: String!
  # The key claimReview / completeSectionReview expect — the pipeline copy of this
  # document ("{runId}/{filename}"). Null when the set has no labeling run, in
  # which case there is nothing to claim yet. Returned so clients never rebuild
  # this shape themselves.
  reviewObjectKey: String
  minConfidence: Float
  confidenceThreshold: Float
  # Fields below their configured threshold, out of those carrying confidence.
  # The queue is ordered by this, with minConfidence as the tiebreak.
  alertCount: Int
  # What each of this document's sections was classified as (distinct, in order).
  # Shown so a reviewer can spot a misclassified document while working the queue.
  # It is NOT scored and does not affect ordering: nothing here can tell whether a
  # class is *wrong* — the draft under review IS the candidate ground truth, and
  # classification carries no real confidence — so this is information for a human
  # rather than a signal, and it is deliberately kept out of the review-effort
  # estimator, whose alert counts and confidence curve are defined in terms of
  # field confidence.
  documentClasses: [String!]
  fieldCount: Int
  labelSource: String
  sectionCount: Int!
  # Ground-truth sections, so the queue can hand them straight to the editor
  # without a second round-trip per document.
  sections: [TestSetDocumentSection!]
  # Claim state, so several annotators can work one set without colliding.
  # claimReview is what enforces exclusivity; this only reflects it.
  claimedBy: String
  claimedByMe: Boolean!
  reviewStatus: String
  reviewed: Boolean!
  # True when this caller could claim it next (unreviewed, and unclaimed or
  # already theirs).
  available: Boolean!
}

type AnnotationQueue @aws_cognito_user_pools @aws_iam {
  testSetId: String!
  totalDocs: Int!
  # How many documents were actually examined for this response. Below totalDocs
  # on large sets, where the queue reads a bounded page — so the UI can say the
  # ordering covers the inspected documents rather than the whole set.
  inspectedDocs: Int
  # Shared progress across every annotator working this set.
  reviewedDocs: Int!
  remainingDocs: Int!
  claimedByOthers: Int!
  documents: [AnnotationQueueItem!]!
  # The next document this caller should open ("Save & next"); null when the
  # queue is drained for them.
  nextObjectKey: String
  # State of the set's most recent draft-labeling job, so the workspace can show
  # progress and stop looking empty while labels are still being produced.
  # RUNNING here also means polling this query advances the job, since labels are
  # harvested on read.
  labelJobStatus: String
  labelJobLabeled: Int
  labelJobTotal: Int
  # The open version transition, if annotation has begun on this set. Returned here so
  # the workspace can tell "already in a transition" from "has not started one" on entry,
  # WITHOUT calling openTestSetAnnotationDraft to find out — that mutation snapshots, so
  # using it as a probe would open a transition merely by visiting the page, which is the
  # silent commitment this whole mechanism exists to remove.
  draftVersion: Int
  # The version the open transition is moving away from, whose labels are snapshotted.
  baseVersion: Int
}

