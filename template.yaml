  # Custom resource to configure S3 bucket notification after both bucket and function exist
  TestSetBucketNotificationFunction:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function does not require VPC access as it only interacts with AWS services via APIs"
          - id: W92
            reason: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required for Cfn Custom Resource function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    Properties:
      PermissionsBoundary:
        !If [
          HasPermissionsBoundary,
          !Ref PermissionsBoundaryArn,
          !Ref AWS::NoValue,
        ]
      Handler: index.handler
      Runtime: python3.12
      # Long enough for the OperationAborted retry ladder below (~5 min of
      # backoff) plus overhead. S3 serializes conflicting bucket-config writes,
      # and a rollback fires several of them at once.
      Timeout: 420
      VpcConfig:
        !If
          - DeployInVPC
          - SecurityGroupIds:
              - !Ref LambdaSecurityGroupId
            SubnetIds: !Ref PrivateSubnetIds
          - !Ref AWS::NoValue
      InlineCode: |
        import boto3
        import cfnresponse
        import json
        import logging
        import time

        from botocore.exceptions import ClientError

        logger = logging.getLogger()
        logger.setLevel(logging.INFO)

        # S3 allows only ONE conditional bucket-config operation at a time. A
        # CloudFormation rollback/delete tears down TestSetBucketPolicy,
        # TestSetBucketAutoDelete and this notification config concurrently, so
        # PutBucketNotificationConfiguration intermittently returns
        # OperationAborted ("A conflicting conditional operation is currently in
        # progress"). It is purely transient - the same call succeeds moments
        # later - so retry with backoff instead of failing the resource.
        RETRY_DELAYS = [2, 5, 10, 20, 30, 45, 60, 60, 60, 60]
        RETRYABLE_CODES = {'OperationAborted', 'SlowDown', 'RequestTimeout',
                           'InternalError', 'ServiceUnavailable',
                           'TooManyRequests'}


        def put_notification_with_retry(s3_client, bucket_name, notification_config):
            """PutBucketNotificationConfiguration, retrying transient conflicts."""
            last_error = None
            for attempt, delay in enumerate([0] + RETRY_DELAYS, start=1):
                if delay:
                    logger.warning(
                        "Retrying bucket notification config for %s in %ss "
                        "(attempt %s) after %s",
                        bucket_name, delay, attempt, last_error
                    )
                    time.sleep(delay)
                try:
                    s3_client.put_bucket_notification_configuration(
                        Bucket=bucket_name,
                        NotificationConfiguration=notification_config
                    )
                    return
                except ClientError as e:
                    code = e.response.get('Error', {}).get('Code', '')
                    if code not in RETRYABLE_CODES:
                        raise
                    last_error = code
            raise RuntimeError(
                f"PutBucketNotificationConfiguration on {bucket_name} still "
                f"failing with {last_error} after {len(RETRY_DELAYS) + 1} attempts"
            )


        def handler(event, context):
            logger.info(json.dumps(event))

            request_type = event['RequestType']
            try:
                s3_client = boto3.client('s3')
                bucket_name = event['ResourceProperties']['BucketName']
                function_arn = event['ResourceProperties']['FunctionArn']

                if request_type == 'Create' or request_type == 'Update':
                    # Configure bucket notification
                    notification_config = {
                        'LambdaFunctionConfigurations': [
                            {
                                'Id': 'TestSetZipExtractor',
                                'LambdaFunctionArn': function_arn,
                                'Events': ['s3:ObjectCreated:*'],
                                'Filter': {
                                    'Key': {
                                        'FilterRules': [
                                            {
                                                'Name': 'suffix',
                                                'Value': '.zip'
                                            }
                                        ]
                                    }
                                }
                            }
                        ]
                    }

                    put_notification_with_retry(
                        s3_client, bucket_name, notification_config
                    )

                elif request_type == 'Delete':
                    # Remove bucket notification
                    put_notification_with_retry(s3_client, bucket_name, {})

                cfnresponse.send(event, context, cfnresponse.SUCCESS, {})

            except Exception as e:
                logger.error(f"Error: {str(e)}")
                if request_type == 'Delete':
                    # Never block a stack delete/rollback on cleanup of a
                    # notification config: the bucket itself is Retain, and a
                    # DELETE_FAILED here wedges the whole stack in
                    # ROLLBACK_FAILED (requiring manual intervention) for a
                    # resource that no longer matters. Mirrors the
                    # best-effort-succeed behavior of
                    # TestSetBucketAutoDeleteFunction.
                    cfnresponse.send(event, context, cfnresponse.SUCCESS, {},
                                     reason=f"Notification cleanup attempted: {str(e)}")
                else:
                    cfnresponse.send(event, context, cfnresponse.FAILED, {},
                                     reason=f"Error configuring bucket notification: {str(e)}")
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutBucketNotification
                - s3:GetBucketNotification
              Resource: !GetAtt TestSetBucket.Arn

  TestSetBucketNotificationConfiguration:
    Type: Custom::S3BucketNotification
    DependsOn:
      - TestSetZipExtractorFunctionInvokePermission
      - TestSetZipExtractorS3Policy
      # Serialize against the other conditional bucket-config write on
      # TestSetBucket. Without this, CloudFormation creates (and, in reverse,
      # deletes) the policy and this notification config in the same instant,
      # and S3 rejects the second with OperationAborted. Ordering them costs
      # nothing and removes the race at the source; the retry ladder in the
      # handler above covers any residual conflict from outside this stack.
      - TestSetBucketPolicy
    Properties:
      ServiceToken: !GetAtt TestSetBucketNotificationFunction.Arn
      BucketName: !Ref TestSetBucket
      FunctionArn: !GetAtt TestSetZipExtractorFunction.Arn


