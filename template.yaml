                      "showUnits": false
                    },
                    "right": {
                      "label": "Seconds",
                      "showUnits": false
                    }
                  },
                  "annotations": {
                    "horizontal": [
                      {
                        "label": "Stalled threshold (${QueueStalledAgeThresholdSeconds}s)",
                        "value": ${QueueStalledAgeThresholdSeconds},
                        "yAxis": "right"
                      }
                    ]
                  }
                }
              },
              {
                "type": "metric",
                "x": 12,
                "y": 42,
                "width": 12,
                "height": 6,
                "properties": {
                  "metrics": [
                    [
                      "AWS/SQS",
                      "ApproximateNumberOfMessagesVisible",
                      "QueueName",
                      "${DocumentQueueDLQ.QueueName}",
                      {
                        "stat": "Maximum",
                        "label": "Document DLQ (failed all retries, ~8h)"
                      }
                    ],
                    [
                      "AWS/SQS",
                      "ApproximateNumberOfMessagesVisible",
                      "QueueName",
                      "${QueueSenderDLQ.QueueName}",
                      {
                        "stat": "Maximum",
                        "label": "Queue-sender DLQ (never enqueued, no tracking row)"
                      }
                    ],
                    [
                      "AWS/SQS",
                      "ApproximateNumberOfMessagesVisible",
                      "QueueName",
                      "${WorkflowTrackerDLQ.QueueName}",
                      {
                        "stat": "Maximum",
                        "label": "Workflow-tracker DLQ (unreleased concurrency slot)"
                      }
                    ]
                  ],
                  "region": "${AWS::Region}",
                  "title": "Dead-Letter Queue Depth (any non-zero value is a document that needs a human — each line has its own alarm on the Workflow Alerts topic)",
                  "view": "timeSeries",
                  "period": 300,
                  "stat": "Maximum",
                  "yAxis": {
                    "left": {
                      "label": "Messages",
                      "min": 0,
                      "showUnits": false
                    }
                  }
                }
              }
            ]
          }
        - StateMachineArn: !GetAtt PATTERNSTACK.Outputs.StateMachineArn
          StateMachineLogGroup: !GetAtt PATTERNSTACK.Outputs.StateMachineLogGroup

  DashboardMergerFunction:
    DependsOn:
      - IsStacknameLengthOK
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: "Role requires * resource access for CloudWatch Dashboards"
          - id: W89
            reason: "Function does not require VPC access as it only interacts with AWS services via APIs"
          - id: W92
            reason: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required for Cfn Custom Resource function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only configuration values like feature flags and non-sensitive settings"
    Properties:
      PermissionsBoundary:
        !If [
          HasPermissionsBoundary,
          !Ref PermissionsBoundaryArn,
          !Ref AWS::NoValue,
        ]
      CodeUri: src/lambda/dashboard_merger
      Handler: index.handler
      Runtime: python3.12
      Timeout: 60
      MemorySize: 128
      VpcConfig:
        !If
          - DeployInVPC
          - SecurityGroupIds:
              - !Ref LambdaSecurityGroupId
            SubnetIds: !Ref PrivateSubnetIds
          - !Ref AWS::NoValue
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          STACK_NAME: !Ref AWS::StackName
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - cloudwatch:GetDashboard
                - cloudwatch:ListDashboards
                - cloudwatch:PutDashboard
                - cloudwatch:DeleteDashboards
              Resource: "*"

  MergedDashboard:
    Type: Custom::DashboardMerger
    Properties:
      ServiceToken: !GetAtt DashboardMergerFunction.Arn
      Dashboard1Name: !Ref MainTemplateSubsetDashboard
      Dashboard2Name: !GetAtt PATTERNSTACK.Outputs.DashboardName
      MergedDashboardName: !Sub "${AWS::StackName}-${AWS::Region}"
      ChangeToForceUpdate: <HASH_TOKEN> # Source code hash set by publish script

  ##########################################################################
  # Lambda function that retrieves status details for specified document
  ##########################################################################

  LookupFunction:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function does not require VPC access as it only interacts with AWS services via APIs"
          - id: W92
            reason: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_116: ""DLQ not required for Lookup function as it is called only from CLI"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only configuration values like feature flags and non-sensitive settings"
    Properties:
      PermissionsBoundary:
        !If [
          HasPermissionsBoundary,
          !Ref PermissionsBoundaryArn,
          !Ref AWS::NoValue,
        ]
      CodeUri: src/lambda/lookup_function/
      Handler: index.handler
      Runtime: python3.12
      Timeout: 30
      VpcConfig:
        !If
          - DeployInVPC
          - SecurityGroupIds:
              - !Ref LambdaSecurityGroupId
            SubnetIds: !Ref PrivateSubnetIds
          - !Ref AWS::NoValue
      LoggingConfig:
        LogGroup: !Ref LookupFunctionLogGroup
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          TRACKING_TABLE: !Ref TrackingTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TrackingTable
        - Statement:
            - Effect: Allow
              Action:
                - states:DescribeExecution
                - states:GetExecutionHistory
              Resource:
                - !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:${AWS::StackName}*"
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:ReEncrypt*
                - kms:GenerateDataKey*
                - kms:DescribeKey
              Resource: !GetAtt CustomerManagedEncryptionKey.Arn

  LookupFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !GetAtt CustomerManagedEncryptionKey.Arn

      RetentionInDays: !Ref LogRetentionDays

  ##########################################################################
  # Agent resources for text-to-agent feature
  ##########################################################################
  # DynamoDB table for agent job tracking
  AgentTable:
    Type: AWS::DynamoDB::Table
    Properties:
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ExpiresAfter
        Enabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref CustomerManagedEncryptionKey

  # DynamoDB table for HITL user management
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: EmailIndex
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref CustomerManagedEncryptionKey

  # Secrets Manager secret for External MCP Agent credentials
  ExternalMCPAgentsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}/external-mcp-agents/credentials"
      Description: "Credentials for External MCP Agents - JSON array with required fields: mcp_url, cognito_user_pool_id, cognito_client_id, cognito_username, cognito_password. Optional fields: agent_name, agent_description"
      SecretString: "[]"
      KmsKeyId: !Ref CustomerManagedEncryptionKey

  # ChatWithDocumentProcessor — long-running Lambda invoked async by the
  # send_chat_document_message_resolver. Does the heavy lifting (load doc,
  # call Bedrock, publish streaming status) outside the REST API's
  # synchronous request budget. Mirrors AgentChatProcessorFunction.
  ChatWithDocumentProcessorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !GetAtt CustomerManagedEncryptionKey.Arn
      RetentionInDays: !Ref LogRetentionDays

  ChatWithDocumentProcessorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function does not require VPC access as it only interacts with AWS services via APIs"
          - id: W92
            reason: "Function does not require reserved concurrency as it scales based on demand"
          - id: W11
            reason: "Role requires * for Bedrock marketplace and CloudWatch Metrics"
    # checkov:skip=CKV_AWS_116: "DLQ not required — invoked async by resolver; failure events logged + published to UI as assistant_error via subscription"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_173: "Environment variables contain only non-sensitive configuration"
    Properties:
      PermissionsBoundary:
        !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      CodeUri: src/lambda/chat_with_document_processor/
      Handler: index.handler
      Runtime: python3.12
      MemorySize: 4096
      Timeout: 900
      Layers:
        - !Ref IDPCommonBaseLayer
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          # Pin idp_common.metrics.put_metric to the stack namespace so
          # Bedrock throttle/latency/token emits from
          # idp_common.bedrock.client._put_metric match the
          # PutMetricData IAM Condition below (round-27 review fix).
          METRIC_NAMESPACE: !Ref AWS::StackName
          OUTPUT_BUCKET: !Ref OutputBucket
          CONFIGURATION_TABLE_NAME: !Ref ConfigurationTable
          TRACKING_TABLE_NAME: !Ref TrackingTable
          USERS_TABLE_NAME: !Ref UsersTable
          APPSYNC_API_URL: ""
          # Non-streaming (GovCloud poll) path: persist the final chat message to
          # the ChatMessages table so the UI can poll getChatMessages for it when
          # no Lambda Function URL is available. Harmless in streaming/commercial
          # mode (the persist runs but the UI streams and ignores it).
          CHAT_MESSAGES_TABLE: !Ref ChatMessagesTable
          DATA_RETENTION_DAYS: !Ref DataRetentionInDays
          GUARDRAIL_ID_AND_VERSION:
            !If [HasGuardrailConfig, !Sub "${BedrockGuardrailId}:${BedrockGuardrailVersion}", ""]
          BEDROCK_ASSUME_ROLE_ARN:
            !If [HasBedrockHubRole, !Ref BedrockHubRoleArn, !Ref AWS::NoValue]
          BEDROCK_ASSUME_ROLE_EXTERNAL_ID:
            !If [HasBedrockHubRoleExternalId, !Ref BedrockHubRoleExternalId, !Ref AWS::NoValue]
          BEDROCK_ASSUME_ROLE_SESSION_NAME:
            !If [HasBedrockHubRoleSessionName, !Ref BedrockHubRoleSessionName, !Ref AWS::NoValue]
      LoggingConfig:
        LogGroup: !Ref ChatWithDocumentProcessorLogGroup
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref OutputBucket
        - S3WritePolicy:
            BucketName: !Ref OutputBucket
        - DynamoDBReadPolicy:
            TableName: !Ref ConfigurationTable
        - DynamoDBReadPolicy:
            TableName: !Ref TrackingTable
        # Write final chat messages for the non-streaming (GovCloud poll) path.
        - DynamoDBWritePolicy:
            TableName: !Ref ChatMessagesTable
        - Statement:
            # OpenAI GPT-5.x models are served via the bedrock-mantle endpoint
            # (OpenAI Responses API) and use a separate IAM action namespace.
            - Effect: Allow
              Action:
                - bedrock-mantle:CreateInference
                - bedrock-mantle:GetProject
                - bedrock-mantle:ListProjects
                - bedrock-mantle:ListTagsForResources
              Resource: "*"
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
                - bedrock:GetInferenceProfile
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:application-inference-profile/*"
            - Effect: Allow
              Action:
                - aws-marketplace:Subscribe
                - aws-marketplace:Unsubscribe
                - aws-marketplace:ViewSubscriptions
              Resource: "*"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
              # Round-22 hardening: scope PutMetricData to the stack's own
              # metric namespace so a compromised Lambda can't spam metrics
              # to arbitrary namespaces or names that trigger alarms on
              # neighbouring stacks.
              Condition:
                StringEquals:
                  "cloudwatch:namespace": !Ref AWS::StackName
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:ReEncrypt*
                - kms:GenerateDataKey*
                - kms:DescribeKey
              Resource: !GetAtt CustomerManagedEncryptionKey.Arn
            - !If
              - HasGuardrailConfig
              - Effect: Allow
                Action: bedrock:ApplyGuardrail
                Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/${BedrockGuardrailId}"
              - !Ref AWS::NoValue
            # Optional cross-account Bedrock invocation via hub-account role.
            - !If
              - HasBedrockHubRole
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: !Ref BedrockHubRoleArn
              - !Ref AWS::NoValue
            # RBAC scope enforcement — processor queries UsersTable.SubIndex
            # to fetch the caller's `allowedConfigVersions` and rejects
            # chats against documents outside that scope.
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
              Resource:
                - !GetAtt UsersTable.Arn
                - !Sub "${UsersTable.Arn}/index/*"

  # Lambda function for agent chat resolver
  AgentChatProcessorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function does not require VPC access as it only interacts with AWS services via APIs"
          - id: W92
            reason: "Function does not require reserved concurrency as it scales based on demand"
          - id: W58
            reason: "DLQ not required for Cfn Custom Resource function"
          - id: W76
            reason: "Suppressing W76: SPCM for IAM policy document is higher than 25"
          - id: W11
            reason: "Role requires * resource access for CloudWatch Metrics and Logs"
    # checkov:skip=CKV_AWS_116: "DLQ not required for analytics processor as it's invoked asynchronously by request handler with error handling and job status tracking in DynamoDB"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only configuration values like feature flags and non-sensitive settings"
    Properties:
      PermissionsBoundary:
        !If [
          HasPermissionsBoundary,
          !Ref PermissionsBoundaryArn,
          !Ref AWS::NoValue,
        ]
      CodeUri: src/lambda/agent_chat_processor/
      Handler: index.handler
      Runtime: python3.12
      Timeout: 600 # Increase timeout to handle longer Bedrock responses

      Layers:
        - !Ref IDPCommonAgentsLayer
      MemorySize: 1024 # Increase memory for agents with MCP clients and streaming
      VpcConfig: !If
        - DeployInVPC
        - SubnetIds: !Ref PrivateSubnetIds
          SecurityGroupIds:
            - !Ref LambdaSecurityGroupId
        - !If
          - UsePrivateApi
          - SubnetIds: !Ref LambdaSubnetIds
            SecurityGroupIds:
              - !Ref LambdaVpcSecurityGroup
          - !Ref AWS::NoValue
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          CONFIGURATION_TABLE_NAME: !Ref ConfigurationTable
          TRACKING_TABLE_NAME: !Ref TrackingTable
          LOOKUP_FUNCTION_NAME: !Ref LookupFunction
          STRANDS_LOG_LEVEL: !Ref LogLevel
          BEDROCK_REGION: !Ref AWS::Region
          CHAT_MESSAGES_TABLE: !Ref ChatMessagesTable
          CHAT_SESSIONS_TABLE: !Ref ChatSessionsTable
          ID_HELPER_CHAT_MEMORY_TABLE: !Ref IdHelperChatMemoryTable
          MEMORY_METHOD: dynamodb
          MAIN_STACK_NAME: !Ref AWS::StackName
          STREAMING_ENABLED: true
          MAX_CONVERSATION_TURNS: 20
          MAX_MESSAGE_SIZE_KB: 8.5
          DATA_RETENTION_DAYS: !Ref DataRetentionInDays
          APPSYNC_API_URL: ""
          ATHENA_DATABASE: !Ref ReportingDatabase
          ATHENA_OUTPUT_LOCATION: !Sub
            - "s3://${Bucket}/athena-results/"
            - Bucket: !If
                - ShouldCreateReportingBucket
                - !Ref ReportingBucket
                - !Ref ReportingBucketName
          AWS_STACK_NAME: !Ref AWS::StackName
          GUARDRAIL_ID_AND_VERSION:
            !If [
              HasGuardrailConfig,
              !Sub "${BedrockGuardrailId}:${BedrockGuardrailVersion}",
              "",
            ]
          CLOUDWATCH_LOG_GROUP_PREFIX: !Sub "/aws/lambda/${AWS::StackName}"
          SETTINGS_PARAMETER_NAME: !Ref SettingsParameter
          CONFIGURATION_BUCKET: !Ref ConfigurationBucket
          BEDROCK_ASSUME_ROLE_ARN:
            !If [HasBedrockHubRole, !Ref BedrockHubRoleArn, !Ref AWS::NoValue]
          BEDROCK_ASSUME_ROLE_EXTERNAL_ID:
            !If [HasBedrockHubRoleExternalId, !Ref BedrockHubRoleExternalId, !Ref AWS::NoValue]
          BEDROCK_ASSUME_ROLE_SESSION_NAME:
            !If [HasBedrockHubRoleSessionName, !Ref BedrockHubRoleSessionName, !Ref AWS::NoValue]
      LoggingConfig:
        LogGroup: !Ref AgentChatProcessorLogGroup
      Policies:
        - Statement:
            Effect: Allow
            Action: bedrock-agentcore:InvokeAgentRuntime
            Resource: "*"
        - Statement:
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !Sub "arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:*"
              Condition:
                StringLike:
                  "aws:ResourceTag/idp:feature-id": "*"
            - Effect: Allow
              Action:
                - kms:GenerateDataKey
                - kms:Decrypt
              Resource: !GetAtt CustomerManagedEncryptionKey.Arn
        - DynamoDBCrudPolicy:
            TableName: !Ref ChatMessagesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ChatSessionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref IdHelperChatMemoryTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConfigurationTable
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/feature-platform/installed-features-table"
            - Effect: Allow
              Action: [dynamodb:Scan, dynamodb:GetItem]
              Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AWS::StackName}-FeaturePlatformStack-*"
        # Read the samples manifest (config_library/samples-manifest.json) the
        # list_sample_documents tool surfaces to the Quick Start agent.
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "arn:${AWS::Partition}:s3:::${ConfigurationBucket}/config_library/*"
        - S3CrudPolicy:
            BucketName: !If
              - ShouldCreateReportingBucket
              - !Ref ReportingBucket
              - !Ref ReportingBucketName
        - Statement:
            - Effect: Allow
              Action:
                - athena:StartQueryExecution
                - athena:GetQueryExecution
                - athena:GetQueryResults
              Resource:
                - !Sub "arn:${AWS::Partition}:athena:${AWS::Region}:${AWS::AccountId}:workgroup/primary"
                - !Sub "arn:${AWS::Partition}:athena:${AWS::Region}:${AWS::AccountId}:datacatalog/*"
            - Effect: Allow
              Action:
                # PutMetricData for emit_control_plane_cost_metric on the
                # analytics agent's Athena calls. Scoped to the
                # IDPControlPlane namespace. Round-6 review fix — was
                # missing on Agent*ProcessorFunction, so every Athena call
                # AccessDenied on emit and control_plane_hourly showed 0
                # for analytics-agent's Athena spend.
                - cloudwatch:PutMetricData
              Resource: "*"
              Condition:
                StringEquals:
                  "cloudwatch:namespace": IDPControlPlane
            - Effect: Allow
              Action:
                - glue:GetTable
                - glue:GetTables
                - glue:GetDatabase
                - glue:GetDatabases
                - glue:GetPartitions
              Resource:
                - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog"
                - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${ReportingDatabase}"
                - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${ReportingDatabase}/*"
            # OpenAI GPT-5.x models are served via the bedrock-mantle endpoint
            # (OpenAI Responses API) and use a separate IAM action namespace.
            - Effect: Allow
              Action:
                - bedrock-mantle:CreateInference
                - bedrock-mantle:GetProject
                - bedrock-mantle:ListProjects
                - bedrock-mantle:ListTagsForResources
              Resource: "*"
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
                - bedrock:GetInferenceProfile
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:application-inference-profile/*"
            - Effect: Allow
              Action:
                - aws-marketplace:Subscribe
                - aws-marketplace:Unsubscribe
                - aws-marketplace:ViewSubscriptions
              Resource: "*"
            - !If
              - HasGuardrailConfig
              - Effect: Allow
                Action:
                  - "bedrock:ApplyGuardrail"
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/${BedrockGuardrailId}"
              - !Ref AWS::NoValue
            # Optional cross-account Bedrock invocation via hub-account role.
            - !If
              - HasBedrockHubRole
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: !Ref BedrockHubRoleArn
              - !Ref AWS::NoValue
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:ReEncrypt*
                - kms:GenerateDataKey*
                - kms:DescribeKey
              Resource: !GetAtt CustomerManagedEncryptionKey.Arn
            - Effect: Allow
              Action:
                - bedrock-agentcore:StartCodeInterpreterSession
                - bedrock-agentcore:StopCodeInterpreterSession
                - bedrock-agentcore:InvokeCodeInterpreter
                - bedrock-agentcore:GetCodeInterpreterSession
                - bedrock-agentcore:ListCodeInterpreterSessions
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock-agentcore:*:aws:code-interpreter/*"
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue  # pragma: allowlist secret - IAM action name, not a secret value
              Resource:
                - !Ref ExternalMCPAgentsSecret
            - Effect: Allow
              Action:
                - logs:DescribeLogGroups
                - logs:DescribeLogStreams
                - logs:FilterLogEvents
                - logs:GetLogEvents
              Resource:
                - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}*"
                - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/vendedlogs/states/${AWS::StackName}*"
                - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${AWS::StackName}*"
                - !GetAtt QueueSenderLogGroup.Arn
                - !GetAtt QueueProcessorLogGroup.Arn
                - !GetAtt WorkflowTrackerLogGroup.Arn
                - !GetAtt SaveReportingDataFunctionV2LogGroup.Arn
            - Effect: Allow
              Action:
                - logs:DescribeLogGroups
              Resource:
                - "*"
            - Effect: Allow
              Action:
                - dynamodb:DescribeTable
                - dynamodb:Scan
                - dynamodb:Query
                - dynamodb:GetItem
                - dynamodb:Query
              Resource:
                - !GetAtt TrackingTable.Arn
            - Effect: Allow
              Action:
                - cloudformation:DescribeStackResources
                - cloudformation:DescribeStacks
              Resource:
                - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*"
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}*"
            - Effect: Allow
              Action:
                - states:DescribeExecution
                - states:GetExecutionHistory
              Resource:
                - !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:${AWS::StackName}*"
            - Effect: Allow
              Action:
                - xray:GetTraceSummaries
                - xray:BatchGetTraces
                - xray:GetServiceGraph
              Resource: "*"
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${SettingsParameter}"

  AgentChatProcessorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !GetAtt CustomerManagedEncryptionKey.Arn
      RetentionInDays: !Ref LogRetentionDays

  ##########################################################################
  # Chat streaming endpoint
  #
  # Replaces the former GraphQL mutation->subscription fan-out for chat token deltas
  # with Lambda response streaming via a direct Function URL
  # (InvokeMode=RESPONSE_STREAM, AuthType=AWS_IAM). The browser SigV4-signs the
  # request with the authenticated Cognito Identity Pool role and reads the SSE
  # body incrementally. Works identically under CloudFront or API Gateway
  # hosting because the Function URL is addressed directly by the browser.
  #
  # The function runs a tiny FastAPI app under the AWS Lambda Web Adapter (LWA)
  # and drives the SAME chat_with_document_processor / agent_chat_processor logic
  # used by the async-invoke path, with the delta sink redirected to the HTTP
  # response stream. The REST API is now the only transport (GraphQL API removed),
  # so these resources deploy unconditionally.
  ##########################################################################
  ChatStreamProcessorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !GetAtt CustomerManagedEncryptionKey.Arn
      RetentionInDays: !Ref LogRetentionDays

  ChatStreamProcessorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function does not require VPC access as it only interacts with AWS services via APIs"
          - id: W92
            reason: "Function does not require reserved concurrency as it scales based on demand"
          - id: W11
            reason: "Role requires * for Bedrock marketplace and CloudWatch Metrics"
    # checkov:skip=CKV_AWS_116: "DLQ not required — synchronous Function URL stream; errors are streamed to the UI as assistant_error"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_173: "Environment variables contain only non-sensitive configuration"
    Properties:
      PermissionsBoundary:
        !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      CodeUri: src/lambda/chat_stream_processor/
      # LWA boots run.sh (uvicorn) via the /opt/bootstrap exec wrapper.
      Handler: run.sh
      Runtime: python3.12
      MemorySize: 4096
      Timeout: 900
      Layers:
        # Base (bedrock/appsync/config) + agents (strands) — the streaming app
        # imports both processor modules so it needs both layers. LWA layer last.
        - !Ref IDPCommonBaseLayer
        - !Ref IDPCommonAgentsLayer
        - !If
          - HasLambdaWebAdapterLayerArn
          - !Ref LambdaWebAdapterLayerArn
          - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerX86:25
      Environment:
        Variables:
          # LWA: run the app in response-streaming mode and wrap exec with LWA.
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          AWS_LWA_INVOKE_MODE: response_stream
          PORT: "8080"
          LOG_LEVEL: !Ref LogLevel
          # Pin idp_common.metrics.put_metric to the stack namespace so
          # Bedrock throttle/latency/token emits from
          # idp_common.bedrock.client._put_metric match the
          # PutMetricData IAM Condition below (round-27 review fix).
          METRIC_NAMESPACE: !Ref AWS::StackName
          # --- Shared / doc-chat processor env (mirrors ChatWithDocumentProcessorFunction) ---
          OUTPUT_BUCKET: !Ref OutputBucket
          CONFIGURATION_TABLE_NAME: !Ref ConfigurationTable
          CONFIGURATION_BUCKET: !Ref ConfigurationBucket
          TRACKING_TABLE_NAME: !Ref TrackingTable
          USERS_TABLE_NAME: !Ref UsersTable
          GUARDRAIL_ID_AND_VERSION:
            !If [HasGuardrailConfig, !Sub "${BedrockGuardrailId}:${BedrockGuardrailVersion}", ""]
          # --- Agent-chat processor env (mirrors AgentChatProcessorFunction) ---
          LOOKUP_FUNCTION_NAME: !Ref LookupFunction
          STRANDS_LOG_LEVEL: !Ref LogLevel
          BEDROCK_REGION: !Ref AWS::Region
          CHAT_MESSAGES_TABLE: !Ref ChatMessagesTable
          CHAT_SESSIONS_TABLE: !Ref ChatSessionsTable
          ID_HELPER_CHAT_MEMORY_TABLE: !Ref IdHelperChatMemoryTable
          MEMORY_METHOD: dynamodb
          MAIN_STACK_NAME: !Ref AWS::StackName
          STREAMING_ENABLED: true
          MAX_CONVERSATION_TURNS: 20
          MAX_MESSAGE_SIZE_KB: 8.5
          DATA_RETENTION_DAYS: !Ref DataRetentionInDays
          ATHENA_DATABASE: !Ref ReportingDatabase
          ATHENA_OUTPUT_LOCATION: !Sub
            - "s3://${Bucket}/athena-results/"
            - Bucket: !If
                - ShouldCreateReportingBucket
                - !Ref ReportingBucket
                - !Ref ReportingBucketName
          AWS_STACK_NAME: !Ref AWS::StackName
          CLOUDWATCH_LOG_GROUP_PREFIX: !Sub "/aws/lambda/${AWS::StackName}"
          SETTINGS_PARAMETER_NAME: !Ref SettingsParameter
          # No GraphQL API URL — the sink writes to the HTTP stream instead of
          # a GraphQL endpoint, so neither processor constructs that client here.
          BEDROCK_ASSUME_ROLE_ARN:
            !If [HasBedrockHubRole, !Ref BedrockHubRoleArn, !Ref AWS::NoValue]
          BEDROCK_ASSUME_ROLE_EXTERNAL_ID:
            !If [HasBedrockHubRoleExternalId, !Ref BedrockHubRoleExternalId, !Ref AWS::NoValue]
          BEDROCK_ASSUME_ROLE_SESSION_NAME:
            !If [HasBedrockHubRoleSessionName, !Ref BedrockHubRoleSessionName, !Ref AWS::NoValue]
      LoggingConfig:
        LogGroup: !Ref ChatStreamProcessorLogGroup
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref OutputBucket
        - S3WritePolicy:
            BucketName: !Ref OutputBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref ConfigurationTable
        - DynamoDBReadPolicy:
            TableName: !Ref TrackingTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ChatMessagesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ChatSessionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref IdHelperChatMemoryTable
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/feature-platform/installed-features-table"
            - Effect: Allow
              Action: [dynamodb:Scan, dynamodb:GetItem]
              Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AWS::StackName}-FeaturePlatformStack-*"
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "arn:${AWS::Partition}:s3:::${ConfigurationBucket}/config_library/*"
        - S3CrudPolicy:
            BucketName: !If
              - ShouldCreateReportingBucket
              - !Ref ReportingBucket
              - !Ref ReportingBucketName
        - Statement:
            # OpenAI GPT-5.x models are served via the bedrock-mantle endpoint.
            - Effect: Allow
              Action:
                - bedrock-mantle:CreateInference
                - bedrock-mantle:GetProject
                - bedrock-mantle:ListProjects
                - bedrock-mantle:ListTagsForResources
              Resource: "*"
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
                - bedrock:GetInferenceProfile
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:application-inference-profile/*"
            - Effect: Allow
              Action:
                - bedrock-agentcore:InvokeAgentRuntime
                - bedrock-agentcore:StartCodeInterpreterSession
                - bedrock-agentcore:StopCodeInterpreterSession
                - bedrock-agentcore:InvokeCodeInterpreter
                - bedrock-agentcore:GetCodeInterpreterSession
                - bedrock-agentcore:ListCodeInterpreterSessions
              Resource:
                - "*"
            - Effect: Allow
              Action:
                - aws-marketplace:Subscribe
                - aws-marketplace:Unsubscribe
                - aws-marketplace:ViewSubscriptions
              Resource: "*"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
              # Round-23 review fix (#8671): the round-22 hardening
              # scoped this grant ONLY to <StackName>, but the vendored
              # agent-chat-processor in this Lambda runs the analytics
              # agent whose athena_tool.py emits AthenaBytesScanned to
              # IDPControlPlane (round-5 fix). A pure-<StackName>
              # Condition silently DENIED that emit and zeroed the
              # analytics-agent Athena cost row in control_plane_hourly.
              # Fix: permit both namespaces this Lambda legitimately
              # writes to.
              Condition:
                StringEquals:
                  "cloudwatch:namespace":
                    - !Ref AWS::StackName
                    - IDPControlPlane
            - Effect: Allow
              Action:
                - athena:StartQueryExecution
                - athena:GetQueryExecution
                - athena:GetQueryResults
              Resource:
                - !Sub "arn:${AWS::Partition}:athena:${AWS::Region}:${AWS::AccountId}:workgroup/primary"
                - !Sub "arn:${AWS::Partition}:athena:${AWS::Region}:${AWS::AccountId}:datacatalog/*"
            - Effect: Allow
              Action:
                - glue:GetTable
                - glue:GetTables
                - glue:GetDatabase
                - glue:GetDatabases
                - glue:GetPartitions
              Resource:
                - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog"
                - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${ReportingDatabase}"
                - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${ReportingDatabase}/*"
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}*"
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:ReEncrypt*
                - kms:GenerateDataKey*
                - kms:DescribeKey
              Resource: !GetAtt CustomerManagedEncryptionKey.Arn
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue  # pragma: allowlist secret - IAM action name, not a secret value
              Resource:
                - !Ref ExternalMCPAgentsSecret
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${SettingsParameter}"
            - Effect: Allow
              Action:
                - logs:DescribeLogGroups
                - logs:DescribeLogStreams
                - logs:FilterLogEvents
                - logs:GetLogEvents
              Resource:
                - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}*"
                - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/vendedlogs/states/${AWS::StackName}*"
                - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${AWS::StackName}*"
            - Effect: Allow
              Action:
                - cloudformation:DescribeStackResources
                - cloudformation:DescribeStacks
              Resource:
                - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*"
            - Effect: Allow
              Action:
                - states:DescribeExecution
                - states:GetExecutionHistory
              Resource:
                - !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:${AWS::StackName}*"
            - Effect: Allow
              Action:
                - xray:GetTraceSummaries
                - xray:BatchGetTraces
                - xray:GetServiceGraph
              Resource: "*"
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !Sub "arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:*"
              Condition:
                StringLike:
                  "aws:ResourceTag/idp:feature-id": "*"
            # RBAC scope enforcement — query UsersTable.SubIndex.
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
              Resource:
                - !GetAtt UsersTable.Arn
                - !Sub "${UsersTable.Arn}/index/*"
            - !If
              - HasGuardrailConfig
              - Effect: Allow
                Action: bedrock:ApplyGuardrail
                Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/${BedrockGuardrailId}"
              - !Ref AWS::NoValue
            - !If
              - HasBedrockHubRole
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: !Ref BedrockHubRoleArn
              - !Ref AWS::NoValue

  # Direct Function URL (IAM-authed, response streaming). The browser POSTs
  # SigV4-signed requests here; CORS allows the SPA origin.
  ChatStreamProcessorUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref ChatStreamProcessorFunction
      AuthType: AWS_IAM
      InvokeMode: RESPONSE_STREAM
      Cors:
        AllowCredentials: false
        AllowMethods:
          - POST
        AllowHeaders:
          - content-type
          - authorization
          - x-amz-date
          - x-amz-content-sha256
          - x-amz-security-token
        AllowOrigins:
          - "*"
        MaxAge: 600

  # Allow the authenticated Cognito Identity Pool role to invoke the Function
  # URL (FunctionUrlAuthType=AWS_IAM requires both the resource permission here
  # and the lambda:InvokeFunctionUrl grant on the caller's role).
  ChatStreamProcessorUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ChatStreamProcessorFunction
      Action: lambda:InvokeFunctionUrl
      # Principal is the account: for AuthType=AWS_IAM the actual gate is the
      # caller's IAM identity policy (CognitoAuthorizedRole's ChatStreamInvoke
      # grant above). A role-ARN principal is not accepted here.
      Principal: !Ref AWS::AccountId
      FunctionUrlAuthType: AWS_IAM

  ##########################################################################
  # DynamoDB Table for Agent Chat Session Metadata
  ##########################################################################

  ChatSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: sessionId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: sessionId
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ExpiresAfter
        Enabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref CustomerManagedEncryptionKey

  ##########################################################################
  # Lambda Functions for Agent Chat Session Management
  ##########################################################################

  # Lambda function for listing agent chat sessions
  ChatMessagesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ExpiresAfter
        Enabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref CustomerManagedEncryptionKey

  IdHelperChatMemoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ExpiresAfter
        Enabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref CustomerManagedEncryptionKey

  ##########################################################################
  # Capacity Planning Lambda Functions
  ##########################################################################

  CalculateCapacityFunction:
    DependsOn:
      - IsStacknameLengthOK
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: "servicequotas:GetServiceQuota and ListServiceQuotas APIs do not support resource-level permissions"
          - id: W89
            reason: "Function does not require VPC access as it only interacts with AWS services via APIs"
          - id: W92
            reason: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required for capacity planning function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_173: "Environment variables contain non-sensitive configuration values (log level and feature flags)"
    Properties:
      PermissionsBoundary:
        !If [
          HasPermissionsBoundary,
          !Ref PermissionsBoundaryArn,
          !Ref AWS::NoValue,
        ]
      Handler: index.lambda_handler
      Runtime: python3.12
      Timeout: 300
      MemorySize: 512
      CodeUri: src/lambda/calculate_capacity
      LoggingConfig:
        LogGroup: !Ref CalculateCapacityFunctionLogGroup
      Environment:
        Variables:
          # Required: DynamoDB table for tracking and metering data
          TRACKING_TABLE: !Ref TrackingTable
          METERING_TABLE_NAME: !Ref TrackingTable
          # Required: Lambda memory size for processing time calculation from gb_seconds
          LAMBDA_MEMORY_GB: "0.5"
          # Recommendation thresholds
          RECOMMENDATION_HIGH_COMPLEXITY_THRESHOLD: "2.5"
          RECOMMENDATION_MEDIUM_COMPLEXITY_THRESHOLD: "1.5"
          RECOMMENDATION_HIGH_LOAD_THRESHOLD: "3.0"
          RECOMMENDATION_MEDIUM_LOAD_THRESHOLD: "2.0"
          RECOMMENDATION_HIGH_LATENCY_THRESHOLD: "300"
          RECOMMENDATION_LARGE_DOC_THRESHOLD: "50000"
          RECOMMENDATION_HIGH_PAGE_THRESHOLD: "20"
          # Document complexity thresholds
          MEDIUM_COMPLEXITY_THRESHOLD: "5000"
          HIGH_COMPLEXITY_THRESHOLD: "15000"
          PAGE_COMPLEXITY_FACTOR: "0.1"
          HIGH_COMPLEXITY_MULTIPLIER: "2.0"
          MEDIUM_COMPLEXITY_MULTIPLIER: "1.5"
          # Token calculation
          MIN_TOKENS_PER_REQUEST: "500"
          # Bedrock model quota codes (TPM and RPM)
          BEDROCK_MODEL_QUOTA_CODES: '{"us.anthropic.claude-sonnet-5":"L-D4FBCF4E","global.anthropic.claude-sonnet-5":"L-DD84E5CA","us.amazon.nova-lite-v1:0":"L-7C42E72A","us.amazon.nova-pro-v1:0":"L-C0326783","us.amazon.nova-premier-v1:0":"L-AA7FE948","us.amazon.nova-2-lite-v1:0":"L-C6F5908D","global.amazon.nova-2-lite-v1:0":"L-C6F5908D","us.anthropic.claude-3-haiku-20240307-v1:0":"L-DCADBC78","us.anthropic.claude-haiku-4-5-20251001-v1:0":"L-58BE175A","us.anthropic.claude-3-5-sonnet-20241022-v2:0":"L-FF8B4E28","us.anthropic.claude-3-7-sonnet-20250219-v1:0":"L-6E888CC2","us.anthropic.claude-sonnet-4-20250514-v1:0":"L-59759B4A","us.anthropic.claude-sonnet-4-5-20250929-v1:0":"L-F4DDD3EB","us.anthropic.claude-opus-4-20250514-v1:0":"L-29C2B0A3","us.anthropic.claude-opus-4-1-20250805-v1:0":"L-BD85BFCD","us.anthropic.claude-opus-4-5-20251101-v1:0":"L-7007E9C9","global.anthropic.claude-haiku-4-5-20251001-v1:0":"L-58BE175A","global.anthropic.claude-sonnet-4-5-20250929-v1:0":"L-F4DDD3EB","global.anthropic.claude-opus-4-5-20251101-v1:0":"L-7007E9C9"}'
          BEDROCK_MODEL_RPM_QUOTA_CODES: '{"us.anthropic.claude-sonnet-5":"L-D4FBCF4E","global.anthropic.claude-sonnet-5":"L-DD84E5CA","us.amazon.nova-lite-v1:0":"L-89F8391A","us.amazon.nova-pro-v1:0":"L-ED46B8C5","us.amazon.nova-premier-v1:0":"L-9AD981E7","us.amazon.nova-2-lite-v1:0":"L-F06F1187","global.amazon.nova-2-lite-v1:0":"L-F06F1187","us.anthropic.claude-3-haiku-20240307-v1:0":"L-616A3F5B","us.anthropic.claude-haiku-4-5-20251001-v1:0":"L-CCA5DF70","us.anthropic.claude-3-5-sonnet-20241022-v2:0":"L-1D3E59A3","us.anthropic.claude-3-7-sonnet-20250219-v1:0":"L-3D8CC480","us.anthropic.claude-sonnet-4-20250514-v1:0":"L-559DCC33","us.anthropic.claude-sonnet-4-5-20250929-v1:0":"L-4A6BFAB1","us.anthropic.claude-opus-4-20250514-v1:0":"L-C99C7EF6","us.anthropic.claude-opus-4-1-20250805-v1:0":"L-7EC72A47","us.anthropic.claude-opus-4-5-20251101-v1:0":"L-27989F42","global.anthropic.claude-haiku-4-5-20251001-v1:0":"L-CCA5DF70","global.anthropic.claude-sonnet-4-5-20250929-v1:0":"L-4A6BFAB1","global.anthropic.claude-opus-4-5-20251101-v1:0":"L-27989F42"}'
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - servicequotas:GetServiceQuota
                - servicequotas:ListServiceQuotas
              Resource: "*"
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:Query
              Resource: !GetAtt TrackingTable.Arn
            - Effect: Allow
              Action:
                - kms:Decrypt
              Resource: !GetAtt CustomerManagedEncryptionKey.Arn

  CalculateCapacityFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-CalculateCapacity"
      KmsKeyId: !GetAtt CustomerManagedEncryptionKey.Arn
      RetentionInDays: !Ref LogRetentionDays

  CalculateCapacityResolverFunction:
    DependsOn:
      - IsStacknameLengthOK
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function does not require VPC access"
          - id: W92
            reason: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_116: "DLQ not required"
    # checkov:skip=CKV_AWS_117: "VPC not required"
    # checkov:skip=CKV_AWS_115: "Reserved concurrency not required"
    # checkov:skip=CKV_AWS_173: "Environment variables contain non-sensitive configuration values (log level only)"
    Properties:
      PermissionsBoundary:
        !If [
          HasPermissionsBoundary,
          !Ref PermissionsBoundaryArn,
          !Ref AWS::NoValue,
        ]
      Handler: index.lambda_handler
      Runtime: python3.12
      Timeout: 60
      CodeUri: src/lambda/calculate_capacity_resolver
      LoggingConfig:
        LogGroup: !Ref CalculateCapacityResolverFunctionLogGroup
      Environment:
        Variables:
          CALCULATE_CAPACITY_FUNCTION_NAME: !Ref CalculateCapacityFunction
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt CalculateCapacityFunction.Arn

  CalculateCapacityResolverFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-CalculateCapacityResolver"
      KmsKeyId: !GetAtt CustomerManagedEncryptionKey.Arn
      RetentionInDays: !Ref LogRetentionDays




  VersionCheckResolverFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-VersionCheckResolver"
      KmsKeyId: !GetAtt CustomerManagedEncryptionKey.Arn
      RetentionInDays: !Ref LogRetentionDays

  VersionCheckResolverFunction:
    DependsOn:
      - IsStacknameLengthOK
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function does not require VPC access — only reads from public S3 bucket via unsigned requests"
          - id: W92
            reason: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_116: "DLQ not required for synchronous REST API resolver"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_173: "Environment variables contain non-sensitive configuration values (bucket name, prefix, log level)"
    Properties:
      PermissionsBoundary:
        !If [
          HasPermissionsBoundary,
          !Ref PermissionsBoundaryArn,
          !Ref AWS::NoValue,
        ]
      Handler: index.lambda_handler
      Runtime: python3.12
      Timeout: 30
      MemorySize: 256
      CodeUri: src/lambda/version_check_resolver
      LoggingConfig:
        LogGroup: !Ref VersionCheckResolverFunctionLogGroup
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          PUBLIC_ARTIFACTS_BUCKET: !Ref PublicArtifactsBucket
          PUBLIC_ARTIFACTS_PREFIX: !Ref PublicArtifactsPrefix
          PUBLIC_ARTIFACTS_REGION: !Ref AWS::Region
          # Cache TTL (seconds) for the in-process result cache.
          VERSION_CHECK_CACHE_TTL: "600"
      # Grant signed-S3 access to the configured artifacts bucket as a
      # fallback for when unsigned/anonymous reads aren't allowed (e.g.
      # private buckets like `idp-cli publish` creates with all public
      # access blocked). Only attached when PublicArtifactsBucket is
      # non-empty so headless / disabled builds get no policy.
      Policies:
        - !If
          - HasPublicArtifactsBucket
          - Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${PublicArtifactsBucket}"
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${PublicArtifactsBucket}/${PublicArtifactsPrefix}/*"
          - !Ref AWS::NoValue



  AgentProcessorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-AgentProcessor"
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !GetAtt CustomerManagedEncryptionKey.Arn

  # Lambda function for agent request handler
  AgentProcessorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function does not require VPC access as it only interacts with AWS services via APIs"
          - id: W92
            reason: "Function does not require reserved concurrency as it scales based on demand"
          - id: W58
            reason: "DLQ not required for Cfn Custom Resource function"
          - id: W76
            reason: "Suppressing W76: SPCM for IAM policy document is higher than 25"
          - id: W11
            reason: "Role requires * resource access for CloudWatch Metrics and Logs"
    # checkov:skip=CKV_AWS_116: "DLQ not required for analytics processor as it's invoked asynchronously by request handler with error handling and job status tracking in DynamoDB"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only configuration values like feature flags and non-sensitive settings"
    Properties:
      PermissionsBoundary:
        !If [
          HasPermissionsBoundary,
          !Ref PermissionsBoundaryArn,
          !Ref AWS::NoValue,
        ]
      CodeUri: src/lambda/agent_processor/
      Handler: index.handler
      Runtime: python3.12
      Timeout: 900

      Layers:
        - !Ref IDPCommonAgentsLayer
      MemorySize: 1024
      VpcConfig: !If
        - DeployInVPC
        - SubnetIds: !Ref PrivateSubnetIds
          SecurityGroupIds:
            - !Ref LambdaSecurityGroupId
        - !If
          - UsePrivateApi
          - SubnetIds: !Ref LambdaSubnetIds
            SecurityGroupIds:
              - !Ref LambdaVpcSecurityGroup
          - !Ref AWS::NoValue
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          CONFIGURATION_TABLE_NAME: !Ref ConfigurationTable
          TRACKING_TABLE_NAME: !Ref TrackingTable
          LOOKUP_FUNCTION_NAME: !Ref LookupFunction
          STRANDS_LOG_LEVEL: !Ref LogLevel
          AGENT_TABLE: !Ref AgentTable
          APPSYNC_API_URL: ""
          ATHENA_DATABASE: !Ref ReportingDatabase
          ATHENA_OUTPUT_LOCATION: !Sub
            - "s3://${Bucket}/athena-results/"
            - Bucket: !If
                - ShouldCreateReportingBucket
                - !Ref ReportingBucket
                - !Ref ReportingBucketName
          AWS_STACK_NAME: !Ref AWS::StackName
          GUARDRAIL_ID_AND_VERSION:
            !If [
              HasGuardrailConfig,
              !Sub "${BedrockGuardrailId}:${BedrockGuardrailVersion}",
              "",
            ]
          CLOUDWATCH_LOG_GROUP_PREFIX: !Sub "/aws/lambda/${AWS::StackName}"
          SETTINGS_PARAMETER_NAME: !Ref SettingsParameter
          BEDROCK_ASSUME_ROLE_ARN:
            !If [HasBedrockHubRole, !Ref BedrockHubRoleArn, !Ref AWS::NoValue]
          BEDROCK_ASSUME_ROLE_EXTERNAL_ID:
            !If [HasBedrockHubRoleExternalId, !Ref BedrockHubRoleExternalId, !Ref AWS::NoValue]
          BEDROCK_ASSUME_ROLE_SESSION_NAME:
            !If [HasBedrockHubRoleSessionName, !Ref BedrockHubRoleSessionName, !Ref AWS::NoValue]
      LoggingConfig:
        LogGroup: !Ref AgentProcessorLogGroup
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AgentTable
        - DynamoDBReadPolicy:
            TableName: !Ref ConfigurationTable
        - S3CrudPolicy:
            BucketName: !If
              - ShouldCreateReportingBucket
              - !Ref ReportingBucket
              - !Ref ReportingBucketName
        - Statement:
            - Effect: Allow
              Action:
                - athena:StartQueryExecution
                - athena:GetQueryExecution
                - athena:GetQueryResults
              Resource:
                - !Sub "arn:${AWS::Partition}:athena:${AWS::Region}:${AWS::AccountId}:workgroup/primary"
                - !Sub "arn:${AWS::Partition}:athena:${AWS::Region}:${AWS::AccountId}:datacatalog/*"
            - Effect: Allow
              Action:
                # PutMetricData for emit_control_plane_cost_metric on the
                # analytics agent's Athena calls. Scoped to the
                # IDPControlPlane namespace. Round-6 review fix — was
                # missing on Agent*ProcessorFunction, so every Athena call
                # AccessDenied on emit and control_plane_hourly showed 0
                # for analytics-agent's Athena spend.
                - cloudwatch:PutMetricData
              Resource: "*"
              Condition:
                StringEquals:
                  "cloudwatch:namespace": IDPControlPlane
            - Effect: Allow
              Action:
                - glue:GetTable
                - glue:GetTables
                - glue:GetDatabase
                - glue:GetDatabases
                - glue:GetPartitions
              Resource:
                - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog"
                - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${ReportingDatabase}"
                - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${ReportingDatabase}/*"
            # OpenAI GPT-5.x models are served via the bedrock-mantle endpoint
            # (OpenAI Responses API) and use a separate IAM action namespace.
            - Effect: Allow
              Action:
                - bedrock-mantle:CreateInference
                - bedrock-mantle:GetProject
                - bedrock-mantle:ListProjects
                - bedrock-mantle:ListTagsForResources
              Resource: "*"
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
                - bedrock:GetInferenceProfile
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:application-inference-profile/*"
            - Effect: Allow
              Action:
                - aws-marketplace:Subscribe
                - aws-marketplace:Unsubscribe
                - aws-marketplace:ViewSubscriptions
              Resource: "*"
            - !If
              - HasGuardrailConfig
              - Effect: Allow
                Action:
                  - "bedrock:ApplyGuardrail"
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/${BedrockGuardrailId}"
              - !Ref AWS::NoValue
            # Optional cross-account Bedrock invocation via hub-account role.
            - !If
              - HasBedrockHubRole
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: !Ref BedrockHubRoleArn
              - !Ref AWS::NoValue
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:ReEncrypt*
                - kms:GenerateDataKey*
                - kms:DescribeKey
              Resource: !GetAtt CustomerManagedEncryptionKey.Arn
            - Effect: Allow
              Action:
                - bedrock-agentcore:StartCodeInterpreterSession
                - bedrock-agentcore:StopCodeInterpreterSession
                - bedrock-agentcore:InvokeCodeInterpreter
                - bedrock-agentcore:GetCodeInterpreterSession
                - bedrock-agentcore:ListCodeInterpreterSessions
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock-agentcore:*:aws:code-interpreter/*"
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue  # pragma: allowlist secret - IAM action name, not a secret value
              Resource:
                - !Ref ExternalMCPAgentsSecret
            - Effect: Allow
              Action:
                - logs:DescribeLogGroups
                - logs:DescribeLogStreams
                - logs:FilterLogEvents
                - logs:GetLogEvents
              Resource:
                - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}*"
                - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/vendedlogs/states/${AWS::StackName}*"
                - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${AWS::StackName}*"
                - !GetAtt QueueSenderLogGroup.Arn
                - !GetAtt QueueProcessorLogGroup.Arn
                - !GetAtt WorkflowTrackerLogGroup.Arn
                - !GetAtt SaveReportingDataFunctionV2LogGroup.Arn
            - Effect: Allow
              Action:
                - logs:DescribeLogGroups
              Resource:
                - "*"
            - Effect: Allow
              Action:
                - dynamodb:DescribeTable
                - dynamodb:Scan
                - dynamodb:Query
                - dynamodb:GetItem
                - dynamodb:Query
              Resource:
                - !GetAtt TrackingTable.Arn
            - Effect: Allow
              Action:
                - cloudformation:DescribeStackResources
                - cloudformation:DescribeStacks
              Resource:
                - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*"
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}*"
            - Effect: Allow
              Action:
                - states:DescribeExecution
                - states:GetExecutionHistory
              Resource:
                - !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:${AWS::StackName}*"
            - Effect: Allow
              Action:
                - xray:GetTraceSummaries
                - xray:BatchGetTraces
                - xray:GetServiceGraph
              Resource: "*"
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${SettingsParameter}"

  ExternalAppClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: CreateExternalAppClient
    Properties:
      ClientName: "external-app-client"
      UserPoolId: !Ref UserPool
      GenerateSecret: true  # pragma: allowlist secret - Cognito generates the client secret; none stored here
      ExplicitAuthFlows:
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      SupportedIdentityProviders:
        - COGNITO
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs:
        - !Sub "https://${GetDomain.OutputString}.auth.${AWS::Region}.amazoncognito.com"
        - !If
          - UseCloudFrontHosting
          - !Sub "https://${CloudFrontDistribution.DomainName}/"
          - !Sub "${APIRESOLVERSTACK.Outputs.HttpApiEndpoint}/"
        # Custom domain entries — both with and without trailing slash because
        # browsers and OAuth libraries vary in normalisation. Cognito matches
        # callback URLs case-sensitively after exact-string compare, so we add
        # both forms to avoid a class of "redirect_mismatch" errors.
        - !If [HasCustomDomain, !Ref CustomDomainUrl, !Ref "AWS::NoValue"]
        - !If [HasCustomDomain, !Sub "${CustomDomainUrl}/", !Ref "AWS::NoValue"]
        - !Sub "https://${AWS::Region}.quicksight.aws.amazon.com/sn/oauthcallback"
        - https://us-east-1.quicksight.aws.amazon.com/sn/oauthcallback
        - https://us-west-2.quicksight.aws.amazon.com/sn/oauthcallback
        - https://eu-west-1.quicksight.aws.amazon.com/sn/oauthcallback
        - https://ap-southeast-2.quicksight.aws.amazon.com/sn/oauthcallback
      LogoutURLs:
        - !Sub "https://${GetDomain.OutputString}.auth.${AWS::Region}.amazoncognito.com"
        - !If
          - UseCloudFrontHosting
          - !Sub "https://${CloudFrontDistribution.DomainName}/"
          - !Sub "${APIRESOLVERSTACK.Outputs.HttpApiEndpoint}/"
        - !If [HasCustomDomain, !Ref CustomDomainUrl, !Ref "AWS::NoValue"]
        - !If [HasCustomDomain, !Sub "${CustomDomainUrl}/", !Ref "AWS::NoValue"]
        - !Sub "https://${AWS::Region}.quicksight.aws.amazon.com/sn/oauthcallback"
        - https://us-east-1.quicksight.aws.amazon.com/sn/oauthcallback
        - https://us-west-2.quicksight.aws.amazon.com/sn/oauthcallback
        - https://eu-west-1.quicksight.aws.amazon.com/sn/oauthcallback
        - https://ap-southeast-2.quicksight.aws.amazon.com/sn/oauthcallback

  MCPResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Condition: CreateAgentCoreLambda
    Properties:
      UserPoolId: !Ref UserPool
      Identifier: idp-mcp-connector
      Name: idp-mcp-connector
      Scopes:
        - ScopeName: access
          ScopeDescription: Full access to IDP MCP Connector

  MCPConnectorClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: CreateAgentCoreLambda
    DependsOn: MCPResourceServer
    Properties:
      ClientName: "mcp-connector-client"
      UserPoolId: !Ref UserPool
      GenerateSecret: true  # pragma: allowlist secret - Cognito generates the client secret; none stored here
      AllowedOAuthFlows:
        - client_credentials
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - idp-mcp-connector/access
      SupportedIdentityProviders:
        - COGNITO

  ##########################################################################
  # Cognito user authentication for REST API and WebUI
  ##########################################################################

  UserPool:
    Type: AWS::Cognito::UserPool
    Metadata:
      cfn-nag:
        rules_to_suppress:
          - id: W57 # MFA warning
            reason: "MFA configurations specific to target environment - disabled by default"
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-users
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: !If
          - ShouldAllowSignUpEmailDomain
          - false
          - true
        InviteMessageTemplate:
          EmailSubject: Welcome to GenAI-IDP!
          EmailMessage: !Sub
            - |-
              <p>Hello {username},</p>
              <p>Welcome to the AWS GenAIIDP Solution! Your temporary password is: <strong>{####}</strong></p>
              <p>When the CloudFormation stack is COMPLETE, use the link below to log in and set your permanent password.
              <p>     ${WebUIURL}
              <p>
              <p>Thanks,</p>
              <p>AWS GenAIIDP Team</p>
              <p>
              <p><em>Stack: ${AWS::StackName}, v<VERSION>, <BUILD_DATE_TIME></em>
            # WebUIURL for the invite email. In CloudFront mode this is the
            # distribution URL. In APIGateway mode the UI URL is an output of
            # APIRESOLVERSTACK, which is created AFTER the UserPool — referencing
            # it here would create a circular dependency — so we use the custom
            # domain when set, otherwise direct the user to the stack's
            # ApplicationWebURL output. (The email is only used for the initial
            # temporary-password login; the URL is always in the stack Outputs.)
            - WebUIURL: !If
                - UseCloudFrontHosting
                - !Sub "https://${CloudFrontDistribution.DomainName}/"
                - !If
                  - HasCustomDomain
                  - !Sub "${CustomDomainUrl}/"
                  - "The ApplicationWebURL is shown in the CloudFormation stack Outputs"
      AutoVerifiedAttributes:
        - email
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      EmailVerificationMessage: >-
        Please verify your email to complete account registration. Confirmation Code
        {####}.
      EmailVerificationSubject: >-
        Account Verification
      # LambdaConfig condition matrix (ShouldAllowSignUpEmailDomain × ShouldMapExternalIdPGroups):
      #   EmailDomain=Y, GroupMap=Y → PreAuth + PreSignUp + PreTokenGen
      #   EmailDomain=Y, GroupMap=N → PreAuth + PreSignUp only
      #   EmailDomain=N, GroupMap=Y → PreTokenGen only
      #   EmailDomain=N, GroupMap=N → no LambdaConfig (AWS::NoValue)
      LambdaConfig: !If
        - ShouldAllowSignUpEmailDomain
        - PreAuthentication: !GetAtt CognitoUserPoolEmailDomainVerifyFunction.Arn
          PreSignUp: !GetAtt CognitoUserPoolEmailDomainVerifyFunction.Arn
          PreTokenGeneration: !If
            - ShouldMapExternalIdPGroups
            - !GetAtt ExternalIdPGroupMappingFunction.Arn
            - !Ref AWS::NoValue
        - !If
          - ShouldMapExternalIdPGroups
          - PreTokenGeneration: !GetAtt ExternalIdPGroupMappingFunction.Arn
          - !Ref AWS::NoValue
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: false
          Required: true
        - Name: idp_groups
          AttributeDataType: String
          Mutable: true
          Required: false
          StringAttributeConstraints:
            MaxLength: "2048"
      UsernameConfiguration:
        CaseSensitive: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: ExternalIdentityProviderReady
    # MAINTENANCE NOTE: In APIGateway hosting mode the WebUIClientOAuthUrls custom
    # resource does a read-modify-write of this client (to add the execute-api
    # CallbackURLs/LogoutURLs post-deploy — see that resource). Its Lambda
    # preserves a fixed list of this client's writable properties when calling
    # UpdateUserPoolClient. If you add a new writable property here (e.g.
    # AuthSessionValidity, AnalyticsConfiguration), also add it to that Lambda's
    # preserve list (WebUIClientOAuthUrlsFunction InlineCode), or the custom
    # resource will silently reset it on update.
    Properties:
      ClientName: !Sub "${AWS::StackName}-Client"
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - openid
        - email
        - phone
        - profile
      # NOTE: APIGateway hosting URLs are NOT listed here. The Web UI's URL in
      # that mode is an output of APIRESOLVERSTACK, which (transitively, via
      # FeaturePlatformStack's UserPoolClient dependency) is created AFTER this
      # client — referencing it here would be a circular dependency. Instead the
      # WebUIClientOAuthUrls custom resource appends the API Gateway callback /
      # logout URLs to this client after both stacks exist. CloudFront hosting
      # has no such ordering constraint, so its URLs are declared inline.
      CallbackURLs:
        - !If
          - UseCloudFrontHosting
          - !Sub "https://${CloudFrontDistribution.DomainName}"
          - !Ref "AWS::NoValue"
        - !If
          - UseCloudFrontHosting
          - !Sub "https://${CloudFrontDistribution.DomainName}/"
          - !Ref "AWS::NoValue"
        # Custom domain — both forms (no trailing slash and trailing slash)
        # so OAuth redirects match regardless of how the browser normalises.
        - !If [HasCustomDomain, !Ref CustomDomainUrl, !Ref "AWS::NoValue"]
        - !If [HasCustomDomain, !Sub "${CustomDomainUrl}/", !Ref "AWS::NoValue"]
        # Placeholder so the list is never empty in APIGateway mode without a
        # custom domain (Cognito requires >=1 callback URL when OAuth flows are
        # enabled); the real URL is added by WebUIClientOAuthUrls post-deploy.
        - !If
          - UseApiGatewayHosting
          - !If [HasCustomDomain, !Ref "AWS::NoValue", "https://localhost/apigw-placeholder"]
          - !Ref "AWS::NoValue"
      LogoutURLs: !If
        - HasExternalIdP
        - - !If
            - UseCloudFrontHosting
            - !Sub "https://${CloudFrontDistribution.DomainName}"
            - !Ref "AWS::NoValue"
          - !If
            - UseCloudFrontHosting
            - !Sub "https://${CloudFrontDistribution.DomainName}/"
            - !Ref "AWS::NoValue"
          - !If [HasCustomDomain, !Ref CustomDomainUrl, !Ref "AWS::NoValue"]
          - !If [HasCustomDomain, !Sub "${CustomDomainUrl}/", !Ref "AWS::NoValue"]
        - !Ref AWS::NoValue
      AccessTokenValidity: 1
      EnableTokenRevocation: true
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      GenerateSecret: false # pragma: allowlist secret - CloudFormation parameter, not actual secret
      IdTokenValidity: 1
      PreventUserExistenceErrors: ENABLED
      ReadAttributes:
        - email
        - email_verified
        - preferred_username
        - given_name
        - family_name
        - !If
          - HasExternalIdP
          - custom:idp_groups
          - !Ref AWS::NoValue
      RefreshTokenValidity: 30
      SupportedIdentityProviders: !If
        - HasExternalIdP
        - - COGNITO
          - !Ref ExternalIdPName
        - - COGNITO
      UserPoolId: !Ref UserPool

  ##########################################################################
  # Web UI OAuth callback registration for APIGateway hosting.
  #
  # When WebUIHosting=APIGateway the Web UI URL is an output of
  # APIRESOLVERSTACK, which is created AFTER UserPoolClient (via the
  # FeaturePlatformStack -> UserPoolClient dependency chain). Declaring the API
  # Gateway callback/logout URLs directly on UserPoolClient would therefore be a
  # circular dependency. Instead this custom resource runs AFTER both stacks
  # exist and merges the API Gateway URLs into the existing client via a
  # read-modify-write (describe -> add URLs -> update). Nothing depends on this
  # resource, so it introduces no cycle. It also removes the creation-time
  # localhost placeholder. Only created for APIGateway hosting.
  ##########################################################################
  WebUIClientOAuthUrlsRole:
    Type: AWS::IAM::Role
    Condition: UseApiGatewayHosting
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub "lambda.${AWS::URLSuffix}"
            Action: sts:AssumeRole
      PermissionsBoundary:
        !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: ManageUserPoolClientCallbacks
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:DescribeUserPoolClient
                  - cognito-idp:UpdateUserPoolClient
                Resource: !GetAtt UserPool.Arn

  WebUIClientOAuthUrlsFunction:
    Type: AWS::Serverless::Function
    Condition: UseApiGatewayHosting
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function only calls Cognito control-plane APIs; no VPC access required"
          - id: W92
            reason: "Custom resource scales on demand; no reserved concurrency needed"
    # checkov:skip=CKV_AWS_116: "DLQ not required for Cfn Custom Resource function"
    # checkov:skip=CKV_AWS_117: "Function only calls AWS APIs; no VPC access required"
    # checkov:skip=CKV_AWS_115: "Reserved concurrency not required for a one-shot custom resource"
    Properties:
      PermissionsBoundary:
        !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      Description: !Sub "Registers API Gateway Web UI OAuth callback/logout URLs on the Cognito client for ${AWS::StackName}"
      Handler: index.handler
      Runtime: python3.12
      Timeout: 60
      MemorySize: 128
      Role: !GetAtt WebUIClientOAuthUrlsRole.Arn
      LoggingConfig:
        LogGroup: !Ref WebUIClientOAuthUrlsLogGroup
      InlineCode: |
        import boto3
        import cfnresponse

        PLACEHOLDER = "https://localhost/apigw-placeholder"
        cognito = boto3.client("cognito-idp")

        def _apply(pool_id, client_id, base_url, remove=False):
            # base_url ends with '/api'; register both with and without trailing
            # slash to tolerate browser/OAuth-lib normalisation differences.
            urls = {base_url, base_url + "/"}
            resp = cognito.describe_user_pool_client(
                UserPoolId=pool_id, ClientId=client_id
            )
            client = resp["UserPoolClient"]
            cb = set(client.get("CallbackURLs") or [])
            lo = set(client.get("LogoutURLs") or [])
            cb.discard(PLACEHOLDER)
            lo.discard(PLACEHOLDER)
            if remove:
                cb -= urls
                lo -= urls
            else:
                cb |= urls
                lo |= urls
            # Preserve every writable field cognito requires on update.
            update = {
                "UserPoolId": pool_id,
                "ClientId": client_id,
                "CallbackURLs": sorted(cb),
                "LogoutURLs": sorted(lo),
            }
            for k in (
                "ClientName", "RefreshTokenValidity", "AccessTokenValidity",
                "IdTokenValidity", "TokenValidityUnits", "ReadAttributes",
                "WriteAttributes", "ExplicitAuthFlows", "SupportedIdentityProviders",
                "AllowedOAuthFlows", "AllowedOAuthScopes",
                "AllowedOAuthFlowsUserPoolClient", "PreventUserExistenceErrors",
                "EnableTokenRevocation",
            ):
                if k in client:
                    update[k] = client[k]
            cognito.update_user_pool_client(**update)

        def handler(event, context):
            props = event.get("ResourceProperties", {})
            pool_id = props.get("UserPoolId")
            client_id = props.get("UserPoolClientId")
            base_url = (props.get("WebUIBaseUrl") or "").rstrip("/")
            try:
                if event["RequestType"] == "Delete":
                    if base_url:
                        _apply(pool_id, client_id, base_url, remove=True)
                else:
                    if base_url:
                        _apply(pool_id, client_id, base_url, remove=False)
                cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
            except Exception as e:  # noqa: BLE001
                # Never block stack delete on a best-effort URL cleanup.
                if event["RequestType"] == "Delete":
                    cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                else:
                    print(f"Error: {e}")
                    cfnresponse.send(event, context, cfnresponse.FAILED, {"Error": str(e)})

  WebUIClientOAuthUrlsLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: UseApiGatewayHosting
    Properties:
      KmsKeyId: !GetAtt CustomerManagedEncryptionKey.Arn
      RetentionInDays: !Ref LogRetentionDays

  WebUIClientOAuthUrls:
    Type: Custom::WebUIClientOAuthUrls
    Condition: UseApiGatewayHosting
    Properties:
      ServiceToken: !GetAtt WebUIClientOAuthUrlsFunction.Arn
      UserPoolId: !Ref UserPool
      UserPoolClientId: !Ref UserPoolClient
      # HttpApiEndpoint is ".../api"; the SPA is served at that path.
      WebUIBaseUrl: !GetAtt APIRESOLVERSTACK.Outputs.HttpApiEndpoint
      # Drift guard: UserPoolClient declaratively owns CallbackURLs/LogoutURLs
      # (which in APIGateway mode contain only the localhost placeholder), while
      # this custom resource merges in the execute-api URLs. If UserPoolClient is
      # re-materialized on a later stack update, CloudFormation would reset its
      # URL lists back to the placeholder. Changing this property on every
      # publish (BUILD_DATE_TIME is substituted at build time) forces the custom
      # resource to re-run on each deploy, so it re-applies the execute-api URLs
      # (its read-modify-write is idempotent and always removes the placeholder).
      Rerun: "<BUILD_DATE_TIME>"

  ##########################################################################
  # External Identity Provider (SAML/OIDC Federation)
  ##########################################################################

  # Custom Resource Lambda to resolve OIDC client secret from Secrets Manager at deploy time.
  # This avoids passing the secret as a CloudFormation parameter (visible via describe-stacks API).
  ResolveOIDCClientSecretFunction:
    Type: AWS::Serverless::Function
    Condition: IsExternalIdPOIDC
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function does not require VPC access as it only interacts with AWS services via APIs"
          - id: W92
            reason: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required for Cfn Custom Resource function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    Properties:
      PermissionsBoundary:
        !If [
          HasPermissionsBoundary,
          !Ref PermissionsBoundaryArn,
          !Ref AWS::NoValue,
        ]
      Description: Resolves OIDC client secret from Secrets Manager for Cognito IdP configuration
      Handler: index.handler
      Runtime: python3.12
      Timeout: 30
      MemorySize: 128
      LoggingConfig:
        LogGroup: !Ref ResolveOIDCClientSecretFunctionLogGroup
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue  # pragma: allowlist secret - IAM action name, not a secret value
              Resource: !Ref ExternalIdPOIDCClientSecretArn
      InlineCode: |
        import cfnresponse
        import boto3
        def handler(event, context):
            if event['RequestType'] == 'Delete':
                cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                return
            try:
                secret_arn = event['ResourceProperties']['SecretArn']
                client = boto3.client('secretsmanager')
                response = client.get_secret_value(SecretId=secret_arn)
                # Return secret value as a custom resource attribute (NoEcho by design)
                cfnresponse.send(event, context, cfnresponse.SUCCESS, {
                    'SecretValue': response['SecretString']
                })
            except Exception as e:
                cfnresponse.send(event, context, cfnresponse.FAILED, {}, reason=str(e))

  ResolveOIDCClientSecretFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: IsExternalIdPOIDC
    Properties:
      KmsKeyId: !GetAtt CustomerManagedEncryptionKey.Arn
      RetentionInDays: !Ref LogRetentionDays

  ResolveOIDCClientSecret:
    Type: Custom::ResolveSecret
    Condition: IsExternalIdPOIDC
    Properties:
      ServiceToken: !GetAtt ResolveOIDCClientSecretFunction.Arn
      SecretArn: !Ref ExternalIdPOIDCClientSecretArn

  # Create conditional dependency on ExternalIdentityProvider
  ExternalIdentityProviderReady:
    Type: AWS::CloudFormation::WaitConditionHandle
    Metadata:
      ConditionalDependency:
        !If [
          HasExternalIdP,
          !Ref ExternalIdentityProvider,
          "",
        ]

  ExternalIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasExternalIdP
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: !Ref ExternalIdPName
      ProviderType: !Ref ExternalIdPType
      ProviderDetails: !If
        - IsExternalIdPSAML
        - MetadataURL: !Ref ExternalIdPMetadataURL
        - client_id: !Ref ExternalIdPOIDCClientId
          client_secret: !GetAtt ResolveOIDCClientSecret.SecretValue
          oidc_issuer: !Ref ExternalIdPOIDCIssuer
          attributes_request_method: GET
          authorize_scopes: "openid email profile"
      AttributeMapping:
        email: !If
          - IsExternalIdPSAML
          - "http://schemas.xmlsoap.org/ws/2005/05/identity/claims/emailaddress"
          - "email"
        given_name: !If
          - IsExternalIdPSAML
          - "http://schemas.xmlsoap.org/ws/2005/05/identity/claims/givenname"
          - "given_name"
        family_name: !If
          - IsExternalIdPSAML
          - "http://schemas.xmlsoap.org/ws/2005/05/identity/claims/surname"
          - "family_name"
        custom:idp_groups: !If
          - HasExternalIdPGroupMapping
          - !Ref ExternalIdPGroupAttributeName
          - !Ref AWS::NoValue

  ExternalIdPGroupMappingFunction:
    Type: AWS::Serverless::Function
    Condition: ShouldMapExternalIdPGroups
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function does not require VPC access as it only interacts with AWS services via APIs"
          - id: W92
            reason: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required for Cognito trigger function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only group name mappings"
    Properties:
      PermissionsBoundary:
        !If [
          HasPermissionsBoundary,
          !Ref PermissionsBoundaryArn,
          !Ref AWS::NoValue,
        ]
      Description: Maps external IdP group claims to Cognito groups before token generation
      Handler: index.handler
      Runtime: python3.12
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          ADMIN_GROUP_NAME: !Ref ExternalIdPAdminGroupName
          AUTHOR_GROUP_NAME: !Ref ExternalIdPAuthorGroupName
          REVIEWER_GROUP_NAME: !Ref ExternalIdPReviewerGroupName
          VIEWER_GROUP_NAME: !Ref ExternalIdPViewerGroupName
      LoggingConfig:
        LogGroup: !Ref ExternalIdPGroupMappingFunctionLogGroup
      Policies: []
      InlineCode: |
        """Post-authentication Lambda trigger to map external IdP groups to Cognito groups."""
        import os
        import logging
        import boto3

        logger = logging.getLogger()
        logger.setLevel(os.environ.get("LOG_LEVEL", "INFO"))

        cognito = boto3.client("cognito-idp")

        # Mapping: external IdP group name -> Cognito group name
        GROUP_MAPPING = {}
        for env_key, cognito_group in [
            ("ADMIN_GROUP_NAME", "Admin"),
            ("AUTHOR_GROUP_NAME", "Author"),
            ("REVIEWER_GROUP_NAME", "Reviewer"),
            ("VIEWER_GROUP_NAME", "Viewer"),
        ]:
            idp_group = os.environ.get(env_key, "").strip()
            if idp_group:
                GROUP_MAPPING[idp_group] = cognito_group

        COGNITO_GROUPS = set(GROUP_MAPPING.values())


        def handler(event, context):
            """Handle pre-token-generation trigger from Cognito."""
            logger.info(f"Pre-token trigger source: {event.get('triggerSource')}")

            # Extract user pool ID from the event (avoids circular CloudFormation dependency)
            user_pool_id = event.get("userPoolId", "")
            username = event.get("userName", "")
            user_attributes = event.get("request", {}).get("userAttributes", {})
            idp_groups_raw = user_attributes.get("custom:idp_groups", "")

            if not idp_groups_raw:
                logger.info(f"No IdP groups claim for user {username}")
                return event

            # Parse IdP groups - handle comma-separated, JSON array, or single value
            idp_groups = []
            idp_groups_raw = idp_groups_raw.strip()
            if not idp_groups_raw:
                logger.info(f"No IdP groups claim for user {username}")
                return event
            if idp_groups_raw.startswith("["):
                import json
                try:
                    idp_groups = json.loads(idp_groups_raw)
                except Exception:
                    idp_groups = [g.strip().strip('"') for g in idp_groups_raw.strip("[]").split(",")]
            else:
                idp_groups = [g.strip() for g in idp_groups_raw.split(",")]

            logger.info(f"User {username} IdP groups: {idp_groups}")

            # Determine target Cognito groups from mapping
            target_groups = set()
            for idp_group in idp_groups:
                if idp_group in GROUP_MAPPING:
                    target_groups.add(GROUP_MAPPING[idp_group])

            if not target_groups:
                logger.warning(f"No matching Cognito groups for user {username} with IdP groups {idp_groups}")
                return event

            # Get current Cognito groups for user
            try:
                response = cognito.admin_list_groups_for_user(
                    UserPoolId=user_pool_id, Username=username
                )
                current_groups = {g["GroupName"] for g in response.get("Groups", [])}
            except Exception as e:
                logger.error(f"Failed to list groups for user {username}: {e}")
                return event

            # Add user to target groups they are not already in
            for group in target_groups - current_groups:
                try:
                    cognito.admin_add_user_to_group(
                        UserPoolId=user_pool_id, Username=username, GroupName=group
                    )
                    logger.info(f"Added user {username} to group {group}")
                except Exception as e:
                    logger.error(f"Failed to add user {username} to group {group}: {e}")

            # Remove user from managed groups they should no longer be in
            for group in (current_groups & COGNITO_GROUPS) - target_groups:
                try:
                    cognito.admin_remove_user_from_group(
                        UserPoolId=user_pool_id, Username=username, GroupName=group
                    )
                    logger.info(f"Removed user {username} from group {group}")
                except Exception as e:
                    logger.error(f"Failed to remove user {username} from group {group}: {e}")

            logger.info(f"User {username} group sync complete. Groups: {target_groups}")

            # Inject groups into the token so they are available immediately on first sign-in
            event.setdefault("response", {})
            event["response"]["claimsAndScopeOverrideDetails"] = {
                "groupOverrideDetails": {
                    "groupsToOverride": list(target_groups)
                }
            }

            return event

  ExternalIdPGroupMappingFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: ShouldMapExternalIdPGroups
    Properties:
      KmsKeyId: !GetAtt CustomerManagedEncryptionKey.Arn
      RetentionInDays: !Ref LogRetentionDays

  # Separate IAM policy scoped to the specific UserPool.
  # Defined as a standalone resource to avoid a circular dependency:
  # UserPool → LambdaConfig → Function → Role → UserPool
  ExternalIdPGroupMappingCognitoPolicy:
    Type: AWS::IAM::Policy
    Condition: ShouldMapExternalIdPGroups
    Properties:
      PolicyName: ExternalIdPGroupMappingCognitoAccess
      Roles:
        - !Ref ExternalIdPGroupMappingFunctionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - cognito-idp:AdminListGroupsForUser
              - cognito-idp:AdminAddUserToGroup
              - cognito-idp:AdminRemoveUserFromGroup
            Resource: !Sub "arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPool}"

  ExternalIdPGroupMappingPermission:
    Type: AWS::Lambda::Permission
    Condition: ShouldMapExternalIdPGroups
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ExternalIdPGroupMappingFunction
      Principal: !Sub "cognito-idp.${AWS::URLSuffix}"
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPool}"

  GetDomainLambda:
    DependsOn:
      - IsStacknameLengthOK
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function does not require VPC access as it only interacts with AWS services via APIs"
          - id: W92
            reason: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required for Cfn Custom Resource function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    Properties:
      PermissionsBoundary:
        !If [
          HasPermissionsBoundary,
          !Ref PermissionsBoundaryArn,
          !Ref AWS::NoValue,
        ]
      Description: Converts Stackname to lowercase and adds unique timestamp
      Handler: index.handler
      Runtime: python3.12
      Timeout: 30
      MemorySize: 128
      LoggingConfig:
        LogGroup: !Ref GetDomainLambdaLogGroup
      InlineCode: |
        import cfnresponse
        import time
        def handler(event, context):                                                    
            lowercase = event['ResourceProperties'].get('InputString', '').lower()
            lowercaseWithTimestamp = f"{lowercase}-{time.time_ns()}" # make unique
            responseData = {
              'Lowercase': lowercase, 
              'OutputString': lowercaseWithTimestamp, # don't change key - avoid UserPool update errors
            }                                            
            cfnresponse.send(event, context, cfnresponse.SUCCESS, responseData)

  GetDomainLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !GetAtt CustomerManagedEncryptionKey.Arn
      RetentionInDays: !Ref LogRetentionDays

  # Preserve CR name - avoid forcing UserPoolDomain update.
  GetDomain:
    Type: Custom::GetDomain
    Properties:
      ServiceToken: !GetAtt GetDomainLambda.Arn
      InputString: !Ref AWS::StackName

  UserPoolDomain:
    Type: "AWS::Cognito::UserPoolDomain"
    Properties:
      Domain: !GetAtt GetDomain.OutputString
      UserPoolId: !Ref UserPool

  IdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: !Sub "${AWS::StackName}-IdentityPool"
      AllowUnauthenticatedIdentities: false
      CognitoIdentityProviders:
        - ClientId: !Ref UserPoolClient
          ProviderName: !GetAtt UserPool.ProviderName

  CognitoIdentityPoolSetRole:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref IdentityPool
      Roles:
        authenticated: !GetAtt CognitoAuthorizedRole.Arn

  CognitoAuthorizedRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        # Cognito Identity's federated service principal (and matching OIDC
        # condition-key namespace) differs PER REGION, not just per
        # partition — GovCloud docs
        # (docs.aws.amazon.com/govcloud-us/latest/UserGuide/govcloud-cog.html)
        # give each GovCloud region its own principal. Verified against a
        # live us-gov-west-1 deployment: the commercial principal
        # (cognito-identity.amazonaws.com) passes CloudFormation validation
        # silently, but IAM never lets the identity pool assume the role —
        # the browser's IdentityPool.credsForOIDCTokens call then fails at
        # login with InvalidIdentityPoolConfigurationException. Rather than
        # branch on AWS::Region (which would require Conditions + Fn::If
        # around every statement, since map/object keys can't be built with
        # intrinsics), list one statement per known principal — only the
        # one matching the deploy region's actual federated caller is ever
        # exercised by STS; the others are inert.
        #
        # The GovCloud statements ARE inert for STS at runtime, but they are NOT
        # inert at deploy time: they are part of the trust-policy document, so
        # listing them unconditionally made a commercial stack UPDATE rewrite the
        # document and call iam:UpdateAssumeRolePolicy. Under a CFN service role
        # or permissions boundary without that action the update fails and the
        # stack wedges in UPDATE_ROLLBACK_FAILED (issue #632). They are therefore
        # gated on IsGovCloudPartition, which makes the rendered commercial
        # document byte-identical to the pre-GovCloud one (no diff -> no
        # UpdateAssumeRolePolicy call). Both statements stay present on GovCloud:
        # the principal is per-region, and gating them on region instead would
        # churn the trust policy of already-deployed GovCloud stacks for no gain.
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action:
              - sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "cognito-identity.amazonaws.com:aud": !Ref IdentityPool
              "ForAnyValue:StringLike":
                "cognito-identity.amazonaws.com:amr": authenticated
          - !If
            - IsGovCloudPartition
            - Effect: Allow
              Principal:
                Federated: cognito-identity-us-gov.amazonaws.com
              Action:
                - sts:AssumeRoleWithWebIdentity
              Condition:
                StringEquals:
                  "cognito-identity-us-gov.amazonaws.com:aud": !Ref IdentityPool
                "ForAnyValue:StringLike":
                  "cognito-identity-us-gov.amazonaws.com:amr": authenticated
            - !Ref "AWS::NoValue"
          - !If
            - IsGovCloudPartition
            - Effect: Allow
              Principal:
                Federated: cognito-identity.us-gov-east-1.amazonaws.com
              Action:
                - sts:AssumeRoleWithWebIdentity
              Condition:
                StringEquals:
                  "cognito-identity.us-gov-east-1.amazonaws.com:aud": !Ref IdentityPool
                "ForAnyValue:StringLike":
                  "cognito-identity.us-gov-east-1.amazonaws.com:amr": authenticated
            - !Ref "AWS::NoValue"
      PermissionsBoundary:
        !If [
          HasPermissionsBoundary,
          !Ref PermissionsBoundaryArn,
          !Ref AWS::NoValue,
        ]
      Policies:
        # Allow the authenticated Cognito Identity Pool role to invoke the chat
        # streaming Function URL (AuthType=AWS_IAM) under the httpapi transport.
        # This is the identity-side grant the SigV4-signed browser request needs.
        #
        # NB: a Function URL invocation requires lambda:InvokeFunction — NOT
        # lambda:InvokeFunctionUrl. The latter gates the FunctionUrlConfig, not
        # the invoke; granting only InvokeFunctionUrl yields a 403
        # AccessDeniedException at invoke time (verified against the live
        # us-west-2 Function URL: InvokeFunctionUrl alone -> 403,
        # InvokeFunction -> 200). InvokeFunctionUrl is kept for completeness.
        - PolicyName: ChatStreamInvoke
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                  - lambda:InvokeFunctionUrl
                Resource: !GetAtt ChatStreamProcessorFunction.Arn
        - PolicyName: S3
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - "s3:GetObject"
                  # s3:GetObjectVersion is required for the browser to fetch a
                  # specific object version via a client-presigned URL
                  # (?versionId=...) — used to view a past document version's
                  # page images. Without it, versioned image loads get
                  # AccessDenied and render blank.
                  - "s3:GetObjectVersion"
                  - "s3:ListBucket"
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${OutputBucket}"
                  - !Sub "arn:${AWS::Partition}:s3:::${OutputBucket}/*"
                  - !Sub "arn:${AWS::Partition}:s3:::${InputBucket}"
                  - !Sub "arn:${AWS::Partition}:s3:::${InputBucket}/*"
                  - !Sub "arn:${AWS::Partition}:s3:::${ConfigurationBucket}"
                  - !Sub "arn:${AWS::Partition}:s3:::${ConfigurationBucket}/*"
              - Effect: Allow
                Action:
                  - kms:Encrypt
                  - kms:Decrypt
                  - kms:ReEncrypt*
                  - kms:GenerateDataKey*
                  - kms:DescribeKey
                Resource: !GetAtt CustomerManagedEncryptionKey.Arn
        - PolicyName: ParameterStore
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - "ssm:GetParameter"
                Resource:
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${SettingsParameter}"

  AdminUser:
    Type: AWS::Cognito::UserPoolUser
    DependsOn: CognitoUserPoolEmailDomainVerifyPermissionReady
