  ##########################################################################
  # Metering hour-partition migration — on stack upgrade from a pre-hour-
  # partition version, relocates historical `date=X/*.parquet` files into
  # `date=X/hour=HH/` subdirs so the new Glue projection can see them.
  # Fresh installs no-op immediately (empty bucket). See §2.3.
  ##########################################################################

  MeteringHourMigrationFunction:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function does not require VPC access as it only interacts with AWS services via APIs"
          - id: W92
            reason: "Function does not require reserved concurrency (one-shot CFN custom resource)"
    # checkov:skip=CKV_AWS_116: "DLQ not required for Cfn Custom Resource function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_173: "Environment variables contain non-sensitive configuration values"
    Properties:
      PermissionsBoundary:
        !If [
          HasPermissionsBoundary,
          !Ref PermissionsBoundaryArn,
          !Ref AWS::NoValue,
        ]
      Handler: index.handler
      Runtime: python3.12
      CodeUri: ./src/lambda/metering_hour_migration
      Description: >-
        One-shot migration for the metering hour-partition upgrade. Runs as a
        CFN custom resource; blocks stack update until historical Parquet files
        are relocated into date=X/hour=HH/ subdirs.
      MemorySize: 3008
      Timeout: 900
      # Layer supplies pyarrow (needed to read the hour from each Parquet's
      # timestamp column). MUST be the reporting layer — the base layer does
      # NOT include pyarrow, and picking the wrong one causes every file to
      # fall through to the hour=00 park path, silently losing hour precision.
      Layers:
        - !Ref IDPCommonReportingLayer
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
      LoggingConfig:
        LogGroup: !Ref MeteringHourMigrationFunctionLogGroup
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource:
                - !If
                  - ShouldCreateReportingBucket
                  - !GetAtt ReportingBucket.Arn
                  - !Sub "arn:${AWS::Partition}:s3:::${ReportingBucketName}"
            - Effect: Allow
              Action:
                # Copy-then-delete migration: reads the source parquet's
                # timestamp column to infer the hour, PutObject at the new
                # `date=X/hour=HH/` key, then DeleteObject on the original.
                # Athena reads a partition location recursively, so leaving
                # originals in place would cause a rolled-back Glue table
                # (reverted to `date=X/`) to double-scan; the delete is what
                # makes rollback correct.
                - s3:GetObject
                - s3:PutObject
                - s3:DeleteObject
              Resource:
                - !If
                  - ShouldCreateReportingBucket
                  - !Sub "${ReportingBucket.Arn}/metering/*"
                  - !Sub "arn:${AWS::Partition}:s3:::${ReportingBucketName}/metering/*"
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:ReEncrypt*
                - kms:GenerateDataKey*
                - kms:DescribeKey
              # Round-11 review fix: also grant on a customer-supplied
              # KMS key when ReportingBucketName is a BYO bucket
              # encrypted with the customer's own key. We can't inline
              # ``!If`` inside a list-of-strings in a SAM Statement
              # cleanly, so we use ``AWS::NoValue`` — the resulting
              # Resource list drops the extra ARN when it's empty.
              Resource:
                - !GetAtt CustomerManagedEncryptionKey.Arn
                - !If
                  - HasReportingBucketKmsKey
                  - !Ref ReportingBucketKmsKeyArn
                  - !Ref AWS::NoValue

  MeteringHourMigrationFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !GetAtt CustomerManagedEncryptionKey.Arn
      RetentionInDays: !Ref LogRetentionDays

  MeteringHourMigrationCustomResource:
    Type: Custom::MeteringHourMigration
    # DependsOn the metering WRITER, not just the reader. The migration takes a
    # one-shot snapshot of the old-layout key list; any metering row written
    # AFTER that listing but BEFORE the writer is upgraded lands at
    # `metering/date=X/*.parquet` (old layout) and is then unreachable by the
    # new `date=X/hour=HH/` projection — a silent, permanent hole in cost and
    # volume data for every document processed during the update.
    #
    # `SaveReportingDataFunctionV2` is the SOLE writer of `metering/` parquet
    # (`idp_common.reporting.save_reporting_data.save_metering_data` has exactly
    # one caller), and CFN gave it no ordering relationship to this resource, so
    # that window was the whole stack update — tens of minutes on this stack.
    # Forcing the writer to update first makes the new layout live before the
    # snapshot is taken. Full ordering is now:
    #   SaveReportingDataFunctionV2 → this migration → MeteringTable projection
    #
    # Residual window: Lambda finishes in-flight invocations on the PREVIOUS
    # code version, so a container that started just before the update can
    # still emit one old-layout file (seconds to minutes, not the whole
    # update). A deployment that ingests continuously should re-run
    # `scripts/migrate_metering_hour_partition.py` once the update completes —
    # it is idempotent. See docs/reporting-sql-layer.md §2.3.
    DependsOn: SaveReportingDataFunctionV2
    Properties:
      ServiceToken: !GetAtt MeteringHourMigrationFunction.Arn
      # Match the Lambda's own Timeout (900s) — the CFN default is 3600s,
      # so if the Lambda died mid-migration the stack update would stall
      # for up to an hour waiting for a response the dead worker never
      # sent. Round-8 review fix.
      ServiceTimeout: 900
      # Reporting bucket the migration walks.
      ReportingBucket: !If
        - ShouldCreateReportingBucket
        - !Ref ReportingBucket
        - !Ref ReportingBucketName
      # MigrationVersion — CFN only sends an Update to a custom resource
      # when one of its properties changes. Bump this string when the
      # migration logic itself changes so existing stacks re-run against
      # NEW old-layout files (those still lacking ``/hour=`` in their
      # key). The migration is idempotent for those — ``_iter_old_layout_keys``
      # uses S3 ``Delimiter="/hour="`` to server-side-exclude any key
      # already under a ``/hour=NN/`` subprefix.
      #
      # 1.1: bumped alongside the layer fix (Base → Reporting). The 1.0
      # deploy silently parked every file at hour=00 because pyarrow
      # was absent from the base layer; the handler now fails loudly if
      # pyarrow is missing (round-3 fix). Round-11 review clarification:
      # a bump does NOT rescue files ALREADY parked at hour=00 by a bad
      # 1.0 run — the same ``Delimiter="/hour="`` filter that makes
      # re-runs idempotent excludes those files. Since 1.0 never shipped
      # to any customer, this is a documented Phase-2 hardening gap
      # rather than a live-fire recovery path. If a customer ever needs
      # to rescue hour=00 files, they will need a purpose-built script
      # that lists the ``hour=00`` prefix and re-infers hour from each
      # file's own timestamp column (not shipped today).
      MigrationVersion: "1.1-hour-partition-inference-fix"

  ##########################################################################
  # Data Mart Rollup Lambda — hourly + daily aggregations for the IDP Monitor
  # dashboard. See docs/reporting-sql-layer.md.
  ##########################################################################

  DataMartRollupFunction:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function only interacts with AWS APIs (Athena, Glue, CloudWatch, S3) — no VPC needed"
          - id: W92
            reason: "ReservedConcurrentExecutions=1 already pins concurrency; the setting is present, not absent"
          - id: W12
            reason: "cloudwatch:GetMetricData and resourcegroupstaggingapi:GetResources require * resource — no partition-level scoping available"
      # checkov:skip=CKV_AWS_116: "Not SQS-triggered; DLQ not applicable to EventBridge scheduled invocations"
      # checkov:skip=CKV_AWS_117: "Function does not require VPC access"
      # checkov:skip=CKV_AWS_115: "Concurrency pinned to 1 to prevent idempotency check race — no headroom desired"
      # checkov:skip=CKV_AWS_173: "Environment variables contain only configuration"
    Properties:
      PermissionsBoundary:
        !If [
          HasPermissionsBoundary,
          !Ref PermissionsBoundaryArn,
          !Ref AWS::NoValue,
        ]
      Handler: index.handler
      Runtime: python3.12
      CodeUri: ./src/lambda/data_mart_rollup
      Description: Data-mart rollup Lambda — populates metering_hourly, metering_daily, control_plane_hourly, and data_plane_lambda_hourly tables.
      MemorySize: 512
      Timeout: 900
      Tracing: Active
      Layers:
        # pyarrow + boto3 + idp_common (metrics helper etc.). Same layer the
        # migration Lambda uses. Bundling pyarrow in this function too would
        # blow the 250 MB "code + layers" limit on any in-place update that
        # already had bundled pyarrow deployed — for a fresh install
        # (every external customer's first deploy of this Phase 1 feature)
        # CreateFunction is called with new code + new layer only, so
        # 171 MB (layer) + tiny code = well under 250 MB.
        - !Ref IDPCommonReportingLayer
      # Pin to 1 concurrent execution so a scheduled invocation racing with
      # an async retry cannot both pass the pre-INSERT idempotency check
      # (SELECT ... LIMIT 1) and double-write metering_hourly rows.
      #
      # This is LOAD-BEARING, not belt-and-braces — do not remove it without
      # replacing the guarantee. Reserved concurrency itself is free (only
      # PROVISIONED concurrency is billed), so there is no cost argument for
      # dropping it. What it covers that nothing else does:
      #
      # 1. The Athena `ClientRequestToken` dedup in `_run_athena` protects the
      #    four INSERT-INTO tables, EXCEPT on the cached-failure restart path,
      #    which appends a wall-clock-second salt (`-r<unix seconds>`). Two
      #    concurrent restarts landing in different seconds get different
      #    tokens and would both write. The salt cannot be made
      #    invocation-stable: it must DIFFER across sequential retries (that is
      #    what breaks Athena's cached-failure lock) while being the SAME for
      #    concurrent duplicates of one attempt. See the `fresh_salt` comment
      #    in src/lambda/data_mart_rollup/index.py.
      # 2. It serializes the 00:05 hourly against the 00:15 daily. The hourly's
      #    900s timeout makes that overlap reachable, and a daily reading a
      #    half-written hour 23 trips `_require_hourly_matches_raw_metering`.
      #
      # (The two parquet tables can't double-count regardless — both write a
      # fixed `data.parquet` key per partition, so a second writer overwrites
      # rather than appending.)
      #
      # Deploy-time caveat: Lambda rejects a reservation that would drop the
      # ACCOUNT's unreserved concurrency below 100, so on an account already
      # carrying heavy reservations this makes stack update fail with
      # "decreases account's UnreservedConcurrentExecution below its minimum
      # value of [100]". Raise the account concurrency limit rather than
      # removing this property.
      ReservedConcurrentExecutions: 1
      # Async failures (Athena down for all 3 async retries) land in the
      # DLQ so an operator sees the data-hole instead of the hour silently
      # disappearing forever behind the per-partition idempotency skip.
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        # Cap async retry age at 1h so a throttled invocation
        # (ReservedConcurrentExecutions: 1 + a still-running previous
        # invoke) doesn't silently retry against Lambda's 6h default
        # MaximumEventAge — that would push a data-hole DLQ signal
        # hours past when the operator needs to see it.
        MaximumEventAgeInSeconds: 3600
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt DataMartRollupDLQ.Arn
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          REPORTING_DATABASE: !Ref ReportingDatabase
          ATHENA_WORKGROUP: primary
          ATHENA_QUERY_OUTPUT_LOCATION: !Sub
            - "s3://${Bucket}/athena_query_results/"
            - Bucket: !If
                - ShouldCreateReportingBucket
                - !Ref ReportingBucket
                - !Ref ReportingBucketName
          REPORTING_BUCKET: !If
            - ShouldCreateReportingBucket
            - !Ref ReportingBucket
            - !Ref ReportingBucketName
          STACK_NAME: !Ref AWS::StackName
          # Rollup reads Bedrock per-token pricing from here — the same
          # source of truth as data-plane cost math — instead of a
          # hardcoded map that would drift as new models ship.
          CONFIGURATION_TABLE_NAME: !Ref ConfigurationTable
      LoggingConfig:
        LogGroup: !Ref DataMartRollupFunctionLogGroup
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - athena:StartQueryExecution
                - athena:GetQueryExecution
                - athena:GetQueryResults
                - athena:StopQueryExecution
              Resource:
                - !Sub "arn:${AWS::Partition}:athena:${AWS::Region}:${AWS::AccountId}:workgroup/primary"
            - Effect: Allow
              Action:
                - glue:GetDatabase
                - glue:GetTable
                - glue:GetPartitions
                - glue:CreatePartition
                - glue:BatchCreatePartition
              Resource:
                - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog"
                - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${ReportingDatabase}"
                - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${ReportingDatabase}/*"
            - Effect: Allow
              Action:
                - cloudwatch:GetMetricData
                - cloudwatch:ListMetrics
              # GetMetricData does not support resource-level scoping.
              Resource: "*"
            - Effect: Allow
              Action:
                # PutMetricData for the rollup Lambda's own self-cost emission
                # (idp_common.metrics.emit_control_plane_cost_metric with
                # component='rollup-lambda'). Without this, the metric never
                # lands and control_plane_hourly has no rollup-lambda row —
                # the rollup's own Athena spend goes invisible. cloudwatch
                # PutMetricData does not support resource-level scoping.
                - cloudwatch:PutMetricData
              Resource: "*"
              Condition:
                StringEquals:
                  "cloudwatch:namespace": IDPControlPlane
            - Effect: Allow
              Action:
                - tag:GetResources
              # Tag API is account-scoped; no resource-level scoping available.
              Resource: "*"
            - Effect: Allow
              Action:
                - cloudformation:ListStackResources
              # Rollup walks the CFN stack tree (root + nested) to discover
              # all IDP Lambdas — nested-stack Lambdas carry the nested
              # stack's aws:cloudformation:stack-name tag, not the root's,
              # so a tag query on just STACK_NAME misses 57 of 68 Lambdas
              # on a typical topology. Scoped to this stack's tree.
              #
              # Round-10 note: the ``${AWS::StackName}-*`` wildcard is
              # necessary — CFN generates nested-stack names as
              # ``<parent>-<LogicalId>-<random>`` and we don't know the
              # random suffixes at IaC time. Side effect: any
              # co-existing TOP-LEVEL stack whose name starts with
              # ``${AWS::StackName}-`` would also be listable by this
              # role. There's no cleaner IAM alternative (ListStack-
              # Resources doesn't support resource conditions), and the
              # blast radius is read-only listing of resource names.
              # Deploy convention: don't name coexisting stacks with the
              # same prefix.
              Resource:
                - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*"
                - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}-*/*"
            - Effect: Allow
              Action:
                - lambda:GetFunctionConfiguration
              # Rollup reads MemorySize from each control-plane Lambda in the
              # stack to compute an accurate GB-second Lambda cost estimate
              # (vs. the previous fixed 512 MB assumption). Scoped to functions
              # in this account/region; the rollup's tag-based discovery
              # bounds the actual call set to this stack.
              Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:*"
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:ListBucket
                # HeadObject (the `_s3_object_exists` / `_query_wrote_manifest`
                # probes) is authorized by s3:GetObject — there is no
                # `s3:HeadObject` IAM action, so the entry that used to sit here
                # was inert.
                #
                # Multipart actions are part of AWS's reference policy for
                # Athena `INSERT INTO`: the writer switches to a multipart
                # upload once a result part exceeds its buffer. Today's rollup
                # output is a few KB so it always takes the single-PUT path,
                # which is why this has not bitten yet — but a stack with many
                # (config_version, service_api, unit) combinations per hour
                # would fail the INSERT rather than degrade.
                - s3:AbortMultipartUpload
                - s3:ListBucketMultipartUploads
                - s3:ListMultipartUploadParts
                # Required for Athena StartQueryExecution — it calls
                # GetBucketLocation on the OutputLocation bucket to verify
                # the workgroup can write results there before running the
                # query. Without this, StartQueryExecution fails at the
                # "verify/create output bucket" precheck.
                - s3:GetBucketLocation
              Resource:
                - !If
                  - ShouldCreateReportingBucket
                  - !GetAtt ReportingBucket.Arn
                  - !Sub "arn:${AWS::Partition}:s3:::${ReportingBucketName}"
                - !If
                  - ShouldCreateReportingBucket
                  - !Sub "${ReportingBucket.Arn}/*"
                  - !Sub "arn:${AWS::Partition}:s3:::${ReportingBucketName}/*"
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:ReEncrypt*
                - kms:GenerateDataKey*
                - kms:DescribeKey
              # Round-13 review fix: match the sibling
              # MeteringHourMigrationFunction grant — a BYO
              # ReportingBucketName encrypted with a customer-owned
              # KMS key needs decrypt on that key for the rollup to
              # write control_plane_hourly parquet and read the query
              # output. AWS::NoValue drops the extra Resource entry
              # when no BYO key is supplied.
              Resource:
                - !GetAtt CustomerManagedEncryptionKey.Arn
                - !If
                  - HasReportingBucketKmsKey
                  - !Ref ReportingBucketKmsKeyArn
                  - !Ref AWS::NoValue
        # Read pricing from the ConfigurationTable (same source data-plane
        # cost math uses) so Bedrock per-token prices in control_plane_hourly
        # cannot drift from a hardcoded rollup-side map.
        - DynamoDBReadPolicy:
            TableName: !Ref ConfigurationTable

  DataMartRollupFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !GetAtt CustomerManagedEncryptionKey.Arn
      RetentionInDays: !Ref LogRetentionDays

  # Dead-letter queue for the rollup Lambda's async invocations. Async
  # retries at ~1min and ~5min: if all fail (e.g., Athena outage), the
  # event lands here and the CloudWatch alarm below pages the operator.
  # Without this, that hour's data would be silently missing forever,
  # since the per-partition idempotency check would skip on any manual
  # retry.
  DataMartRollupDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-data-mart-rollup-dlq"
      MessageRetentionPeriod: 1209600  # 14 days (SQS max)
      KmsMasterKeyId: !Ref CustomerManagedEncryptionKey

  DataMartRollupDLQPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref DataMartRollupDLQ
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub lambda.${AWS::URLSuffix}
            Action: sqs:SendMessage
            Resource: !GetAtt DataMartRollupDLQ.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt DataMartRollupFunction.Arn

  DataMartRollupDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-data-mart-rollup-dlq-depth"
      AlarmDescription: >-
        Data-mart rollup Lambda's async retries all failed for at least
        one scheduled invocation. Historical cost/volume data for that
        hour or day is missing. Check the rollup Lambda log for the root
        cause and re-invoke manually once resolved.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt DataMartRollupDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      OKActions:
        - !Ref AlertsTopic

  # Hourly rollup: writes metering_hourly and control_plane_hourly for the
  # previous fully-sealed UTC hour. Fires at minute 5 to give in-flight
  # doc-completions a moment to land in metering before the aggregation reads.
  DataMartRollupHourlySchedule:
    Type: AWS::Events::Rule
    # Guard against a race during stack UPDATE: this rule stays ACTIVE across
    # the entire update, so its cron can fire while the MeteringTable's new
    # ``hour`` partition-key change (and the raw-file migration) is still in
    # progress — the rollup's INSERT queries reference ``metering.hour`` and
    # would fail with "column not found". Round-11 review fix: also wait
    # for every rollup TARGET table (fresh install can otherwise fire the
    # first cron before the write-target tables commit — INSERT would
    # then fail with TABLE_NOT_FOUND which fail-open masks, then re-INSERT
    # against the freshly-created table on the retry).
    DependsOn:
      - MeteringHourMigrationCustomResource
      - MeteringTable
      - MeteringHourlyTable
      - MeteringDailyTable
      - MeteringDocsHourlyTable
      - MeteringDocsDailyTable
      - ControlPlaneHourlyTable
      - DataPlaneLambdaHourlyTable
    Properties:
      Description: Hourly trigger for the data-mart rollup Lambda.
      ScheduleExpression: "cron(5 * * * ? *)"
      State: ENABLED
      Targets:
        - Id: DataMartRollupHourly
          Arn: !GetAtt DataMartRollupFunction.Arn
          # InputTransformer (not literal Input) so ``$.time`` from the
          # scheduled event reaches the handler. Without this the handler's
          # anchor-time logic degrades to ``datetime.now()`` on every
          # invocation, and an async retry crossing an hour boundary silently
          # rolls up the WRONG partition. Round-5 review fix.
          InputTransformer:
            InputPathsMap:
              time: "$.time"
            InputTemplate: '{"mode": "hourly", "time": <time>}'

  DataMartRollupHourlyPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DataMartRollupFunction
      Action: lambda:InvokeFunction
      Principal: !Sub events.${AWS::URLSuffix}
      SourceArn: !GetAtt DataMartRollupHourlySchedule.Arn

  # Daily rollup: writes metering_daily for the previous fully-sealed UTC day.
  # Fires at 00:15 to allow the 23:xx hourly rollup to complete first.
  DataMartRollupDailySchedule:
    Type: AWS::Events::Rule
    # See the hourly schedule above for the DependsOn rationale.
    DependsOn:
      - MeteringHourMigrationCustomResource
      - MeteringTable
      - MeteringHourlyTable
      - MeteringDailyTable
      - MeteringDocsHourlyTable
      - MeteringDocsDailyTable
      - ControlPlaneHourlyTable
      - DataPlaneLambdaHourlyTable
    Properties:
      Description: Daily trigger for the data-mart rollup Lambda (metering_daily).
      ScheduleExpression: "cron(15 0 * * ? *)"
      State: ENABLED
      Targets:
        - Id: DataMartRollupDaily
          Arn: !GetAtt DataMartRollupFunction.Arn
          # See the hourly schedule above for the InputTransformer rationale.
          InputTransformer:
            InputPathsMap:
              time: "$.time"
            InputTemplate: '{"mode": "daily", "time": <time>}'

  DataMartRollupDailyPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DataMartRollupFunction
      Action: lambda:InvokeFunction
      Principal: !Sub events.${AWS::URLSuffix}
      SourceArn: !GetAtt DataMartRollupDailySchedule.Arn

  DocumentSectionsCrawlerSecurityConfigurationV2:
    Type: AWS::Glue::SecurityConfiguration
    # checkov:skip=CKV_AWS_99:Encryption is already enabled with SSE-KMS
    Properties:
      Name: !Sub "${AWS::StackName}-document-sections-crawler-security-config-v2"
      EncryptionConfiguration:
        S3Encryptions:
          - S3EncryptionMode: SSE-KMS
            KmsKeyArn: !GetAtt CustomerManagedEncryptionKey.Arn

  DocumentSectionsCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: !Sub "${AWS::StackName}-document-sections-crawler"
      Description: "Crawler to discover document section tables in the reporting bucket with conservative schema handling"
      Role: !GetAtt DocumentSectionsCrawlerRole.Arn
      DatabaseName: !Ref ReportingDatabase
      CrawlerSecurityConfiguration: !Ref DocumentSectionsCrawlerSecurityConfigurationV2
      Targets:
        S3Targets:
          - Path: !Sub
              - "s3://${Bucket}/document_sections/"
              - Bucket: !If
                  - ShouldCreateReportingBucket
                  - !Ref ReportingBucket
                  - !Ref ReportingBucketName
      SchemaChangePolicy:
        UpdateBehavior: "UPDATE_IN_DATABASE"
        DeleteBehavior: "LOG"
      TablePrefix: "document_sections_"
      Configuration: |
        {
          "Version": 1.0,
          "CrawlerOutput": {
            "Partitions": { "AddOrUpdateBehavior": "InheritFromTable" },
            "Tables": { "AddOrUpdateBehavior": "MergeNewColumns" }
          },
          "Grouping": { "TableLevelConfiguration": 3 },
          "CreatePartitionIndex": true
        }
      Schedule: !If
        - DocumentSectionsCrawlerScheduleEnabled
        - ScheduleExpression:
            !FindInMap [
              CrawlerScheduleMap,
              !Ref DocumentSectionsCrawlerFrequency,
              ScheduleExpression,
            ]
        - !Ref AWS::NoValue

  DocumentSectionsCrawlerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub "glue.${AWS::URLSuffix}"
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSGlueServiceRole"
      PermissionsBoundary:
        !If [
          HasPermissionsBoundary,
          !Ref PermissionsBoundaryArn,
          !Ref AWS::NoValue,
        ]
      Policies:
        - PolicyName: DocumentSectionsCrawlerS3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub
                    - "arn:${AWS::Partition}:s3:::${Bucket}"
                    - Bucket: !If
                        - ShouldCreateReportingBucket
                        - !Ref ReportingBucket
                        - !Ref ReportingBucketName
                  - !Sub
                    - "arn:${AWS::Partition}:s3:::${Bucket}/document_sections/*"
                    - Bucket: !If
                        - ShouldCreateReportingBucket
                        - !Ref ReportingBucket
                        - !Ref ReportingBucketName
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                Resource: !GetAtt CustomerManagedEncryptionKey.Arn

  EvaluationBaselineBucket:
    Type: AWS::S3::Bucket
    Condition: ShouldCreateEvaluationBaselineBucket
    UpdateReplacePolicy: Retain
    DeletionPolicy: RetainExceptOnCreate
    Properties:
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "Content-Type"
              - "x-amz-content-sha256"
              - "x-amz-date"
              - "Authorization"
              - "x-amz-security-token"
            # GET / HEAD are required so the Web UI can read baseline objects
            # via presigned URLs — e.g. the Document Details "Download Baselines"
            # button, which fetches section baselines directly from S3 into a
            # client-side ZIP.
            AllowedMethods:
              - PUT
              - POST
              - GET
              - HEAD
            AllowedOrigins:
              - !If
                - UseCloudFrontHosting
                - !Sub "https://${CloudFrontDistribution.DomainName}"
                # APIGateway hosting: the browser origin is the execute-api host
                # (scheme+host only — the /api stage path is not part of the CORS
                # Origin). A single-wildcard origin avoids a bucket->API-stack
                # dependency cycle while matching the REST API's regional host.
                - !Sub "https://*.execute-api.${AWS::Region}.${AWS::URLSuffix}"
              # For local development only
              - "http://localhost:3000"
              # Custom domain (e.g. customer-owned DNS alias, Okta SSO domain).
              # Empty CustomDomainUrl resolves to AWS::NoValue → list entry is
              # omitted so the array stays exactly as before for default deploys.
              - !If [HasCustomDomain, !Ref CustomDomainUrl, !Ref "AWS::NoValue"]
            ExposedHeaders:
              - "ETag"
              - "x-amz-server-side-encryption"
            MaxAge: 3000
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref CustomerManagedEncryptionKey
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Ref LoggingBucket
        LogFilePrefix: output-bucket-logs/
      # No lifecycle policy - retain baseline data permanently

  EvaluationBaselineBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: ShouldCreateEvaluationBaselineBucket
    Properties:
      Bucket: !Ref EvaluationBaselineBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EnforceSSLOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "${EvaluationBaselineBucket.Arn}/*"
              - !Sub "${EvaluationBaselineBucket.Arn}"
            Condition:
              Bool:
                "aws:SecureTransport": false

  WebUIBucket:
    Type: AWS::S3::Bucket
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - W3045
    Properties:
      AccessControl: Private
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      WebsiteConfiguration: !If
        - UseCloudFrontHosting
        - IndexDocument: index.html
          ErrorDocument: index.html
        - !Ref AWS::NoValue
      LoggingConfiguration:
        DestinationBucketName: !Ref LoggingBucket
        LogFilePrefix: webapp-bucket-logs/

  WebUIBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebUIBucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - !If
            - UseCloudFrontHosting
            - Effect: Allow
              Principal:
                Service: !Sub "cloudfront.${AWS::URLSuffix}"
              Action: s3:GetObject
              Resource: !Sub "${WebUIBucket.Arn}/*"
              Condition:
                StringEquals:
                  "AWS:SourceArn": !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"
            - !Ref AWS::NoValue
          - !If
            # APIGateway hosting: allow the API Gateway S3-proxy role to read the
            # SPA objects. Same-account access also works via the role's identity
            # policy (WebUIProxyRole), but the explicit resource grant keeps the
            # bucket's access model self-documenting and robust to future changes.
            - UseApiGatewayHosting
            - Effect: Allow
              Principal:
                AWS: !GetAtt WebUIProxyRole.Arn
              Action: s3:GetObject
              Resource: !Sub "${WebUIBucket.Arn}/*"
            - !Ref AWS::NoValue
          - Effect: "Deny"
            Action:
              - "s3:*"
            Principal: "*"
            Resource:
              - !GetAtt WebUIBucket.Arn
              - !Sub "${WebUIBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": false

  ##########################################################################
  # DynamoDB table for process tracking
  ##########################################################################

  TrackingTable:
    Type: AWS::DynamoDB::Table
    Properties:
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: InitialEventTime
          AttributeType: S
        - AttributeName: ItemType
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        # TypeDateIndex replaces both the old listDocuments scan and the HITLPendingReviewIndex.
        # Pending reviews use: ItemType='document' + time range + FilterExpression: HITLPendingReview='true'
        - IndexName: TypeDateIndex
          KeySchema:
            - AttributeName: ItemType
              KeyType: HASH
            - AttributeName: InitialEventTime
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - ObjectKey
              - ObjectStatus
              - CompletionTime
              - ConfigVersion
              - EvaluationStatus
              - NumPages
              - ConfidenceAlertCount
              - HITLTriggered
              - HITLCompleted
              - HITLStatus
              - HITLReviewOwner
              - HITLReviewedBy
              - TestRunId
              - TestSetName
              - CreatedAt
              - CompletedFiles
              - FailedFiles
              - FilesCount
              - Status
              - CompletedAt
              # NOTE: do NOT add attributes here on an existing stack. DynamoDB
              # rejects any GSI change other than throughput/Contributor Insights
              # with "Cannot update GSI's properties other than Provisioned
              # Throughput", which fails the whole stack update. Submission
              # provenance is therefore carried by the ItemType *key* rather than a
              # projected attribute — see idp_common.dynamodb.service. (Same reason
              # VersionCount is deliberately absent; see the Document type in
              # schema.graphql.)
      TimeToLiveSpecification:
        AttributeName: ExpiresAfter
        Enabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref CustomerManagedEncryptionKey

  ##########################################################################
  # GSI Attribute Backfill - Step Functions + Lambda for populating
  # TypeDateIndex and HITLPendingReviewIndex on existing items
  ##########################################################################

  BackfillWorkerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !GetAtt CustomerManagedEncryptionKey.Arn
      RetentionInDays: !Ref LogRetentionDays

  BackfillWorkerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function does not require VPC access as it only interacts with DynamoDB"
          - id: W92
            reason: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_116: "DLQ not required - Step Functions handles retries"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data"
    Properties:
      PermissionsBoundary:
        !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      Handler: index.lambda_handler
      Runtime: python3.12
      CodeUri: src/lambda/backfill_gsi_attributes/
      Timeout: 900
      MemorySize: 512
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
      LoggingConfig:
        LogGroup: !Ref BackfillWorkerFunctionLogGroup
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TrackingTable
        - Statement:
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:ReEncrypt*
                - kms:GenerateDataKey*
                - kms:DescribeKey
              Resource: !GetAtt CustomerManagedEncryptionKey.Arn

  BackfillStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub "states.${AWS::URLSuffix}"
            Action: sts:AssumeRole
      PermissionsBoundary:
        !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      Policies:
        - PolicyName: BackfillStateMachinePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt BackfillWorkerFunction.Arn

  BackfillStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "${AWS::StackName}-GSIBackfill"
      DefinitionUri: src/lambda/backfill_gsi_attributes/statemachine.asl.json
      DefinitionSubstitutions:
        BackfillWorkerFunctionArn: !GetAtt BackfillWorkerFunction.Arn
      Role: !GetAtt BackfillStateMachineRole.Arn

  BackfillTriggerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !GetAtt CustomerManagedEncryptionKey.Arn
      RetentionInDays: !Ref LogRetentionDays

  BackfillTriggerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function does not require VPC access"
          - id: W92
            reason: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_116: "DLQ not required for Custom Resource function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_173: "Environment variables contain non-sensitive configuration values (log level only)"
    Properties:
      PermissionsBoundary:
        !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      Handler: index.handler
      Runtime: python3.12
      CodeUri: src/lambda/backfill_gsi_attributes/
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
      LoggingConfig:
        LogGroup: !Ref BackfillTriggerFunctionLogGroup
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TrackingTable
        - Statement:
            - Effect: Allow
              Action: states:StartExecution
              Resource: !Ref BackfillStateMachine
            - Effect: Allow
              Action:
                - kms:Decrypt
                - kms:DescribeKey
              Resource: !GetAtt CustomerManagedEncryptionKey.Arn

  BackfillCustomResource:
    Type: Custom::GSIBackfill
    Properties:
      ServiceToken: !GetAtt BackfillTriggerFunction.Arn
      TrackingTableName: !Ref TrackingTable
      BackfillStateMachineArn: !Ref BackfillStateMachine
      TotalSegments: "10"
      # MUST be bumped by any change that needs the backfill to re-run.
      # CloudFormation only sends an Update to a custom resource when one of its
      # properties changes, so leaving this alone means the trigger is never
      # invoked and the new backfill silently does not happen on upgrades.
      # 4.0: retype pre-existing test-run documents to ItemType=test-document.
      BackfillVersion: "4.0"

  ##############################################################################
  # DynamoDB table and initialization function for workflow concurrency counter
  ##############################################################################

  ConcurrencyTable:
    Type: AWS::DynamoDB::Table
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W78
            reason: "Point-in-time recovery not required for concurrency tracking table as data is transient"
    # checkov:skip=CKV_AWS_28: "Point-in-time recovery not required for concurrency tracking table as data is transient"
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: counter_id
          AttributeType: S
      KeySchema:
        - AttributeName: counter_id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref CustomerManagedEncryptionKey

  InitializeConcurrencyTableLambda:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function does not require VPC access as it only interacts with AWS services via APIs"
          - id: W92
            reason: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required for Cfn Custom Resource function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only configuration values like feature flags and non-sensitive settings"
    Properties:
      PermissionsBoundary:
        !If [
          HasPermissionsBoundary,
          !Ref PermissionsBoundaryArn,
          !Ref AWS::NoValue,
        ]
      Handler: index.handler
      Runtime: python3.12
      Timeout: 30
      VpcConfig:
        !If
          - DeployInVPC
          - SecurityGroupIds:
              - !Ref LambdaSecurityGroupId
            SubnetIds: !Ref PrivateSubnetIds
          - !Ref AWS::NoValue
      CodeUri: src/lambda/initialize_counter
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          CONCURRENCY_TABLE: !Ref ConcurrencyTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConcurrencyTable
        - Statement:
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:ReEncrypt*
                - kms:GenerateDataKey*
                - kms:DescribeKey
              Resource: !GetAtt CustomerManagedEncryptionKey.Arn

  InitializeConcurrencyTableCustomResource:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt InitializeConcurrencyTableLambda.Arn
      TableName: !Ref ConcurrencyTable

  ##########################################################################
  # Configuration table, for pattern specific prompts and config
  ##########################################################################

  # Valid values for 'Configuration' (PK) are Schema, Default, Custom
  # Schema, and Default are set by pattern templates during stack deploy/update
  # Custom is left for user to define during stack deploy/update

  ConfigurationTable:
    Type: AWS::DynamoDB::Table
    Properties:
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: Configuration
          KeyType: HASH
      AttributeDefinitions:
        - AttributeName: Configuration
          AttributeType: S
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref CustomerManagedEncryptionKey
  ##########################################################################
  # Discovery tracking table for discovery jobs
  ##########################################################################

  DiscoveryTrackingTable:
    Type: AWS::DynamoDB::Table
    Properties:
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ExpiresAfter
        Enabled: true

      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref CustomerManagedEncryptionKey

  ##########################################################################
  # Discovery SQS queue for processing discovery jobs
  ##########################################################################

  DiscoveryQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 900
      MessageRetentionPeriod: 86400 # 1 day
      KmsMasterKeyId: !Ref CustomerManagedEncryptionKey
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DiscoveryDLQ.Arn
        maxReceiveCount: 1000

  DiscoveryDLQ:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 900
      MessageRetentionPeriod: 345600 # 4 days
      KmsMasterKeyId: !Ref CustomerManagedEncryptionKey

  ##########################################################################
  # Config Bootstrap (Quick Start) tracking + queue
  ##########################################################################

  BootstrapTrackingTable:
    Type: AWS::DynamoDB::Table
    Properties:
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ExpiresAfter
        Enabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref CustomerManagedEncryptionKey

  UpdateConfigurationFunction:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function does not require VPC access as it only interacts with AWS services via APIs"
          - id: W92
            reason: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required for Custom Resource function"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only configuration values like feature flags and non-sensitive settings"
    Properties:
      PermissionsBoundary:
        !If [
          HasPermissionsBoundary,
          !Ref PermissionsBoundaryArn,
          !Ref AWS::NoValue,
        ]
      Handler: index.handler
      Runtime: python3.12
      Timeout: 30
      VpcConfig:
        !If
          - DeployInVPC
          - SecurityGroupIds:
              - !Ref LambdaSecurityGroupId
            SubnetIds: !Ref PrivateSubnetIds
          - !Ref AWS::NoValue

      Layers:
        - !Ref IDPCommonBaseLayer
      CodeUri: src/lambda/update_configuration
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          CONFIGURATION_TABLE_NAME: !Ref ConfigurationTable
          # Enables Configuration Profile revision history: a stack deployment
          # cuts a revision of `default` (and of each managed profile) instead
          # of overwriting it silently, so an upgrade's config changes are
          # diffable and can be rolled back.
          CONFIGURATION_BUCKET: !Ref ConfigurationBucket
      LoggingConfig:
        LogGroup: !Ref UpdateConfigurationFunctionLogGroup
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConfigurationTable
        - Statement:
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:ReEncrypt*
                - kms:GenerateDataKey*
                - kms:DescribeKey
              Resource: !GetAtt CustomerManagedEncryptionKey.Arn
            - Effect: Allow
              Action:
                - "s3:GetObject"
                - "s3:ListBucket"
              Resource:
                - !Sub "arn:${AWS::Partition}:s3:::<ARTIFACT_BUCKET_TOKEN>"
                - !Sub "arn:${AWS::Partition}:s3:::<ARTIFACT_BUCKET_TOKEN>/<ARTIFACT_PREFIX_TOKEN>/*"
                - !Sub "arn:${AWS::Partition}:s3:::${ConfigurationBucket}"
                - !Sub "arn:${AWS::Partition}:s3:::${ConfigurationBucket}/*"
            # Write configuration-profile revision bodies. Scoped to the
            # revisions prefix: this function has no reason to write anywhere
            # else in the configuration bucket.
            - Effect: Allow
              Action:
                - "s3:PutObject"
                - "s3:DeleteObject"
              Resource:
                - !Sub "arn:${AWS::Partition}:s3:::${ConfigurationBucket}/config_revisions/*"
            # Allow reading user-supplied config file only if CustomConfigPath is specified
            - !If
              - HasCustomConfigPath
              - Effect: Allow
                Action:
                  - "s3:GetObject"
                Resource: !Sub
                  - "arn:${AWS::Partition}:s3:::${Path}"
                  - Path: !Select [ 1, !Split [ "s3://", !Ref CustomConfigPath ] ]
              - !Ref AWS::NoValue
            # Allow listing the specific bucket containing the custom config file
            - !If
              - HasCustomConfigPath
              - Effect: Allow
                Action:
                  - "s3:ListBucket"
                Resource: !Sub
                  - "arn:${AWS::Partition}:s3:::${BucketName}"
                  - BucketName:
                      !Select [
                        0,
                        !Split [
                          "/",
                          !Select [ 1, !Split [ "s3://", !Ref CustomConfigPath ] ],
                        ],
                      ]
              - !Ref AWS::NoValue

  UpdateConfigurationFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !GetAtt CustomerManagedEncryptionKey.Arn
      RetentionInDays: !Ref LogRetentionDays

  # Pattern stacks can update the Configuration table with a CustomResource, using the
  # UpdateConfigurationFunctionArn parameter passed to them. See examples in provided
  # pattern templates.

  ##########################################################################
  # SSM Parameter for application settings
  ##########################################################################

  # Initialise SettingsParameter as empty (so it never gets replaced)
  # and use Custom Resource UpdateSettingsFunction to add/update values
  SettingsParameter:
    DependsOn:
      - IsStacknameLengthOK
    Type: AWS::SSM::Parameter
    Properties:
      Type: String
      Name: !Sub "${AWS::StackName}-Settings"
      Value: "{}"

  UpdateSettingsFunction:
    DependsOn:
      - IsStacknameLengthOK
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function does not require VPC access as it only interacts with AWS services via APIs"
          - id: W92
            reason: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required for Custom Resource function"
    Properties:
      PermissionsBoundary:
        !If [
          HasPermissionsBoundary,
          !Ref PermissionsBoundaryArn,
          !Ref AWS::NoValue,
        ]
      Handler: index.handler
      Runtime: python3.12
      Timeout: 30
      VpcConfig:
        !If
          - DeployInVPC
          - SecurityGroupIds:
              - !Ref LambdaSecurityGroupId
            SubnetIds: !Ref PrivateSubnetIds
          - !Ref AWS::NoValue
      CodeUri: src/lambda/update_settings
      LoggingConfig:
        LogGroup: !Ref UpdateSettingsFunctionLogGroup
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:PutParameter
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${SettingsParameter}"

  UpdateSettingsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !GetAtt CustomerManagedEncryptionKey.Arn
      RetentionInDays: !Ref LogRetentionDays

  UpdateSettingsValues:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt UpdateSettingsFunction.Arn
      SettingsName: !Ref SettingsParameter
      SettingsKeyValuePairs:
        StackName: !Sub "${AWS::StackName}"
        Version: <VERSION>
        BuildDateTime: <BUILD_DATE_TIME>
        IDPPattern: "Unified"
        InputBucket: !Ref InputBucket
        DiscoveryBucket: !Ref DiscoveryBucket
        TestSetBucket: !Ref TestSetBucket
        ConfigurationBucket: !Ref ConfigurationBucket
        OutputBucket: !Ref OutputBucket
        ReportingBucket: !If
          - ShouldCreateReportingBucket
          - !Ref ReportingBucket
          - !Ref ReportingBucketName
        EvaluationBaselineBucket: !If
          - ShouldCreateEvaluationBaselineBucket
          - !Ref EvaluationBaselineBucket
          - !Ref EvaluationBaselineBucketName
        ShouldUseDocumentKnowledgeBase: !If
          - ShouldUseDocumentKnowledgeBase
          - True
          - False
        # Runtime-resolved values for APIRESOLVERSTACK decoupling
        # CloudWatch log groups moved here to decouple Agent Lambda functions from Pattern stacks
        CloudWatchLogGroups: !Join
          - ","
          - - !Ref QueueSenderLogGroup
            - !Ref QueueProcessorLogGroup
            - !Ref WorkflowTrackerLogGroup
            - !Ref SaveReportingDataFunctionV2LogGroup
            - !GetAtt PATTERNSTACK.Outputs.PatternLogGroups
        StateMachineArn: !GetAtt PATTERNSTACK.Outputs.StateMachineArn
        StateMachineName: !GetAtt PATTERNSTACK.Outputs.StateMachineName
        KnowledgeBaseId: !If
          - ShouldCreateDocumentKnowledgeBase
          - !GetAtt DOCUMENTKB.Outputs.KnowledgeBaseID
          - ""
        AllowedSignUpEmailDomains: !Ref AllowedSignUpEmailDomain
        # Public template version-check (used by Web UI Deployment Info "Update available" indicator).
        # When PublicArtifactsBucket is empty the UI hides the indicator entirely.
        PublicArtifactsBucket: !Ref PublicArtifactsBucket
        PublicArtifactsPrefix: !Ref PublicArtifactsPrefix
        # Vertical-product packs: redirects post-login navigation to
        # /features/<id> instead of /documents when set. Read by AuthRoutes.
        DefaultFeatureId: !Ref DefaultFeatureId
        # Vertical-product packs: customise the top-navigation banner.
        # Read by GenAIIDPTopNavigation; defaults to "IDP Accelerator Console".
        ConsoleTitle: !Ref ConsoleTitle
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete

  ##########################################################################
  # SQS Queue for queueing pending documents in order
  ##########################################################################

  DocumentQueueDLQ:
    Type: AWS::SQS::Queue
    Properties:
      KmsMasterKeyId: !Ref CustomerManagedEncryptionKey
      VisibilityTimeout: 30
      MessageRetentionPeriod: 345600 # 4 days

  DocumentQueueDLQPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref DocumentQueueDLQ
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EnforceSSLOnly
            Effect: Deny
            Principal: "*"
            Action: "sqs:*"
            Resource: !GetAtt DocumentQueueDLQ.Arn
            Condition:
              Bool:
                "aws:SecureTransport": false

  DocumentQueue:
    Type: AWS::SQS::Queue
    Properties:
      KmsMasterKeyId: !Ref CustomerManagedEncryptionKey
      VisibilityTimeout: 30
      MessageRetentionPeriod: 86400 # 1 day
      RedrivePolicy:
        maxReceiveCount: 1000 # should retry up to 8hrs (1000 * 30 sec visibility) before moving to DLQ
        deadLetterTargetArn: !GetAtt DocumentQueueDLQ.Arn

  DocumentQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref DocumentQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EnforceSSLOnly
            Effect: Deny
            Principal: "*"
            Action: "sqs:*"
            Resource: !GetAtt DocumentQueue.Arn
            Condition:
              Bool:
                "aws:SecureTransport": false

  ##########################################################################
  # Event triggered Lambdas to publish and consume from the queue
  ##########################################################################

  QueueSenderDLQ:
    Type: AWS::SQS::Queue
    Properties:
      KmsMasterKeyId: !Ref CustomerManagedEncryptionKey
      VisibilityTimeout: 30
      MessageRetentionPeriod: 345600 # 4 days

  QueueSenderDLQPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref QueueSenderDLQ
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EnforceSSLOnly
            Effect: Deny
            Principal: "*"
            Action: "sqs:*"
            Resource: !GetAtt QueueSenderDLQ.Arn
            Condition:
              Bool:
                "aws:SecureTransport": false

  QueueSender:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function does not require VPC access as it only interacts with AWS services via APIs"
          - id: W92
            reason: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only configuration values like feature flags and non-sensitive settings"
    Properties:
      PermissionsBoundary:
        !If [
          HasPermissionsBoundary,
          !Ref PermissionsBoundaryArn,
          !Ref AWS::NoValue,
        ]
      CodeUri: src/lambda/queue_sender/
      Handler: index.handler
      Runtime: python3.12
      Timeout: 30
      Tags:
        # Data plane — one invocation per doc-arrival S3 event.
        idp:plane: data

      Layers:
        - !Ref IDPCommonBaseLayer
      Tracing: Active
      VpcConfig: !If
        - DeployInVPC
        - SubnetIds: !Ref PrivateSubnetIds
          SecurityGroupIds:
            - !Ref LambdaSecurityGroupId
        - !If
          - UsePrivateApi
          - SubnetIds: !Ref LambdaSubnetIds
            SecurityGroupIds:
              - !Ref LambdaVpcSecurityGroup
          - !Ref AWS::NoValue
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt QueueSenderDLQ.Arn
      LoggingConfig:
        LogGroup: !Ref QueueSenderLogGroup
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          QUEUE_URL: !Ref DocumentQueue
          APPSYNC_API_URL: ""
          # dynamodb: write the TrackingTable directly (no GraphQL API). The
          # factory uses this mode now that the GraphQL transport is removed.
          DOCUMENT_TRACKING_MODE: "dynamodb"
          TRACKING_TABLE: !Ref TrackingTable
          DATA_RETENTION_IN_DAYS: !Ref DataRetentionInDays
          OUTPUT_BUCKET: !Ref OutputBucket
          CONFIG_TABLE: !Ref ConfigurationTable
          # Namespace for the ``StaleOutputPurgeFailed`` telemetry metric
          # (issue #719). Matches every other IDP Lambda's convention:
          # stack-name isolates per-deployment.
          METRIC_NAMESPACE: !Ref AWS::StackName
      Policies:
        # httpapi: the doc service writes the TrackingTable directly.
        - DynamoDBCrudPolicy:
            TableName: !Ref TrackingTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt DocumentQueue.QueueName
        - DynamoDBReadPolicy:
            TableName: !Ref ConfigurationTable
        - S3ReadPolicy:
            BucketName: !Ref InputBucket
        # Issue #719: purge stale <key>/pages/* from a prior upload of the
        # same key before the pipeline runs (defeats OCR retry-safe recovery
        # on re-upload). Scoped to exactly what the purge needs — ListBucket
        # to enumerate, DeleteObject to remove. Tighter than the S3CrudPolicy
        # SAM template (which also grants Put/Get/Restore/ACL/tagging that
        # this function never uses), matching least-privilege on a data-plane
        # function invoked once per document upload.
        - Statement:
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource: !Sub "arn:${AWS::Partition}:s3:::${OutputBucket}"
            - Effect: Allow
              Action:
                - s3:DeleteObject
              Resource: !Sub "arn:${AWS::Partition}:s3:::${OutputBucket}/*"
        # Issue #719: emit ``StaleOutputPurgeFailed`` on partial-purge
        # failure so operators can alarm on the metric rather than
        # scraping ERROR logs. Matches the pattern in
        # queue_processor._put_drift_sample. Fire-and-forget — the emit
        # is wrapped in its own try/except so telemetry can't affect
        # document ingest.
        - Statement:
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
              Condition:
                StringEquals:
                  cloudwatch:namespace: !Ref AWS::StackName
        - Statement:
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:ReEncrypt*
                - kms:GenerateDataKey*
                - kms:DescribeKey
              Resource: !GetAtt CustomerManagedEncryptionKey.Arn
      Events:
        S3Event:
          Type: CloudWatchEvent
          Properties:
            Pattern:
              source:
                - aws.s3
              detail-type:
                - "Object Created"
              detail:
                bucket:
                  name:
                    - !Ref InputBucket

  QueueSenderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !GetAtt CustomerManagedEncryptionKey.Arn
      RetentionInDays: !Ref LogRetentionDays

  QueueProcessor:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function does not require VPC access as it only interacts with AWS services via APIs"
          - id: W92
            reason: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required for these functions as they are either idempotent or have error handling"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only configuration values like feature flags and non-sensitive settings"
    Properties:
      PermissionsBoundary:
        !If [
          HasPermissionsBoundary,
          !Ref PermissionsBoundaryArn,
          !Ref AWS::NoValue,
        ]
      CodeUri: src/lambda/queue_processor/
      Handler: index.handler
      Runtime: python3.12
      Timeout: 30
      Tags:
        # Data plane — SQS batch trigger from the doc queue.
        idp:plane: data

      Layers:
        - !Ref IDPCommonBaseLayer
      Tracing: Active
      VpcConfig: !If
        - DeployInVPC
        - SubnetIds: !Ref PrivateSubnetIds
          SecurityGroupIds:
            - !Ref LambdaSecurityGroupId
        - !If
          - UsePrivateApi
          - SubnetIds: !Ref LambdaSubnetIds
            SecurityGroupIds:
              - !Ref LambdaVpcSecurityGroup
          - !Ref AWS::NoValue
      LoggingConfig:
        LogGroup: !Ref QueueProcessorLogGroup
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          STATE_MACHINE_ARN: !GetAtt PATTERNSTACK.Outputs.StateMachineArn
          APPSYNC_API_URL: ""
          # dynamodb: write the TrackingTable directly (no GraphQL API). The
          # factory uses this mode now that the GraphQL transport is removed.
          DOCUMENT_TRACKING_MODE: "dynamodb"
          TRACKING_TABLE: !Ref TrackingTable
          CONCURRENCY_TABLE: !Ref ConcurrencyTable
          MAX_CONCURRENT: !Ref MaxConcurrentWorkflows
          WORKING_BUCKET: !Ref WorkingBucket
          CONFIG_TABLE: !Ref ConfigurationTable
          CIRCUIT_BREAKER_ENABLED: !If [CircuitBreakerEnabledCondition, "true", "false"]
          DOCUMENT_QUEUE_URL: !Ref DocumentQueue
          RECOVERY_TIMEOUT_SECONDS: !Ref CircuitBreakerRecoveryTimeoutSeconds
          METRIC_NAMESPACE: !Ref AWS::StackName
      Policies:
        # httpapi: the doc service writes the TrackingTable directly.
        - DynamoDBCrudPolicy:
            TableName: !Ref TrackingTable
        - SQSPollerPolicy:
            QueueName: !GetAtt DocumentQueue.QueueName
        - StepFunctionsExecutionPolicy:
            StateMachineName: !GetAtt PATTERNSTACK.Outputs.StateMachineName
        - DynamoDBCrudPolicy:
            TableName: !Ref TrackingTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConcurrencyTable
        - DynamoDBReadPolicy:
            TableName: !Ref ConfigurationTable
        - S3CrudPolicy:
            BucketName: !Ref WorkingBucket
        - Statement:
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:ReEncrypt*
                - kms:GenerateDataKey*
                - kms:DescribeKey
              Resource: !GetAtt CustomerManagedEncryptionKey.Arn
        # Concurrency-counter reconciliation: compare the counter against the
        # executions that are really RUNNING, so a leaked counter cannot stop the
        # stack admitting documents forever. Scoped to this stack's own state
        # machine; ListExecutions is read-only.
        - Statement:
            - Effect: Allow
              Action:
                - states:ListExecutions
              Resource: !GetAtt PATTERNSTACK.Outputs.StateMachineArn
        # PutMetricData takes no resource-level permissions (AWS-wide), so it is
        # constrained by namespace condition instead.
        - Statement:
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
              Condition:
                StringEquals:
                  cloudwatch:namespace: !Ref AWS::StackName
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt DocumentQueue.Arn
            BatchSize: 50 # Process up to 50 messages at once
            # Per https://docs.aws.amazon.com/lambda/latest/dg/with-sqs.html
            # If you're using a batch window and your SQS queue contains very low traffic,
            # Lambda might wait for up to 20 seconds before invoking your function.
            # This is true even if you set a batch window lower than 20 seconds.
            MaximumBatchingWindowInSeconds: 1 # Minimize delay (see above caveat)
            FunctionResponseTypes:
              - ReportBatchItemFailures

  QueueProcessorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !GetAtt CustomerManagedEncryptionKey.Arn
      RetentionInDays: !Ref LogRetentionDays

  ##########################################################################
  # Event triggered Lambda for statemachine workflow tracking updates
  ##########################################################################

  WorkflowTrackerDLQ:
    Type: AWS::SQS::Queue
    Properties:
      KmsMasterKeyId: !Ref CustomerManagedEncryptionKey
      VisibilityTimeout: 30
      MessageRetentionPeriod: 345600 # 4 days

  WorkflowTrackerDLQPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref WorkflowTrackerDLQ
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EnforceSSLOnly
            Effect: Deny
            Principal: "*"
            Action: "sqs:*"
            Resource: !GetAtt WorkflowTrackerDLQ.Arn
            Condition:
              Bool:
                "aws:SecureTransport": false

  WorkflowTracker:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: "Role requires * resource access for CloudWatch Metrics and Logs"
          - id: W89
            reason: "Function does not require VPC access as it only interacts with AWS services via APIs"
          - id: W92
            reason: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only configuration values like feature flags and non-sensitive settings"
    Properties:
      PermissionsBoundary:
        !If [
          HasPermissionsBoundary,
          !Ref PermissionsBoundaryArn,
          !Ref AWS::NoValue,
        ]
      CodeUri: src/lambda/workflow_tracker/
      Handler: index.handler
      Runtime: python3.12
      Timeout: 30
      Tags:
        # Data plane — invoked per doc-workflow state change. See
        # docs/reporting-sql-layer.md §10.3 / §10.4.
        idp:plane: data

      Layers:
        - !Ref IDPCommonBaseLayer
      Tracing: Active
      VpcConfig: !If
        - DeployInVPC
        - SubnetIds: !Ref PrivateSubnetIds
          SecurityGroupIds:
            - !Ref LambdaSecurityGroupId
        - !If
          - UsePrivateApi
          - SubnetIds: !Ref LambdaSubnetIds
            SecurityGroupIds:
              - !Ref LambdaVpcSecurityGroup
          - !Ref AWS::NoValue
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt WorkflowTrackerDLQ.Arn
      LoggingConfig:
        LogGroup: !Ref WorkflowTrackerLogGroup
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          CONCURRENCY_TABLE: !Ref ConcurrencyTable
          METRIC_NAMESPACE: !Ref AWS::StackName
          APPSYNC_API_URL: ""
          # dynamodb: write the TrackingTable directly (no GraphQL API). The
          # factory uses this mode now that the GraphQL transport is removed.
          DOCUMENT_TRACKING_MODE: "dynamodb"
          TRACKING_TABLE: !Ref TrackingTable
          OUTPUT_BUCKET: !Ref OutputBucket
          # Needed to fully delete an original superseded by a redacted copy
          # (REDACTED_SUPERSEDED terminal status from a preprocessing hook).
          INPUT_BUCKET: !Ref InputBucket
          REPORTING_BUCKET:
            !If [
              ShouldCreateReportingBucket,
              !Ref ReportingBucket,
              !Ref ReportingBucketName,
            ]
          SAVE_REPORTING_FUNCTION_NAME: !Ref SaveReportingDataFunctionV2
          WORKING_BUCKET: !Ref WorkingBucket
          DATA_RETENTION_IN_DAYS: !Ref DataRetentionInDays
          # Document version history: snapshot output S3 object versions into a
          # per-run manifest and write a run record on successful completion.
          DOCUMENT_VERSIONING_ENABLED: "true"
          CIRCUIT_BREAKER_ENABLED: !If [CircuitBreakerEnabledCondition, "true", "false"]
          CIRCUIT_BREAKER_MANAGER_ARN: !If [CircuitBreakerEnabledCondition, !GetAtt CircuitBreakerManagerFunction.Arn, ""]
          ALERTS_TOPIC_ARN: !If [CircuitBreakerEnabledCondition, !Ref AlertsTopic, ""]
      Policies:
        # httpapi: the doc service writes the TrackingTable directly.
        - DynamoDBCrudPolicy:
            TableName: !Ref TrackingTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TrackingTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConcurrencyTable
        - S3CrudPolicy:
            BucketName: !Ref WorkingBucket
        # Document version manifests: enumerate output object versions and
        # write runs/<run_id>/manifest.json to the output bucket. Also delete
        # output objects when fully deleting a REDACTED_SUPERSEDED original.
        - Statement:
            - Effect: Allow
              Action:
                - s3:ListBucketVersions
                - s3:ListBucket
              Resource: !GetAtt OutputBucket.Arn
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:DeleteObject
              Resource: !Sub "${OutputBucket.Arn}/*"
        # Delete the input object of a REDACTED_SUPERSEDED original (the
        # redacted copy replaces it). Input bucket read/list/delete.
        - Statement:
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource: !GetAtt InputBucket.Arn
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:DeleteObject
              Resource: !Sub "${InputBucket.Arn}/*"
        - Statement:
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
              # Round-22 hardening: scope PutMetricData to the stack's own
              # metric namespace so a compromised Lambda can't spam metrics
              # to arbitrary namespaces or names that trigger alarms on
              # neighbouring stacks.
              Condition:
                StringEquals:
                  "cloudwatch:namespace": !Ref AWS::StackName
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt SaveReportingDataFunctionV2.Arn
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:ReEncrypt*
                - kms:GenerateDataKey*
                - kms:DescribeKey
              Resource: !GetAtt CustomerManagedEncryptionKey.Arn
        - !If
          - CircuitBreakerEnabledCondition
          - SNSPublishMessagePolicy:
              TopicName: !GetAtt AlertsTopic.TopicName
          - !Ref AWS::NoValue
        - !If
          - CircuitBreakerEnabledCondition
          - Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt CircuitBreakerManagerFunction.Arn
          - !Ref AWS::NoValue

  WorkflowTrackerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !GetAtt CustomerManagedEncryptionKey.Arn
      RetentionInDays: !Ref LogRetentionDays

  WorkflowStateChangeRule:
    Type: AWS::Events::Rule
    Properties:
      EventPattern:
        source:
          - aws.states
        detail-type:
          - Step Functions Execution Status Change
        detail:
          stateMachineArn:
            - !GetAtt PATTERNSTACK.Outputs.StateMachineArn
          status:
            - FAILED
            - TIMED_OUT
            - ABORTED
            - SUCCEEDED
      State: ENABLED
      Targets:
        - Arn: !GetAtt WorkflowTracker.Arn
          Id: TrackWorkflowCompletion
          RetryPolicy:
            MaximumRetryAttempts: 3
        - !If
          - DeployApiGateway
          - Arn: !GetAtt JobTracker.Arn
            Id: TrackJobCompletion
            RetryPolicy:
              MaximumRetryAttempts: 3
          - !Ref "AWS::NoValue"

  WorkflowTrackerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WorkflowTracker
      Principal: !Sub "events.${AWS::URLSuffix}"
      SourceArn: !GetAtt WorkflowStateChangeRule.Arn

  ##########################################################################
  # Job Tracker (Headless mode - tracks API-initiated jobs)
  ##########################################################################

  JobTrackerDLQ:
    Type: AWS::SQS::Queue
    Condition: DeployApiGateway
    Properties:
      KmsMasterKeyId: !Ref CustomerManagedEncryptionKey

  JobTrackerLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: DeployApiGateway
    Properties:
      KmsKeyId: !GetAtt CustomerManagedEncryptionKey.Arn
      RetentionInDays: !Ref LogRetentionDays

  JobTracker:
    Type: AWS::Serverless::Function
    Condition: DeployApiGateway
    Properties:
      PermissionsBoundary:
        !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref "AWS::NoValue"]
      CodeUri: src/lambda/job_tracker/
      Handler: index.handler
      Runtime: python3.12
      Timeout: 900
      MemorySize: 3008
      EphemeralStorage:
        Size: 5120
      Tags:
        # Data plane — SQS per-doc status-change events. See docs/reporting-sql-layer.md §10.3.
        idp:plane: data
      Layers:
        - !Ref IDPCommonBaseLayer
      Tracing: Active
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt JobTrackerDLQ.Arn
      LoggingConfig:
        LogGroup: !Ref JobTrackerLogGroup
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
        SubnetIds: !Ref PrivateSubnetIds
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          TRACKING_TABLE: !Ref TrackingTable
          OUTPUT_BUCKET: !Ref OutputBucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TrackingTable
        - S3CrudPolicy:
            BucketName: !Ref OutputBucket
        - Statement:
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:GenerateDataKey*
              Resource: !GetAtt CustomerManagedEncryptionKey.Arn

  JobTrackerPermission:
    Type: AWS::Lambda::Permission
    Condition: DeployApiGateway
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref JobTracker
      Principal: !Sub "events.${AWS::URLSuffix}"
      SourceArn: !GetAtt WorkflowStateChangeRule.Arn

  ##########################################################################
  # Optional Post Processing Lambda Hook
  ##########################################################################
  
  # Decompression Lambda - handles document decompression before invoking custom post-processor
  PostProcessingDecompressorDLQ:
    Type: AWS::SQS::Queue
    Condition: ShouldEnablePostProcessingLambdaHook
    Properties:
      KmsMasterKeyId: !Ref CustomerManagedEncryptionKey
      VisibilityTimeout: 30
      MessageRetentionPeriod: 345600 # 4 days

  PostProcessingDecompressorDLQPolicy:
    Type: AWS::SQS::QueuePolicy
    Condition: ShouldEnablePostProcessingLambdaHook
    Properties:
      Queues:
        - !Ref PostProcessingDecompressorDLQ
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EnforceSSLOnly
            Effect: Deny
            Principal: "*"
            Action: "sqs:*"
            Resource: !GetAtt PostProcessingDecompressorDLQ.Arn
            Condition:
              Bool:
                "aws:SecureTransport": false

  PostProcessingDecompressor:
    Type: AWS::Serverless::Function
    Condition: ShouldEnablePostProcessingLambdaHook
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function does not require VPC access as it only interacts with AWS services via APIs"
          - id: W92
            reason: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only configuration values like feature flags and non-sensitive settings"
    Properties:
      PermissionsBoundary:
        !If [
          HasPermissionsBoundary,
          !Ref PermissionsBoundaryArn,
          !Ref AWS::NoValue,
        ]
      CodeUri: src/lambda/post_processing_decompressor/
      Handler: index.handler
      Runtime: python3.12
      Timeout: 300
      Tags:
        # Data plane — SQS per-doc dispatcher for custom post-processor.
        # See docs/reporting-sql-layer.md §10.3.
        idp:plane: data
      VpcConfig:
        !If
          - DeployInVPC
          - SecurityGroupIds:
              - !Ref LambdaSecurityGroupId
            SubnetIds: !Ref PrivateSubnetIds
          - !Ref AWS::NoValue

      Layers:
        - !Ref IDPCommonBaseLayer
      MemorySize: 512
      Tracing: Active
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt PostProcessingDecompressorDLQ.Arn
      LoggingConfig:
        LogGroup: !Ref PostProcessingDecompressorLogGroup
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          CUSTOM_POST_PROCESSOR_ARN: !Ref PostProcessingLambdaHookFunctionArn
          WORKING_BUCKET: !Ref WorkingBucket
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref WorkingBucket
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !Ref PostProcessingLambdaHookFunctionArn
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:ReEncrypt*
                - kms:GenerateDataKey*
                - kms:DescribeKey
              Resource: !GetAtt CustomerManagedEncryptionKey.Arn

  PostProcessingDecompressorLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: ShouldEnablePostProcessingLambdaHook
    Properties:
      KmsKeyId: !GetAtt CustomerManagedEncryptionKey.Arn
      RetentionInDays: !Ref LogRetentionDays

  PostProcessingLambdaHookRule:
    Type: AWS::Events::Rule
    Condition: ShouldEnablePostProcessingLambdaHook
    Properties:
      EventPattern:
        source:
          - aws.states
        detail-type:
          - Step Functions Execution Status Change
        detail:
          stateMachineArn:
            - !GetAtt PATTERNSTACK.Outputs.StateMachineArn
          status:
            - SUCCEEDED
      State: ENABLED
      Targets:
        - Arn: !GetAtt PostProcessingDecompressor.Arn
          Id: PostProcessingDecompressor
          RetryPolicy:
            MaximumRetryAttempts: 3

  PostProcessingDecompressorPermission:
    Type: AWS::Lambda::Permission
    Condition: ShouldEnablePostProcessingLambdaHook
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PostProcessingDecompressor
      Principal: !Sub "events.${AWS::URLSuffix}"
      SourceArn: !GetAtt PostProcessingLambdaHookRule.Arn

  ##########################################################################
  # SaveReportingDataFunctionV2 Lambda, writes to ReportingBucket
  ##########################################################################

  SaveReportingDataFunctionV2:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: "Role requires * resource access for CloudWatch Metrics and Logs"
          - id: W89
            reason: "Function does not require VPC access as it only interacts with AWS services via APIs"
          - id: W92
            reason: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only configuration values like feature flags and non-sensitive settings"
    # checkov:skip=CKV_AWS_116: "DLQ not required for this functions as it is called sychronously"
    Properties:
      PermissionsBoundary:
        !If [
          HasPermissionsBoundary,
          !Ref PermissionsBoundaryArn,
          !Ref AWS::NoValue,
        ]
      CodeUri: src/lambda/save_reporting_data/
      Handler: index.handler
      Runtime: python3.12
      Timeout: 300
      Tags:
        # Data plane — invoked async per doc by evaluation / rule-validation
        # / metering writer Lambdas.
        idp:plane: data

      Layers:
        - !Ref IDPCommonReportingLayer
      MemorySize: 1024
      Tracing: Active
      VpcConfig: !If
        - DeployInVPC
        - SubnetIds: !Ref PrivateSubnetIds
          SecurityGroupIds:
            - !Ref LambdaSecurityGroupId
        - !If
          - UsePrivateApi
          - SubnetIds: !Ref LambdaSubnetIds
            SecurityGroupIds:
              - !Ref LambdaVpcSecurityGroup
          - !Ref AWS::NoValue
      LoggingConfig:
        LogGroup: !Ref SaveReportingDataFunctionV2LogGroup
      Policies:
        - S3CrudPolicy:
            BucketName: !If
              - ShouldCreateReportingBucket
              - !Ref ReportingBucket
              - !Ref ReportingBucketName
        - S3ReadPolicy:
            BucketName: !Ref OutputBucket
        - DynamoDBReadPolicy:
            TableName: !Ref ConfigurationTable
        - Statement:
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
              # Round-22 hardening: scope PutMetricData to the stack's own
              # metric namespace so a compromised Lambda can't spam metrics
              # to arbitrary namespaces or names that trigger alarms on
              # neighbouring stacks.
              Condition:
                StringEquals:
                  "cloudwatch:namespace": !Ref AWS::StackName
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:ReEncrypt*
                - kms:GenerateDataKey*
                - kms:DescribeKey
              Resource: !GetAtt CustomerManagedEncryptionKey.Arn
            - Effect: Allow
              Action:
                - glue:CreateTable
                - glue:GetTable
                - glue:UpdateTable
                - glue:GetDatabase
              Resource:
                - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog"
                - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${GetLowercase.Lowercase}-reporting-db"
                - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${GetLowercase.Lowercase}-reporting-db/document_sections_*"
                - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${GetLowercase.Lowercase}-reporting-db/metering"
                - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${GetLowercase.Lowercase}-reporting-db/document_evaluations"
                - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${GetLowercase.Lowercase}-reporting-db/section_evaluations"
                - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${GetLowercase.Lowercase}-reporting-db/attribute_evaluations"
                - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${GetLowercase.Lowercase}-reporting-db/rule_validation_*"
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          METRIC_NAMESPACE: !Ref AWS::StackName
          STACK_NAME: !Ref AWS::StackName
          CONFIGURATION_TABLE_NAME: !Ref ConfigurationTable

  SaveReportingDataFunctionV2LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !GetAtt CustomerManagedEncryptionKey.Arn
      RetentionInDays: !Ref LogRetentionDays

  ##########################################################################
  # CloudWatch monitoring
  ##########################################################################

  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Workflow Alerts
      KmsMasterKeyId: !Ref CustomerManagedEncryptionKey

  # The metric name is `ExecutionsFailed`, NOT `ExecutionsFailedCount` -- the
  # latter does not exist in AWS/States, so an alarm pointed at it can never
  # receive a datapoint and never fires. This alarm silently did exactly that,
  # which is the worst failure mode an alarm has: it reports OK-by-absence while
  # executions fail. `TreatMissingData: notBreaching` is what makes the absence
  # legible -- without it the alarm sits in INSUFFICIENT_DATA whenever there is
  # no traffic, which is indistinguishable from a wrong metric name and is how
  # the original bug stayed hidden. See test_cloudwatch_alarms.py, which pins
  # both properties.
  WorkflowErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub "Alert when workflow errors exceed ${ErrorThreshold} in 5 minutes"
      MetricName: ExecutionsFailed
      Namespace: AWS/States
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref ErrorThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: StateMachineArn
          Value: !GetAtt PATTERNSTACK.Outputs.StateMachineArn
      AlarmActions:
        - !Ref AlertsTopic
      TreatMissingData: notBreaching

  SlowExecutionsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub "Alert when average execution time exceeds ${ExecutionTimeThresholdMs} milliseconds"
      MetricName: ExecutionTime
      Namespace: AWS/States
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref ExecutionTimeThresholdMs
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: StateMachineArn
          Value: !GetAtt PATTERNSTACK.Outputs.StateMachineArn
      AlarmActions:
        - !Ref AlertsTopic
      TreatMissingData: notBreaching

  # A leaked workflow-concurrency counter is otherwise INVISIBLE: the queue stops
  # draining and every other metric looks idle rather than broken, so the first
  # signal is a human noticing that nothing has processed for hours. The queue
  # processor publishes the drift (counter minus executions actually RUNNING)
  # whenever it finds itself at the limit; a sustained positive drift means slots
  # are held by workflows that already ended.
  # The workflow tracker owns the concurrency-counter DECREMENT, so an event it
  # cannot process is not just a lost status update — it is a workflow slot that
  # was never released. The counter drifts up and, at MaxConcurrentWorkflows, the
  # stack stops admitting documents. The reconciler recovers from that and
  # ConcurrencyCounterDriftAlarm reports it, but both are downstream of the cause;
  # this alarm fires on the cause, on the first message, before anything stalls.
  WorkflowTrackerDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub "Alert when a ${AWS::StackName} workflow-completion event lands in the Workflow Tracker dead-letter queue. Each one is a workflow-concurrency slot that was not released and a document whose completion status was not recorded."
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt WorkflowTrackerDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      # Same reasoning as the other DLQ alarms: depth does not decay on its own,
      # so the OK is the only signal that distinguishes a drained queue from a
      # muted alarm.
      OKActions:
        - !Ref AlertsTopic

  # A document that reaches DocumentQueueDLQ has exhausted the redrive policy on
  # DocumentQueue — maxReceiveCount 1000 against a 30s visibility timeout, so
  # roughly 8 hours of retries — and no execution ever succeeded for it. Nothing
  # else reports this: the document never completed, so ExecutionsFailed and
  # ExecutionTime have no datapoint for it and both AWS/States alarms read OK.
  # Threshold 0 / one period: a message here is rare and every one is a lost
  # document, so there is nothing to tune and no reason to wait.
  # OKActions matter as much as AlarmActions here — DLQ depth does not decay
  # (MessageRetentionPeriod is 4 days, but the alarm is about the message, not
  # its expiry), so the recovery notification is the signal that a human
  # actually drained the queue rather than muting the alarm.
  DocumentQueueDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub "Alert when a document lands in the ${AWS::StackName} document dead-letter queue, meaning it failed every retry (~8 hours) and was never processed. No other alarm sees this: the document never ran to completion, so it emits neither ExecutionsFailed nor ExecutionTime. Inspect the messages in DocumentQueueDLQ to identify the object keys, find the cause in the QueueProcessor and state-machine logs, then redrive the queue or re-upload the objects. Redrive needs kms:Decrypt on the stack's CustomerManagedEncryptionKey."
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt DocumentQueueDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      OKActions:
        - !Ref AlertsTopic

  # QueueSenderDLQ holds S3 upload events the QueueSender could not process at
  # all, so the document never entered the pipeline. Which of two states it is
  # left in depends on where the invocation died, because create_document runs
  # BEFORE send_message (src/lambda/queue_sender/index.py): a failed enqueue
  # leaves a tracking row wedged at QUEUED forever, while a failed
  # create_document leaves no row at all. The first is the likelier case in a
  # queue named for the sender, so the description names it first — telling an
  # operator to look for an absent document when it is actually sitting in the
  # list at QUEUED is worse than saying nothing.
  # This is a Lambda ASYNC-INVOKE DLQ, not an SQS redrive DLQ, so
  # StartMessageMoveTask does NOT apply to it (that API supports only DLQs that
  # are configured as the dead-letter queue of another SQS queue) — re-upload is
  # the only recovery, and the console offers no redrive button here.
  QueueSenderDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub "Alert when an upload event lands in the ${AWS::StackName} queue-sender dead-letter queue. The document never entered the pipeline, and nothing else reports it: no execution ever started, so no workflow metric has a datapoint for it. Read the messages in QueueSenderDLQ for the S3 keys and check the QueueSender logs for the cause. The tracking row is written BEFORE the enqueue, so look for the document stuck at QUEUED in the Web UI; if it has no record at all, the DynamoDB write is what failed. Recovery is to re-upload the object — this is a Lambda async-invoke DLQ, so SQS redrive (StartMessageMoveTask) does not apply to it."
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt QueueSenderDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      OKActions:
        - !Ref AlertsTopic

  # "Queue not draining" cannot be alarmed on queue DEPTH, and it cannot be
  # alarmed on message AGE alone either.
  #
  # Depth is out because waiting is the design: QueueProcessor gates on the
  # DynamoDB concurrency counter and REFUSES a message by letting its 30s
  # visibility timeout lapse, so a bulk upload against MaxConcurrentWorkflows
  # legitimately parks thousands of messages in the queue.
  #
  # Age alone is out for the same reason, and more sharply than it first looks:
  # because a refused message is never deleted and re-sent,
  # ApproximateAgeOfOldestMessage measures time since the ORIGINAL send and
  # therefore climbs monotonically for as long as concurrency stays saturated.
  # A healthy stack draining a large batch will pass any fixed age threshold.
  #
  # So the alarm is age AND no progress: the oldest message is older than the
  # threshold *and* not a single message was deleted in the period. Deep but
  # draining stays OK at any depth; a wedged consumer (processor not polling, a
  # leaked concurrency counter, a poison message re-received forever) fires.
  #
  # SIX periods (30 minutes), not the two or three used elsewhere in this file,
  # because a message leaves DocumentQueue only when a workflow slot frees up:
  # with concurrency saturated by long-running documents, a healthy stack can
  # legitimately delete nothing for as long as its slowest document takes. A
  # shorter window would page on ordinary large-packet processing, and an alarm
  # that cries wolf gets muted, which costs more than the detection latency.
  # Thirty minutes of *zero* dequeues is the point where "slow" and "stuck" stop
  # being distinguishable from outside, and is worth an operator's attention
  # either way: at that point it is either a wedge or a capacity shortfall.
  #
  # NOT designed out, and deliberately so: a circuit-breaker pause trips this
  # too. A processor in the OPEN state pushes visibility out to
  # CircuitBreakerRecoveryTimeoutSeconds WITHOUT deleting the message
  # (queue_processor/index.py extend_visibility_for_outage), so age climbs and
  # deletions stay at zero — both conditions hold. Suppressing that would mean
  # muting the queue signal for the duration of a Bedrock outage, which is
  # exactly when documents pile up; correlating with BedrockServiceOutageAlarm on
  # the same topic is the cheaper answer, and only applies at all when the
  # circuit breaker is enabled (it defaults to off).
  #
  # FILL(m2, 0) is load-bearing, not defensive. SQS publishes
  # NumberOfMessagesDeleted only when deletions occur, so the totally stalled
  # case — the one this alarm exists for — produces NO datapoint. Without FILL
  # the expression would evaluate to missing exactly then, and
  # TreatMissingData: notBreaching would read that silence as healthy: an alarm
  # that is guaranteed to stay OK during the incident it was written for. See
  # test_cloudwatch_alarms.py for the earlier, closely-related #746 bug.
  DocumentQueueStalledAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub "Alert when the oldest document in the ${AWS::StackName} queue has waited more than ${QueueStalledAgeThresholdSeconds}s AND not one message left the queue for 30 minutes — i.e. the queue is not draining at all, rather than merely deep. Check the Workflow Concurrency Counter widget on the dashboard (a counter pinned at MaxConcurrentWorkflows with no running executions is a leaked slot; ConcurrencyCounterDriftAlarm covers that case), whether the QueueProcessor event-source mapping is enabled, and QueueProcessor errors and throttles. If BedrockServiceOutageAlarm is also active this is a circuit-breaker pause, not a wedge: the paused processor holds messages without deleting them, so this alarm fires too and clears on its own when the breaker closes. If executions ARE running and simply take longer than 30 minutes each, this is a capacity shortfall rather than a wedge: raise MaxConcurrentWorkflows, or raise QueueStalledAgeThresholdSeconds to accept it."
      Metrics:
        - Id: e1
          Label: QueueStalled
          ReturnData: true
          Expression: !Sub "IF(FILL(m1, 0) > ${QueueStalledAgeThresholdSeconds} AND FILL(m2, 0) < 1, 1, 0)"
        - Id: m1
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/SQS
              MetricName: ApproximateAgeOfOldestMessage
              Dimensions:
                - Name: QueueName
                  Value: !GetAtt DocumentQueue.QueueName
            Period: 300
            Stat: Maximum
        - Id: m2
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/SQS
              MetricName: NumberOfMessagesDeleted
              Dimensions:
                - Name: QueueName
                  Value: !GetAtt DocumentQueue.QueueName
            Period: 300
            Stat: Sum
      EvaluationPeriods: 6
      DatapointsToAlarm: 6
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      # Both metrics go absent once the queue has been idle for hours, which is
      # the emptiest possible queue rather than a stalled one.
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

  ConcurrencyCounterDriftAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub "Alert when the ${AWS::StackName} workflow-concurrency counter holds slots for workflows that have already ended (drift > 0 for 15 minutes). Documents stop starting once the counter reaches MaxConcurrentWorkflows."
      MetricName: ConcurrencyCounterDrift
      Namespace: !Ref AWS::StackName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      # The metric is only published when the processor is at the limit, so
      # "no data" means "not blocked" — which is healthy, not unknown.
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

  # Issue #719: before processing an upload, the queue sender purges
  # <key>/pages/ so OCR's retry-safe recovery cannot resurrect a PREVIOUS
  # document's page results under a reused filename; the reprocess resolver
  # purges more broadly for the same reason. A purge that only partly succeeds
  # is invisible otherwise — the document processes, reports success, and
  # silently carries text from the old document, because
  # discover_existing_ocr_pages needs just ONE surviving complete page
  # (rawText+result+textConfidence+image) to skip OCR for it. Both paths
  # therefore raise on a per-key delete failure and publish this metric;
  # ingest deliberately continues (a possibly-stale extraction beats a dropped
  # upload), which is exactly why the operator needs an alarm and not a log
  # line. The metric carries no dimensions and both emitters publish into the
  # ROOT stack's namespace (the nested resolver uses the StackName parameter,
  # not AWS::StackName), so this single alarm covers the ingest path and the
  # reprocess path alike.
  StaleOutputPurgeFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub "Alert when ${AWS::StackName} could not purge a document's stale OCR output (<key>/pages/) before processing it — on re-upload of an existing filename, or on Reprocess. The document still processes, but OCR may reuse the PREVIOUS document's page results, so its extraction can reflect the old document (issue #719). Find the affected keys in the QueueSender logs (ingest path, 'Failed to purge previous output data') or the ReprocessDocumentResolver logs (reprocess path, 'Failed to delete previous output data'), delete s3://<OutputBucket>/<key>/pages/ manually, then re-upload or reprocess."
      MetricName: StaleOutputPurgeFailed
      Namespace: !Ref AWS::StackName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      # Threshold 0 / GreaterThanThreshold: alarm on the FIRST failure. Unlike
      # concurrency drift there is no self-healing path here — the stale pages
      # sit in S3 until someone removes them, and every later upload of that
      # key inherits the same wrong results.
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      # Published only on failure, so "no data" means "every purge succeeded".
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

  ##########################################################################
  # Circuit Breaker Resources
  ##########################################################################

  CircuitBreakerManagerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: CircuitBreakerEnabledCondition
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-CircuitBreakerManager"
      KmsKeyId: !GetAtt CustomerManagedEncryptionKey.Arn
      RetentionInDays: !Ref LogRetentionDays

  CircuitBreakerManagerFunction:
    Type: AWS::Serverless::Function
    Condition: CircuitBreakerEnabledCondition
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "VPC attachment is conditional: required when ApiGatewayVisibility=PRIVATE (the private REST API and its callers only resolve inside the VPC) or DeployInVPC=true (DynamoDB reached via gateway endpoint). On the default/public path the function only talks to DynamoDB, SNS, and CloudWatch over AWS-managed networking and VPC access is not required."
          - id: W92
            reason: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_116: "DLQ not required - alarm-driven, idempotent state changes"
    # checkov:skip=CKV_AWS_117: "VPC attachment is conditional on ApiGatewayVisibility=PRIVATE or DeployInVPC=true (see VpcConfig below); default path does not require VPC access"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data"
    Properties:
      PermissionsBoundary:
        !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      Handler: index.handler
      Runtime: python3.12
      CodeUri: src/lambda/circuit_breaker_manager/
      Timeout: 30
      MemorySize: 256
      # When the REST API is PRIVATE, the function must run inside the VPC so it
      # can reach the private API and AWS service endpoints. When the user opted
      # into VPC-only Lambdas (DeployInVPC=true) but the API is still public,
      # we honour that too so DynamoDB traffic can use a gateway endpoint.
      VpcConfig: !If
        - UsePrivateApi
        - SecurityGroupIds:
            - !Ref LambdaVpcSecurityGroup
          SubnetIds: !Ref LambdaSubnetIds
        - !If
          - DeployInVPC
          - SecurityGroupIds:
              - !Ref LambdaSecurityGroupId
            SubnetIds: !Ref PrivateSubnetIds
          - !Ref AWS::NoValue
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          CONCURRENCY_TABLE: !Ref ConcurrencyTable
          ALERTS_TOPIC_ARN: !Ref AlertsTopic
          RECOVERY_TIMEOUT_SECONDS: !Ref CircuitBreakerRecoveryTimeoutSeconds
          ERROR_HANDLER_ARN: !Ref CircuitBreakerErrorHandlerArn
          METRIC_NAMESPACE: !Ref AWS::StackName
          # Empty under httpapi transport: circuit-breaker state is the source
          # of truth in ConcurrencyTable (DynamoDB); publish_to_appsync() no-ops
          # when APPSYNC_API_URL is empty, and the UI polls getCircuitBreakerStatus.
          APPSYNC_API_URL: ""
      LoggingConfig:
        LogGroup: !Ref CircuitBreakerManagerFunctionLogGroup
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConcurrencyTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AlertsTopic.TopicName
        - CloudWatchPutMetricPolicy: {}
        - Statement:
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:ReEncrypt*
                - kms:GenerateDataKey*
                - kms:DescribeKey
              Resource: !GetAtt CustomerManagedEncryptionKey.Arn
        - !If
          - HasCircuitBreakerErrorHandler
          - Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Ref CircuitBreakerErrorHandlerArn
          - !Ref AWS::NoValue

  CircuitBreakerTopic:
    Type: AWS::SNS::Topic
    Condition: CircuitBreakerEnabledCondition
    Properties:
      DisplayName: Circuit Breaker State Changes
      KmsMasterKeyId: !Ref CustomerManagedEncryptionKey

  BedrockServiceOutageAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CircuitBreakerEnabledCondition
    Properties:
      AlarmName: !Sub "${AWS::StackName}-BedrockServiceOutage"
      AlarmDescription: !Sub >-
        Circuit breaker: combined Bedrock error count (ServiceUnavailable=${CircuitBreakerTriggerServiceUnavailable},
        Throttling=${CircuitBreakerTriggerThrottling}, QuotaLimit=${CircuitBreakerTriggerQuotaLimit})
        exceeded ${CircuitBreakerFailureThreshold} in ${CircuitBreakerEvaluationPeriods} evaluation period(s).
      Metrics:
        - Id: e1
          Label: CombinedCircuitBreakerErrors
          ReturnData: true
          Expression: !Sub
            - "${SUCoef} * FILL(m1, 0) + ${ThrCoef} * FILL(m2, 0) + ${QLCoef} * FILL(m3, 0)"
            - SUCoef: !If [CircuitBreakerTriggerServiceUnavailableEnabled, "1", "0"]
              ThrCoef: !If [CircuitBreakerTriggerThrottlingEnabled, "1", "0"]
              QLCoef: !If [CircuitBreakerTriggerQuotaLimitEnabled, "1", "0"]
        - Id: m1
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: !Ref AWS::StackName
              MetricName: BedrockServiceUnavailable
            Period: 300
            Stat: Sum
        - Id: m2
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: !Ref AWS::StackName
              MetricName: BedrockThrottling
            Period: 300
            Stat: Sum
        - Id: m3
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: !Ref AWS::StackName
              MetricName: BedrockQuotaLimit
            Period: 300
            Stat: Sum
      EvaluationPeriods: !Ref CircuitBreakerEvaluationPeriods
      Threshold: !Ref CircuitBreakerFailureThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref CircuitBreakerTopic
      OKActions:
        - !Ref CircuitBreakerTopic

  CircuitBreakerTopicSubscription:
    Type: AWS::SNS::Subscription
    Condition: CircuitBreakerEnabledCondition
    Properties:
      TopicArn: !Ref CircuitBreakerTopic
      Protocol: lambda
      Endpoint: !GetAtt CircuitBreakerManagerFunction.Arn

  CircuitBreakerManagerInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: CircuitBreakerEnabledCondition
    Properties:
      FunctionName: !Ref CircuitBreakerManagerFunction
      Action: lambda:InvokeFunction
      Principal: !Sub "sns.${AWS::URLSuffix}"
      SourceArn: !Ref CircuitBreakerTopic

  # Runs every 5 min whenever the breaker is enabled (including CLOSED) so
  # recovery timeouts always converge. Cost is ~8.6k invocations/month; remove
  # this rule to disable automated recovery and rely solely on manual reset.
  CircuitBreakerHealthCheckRule:
    Type: AWS::Events::Rule
    Condition: CircuitBreakerEnabledCondition
    Properties:
      Description: Periodic health check for circuit breaker recovery
      ScheduleExpression: rate(5 minutes)
      State: ENABLED
      Targets:
        - Id: CircuitBreakerHealthCheck
          Arn: !GetAtt CircuitBreakerManagerFunction.Arn
          Input: '{"source": "scheduled", "action": "health_check"}'

  CircuitBreakerHealthCheckPermission:
    Type: AWS::Lambda::Permission
    Condition: CircuitBreakerEnabledCondition
    Properties:
      FunctionName: !Ref CircuitBreakerManagerFunction
      Action: lambda:InvokeFunction
      Principal: !Sub "events.${AWS::URLSuffix}"
      SourceArn: !GetAtt CircuitBreakerHealthCheckRule.Arn

