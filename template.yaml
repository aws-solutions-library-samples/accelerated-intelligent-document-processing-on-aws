AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: AWS GenAI IDP Accelerator (uksb-r8evguc4p9) (SO9027) (v<VERSION>)

Mappings:
  CrawlerScheduleMap:
    Manual:
      ScheduleExpression: ""
    Every15m:
      ScheduleExpression: "cron(0/15 * * * ? *)"
    EveryHour:
      ScheduleExpression: "cron(0 * * * ? *)"
    EveryDay:
      ScheduleExpression: "cron(0 0 * * ? *)"

  ConfigurationMap:
    lending-package-sample:
      ConfigPath: "lending-package-sample"
    rvl-cdip:
      ConfigPath: "rvl-cdip"
    rvl-cdip-with-few-shot-examples:
      ConfigPath: "rvl-cdip-with-few-shot-examples"
    bank-statement-sample:
      ConfigPath: "bank-statement-sample"
    docsplit:
      ConfigPath: "docsplit"
    realkie-fcc-verified:
      ConfigPath: "realkie-fcc-verified"
    ocr-benchmark:
      ConfigPath: "ocr-benchmark"
    rule-validation:
      ConfigPath: "rule-validation"
    lending-package-sample-govcloud:
      ConfigPath: "lending-package-sample-govcloud"

  # AWS Management Console domain per partition. Output console-URLs must use the
  # partition-correct domain: hardcoded "console.aws.amazon.com" links break in
  # GovCloud (they must be "console.amazonaws-us-gov.com"). Consumed in Outputs
  # via !FindInMap [ConsoleDomainMap, !Ref "AWS::Partition", Domain].
  ConsoleDomainMap:
    aws:
      Domain: "console.aws.amazon.com"
    aws-us-gov:
      Domain: "console.amazonaws-us-gov.com"
    aws-cn:
      Domain: "console.amazonaws.cn"

Parameters:
  # NOTE: the legacy ApiTransport parameter has been removed. The UI/backend
  # now always use the API Gateway REST API + polling + Lambda response
  # streaming (the former GraphQL API has been fully removed).

  LambdaWebAdapterLayerArn:
    Type: String
    # Public AWS Lambda Web Adapter layer (x86_64). The account 753240598075 is
    # the LWA publisher; the layer name/version are region-stable. Leave blank
    # to default to the LWA layer in this stack's region (constructed as
    # arn:${AWS::Partition}:lambda:${AWS::Region}:753240598075:...), or set it to
    # pin a specific version / point at a layer you published yourself.
    #
    # NOTE (GovCloud/China): LWA is published ONLY in the commercial partition.
    # AWS account IDs do not exist across partitions, so ${AWS::Partition}
    # substitution alone cannot make that ARN resolve — a GovCloud deploy fails
    # with a 403 on lambda:GetLayerVersion that reads like a missing
    # resource-based policy but is really a partition mismatch no identity policy
    # can fix. The --govcloud transform therefore REMOVES
    # ChatStreamProcessorFunction (and this parameter) outright and the UI falls
    # back to its polling chat transport; see docs/govcloud-deployment.md. Set
    # this parameter only if you have published an LWA layer into the target
    # partition yourself.
    Default: ""
    Description: >-
      ARN of the AWS Lambda Web Adapter layer used by the chat streaming Function
      URL. Leave blank to use the region-default LWA x86_64 layer, or set it to
      pin a version / use a layer you published yourself. LWA is published only
      in the commercial AWS partition.

  # Authorization params
  AdminEmail:
    Type: String
    Description: >-
      Email address of the admin user (e.g. jdoe+admin@example.com).
      An initial temporary password is automatically sent to this user via email.
      (CI/automation sentinel: the special value
      "citest@suppress.welcome.email" creates the admin user WITHOUT sending the
      Cognito invitation email — see the AdminUser resource — so automated
      deployments that never use the emailed password don't exhaust Cognito's
      low default daily email quota. Do not use it for real deployments.)
    AllowedPattern: '^[\w.+-]+@([\w-]+\.)+[\w-]{2,6}$'

  AllowedSignUpEmailDomain:
    Type: String
    Default: ""
    Description: >-
      Email address domain (example.com) or comma separated list of email domains (example1.com,
      example2.com) allowed to signup using the web UI.
      If left empty, signup via the web UI is disabled and users will have to be created
      using Cognito.
    AllowedPattern: '^(|([\w-]+\.)+[\w-]{2,6}(, *([\w-]+\.)+[\w-]{2,6})*)$'
    ConstraintDescription: >-
      Must be empty or a list of comma separated email domains (example1.com, example2.com)

  # External Identity Provider (Federation)

  ExternalIdPType:
    Type: String
    Default: ""
    AllowedValues:
      - ""
      - "SAML"
      - "OIDC"
    Description: >-
      (Optional) Type of external identity provider to federate with Cognito.
      Choose SAML for providers like PingOne, Okta SAML, or ADFS.
      Choose OIDC for providers like Okta OIDC, Auth0, or Azure AD.
      Leave empty to use Cognito-native authentication only.

  ExternalIdPName:
    Type: String
    Default: ""
    Description: >-
      (Required when ExternalIdPType is set) Display name for the external identity provider (e.g. PingOne, Okta, AzureAD).
      Must be alphanumeric with hyphens only. This name is used in the Cognito hosted UI sign-in button.
    AllowedPattern: '^(|[a-zA-Z][a-zA-Z0-9-]{0,31})$'
    ConstraintDescription: >-
      Must be empty or start with a letter, contain only alphanumeric characters and hyphens, max 32 characters

  ExternalIdPMetadataURL:
    Type: String
    Default: ""
    Description: >-
      (Required for SAML) The SAML metadata document URL from your identity provider.
      For example: https://idp.example.com/saml/metadata
    AllowedPattern: '^(|https://.+)$'
    ConstraintDescription: Must be empty or a valid HTTPS URL

  ExternalIdPOIDCIssuer:
    Type: String
    Default: ""
    Description: >-
      (Required for OIDC) The issuer URL from your OIDC identity provider.
      For example: https://login.example.com or https://example.okta.com/oauth2/default
    AllowedPattern: '^(|https://.+)$'
    ConstraintDescription: Must be empty or a valid HTTPS URL

  ExternalIdPOIDCClientId:
    Type: String
    Default: ""
    Description: >-
      (Required for OIDC) The client ID registered with your OIDC identity provider.

  ExternalIdPOIDCClientSecretArn:
    Type: String
    Default: ""
    Description: >-
      (Required for OIDC) The ARN of an AWS Secrets Manager secret containing the OIDC client secret.
      Create the secret before deploying: aws secretsmanager create-secret --name my-idp-oidc-secret --secret-string "YOUR_CLIENT_SECRET"

  ExternalIdPGroupAttributeName:
    Type: String
    Default: ""
    Description: >-
      (Optional) The SAML attribute or OIDC claim name that carries group membership from the external IdP.
      For SAML, this is typically http://schemas.xmlsoap.org/claims/Group or memberOf.
      For OIDC, this is typically groups. Leave empty to skip automatic group mapping.

  ExternalIdPAdminGroupName:
    Type: String
    Default: ""
    Description: >-
      (Optional) The group name in your external IdP that should map to the Cognito Admin role.
      For example: IDP-Admins or cn=Admins,ou=Groups,dc=example,dc=com

  ExternalIdPAuthorGroupName:
    Type: String
    Default: ""
    Description: >-
      (Optional) The group name in your external IdP that should map to the Cognito Author role.
      For example: IDP-Authors

  ExternalIdPReviewerGroupName:
    Type: String
    Default: ""
    Description: >-
      (Optional) The group name in your external IdP that should map to the Cognito Reviewer role.
      For example: IDP-Reviewers

  ExternalIdPViewerGroupName:
    Type: String
    Default: ""
    Description: >-
      (Optional) The group name in your external IdP that should map to the Cognito Viewer role.
      For example: IDP-Viewers

  ExternalIdPAutoLogin:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: >-
      (Optional) When enabled and an external IdP is configured, users are automatically redirected
      to the external IdP for authentication instead of seeing the Cognito login page first.
      Native Cognito username/password login is still available by navigating directly to the Cognito hosted UI.

  # Custom Configuration Path

  CustomConfigPath:
    Type: String
    Default: ""
    Description: >-
      S3 URI pointing to your custom configuration YAML file. When provided, this configuration overrides the selected pattern preset and applies to all processing patterns. 
      Leave blank to use the selected pattern configuration preset. For example s3://my-bucket/custom-config/config.yaml
    AllowedPattern: '^(|s3://.*)$'
    ConstraintDescription: Must be empty or a valid S3 URI (e.g., s3://my-bucket/custom-config/config.yaml)

  ConfigurationPreset:
    Type: String
    Default: "lending-package-sample"
    AllowedValues:
      - "lending-package-sample"
      - "lending-package-sample-govcloud"
      - "rvl-cdip"
      - "rvl-cdip-with-few-shot-examples"
      - "bank-statement-sample"
      - "docsplit"
      - "realkie-fcc-verified"
      - "ocr-benchmark"
      - "rule-validation"
    Description: >-
      Select the configuration preset. Each configuration contains pre-tuned settings for specific document processing scenarios - see https://github.com/aws-samples/sample-genai-idp/blob/main/config_library/README.md. Note: Custom Configuration Path overrides this when provided.

  Pattern2CustomClassificationModelARN:
    Type: String
    Default: ""
    Description: Specify Custom Fine Tuned Classification Model ARN. Leave blank to use pretrained model specified in the selected configuration.

  Pattern2CustomExtractionModelARN:
    Type: String
    Default: ""
    Description: Specify Custom Fine Tuned Extraction Model ARN. Leave blank to use pretrained model specified in the selected configuration.

  # Evaluation
  EvaluationBaselineBucketName:
    Type: String
    Default: ""
    Description: >-
      (Optional) Existing bucket used for baseline (ground truth) data for processed documents. Baseline data is used to asess the accuracy 
      of the processing pattern outputs. 
      Provide the name of an existing bucket here. Hint: you can use the Output bucket of another GenAIIDP stack to compare the outputs from 
      different patterns and prompts. 
      Leave blank to automatically create an empty bucket where you can (optionally) place your validated baseline data later.

  ReportingBucketName:
    Type: String
    Default: ""
    Description: >-
      (Optional) Existing bucket used for analytics. (Currently used for evaluation analytics)
      Provide the name of an existing bucket here or leave blank to automatically create a new bucket.

  ReportingBucketKmsKeyArn:
    Type: String
    Default: ""
    Description: >-
      (Optional) KMS key ARN that encrypts the existing ReportingBucketName. Required when
      ReportingBucketName is provided AND that bucket is encrypted with a customer-owned KMS
      key different from this stack's CustomerManagedEncryptionKey. The MeteringHour migration
      Lambda needs kms:Decrypt/GenerateDataKey on this key to read historical metering parquet
      files during upgrade. Leave blank if using the auto-created reporting bucket or if the
      existing bucket uses SSE-S3 / a key this stack's role already accesses.

  DocumentSectionsCrawlerFrequency:
    Type: String
    Default: "EveryDay"
    AllowedValues:
      - "Manual"
      - "Every15m"
      - "EveryHour"
      - "EveryDay"
    Description: >-
      Frequency for the Glue Crawler to run and discover new document section tables and partitions.
      Manual requires manual execution, other options run automatically at the specified interval.


  # X-Ray Tracing
  EnableXRayTracing:
    Type: String
    Default: 'true'
    AllowedValues: [ 'true', 'false' ]
    Description: Enable X-Ray tracing

  # MCP Integration
  EnableMCP:
    Type: String
    Default: 'true'
    AllowedValues: [ 'true', 'false' ]
    Description: Enable Model Context Protocol (MCP) integration for external application access via AWS Bedrock AgentCore Gateway

  EnableQuickStartWidget:
    Type: String
    Default: 'true'
    AllowedValues: [ 'true', 'false' ]
    Description: Show the floating Quick Start chat widget in the web UI for prompt-based config bootstrap

  # Optional Knowledge Base Configuration
  DocumentKnowledgeBase:
    Default: "BEDROCK_KNOWLEDGE_BASE (Create)"
    Type: String
    AllowedValues:
      - "DISABLED"
      - "BEDROCK_KNOWLEDGE_BASE (Create)"
    Description: Use document processing results as knowledge base content. Model access for amazon.titan-embed-text-v2:0 MUST be enabled in Amazon Bedrock.

  KnowledgeBaseVectorStore:
    Type: String
    Default: "S3_VECTORS"
    AllowedValues:
      - "OPENSEARCH_SERVERLESS"
      - "S3_VECTORS"
    Description: Choose vector store type for Bedrock Knowledge Base. S3 Vectors (default) for cost-effective storage with sub-second latency, OpenSearch Serverless for sub-millisecond queries.

  KnowledgeBaseModelId:
    Type: String
    Default: "us.amazon.nova-pro-v1:0"
    AllowedValues:
      - "us.amazon.nova-lite-v1:0"
      - "us.amazon.nova-pro-v1:0"
      - "us.amazon.nova-premier-v1:0"
      - "us.amazon.nova-2-lite-v1:0"
      - "us.amazon.nova-2-lite-v1:0:priority"
      - "us.amazon.nova-2-lite-v1:0:flex"
      - "global.amazon.nova-2-lite-v1:0"
      - "global.amazon.nova-2-lite-v1:0:priority"
      - "global.amazon.nova-2-lite-v1:0:flex"
      - "us.anthropic.claude-3-haiku-20240307-v1:0"
      - "us.anthropic.claude-3-5-sonnet-20241022-v2:0"
      - "us.anthropic.claude-3-7-sonnet-20250219-v1:0"
      - "us.anthropic.claude-sonnet-4-20250514-v1:0"
      - "us.anthropic.claude-sonnet-4-5-20250929-v1:0"
      - "us.anthropic.claude-sonnet-5"
      - "eu.amazon.nova-lite-v1:0"
      - "eu.amazon.nova-pro-v1:0"
      - "eu.amazon.nova-2-lite-v1:0"
      - "eu.amazon.nova-2-lite-v1:0:priority"
      - "eu.amazon.nova-2-lite-v1:0:flex"
      - "eu.anthropic.claude-3-haiku-20240307-v1:0"
      - "eu.anthropic.claude-3-5-sonnet-20241022-v2:0"
      - "eu.anthropic.claude-3-7-sonnet-20250219-v1:0"
      - "eu.anthropic.claude-sonnet-4-20250514-v1:0"
      - "eu.anthropic.claude-sonnet-4-5-20250929-v1:0"
      - "qwen.qwen3-vl-235b-a22b"
      - "global.amazon.nova-2-lite-v1:0"
      - "global.anthropic.claude-haiku-4-5-20251001-v1:0"
      - "global.anthropic.claude-sonnet-4-5-20250929-v1:0"
      - "global.anthropic.claude-sonnet-5"
      # GovCloud: none of the us./eu./global. cross-region inference-profile
      # prefixes above work in GovCloud regions (ValidationException: "The
      # provided model identifier is invalid."). Bare model IDs and the
      # us-gov. inference profile (for models that require one) are the only
      # forms that work. Verified live against us-gov-west-1 via
      # bedrock-runtime Converse on 2026-07-17.
      - "amazon.nova-pro-v1:0"
      - "amazon.nova-lite-v1:0"
      - "us-gov.anthropic.claude-sonnet-4-5-20250929-v1:0"

    Description: Model to use for optional Document Knowledge Base. Model access MUST be enabled in Amazon Bedrock. Note - Nova Premier may not be available in all EU regions. GovCloud deployments must use one of the GovCloud-verified entries above (amazon.nova-pro-v1:0, amazon.nova-lite-v1:0, or us-gov.anthropic.claude-sonnet-4-5-20250929-v1:0) — the commercial default is overridden automatically by the --govcloud template transform.

  # Optional - Post processing Lambda hook
  PostProcessingLambdaHookFunctionArn:
    Default: ""
    Type: String
    AllowedPattern: "^(|arn:aws[a-z-]*:lambda:.*)$"
    Description: >
      (Optional) The specified Lambda function is invoked by EventBridge after the document processing workflow is processed.
      This function can implement custom logic to initiate downstream processing on the output of the processing pattern.

  # Optional Bedrock Guardrail Configuration
  BedrockGuardrailId:
    Type: String
    Default: ""
    AllowedPattern: "^(|[a-z0-9]+)$"
    Description: >
      Optionally provide the *Id* (not name) of an *existing* Bedrock Guardrail (looks like: wxyz3ab12x34) to be used for all Bedrock and Bedrock Knowledge Base interactions.

  BedrockGuardrailVersion:
    Type: String
    Default: "DRAFT"
    AllowedPattern: "^(|(([1-9][0-9]{0,7})|(DRAFT)))$"
    Description: >
      If you provided a Bedrock Guardrail Id above, provide the corresponding Guardrail version here (e.g. DRAFT|1|2|...).

  # Optional Cross-Account Bedrock (Hub Account) Configuration
  BedrockHubRoleArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:(aws|aws-cn|aws-us-gov|aws-iso|aws-iso-b):iam::[0-9]{12}:role/[\\w+=,.@\\-/]+$"
    ConstraintDescription: "Must be empty or a valid IAM role ARN. The ARN must NOT contain spaces — pass ExternalId via the separate BedrockHubRoleExternalId parameter."
    Description: >
      (Optional) ARN of an IAM role in a centralized "hub" account that this stack
      should assume for all Amazon Bedrock data-plane and control-plane API calls.
      When set, all Bedrock invocations (data-plane and control-plane) are routed
      through sts:AssumeRole to this role using refreshable credentials. Leave empty
      to call Bedrock from the local account (default behavior).

  BedrockHubRoleExternalId:
    Type: String
    Default: ""
    NoEcho: true
    Description: >
      (Optional) ExternalId to include in sts:AssumeRole calls for the Bedrock hub role.
      Required only when the hub-account role's trust policy enforces an ExternalId.

  BedrockHubRoleSessionName:
    Type: String
    Default: ""
    AllowedPattern: "^[\\w+=,.@-]{0,64}$"
    Description: >
      (Optional) Session name for sts:AssumeRole calls (max 64 chars; characters
      allowed: A-Z a-z 0-9 + = , . @ - _). Defaults to the calling Lambda function name
      for CloudTrail attribution in the hub account.

  # General Configuration
  MaxConcurrentWorkflows:
    Type: Number
    Default: 100
    Description: Maximum number of concurrent workflow executions allowed
    MinValue: 1

  DataRetentionInDays:
    Type: Number
    Default: 365
    Description: Number of days to retain documents (S3) and tracking records (DynamoDB)
    MinValue: 1

  ErrorThreshold:
    Type: Number
    Default: 1
    Description: Number of workflow errors that triggers an alert (per 5 minutes)
    MinValue: 1

  ExecutionTimeThresholdMs:
    Type: Number
    Default: 300000
    Description: Maximum acceptable execution time in milliseconds before alerting (default 300000 = 300 seconds)
    MinValue: 1000

  QueueStalledAgeThresholdSeconds:
    Type: Number
    Default: 1800
    Description: >-
      Age of the oldest queued document, in seconds, above which
      DocumentQueueStalledAlarm fires -- but only while nothing at all is
      leaving the queue (see that alarm). Because messages wait in the queue by
      design while workflow concurrency is saturated, this is a "how long is too
      long to wait with no progress whatsoever" bound, not a backlog-depth
      limit. Raise it if bulk uploads against a low MaxConcurrentWorkflows
      produce alarms you consider normal.
    MinValue: 60

  BDACallbackTimeoutSeconds:
    Type: Number
    Default: 7200
    Description: >-
      Maximum seconds the BDA step waits for its asynchronous completion callback
      before failing the execution (default 7200 = 2 hours). Only affects BDA
      mode. Without a bound, a lost callback leaves the execution waiting
      forever, emitting neither ExecutionsFailed nor ExecutionTime, so no alarm
      can see it while it holds a concurrency slot. Raise it if very large
      packets hit spurious States.Timeout failures.
    MinValue: 60
    MaxValue: 86400

  # Security Configuration
  PermissionsBoundaryArn:
    Type: String
    Default: ""
    Description: >-
      (Optional) ARN of an existing IAM Permissions Boundary policy to attach to all IAM roles.
      Required by some organizations with Service Control Policies (SCPs).
      Format: arn:partition:iam::account-id:policy/policy-name
      Leave blank if no Permissions Boundary is required.
    AllowedPattern: "^(|arn:aws[a-z-]*:iam::[0-9]{12}:policy/.+)$"
    ConstraintDescription: Must be empty or a valid IAM policy ARN

  EnableECRImageScanning:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: >-
      Enable automatic vulnerability scanning for Lambda container images in ECR (applies to Pattern-1 and Pattern-2).
      Disabling may improve deployment reliability but reduces security posture.
      Recommended: true for production, false only if experiencing deployment issues.

  LambdaArchitecture:
    Type: String
    Default: "arm64"
    AllowedValues:
      - "arm64"
      - "x86_64"
    Description: >-
      CPU architecture for Lambda container images in the unified pattern.
      Use arm64 (Graviton) for best price-performance, or x86_64 when using
      custom base images that only support AMD64.

  # Logging configuration
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues:
      - DEBUG
      - INFO
      - WARN
      - ERROR
    Description: Default logging level for all logs

  LogRetentionDays:
    Type: Number
    Default: 30
    Description: Number of days to retain CloudWatch logs
    AllowedValues:
      [
        1,
        3,
        5,
        7,
        14,
        30,
        60,
        90,
        120,
        150,
        180,
        365,
        400,
        545,
        731,
        1827,
        3653,
      ]

  WebUIHosting:
    Type: String
    Default: CloudFront
    AllowedValues:
      - CloudFront
      - APIGateway
    Description: >-
      Frontend hosting method. Use CloudFront (default) for public/standard
      deployments. Use APIGateway for GovCloud or private-network deployments
      that require VPC-based hosting: the Web UI is served as an S3 proxy on the
      same REST API that already backs the UI, so it inherits the API's
      visibility (set ApiGatewayVisibility=PRIVATE for VPC-only access) and its
      optional WAFv2 IP allow-list (WAFAllowedIPv4Ranges).

  S3VpcEndpointIdOverride:
    Type: String
    Default: ""
    Description: >
      Optional. Existing S3 Interface VPC Endpoint ID (vpce-...) from a central
      network account. When provided, presigned S3 URLs for browser uploads use
      this endpoint. Leave empty for standard deployments (browser uploads then
      use the global/regional S3 endpoint). When this is set you MUST also set
      S3VpcEndpointDnsNameOverride, and S3PresignedUrlViaVpcEndpoint must be
      "true" to take effect.

  S3VpcEndpointDnsNameOverride:
    Type: String
    Default: ""
    Description: >
      Optional. Regional DNS name of the BYO S3 Interface VPC Endpoint, with
      the AWS-assigned random suffix and the leading "*." stripped (format:
      "vpce-<id>-<suffix>.s3.<region>.vpce.<url-suffix>").
      Required when S3VpcEndpointIdOverride is set. Get from
      "aws ec2 describe-vpc-endpoints --vpc-endpoint-ids <id> --query
      'VpcEndpoints[0].DnsEntries[0].DnsName'" then strip the leading "*.".

  CustomDomainUrl:
    Type: String
    Default: ""
    AllowedPattern: "^$|^https://[a-z0-9.-]+(:[0-9]+)?$"
    ConstraintDescription: >-
      Must be empty or start with "https://" followed by a lowercase host
      (and optional :port) with no path or trailing slash
      (e.g. https://idp.example.com).
    Description: >
      Optional. Public-facing custom domain URL through which end users access
      the Web UI (e.g. https://idp.example.com). Required when the application
      is fronted by a customer-owned DNS alias, an Okta/SAML/OIDC SSO domain,
      or any origin other than the auto-generated API Gateway or CloudFront URL.
      When set, this origin is added to all S3 bucket CORS AllowedOrigins and to
      Cognito App Client CallbackURLs / LogoutURLs so that browser uploads
      and OAuth redirects succeed from the custom domain. The Web UI also
      switches to using window.location.origin for OAuth redirects, which
      keeps both the API Gateway URL and the custom domain working
      simultaneously. Must include scheme (https://) and lowercase host only —
      no uppercase, no trailing slash, no path. Lowercase is required because
      the Web UI's Amplify config lowercases the redirect URL before sending it
      to Cognito (browsers normalize the Origin header host to lowercase), and
      Cognito matches CallbackURLs case-sensitively after that. Leave empty
      for standard deployments where the API Gateway or CloudFront URL is the
      only browser entry point.

  S3PresignedUrlViaVpcEndpoint:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: >
      Controls whether presigned S3 URLs (for browser uploads) target the S3
      VPC Interface Endpoint or the global (regional) S3 endpoint.
      "false" (default): presigned URLs use global S3 — browser uploads go
      through NAT or internet. No special DNS configuration required.
      "true": presigned URLs use the S3 VPC Interface Endpoint DNS name, so
      browser uploads transit the VPCE. Requires the browser's network to
      resolve and route VPCE hostnames.

  ApiGatewayVisibility:
    Type: String
    Default: GLOBAL
    AllowedValues:
      - GLOBAL
      - PRIVATE
    Description: >-
      GLOBAL = regional internet-facing REST API; PRIVATE = private REST API
      reachable only via the VPC interface endpoint (requires DeployInVPC=true,
      VpcId, ApiGatewayVpcEndpointId, LambdaSubnetIds) and all Lambdas deployed
      in-VPC. When WebUIHosting=APIGateway the Web UI is served on this same
      REST API, so PRIVATE also makes the Web UI VPC-only.

  LambdaSubnetIds:
    Type: CommaDelimitedList
    Default: ""
    Description: >-
      (Required when ApiGatewayVisibility=PRIVATE) Comma-separated private subnet
      IDs for Lambda functions. Should be private subnets with no direct
      internet route - Lambda traffic reaches AWS services via VPC endpoints.
      Can be the same as PrivateSubnetIds for simpler deployments, or different
      private subnets for stricter network isolation. Minimum 2 subnets in
      different Availability Zones recommended.

  CloudFrontPriceClass:
    Type: String
    Default: PriceClass_100
    Description: >-
      (CloudFront hosting only) Specify the CloudFront price class. See
      https://aws.amazon.com/cloudfront/pricing/ for a description of each
      price class.
    AllowedValues:
      - PriceClass_100
      - PriceClass_200
      - PriceClass_All
    ConstraintDescription: >-
      Allowed Price Classes PriceClass_100 PriceClass_200 and PriceClass_All

  CloudFrontAllowedGeos:
    Type: String
    Default: ""
    Description: >-
      Specify a comma separated list of two letter country codes (uppercase ISO 3166-1)
      that are
      allowed to access the web user interface via CloudFront. For example: US,CA.
      Leave empty if
      you do not want geo restrictions to be applied.
    AllowedPattern: "^(|[A-Z]{2}(,[A-Z]{2})*)$"
    ConstraintDescription: >-
      Comma separated list of uppercase two letter country codes or empty

  WAFAllowedIPv4Ranges:
    Type: String
    Default: "0.0.0.0/0"
    Description: >-
      Comma-separated list of IPv4 CIDR ranges to allow. Default (0.0.0.0/0) disables WAF and allows all IPs.
      Example to restrict: "192.168.1.0/24, 10.0.0.0/16"
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}\/[0-9]{1,2}(,\s*([0-9]{1,3}\.){3}[0-9]{1,3}\/[0-9]{1,2})*$'
    ConstraintDescription: Must be valid comma-separated list of IPv4 CIDR ranges

  ArtifactsBucketKmsKeyArn:
    Type: String
    Default: ""
    Description: >-
      (Optional) ARN of a KMS CMK used to encrypt the artifacts S3 bucket.
      When the artifacts bucket was pre-created with KMS encryption, provide
      the key ARN here so that CodeBuild (Docker image builds) and Lambda
      (configuration copy) can perform kms:Decrypt to read source artifacts.
      Leave empty if the artifacts bucket uses SSE-S3 (default AES256) encryption.
    AllowedPattern: "^(|arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/.+)$"
    ConstraintDescription: Must be empty or a valid KMS key ARN

  # ------------------------------------------------------------------------
  # Public template version-check (used to surface an "Update available"
  # indicator in the Web UI's Deployment Info nav section).
  #
  # When PublicArtifactsBucket is set, the UI calls a Lambda resolver that
  # lists the bucket prefix for versioned templates of the form
  # `<prefix>/idp-main_<version>.yaml`, picks the highest semver, and
  # compares it with the deployed Version. If newer, an "Update" badge is
  # rendered next to the deployed version (the Update Stack deep-link is
  # only active for Admin users).
  #
  # Default values point at the public IDP release bucket so out-of-the-box
  # deployments get the indicator. Set PublicArtifactsBucket to "" to
  # disable the check entirely (recommended for headless / private network
  # deployments that can't reach the public bucket).
  # ------------------------------------------------------------------------
  PublicArtifactsBucket:
    Type: String
    # `idp-cli publish` substitutes the publishing bucket here so that
    # operators publishing to e.g. aws-ml-blog-us-west-2 get zero-touch
    # version-check working out of the box. Falls back to empty string
    # (= check disabled) for headless / private-network builds.
    Default: "<PUBLIC_ARTIFACTS_BUCKET_TOKEN>"
    Description: >-
      (Optional) S3 bucket holding the public IDP CloudFormation templates
      used for the "update available" check shown in the Web UI Deployment
      Info section. Leave empty to disable the check (default for headless
      / private-network deployments). For the public release, point this at
      the regional aws-ml-blog bucket — e.g. aws-ml-blog-us-west-2.

  PublicArtifactsPrefix:
    Type: String
    # `idp-cli publish` substitutes the publishing prefix (without version
    # suffix) so the version-check resolver can list sibling versioned
    # templates published under the same prefix. Falls back to the public
    # release default when not substituted.
    Default: "<PUBLIC_ARTIFACTS_PREFIX_TOKEN>"
    Description: >-
      S3 key prefix under PublicArtifactsBucket where the versioned
      idp-main_<version>.yaml templates live. Only used when
      PublicArtifactsBucket is set.

  # MLflow Integration
  EnableMLflow:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable MLflow experiment tracking integration

  MlflowTrackingURI:
    Type: String
    Default: ""
    Description: SageMaker MLflow tracking server ARN

  # Circuit Breaker Configuration
  CircuitBreakerEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: >-
      Enable circuit breaker for Bedrock service outages. When enabled, the system
      automatically detects Bedrock failures and blocks new workflows until the
      service recovers.

  CircuitBreakerFailureThreshold:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 100
    Description: >-
      Combined error count across selected trigger metrics within the evaluation
      window that opens the circuit breaker. See CircuitBreakerTrigger* params.

  CircuitBreakerTriggerServiceUnavailable:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: >-
      Count Bedrock ServiceUnavailable (503) errors toward the circuit breaker
      failure threshold.

  CircuitBreakerTriggerThrottling:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: >-
      Count Bedrock throttling errors (ThrottlingException,
      TooManyRequestsException, RequestLimitExceeded) toward the circuit breaker
      failure threshold.

  CircuitBreakerTriggerQuotaLimit:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: >-
      Count Bedrock service quota errors (ServiceQuotaExceededException) toward
      the circuit breaker failure threshold.

  CircuitBreakerEvaluationPeriods:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 10
    Description: >-
      Number of 5-minute periods to evaluate for circuit breaker threshold.
      For example, 1 period = 5 minutes, 2 periods = 10 minutes.

  CircuitBreakerRecoveryTimeoutSeconds:
    Type: Number
    Default: 300
    MinValue: 60
    MaxValue: 3600
    Description: >-
      Seconds to wait before attempting recovery after the circuit breaker opens.
      After this timeout, the circuit enters HALF_OPEN state to test if Bedrock
      has recovered.

  CircuitBreakerErrorHandlerArn:
    Type: String
    Default: ""
    AllowedPattern: "^(|arn:aws[a-z-]*:lambda:[a-z0-9-]+:[0-9]{12}:function:.+)$"
    Description: >-
      (Optional) Lambda ARN for custom error handling when circuit breaker opens.
      This Lambda is invoked asynchronously when the circuit opens, allowing
      custom alerting or remediation logic.
  # Jobs API Configuration
  # ------------------------------------------------------------------------
  # Jobs REST API Deployment (required for GovCloud)
  #
  # These parameters control the optional Jobs REST API, an ADDITIVE switch
  # (formerly called headless mode) that stands up a private Jobs REST API
  # (API Gateway + Lambda + a machine-to-machine Cognito OAuth client) IN
  # ADDITION TO the web UI. This is REQUIRED for GovCloud regions because
  # some UI-layer services (e.g. CloudFront, Cognito UI pool) aren't
  # available there. In Commercial regions the Jobs API is OPTIONAL and
  # useful for API-only / machine-to-machine integrations.
  #
  # NOTE: This is distinct from the `idp-cli deploy --headless` CLI flag,
  # which is a template transform that REMOVES the web UI entirely.
  # EnableJobsApi does NOT remove the UI — it adds the Jobs API alongside it.
  #
  # All parameters below default to OFF / empty. Leaving them at defaults
  # keeps the stack as a pure web-UI deployment with no Jobs API, no VPC
  # placement of Lambdas, and no bastion EC2.
  #
  # See docs/govcloud-deployment.md for deployment patterns and
  # docs/govcloud-batch-api.md for the Jobs API reference.
  # ------------------------------------------------------------------------

  EnableJobsApi:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      Set to 'true' to deploy the Jobs REST API (Private API Gateway
      + /jobs endpoints + supporting Lambdas). Default 'false' = no Jobs API
      is deployed. Required for GovCloud. When 'true', you must also set
      DeployInVPC=true and populate VpcId, PrivateSubnetIds,
      ApiGatewayVpcEndpointId, and LambdaSecurityGroupId.

  DeployInVPC:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      Set to 'true' to place all document-processing Lambdas inside the
      customer-supplied VPC. Required when ApiGatewayVisibility=PRIVATE and
      for Jobs API deployments, and recommended for any
      compliance/exfil-control use case. Default 'false' = Lambdas run
      in the default AWS-owned network. When 'true', you must populate
      VpcId, PrivateSubnetIds, and LambdaSecurityGroupId (and LambdaSubnetIds
      when ApiGatewayVisibility=PRIVATE).

  VpcId:
    Type: String
    Default: ""
    Description: >-
      Required when DeployInVPC=true. The customer-owned VPC that Lambdas
      and (for PRIVATE or Jobs API mode) the execute-api VPC endpoint are
      attached to. Leave empty for non-VPC deployments.

  PrivateSubnetIds:
    Type: CommaDelimitedList
    Default: ""
    Description: >-
      Required when DeployInVPC=true. Comma-separated list of at least 2
      private subnet IDs in different AZs within VpcId. Lambdas are
      attached to these subnets. Leave empty for non-VPC deployments.

  LambdaSecurityGroupId:
    Type: String
    Default: ""
    Description: >-
      Required when DeployInVPC=true. Security group attached to all
      VPC-resident Lambdas. Must allow outbound HTTPS to AWS service
      endpoints (either via VPC endpoints or a NAT gateway). Leave empty
      for non-VPC deployments.

  ApiGatewayVpcEndpointId:
    Type: String
    Default: ""
    Description: >-
      Required when ApiGatewayVisibility=PRIVATE or EnableJobsApi=true. The
      com.amazonaws.<region>.execute-api Interface VPC endpoint that the
      private REST API (Web UI and/or the Jobs API) is bound to. The
      API's resource policy denies all traffic not sourced from this VPCE.
      Leave empty only when ApiGatewayVisibility=GLOBAL and
      EnableJobsApi=false.

  ApiStageName:
    Type: String
    Default: 'beta'
    Description: >-
      Stage name for the Jobs API Gateway (e.g. 'beta', 'prod').
      Ignored when EnableJobsApi=false.

  # ------------------------------------------------------------------------
  # Jobs API Deployment - Bastion Host (optional, requires VPC Secured Mode)
  #
  # The bastion host is an OPTIONAL developer-convenience feature for
  # reaching the Private API Gateway from outside the VPC during
  # development. It provisions a small EC2 instance (Amazon Linux 2, t3.small,
  # IMDSv2-required, encrypted EBS, no inbound SSH) reachable via AWS SSM
  # Session Manager. Use scripts/bastion.sh to establish a local tunnel
  # through it for running scripts/e2e_test_headless.py or similar.
  #
  # These parameters are ONLY used when DeployBastionHost=true AND
  # DeployInVPC=true (the bastion shares the customer-supplied VPC).
  # Nothing is deployed if DeployBastionHost=false (the default).
  # ------------------------------------------------------------------------

  DeployBastionHost:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      Set to 'true' to provision an SSM-reachable bastion EC2 for dev-time
      access to the Private API Gateway (useful for running e2e tests or
      calling the API from a local machine). Default 'false' = no EC2 is
      deployed. Requires DeployInVPC=true and the two Bastion* parameters
      below. Typically only used in dev accounts.

  BastionHostSubnetId:
    Type: String
    Default: ""
    Description: >-
      Required when DeployBastionHost=true. A PUBLIC subnet in VpcId where
      the bastion EC2 will launch. The subnet needs SSM egress so Session
      Manager can reach the instance. Leave empty when DeployBastionHost=false.

  BastionHostSecurityGroupId:
    Type: String
    Default: ""
    Description: >-
      Required when DeployBastionHost=true. Security group attached to the
      bastion EC2. No inbound SSH rule is needed - SSM Session Manager is
      the only ingress path. Leave empty when DeployBastionHost=false.

  BastionHostAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2
    Description: >-
      SSM Parameter Store path for the AMI to use on the bastion EC2. The
      default resolves to the latest Amazon Linux 2 AMI and is the right
      choice for almost all deployments. Only change if you need a custom
      hardened AMI. Ignored when DeployBastionHost=false.

  # =========================================================================
  # === Feature Platform (optional) — BEGIN ================================
  # Everything between BEGIN/END markers may be lifted cleanly if the feature
  # platform is removed. All resources gate on `EnableFeaturePlatform`.
  # See feature-platform/ and docs/feature-platform.md.
  #
  # The open-source distribution ships the platform ON by default in
  # auto-subscribe mode: every catalog feature is treated as subscribed and
  # the UI goes straight to the Install prompt. No marketplace simulator is
  # bundled. To exercise the paid Subscribe → buyer-console → Active flow,
  # deploy the standalone marketplace-simulator (shipped separately) and set
  # FeaturePlatformSimulatorEndpoint on this stack — no rebuild required.
  # =========================================================================

  EnableFeaturePlatform:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      Set to 'true' (default) to enable the Feature Platform (catalog,
      InstalledFeatures table, REST API resolvers, install flow). When no
      FeaturePlatformSimulatorEndpoint is configured, all features in the
      catalog are treated as automatically subscribed and the UI goes
      straight to the Install prompt. Set to 'false' to remove the platform
      entirely (no platform resources are created).

  FeaturePlatformSimulatorEndpoint:
    Type: String
    Default: ''
    Description: >-
      (Optional) Base URL of a marketplace-simulator (e.g.
      https://simulator.example.com), used to redirect an admin to the
      simulated buyer console AND as the endpoint override for the emulated
      AWS Marketplace APIs. Leave blank (default) to talk to real AWS
      Marketplace. Deploy the standalone simulator from the feature-extensions
      distribution and point this at its endpoint; it can be set on a running
      stack with no rebuild. Which API the host calls is controlled separately
      by FeaturePlatformSubscriptionMode, so a simulator can back either the
      buyer-side Agreement API ('marketplace-live') or the seller-side
      Entitlement API ('marketplace').

  FeaturePlatformSubscriptionMode:
    Type: String
    Default: 'marketplace-live'
    AllowedValues: ['marketplace-live', 'marketplace', 'auto']
    Description: >-
      How the host checks AWS Marketplace subscriptions for paid extensions.
      This is the single source of truth — it is NOT inferred from whether
      FeaturePlatformSimulatorEndpoint is set, so either mode can be pointed at
      a simulator for development. 'marketplace-live' (default) queries the
      BUYER-side AWS Marketplace Agreement API (SearchAgreements) for an active
      agreement on the extension's product; this is the production path.
      'marketplace' queries the SELLER-side Entitlement API (GetEntitlements) —
      useful only against a simulator, because from a buyer account the real
      GetEntitlements returns an empty list rather than an error (it is
      seller-side, and usage-based SaaS listings have no entitlement records at
      all). 'auto' skips the check and treats every catalog extension as
      subscribed. In every mode OSS extensions install directly and each paid
      extension enforces its own runtime entitlement check — this host-side
      check is advisory, and it deliberately degrades to allow (not deny) if the
      API is unreachable, so a permissions gap can't lock a paying customer out
      of an extension they bought.

  FeaturePlatformDefaultCustomerIdentifier:
    Type: String
    Default: ''
    Description: >-
      (Optional) Marketplace customer identifier used when the incoming
      request has no X-Amzn-Marketplace-Customer-Identifier header. Only
      used when FeaturePlatformSimulatorEndpoint is set. Required for
      real-Marketplace production use.

  DefaultFeatureId:
    Type: String
    Default: ''
    Description: >-
      (Optional) Vertical-product packs only. featureId of the feature that
      should be the default landing page after sign-in (e.g.
      'claims-pack'). When set, authenticated users are redirected to
      /features/<id> instead of /documents on first navigation. Empty
      string preserves the standard /documents landing. Surfaced to the
      UI via the SSM Settings parameter — no UI rebuild required to change.

  ConsoleTitle:
    Type: String
    Default: ''
    Description: >-
      (Optional) Title shown in the Web UI top navigation banner. Empty
      string falls back to "IDP Accelerator Console". Vertical-product
      packs set this (e.g. "Claims Processing Console") so the banner
      reflects the deployed product. Surfaced via the SSM Settings
      parameter — change with a stack update, no UI rebuild required.

  # =========================================================================
  # === Feature Platform (optional) — END ==================================
  # =========================================================================

Rules:
  MLflowTrackingURIRequired:
    RuleCondition: !Equals [ !Ref EnableMLflow, "true" ]
    Assertions:
      - Assert: !Not [ !Equals [ !Ref MlflowTrackingURI, "" ] ]
        AssertDescription: "MlflowTrackingURI is required when EnableMLflow is true"

  # EnableJobsApi=true stands up a Private API Gateway + VPC-resident Lambdas
  # that !Ref VpcId/PrivateSubnetIds/ApiGatewayVpcEndpointId/LambdaSecurityGroupId
  # unconditionally. Those params default to empty, so without this rule a
  # misconfigured deploy would fail deep in CREATE_IN_PROGRESS with an opaque
  # Lambda/API Gateway error. Fail fast at changeset creation instead.
  JobsApiRequiresVPC:
    RuleCondition: !Equals [ !Ref EnableJobsApi, "true" ]
    Assertions:
      - Assert: !Equals [ !Ref DeployInVPC, "true" ]
        AssertDescription: "EnableJobsApi=true requires DeployInVPC=true (the Jobs API uses a Private API Gateway and VPC-resident Lambdas)."
      - Assert: !Not [ !Equals [ !Ref VpcId, "" ] ]
        AssertDescription: "VpcId is required when EnableJobsApi=true"
      - Assert: !Not [ !Equals [ !Ref ApiGatewayVpcEndpointId, "" ] ]
        AssertDescription: "ApiGatewayVpcEndpointId is required when EnableJobsApi=true"
      - Assert: !Not [ !Equals [ !Ref LambdaSecurityGroupId, "" ] ]
        AssertDescription: "LambdaSecurityGroupId is required when EnableJobsApi=true"
      # Note: PrivateSubnetIds is a CommaDelimitedList. The Rules-block
      # intrinsic-function set (Fn::And / Contains / EachMember* / Equals /
      # If / Not / Or / RefAll / ValueOf*) has no portable way to assert
      # that a CommaDelimitedList isn't the "one empty string" default.
      # The remaining VpcId / VpcEndpoint / SG assertions above cover the
      # common "forgot to pass VPC parameters at all" misconfiguration;
      # invalid subnet IDs are caught later by the Lambda CreateFunction
      # call with a clear error rather than a mid-deploy rollback.

  # DeployInVPC=true places Lambdas and CodeBuild in the VPC. Without the
  # required VPC params, creation fails deep in nested stacks with opaque errors.
  DeployInVPCRequiresParams:
    RuleCondition: !Equals [ !Ref DeployInVPC, "true" ]
    Assertions:
      - Assert: !Not [ !Equals [ !Ref VpcId, "" ] ]
        AssertDescription: "VpcId is required when DeployInVPC=true"
      - Assert: !Not [ !Equals [ !Ref LambdaSecurityGroupId, "" ] ]
        AssertDescription: "LambdaSecurityGroupId is required when DeployInVPC=true"

  # A PRIVATE REST API is reachable only from inside the VPC, and its resolver
  # Lambdas (plus the Lambda security group) must live in that VPC. So
  # ApiGatewayVisibility=PRIVATE requires the standard VPC-secured-mode params.
  # (Formerly this coupling was implicit via WebUIHosting=ALB, which has been
  # removed.)
  PrivateApiRequiresVPC:
    RuleCondition: !Equals [ !Ref ApiGatewayVisibility, "PRIVATE" ]
    Assertions:
      - Assert: !Equals [ !Ref DeployInVPC, "true" ]
        AssertDescription: "ApiGatewayVisibility=PRIVATE requires DeployInVPC=true"
      - Assert: !Not [ !Equals [ !Ref VpcId, "" ] ]
        AssertDescription: "VpcId is required when ApiGatewayVisibility=PRIVATE"
      - Assert: !Not [ !Equals [ !Ref ApiGatewayVpcEndpointId, "" ] ]
        AssertDescription: "ApiGatewayVpcEndpointId (execute-api interface endpoint) is required when ApiGatewayVisibility=PRIVATE"
      # NB: LambdaSubnetIds (a CommaDelimitedList) is validated operationally —
      # Fn::Join is not permitted in the Rules block, and an empty-list assertion
      # has no cheap Rules-safe form. PrivateSubnetIds/VpcId coverage above plus
      # the DeployInVPCRequiresParams rule catch the common misconfiguration.

  # Bastion host is a developer-convenience layered on top of VPC-secured mode.
  # It shares the customer-supplied VPC, so DeployInVPC must be true as well.
  BastionRequiresVPC:
    RuleCondition: !Equals [ !Ref DeployBastionHost, "true" ]
    Assertions:
      - Assert: !Equals [ !Ref DeployInVPC, "true" ]
        AssertDescription: "DeployBastionHost=true requires DeployInVPC=true"
      - Assert: !Not [ !Equals [ !Ref BastionHostSubnetId, "" ] ]
        AssertDescription: "BastionHostSubnetId is required when DeployBastionHost=true"
      - Assert: !Not [ !Equals [ !Ref BastionHostSecurityGroupId, "" ] ]
        AssertDescription: "BastionHostSecurityGroupId is required when DeployBastionHost=true"

  # BYO S3 VPC endpoint: id and DNS name must be supplied together. The DNS
  # name carries the AWS-assigned random suffix (e.g. vpce-XXX-abcdef12.s3...)
  # which cannot be derived from the id alone, so without it presigned URLs
  # would target a non-existent host and browser uploads would NXDOMAIN.
  S3VpcEndpointOverridePairing:
    RuleCondition: !Not [ !Equals [ !Ref S3VpcEndpointIdOverride, "" ] ]
    Assertions:
      - Assert: !Not [ !Equals [ !Ref S3VpcEndpointDnsNameOverride, "" ] ]
        AssertDescription: "S3VpcEndpointDnsNameOverride is required when S3VpcEndpointIdOverride is set."

  S3VpcEndpointDnsNameRequiresId:
    RuleCondition: !Not [ !Equals [ !Ref S3VpcEndpointDnsNameOverride, "" ] ]
    Assertions:
      - Assert: !Not [ !Equals [ !Ref S3VpcEndpointIdOverride, "" ] ]
        AssertDescription: "S3VpcEndpointIdOverride is required when S3VpcEndpointDnsNameOverride is set."

  S3PresignedUrlViaVpcEndpointRequiresEndpoint:
    RuleCondition: !Equals [ !Ref S3PresignedUrlViaVpcEndpoint, "true" ]
    Assertions:
      - Assert: !Not [ !Equals [ !Ref S3VpcEndpointIdOverride, "" ] ]
        AssertDescription: >-
          S3PresignedUrlViaVpcEndpoint=true requires an S3 VPC Interface Endpoint.
          Provide one via S3VpcEndpointIdOverride / S3VpcEndpointDnsNameOverride
          (APIGateway hosting serves the UI through API Gateway's internal S3
          integration and does not auto-provision an S3 VPC endpoint).

Conditions:
  # API transport: API Gateway REST API + polling + Lambda response streaming is
  # now the only path (the former GraphQL API has been fully removed). No transport
  # conditions are needed — the REST API resources deploy unconditionally.
  # Headless/VPC/Bastion feature conditions
  DeployInVPC: !Equals [!Ref DeployInVPC, 'true']
  DeployApiGateway: !Equals [!Ref EnableJobsApi, 'true']
  ShouldDeployBastionHost: !Equals [!Ref DeployBastionHost, 'true']
  # CI/automation sentinel: this exact AdminEmail suppresses the Cognito invite
  # email (keeps automated multi-stack deploys under Cognito's daily email quota).
  # Keep in sync with SUPPRESS_INVITE_ADMIN_EMAIL in scripts/sdlc/codebuild_deployment.py.
  SuppressAdminInvite: !Equals [!Ref AdminEmail, 'citest@suppress.welcome.email']

  HasGuardrailConfig:
    !And [
      !Not [ !Equals [ !Ref BedrockGuardrailId, "" ] ],
      !Not [ !Equals [ !Ref BedrockGuardrailVersion, "" ] ],
    ]

  HasBedrockHubRole:
    !Not [ !Equals [ !Ref BedrockHubRoleArn, "" ] ]
  HasBedrockHubRoleExternalId:
    !Not [ !Equals [ !Ref BedrockHubRoleExternalId, "" ] ]
  HasBedrockHubRoleSessionName:
    !Not [ !Equals [ !Ref BedrockHubRoleSessionName, "" ] ]

  # HITL and Private Workforce conditions
  # General rules
  ShouldAllowSignUpEmailDomain:
    !Not [ !Equals [ !Ref AllowedSignUpEmailDomain, "" ] ]
  ShouldEnableGeoRestriction: !Not [ !Equals [ !Ref CloudFrontAllowedGeos, "" ] ]
  ShouldEnablePostProcessingLambdaHook:
    !Not [ !Equals [ !Ref PostProcessingLambdaHookFunctionArn, "" ] ]
  ShouldCreateEvaluationBaselineBucket:
    !Equals [ !Ref EvaluationBaselineBucketName, "" ]
  ShouldCreateReportingBucket: !Equals [ !Ref ReportingBucketName, "" ]
  HasReportingBucketKmsKey: !Not [!Equals [!Ref ReportingBucketKmsKeyArn, ""]]
  # NOTE: the old WAF apparatus (IsWafEnabled / IsWafEnabledAndApi) and the
  # private DNS condition (IsPrivateApiAndApi) existed solely to protect /
  # expose the former GraphQL API and were removed along with it. The REST API
  # WAF + private-endpoint wiring now lives in the nested/api-resolvers stack.
  ShouldCreateDocumentKnowledgeBase:
    !Equals [ !Ref DocumentKnowledgeBase, "BEDROCK_KNOWLEDGE_BASE (Create)" ]
  ShouldUseDocumentKnowledgeBase: !Condition ShouldCreateDocumentKnowledgeBase
  DocumentSectionsCrawlerScheduleEnabled:
    !Not [ !Equals [ !Ref DocumentSectionsCrawlerFrequency, "Manual" ] ]
  HasPermissionsBoundary: !Not [ !Equals [ !Ref PermissionsBoundaryArn, "" ] ]
  # GovCloud-only trust-policy statements are gated on this so that a commercial
  # deployment renders a trust policy with no GovCloud principals in it. That is
  # not cosmetic: an IAM role's AssumeRolePolicyDocument can only be changed on
  # an existing role via iam:UpdateAssumeRolePolicy, so shipping a
  # partition-specific principal unconditionally rewrites the document on every
  # other partition's next stack UPDATE. Deployments using a CloudFormation
  # service role (or permissions boundary) that lacks that action then fail and
  # wedge in UPDATE_ROLLBACK_FAILED — the rollback needs the same action, so it
  # cannot self-recover. See issue #632.
  IsGovCloudPartition: !Equals [ !Ref "AWS::Partition", "aws-us-gov" ]
  HasCustomConfigPath: !Not [ !Equals [ !Ref CustomConfigPath, "" ] ]
  # When the LWA layer ARN is left blank, construct the region/partition default.
  HasLambdaWebAdapterLayerArn:
    !Not [ !Equals [ !Ref LambdaWebAdapterLayerArn, "" ] ]
  # The version-check resolver only needs IAM grants when an artifacts
  # bucket is actually configured. When `PublicArtifactsBucket` is empty
  # the resolver short-circuits before any S3 call, so we omit the policy
  # entirely (avoids creating an IAM policy with a wildcard ARN).
  HasPublicArtifactsBucket:
    !Not [ !Equals [ !Ref PublicArtifactsBucket, "" ] ]

  IsS3VectorsVectorStore: !Equals [ !Ref KnowledgeBaseVectorStore, "S3_VECTORS" ]
  CreateAgentCoreLambda: !Equals [ !Ref EnableMCP, "true" ]
  CreateExternalAppClient: !Equals [ !Ref EnableMCP, "true" ]
  HasExternalIdP: !Not [ !Equals [ !Ref ExternalIdPType, "" ] ]
  IsExternalIdPSAML:
    !And
      - !Condition HasExternalIdP
      - !Equals [ !Ref ExternalIdPType, "SAML" ]
  IsExternalIdPOIDC:
    !And
      - !Condition HasExternalIdP
      - !Equals [ !Ref ExternalIdPType, "OIDC" ]
  HasExternalIdPGroupMapping: !Not [ !Equals [ !Ref ExternalIdPGroupAttributeName, "" ] ]
  ShouldMapExternalIdPGroups:
    !And
      - !Condition HasExternalIdP
      - !Condition HasExternalIdPGroupMapping
  UseCloudFrontHosting: !Equals [ !Ref WebUIHosting, "CloudFront" ]
  # APIGateway hosting: the Web UI SPA is served as an S3 proxy on the existing
  # api-resolvers REST API (same stage as the /op transport), so it inherits the
  # API's GLOBAL/PRIVATE visibility and optional stage-level WAFv2.
  UseApiGatewayHosting: !Equals [ !Ref WebUIHosting, "APIGateway" ]
  HasS3VpcEndpointOverride: !Not [!Equals [!Ref S3VpcEndpointIdOverride, ""]]
  # True when a customer-owned domain (DNS alias, Okta/SAML SSO domain, etc.)
  # fronts the application. Drives three template behaviours:
  #   1. Adds the custom origin to every browser-accessed S3 bucket's CORS
  #      AllowedOrigins so direct presigned-URL uploads/downloads succeed.
  #   2. Adds the custom origin (with and without trailing slash, lowercased)
  #      to Cognito App Client CallbackURLs / LogoutURLs so OAuth redirects
  #      land back on the custom domain.
  #   3. Sets VITE_CLOUDFRONT_DOMAIN to "" at Web UI build time, which makes
  #      Amplify use window.location.origin for redirectSignIn /
  #      redirectSignOut. This keeps the API Gateway URL and the custom domain
  #      working side-by-side instead of pinning OAuth to a single host.
  HasCustomDomain: !Not [!Equals [!Ref CustomDomainUrl, ""]]
  # True when the custom domain fronts the REST API ITSELF, so the SPA must call
  # the API on that same origin instead of the raw execute-api hostname.
  #
  # Only APIGateway hosting qualifies: there the SPA and the /op transport are
  # the same REST API (the SPA is an S3 proxy on the `api` stage), so a custom
  # domain with a base-path mapping to that stage serves both. Under CloudFront
  # hosting the distribution has a single S3 origin and no /api behaviour, so a
  # custom domain in front of it cannot reach the API — the bundle must keep the
  # execute-api URL there.
  #
  # Why this matters (and why it is worse than merely cosmetic in PRIVATE mode):
  # VITE_API_BASE_URL is frozen into the JS bundle. Left as the execute-api URL
  # while the browser is on the custom domain, every /op call is cross-origin
  # (extra preflight) and, with ApiGatewayVisibility=PRIVATE, the execute-api
  # hostname usually does not resolve for the client at all — the private DNS
  # override lives only in the VPC that owns the endpoint. See
  # docs/deployment-private-network.md.
  UseCustomDomainForApi: !And
    - !Condition HasCustomDomain
    - !Condition UseApiGatewayHosting
  # True when an S3 VPC Interface Endpoint EXISTS (customer-provided via the
  # override params). Used for:
  #   - Backend Lambda S3 access (HasS3VpcEndpointAndVpc)
  #   - Presigner URL injection is controlled separately (see below).
  # NOTE: APIGateway hosting does NOT provision an S3 VPC endpoint — API Gateway
  # reaches the Web UI bucket over AWS-internal networking. This condition is
  # therefore driven solely by the BYO override.
  HasS3VpcEndpoint: !Condition HasS3VpcEndpointOverride
  # True when presigner Lambdas should generate S3 URLs targeting the VPC
  # Interface Endpoint (for browser uploads). Triggered by explicit opt-in
  # or by BYO endpoint override (which always implies presigner usage).
  UseS3VpcEndpointForPresigner: !Or
    - !Equals [!Ref S3PresignedUrlViaVpcEndpoint, "true"]
    - !Condition HasS3VpcEndpointOverride
  # True when VPC-resident Lambdas should use S3_ENDPOINT_URL for direct S3
  # calls (not presigned URL generation). Requires BOTH:
  #   - An S3 VPCE exists (HasS3VpcEndpoint)
  #   - Lambdas are deployed in the VPC (DeployInVPC=true)
  # Without DeployInVPC, Lambdas run on the public Lambda network and cannot
  # reach the VPCE hostname — setting endpoint_url would cause timeouts.
  HasS3VpcEndpointAndVpc: !And [!Condition HasS3VpcEndpoint, !Condition DeployInVPC]
  EnableXRayTracingCondition: !Equals [ !Ref EnableXRayTracing, "true" ]
  UsePrivateApi: !Equals [ !Ref ApiGatewayVisibility, "PRIVATE" ]
  HasArtifactsBucketKmsKey: !Not [ !Equals [ !Ref ArtifactsBucketKmsKeyArn, "" ] ]
  CircuitBreakerEnabledCondition: !Equals [ !Ref CircuitBreakerEnabled, "true" ]
  HasCircuitBreakerErrorHandler: !Not [ !Equals [ !Ref CircuitBreakerErrorHandlerArn, "" ] ]
  CircuitBreakerTriggerServiceUnavailableEnabled: !Equals [ !Ref CircuitBreakerTriggerServiceUnavailable, "true" ]
  CircuitBreakerTriggerThrottlingEnabled: !Equals [ !Ref CircuitBreakerTriggerThrottling, "true" ]
  CircuitBreakerTriggerQuotaLimitEnabled: !Equals [ !Ref CircuitBreakerTriggerQuotaLimit, "true" ]

  # Feature Platform
  IsFeaturePlatformEnabled: !Equals [ !Ref EnableFeaturePlatform, 'true' ]
  # Inverse condition used to gate the main stack's
  # `${AWS::StackName}-TrackingTableName` Output so that it isn't declared at
  # the same time as the FeaturePlatformStack's identically-named export
  # (which would fail with "Export already exported by stack ...").
  IsFeaturePlatformDisabled: !Equals [ !Ref EnableFeaturePlatform, 'false' ]
  # NB: there is deliberately no "IsAutoSubscribeMode" condition inferring the
  # subscription mode from whether FeaturePlatformSimulatorEndpoint is set.
  # Inferring it coupled two independent choices — WHICH API to call and WHERE
  # to send it — and made the production path ('marketplace-live') unreachable
  # whenever a simulator endpoint was configured, so the buyer-side Agreement
  # check could not be exercised in development. FeaturePlatformSubscriptionMode
  # is now the single source of truth and is passed through verbatim.

