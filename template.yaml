    Condition: UsePrivateApi
    Properties:
      GroupDescription: !Sub "Security group for ${AWS::StackName} Lambda functions in VPC (private REST API mode)"
      # ApiGatewayVisibility=PRIVATE always requires DeployInVPC=true (the
      # private REST API is reachable only from inside the VPC), so the standard
