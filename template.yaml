  ConfigurationBucket:
    Type: AWS::S3::Bucket
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "Content-Type"
              - "x-amz-content-sha256"
              - "x-amz-date"
              - "Authorization"
              - "x-amz-security-token"
            AllowedMethods:
              - PUT
              - POST
            AllowedOrigins:
              - !If
                - UseCloudFrontHosting
                - !Sub "https://${CloudFrontDistribution.DomainName}"
                # APIGateway hosting: the browser origin is the execute-api host
                # (scheme+host only — the /api stage path is not part of the CORS
                # Origin). A single-wildcard origin avoids a bucket->API-stack
                # dependency cycle while matching the REST API's regional host.
                - !Sub "https://*.execute-api.${AWS::Region}.${AWS::URLSuffix}"
              # For local development only
              - "http://localhost:3000"
              # Custom domain (e.g. customer-owned DNS alias, Okta SSO domain).
              # Empty CustomDomainUrl resolves to AWS::NoValue → list entry is
              # omitted so the array stays exactly as before for default deploys.
              - !If [HasCustomDomain, !Ref CustomDomainUrl, !Ref "AWS::NoValue"]
            ExposedHeaders:
              - "ETag"
              - "x-amz-server-side-encryption"
            MaxAge: 3000
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref CustomerManagedEncryptionKey
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Ref LoggingBucket
        LogFilePrefix: input-bucket-logs/
      LifecycleConfiguration:
        Rules:
          - Id: DeleteAfterNDays
            Status: Enabled
            ExpirationInDays: !Ref DataRetentionInDays
            # Buckets are versioned; without this, overwritten/deleted object
            # versions accumulate forever (Expiration only adds delete markers).
            # Noncurrent versions get the same retention as current data —
            # they are also the byte-store for document version history
            # (see docs/document-versions.md).
            NoncurrentVersionExpiration:
              NoncurrentDays: !Ref DataRetentionInDays
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

