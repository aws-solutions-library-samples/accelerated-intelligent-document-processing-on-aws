  # Metering table. Partitioned by (date, hour) using WRITE TIME (= document
  # completion time, since save_reporting_data runs at end of workflow).
  # See docs/reporting-sql-layer.md §2.3 for the partitioning rationale.
  MeteringTable:
    Type: AWS::Glue::Table
    # DependsOn the migration custom resource so, on stack upgrade from a
    # pre-hour-partition version, historical `metering/date=X/*.parquet`
    # files are relocated into `date=X/hour=HH/` subdirs BEFORE this
    # table's new projection template takes effect. Without the barrier,
    # dashboards would show a data hole for the duration of the migration.
    # See docs/reporting-sql-layer.md §2.3.
    #
    # Round-10 note: the DependsOn also applies on FRESH installs (no
    # legacy files), where the migration Lambda is a ~2-second no-op —
    # accepted tradeoff. A CFN-native alternative (Condition on
    # "IsFreshInstall") would need an operator-supplied parameter
    # since CFN can't infer bucket contents at template time. The
    # cost/benefit doesn't justify the parameter's UX friction.
    DependsOn: MeteringHourMigrationCustomResource
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref ReportingDatabase
      TableInput:
        Name: "metering"
        Description: "Table for document metering data. Partitioned by (date, hour) using write time (= completion time)."
        TableType: "EXTERNAL_TABLE"
        Parameters:
          classification: "parquet"
          typeOfData: "file"
          projection.enabled: "true"
          projection.date.type: "date"
          projection.date.format: "yyyy-MM-dd"
          projection.date.range: "2024-01-01,NOW+1YEARS"
          projection.date.interval: "1"
          projection.date.interval.unit: "DAYS"
          projection.hour.type: "integer"
          projection.hour.range: "0,23"
          projection.hour.digits: "2"
          storage.location.template: !Sub
            - "s3://${Bucket}/metering/date=${date}/hour=${hour}/"
            - Bucket: !If
                - ShouldCreateReportingBucket
                - !Ref ReportingBucket
                - !Ref ReportingBucketName
              date: "${date}"
              hour: "${hour}"
        StorageDescriptor:
          Location: !Sub
            - "s3://${Bucket}/metering/"
            - Bucket: !If
                - ShouldCreateReportingBucket
                - !Ref ReportingBucket
                - !Ref ReportingBucketName
          InputFormat: "org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat"
          OutputFormat: "org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat"
          SerdeInfo:
            SerializationLibrary: "org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe"
          Columns:
            - Name: document_id
              Type: string
            - Name: context
              Type: string
            - Name: service_api
              Type: string
            - Name: unit
              Type: string
            - Name: value
              Type: double
            - Name: number_of_pages
              Type: int
            - Name: unit_cost
              Type: double
            - Name: estimated_cost
              Type: double
            - Name: timestamp
              Type: timestamp
            - Name: initial_event_time
              Type: timestamp
            - Name: config_version
              Type: string
          Compressed: true
        PartitionKeys:
          - Name: date
            Type: string
          - Name: hour
            Type: string

