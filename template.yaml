Resources:
  # Custom resource to enforce max length of StackName - prevent downstream failures
  StacknameCheckFunction:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Function does not require VPC access as it has no network access
          - id: W92
            reason: Reserved concurrency not required
    # checkov:skip=CKV_AWS_116: "DLQ not required for Cfn Custom Resource function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only configuration values like feature flags and non-sensitive settings"
    Properties:
      PermissionsBoundary:
        !If [
          HasPermissionsBoundary,
          !Ref PermissionsBoundaryArn,
          !Ref AWS::NoValue,
        ]
      Handler: index.handler
      Runtime: python3.12
      InlineCode: |
        import cfnresponse
        import time
        import json
        def handler(event, context):
            print(json.dumps(event))
            input = event['ResourceProperties'].get('InputString', '')
            max_length = int(event['ResourceProperties'].get('MaxLength', 0))
            status = cfnresponse.SUCCESS
            reason = f"Stack Name Length under {max_length} - OK"
            if event['RequestType'] == "Create":
              if len(input) > max_length:
                status = cfnresponse.FAILED
                reason = f"Stack Name ({input}) length ({len(input)}) too long - max length {max_length} - FAILED"
            else:
              print(f"Request type is {event['RequestType']} - skipping")
            cfnresponse.send(event, context, status, {}, reason=reason)
      Environment:
        Variables:
          LOG_LEVEL: INFO
      LoggingConfig:
        LogGroup:
          Ref: StacknameCheckFunctionLogGroup

  StacknameCheckFunctionLogGroup:
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W84
            reason: "LogGroup does not require KMS Key Id, since it's only logging checks on stack name length"
    # checkov:skip=CKV_AWS_158: "LogGroup does not require KMS Key Id, since it's only logging checks on stack name length"
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !Ref LogRetentionDays

  IsStacknameLengthOK:
    Type: Custom::StacknameCheck
    Properties:
      ServiceToken: !GetAtt StacknameCheckFunction.Arn
      InputString: !Ref "AWS::StackName"
      MaxLength: 25

  ##########################################################################
  # Jobs REST API (Headless mode)
  ##########################################################################

  ApiHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: DeployApiGateway
    Properties:
      KmsKeyId: !GetAtt CustomerManagedEncryptionKey.Arn
      RetentionInDays: !Ref LogRetentionDays

  # API Authentication - Cognito User Pool for M2M (client credentials)
  ApiUserPool:
    Type: AWS::Cognito::UserPool
    Condition: DeployApiGateway
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-api

  ApiResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Condition: DeployApiGateway
    Properties:
      Identifier: idp-api
      Name: IDP API
      UserPoolId: !Ref ApiUserPool
      Scopes:
        - ScopeName: jobs.read
          ScopeDescription: Read job status
        - ScopeName: jobs.write
          ScopeDescription: Create and manage jobs

  ApiAppClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: DeployApiGateway
    DependsOn: ApiResourceServer
    Properties:
      ClientName: !Sub ${AWS::StackName}-api-client
      UserPoolId: !Ref ApiUserPool
      GenerateSecret: true  # pragma: allowlist secret - Cognito generates the client secret; none stored here
      AllowedOAuthFlows:
        - client_credentials
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - idp-api/jobs.read
        - idp-api/jobs.write

  ApiUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Condition: DeployApiGateway
    Properties:
      Domain: !Sub ${AWS::StackName}-api-${AWS::AccountId}
      UserPoolId: !Ref ApiUserPool

  # Private API Gateway with Cognito Authorization
  ApiGateway:
    Type: AWS::Serverless::Api
    Condition: DeployApiGateway
    Properties:
      StageName: !Ref ApiStageName
      EndpointConfiguration:
        Type: PRIVATE
        VPCEndpointIds:
          - !Ref ApiGatewayVpcEndpointId
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt ApiUserPool.Arn
        ResourcePolicy:
          CustomStatements:
            - Effect: Deny
              Principal: '*'
              Action: execute-api:Invoke
              Resource: execute-api:/*
              Condition:
                StringNotEquals:
                  aws:SourceVpce: !Ref ApiGatewayVpcEndpointId
            - Effect: Allow
              Principal: '*'
              Action: execute-api:Invoke
              Resource: execute-api:/*

  ApiHandlerFunction:
    Type: AWS::Serverless::Function
    Condition: DeployApiGateway
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W92
            reason: Reserved concurrency not required
    Properties:
      PermissionsBoundary:
        !If [
          HasPermissionsBoundary,
          !Ref PermissionsBoundaryArn,
          !Ref AWS::NoValue,
        ]
      CodeUri: src/lambda/api_handler/
      Handler: index.handler
      Runtime: python3.12
      MemorySize: 4096
      Timeout: 30
      Layers:
        - !Ref IDPCommonBaseLayer
      # JobsApiRequiresVPC rule (see top-level Rules: block) already asserts
      # DeployInVPC=true whenever EnableJobsApi=true, so in practice this !If
      # always takes the first branch when this Function is deployed. The
      # guard is defense-in-depth: if the coupling is ever relaxed (e.g. a
      # future "Jobs API without VPC" pattern), this Function will still
      # render as a valid no-VpcConfig Lambda rather than fail on empty !Refs.
      VpcConfig: !If
        - DeployInVPC
        - SecurityGroupIds:
            - !Ref LambdaSecurityGroupId
          SubnetIds: !Ref PrivateSubnetIds
        - !Ref AWS::NoValue
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          TRACKING_TABLE: !Ref TrackingTable
          DOCUMENT_TRACKING_MODE: dynamodb
          INPUT_BUCKET_NAME: !Ref InputBucket
          OUTPUT_BUCKET_NAME: !Ref OutputBucket
          STAGING_BUCKET_NAME: !Ref StagingBucket
          DATA_RETENTION_IN_DAYS: !Ref DataRetentionInDays
          S3_ENDPOINT_URL: !If
            - UseS3VpcEndpointForPresigner
            - !Sub
              - "https://bucket.${VpceDnsName}"
              # Only the BYO override provides an S3 VPC endpoint now (APIGateway
              # hosting uses API Gateway's internal S3 integration, no VPCE). The
              # S3PresignedUrlViaVpcEndpointRequiresEndpoint rule guarantees the
              # override is set whenever UseS3VpcEndpointForPresigner is true.
              - VpceDnsName: !Ref S3VpcEndpointDnsNameOverride
            - !Ref AWS::NoValue
      LoggingConfig:
        LogGroup: !Ref ApiHandlerLogGroup
      Events:
        PostJob:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /jobs
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
              AuthorizationScopes:
                - idp-api/jobs.write
        GetJob:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /jobs/{job_id}
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
              AuthorizationScopes:
                - idp-api/jobs.read
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TrackingTable
        - S3WritePolicy:
            BucketName: !Ref InputBucket
        - S3CrudPolicy:
            BucketName: !Ref OutputBucket
        - S3WritePolicy:
            BucketName: !Ref StagingBucket
        - Statement:
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:ReEncrypt*
                - kms:GenerateDataKey*
                - kms:DescribeKey
              Resource: !GetAtt CustomerManagedEncryptionKey.Arn

  BatchPreProcessorFunction:
    Type: AWS::Serverless::Function
    Condition: DeployApiGateway
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W92
            reason: Reserved concurrency not required
    Properties:
      PermissionsBoundary:
        !If [
          HasPermissionsBoundary,
          !Ref PermissionsBoundaryArn,
          !Ref AWS::NoValue,
        ]
      CodeUri: src/lambda/batch_pre_processor/
      Handler: index.handler
      Runtime: python3.12
      MemorySize: 3008
      Timeout: 900
      EphemeralStorage:
        Size: 5120
      Tags:
        # Data plane — Jobs API batch ingest. Cost scales with doc volume through
        # the batch path. See docs/reporting-sql-layer.md §10.3.
        idp:plane: data
      Layers:
        - !Ref IDPCommonBaseLayer
      # See ApiHandlerFunction for rationale — JobsApiRequiresVPC rule gates
      # this at changeset creation; the !If is defense-in-depth.
      VpcConfig: !If
        - DeployInVPC
        - SecurityGroupIds:
            - !Ref LambdaSecurityGroupId
          SubnetIds: !Ref PrivateSubnetIds
        - !Ref AWS::NoValue
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          INPUT_BUCKET_NAME: !Ref InputBucket
          TRACKING_TABLE: !Ref TrackingTable
      Events:
        S3Event:
          Type: CloudWatchEvent
          Properties:
            Pattern:
              source:
                - aws.s3
              detail-type:
                - "Object Created"
              detail:
                bucket:
                  name:
                    - !Ref StagingBucket
                object:
                  key:
                    - suffix: .zip
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref StagingBucket
        - S3WritePolicy:
            BucketName: !Ref InputBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref TrackingTable
        - Statement:
            - Effect: Allow
              Action:
                - kms:Decrypt
                - kms:GenerateDataKey*
              Resource: !GetAtt CustomerManagedEncryptionKey.Arn

  ##########################################################################
  # Bastion Host (optional - for testing Private API Gateway)
  ##########################################################################

  BastionKey:
    Type: AWS::KMS::Key
    Condition: ShouldDeployBastionHost
    Properties:
      Description: 'KMS Key for Bastion Host EBS encryption'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: Allow use of the key for EBS
            Effect: Allow
            Principal:
              Service: !Sub 'ec2.${AWS::URLSuffix}'
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:Encrypt
              - kms:GenerateDataKey*
              - kms:ReEncrypt*
            Resource: '*'

  BastionRole:
    Type: AWS::IAM::Role
    Condition: ShouldDeployBastionHost
    Properties:
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      RoleName: !Sub '${AWS::StackName}BastionHost-Role'
      Description: 'Assumed by bastion host'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub 'ec2.${AWS::URLSuffix}'
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'

  BastionInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Condition: ShouldDeployBastionHost
    Properties:
      InstanceProfileName: !Sub '${AWS::StackName}BastionHost-InstanceProfile'
      Roles:
        - !Ref BastionRole

  BastionLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Condition: ShouldDeployBastionHost
    Properties:
      LaunchTemplateName: !Sub '${AWS::StackName}BastionLaunchTemplate'
      LaunchTemplateData:
        ImageId: !Ref BastionHostAmiId
        InstanceType: t3.small
        IamInstanceProfile:
          Arn: !GetAtt BastionInstanceProfile.Arn
        SecurityGroupIds:
          - !Ref BastionHostSecurityGroupId
        BlockDeviceMappings:
          - DeviceName: '/dev/xvda'
            Ebs:
              VolumeSize: 20
              VolumeType: gp3
              Encrypted: true
              KmsKeyId: !Ref BastionKey
              DeleteOnTermination: true
        MetadataOptions:
          HttpTokens: required
        Monitoring:
          Enabled: true

  BastionInstance:
    Type: AWS::EC2::Instance
    Condition: ShouldDeployBastionHost
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref BastionLaunchTemplate
        Version: !GetAtt BastionLaunchTemplate.LatestVersionNumber
      SubnetId: !Ref BastionHostSubnetId
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}BastionHost'

  ConfigurationCopyFunction:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Function does not require VPC access as it only interacts with S3
          - id: W92
            reason: Reserved concurrency not required
    # checkov:skip=CKV_AWS_116: "DLQ not required for Cfn Custom Resource function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only configuration values like feature flags and non-sensitive settings"
    Properties:
      PermissionsBoundary:
        !If [
          HasPermissionsBoundary,
          !Ref PermissionsBoundaryArn,
          !Ref AWS::NoValue,
        ]
      Handler: index.handler
      Runtime: python3.12
      Timeout: 300
      VpcConfig:
        !If
          - DeployInVPC
          - SecurityGroupIds:
              - !Ref LambdaSecurityGroupId
            SubnetIds: !Ref PrivateSubnetIds
          - !Ref AWS::NoValue
      InlineCode: |
        import os
        import boto3
        from botocore.config import Config
        import cfnresponse
        import json
        import logging

        logger = logging.getLogger()
        logger.setLevel(logging.INFO)

        def handler(event, context):
            logger.info(json.dumps(event))

            try:
                source_bucket = event['ResourceProperties']['SourceBucket']
                source_prefix = event['ResourceProperties']['SourcePrefix']
                target_bucket = event['ResourceProperties']['TargetBucket']
                target_prefix = event['ResourceProperties'].get('TargetPrefix', '')

                file_list = event['ResourceProperties'].get('FileList', [])

                # Private-mode S3 client — virtual-host addressing ensures the
                # SigV4 host header matches the VPC interface endpoint DNS.
                s3_endpoint_url = os.environ.get('S3_ENDPOINT_URL') or None
                s3_addressing = 'virtual' if s3_endpoint_url else 'path'
                s3_client = boto3.client(
                    's3',
                    endpoint_url=s3_endpoint_url,
                    config=Config(signature_version='s3v4', s3={'addressing_style': s3_addressing}),
                )
        
                if event['RequestType'] == 'Create' or event['RequestType'] == 'Update':
                    # Copy files explicitly from the provided list
                    copied_count = 0
        
                    for relative_file_path in file_list:
                        # Skip empty entries
                        if not relative_file_path.strip():
                            continue
        
                        # Construct source key
                        source_key = f"{source_prefix}/{relative_file_path}"
        
                        # Construct target key with optional target prefix
                        if target_prefix:
                            target_key = f"{target_prefix}/{relative_file_path}"
                        else:
                            target_key = relative_file_path
        
                        logger.info(f"Copying {source_bucket}/{source_key} to {target_bucket}/{target_key}")
        
                        try:
                            copy_source = {'Bucket': source_bucket, 'Key': source_key}
                            s3_client.copy_object(
                                CopySource=copy_source,
                                Bucket=target_bucket,
                                Key=target_key
                            )
                            copied_count += 1
                        except Exception as copy_error:
                            logger.warning(f"Failed to copy {source_key}: {str(copy_error)}")
                            # Continue with other files instead of failing the entire operation
        
                    logger.info(f"Successfully copied {copied_count} configuration files")
                    cfnresponse.send(event, context, cfnresponse.SUCCESS, {
                        'CopiedFiles': copied_count
                    }, reason=f"Successfully copied {copied_count} configuration files")
        
                elif event['RequestType'] == 'Delete':
                    # For delete, we don't need to clean up the configuration files
                    # as they may be needed by other resources
                    logger.info("Delete request - no action needed for configuration files")
                    cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, 
                                   reason="Delete completed - configuration files retained")
        
            except Exception as e:
                logger.error(f"Error: {str(e)}")
                cfnresponse.send(event, context, cfnresponse.FAILED, {}, 
                               reason=f"Error copying configuration files: {str(e)}")

      Environment:
        Variables:
          LOG_LEVEL: INFO
          S3_ENDPOINT_URL: !If
            - HasS3VpcEndpointAndVpc
            - !Sub
              - "https://bucket.${VpceDnsName}"
              # Only the BYO override provides an S3 VPC endpoint now (APIGateway
              # hosting uses API Gateway's internal S3 integration, no VPCE). The
              # S3PresignedUrlViaVpcEndpointRequiresEndpoint rule guarantees the
              # override is set whenever UseS3VpcEndpointForPresigner is true.
              - VpceDnsName: !Ref S3VpcEndpointDnsNameOverride
            - !Ref AWS::NoValue
      LoggingConfig:
        LogGroup:
          Ref: ConfigurationCopyFunctionLogGroup
      Policies:
        - S3ReadPolicy:
            BucketName: "<ARTIFACT_BUCKET_TOKEN>"
        - S3WritePolicy:
            BucketName: !Ref ConfigurationBucket
        - Statement:
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:ReEncrypt*
                - kms:GenerateDataKey*
                - kms:DescribeKey
              Resource: !GetAtt CustomerManagedEncryptionKey.Arn
            # Grant kms:Decrypt on the artifacts bucket KMS key when provided
            # This allows ConfigurationCopyFunction to read config files from a KMS-encrypted artifact bucket
            - !If
              - HasArtifactsBucketKmsKey
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey*
                  - kms:DescribeKey
                Resource: !Ref ArtifactsBucketKmsKeyArn
              - !Ref AWS::NoValue

  ConfigurationCopyFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !GetAtt CustomerManagedEncryptionKey.Arn

  CopyConfigurationFiles:
    Type: Custom::ConfigurationCopy
    Properties:
      ServiceToken: !GetAtt ConfigurationCopyFunction.Arn
      SourceBucket: "<ARTIFACT_BUCKET_TOKEN>"
      SourcePrefix: "<ARTIFACT_PREFIX_TOKEN>/config_library"
      TargetBucket: !Ref ConfigurationBucket
      TargetPrefix: "config_library"
      ConfigLibraryHash: "<CONFIG_LIBRARY_HASH_TOKEN>"
      FileList: <CONFIG_FILES_LIST_TOKEN>

  # Copies the curated sample-document binaries from the artifacts bucket into
  # the stack's ConfigurationBucket under samples/. Reuses the generic
  # ConfigurationCopyFunction. The target keys (samples/<file>) match the
  # s3Key values in config_library/samples-manifest.json, so the UI can list
  # and launch bundled samples without a local download.
  CopySampleFiles:
    Type: Custom::ConfigurationCopy
    Properties:
      ServiceToken: !GetAtt ConfigurationCopyFunction.Arn
      SourceBucket: "<ARTIFACT_BUCKET_TOKEN>"
      SourcePrefix: "<ARTIFACT_PREFIX_TOKEN>/samples"
      TargetBucket: !Ref ConfigurationBucket
      TargetPrefix: "samples"
      ConfigLibraryHash: "<SAMPLES_HASH_TOKEN>"
      FileList: <SAMPLE_FILES_LIST_TOKEN>

  ##########################################################################
  # Nested stack for selected options
  ##########################################################################

  DOCUMENTKB:
    DependsOn:
      - IsStacknameLengthOK
    Type: AWS::CloudFormation::Stack
    Condition: ShouldCreateDocumentKnowledgeBase
    Properties:
      TemplateURL: ./nested/bedrockkb/.aws-sam/packaged.yaml
      Parameters:
        pKnowledgeBaseBucketName: !Ref OutputBucket
        pInputDocumentUploadFolderPrefix: ""
        pS3SyncScheduleExpression: "cron(0/30 * ? * * *)" # default is to sync documents every 30 minutes
        pCustomerManagedEncryptionKeyArn: !GetAtt CustomerManagedEncryptionKey.Arn
        pChunkingStrategy: "Fixed-size chunking"
        pMaxTokens: 8192
        pVectorStoreType: !Ref KnowledgeBaseVectorStore
        LogLevel: !Ref LogLevel
        PermissionsBoundaryArn: !Ref PermissionsBoundaryArn



  ##########################################################################
  # AgentCore MCP Handler Lambda Function
  ##########################################################################

  AgentCoreMCPHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: CreateAgentCoreLambda
    Properties:
      KmsKeyId: !GetAtt CustomerManagedEncryptionKey.Arn
      RetentionInDays: !Ref LogRetentionDays

  AgentCoreMCPHandlerFunction:
    Type: AWS::Serverless::Function
    Condition: CreateAgentCoreLambda
    Metadata:
      BuildMethod: python3.12
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: "bedrock-agentcore:InvokeAgentRuntime, aws-marketplace, and logs:DescribeLogGroups APIs do not support resource-level permissions"
          - id: W89
            reason: "Function does not require VPC access as it only interacts with AWS services via APIs"
          - id: W92
            reason: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required for AgentCore MCP handler function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only configuration values like feature flags and non-sensitive settings"
    Properties:
      # SAM auto-generates this function's execution role. Set the boundary on
      # the function so it flows onto that generated role — otherwise creation
      # fails in accounts whose SCP requires a boundary on every IAM role.
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      FunctionName: !Sub "${AWS::StackName}-agentcore-mcp-handler"
      CodeUri: src/lambda/agentcore_mcp_handler/
      Handler: index.lambda_handler
      Runtime: python3.12
      MemorySize: 1024
      Timeout: 900
      Layers:
        - !Ref IDPCommonAgentsLayer
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          CONFIGURATION_TABLE_NAME: !Ref ConfigurationTable
          TRACKING_TABLE_NAME: !Ref TrackingTable
          LOOKUP_FUNCTION_NAME: !Ref LookupFunction
          STRANDS_LOG_LEVEL: !Ref LogLevel
          AGENT_TABLE: !Ref AgentTable
          APPSYNC_API_URL: ""
          ATHENA_DATABASE: !Ref ReportingDatabase
          ATHENA_WORKGROUP: primary
          QUERY_RESULTS_BUCKET: !If
            - ShouldCreateReportingBucket
            - !Ref ReportingBucket
            - !Ref ReportingBucketName
          ATHENA_OUTPUT_LOCATION: !Sub
            - "s3://${Bucket}/athena-results/"
            - Bucket: !If
                - ShouldCreateReportingBucket
                - !Ref ReportingBucket
                - !Ref ReportingBucketName
          AWS_STACK_NAME: !Ref AWS::StackName
          GUARDRAIL_ID_AND_VERSION:
            !If [
              HasGuardrailConfig,
              !Sub "${BedrockGuardrailId}:${BedrockGuardrailVersion}",
              "",
            ]
          CLOUDWATCH_LOG_GROUP_PREFIX: !Sub "/aws/lambda/${AWS::StackName}"
          SETTINGS_PARAMETER_NAME: !Ref SettingsParameter
          MCP_SERVER_BUCKET: !Ref MCPContentBucket
          BEDROCK_ASSUME_ROLE_ARN:
            !If [HasBedrockHubRole, !Ref BedrockHubRoleArn, !Ref AWS::NoValue]
          BEDROCK_ASSUME_ROLE_EXTERNAL_ID:
            !If [HasBedrockHubRoleExternalId, !Ref BedrockHubRoleExternalId, !Ref AWS::NoValue]
          BEDROCK_ASSUME_ROLE_SESSION_NAME:
            !If [HasBedrockHubRoleSessionName, !Ref BedrockHubRoleSessionName, !Ref AWS::NoValue]
      LoggingConfig:
        LogGroup: !Ref AgentCoreMCPHandlerLogGroup
      Policies:
        - Statement:
            Effect: Allow
            Action: bedrock-agentcore:InvokeAgentRuntime
            Resource: "*"
        - DynamoDBCrudPolicy:
            TableName: !Ref ChatMessagesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ChatSessionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref IdHelperChatMemoryTable
        - DynamoDBReadPolicy:
            TableName: !Ref ConfigurationTable
        - S3CrudPolicy:
            BucketName: !If
              - ShouldCreateReportingBucket
              - !Ref ReportingBucket
              - !Ref ReportingBucketName
        - Statement:
            - Effect: Allow
              Action:
                # PutMetricData for emit_control_plane_cost_metric on the
                # analytics agent's Athena calls (via analytics_tool). Scoped
                # to the IDPControlPlane namespace via condition. Round-6
                # review fix — was missing, so every analytics-agent query
                # AccessDenied on emit and control_plane_hourly showed 0
                # for analytics-agent's Athena spend.
                - cloudwatch:PutMetricData
              Resource: "*"
              Condition:
                StringEquals:
                  "cloudwatch:namespace": IDPControlPlane
        - Statement:
            - Effect: Allow
              Action:
                - athena:StartQueryExecution
                - athena:GetQueryExecution
                - athena:GetQueryResults
                - athena:StopQueryExecution
              Resource:
                - !Sub "arn:${AWS::Partition}:athena:${AWS::Region}:${AWS::AccountId}:workgroup/primary"
                - !Sub "arn:${AWS::Partition}:athena:${AWS::Region}:${AWS::AccountId}:datacatalog/*"
            - Effect: Allow
              Action:
                - s3:ListBucket
                - s3:GetBucketLocation
                - s3:GetBucketVersioning
              Resource:
                - !Sub
                  - "${BucketArn}"
                  - BucketArn: !If
                      - ShouldCreateReportingBucket
                      - !GetAtt ReportingBucket.Arn
                      - !Sub "arn:${AWS::Partition}:s3:::${ReportingBucketName}"
                - !GetAtt InputBucket.Arn
                - !GetAtt OutputBucket.Arn
                - !GetAtt MCPContentBucket.Arn
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:DeleteObject
                - s3:AbortMultipartUpload
                - s3:ListMultipartUploadParts
              Resource:
                - !Sub
                  - "${BucketArn}/*"
                  - BucketArn: !If
                      - ShouldCreateReportingBucket
                      - !GetAtt ReportingBucket.Arn
                      - !Sub "arn:${AWS::Partition}:s3:::${ReportingBucketName}"
                - !Sub "${InputBucket.Arn}/*"
                - !Sub "${OutputBucket.Arn}/*"
                - !Sub "${MCPContentBucket.Arn}/*"
            - Effect: Allow
              Action:
                - glue:GetTable
                - glue:GetTables
                - glue:GetDatabase
                - glue:GetDatabases
                - glue:GetPartitions
              Resource:
                - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog"
                - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${ReportingDatabase}"
                - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${ReportingDatabase}/*"
            # OpenAI GPT-5.x models are served via the bedrock-mantle endpoint
            # (OpenAI Responses API) and use a separate IAM action namespace.
            - Effect: Allow
              Action:
                - bedrock-mantle:CreateInference
                - bedrock-mantle:GetProject
                - bedrock-mantle:ListProjects
                - bedrock-mantle:ListTagsForResources
              Resource: "*"
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
                - bedrock:GetInferenceProfile
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:application-inference-profile/*"
            - Effect: Allow
              Action:
                - aws-marketplace:Subscribe
                - aws-marketplace:Unsubscribe
                - aws-marketplace:ViewSubscriptions
              Resource: "*"
            - !If
              - HasGuardrailConfig
              - Effect: Allow
                Action:
                  - "bedrock:ApplyGuardrail"
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/${BedrockGuardrailId}"
              - !Ref AWS::NoValue
            # Optional cross-account Bedrock invocation via hub-account role.
            - !If
              - HasBedrockHubRole
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: !Ref BedrockHubRoleArn
              - !Ref AWS::NoValue
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:ReEncrypt*
                - kms:GenerateDataKey*
                - kms:DescribeKey
              Resource: !GetAtt CustomerManagedEncryptionKey.Arn
            - Effect: Allow
              Action:
                - bedrock-agentcore:StartCodeInterpreterSession
                - bedrock-agentcore:StopCodeInterpreterSession
                - bedrock-agentcore:InvokeCodeInterpreter
                - bedrock-agentcore:GetCodeInterpreterSession
                - bedrock-agentcore:ListCodeInterpreterSessions
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock-agentcore:*:aws:code-interpreter/*"
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue  # pragma: allowlist secret - IAM action name, not a secret value
              Resource:
                - !Ref ExternalMCPAgentsSecret
            - Effect: Allow
              Action:
                - logs:DescribeLogGroups
                - logs:DescribeLogStreams
                - logs:FilterLogEvents
                - logs:GetLogEvents
              Resource:
                - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}*"
                - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/vendedlogs/states/${AWS::StackName}*"
                - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${AWS::StackName}*"
                - !GetAtt QueueSenderLogGroup.Arn
                - !GetAtt QueueProcessorLogGroup.Arn
                - !GetAtt WorkflowTrackerLogGroup.Arn
                - !GetAtt SaveReportingDataFunctionV2LogGroup.Arn
            - Effect: Allow
              Action:
                - logs:DescribeLogGroups
              Resource:
                - "*"
            - Effect: Allow
              Action:
                - dynamodb:DescribeTable
                - dynamodb:Scan
                - dynamodb:Query
                - dynamodb:GetItem
                - dynamodb:Query
              Resource:
                - !GetAtt TrackingTable.Arn
                - !GetAtt ConfigurationTable.Arn
                - !GetAtt AgentTable.Arn
            - Effect: Allow
              Action:
                - cloudformation:DescribeStackResources
                - cloudformation:DescribeStacks
                - cloudformation:ListStackResources
              Resource:
                - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*"
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}*"
            - Effect: Allow
              Action:
                - states:DescribeExecution
                - states:GetExecutionHistory
              Resource:
                - !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:${AWS::StackName}*"
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${SettingsParameter}"

  ##########################################################################
  # AgentCore Gateway Manager Lambda Function
  ##########################################################################

  AgentCoreGatewayManagerFunction:
    Type: AWS::Serverless::Function
    Condition: CreateAgentCoreLambda
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function does not require VPC access as it only interacts with AWS services via APIs"
          - id: W92
            reason: "Function does not require reserved concurrency as it scales based on demand"
          - id: F38
            reason: "PassRole permission is required to delegate the execution role to the Bedrock AgentCore Gateway service securely"
          - id: F3
            reason: "Wildcard actions required for AgentCore Gateway lifecycle management (create, update, delete) and CloudWatch Logs delivery configuration"
          - id: W11
            reason: "Wildcard resource required as AgentCore Gateway ARNs are dynamically generated and unknown at deployment time"
    # checkov:skip=CKV_AWS_116: "DLQ not required for Cfn Custom Resource function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only configuration values like feature flags and non-sensitive settings"
    Properties:
      PermissionsBoundary:
        !If [
          HasPermissionsBoundary,
          !Ref PermissionsBoundaryArn,
          !Ref AWS::NoValue,
        ]
      CodeUri: src/lambda/agentcore_gateway_manager/
      Handler: index.handler
      Runtime: python3.12
      Timeout: 900
      MemorySize: 512
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
      LoggingConfig:
        LogGroup: !Ref AgentCoreGatewayManagerLogGroup
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock-agent:*
                - bedrock-agentcore:*
                - bedrock-agentcore-control:*
                - logs:CreateLogGroup
                - logs:PutLogEvents
                - logs:DeleteLogGroup
                - logs:PutDeliverySource
                - logs:DeleteDeliverySource
                - logs:PutDeliveryDestination
                - logs:DeleteDeliveryDestination
                - logs:DescribeDeliveryDestinations
                - logs:DescribeDeliverySources
                - iam:PassRole
                - iam:CreateRole
                - iam:AttachRolePolicy
                - iam:GetRole
                - cognito-idp:DescribeUserPool
              Resource: "*"
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:ReEncrypt*
                - kms:GenerateDataKey*
                - kms:DescribeKey
              Resource: !GetAtt CustomerManagedEncryptionKey.Arn

  AgentCoreGatewayManagerLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: CreateAgentCoreLambda
    Properties:
      KmsKeyId: !GetAtt CustomerManagedEncryptionKey.Arn
      RetentionInDays: !Ref LogRetentionDays

  AgentCoreGatewayExecutionRole:
    Type: AWS::IAM::Role
    Condition: CreateAgentCoreLambda
    Properties:
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      RoleName: !Sub "${AWS::StackName}-AgentCoreGatewayExecutionRole"
      Description: Execution role for AgentCore Gateway
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub "bedrock-agentcore.${AWS::URLSuffix}"
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*"
      Policies:
        - PolicyName: InvokeLambdaPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt AgentCoreMCPHandlerFunction.Arn
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/CloudWatchLogsFullAccess"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-AgentCoreGatewayExecutionRole"

  AgentCoreGateway:
    Type: Custom::AgentCoreGateway
    Condition: CreateAgentCoreLambda
    Properties:
      ServiceToken: !GetAtt AgentCoreGatewayManagerFunction.Arn
      StackName: !Ref AWS::StackName
      Region: !Ref AWS::Region
      LambdaArn: !GetAtt AgentCoreMCPHandlerFunction.Arn
      UserPoolId: !Ref UserPool
      ClientId: !Ref ExternalAppClient
      ClientSecret: !GetAtt ExternalAppClient.ClientSecret
      ConnectorClientId: !Ref MCPConnectorClient
      ExecutionRoleArn: !GetAtt AgentCoreGatewayExecutionRole.Arn
      # Bump when IDP_TOOLS_SCHEMA in the gateway manager Lambda changes.
      # Custom resources only re-run when a property changes; this forces the
      # manager to run on stack update and re-sync the gateway target's tool
      # schema (update_gateway_target_if_needed) onto existing deployments.
      ToolSchemaVersion: "2026-07-26-get-results-document-id"
      SourceCodeHash: <LAMBDA_HASH_TOKEN>

  ##########################################################################
  # Read previous IDPPattern from SSM before PATTERNSTACK overwrites it
  # This detects Pattern-1 → Unified upgrades so BDA can be auto-enabled
  ##########################################################################

  ReadPreviousIDPPatternFunction:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Function does not require VPC access
          - id: W92
            reason: Reserved concurrency not required
    # checkov:skip=CKV_AWS_116: "DLQ not required for Cfn Custom Resource function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_173: "Environment variables contain non-sensitive configuration values (log level only)"
    Properties:
      PermissionsBoundary:
        !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      Handler: index.handler
      Runtime: python3.12
      Timeout: 10
      CodeUri: src/lambda/read_previous_idp_pattern
      Environment:
        Variables:
          LOG_LEVEL: INFO
      LoggingConfig:
        LogGroup: !Ref ReadPreviousIDPPatternFunctionLogGroup
      Policies:
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${SettingsParameter}"

  ReadPreviousIDPPatternFunctionLogGroup:
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W84
            reason: "LogGroup does not require KMS Key Id"
    # checkov:skip=CKV_AWS_158: "LogGroup does not require KMS Key Id"
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !Ref LogRetentionDays

  PreviousIDPPatternValue:
    Type: Custom::ReadPreviousIDPPattern
    Properties:
      ServiceToken: !GetAtt ReadPreviousIDPPatternFunction.Arn
      SettingsParameterName: !Ref SettingsParameter

  ##########################################################################
  # Nested stack for selected pattern
  ##########################################################################

  PATTERNSTACK:
    DependsOn:
      - IsStacknameLengthOK
      - CopyConfigurationFiles
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./patterns/unified/.aws-sam/packaged.yaml
      Parameters:
        StackName: !Ref AWS::StackName
        InputBucket: !Ref InputBucket
        DiscoveryBucket: !Ref DiscoveryBucket
        DiscoveryTrackingTable: !Ref DiscoveryTrackingTable
        ConfigurationBucket: !Ref ConfigurationBucket
        WorkingBucket: !Ref WorkingBucket
        OutputBucket: !Ref OutputBucket
        TrackingTable: !Ref TrackingTable
        CustomerManagedEncryptionKeyArn: !GetAtt CustomerManagedEncryptionKey.Arn
        LogRetentionDays: !Ref LogRetentionDays
        LogLevel: !Ref LogLevel
        ExecutionTimeThresholdMs: !Ref ExecutionTimeThresholdMs
        BDACallbackTimeoutSeconds: !Ref BDACallbackTimeoutSeconds
        BedrockGuardrailId: !Ref BedrockGuardrailId
        BedrockGuardrailVersion: !Ref BedrockGuardrailVersion
        BedrockHubRoleArn: !Ref BedrockHubRoleArn
        BedrockHubRoleExternalId: !Ref BedrockHubRoleExternalId
        BedrockHubRoleSessionName: !Ref BedrockHubRoleSessionName
        UpdateConfigurationFunctionArn: !GetAtt UpdateConfigurationFunction.Arn
        ConfigurationTable: !Ref ConfigurationTable
        # GraphQL API removed: every processing Lambda writes the TrackingTable
        # directly (DOCUMENT_TRACKING_MODE=dynamodb). The old ApiUrl/ApiArn
        # params are no longer passed (the pattern stack no longer declares them).
        ConfigurationDefaultS3Uri: !If
          - HasCustomConfigPath
          - !Ref CustomConfigPath
          - !Sub
            - "s3://${ConfigurationBucket}/config_library/unified/${ConfigPath}/config.yaml"
            - ConfigPath:
                !FindInMap [
                  ConfigurationMap,
                  !Ref ConfigurationPreset,
                  ConfigPath,
                ]
        ConfigLibraryHash: "<CONFIG_LIBRARY_HASH_TOKEN>"
        EnableXRayTracing: !Ref EnableXRayTracing
        PermissionsBoundaryArn: !Ref PermissionsBoundaryArn
        ReportingBucket: !If
          - ShouldCreateReportingBucket
          - !Ref ReportingBucket
          - !Ref ReportingBucketName
        BaselineBucket: !If
          - ShouldCreateEvaluationBaselineBucket
          - !Ref EvaluationBaselineBucket
          - !Ref EvaluationBaselineBucketName
        SaveReportingFunctionName: !Ref SaveReportingDataFunctionV2
        ImageVersion: "<UNIFIED_IMAGE_VERSION>"
        LambdaArchitecture: !Ref LambdaArchitecture
        ArtifactBucket: "<ARTIFACT_BUCKET_TOKEN>"
        ArtifactPrefix: "<ARTIFACT_PREFIX_TOKEN>"
        ArtifactsBucketKmsKeyArn: !Ref ArtifactsBucketKmsKeyArn
        SourceZipfile: "<UNIFIED_SOURCE_ZIPFILE_TOKEN>"
        CustomClassificationModelARN: !Ref Pattern2CustomClassificationModelARN
        CustomExtractionModelARN: !Ref Pattern2CustomExtractionModelARN
        EnableECRImageScanning: !Ref EnableECRImageScanning
        PreviousIDPPattern: !GetAtt PreviousIDPPatternValue.IDPPattern

        # Private REST API VPC config (req #2) — puts processing Lambdas in VPC
        UsePrivateApi: !If [UsePrivateApi, "true", "false"]
        LambdaSubnetIds: !If
          - UsePrivateApi
          - !Join [",", !Ref LambdaSubnetIds]
          - ""
        LambdaSecurityGroupId: !If
          - DeployInVPC
          - !Ref LambdaSecurityGroupId
          - !If
            - UsePrivateApi
            - !Ref LambdaVpcSecurityGroup
            - ""

        # VPC config for CodeBuild (Docker image builds)
        VpcId: !If [DeployInVPC, !Ref VpcId, ""]
        PrivateSubnetIds: !If [DeployInVPC, !Join [",", !Ref PrivateSubnetIds], ""]

        # MLflow Integration
        EnableMLflow: !Ref EnableMLflow
        MlflowTrackingURI: !Ref MlflowTrackingURI

  ##########################################################################
  # Encryption key
  ##########################################################################


  ##########################################################################
  # Nested stack for REST API resolvers
  ##########################################################################

  APIRESOLVERSTACK:
    DependsOn:
      - IsStacknameLengthOK
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./nested/api-resolvers/.aws-sam/packaged.yaml
      Parameters:
        # GraphQL API removed: the nested stack now hosts only the REST API +
        # dispatcher. The GraphQLApiId/GraphQLApiArn/GraphQLApiUrl params are no
        # longer passed (the nested template no longer declares them).

        # Background worker ARNs
        AgentChatProcessorFunctionArn: !GetAtt AgentChatProcessorFunction.Arn
        ChatWithDocumentProcessorFunctionArn: !GetAtt ChatWithDocumentProcessorFunction.Arn
        AgentProcessorFunctionArn: !GetAtt AgentProcessorFunction.Arn
        TestExecutionAggregationFunctionArn: !GetAtt PATTERNSTACK.Outputs.TestExecutionAggregationFunctionArn
        
        # DynamoDB Tables
        TrackingTableName: !Ref TrackingTable
        ConfigurationTableName: !Ref ConfigurationTable
        AgentTableName: !Ref AgentTable
        ChatMessagesTableName: !Ref ChatMessagesTable
        ChatSessionsTableName: !Ref ChatSessionsTable
        IdHelperChatMemoryTableName: !Ref IdHelperChatMemoryTable
        DiscoveryTrackingTableName: !Ref DiscoveryTrackingTable

        # S3 Buckets
        InputBucketName: !Ref InputBucket
        OutputBucketName: !Ref OutputBucket
        ConfigurationBucketName: !Ref ConfigurationBucket
        TestSetBucketName: !Ref TestSetBucket
        EvaluationBaselineBucketName: !If
          - ShouldCreateEvaluationBaselineBucket
          - !Ref EvaluationBaselineBucket
          - !Ref EvaluationBaselineBucketName
        ReportingBucketName: !If
          - ShouldCreateReportingBucket
          - !Ref ReportingBucket
          - !Ref ReportingBucketName
        WorkingBucketName: !Ref WorkingBucket
        DiscoveryBucketName: !Ref DiscoveryBucket
        MultiDocDiscoveryStateMachineArn: !Ref MultiDocDiscoveryStateMachine
        
        # SQS Queues
        DocumentQueueUrl: !Ref DocumentQueue
        DiscoveryQueueUrl: !Ref DiscoveryQueue
        TestFileCopyQueueUrl: !Ref TestFileCopyQueue
        TestSetFileCopyQueueUrl: !Ref TestSetFileCopyQueue
        TestResultCacheUpdateQueueUrl: !Ref TestResultCacheUpdateQueue
        TestResultCacheUpdateQueueArn: !GetAtt TestResultCacheUpdateQueue.Arn
        
        # SQS Queue Names (for IAM policies)
        DocumentQueueName: !GetAtt DocumentQueue.QueueName
        DiscoveryQueueName: !GetAtt DiscoveryQueue.QueueName
        TestFileCopyQueueName: !GetAtt TestFileCopyQueue.QueueName
        TestSetFileCopyQueueName: !GetAtt TestSetFileCopyQueue.QueueName
        TestResultCacheUpdateQueueName: !GetAtt TestResultCacheUpdateQueue.QueueName
        
        # Other resources
        CustomerManagedEncryptionKeyArn: !GetAtt CustomerManagedEncryptionKey.Arn
        ReportingDatabaseName: !Ref ReportingDatabase
        LookupFunctionName: !Ref LookupFunction
        SaveReportingFunctionName: !Ref SaveReportingDataFunctionV2
        
        # Runtime settings (read from Parameter Store)
        SettingsParameterName: !Ref SettingsParameter
        
        # Configuration
        StackName: !Ref AWS::StackName
        LogRetentionDays: !Ref LogRetentionDays
        LogLevel: !Ref LogLevel
        DataRetentionInDays: !Ref DataRetentionInDays
        PermissionsBoundaryArn: !Ref PermissionsBoundaryArn
        ExecutionTimeThresholdMs: !Ref ExecutionTimeThresholdMs
        
        # Conditional parameters
        HasGuardrailConfig: !If [HasGuardrailConfig, "true", "false"]
        BedrockGuardrailId: !Ref BedrockGuardrailId
        BedrockGuardrailVersion: !Ref BedrockGuardrailVersion
        KnowledgeBaseModelId: !Ref KnowledgeBaseModelId
        ShouldCreateEvaluationBaselineBucket: !If [ShouldCreateEvaluationBaselineBucket, "true", "false"]
        ShouldCreateReportingBucket: !If [ShouldCreateReportingBucket, "true", "false"]
                
        # Lambda Layers
        IDPCommonBaseLayerArn: !Ref IDPCommonBaseLayer
        IDPCommonAgentsLayerArn: !Ref IDPCommonAgentsLayer
        
        # User management (for config-version scoping)
        UsersTableName: !Ref UsersTable
        UsersTableArn: !GetAtt UsersTable.Arn

        # S3 VPC endpoint URL — passed to presigner resolver Lambdas only when
        # explicitly opted in (S3PresignedUrlViaVpcEndpoint=true or BYO override).
        S3EndpointUrl: !If
          - UseS3VpcEndpointForPresigner
          - !Sub
            - "https://bucket.${VpceDnsName}"
            - VpceDnsName: !Ref S3VpcEndpointDnsNameOverride
          - ""

        # Private REST API config — private endpoint + WAF + in-VPC resolver
        # Lambdas. ApiGatewayVpcEndpointId (reused from the headless Jobs API)
        # is only relevant in PRIVATE mode. WAFAllowedIPv4Ranges is a plain
        # comma-joined string (the parent param is Type: String); the nested
        # template declares it as CommaDelimitedList, which accepts that string.
        UsePrivateApi: !If [UsePrivateApi, "true", "false"]
        ApiGatewayVpcEndpointId: !If [UsePrivateApi, !Ref ApiGatewayVpcEndpointId, ""]
        WAFAllowedIPv4Ranges: !Ref WAFAllowedIPv4Ranges
        LambdaSubnetIds: !If
          - UsePrivateApi
          - !Join [",", !Ref LambdaSubnetIds]
          - ""
        LambdaSecurityGroupId: !If
          - UsePrivateApi
          - !Ref LambdaVpcSecurityGroup
          - ""

        # Circuit Breaker wiring — feature-flagged; params empty when disabled
        ConcurrencyTableName: !Ref ConcurrencyTable
        CircuitBreakerManagerFunctionArn: !If
          - CircuitBreakerEnabledCondition
          - !GetAtt CircuitBreakerManagerFunction.Arn
          - ""
        CircuitBreakerEnabled: !Ref CircuitBreakerEnabled

        # API Gateway HTTP API transport (the only transport now). The nested
        # stack builds the HTTP API + JWT authorizer + dispatcher Lambda. The
        # dispatcher needs the main-template resolver function ARNs (the rest are
        # defined in the nested stack). ApiTransport is no longer passed.
        # NB: UserPoolClientId is intentionally NOT passed. The nested stack only
        # needs the pool id (authorizer ProviderARNs); the client id is unused
        # there. Omitting it removes an APIRESOLVERSTACK -> UserPoolClient
        # dependency edge, so UserPoolClient.CallbackURLs can safely reference
        # this stack's HttpApiEndpoint output (WebUIHosting=APIGateway) without a
        # circular dependency.
        UserPoolId: !Ref UserPool

        # Web UI hosting via API Gateway S3 proxy (WebUIHosting=APIGateway). When
        # enabled, this REST API also serves the React SPA from the Web UI bucket
        # on the same stage, so the UI inherits the API's PRIVATE/GLOBAL
        # visibility and stage-level WAF.
        ServeWebUI: !If [UseApiGatewayHosting, "true", "false"]
        WebUIBucketName: !If [UseApiGatewayHosting, !Ref WebUIBucket, ""]
        WebUIProxyRoleArn: !If [UseApiGatewayHosting, !GetAtt WebUIProxyRole.Arn, ""]

        CompleteSectionReviewFunctionArn: !GetAtt CompleteSectionReviewFunction.Arn
        UserManagementFunctionArn: !GetAtt UserManagementFunction.Arn
        FinetuningJobsResolverFunctionArn: !GetAtt FinetuningJobsResolverFunction.Arn
        CalculateCapacityResolverFunctionArn: !GetAtt CalculateCapacityResolverFunction.Arn
        VersionCheckResolverFunctionArn: !GetAtt VersionCheckResolverFunction.Arn

        # Feature-platform UI-field resolver ARNs. The 6 UI-facing feature
        # fields route through this HTTP API dispatcher; their resolver Lambdas
        # live in the FeaturePlatformStack nested stack, so the ARNs flow
        # FeaturePlatformStack Outputs -> here -> dispatcher FIELD_FUNCTION_MAP.
        # Empty when the feature platform is disabled (fields absent from map).
        ListCatalogFeaturesFunctionArn: !If
          - IsFeaturePlatformEnabled
          - !GetAtt FeaturePlatformStack.Outputs.ListCatalogFeaturesFunctionArn
          - ""
        ListInstalledFeaturesFunctionArn: !If
          - IsFeaturePlatformEnabled
          - !GetAtt FeaturePlatformStack.Outputs.ListInstalledFeaturesFunctionArn
          - ""
        CheckFeatureEntitlementFunctionArn: !If
          - IsFeaturePlatformEnabled
          - !GetAtt FeaturePlatformStack.Outputs.CheckFeatureEntitlementFunctionArn
          - ""
        GetFeatureLaunchUrlFunctionArn: !If
          - IsFeaturePlatformEnabled
          - !GetAtt FeaturePlatformStack.Outputs.GetFeatureLaunchUrlFunctionArn
          - ""
        SubscribeFeatureFunctionArn: !If
          - IsFeaturePlatformEnabled
          - !GetAtt FeaturePlatformStack.Outputs.SubscribeFeatureFunctionArn
          - ""
        UnsubscribeFeatureFunctionArn: !If
          - IsFeaturePlatformEnabled
          - !GetAtt FeaturePlatformStack.Outputs.UnsubscribeFeatureFunctionArn
          - ""

  ##########################################################################
  # === Feature Platform (optional) — BEGIN ===============================
  # Deployed only when EnableFeaturePlatform=true. Adds an InstalledFeatures
  # DDB table + resolver Lambdas for listing/registering/installing features
  # and checking Marketplace entitlements. Feature stacks register themselves
  # with this host and have their UI bundles rendered inside the main IDP web
  # UI. With no FeaturePlatformSimulatorEndpoint set the platform runs in
  # auto-subscribe mode (every catalog feature installable; no entitlement
  # checks). See feature-platform/main-stack-extensions/.
  ##########################################################################

  # NB: there is no stack-owned "feature bucket". OSS feature artifacts live in
  # the artifacts bucket the main template is published to (under
  # sample-features/); the catalog entry (catalog.json) carries each feature's
  # artifactBucket + artifactPrefix, and getFeatureLaunchUrl builds the Launch
  # Stack URL directly from those. Marketplace features use a private seller
  # bucket declared in config_library/extensions-marketplace.yaml.

  # Ordering note: APIRESOLVERSTACK now consumes FeaturePlatformStack's resolver
  # function ARNs (the 6 UI fields) via !GetAtt FeaturePlatformStack.Outputs.*,
  # which makes APIRESOLVERSTACK implicitly depend on FeaturePlatformStack. The old
  # explicit "FeaturePlatformStack DependsOn APIRESOLVERSTACK" was for attaching
  # GraphQL resolvers to the main schema; with the GraphQL API gone it is removed (and
  # keeping it would create a dependency cycle). The implicit GetAtt dependency
  # is conditional-safe: it only applies when IsFeaturePlatformEnabled is true.
  FeaturePlatformStack:
    Type: AWS::CloudFormation::Stack
    Condition: IsFeaturePlatformEnabled
    Properties:
      TemplateURL: ./feature-platform/main-stack-extensions/.aws-sam/packaged.yaml
      Parameters:
        MainStackName: !Ref AWS::StackName
        # GraphQL API removed: the feature platform now uses the REST API only. The
        # ApiTransport / GraphQLApiId / GraphQLApiArn / ApiUrl params are no
        # longer passed (the feature-platform template no longer declares them).
        UserPoolId: !Ref UserPool
        # Feature stacks with HTTP APIs use these two as the JWT audience
        # (Cognito Client id) and as the document-state table name for
        # scoped `dynamodb:Scan`/`Query` — e.g. `docs-by-status` counts
        # documents per status by scanning the main stack's TrackingTable.
        UserPoolClientId: !Ref UserPoolClient
        TrackingTableName: !Ref TrackingTable
        # Exposed to feature stacks so they can grant `kms:Decrypt` on the
        # key that encrypts TrackingTable. Without it, a feature Lambda
        # querying the table gets `AccessDeniedException: KMS key access
        # denied`.
        CustomerManagedEncryptionKeyArn: !GetAtt CustomerManagedEncryptionKey.Arn
        WebUIBucketName: !Ref WebUIBucket
        WebUIBucketArn: !GetAtt WebUIBucket.Arn
        # Output + Working bucket names re-exported for feature stacks:
        # Output so features can read processing results (e.g. sample-health-insurance-review
        # reads rule-validation consolidated summaries), Working so feature
        # hook Lambdas can load the compressed document payloads the
        # pipeline-hooks dispatcher hands them.
        OutputBucketName: !Ref OutputBucket
        WorkingBucketName: !Ref WorkingBucket
        # Discovery bucket name re-exported so feature UIs that drive the
        # host's Rules Discovery flow (sample-health-insurance-review) know where
        # uploadDiscoveryDocument presigns uploads.
        DiscoveryBucketName: !Ref DiscoveryBucket
        # Input bucket name re-exported so a preprocessing feature (e.g. PII
        # anonymization) can read source documents and write a redacted copy
        # back under a reserved prefix to spawn a new de-identified execution.
        InputBucketName: !Ref InputBucket
        # UsersTable re-exported so a feature can RBAC-gate a sensitive view by
        # the caller's allowedConfigVersions (e.g. PII mapping in the Redaction
        # Report is shown only to users allowed the original's config version).
        UsersTableName: !Ref UsersTable
        UsersTableArn: !GetAtt UsersTable.Arn
        # Test Set bucket name re-exported so feature stacks that generate test
        # sets (idp-data-generator) can write documents Test Studio discovers.
        TestSetBucketName: !Ref TestSetBucket
        # Reporting bucket name re-exported (as name + ARN) so feature stacks
        # that read reporting/analytics data or write Athena query results
        # (e.g. idp-monitor) can grant themselves scoped s3 access. Mirrors the
        # bucket-or-name selection used elsewhere for the Reporting bucket.
        ReportingBucketName: !If
          - ShouldCreateReportingBucket
          - !Ref ReportingBucket
          - !Ref ReportingBucketName

        # Region of the artifacts bucket (= this stack's region), used to build
        # the bare OSS feature template URL in getFeatureLaunchUrl.
        ArtifactRegion: !Ref AWS::Region
        # Simulator base URL: the buyer-console redirect target AND the endpoint
        # override for the emulated AWS Marketplace APIs. Blank = real AWS.
        SimulatorEntitlementEndpoint: !Ref FeaturePlatformSimulatorEndpoint
        # The mode is passed through verbatim — it is NOT inferred from whether
        # an endpoint is set. Inferring it made the production path
        # ('marketplace-live') unreachable whenever a simulator endpoint was
        # configured, so the buyer-side Agreement check could never be exercised
        # against a simulator. Decoupling them is what makes it developable.
        SubscriptionMode: !Ref FeaturePlatformSubscriptionMode
        DefaultCustomerIdentifier: !Ref FeaturePlatformDefaultCustomerIdentifier
        AdminGroupName: 'Admin'
        # ConfigurationTable is shared between the main stack's pipeline and
        # the registerFeatureHooks resolver; passing the name here lets the
        # nested stack add the dynamic-pipeline-hooks plumbing.
        ConfigurationTableName: !Ref ConfigurationTable
        # ConfigurationBucket holds catalog.json (copied in at deploy time by
        # ConfigurationCopyFunction). listCatalogFeatures / getFeatureLaunchUrl
        # read it at runtime — the catalog source, no artifacts-bucket dependency.
        ConfigurationBucketName: !Ref ConfigurationBucket
        # So applyFeatureConfigPreset can record a feature's config preset as a
        # REVISION of the feature's profile instead of minting a new profile per
        # feature release (issue #697).
        IDPCommonBaseLayerArn: !Ref IDPCommonBaseLayer
        LogLevel: !Ref LogLevel
        # Forward the permissions boundary so the nested stack's IAM role
        # (FeaturePlatformLambdaRole) is created with it. Without this,
        # accounts with an SCP that requires a boundary on every role fail
        # nested-stack creation and roll back. See the other nested stacks
        # (bedrockkb, pattern, reporting, discovery) which all forward this.
        PermissionsBoundaryArn: !Ref PermissionsBoundaryArn
  # === Feature Platform (optional) — END =================================

  CustomerManagedEncryptionKey:
    DependsOn:
      - IsStacknameLengthOK
    Type: AWS::KMS::Key
    Metadata:
      security-matrix:
        rules_to_suppress:
          - id: IAM-005
            reason: "No cross-account access - only same account root and AWS services"
          - id: KMS-007
            reason: "KMS monitoring not required for this IDP solution - comprehensive CloudWatch monitoring already in place"
          - id: KMS-002
            reason: "kms:* permission for account root is standard pattern for administrative access to KMS keys"
    Properties:
      Description: KMS key for DynamoDB encryption
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: kms:*
            Resource: "*"
          - Sid: Allow lambda to access the Keys
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: "*"
          - Sid: Allow DynamoDB to use the key
            Effect: Allow
            Principal:
              Service: !Sub "dynamodb.${AWS::URLSuffix}"
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: "*"
          - Sid: Allow CloudWatch Logs to use the key
            Effect: Allow
            Principal:
              Service: !Sub "logs.${AWS::URLSuffix}"
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: "*"
          # UNCONDITIONAL, and it has to be. AlertsTopic is encrypted with this
          # key whatever the circuit-breaker setting, so gating this statement on
          # CircuitBreakerEnabledCondition meant that on a DEFAULT deployment
          # (CircuitBreakerEnabled defaults to "false") CloudWatch could not
          # decrypt to publish, and EVERY alarm action on AlertsTopic failed with
          # "CloudWatch Alarms does not have authorization to access the SNS topic
          # encryption key". The alarms still transitioned to ALARM in the
          # console, so the only visible difference was that no notification ever
          # arrived — the same report-OK-by-silence failure as #746, one layer
          # further out. Do not re-add a condition here: the grant is only usable
          # by CloudWatch acting on this account's alarms, and any alarm in this
          # template may target AlertsTopic.
          - Sid: Allow CloudWatch Alarms to use the key for SNS
            Effect: Allow
            Principal:
              Service: !Sub "cloudwatch.${AWS::URLSuffix}"
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey*
            Resource: "*"
          - !If
            - IsS3VectorsVectorStore
            - Sid: Allow S3 Vectors indexing service to use the key
              Effect: Allow
              Principal:
                Service: !Sub "indexing.s3vectors.${AWS::URLSuffix}"
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:ReEncrypt*
                - kms:GenerateDataKey*
                - kms:DescribeKey
              Resource: "*"
            - !Ref AWS::NoValue

  CustomerManagedEncryptionKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${AWS::StackName}-customer-encryption-key"
      TargetKeyId: !Ref CustomerManagedEncryptionKey

  ##########################################################################
  # Lambda Layers for idp_common package
  ##########################################################################

  IDPCommonBaseLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      LayerName: !Sub "${AWS::StackName}-idp-common-base"
      Description: "IDP Common base layer (core + docs_service + image)"
      Content:
        S3Bucket: "<ARTIFACT_BUCKET_TOKEN>"
        S3Key: "<ARTIFACT_PREFIX_TOKEN>/layers/<IDP_COMMON_BASE_LAYER_ZIP>"
      CompatibleRuntimes:
        - python3.12
        - python3.13

  IDPCommonReportingLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      LayerName: !Sub "${AWS::StackName}-idp-common-reporting"
      Description: "IDP Common reporting layer (core + docs_service + reporting)"
      Content:
        S3Bucket: "<ARTIFACT_BUCKET_TOKEN>"
        S3Key: "<ARTIFACT_PREFIX_TOKEN>/layers/<IDP_COMMON_REPORTING_LAYER_ZIP>"
      CompatibleRuntimes:
        - python3.12
        - python3.13

  IDPCommonAgentsLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      LayerName: !Sub "${AWS::StackName}-idp-common-agents"
      Description: "IDP Common agents layer (core + agents)"
      Content:
        S3Bucket: "<ARTIFACT_BUCKET_TOKEN>"
        S3Key: "<ARTIFACT_PREFIX_TOKEN>/layers/<IDP_COMMON_AGENTS_LAYER_ZIP>"
      CompatibleRuntimes:
        - python3.12
        - python3.13

  # IDPCommonMultiDocDiscoveryLayer removed — dependencies exceed 250MB Lambda layer limit.
  # Multi-doc discovery Lambdas now use container images via nested/multi-doc-discovery stack.

  ##########################################################################
  # MCP Content Bucket for base64 document processing
  ##########################################################################

  MCPContentBucket:
    Type: AWS::S3::Bucket
    UpdateReplacePolicy: Retain
    DeletionPolicy: RetainExceptOnCreate
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref CustomerManagedEncryptionKey
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Ref LoggingBucket
        LogFilePrefix: mcp-content-bucket-logs/
      LifecycleConfiguration:
        Rules:
          - Id: DeleteMCPTempFiles
            Status: Enabled
            Prefix: mcp-temp/
            ExpirationInDays: 7
            NoncurrentVersionExpiration:
