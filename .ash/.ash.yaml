# Configuration for the AWS Automated Security Helper (ASH).
# https://github.com/awslabs/automated-security-helper  (v3.5.9+)
#
# WHY THIS FILE EXISTS
# --------------------
# ASH is not part of this repo's CI — the gates are `srt_security_review` and
# `dep_audit` (see .gitlab-ci.yml). ASH is run out-of-band by our security
# reviewers, and a scan comparison showed ~118 of its 306 HIGH findings were
# false positives that had to be re-triaged by hand every time. This file makes
# our triage travel with the code so a re-scan starts from where the last one
# finished.
#
# PREFER INLINE PRAGMAS OVER THIS FILE
# ------------------------------------
# ASH runs the real scanners, so it inherits whatever each scanner natively
# honours. An inline pragma is therefore better than an entry here: it sits next
# to the code it excuses, it survives file moves and line-number drift, and it
# works for every tool that runs that scanner (SRT and ASH alike). Verified
# locally against the actual scanner binaries:
#
#   bandit           `# nosec B310 - reason`                         (verified)
#   detect-secrets   `# pragma: allowlist secret`                    (verified)
#   checkov          `# checkov:skip=CKV_AWS_123:"reason"`           (521 in use)
#   cfn-nag          `Metadata: cfn_nag: rules_to_suppress`          (157 in use)
#   semgrep          `# nosemgrep: rule-id`                          (43 in use)
#   grype/npm-audit  no inline mechanism -> must be handled here
#
# Two gotchas found the hard way:
#   - bandit's `# nosec` is LINE-scoped. On a multi-line string it must go on a
#     line INSIDE the string node — the closing `"""` works, the opening line does
#     not (putting it there makes it part of the string, not a comment; two
#     analytics prompts had this bug and were shipping the pragma text to the LLM).
#   - `# noqa: S310` is ruff, NOT bandit. Bandit ignores it. A line needs both.
#
# So entries below are restricted to what CANNOT be expressed inline:
# generated/data files with no comment syntax, and dependency advisories.
#
# ⚠️ Every `path` entry with no `rule_id` suppresses ALL findings on that path.
# That is only acceptable for pure data files. Never add a source file or a
# CloudFormation template this way — it would blind ASH to real findings there.
# Use an inline pragma for those instead.
#
# Schema: automated_security_helper/schemas/AshConfig.json in the ASH repo.
# `path` + `reason` are required; `rule_id`, `line_start`, `line_end` and
# `expiration` are optional. Validate with `ash config validate`.

project_name: genaiic-idp-accelerator

global_settings:
  suppressions:
    # ---- detect-secrets: generated / data files, no comment syntax available ----

    # 57 findings, the single largest hotspot in the ASH report. This is a draw.io
    # architecture diagram (XML); the high-entropy strings are mxCell node ids and
    # embedded shape data. Verified: the file contains no credential of any kind,
    # and it is regenerated by the diagram editor, so an inline pragma would be
    # discarded on the next save.
    - path: 'images/*.drawio'
      reason: >-
        draw.io diagram node ids and embedded shape data, not credentials.
        Regenerated by the editor, so inline pragmas do not survive.

    # `pricing_sha256` content checksums recording which pricing table a benchmark
    # ran against. JSON has no comment syntax.
    - path: 'benchmarks/results/**'
      reason: >-
        SHA-256 content checksums in benchmark result JSON (pricing_sha256), not
        secrets. JSON cannot carry an inline pragma.

    # Our own SRT triage database. Its text DESCRIBES findings (including the word
    # "secret"), which the keyword heuristic then matches. Self-referential noise.
    - path: 'scripts/srt/issues.json'
      reason: >-
        Security-triage data file describing findings; the matched text is finding
        descriptions, not live secrets. JSON cannot carry an inline pragma.

    # Base64 payloads in notebook OUTPUT cells are rendered images. Verified on
    # test_document_formats.ipynb: 10 image/base64 outputs, 10 findings.
    - path: 'notebooks/**/*.ipynb'
      reason: >-
        Base64 image data in executed notebook output cells, not secrets. Notebook
        JSON cannot carry an inline pragma.

    # Documentation placeholders ('SecurePassword123!', "your-api-key",
    # "your-client-secret"). These sit inside fenced code blocks, where an HTML
    # comment pragma would render as literal junk on the published docs site.
    - path: 'docs/custom-MCP-agent.md'
      reason: >-
        Example password in a documentation code fence; a pragma would render
        literally on the docs site.
    - path: 'docs/lambda-hook-inference.md'
      reason: >-
        `export CHANDRA_API_KEY="your-api-key"` placeholder in a code fence.
    - path: 'samples/**/README.md'
      reason: >-
        Placeholder credentials in sample-client documentation code fences
        ("your-client-secret" etc.).

    # ---- grype / npm-audit: no inline suppression mechanism exists ----
    # These mirror scripts/security/dep_audit_allowlist.json, which is the gating
    # source of truth for our own CI. Keep the two in sync; if an entry is dropped
    # there because a dependency was upgraded, drop it here too.
    #
    # NOTE: rule_id here assumes ASH reports the advisory id verbatim. If a re-scan
    # still shows these, check the id ASH actually emits and adjust — do not widen
    # to a path-only entry, which would suppress every finding on the manifest.
    - rule_id: 'GHSA-j6g5-3hh3-pgw8'
      path: 'lib/idp_common_pkg/**'
      reason: >-
        bedrock-agentcore: not reachable. The advisory is in the SDK's
        install_packages() helper, which this repo never calls (only
        writeFiles/listFiles/executeCode). The fix (1.18.1) also requires
        boto3>=1.43.31 against a deliberate boto3<1.43.0 pin. See the [agents]
        extra in lib/idp_common_pkg/pyproject.toml.
    - rule_id: 'GHSA-4r6h-8v6p-xvw6'
      path: 'src/ui/**'
      reason: >-
        SheetJS prototype pollution, affected range "< 0.19.3". src/ui pins 0.20.2
        from cdn.sheetjs.com. The advisory has no `fixed` event because npm's xlsx
        is abandoned, so every version matches its open-ended range.
    - rule_id: 'GHSA-5pgg-2g8v-p4x9'
      path: 'src/ui/**'
      reason: >-
        SheetJS ReDoS, affected range "< 0.20.2". src/ui pins exactly 0.20.2 from
        cdn.sheetjs.com — the version the advisory names as the fix. Same
        open-ended-range artifact as GHSA-4r6h-8v6p-xvw6.

# NOT suppressed, deliberately:
#
#   * The ~149 checkov Lambda-hardening findings ASH rates HIGH (CKV_AWS_115/116/
#     117/173: reserved concurrency, DLQ, VPC placement, env-var CMK). These are
#     real, consciously accepted gaps, not false positives — SRT runs the same
#     rules and rates them LOW. Blanket-suppressing them would hide a backlog we
#     may choose to work off, and 521 targeted `checkov:skip` comments already
#     cover the cases that ARE genuinely N/A. If the volume is the problem, align
#     on severity (`severity_threshold`) rather than pretending the findings do
#     not exist.
#   * The ~10,700 bandit B101 (`assert` in tests) findings. They are LOW, and ASH
#     did not raise them to HIGH.
