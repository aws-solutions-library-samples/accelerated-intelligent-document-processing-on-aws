#
# Open-source extensions bundled with the accelerator. `idp-cli publish` builds
# each one and adds it (source: "oss") to the generated catalog.json. To add an
# OSS extension: scaffold it, then add a `{ path: <repo-relative-dir> }` entry.
#
# Only `path` is needed here — displayName / description / version / iconUrl all
# come from each feature's own feature.yaml manifest at publish time (unlike
# extensions-marketplace.yaml, whose closed-source features have no in-repo
# manifest to read, so their metadata is given inline). This avoids duplicating
# — and drifting from — the manifest.
#
# Note: an entry here is what makes a feature appear as *available to install*
# in the catalog. A feature deployed directly via CloudFormation still
# self-registers and shows up once installed (supports "unadvertised"
# features) — the catalog entry only adds it to the not-yet-installed list.
#
# No `licenseMode` field here, unlike extensions-marketplace.yaml: an
# open-source extension has no AWS Marketplace contract, so there is no authority
# to check. Absent means `none`, and publish.py writes that into the catalog
# explicitly so every entry the host reads has one shape.
#
# See docs/feature-platform-developer-guide.md. Counterpart for paid
# extensions: extensions-marketplace.yaml.

schemaVersion: "1.0"

features:
  # Minimal contract reference: publish → catalog → install → UI registration,
  # HTTP API + Cognito JWT, cross-stack imports, KMS.
  - path: feature-platform/sample-feature
  # Advanced vertical showcase: config preset applied at install, a
  # postRuleValidation pipeline hook, host-GraphQL calls from the feature UI
  # (Rules Discovery), and a multi-route feature API. See
  # docs/extensions/sample-health-insurance-review.md.
  - path: feature-platform/sample-health-insurance-review
  # PII Anonymization: a standalone `preprocessing` pipeline hook that redacts
  # PII from source documents before the classification/extraction models see
  # them, a Config Pairing wizard UI (host-GraphQL config CRUD), and a
  # Redaction Report API. Reuses the vendored AWS Labs pii-anonymizer document
  # closure (Apache-2.0). See docs/extensions/pii-anonymizer.md.
  - path: feature-platform/pii-anonymizer
  # Synthetic-document generator: bundles the SEED `seed-data` package + the
  # accelerator's synthesis adapter on an AgentCore Runtime. Powers Quick Start
  # generation and the Test Studio "Generate Synthetic Data" button.
  - path: feature-platform/idp-data-generator
  # Test Set - ConfBench: on-demand ingest of the amazon/ConfBench benchmark
  # (75 FCC invoices x up to 21 Augraphy noise variants). Ships as an extension
  # rather than a main-stack deployer because the full set is 32.71 GB — an
  # admin picks a size tier or individual variants and starts a background job.
  # See docs/extensions/confbench-testset.md.
  - path: feature-platform/confbench-testset
