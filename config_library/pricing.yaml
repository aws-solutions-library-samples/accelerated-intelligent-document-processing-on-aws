  # ---------------------------------------------------------------------------
  # LambdaHook OCR providers (per-page) — see samples/lambda-hook-inference/
  # ---------------------------------------------------------------------------
  # Keys are `lambda_hook/<function-name>`, matching the metering key the Bedrock
  # client emits: `{context}/lambda_hook/{function-name}`. The function name is
  # used rather than the configured ARN because an ARN embeds an account id and a
  # region, so it could never be a shippable default (see
  # bedrock.client.lambda_hook_metering_name). A pricing config that still keys
  # these on the bare function name keeps working: `_get_unit_cost` walks the
  # `/`-delimited suffixes, so `GENAIIDP-mistral-ocr-hook` also resolves.
  #
  # Mistral OCR hosted API list price: $4 / 1,000 pages. "pages" comes from the
  # hook's usage.pages.
  - name: lambda_hook/GENAIIDP-mistral-ocr-hook
    units:
      - name: pages
        price: "0.004"

  # Cohere Parse hosted API list price: $1.50 / 1,000 pages.
  #
  # Source: the Parse announcement (https://cohere.com/blog/parse), verbatim —
  # "access Parse through the Cohere API for just $1.50 per 1,000 pages".
  # Note that https://cohere.com/pricing does NOT list a per-page rate for
  # Parse; it prices Model Vault by dedicated instance instead ($4.00/hr Medium,
  # $7.00/hr XL). So this default is right for the hosted-API hook, and anyone
  # self-hosting Parse on Model Vault or SageMaker should override it — their
  # cost is per instance-hour, not per page.
  - name: lambda_hook/GENAIIDP-cohere-parse-hook
    units:
      - name: pages
        price: "0.0015"

