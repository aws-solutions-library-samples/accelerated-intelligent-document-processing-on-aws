# =============================================================================
# Centralized Pricing Configuration
# =============================================================================
# This file contains pricing information for all AWS services used by the IDP
# solution. Pricing is maintained in a single location and loaded into the
# ConfigurationTable (Configuration=DefaultPricing) during deployment.
#
# Structure: Each entry has a 'name' (service/api) and 'units' (list of pricing units)
#
# IMPORTANT: These are estimated prices. Always verify current pricing at:
# - Bedrock: https://aws.amazon.com/bedrock/pricing/
# - Textract: https://aws.amazon.com/textract/pricing/
# - Lambda: https://aws.amazon.com/lambda/pricing/
#
# For private pricing agreements, update this file or use the UI Pricing editor.
#
# -----------------------------------------------------------------------------
# Long-context (":1m") entries carry the same rates as their base model
# -----------------------------------------------------------------------------
# ":1m" selects the 1M-token context window. It is a context-window opt-in, not
# a pricing tier: there is no price difference, so every ":1m" entry below holds
# exactly the rates of the entry it shadows.
#
# Verified against the AWS Price List bulk offer file for
# "AmazonBedrockFoundationModels" (version 20260911124410, published
# 2026-09-11, retrieved 2026-09-17), which is where Bedrock publishes per-model
# token rates for these six models, under serviceName
# "Claude <model> (Amazon Bedrock Edition)":
#   * Each of the six carries exactly ONE input-token rate per routing mode and
#     service tier — e.g. Sonnet 5 input $2.20/MTok regional, $2.00/MTok global;
#     Opus 4.7/4.8/5 $5.50 / $5.00 — matching the base entries below.
#   * Every price dimension in that file and in the "AmazonBedrock" offer file
#     spans StartingRange 0 to EndingRange Inf. There is not one token-volume
#     band on any model, so there is no threshold at which a rate changes.
#   * No Anthropic SKU in THAT file names a long context (see the next paragraph
#     for what changed when Haiku 5.5 launched).
# A long-context band IS expressible in the Bedrock price list — it appears as a
# distinct "-long-ctx" usage type (tokenType "input-tokens-long-ctx" and friends).
# openai.gpt-5.6-luna-mantle and openai.gpt-5.6-terra-mantle have one, and so does
# ONE Claude model: Claude Haiku 5.5, as of offer file version 20261008165109
# (published 2026-10-08, retrieved the same day). Its long-context rates are 5x the
# standard ones on every token type — $0.55/MTok input against $0.11, $2.75
# against $0.55 output, regional — and they start at 100,000 input tokens. The
# Haiku 5.5 entries below carry the STANDARD band only, so a cost report
# UNDER-REPORTS by 5x for any request above that; this is handled the way the
# GPT-6 Astra rows handle the same shape, and the note on those rows and on both
# models' model_config_limits.yaml entries spells out the options. The ":1m"
# discussion above does not apply to this model — it has no ":1m" id, because 1M
# is its default window, which is also why it is the one exception in the quoted
# sentence below.
#
# Anthropic says the same first-hand, and the parenthetical is load-bearing —
# quote it: "Claude 4.6 and later models (except Claude Haiku 5.5) ... include
# the full 1M token context window at standard pricing. (A 900k-token request is
# billed at the same per-token rate as a 9k-token request.)"
# (platform.claude.com/docs/en/about-claude/pricing#long-context-pricing,
# retrieved 2026-10-08). Every ":1m" entry here is a 4.6-or-later model: Sonnet
# 4.6, Sonnet 5, Opus 4.6, Opus 4.7, Opus 4.8 and Opus 5 — none of them is the
# exception, so the sentence supports every ":1m" rate below. Haiku 5.5 is the
# exception and has no ":1m" entry.
#
# These entries used to charge a flat 2x input / 1.5x output premium on every
# request. That premium was Anthropic's pricing for the earlier Sonnet 4 /
# Sonnet 4.5 1M-context beta and never applied to any model listed here; it
# inflated every reported cost on a ":1m" model, making a benchmark arm read
# $125.42 against $68.82 for the same work. See issue #899.
#
# Metering keys no longer carry the suffix at all (see metering_model_id in
# idp_common/bedrock/model_utils.py), so these entries exist for three other
# reasons and MUST NOT be deleted:
#   1. This file doubles as the list of model IDs configuration validation
#      accepts (idp_common.config.merge_utils._load_valid_bedrock_models), and a
#      model ID missing from it is a hard validation error, not a warning.
#   2. ":1m" still reaches a price lookup from the raw configured model ID: the
#      Athena data-mart rollups build the key from the CloudWatch "Model"
#      dimension (src/lambda/data_mart_rollup/index.py), as does the
#      PII-anonymizer hook's token tracker.
#   3. Metering records written before the key changed still carry ":1m" and
#      must keep resolving to an exact price.
#
# -----------------------------------------------------------------------------
# Before adding or editing an entry: the coverage rules live in a test, not here
# -----------------------------------------------------------------------------
# `lib/idp_common_pkg/tests/unit/reporting/test_pricing_lookup.py` enumerates every
# model id a deployment can select — from template.yaml's parameter enums and the
# shipped configurations — and requires each to have an exact entry here pricing all
# four token units. An entry may omit the two cache units only via that module's
# `_NO_CACHE_UNITS_EXPECTED` allowlist, which records the reason per model AND
# asserts the condition that makes the reason true: the model must be absent from
# `bedrock.client.CACHEPOINT_SUPPORTED_MODELS` and not an implicit cacher, so a
# cache-read token can never be metered for it and there is no rate to miss.
#
# ⚠️ That enumeration is NOT the set of entries in this file, and the difference is
# why the guard below exists as well. This file doubles as the list of model ids
# configuration validation accepts (reason 1 above), so an entry here is selectable
# by a custom config even when no template enum and no shipped preset names it —
# which was true of three of the eleven entries omitting cache units, and they were
# covered by nothing. `test_cache_unit_omission_basis.py` therefore derives its
# universe from THIS FILE: every `bedrock/` entry that omits a cache unit must
# record its basis, per entry and per unit, in
# `idp_common.metering_units.EXPECTED_CACHE_UNIT_OMISSIONS`. See issue #1206.
#
# Two consequences worth knowing before you edit a row:
#   * Do NOT copy cache rates from a regional profile onto a bare model id to
#     "fill a gap". The bare `amazon.nova-*-v1:0` entries are the GovCloud ids
#     (see template.yaml's model parameter descriptions); their omission of cache
#     units is a deliberate, asserted decision, not an oversight, and pricing them
#     from the commercial `us.` profiles would assert a GovCloud rate nobody has
#     verified. AWS's own published GovCloud rate, cited and dated, is the thing
#     to use if a rate is needed.
#   * A missing unit on an entry that DOES exist resolves to $0.00 only when a
#     declaration in `idp_common.metering_units` says that unit costs nothing;
#     otherwise it resolves to a NULL cost with a WARNING naming the entry (issues
#     #1212 and #1206). For the two cache units the declaration is per entry, so
#     omitting one from a NEW row reports rather than zeroes it. That is why a
#     basis has to show the unit is either unpriced by AWS or unreachable in code
#     rather than merely undocumented: an unpriced-but-reachable unit understates
#     spend silently. Historically the same gap resolved to the fresh-input price
#     instead, up to 10x too high, which is what put four published cost figures
#     out by an unknown factor (issues #926 and #966).
# =============================================================================

pricing:
  # ---------------------------------------------------------------------------
  # Amazon Textract APIs
  # ---------------------------------------------------------------------------
  - name: textract/detect_document_text
    units:
      - name: pages
        price: "0.0015"
  
  - name: textract/analyze_document-Layout
    units:
      - name: pages
        price: "0.004"
  
  - name: textract/analyze_document-Signatures
    units:
      - name: pages
        price: "0.0035"
  
  - name: textract/analyze_document-Forms
    units:
      - name: pages
        price: "0.05"
  
  - name: textract/analyze_document-Tables
    units:
      - name: pages
        price: "0.015"
  
  - name: textract/analyze_document-Tables+Forms
    units:
      - name: pages
        price: "0.065"

  # ---------------------------------------------------------------------------
  # Amazon Bedrock Data Automation (BDA) APIs
  # ---------------------------------------------------------------------------
  - name: bda/documents-custom
    units:
      - name: pages
        price: "0.04"
  
  - name: bda/documents-standard
    units:
      - name: pages
        price: "0.01"

  # NOT a chargeable BDA call. This key is a deliberate COUNTER: the BDA
  # process-results function emits `BDAProject/bda/documents-skip` = 1 document
  # when it skips BDA processing (patterns/unified/src/bda_processresults_function
  # /index.py). Nothing is invoked, so the real price is genuinely $0 — but the
  # row has to EXIST, because a missing pricing entry now records NULL and warns
  # that reported spend is incomplete (see save_reporting_data._get_unit_cost).
  # Stating the zero here keeps the intent in the data rather than special-casing
  # the counter in the warning code.
  - name: bda/documents-skip
    units:
      - name: documents
        price: "0.0"

  # ---------------------------------------------------------------------------
  # Amazon Bedrock Models - Amazon Nova (US)
  # ---------------------------------------------------------------------------
  #
  # ⚠️ Every Nova row in this file — us., eu. and global., Lite / Pro / 2-Lite and
  # the priority and flex tiers — prices cacheWriteInputTokens at "0.0", and that
  # is a reading of AWS's price list rather than a convention. Nova charges for
  # cache READS and not for the write that populates the cache, which is the
  # opposite of Claude (1.25x input) and the reason the two families must not
  # share a multiplier. Every cache-write dimension AWS publishes for a Nova model
  # is exactly $0.0000000000, in every region and in all three service tiers
  # (standard, flex, priority) — read from the public AmazonBedrock offer file,
  # which is the same source `bedrock_cache_dimension_digest.py` digests and where
  # Nova Lite, Nova Pro, Nova Micro and Nova 2.0 Lite each carry exactly ONE
  # distinct cache-write rate: zero. These rows used to charge the full input
  # rate.
  #
  # The rate is only half the fact, and the other half is what makes a zero
  # correct rather than merely cheap: `cacheWriteInputTokens` is DISJOINT from
  # `inputTokens` in Bedrock's Converse usage block, so a zero rate drops a charge
  # AWS does not make instead of discounting one it does. Measured on
  # us.amazon.nova-lite-v1:0, same content, nonce held fixed (see
  # tests/unit/reporting/test_nova_cache_write_pricing.py, which carries the usage
  # blocks as a fixture and prices them):
  #
  #   no cachePoint     inputTokens=39011                      totalTokens=39013
  #   cachePoint, cold  inputTokens=10    cacheWrite=39001     totalTokens=39013
  #   cachePoint, warm  inputTokens=10    cacheRead=39001      totalTokens=39013
  #
  # `inputTokens` falls to a 10-token residual and the 39,001 prefix tokens move
  # into the cache unit; totalTokens is invariant and equals the sum of the four
  # units in all three calls. So the units partition the prompt exactly, and the
  # over-report the old rate produced was cache-write volume x the input rate —
  # which is the entire input cost of the prefix, meaning a cold cached call was
  # reported at exactly what an uncached one would have cost and the write-side
  # saving of prompt caching did not appear in the cost report at all. Had the
  # units been INCLUSIVE the same entry would have been a double-count and the
  # remedy would have been in the metering rather than here; that is why this was
  # measured and not reasoned about.
  #
  # Priced at "0.0" rather than omitted and registered in
  # `idp_common.metering_units.EXPECTED_CACHE_UNIT_OMISSIONS`, deliberately. That
  # register answers "why does this entry OMIT a unit", and these entries do not
  # omit one — AWS publishes a dimension here, at zero, and an explicit rate
  # states that where `priced_by_aws=False` would flatten "published at $0.00"
  # and "no such dimension" into one flag. It is also the only option that reaches
  # the whole class: the register's price-list premise identifies a model by
  # matching the entry's own input and output rates against the committed digest,
  # the digest excludes the flex and priority variants on purpose, and 7 of these
  # 14 rows therefore have an empty candidate set and cannot be registered without
  # widening a shared gate's exemption. A zero rate reaches all 14 identically,
  # and `test_every_selectable_model_prices_all_four_token_units` wants all four
  # units present on a selectable model anyway.
  - name: bedrock/us.amazon.nova-lite-v1:0
    units:
      - name: inputTokens
        price: "6.0E-8"
      - name: outputTokens
        price: "2.4E-7"
      - name: cacheReadInputTokens
        price: "1.5E-8"
      - name: cacheWriteInputTokens
        price: "0.0"
  
  - name: bedrock/us.amazon.nova-pro-v1:0
    units:
      - name: inputTokens
        price: "8.0E-7"
      - name: outputTokens
        price: "3.2E-6"
      - name: cacheReadInputTokens
        price: "2.0E-7"
      - name: cacheWriteInputTokens
        price: "0.0"
  
  - name: bedrock/us.amazon.nova-2-lite-v1:0
    units:
      - name: inputTokens
        price: "3.0E-7"
      - name: outputTokens
        price: "2.5E-6"
      - name: cacheReadInputTokens
        price: "7.5E-8"
      - name: cacheWriteInputTokens
        price: "0.0"
  
  - name: bedrock/us.amazon.nova-2-lite-v1:0:priority
    units:
      - name: inputTokens
        price: "5.25E-7"
      - name: outputTokens
        price: "4.38E-6"
      - name: cacheReadInputTokens
        price: "1.31E-7"
      - name: cacheWriteInputTokens
        price: "0.0"
  
  - name: bedrock/us.amazon.nova-2-lite-v1:0:flex
    units:
      - name: inputTokens
        price: "1.5E-7"
      - name: outputTokens
        price: "1.25E-6"
      - name: cacheReadInputTokens
        price: "3.75E-8"
      - name: cacheWriteInputTokens
        price: "0.0"
  
  # Nova Premier reached end of life on 2026-09-14 and is no longer selectable
  # (removed from every model enum). This entry stays because pricing lookup is
  # retrospective: a cost report over documents processed while Premier WAS
  # selectable resolves the rate from this table by model id, so deleting the
  # entry would silently re-price historical runs at zero. Rates are frozen as
  # of the EOL date and will not change again.
  #
  # The cache-read rate is $0.625/MTok, a quarter of input, read from the
  # AmazonBedrock offer file version 20261010182242 (published 2026-10-10,
  # retrieved 2026-10-13) where it is identical in all three regions this model
  # was served from (us-east-1, us-east-2, us-west-2). It is here rather than
  # omitted for the retrospective reason above: an omitted unit is priced at
  # $0.00, so a stored metering row carrying cache reads on this model would
  # report as free against a rate AWS does publish.
  # There is no cacheWriteInputTokens rate because AWS publishes no standard-tier
  # cache-write dimension for this model at all; the flex and priority tiers,
  # which this project never invokes, publish one at exactly $0.0000000000.
  # That omission's basis is recorded per unit in
  # idp_common.metering_units.EXPECTED_CACHE_UNIT_OMISSIONS.
  - name: bedrock/us.amazon.nova-premier-v1:0
    units:
      - name: inputTokens
        price: "2.5E-6"
      - name: outputTokens
        price: "1.25E-5"
      - name: cacheReadInputTokens
        price: "6.25E-7"

  # ---------------------------------------------------------------------------
  # Amazon Bedrock Models - Anthropic Claude (US)
  # ---------------------------------------------------------------------------
  - name: bedrock/us.anthropic.claude-3-haiku-20240307-v1:0
    units:
      - name: inputTokens
        price: "2.5E-7"
      - name: outputTokens
        price: "1.25E-6"
  
  - name: bedrock/us.anthropic.claude-haiku-4-5-20251001-v1:0
    units:
      - name: inputTokens
        price: "1.1E-6"
      - name: outputTokens
        price: "5.5E-6"
      - name: cacheReadInputTokens
        price: "1.1E-7"
      - name: cacheWriteInputTokens
        price: "1.4E-6"

  # Claude Haiku 5.5 — exactly 10x cheaper per token than Haiku 4.5 above, which is
  # worth stating because the launch announcement says "around 75% less ... for most
  # tasks". Both are right and they measure different things: the per-token rate is
  # 90% lower, and the ~75% figure is a per-task estimate that absorbs this model's
  # reasoning tokens (it is the first Haiku with effort controls, default "medium").
  # Rates are the US regional / geo-CRIS band, matching every other "us." entry in
  # this file, read from the AWS price list offer file for
  # AmazonBedrockFoundationModels version 20261007183733 (retrieved 2026-10-08).
  # The 5m cache-write rate is 1.25x input exactly ($0.1375), not rounded as the
  # Haiku 4.5 entry above is. A 1-hour-TTL cache write is a separate, higher rate
  # ($0.22/MTok) that this file has no unit for on any model; IDP writes 5-minute
  # cache points only.
  #
  # LONG CONTEXT BAND NOT REPRESENTED — read before trusting a cost report.
  # Any request whose input exceeds 100,000 tokens is billed entirely at the long
  # band, 5x on every one of the five token types: $0.55 in / $2.75 out / $0.055
  # cache-read / $0.6875 cache-write (us., eu.), and $0.50 / $2.50 / $0.05 /
  # $0.625 (global.). The metering schema carries one price per unit per model ID
  # with no way to express a usage-dependent band, and model_config_limits.yaml
  # intentionally states the full 1M window, so costs for prompts above 100,000
  # are UNDER-REPORTED here by 5x. This is the same shape as the GPT-6 Astra rows
  # below and is handled the same way; the difference is the multiplier (5x on
  # everything, against Astra's 2x input / 1.5x output) and that Anthropic
  # publishes this threshold while AWS does not. The auto-sizers cross it by
  # DEFAULT: the agentic shard budget is 578,400 tokens and the summarization
  # budget 850,000. Two ways to remove the discrepancy if it matters for your
  # account: lower max_input_tokens in model_config_limits.yaml (read the warning
  # on that entry first — 100000 leaves a 2,000-token shard budget and makes
  # Advanced mode unusable), or edit these rows to the long-band rates, which
  # then over-reports every small request by 5x instead.
  - name: bedrock/us.anthropic.claude-haiku-5-5
    units:
      - name: inputTokens
        price: "1.1E-7"
      - name: outputTokens
        price: "5.5E-7"
      - name: cacheReadInputTokens
        price: "1.1E-8"
      - name: cacheWriteInputTokens
        price: "1.375E-7"

  # Claude 3.5 Sonnet v1. Selected by the shipped ocr-benchmark and docsplit
  # presets in config_library/, but it had no pricing entry, so the whole model
  # costed as $0.00 (no pricing key is a substring of this ID, so even the old
  # fuzzy lookup found nothing). Rates are those of the v2 row below — AWS prices
  # both 3.5 Sonnet versions identically at $3/$15 per million tokens.
  # This model has also reached end of life and is no longer selectable or
  # defaulted anywhere. The entry stays for the same reason as Nova Premier's
  # above: pricing lookup is retrospective, so deleting it would re-price
  # historical cost reports at zero.
  - name: bedrock/us.anthropic.claude-3-5-sonnet-20240620-v1:0
    units:
      - name: inputTokens
        price: "3.0E-6"
      - name: outputTokens
        price: "1.5E-5"
      - name: cacheReadInputTokens
        price: "3.0E-7"
      - name: cacheWriteInputTokens
        price: "3.75E-6"

  - name: bedrock/us.anthropic.claude-3-5-sonnet-20241022-v2:0
    units:
      - name: inputTokens
        price: "3.0E-6"
      - name: outputTokens
        price: "1.5E-5"
      - name: cacheReadInputTokens
        price: "3.0E-7"
      - name: cacheWriteInputTokens
        price: "3.75E-6"
  
  - name: bedrock/us.anthropic.claude-3-7-sonnet-20250219-v1:0
    units:
      - name: inputTokens
        price: "3.0E-6"
      - name: outputTokens
        price: "1.5E-5"
      - name: cacheReadInputTokens
        price: "3.0E-7"
      - name: cacheWriteInputTokens
        price: "3.75E-6"
  
  - name: bedrock/us.anthropic.claude-sonnet-4-20250514-v1:0
    units:
      - name: inputTokens
        price: "3.0E-6"
      - name: outputTokens
        price: "1.5E-5"
      - name: cacheReadInputTokens
        price: "3.0E-7"
      - name: cacheWriteInputTokens
        price: "3.75E-6"
  
  - name: bedrock/us.anthropic.claude-sonnet-4-5-20250929-v1:0
    units:
      - name: inputTokens
        price: "3.3E-6"
      - name: outputTokens
        price: "1.65E-5"
      - name: cacheReadInputTokens
        price: "3.3E-7"
      - name: cacheWriteInputTokens
        price: "4.125E-6"

  # GovCloud cross-region inference profile for the same underlying model as
  # bedrock/us.anthropic.claude-sonnet-4-5-20250929-v1:0 above.
  #
  # The rates below are the GovCloud band, which is higher than the commercial
  # one. AWS publishes it in the AmazonBedrockFoundationModels offer file —
  # version 20261012084008 (published 2026-10-12, retrieved 2026-10-13) — where
  # this model is priced identically in us-gov-west-1 and us-gov-east-1: $3.60
  # input, $18.00 output, $0.36 cache read and $4.50 five-minute cache write, all
  # per MTok. ⚠️ A GovCloud cost figure this deployment reported before issue
  # #1404 was 8.3% LOW on both token axes, because this row carried the
  # commercial $3.30 / $16.50 band, so GovCloud costs are not continuous across
  # that change. The reading is re-derivable with no credential:
  # tests/unit/reporting/bedrock_govcloud_rate_digest.py --refresh, and
  # test_govcloud_pricing_rates.py asserts every rate here against it.
  #
  # The cache units are priced even though a cachePoint is not expected to buy
  # anything here, and that combination is deliberate. Verified live against
  # us-gov-west-1 that cachePoint does not reduce input tokens through this
  # inference profile (a repeated identical prompt still reported
  # cacheReadInputTokens=0), and this id is absent from
  # bedrock.client.CACHEPOINT_SUPPORTED_MODELS, so no cachePoint is sent to it in
  # the first place and both counters should meter zero. A zero count costs
  # nothing whatever the rate is. What the rates buy is the other case: if the
  # profile ever does honour a cache point, the tokens are costed at the rate AWS
  # charges rather than reported as an unpriced NULL cost, which is what an
  # omitted unit on a row AWS prices resolves to (issues #1212 and #1206).
  #
  # Omitting a unit from an entry that otherwise exists resolves to $0.00 only
  # when a declaration in idp_common.metering_units says the unit costs nothing;
  # anything else is reported as a NULL cost. Before the GitHub issue #926 fix the
  # old substring lookup matched an absent "cacheReadInputTokens" against this
  # row's "inputTokens" price, so the omission bought a 10x cache-read rate rather
  # than the intended zero — hence the explicit units.
  #
  # No one-hour-TTL cache write rate, and it is not an omission: AWS publishes one
  # for this model in both GovCloud regions at $7.20/MTok, but a Converse cache
  # point carries "type" and has no TTL member, so a one-hour point cannot be
  # requested from this codebase — both construction sites build type="default".
  # Bedrock meters a write of either TTL into the same cacheWriteInputTokens
  # counter (the TTL breakdown comes back separately in usage.cacheDetails), so
  # the five-minute rate is the right one for the only write this code can
  # produce. test_govcloud_pricing_rates.py asserts that, at the construction
  # sites, so a one-hour point added later fails rather than silently under-
  # reporting its own writes by 37.5% ($4.50 charged against $7.20 published).
  - name: bedrock/us-gov.anthropic.claude-sonnet-4-5-20250929-v1:0
    units:
      - name: inputTokens
        price: "3.6E-6"
      - name: outputTokens
        price: "1.8E-5"
      - name: cacheReadInputTokens
        price: "3.6E-7"
      - name: cacheWriteInputTokens
        price: "4.5E-6"

  # GovCloud Nova models are invoked with bare model IDs (the us. cross-region
  # inference-profile prefix is invalid in GovCloud), so the us.-prefixed entries
  # above never match at cost-calc time: save_reporting_data._get_unit_cost
  # resolves by EXACT key, and "bedrock/amazon.nova-pro-v1:0" is a different key
  # from "bedrock/us.amazon.nova-pro-v1:0". Without these rows a bare GovCloud
  # Nova call would be reported as UNPRICED (NULL cost).
  #
  # The rates are therefore the GovCloud band, as on the us-gov Claude row above,
  # and GovCloud is 1.2x commercial on both Nova models. AWS publishes it in the
  # AmazonBedrock offer file version 20261010182242 (published 2026-10-10,
  # retrieved 2026-10-13): in us-gov-west-1, Nova Pro at $0.96/MTok input and
  # $3.84/MTok output, Nova Lite at $0.072 / $0.288. ⚠️ A GovCloud cost figure
  # this deployment reported before issue #1404 was 16.7% LOW on both token axes,
