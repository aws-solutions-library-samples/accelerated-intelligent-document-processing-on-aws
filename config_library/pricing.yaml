  # GovCloud cross-region inference profile for the same underlying model as
  # bedrock/us.anthropic.claude-sonnet-4-5-20250929-v1:0 above — no separate
  # GovCloud per-token pricing is published, so this mirrors the commercial
  # us. rate. No cacheReadInputTokens/cacheWriteInputTokens units: verified
  # live against us-gov-west-1 that cachePoint does not reduce input tokens
  # through this inference profile (repeated identical prompt still reports
  # cacheReadInputTokens=0), so GovCloud Claude calls should always be costed
  # as a full cache miss.
  - name: bedrock/us-gov.anthropic.claude-sonnet-4-5-20250929-v1:0
    units:
      - name: inputTokens
        price: "3.3E-6"
      - name: outputTokens
        price: "1.65E-5"

  # GovCloud Nova models are invoked with bare model IDs (the us. cross-region
  # inference-profile prefix is invalid in GovCloud), so the us.-prefixed
  # entries above never match at cost-calc time — the lookup in
  # save_reporting_data._get_unit_cost is substring-based and neither
  # "bedrock/amazon.nova-pro-v1:0" nor "bedrock/us.amazon.nova-pro-v1:0" is a
  # substring of the other, so a bare GovCloud Nova call would otherwise be
  # costed at $0.0. No separate GovCloud per-token pricing is published, so
  # these mirror the commercial us. rates. Cache units omitted for the same
  # reason as the us-gov Claude entry above (GovCloud caching unverified).
  - name: bedrock/amazon.nova-pro-v1:0
    units:
      - name: inputTokens
        price: "8.0E-7"
      - name: outputTokens
        price: "3.2E-6"

