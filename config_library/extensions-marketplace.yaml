#
# Closed-source extensions delivered via AWS Marketplace subscriptions.
#
# This file is the single source of truth for paid extensions: `idp-cli publish`
# merges it into the generated catalog.json, which is copied into each stack's
# ConfigurationBucket at deploy time. The host resolvers read that one object —
# they never list buckets.
#
# Counterpart for bundled OSS extensions: extensions-oss.yaml.
#
# ---------------------------------------------------------------------------
# licenseMode — which authority the HOST checks, per extension
# ---------------------------------------------------------------------------
#
# `none` | `simulated` | `marketplace-live`. **A missing licenseMode defaults to
# `marketplace-live`**, applied by `idp-cli publish` when it writes catalog.json.
#
# That default is deliberately the OPPOSITE of the extension-side default, which
# is `none`. The asymmetry is the point, because the two sides fail in different
# directions:
#
#   - On the EXTENSION side, an unrecognised or missing value must not lock a
#     paying customer out of something they bought, so it degrades to
#     serve-and-declare (`none`).
#   - On the HOST side, an unrecognised or missing value must not OVER-CLAIM
#     verification for a product listed in the *marketplace* catalog, so it
#     degrades to the strictest authority (`marketplace-live`).
#
# Please keep both defaults. The inconsistency is intentional; "fixing" it makes
# one of the two sides fail in the wrong direction.
#
# It is NOT inferred from `marketplaceListingUrl`, though every entry here has
# one. Inferring would break the simulator dev loop for paid extensions — the
# case this design exists to support, since a listed product still has to be
# developed against a simulator before release. It is also unsound on its own
# terms: the entry template below ships a placeholder
# `.../pp/REPLACE` listing URL, so presence tracks "somebody filled in the
# template", not "this listing is live". "Is this a paid extension" and "which
# authority must answer for it" are different questions.
#
# ---------------------------------------------------------------------------
# Schema 1.1 — per-region artifact mapping
# ---------------------------------------------------------------------------
#
# `regions` maps each supported AWS region to an EXPLICIT bucket + template key.
# The host looks the caller's region up in this map and fails closed when it is
# absent. It never derives a bucket name by concatenating a basename with the
# region, because S3 bucket names are global and guessable: a derived name in a
# region we don't publish to could resolve to a bucket somebody else owns, and
# the customer would be handed a CloudFormation template we did not write. That
# is a security property, not tidiness.
#
# Three regions rather than one because `sam package` bakes an absolute
# `s3://bucket/key` CodeUri into the published template, and a Lambda's code
# bucket must live in the function's own region. There is deliberately no
# region-agnostic template: a nested-stack launcher would have to hand-mirror
# the feature template's parameters, and CloudFormation refuses to update or
# delete a nested stack directly, which would break the host's
# `stacks/update/template` flow.
#
# `templateKey` is VERSION-FREE and must stay that way. The newest publish
# overwrites `template.yaml`; versioned artifacts (ui-bundle.js, manifest.json,
# sam-objects/, config preset) live under `<base>/<version>/`, and the feature
# stack self-locates them from the `FEATURE_VERSION` baked into its template at
# publish time. A version-bearing key would go stale the moment a customer ran a
# stack Update.
#
# `latestVersion` here is only a SEED / FALLBACK. The host reads
# `<base>/latest.json` at runtime for the "Update available" badge, so a new
# extension version reaches customers without re-releasing the accelerator.
# Keeping this field roughly current is still useful: it is what a stack sees
# when latest.json is unreachable.
#
# Legacy schema 1.0 fields (`sellerBucket` + `sellerBucketRegion` +
# top-level `templateKey`) are still accepted for one region and still honored
# by the host as a deprecated fallback. Prefer `regions`.

schemaVersion: "1.1"

features:
  - featureId: idp-auto-optimizer
    # "(Beta)" is deliberate and load-bearing: the AWS Marketplace listing ships a
    # beta EULA, so the name in the UI has to match what the customer agreed to.
    # NOTE: this value only wins for a NOT-YET-INSTALLED extension. Once
    # installed, the UI prefers the displayName the feature's own RegisterFeature
    # custom resource wrote — i.e. the `FeatureDisplayName` parameter default in
    # the closed-source repo's template.yaml. Both have to say "(Beta)" or the
    # label changes the moment the customer installs it.
    displayName: "Auto Optimizer (Beta)"
    description: "Autonomous configuration optimization: a Bedrock AgentCore agent
      iteratively tunes extraction/classification/OCR settings within a per-page
      cost budget."
    iconUrl: ""
    showInNav: true
    # AWS Marketplace SaaS product identity, from the seller Management Portal.
    #   productCode — used by the seller-side marketplace-entitlement
    #     GetEntitlements API. NOTE: that API is seller-side; called from a
    #     buyer account it returns HTTP 200 with an EMPTY Entitlements list
    #     rather than an error, so the host cannot fail closed on it. See
    #     productId below and docs/feature-platform.md.
    #   productId — the SaaS product entity id. This is what the buyer-side
    #     AWS Marketplace Agreement API (SearchAgreements) matches on via its
    #     `ResourceIdentifier` filter, which is how the host actually confirms
    #     a subscription from the customer's own account.
    productCode: "q0k0s3zuuga46hle6fecx547"
    productId: "prod-a5ee62vs2xa72"
    marketplaceListingUrl: "https://aws.amazon.com/marketplace/pp/prodview-44jb64lvdxr3y"
    # Which authority the HOST must confirm this extension's subscription against.
    # Per-extension, so one stack can check a listed product against real AWS
    # Marketplace while checking in-development extensions against a simulator.
    #   marketplace-live  buyer-side SearchAgreements against REAL AWS. Use for a
    #                     published listing. This is also the default when the
    #                     field is absent (see the header note).
    #   simulated         seller-side GetEntitlements against the stack's
    #                     marketplace-simulator. Use while developing — including
    #                     for a paid extension before release.
    #   none              check nothing.
    # Auto Optimizer is listed and published, so the only honest answer for it
    # comes from real AWS Marketplace.
    licenseMode: marketplace-live
    # Seed/fallback only — the live value comes from latest.json at runtime.
    # TO BE SUPPLIED: set to the first published Auto Optimizer version.
    latestVersion: "v0.1.0"
    # Published by the closed-source release tooling to the same public buckets
    # and regions as the host's own templates (scripts/aws-release.sh), but under
    # a separate `artifacts/genai-idp-mp/` prefix so neither release process can
    # overwrite the other's keys.
    #
    # These objects are public-read by necessity, not by preference: the
    # registered Quick Launch template URL is fetched by AWS Seller Ops during
    # listing review and by CloudFormation in an arbitrary buyer account, and the
    # Lambda code zips are fetched from the buyer's account at deploy time.
    # Presigning only ever covered the template, so it protected nothing. The
    # commercial gate is the Marketplace subscription plus the extension's own
    # runtime entitlement check — never artifact secrecy.
    regions:
      us-west-2:
        sellerBucket: aws-ml-blog-us-west-2
        templateKey: artifacts/genai-idp-mp/extensions/idp-auto-optimizer/template.yaml
      us-east-1:
        sellerBucket: aws-ml-blog-us-east-1
        templateKey: artifacts/genai-idp-mp/extensions/idp-auto-optimizer/template.yaml
      eu-central-1:
        sellerBucket: aws-ml-blog-eu-central-1
        templateKey: artifacts/genai-idp-mp/extensions/idp-auto-optimizer/template.yaml

  # Example shape for an additional paid extension:
  # - featureId: my-paid-extension
  #   displayName: "My Paid Extension"
  #   description: "One-line description shown in the nav and on the feature page."
  #   iconUrl: ""                                  # optional https URL
  #   docsUrl: ""                                  # optional; falls back to the listing URL
  #   showInNav: true                              # false = Browse catalog only
  #   productCode: "REPLACE_WITH_MARKETPLACE_PRODUCT_CODE"
  #   productId: "prod-REPLACE"
  #   marketplaceListingUrl: "https://aws.amazon.com/marketplace/pp/REPLACE"
  #   # none | simulated | marketplace-live. Omit for marketplace-live. Use
  #   # `simulated` while the listing is still in development.
  #   licenseMode: marketplace-live
  #   latestVersion: "1.0.0"
  #   regions:
  #     us-east-1:
  #       sellerBucket: my-seller-bucket-us-east-1
  #       templateKey: extensions/my-paid-extension/template.yaml
