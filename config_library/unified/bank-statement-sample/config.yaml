# All settings not explicitly defined here are inherited from system defaults.

use_bda: false

notes: "Bank statement sample settings. Set use_bda: true for BDA mode."

chat:
  # Chat-with-Document: inherits defaults from system base-chat.yaml.
  # Uncomment and set 'model:' here to override the default chat model
  # for documents processed with this configuration version.
  enabled: true

classes:
  - $schema: https://json-schema.org/draft/2020-12/schema
    $id: Bank Statement
    type: object
    x-aws-idp-document-type: Bank Statement
    description: Monthly bank account statement
    $defs:
      Transaction:
        type: object
        properties:
          Date:
            format: date
            # `format: date` means ISO-8601, so the description must ask for
            # ISO-8601. It used to ask for MM/DD/YYYY, which contradicted the
            # schema: with coercion on, unambiguous rows were rewritten to ISO
            # and ambiguous ones (day <= 12) were left alone, so a single column
            # ended up holding both conventions.
            description: Transaction date in ISO-8601 format (YYYY-MM-DD)
            x-aws-idp-confidence-threshold: "0.9"
            type: string
            x-aws-idp-evaluation-method: DATE
          Description:
            description: Transaction description or merchant name
            x-aws-idp-confidence-threshold: "0.7"
            type: string
            x-aws-idp-evaluation-method: SEMANTIC
          Amount:
            type: number
            description: >-
              Transaction amount (positive for deposits, negative for
              withdrawals)
            x-aws-idp-evaluation-method: NUMERIC_EXACT
        required:
          - Date
          - Description
          - Amount
      Account Holder Address:
        description: Complete address information for the account holder
        type: object
        properties:
          City:
            description: City name
            x-aws-idp-confidence-threshold: "0.9"
            type: string
            x-aws-idp-evaluation-method: FUZZY
          ZIP Code:
            pattern: \d{5,9}
            description: 5 or 9 digit postal code
            type: string
            x-aws-idp-evaluation-method: EXACT
          Street Name:
            description: Name of the street
            x-aws-idp-confidence-threshold: "0.8"
            type: string
            x-aws-idp-evaluation-method: FUZZY
          Street Number:
            description: House or building number
            x-aws-idp-confidence-threshold: "0.9"
            type: string
            x-aws-idp-evaluation-method: FUZZY
          State:
            type: string
            description: State abbreviation (e.g., CA, NY)
            x-aws-idp-evaluation-method: EXACT
        required:
          - Street Name
          - City
    # ------------------------------------------------------------------
    # Optional: declare named page sub-types this class can include, plus
    # which property each page contains. When `extraction.missing_field_handling.enabled`
    # is true (see bottom of file), properties whose declared source page
    # types are NOT detected in a section are treated as MISSING (omitted
    # or null'd) rather than left silently empty.
    # See docs/missing-page-handling.md for details.
    # ------------------------------------------------------------------
    # x-aws-idp-page-types:
    #   - name: AccountSummary
    #     description: First page with account holder + summary
    #     x-aws-idp-document-page-content-regex: "(?i)account summary|statement period"
    #   - name: TransactionsWorksheet
    #     description: Transactions ledger
    #     x-aws-idp-document-page-content-regex: "(?i)transactions? (history|detail)"
    properties:
      Account Holder Address:
        description: Complete address information for the account holder
        $ref: "#/$defs/Account Holder Address"
        # x-aws-idp-source-page-types: ["AccountSummary"]
      Transactions:
        description: List of all transactions in the statement period
        type: array
        x-aws-idp-list-item-description: Individual transaction record
        items:
          $ref: "#/$defs/Transaction"
        # x-aws-idp-source-page-types: ["TransactionsWorksheet"]
      Account Number:
        type: string
        description: Primary account identifier
        x-aws-idp-evaluation-method: EXACT
        # x-aws-idp-source-page-types: ["AccountSummary"]
      Statement Period:
        type: string
        description: Statement period (e.g., January 2024)
        x-aws-idp-evaluation-method: FUZZY
        # x-aws-idp-source-page-types: ["AccountSummary"]
    required:
      - Account Number

# ----------------------------------------------------------------------
# Optional: enable BLANK vs MISSING field handling. Off by default so
# behavior matches earlier versions. Uncomment AND uncomment the
# x-aws-idp-page-types / x-aws-idp-source-page-types stanzas above to
# activate.
# ----------------------------------------------------------------------
# extraction:
#   missing_field_handling:
#     enabled: true
#     representation: omit  # or "null_with_metadata"
rule_validation:
  enabled: false
