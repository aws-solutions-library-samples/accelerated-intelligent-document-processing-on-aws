# All settings not explicitly defined here are inherited from system defaults.

notes: Rule validation configuration for bank statement review

chat:
  # Chat-with-Document: inherits defaults from system base-chat.yaml.
  # Uncomment and set 'model:' here to override the default chat model
  # for documents processed with this configuration version.
  enabled: true

# The Bank-Statement class of the lending-package-sample preset, unchanged.
classes:
  - $schema: https://json-schema.org/draft/2020-12/schema
    $id: Bank-Statement
    type: object
    x-aws-idp-document-type: Bank-Statement
    description: >-
      A periodic financial document issued by banks detailing account activity,
      balances, and transactions over a specific time period.
    $defs:
      Address:
        type: object
        properties:
          City:
            type: string
            x-aws-idp-evaluation-method: EXACT
          Line1:
            type: string
            x-aws-idp-evaluation-method: EXACT
          State:
            type: string
            x-aws-idp-evaluation-method: EXACT
          ZipCode:
            type: string
            x-aws-idp-evaluation-method: EXACT
          Line2:
            type: string
            x-aws-idp-evaluation-method: EXACT
      account_summaryItem:
        type: object
        properties:
          summary_desc:
            type: string
            x-aws-idp-evaluation-method: EXACT
          summary_amount:
            type: string
            x-aws-idp-evaluation-method: NUMERIC_EXACT
      transaction_detail:
        type: object
        properties:
          date:
            type: string
            x-aws-idp-evaluation-method: DATE
          description:
            type: string
            x-aws-idp-evaluation-method: EXACT
          balance:
            type: string
            x-aws-idp-evaluation-method: NUMERIC_EXACT
          deposits:
            type: string
            x-aws-idp-evaluation-method: NUMERIC_EXACT
          withdrawals:
            type: string
            x-aws-idp-evaluation-method: NUMERIC_EXACT
    properties:
      bank_name:
        type: string
        x-aws-idp-evaluation-method: EXACT
      account_holder_name:
        type: string
        x-aws-idp-evaluation-method: EXACT
      account_holder_address:
        $ref: "#/$defs/Address"
        x-aws-idp-evaluation-method: EXACT
      account_number:
        type: string
        x-aws-idp-evaluation-method: EXACT
      account_type:
        type: string
        x-aws-idp-evaluation-method: EXACT
      statement_start_date:
        format: date
        type: string
        x-aws-idp-evaluation-method: DATE
      statement_end_date:
        format: date
        type: string
        x-aws-idp-evaluation-method: DATE
      account_summary:
        type: array
        items:
          $ref: "#/$defs/account_summaryItem"
        x-aws-idp-evaluation-method: LLM
      transaction_details:
        type: array
        items:
          $ref: "#/$defs/transaction_detail"
        x-aws-idp-evaluation-method: LLM

# The policy rules of samples/rule-validation/bank-statement-review-policy.pdf:
# one policy class per section of that policy, one rule per policy rule, each
# with the text the policy prints. scripts/generate_bank_statement_review_policy.py
# writes the policy, and its test fails when the two differ. Every policy class
# applies to a document whose name says it is a bank statement.
policy_classes:
  - $schema: https://json-schema.org/draft/2020-12/schema
    x-aws-idp-policy-type: statement_identity
    x-aws-idp-document-name-regex: "(?i).*bank[_ -]?statement.*"
    type: object
    rule_properties:
      institution_named:
        type: string
        description: >-
          The statement must name the financial institution that
          issued it. The rule fails when no institution name is
          printed on the statement.
      account_holder_named:
        type: string
        description: >-
          The statement must show the full name and the mailing
          address of the account holder. The rule fails when the name
          or the address is not printed on the statement.
      account_number_shown:
        type: string
        description: >-
          The statement must show an account number for every account
          it summarises. The rule fails when an account is listed
          without an account number.
    $id: statement_identity
  - $schema: https://json-schema.org/draft/2020-12/schema
    x-aws-idp-policy-type: statement_period
    x-aws-idp-document-name-regex: "(?i).*bank[_ -]?statement.*"
    type: object
    rule_properties:
      statement_date_shown:
        type: string
        description: >-
          The statement must show the date it was issued or the period
          it covers. The rule fails when the statement prints neither.
      balance_dates_in_order:
        type: string
        description: >-
          The date printed for the new balance of an account must be
          the same as or later than the date printed for its previous
          balance. The rule fails when the new balance is dated before
          the previous balance.
      transactions_within_period:
        type: string
        description: >-
          Every transaction listed on the statement must be dated
          within the period the statement covers and no later than the
          statement date. The rule fails when a transaction is dated
          outside that period.
    $id: statement_period
  - $schema: https://json-schema.org/draft/2020-12/schema
    x-aws-idp-policy-type: balance_reconciliation
    x-aws-idp-document-name-regex: "(?i).*bank[_ -]?statement.*"
    type: object
    rule_properties:
      new_balance_reconciles:
        type: string
        description: >-
          For each account, the new balance must equal the previous
          balance, minus checks and other withdrawals, plus deposits
          and credits, using the amounts printed in the account
          summary. The rule fails when the printed amounts do not add
          up to the printed new balance.
      summary_total_matches_accounts:
        type: string
        description: >-
          The total printed for a group of accounts in the summary of
          accounts must equal the sum of the balances of the accounts
          in that group. The rule fails when the total differs from
          that sum.
    $id: balance_reconciliation
  - $schema: https://json-schema.org/draft/2020-12/schema
    x-aws-idp-policy-type: transaction_review
    x-aws-idp-document-name-regex: "(?i).*bank[_ -]?statement.*"
    type: object
    rule_properties:
      transactions_in_date_order:
        type: string
        description: >-
          Transactions must be listed in date order, oldest first,
          within each account. The rule fails when a transaction is
          listed after a transaction with a later date.
      no_duplicate_transactions:
        type: string
        description: >-
          A transaction must be listed once. The rule fails when two
          listed transactions have the same date, description,
          reference number and amount.
      large_withdrawals_identified:
        type: string
        description: >-
          Every withdrawal of 10,000.00 or more must have a
          description that identifies the payee. The rule fails when
          such a withdrawal has no description, or a description that
          names no payee.
    $id: transaction_review

rule_validation:
  enabled: true
