# The two classes of the scenario invoices (samples/review-routing). A document
# whose name holds "routing-scenario" is a Scenario-Invoice by its name, so its
# class does not depend on a model. Every field carries a confidence threshold of
# 0, so a scenario invoice raises no confidence alert.
- $schema: https://json-schema.org/draft/2020-12/schema
  $id: Scenario-Invoice
  type: object
  x-aws-idp-document-type: Scenario-Invoice
  x-aws-idp-document-name-regex: (?i).*routing-scenario.*
  description: A synthetic one-page supplier invoice of the review routing scenarios. A document is of this
    class only when its file name contains routing-scenario; every other invoice is of the class Invoice.
  properties:
    Vendor:
      type: string
      description: The vendor name exactly as printed after the label Vendor. Do not expand, complete or correct
        it.
      x-aws-idp-confidence-threshold: '0.0'
    InvoiceNumber:
      type: string
      description: The invoice number printed after the label Invoice Number.
      x-aws-idp-confidence-threshold: '0.0'
    InvoiceType:
      type: string
      description: The invoice type exactly as printed after the label Invoice Type, either Standard or PO-backed.
      x-aws-idp-confidence-threshold: '0.0'
    PaymentTerms:
      type: string
      description: The payment terms printed after the label Payment Terms, for example Net 30. Output null if
        the invoice prints no payment terms.
      x-aws-idp-confidence-threshold: '0.0'
    GrossTotal:
      type: number
      description: The amount printed after the label Gross Total, as a number with no thousands separator.
      x-aws-idp-confidence-threshold: '0.0'
    Discount:
      type: number
      description: The amount printed after the label Discount, as a number with no thousands separator.
      x-aws-idp-confidence-threshold: '0.0'
    NetAmountDue:
      type: number
      description: The amount printed after the label Net Amount Due, as a number with no thousands separator.
        Output the printed amount even when it is not the gross total minus the discount.
      x-aws-idp-confidence-threshold: '0.0'
  required:
  - Vendor
  - InvoiceNumber
  - GrossTotal
# No sample holds a purchase order. The class exists so that a routing rule can
# test that a document has no section of it.
- $schema: https://json-schema.org/draft/2020-12/schema
  $id: Scenario-Purchase-Order
  type: object
  x-aws-idp-document-type: Scenario-Purchase-Order
  description: The purchase order that backs a PO-backed invoice of the review routing scenarios. No sample
    holds one, and no other kind of document is of this class.
  properties:
    PONumber:
      type: string
      description: The purchase order number printed after the label PO Number.
      x-aws-idp-confidence-threshold: '0.0'
policy_classes:
# The policy classes of the rule-validation preset, unchanged: the policy rules of
# samples/rule-validation/bank-statement-review-policy.pdf. They apply to a
# document whose name says it is a bank statement.
- $schema: https://json-schema.org/draft/2020-12/schema
  x-aws-idp-policy-type: statement_identity
  x-aws-idp-document-name-regex: (?i).*bank[_ -]?statement.*
  type: object
  rule_properties:
    institution_named:
      type: string
      description: The statement must name the financial institution that issued it. The rule fails when no
        institution name is printed on the statement.
    account_holder_named:
      type: string
      description: The statement must show the full name and the mailing address of the account holder. The rule
        fails when the name or the address is not printed on the statement.
    account_number_shown:
      type: string
      description: The statement must show an account number for every account it summarises. The rule fails when
        an account is listed without an account number.
  $id: statement_identity
- $schema: https://json-schema.org/draft/2020-12/schema
  x-aws-idp-policy-type: statement_period
  x-aws-idp-document-name-regex: (?i).*bank[_ -]?statement.*
  type: object
  rule_properties:
    statement_date_shown:
      type: string
      description: The statement must show the date it was issued or the period it covers. The rule fails when the
        statement prints neither.
    balance_dates_in_order:
      type: string
      description: The date printed for the new balance of an account must be the same as or later than the date
        printed for its previous balance. The rule fails when the new balance is dated before the
        previous balance.
    transactions_within_period:
      type: string
      description: Every transaction listed on the statement must be dated within the period the statement covers
        and no later than the statement date. The rule fails when a transaction is dated outside that
        period.
  $id: statement_period
- $schema: https://json-schema.org/draft/2020-12/schema
  x-aws-idp-policy-type: balance_reconciliation
  x-aws-idp-document-name-regex: (?i).*bank[_ -]?statement.*
  type: object
  rule_properties:
    new_balance_reconciles:
      type: string
      description: For each account, the new balance must equal the previous balance, minus checks and other
        withdrawals, plus deposits and credits, using the amounts printed in the account summary. The
        rule fails when the printed amounts do not add up to the printed new balance.
    summary_total_matches_accounts:
      type: string
      description: The total printed for a group of accounts in the summary of accounts must equal the sum of the
        balances of the accounts in that group. The rule fails when the total differs from that sum.
  $id: balance_reconciliation
- $schema: https://json-schema.org/draft/2020-12/schema
  x-aws-idp-policy-type: transaction_review
  x-aws-idp-document-name-regex: (?i).*bank[_ -]?statement.*
  type: object
  rule_properties:
    transactions_in_date_order:
      type: string
      description: Transactions must be listed in date order, oldest first, within each account. The rule fails
        when a transaction is listed after a transaction with a later date.
    no_duplicate_transactions:
      type: string
      description: A transaction must be listed once. The rule fails when two listed transactions have the same
        date, description, reference number and amount.
    large_withdrawals_identified:
      type: string
      description: Every withdrawal of 10,000.00 or more must have a description that identifies the payee. The
        rule fails when such a withdrawal has no description, or a description that names no payee.
  $id: transaction_review
# The one policy of the scenario invoices. Its name pattern matches those
# documents only, and the patterns above match none of them.
- $schema: https://json-schema.org/draft/2020-12/schema
  x-aws-idp-policy-type: scenario_invoice_checks
  x-aws-idp-document-name-regex: (?i).*routing-scenario.*
  type: object
  rule_properties:
    net_amount_matches:
      type: string
      description: The Net Amount Due printed on the invoice must equal its Gross Total minus its Discount. The
        rule fails when the three printed amounts do not satisfy Net Amount Due = Gross Total - Discount.
  $id: scenario_invoice_checks
