# All settings not explicitly defined here are inherited from system defaults.
#
# Review routing showcase. One routing table sends sample documents to review
# queues, and every routing rule carries the reason its reviewer reads.
#
# Four samples each reach a different queue: a lending package goes to Specialist,
# a bank statement to Compliance, a high-value invoice to Approvals and
# a W-2 to Default. Three synthetic invoices (samples/review-routing) carry one, two
# and three known problems, and each returns to review once for each problem that
# remains.
#
# The queues `specialist`, `compliance` and `approvals` must exist before this
# configuration is saved (Review Studio > Review Management > Create queue, or
# `idp-cli review-queues create`). See README.md in this directory and
# docs/review-routing.md.

use_bda: false

notes: "Review routing showcase for pipeline mode: routing rules that send documents to the Specialist, Compliance, Approvals and Default review queues, each with a reason for the reviewer, and three scenario invoices that return to review once for each remaining problem. Create the three queues before saving this configuration."

hitl:
  enabled: true                  # Review Routing is on: routing holds a document only while it is
  # A field with no threshold of its own raises a confidence alert under this value.
  # It is high so that the samples show confidence alerts among their review reasons.
  # No sample depends on one to reach its queue: a confidence score comes from a
  # model and differs between runs. The Invoice and Scenario-Invoice fields below
  # carry a threshold of 0 instead, so an invoice raises no alert and is in review
  # only because of what a routing rule reads in it.
  confidence_threshold: "0.99"

rule_validation:
  enabled: true                  # Two routing rules read the policy rule verdicts

routing:
  tables:
    - id: review-routing
      stage: after_policy_rule_validation
      hit_policy: FIRST
      engine: builtin
      rules:
        # A routing rule's reason is what the reviewer reads. A placeholder in
        # braces takes the document's value: {input}, {input:path},
        # {condition_N.value} (what the N-th condition compares with) and
        # {confidence_threshold}.
        #
        # The four scenario routing rules come first. They read the synthetic
        # invoices of samples/review-routing (class Scenario-Invoice), so no other
        # sample matches them. A document goes to review for the first routing rule
        # that matches, so a document with several problems returns to review once
        # for each problem that remains.
        #
        # The first two apply only before the first review: a reviewer can change
        # neither the classes of a document nor the page text a policy rule reads.
        - id: scenario-po-without-purchase-order
          label: PO-backed invoice with no purchase order
          enabled: true
          conditions:
            - input: reviewed
              path: ""
              aggregate: any
              test: "false"
            - input: field_value
              path: "Scenario-Invoice:InvoiceType"
              aggregate: any
              test: '"PO-backed"'
            - input: class_present              # True when a section has the class
              path: "Scenario-Purchase-Order"
              aggregate: any
              test: "false"                     # The document holds no purchase order
          actions:
            - type: review_queue
              queue: approvals
          reason: "This invoice is {field_value:Scenario-Invoice:InvoiceType}, but the document has no purchase order. Check the purchase order before you complete the review."
        - id: scenario-net-amount-check
          label: Net amount does not add up
          enabled: true
          conditions:
            - input: reviewed
              path: ""
              aggregate: any
              test: "false"
            - input: policy_rule_verdict        # The verdict of one policy rule
              path: "scenario_invoice_checks.net_amount_matches"
              aggregate: any
              test: '"fail"'
          actions:
            - type: review_queue
              queue: compliance
          reason: "The net amount due {field_value:Scenario-Invoice:NetAmountDue} is not the gross total {field_value:Scenario-Invoice:GrossTotal} minus the discount {field_value:Scenario-Invoice:Discount}. Correct the amount that is wrong."
        # The next two have no `reviewed` condition: they hold a document again
        # after a review, until the reviewer has corrected the value.
        - id: scenario-vendor-not-approved
          label: Vendor not on the approved list
          enabled: true
          conditions:
            - input: field_value
              path: "Scenario-Invoice:Vendor"
              aggregate: any
              test: 'not("AnyCompany Office Supplies", "Example Print Services")'
          actions:
            - type: review_queue
              queue: approvals
          reason: "Vendor {field_value:Scenario-Invoice:Vendor} is not on the approved vendor list ({condition_1.value}). Enter the vendor's registered name."
        - id: scenario-payment-terms-missing
          label: Payment terms missing
          enabled: true
          conditions:
            - input: class_present
              path: "Scenario-Invoice"
              aggregate: any
              test: "true"
            - input: field_value
              path: "Scenario-Invoice:PaymentTerms"
              aggregate: count                  # How many sections have a value
              test: "0"
          actions:
            - type: review_queue
              queue: default
          reason: "Invoice {field_value:Scenario-Invoice:InvoiceNumber} has no payment terms. Add the terms from the supplier agreement."
        # Each of the four showcase routing rules applies to a document that has not
        # been reviewed yet, as the built-in routing rules do: none of them sends a
        # completed review to a queue again.
        - id: specialist-bank-checks
          label: Packages with a bank check
          enabled: true
          conditions:
            - input: reviewed
              path: ""
              aggregate: any
              test: "false"
            - input: section_classes        # The class of every section of the document
              path: ""
              aggregate: any                # At least one section is a bank check
              test: '"Bank-checks"'
          actions:
            - type: review_queue
              queue: specialist
          reason: "Section classes: {section_classes}. Check the bank check against the application."
        - id: compliance-policy-failure
          label: Failed policy rules
          enabled: true
          conditions:
            - input: reviewed
              path: ""
              aggregate: any
              test: "false"
            - input: failed_policy_rule_count   # Policy rules whose verdict is fail
              path: ""
              aggregate: any
              test: "> 0"
          actions:
            - type: review_queue
              queue: compliance
          reason: "Failed policy rules: {failed_policy_rule_count}. Check each failed policy rule against the pages it cites."
        - id: approvals-high-value
          label: Invoices over 1000
          enabled: true
          conditions:
            - input: reviewed
              path: ""
              aggregate: any
              test: "false"
            - input: field_value
              path: "Invoice:GrossTotal"    # The gross total of an Invoice section
              aggregate: any
              test: "> 1000"
          actions:
            - type: review_queue
              queue: approvals
          reason: "The gross total {field_value:Invoice:GrossTotal} is over {condition_2.value}. Check the amount before the invoice is approved."
        - id: default-w2-forms
          label: W-2 forms
          enabled: true
          conditions:
            - input: reviewed
              path: ""
              aggregate: any
              test: "false"
            - input: section_classes
              path: ""
              aggregate: any                # At least one section is a W-2
              test: '"W2"'
          actions:
            - type: review_queue
              queue: default                  # A routing rule can name the Default queue too
          reason: "Section classes: {section_classes}. Check the wages and the tax withheld on the W-2."
        # The three built-in routing rules, as in the system defaults.
        - id: builtin-extraction-failed
          label: Failed extractions
          enabled: true
          conditions:
            - input: reviewed
              path: ""
              aggregate: any
              test: "false"
            - input: extraction_failed_count
              path: ""
              aggregate: any
              test: "> 0"
          actions:
            - type: review_queue
              queue: default
          reason: "Sections whose extraction failed: {extraction_failed_count}. They have no extracted values: enter them from the document."
        - id: builtin-confidence-alerts
          label: Confidence alerts
          enabled: true
          conditions:
            - input: reviewed
              path: ""
              aggregate: any
              test: "false"
            - input: confidence_alert_count
              path: ""
              aggregate: any
              test: "> 0"
          actions:
            - type: review_queue
              queue: default
          reason: "Fields below the confidence threshold: {confidence_alert_count}. Check the highlighted fields and correct them."
        - id: builtin-missing-required
          label: Missing required fields
          enabled: true
          conditions:
            - input: reviewed
              path: ""
              aggregate: any
              test: "false"
            - input: route_missing_required_fields
              path: ""
              aggregate: any
              test: "true"
            - input: missing_required_field_count
              path: ""
              aggregate: any
              test: "> 0"
          actions:
            - type: review_queue
              queue: default
          reason: "Required fields with no value: {missing_required_field_count}. Fill them in from the document."
      default_outcome:              # A document no routing rule matches is not reviewed
        actions: []
  max_consecutive_placements: 3

classes:
- $schema: https://json-schema.org/draft/2020-12/schema
  $defs:
    LineItem:
      type: object
      properties:
        LineItemRate:
          description: Rate for the line item. Output null if not shown.
          x-aws-idp-confidence-threshold: '0.0'
          x-aws-idp-evaluation-method: NUMERIC_EXACT
          type: number
        LineItemDays:
          description: Days of the week as shown in the line item. Output null if not shown.
          x-aws-idp-confidence-threshold: '0.0'
          x-aws-idp-evaluation-method: LEVENSHTEIN
          x-aws-idp-evaluation-threshold: '0.7'
          type: string
        LineItemStartDate:
          description: Start date for the line item, formatted as MM/DD/YY (2-digit year, e.g. 10/22/16). Output
            null if not shown.
          x-aws-idp-confidence-threshold: '0.0'
          x-aws-idp-evaluation-method: DATE
          x-aws-idp-evaluation-threshold: '0.7'
          type: string
        LineItemEndDate:
          description: End date for the line item, formatted as MM/DD/YY (2-digit year, e.g. 10/22/16). Output null
            if not shown.
          x-aws-idp-confidence-threshold: '0.0'
          x-aws-idp-evaluation-method: DATE
          x-aws-idp-evaluation-threshold: '0.7'
          type: string
        LineItemDescription:
          description: Description of the line item. Output null if not shown.
          x-aws-idp-evaluation-method: LEVENSHTEIN
          x-aws-idp-evaluation-threshold: '0.7'
          type: string
          x-aws-idp-confidence-threshold: '0.0'
  description: Invoice document
  type: object
  x-aws-idp-document-type: Invoice
  properties:
    Agency:
      description: The agency the invoice is addressed to
      x-aws-idp-confidence-threshold: '0.0'
      x-aws-idp-evaluation-weight: '2'
      x-aws-idp-evaluation-method: LEVENSHTEIN
      x-aws-idp-evaluation-threshold: '0.7'
      type: string
    Advertiser:
      description: The name of the advertiser
      x-aws-idp-confidence-threshold: '0.0'
      x-aws-idp-evaluation-weight: '2'
      x-aws-idp-evaluation-method: FUZZY
      x-aws-idp-evaluation-threshold: '0.8'
      type: string
    GrossTotal:
      description: The gross total amount. Output null if not shown.
      x-aws-idp-evaluation-weight: '2'
      x-aws-idp-confidence-threshold: '0.0'
      x-aws-idp-evaluation-method: NUMERIC_EXACT
      type: number
    PaymentTerms:
      description: Terms of payment. Output null if not shown.
      x-aws-idp-evaluation-weight: '0.2'
      x-aws-idp-evaluation-method: FUZZY
      x-aws-idp-evaluation-threshold: '0.7'
      type: string
      x-aws-idp-confidence-threshold: '0.0'
    AgencyCommission:
      description: The agency commission amount. Output null if not shown.
      x-aws-idp-evaluation-weight: '0.2'
      x-aws-idp-confidence-threshold: '0.0'
      x-aws-idp-evaluation-method: NUMERIC_EXACT
      type: number
    NetAmountDue:
      description: The net amount due after commission. Output null if not shown.
      x-aws-idp-evaluation-weight: '2'
      x-aws-idp-confidence-threshold: '0.0'
      x-aws-idp-evaluation-method: NUMERIC_EXACT
      type: number
    LineItems:
      type: array
      description: List of line item details on the invoice; each item has several possible elements
      items:
        $ref: '#/$defs/LineItem'
  required:
  - Agency
  - Advertiser
  - LineItems
  $id: Invoice
- $schema: https://json-schema.org/draft/2020-12/schema
  $id: Payslip
  type: object
  x-aws-idp-document-type: Payslip
  description: An employee wage statement showing earnings, deductions, taxes, and net pay for a specific pay period,
    typically issued by employers to document compensation details including gross pay, various tax withholdings,
    and year-to-date totals.
  $defs:
    Address:
      type: object
      description: The complete business address of the employing company, including street address, city, state,
        and postal code information.
      properties:
        City:
          type: string
          description: The city portion of the company's business address.
          x-aws-idp-evaluation-method: EXACT
        Line1:
          type: string
          description: The primary street address line of the company's business location.
          x-aws-idp-evaluation-method: EXACT
        State:
          type: string
          description: The state or province portion of the company's business address.
          x-aws-idp-evaluation-method: EXACT
        ZipCode:
          type: string
          description: The postal code portion of the company's business address.
          x-aws-idp-evaluation-method: EXACT
        Line2:
          type: string
          description: The secondary address line for the company, such as suite or floor number.
          x-aws-idp-evaluation-method: EXACT
    EmployeeName:
      type: object
      description: The complete name information of the employee, including first name, middle name, last name,
        and any suffix.
      properties:
        SuffixName:
          type: string
          description: Name suffix such as Jr., Sr., III, etc.
          x-aws-idp-evaluation-method: EXACT
        LastName:
          type: string
          description: The family name or surname of the employee.
          x-aws-idp-evaluation-method: EXACT
        MiddleName:
          type: string
          description: The middle name or initial of the employee.
          x-aws-idp-evaluation-method: EXACT
        FirstName:
          type: string
          description: The given name of the employee.
          x-aws-idp-evaluation-method: EXACT
    TaxInfo:
      type: object
      properties:
        YTD:
          type: string
          description: Year-to-date amount for this federal tax item.
          x-aws-idp-evaluation-method: NUMERIC_EXACT
        Period:
          type: string
          description: Current period amount for this federal tax item.
          x-aws-idp-evaluation-method: NUMERIC_EXACT
        ItemDescription:
          type: string
          description: Description of the specific federal tax type or category.
          x-aws-idp-evaluation-method: EXACT
  properties:
    PayDate:
      format: date
      description: The actual date when the employee was paid.
      type: string
      x-aws-idp-evaluation-method: DATE
    PayPeriodStartDate:
      format: date
      description: The beginning date of the pay period covered by this payslip.
      type: string
      x-aws-idp-evaluation-method: DATE
    PayPeriodEndDate:
      format: date
      description: The ending date of the pay period covered by this payslip.
      type: string
      x-aws-idp-evaluation-method: DATE
    CurrentGrossPay:
      type: number
      description: The total earnings before any deductions for the current pay period.
      x-aws-idp-evaluation-method: NUMERIC_EXACT
    CurrentNetPay:
      type: number
      description: The take-home pay after all deductions for the current pay period.
      x-aws-idp-evaluation-method: NUMERIC_EXACT
    YTDGrossPay:
      type: number
      description: Year-to-date gross pay representing cumulative earnings before deductions.
      x-aws-idp-evaluation-method: NUMERIC_EXACT
    YTDNetPay:
      type: number
      description: Year-to-date net pay amount representing cumulative take-home earnings.
      x-aws-idp-evaluation-method: NUMERIC_EXACT
    CurrentTotalDeductions:
      type: number
      description: Total amount deducted from gross pay for the current period.
      x-aws-idp-evaluation-method: NUMERIC_EXACT
    YTDTotalDeductions:
      type: number
      description: Year-to-date total deductions representing cumulative amounts withheld.
      x-aws-idp-evaluation-method: NUMERIC_EXACT
    EmployeeName:
      description: The complete name information of the employee.
      $ref: '#/$defs/EmployeeName'
      x-aws-idp-evaluation-method: LLM
    EmployeeNumber:
      type: string
      description: 'The employer''s unique identifier for the employee. Also labelled ''Employee No.'', ''Emp #'',
        ''Employee ID'' or ''File No.''. On ADP-style earnings statements the header row reads ''CO. FILE DEPT.
        CLOCK NUMBER'' and the employee number is the value in the FILE column (the second of the five codes) -
        not the CLOCK value (the employee''s clock/badge number) and not the NUMBER value (the check or advice number).'
      x-aws-idp-evaluation-method: EXACT
    EmployeeAddress:
      description: The complete residential address of the employee.
      $ref: '#/$defs/Address'
      x-aws-idp-evaluation-method: LLM
    CompanyAddress:
      description: The complete business address of the employing company.
      $ref: '#/$defs/Address'
      x-aws-idp-evaluation-method: LLM
    FederalTaxes:
      description: List of federal tax withholdings.
      type: array
      x-aws-idp-list-item-description: Each item represents a specific federal tax withholding category
      items:
        $ref: '#/$defs/TaxInfo'
      x-aws-idp-evaluation-method: LLM
    StateTaxes:
      description: List of state tax withholdings.
      type: array
      x-aws-idp-list-item-description: Each item represents a specific state tax withholding category
      items:
        $ref: '#/$defs/TaxInfo'
      x-aws-idp-evaluation-method: LLM
    CityTaxes:
      description: List of city or local tax withholdings.
      type: array
      x-aws-idp-list-item-description: Each item represents a specific city or local tax withholding
      items:
        $ref: '#/$defs/TaxInfo'
      x-aws-idp-evaluation-method: LLM
    FederalFilingStatus:
      type: string
      description: The employee's federal tax filing status for withholding purposes.
      x-aws-idp-evaluation-method: EXACT
    StateFilingStatus:
      type: string
      description: The employee's state tax filing status for withholding purposes.
      x-aws-idp-evaluation-method: EXACT
    RegularHourlyRate:
      type: number
      description: The standard hourly wage rate for regular working hours.
      x-aws-idp-evaluation-method: NUMERIC_EXACT
    HolidayHourlyRate:
      type: number
      description: The hourly wage rate for holiday work.
      x-aws-idp-evaluation-method: NUMERIC_EXACT
    PayrollNumber:
      type: string
      description: The payroll check, advice or voucher number that identifies this specific payment. Also labelled
        'Check No.', 'Advice No.', 'Voucher No.' or 'Payroll No.'. On ADP-style earnings statements it is the value
        in the NUMBER column (the fifth of the five codes in the 'CO. FILE DEPT. CLOCK NUMBER' header row), typically
        zero-padded.
      x-aws-idp-evaluation-method: EXACT
    currency:
      type: string
      description: The currency in which all monetary amounts are denominated.
      x-aws-idp-evaluation-method: EXACT
  required:
  - PayDate
  - CurrentGrossPay
  - YTDGrossPay
  - CurrentNetPay
- $schema: https://json-schema.org/draft/2020-12/schema
