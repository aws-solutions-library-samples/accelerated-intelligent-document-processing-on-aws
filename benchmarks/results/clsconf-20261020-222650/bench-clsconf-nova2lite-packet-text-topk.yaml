  top_k: '5'
  system_prompt: You are a document assistant. Respond only with JSON. Never make
    up data, only provide data found in the document being provided.
  task_prompt: "<background> You are an expert in document analysis and information\
    \ extraction.  You can understand and extract key information from documents classified\
    \ as type: \n{DOCUMENT_CLASS}. </background>\n<task> Your task is to take the\
    \ unstructured text provided and convert it into a well-organized table format\
    \ using JSON. Identify the main entities, attributes, or categories mentioned\
    \ in the attributes list below and use them as keys in the JSON object.  Then,\
    \ extract the relevant information from the text and populate the corresponding\
    \ values in the JSON object. </task>\n<extraction-guidelines> Guidelines:\n  \
    \  1. Ensure that the data is accurately represented and properly formatted within\n\
    \    the JSON structure\n    2. Include double quotes around all keys and values\n\
    \    3. Do not make up data - only extract information explicitly found in the\n\
    \    document\n    4. Do not use /n for new lines, use a space instead\n    5.\
    \ If a field is not found or if unsure, return null\n    6. Format each value\
    \ as directed by that attribute's description/format in the\n    attributes section\
    \ below. If an attribute specifies a date or number format,\n    follow it EXACTLY;\
    \ only if no format is specified, preserve the value as it\n    appears in the\
    \ document.\n    7. Do not perform calculations or summations unless totals are\
    \ explicitly given\n    8. If an alias is not found in the document, return null\n\
    \    9. Guidelines for checkboxes:\n     9.A. CAREFULLY examine each checkbox,\
    \ radio button, and selection field:\n        - Look for marks like \u2713, \u2717\
    , x, filled circles (\u25CF), darkened areas, or handwritten checks indicating\
    \ selection\n        - For checkboxes and multi-select fields, ONLY INCLUDE options\
    \ that show clear visual evidence of selection\n        - DO NOT list options\
    \ that have no visible selection mark\n     9.B. For ambiguous or overlapping\
    \ tick marks:\n        - If a mark overlaps between two or more checkboxes, determine\
    \ which option contains the majority of the mark\n        - Consider a checkbox\
    \ selected if the mark is primarily inside the check box or over the option text\n\
    \        - When a mark touches multiple options, analyze which option was most\
    \ likely intended based on position and density. For handwritten checks, the mark\
    \ typically flows from the selected checkbox outward.\n        - Carefully analyze\
    \ visual cues and contextual hints. Think from a human perspective, anticipate\
    \ natural tendencies, and apply thoughtful reasoning to make the best possible\
    \ judgment.\n    10. Think step by step first and then answer.\n</extraction-guidelines>\n\
    If the attributes section below contains a list of attribute names and descriptions,\
    \ then output only those attributes, using the provided descriptions as guidance\
    \ for finding the correct values. \n<attributes> {ATTRIBUTE_NAMES_AND_DESCRIPTIONS}\
    \ </attributes>\n<few-shot-examples> {FEW_SHOT_EXAMPLES} </few-shot-examples>\n\
    <<CACHEPOINT>>\n<document-text> {DOCUMENT_TEXT} </document-text>\n<document_image>\
    \ {DOCUMENT_IMAGE} </document_image>\n<final-instructions> Extract key information\
    \ from the document and return a JSON object with the following key steps: 1.\
    \ Carefully analyze the document text to identify the requested attributes 2.\
    \ Extract only information explicitly found in the document - never make up data\
    \ 3. Format each value as directed by its attribute description/format (follow\
    \ any specified date/number format EXACTLY; otherwise keep the document's rendering);\
    \ replace newlines with spaces 4. For checkboxes, only include options with clear\
    \ visual selection marks 5. Use null for any fields not found in the document\
    \ 6. Ensure the output is properly formatted JSON with quoted keys and values\
    \ 7. Think step by step before finalizing your answer </final-instructions>"
  task_prompt_extraction_with_confidence: "<background> You are an expert in document\
    \ analysis and information extraction. You extract key information from documents\
    \ classified as type: {DOCUMENT_CLASS}, and you also report your confidence in\
    \ each extracted value. </background>\n<task> Convert the unstructured document\
    \ into a well-organized JSON object using the attribute names below as keys, extracting\
    \ the relevant values. Then record your confidence in each extracted value. </task>\n\
    <extraction-guidelines> 1. Include double quotes around all keys and values 2.\
    \ Do not make up data - only extract information explicitly found in the document\
    \ 3. Use a space instead of newlines 4. If a field is not found or you are unsure,\
    \ return null 5. Format each value as directed by that attribute's description/format\
    \ below.\n   If an attribute specifies a date or number format, follow it EXACTLY;\
    \ only if\n   no format is specified, preserve the value as it appears in the\
    \ document.\n6. Do not perform calculations unless totals are explicitly given\
    \ 7. Carefully examine checkboxes/selection fields; only include options with\
    \ clear\n   visual selection marks\n8. Think step by step first, then answer </extraction-guidelines>\n\
    <attributes> {ATTRIBUTE_NAMES_AND_DESCRIPTIONS} </attributes>\n<few-shot-examples>\
    \ {FEW_SHOT_EXAMPLES} </few-shot-examples>\n<confidence-assessment> Record your\
    \ confidence in EVERY extracted value, mirroring the extraction structure EXACTLY\
    \ so there is one confidence entry per individual value. OUTPUT RULE (keep responses\
    \ compact): include \"confidence_reason\" for a leaf ONLY when its confidence\
    \ is below 0.9. For confidence >= 0.9, emit just {\"confidence\": <score>} with\
    \ NO confidence_reason. When you do include one, keep it to at most 12 words and\
    \ do not restate the extracted value. - Scalar field: {\"confidence\": <0.0-1.0>}\
    \ (add \"confidence_reason\" only if < 0.9). - Group (nested object) field: an\
    \ object with the SAME sub-keys as the value,\n  each mapping to its own {\"confidence\"\
    : ...} leaf (add \"confidence_reason\" if < 0.9).\n- List field (e.g. a table):\
    \ a LIST with ONE object per extracted row, in the\n  SAME ORDER as the rows.\
    \ Each row object MUST mirror that row's structure \u2014\n  i.e. the SAME column\
    \ keys as the extracted row, and EACH column maps to its\n  own {\"confidence\"\
    : ...} leaf (add \"confidence_reason\" only if < 0.9). Do NOT\n  emit a single\
    \ confidence for a whole row; score each cell. Nested lists follow\n  the same\
    \ rule recursively. Provide an entry for EVERY row and EVERY column \u2014\n \
    \ do not summarize or skip.\n  Example \u2014 extracted row {\"date\": \"...\"\
    , \"amount\": \"...\"} ->\n    {\"date\": {\"confidence\": 0.98},\n     \"amount\"\
    : {\"confidence\": 0.72, \"confidence_reason\": \"figure partly illegible\"}}\n\
    confidence = your calibrated certainty the value matches the source document (1.0\
    \ = certain, lower = ambiguous/illegible/inferred). HOW TO REPORT IT: - If an\
    \ extraction_with_confidence or provide_field_assessment TOOL is available\n \
    \ to you, use it: pass the extracted values and this field_assessment together\
    \ in\n  that ONE tool call. If you extracted in multiple steps (e.g. adding rows\
    \ via\n  patches), call it once at the very end so every row is assessed.\n- Otherwise\
    \ (no such tool), return ONE JSON object with EXACTLY two top-level\n  keys: \"\
    extraction\" (the extracted values object described above) and\n  \"confidence\"\
    \ (the parallel confidence structure). Do NOT wrap it in any other\n  key and\
    \ do NOT add a \"field_assessment\" key. Shape:\n    {\"extraction\": { ...extracted\
    \ values... },\n     \"confidence\":  { ...one confidence leaf per value, mirroring\
    \ structure... }}\nDo NOT include bounding boxes unless explicitly instructed\
    \ below \u2014 field locations are derived automatically from OCR. </confidence-assessment>\n\
    <<CACHEPOINT>>\n<document-text> {DOCUMENT_TEXT} </document-text>\n<document_image>\
    \ {DOCUMENT_IMAGE} </document_image>"
  task_prompt_extraction_with_confidence_topk: "<background> You are an expert in\
    \ document analysis and information extraction. You can understand and extract\
    \ key information from documents classified as type: {DOCUMENT_CLASS}. </background>\
    \ <task> Provide your 4 best guesses and the probability that each is correct\
    \ (0.0 to 1.0) for each attribute listed below. Give ONLY the guesses and probabilities,\
    \ no other words or explanation.</task> <extraction-guidelines> Guidelines:\n\
    \ 1. Only consider values that are present in the provided document. Do not invent\
    \ attribute values.\n 2. Extract each entity candidate exactly how it is presented\
    \ in the document. E.g. do not change \"M\" to \"Monday\"\n or change the date\
    \ from \"01/04\" to \"1/04\".\n 3. Format each value as directed by that attribute's\
    \ description/format below.\n   If an attribute specifies a date or number format,\
    \ follow it EXACTLY; only if\n   no format is specified, preserve the value as\
    \ it appears in the document.\n 4. For each extracted attribute key, the value\
    \ MUST be a nested object formatted\n exactly like this:\n        {\n        \
    \  \"G1\": \"<1st most likely guess, copied EXACTLY as it appears in the document>\"\
    ,\n          \"P1\": <probability between 0.0 and 1.0>,\n          \"G2\": \"\
    <2nd most likely guess>\",\n          \"P2\": <probability between 0.0 and 1.0>,\n\
    \          \"G3\": \"<3rd most likely guess>\",\n          \"P3\": <probability\
    \ between 0.0 and 1.0>,\n          \"G4\": \"<4th most likely guess>\",\n    \
    \      \"P4\": <probability between 0.0 and 1.0>\n        }\n</extraction-guidelines>\
    \ If the attributes section below contains a list of attribute names and descriptions,\
    \ then output only those attributes, using the provided descriptions as guidance\
    \ for finding the correct values. <attributes> {ATTRIBUTE_NAMES_AND_DESCRIPTIONS}\
    \ </attributes> <few-shot-examples> {FEW_SHOT_EXAMPLES} </few-shot-examples> <<CACHEPOINT>>\
    \ <document_image> {DOCUMENT_IMAGE} </document_image> <document-text> {DOCUMENT_TEXT}\
    \ </document-text> <output-format> Give ONLY the JSON object containing the guesses\
    \ and probabilities. Do not think step-by-step, do not show your work, and do\
    \ not provide any reasoning, justifications, or extra commentary whatsoever.\n\
    For SIMPLE attributes: {\n  \"simple_attribute_name\": {\n    \"G1\": \"<1st most\
    \ likely guess, copied EXACTLY as it appears in the document>\",\n    \"P1\":\
    \ <probability between 0.0 and 1.0>,\n    \"G2\": \"<2nd most likely guess>\"\
    ,\n    \"P2\": <probability between 0.0 and 1.0>,\n    \"G3\": \"<3rd most likely\
    \ guess>\",\n    \"P3\": <probability between 0.0 and 1.0>,\n    \"G4\": \"<4th\
    \ most likely guess>\",\n    \"P4\": <probability between 0.0 and 1.0>\n  }\n\
    }\nFor LIST attributes, give G1/P1 ONLY (a single guess per cell) and include\
    \ EVERY row that appears in the document. Completeness of the list matters more\
    \ than alternative guesses, and extra guesses per cell multiply the output length\
    \ by the number of rows: {\n  \"list_attribute_name\": [\n    {\n      \"item_attribute_1\"\
    : { \"G1\": \"<guess, copied EXACTLY as it appears in the document>\", \"P1\"\
    : <probability between 0.0 and 1.0> },\n      \"item_attribute_2\": { \"G1\":\
    \ \"<guess, copied EXACTLY as it appears in the document>\", \"P1\": <probability\
    \ between 0.0 and 1.0> }\n    }\n  ]\n} For GROUP attributes (a nested object),\
    \ give one candidate object per sub-attribute: {\n  \"group_attribute_name\":\
    \ {\n    \"sub_attribute_1\": {\n      \"G1\": \"<1st most likely guess, copied\
    \ EXACTLY as it appears in the document>\",\n      \"P1\": <probability between\
    \ 0.0 and 1.0>,\n      \"G2\": \"<2nd most likely guess>\",\n      \"P2\": <probability\
    \ between 0.0 and 1.0>\n    },\n    \"sub_attribute_2\": {\n      \"G1\": \"<1st\
    \ most likely guess, copied EXACTLY as it appears in the document>\",\n      \"\
    P1\": <probability between 0.0 and 1.0>\n    }\n  }\n} </output-format>"
  confidence:
