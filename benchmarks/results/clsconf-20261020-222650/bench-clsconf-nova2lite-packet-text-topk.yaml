  rules:
    model: global.anthropic.claude-sonnet-4-6
    temperature: '0.0'
    top_p: '0.0'
    top_k: '5'
    max_tokens: ''
    agentic:
      enabled: false
      review_agent: false
    system_prompt: You are an expert in analyzing policy documents and extracting
      business rules, regulations, and compliance requirements. Extract rules as structured,
      actionable validation statements.
    task_prompt: "<background> You are an expert in regulatory document analysis.\
      \ Your task is to extract ALL business rules, regulations, compliance requirements,\
      \ and validation criteria from the attached policy document as a single flat\
      \ list of rules. </background>\n<task> Analyze the policy document thoroughly,\
      \ page by page. For each rule found:\n1. Give the rule a short, descriptive\
      \ snake_case name (e.g., \"bundled_services_not_separate\",\n   \"modifier_59_distinct_sites\"\
      , \"prior_auth_required\")\n\n2. Write a clear, actionable description \u2014\
      \ phrased as a yes/no validation question\n   or checkable statement\n\n3. Include\
      \ specific codes, numbers, thresholds, or conditions mentioned\n4. Note any\
      \ exceptions or special cases within the description\n5. Reference the page\
      \ number or section where the rule was found </task>\n<extraction-guidelines>\
      \ Guidelines: - Extract rules VERBATIM from the document where possible - Each\
      \ rule should be a self-contained, evaluable statement - Rules should be specific\
      \ enough to validate a transaction against - Do NOT classify or categorize the\
      \ rules \u2014 output one flat list - Use descriptive snake_case names as rule\
      \ identifiers (NOT generic \"rule_1\", \"rule_2\") - Each rule description should\
      \ be phrased as a validation question or checkable statement - Do NOT interpret\
      \ or infer rules not explicitly stated in the document - Process ALL pages of\
      \ the document - If a rule has exceptions, include them in the description </extraction-guidelines>\n\
      <output-format> Return ONLY a valid JSON array containing exactly ONE object.\
      \ All rules go into a single \"rule_properties\" dict with descriptive snake_case\
      \ keys:\n[\n    {\n        \"x-aws-idp-rule-type\": \"policy_rules\",\n    \
      \    \"description\": \"All rules extracted from the policy document\",\n  \
      \      \"rule_properties\": {\n            \"bundled_services_not_separate\"\
      : {\n                \"description\": \"Are bundled services (exploration, lysis\
      \ of adhesions, closure, anesthesia) NOT reported separately from the primary\
      \ surgical procedure?\",\n                \"page\": \"V-5\"\n            },\n\
      \            \"modifier_59_distinct_sites\": {\n                \"description\"\
      : \"Is modifier 59 used only when procedures are performed at distinctly different\
      \ anatomic sites or during separate patient encounters?\",\n               \
      \ \"page\": \"V-8\"\n            },\n            \"prior_auth_required\": {\n\
      \                \"description\": \"Has prior authorization been obtained before\
      \ performing procedures that require pre-approval per the policy?\",\n     \
      \           \"page\": \"III-4\"\n            },\n            \"medical_necessity_documented\"\
      : {\n                \"description\": \"Is medical necessity documentation included\
      \ to support the procedure performed?\",\n                \"page\": \"IV-1\"\
      \n            }\n        }\n    }\n] </output-format>\n<final-instructions>\
      \ Extract rules from the attached policy document by: 1. Reading every page\
      \ systematically to identify all stated rules 2. Giving each rule a short, descriptive\
      \ snake_case name 3. Phrasing each rule as a yes/no validation question 4. Including\
      \ page references for traceability 5. Placing ALL rules into a single \"rule_properties\"\
      \ object under one wrapper 6. Do NOT include any text outside the JSON array\
      \ - return ONLY valid JSON </final-instructions>"
use_bda: false
config_format_version: '0.8'
