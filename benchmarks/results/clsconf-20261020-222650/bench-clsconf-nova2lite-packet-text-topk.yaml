    task_prompt: "<background> You are an expert document analysis assessment system.\
      \ Your task is to evaluate the confidence of extraction results for a document\
      \ of class {DOCUMENT_CLASS}. </background> <task> Analyze the extraction results\
      \ against the source document and provide a confidence assessment for each extracted\
      \ attribute. Consider factors such as: 1. Text clarity and OCR quality in the\
      \ source regions 2. Alignment between extracted values and document content\
      \ 3. Presence of clear evidence supporting the extraction 4. Potential ambiguity\
      \ or uncertainty in the source material 5. Completeness and accuracy of the\
      \ extracted information </task> <assessment-guidelines> For each attribute,\
      \ provide: - A confidence score between 0.0 and 1.0 (1.0 = clear, unambiguous\
      \ evidence;\n  lower = weaker/ambiguous evidence)\n- A confidence_reason ONLY\
      \ when the confidence is below 0.9 (see the output\n  rule below). Reasons exist\
      \ to explain low/uncertain scores for human review;\n  a high-confidence value\
      \ does not need one.\nBase assessments on actual document content and OCR quality;\
      \ account for OCR confidence scores when provided; be objective and specific.\
      \ </assessment-guidelines> <final-instructions> Return a JSON object mirroring\
      \ the extracted data structure: HIGH confidence (>= 0.9):  {\"attr\": {\"confidence\"\
      : 0.97}} LOWER confidence (< 0.9):  {\"attr\": {\"confidence\": 0.72, \"confidence_reason\"\
      : \"...\"}} GROUP:   {\"grp\": {\"sub1\": {\"confidence\": 0.95}}} LIST:   \
      \ {\"items\": [ {\"c1\": {\"confidence\": 0.72, \"confidence_reason\": \"...\"\
      }}, ... ]} OUTPUT RULE (keep responses compact \u2014 omit reasons for confident\
      \ values): - Emit \"confidence_reason\" for a leaf ONLY when its confidence\
      \ is below 0.9.\n  For confidence >= 0.9, emit just {\"confidence\": <score>}\
      \ with NO\n  confidence_reason key.\n- When you do include a confidence_reason,\
      \ keep it to at most 12 words and do\n  not restate the extracted value.\nIMPORTANT:\
      \ - For LIST attributes, assess EACH row separately (one object per row, in\
      \ order),\n  and within each row give EACH column its own confidence leaf ({\"\
      confidence\"},\n  plus \"confidence_reason\" only when below 0.9) \u2014 mirror\
      \ the row's column keys;\n  do NOT emit a single confidence per row. Nested\
      \ lists follow the same rule\n  recursively.\n- Include a confidence assessment\
      \ for ALL attributes present in the extraction results - Match the exact structure\
      \ of the extracted data </final-instructions> <<CACHEPOINT>> <document-image>\
      \ {DOCUMENT_IMAGE} </document-image> <ocr-text-confidence-results> {OCR_TEXT_CONFIDENCE}\
      \ </ocr-text-confidence-results> <<CACHEPOINT>> <attributes-definitions> {ATTRIBUTE_NAMES_AND_DESCRIPTIONS}\
      \ </attributes-definitions> <extraction-results> {EXTRACTION_RESULTS} </extraction-results>"
  geometry:
    mode: ocr_only
    task_prompt_bbox: '<spatial-localization-guidelines> Additionally, for each field
      provide bounding box coordinates alongside its confidence: - bbox: [x1, y1,
      x2, y2] in a normalized 0-1000 scale - page: page number where the field appears
      (starting from 1) Use x1,y1 = top-left and x2,y2 = bottom-right (ensure x2 >
      x1, y2 > y1). Make boxes tight around the actual text; if a field spans multiple
      lines, encompass all relevant text. Include bbox/page in the JSON alongside
      each field''s confidence. </spatial-localization-guidelines>'
