  - id: EX-08
    page: extraction
    question: "Does single-pass extraction return every row of a long list?"
    heading: "Long lists"
    takeaway: "Single-pass drops rows from 400; agentic with table parsing returns all"
    details_takeaway: "From 800 rows, single-pass costs more than agentic with table parsing"
    series: true
    short_values: {"Single-pass · Claude Haiku 5.5": "Single-pass", "Agentic, table parsing on · Claude Haiku 5.5": "Agentic, table parsing on", "Agentic, table parsing off · Claude Haiku 5.5": "Agentic, table parsing off"}
    notes: |-
      The synthetic statements are clean three-column tables in one layout, with exact ground truth: each row carries a unique tag, so every returned row is checked against its own true row. They test list length, whether every row comes back, not reading messy real tables (merged cells, wrapped text, headers repeated at page breaks, scans). [Agentic or single-pass extraction](#agentic-or-single-pass-extraction) is the check on real invoices, and on long real invoices [table parsing](#deterministic-table-parsing) cost more, not less. Every value reads Amazon Textract's Tables and Layout, because the table-parsing tool and the accelerator's row-count check need Textract's tables as Markdown.

      From 400 to 1,600 rows, single-pass returned part of the list on 27 of 45 statement runs, 24 of them the first page's 43 rows, and the accelerator flagged all 27 with `extraction_rows_below_ocr_estimate`. Every row that came back had the right date and amount. Agentic costs are a floor: our metering can't size its calls, and calls over 100,000 prompt tokens bill at up to five times the rate, which would still cost less than single-pass from 800 rows. Times stop where Test Studio's evaluation starts; it outruns its time limit on a complete list of 1,600 rows or more, so rows are scored by their tags.
    changes: "Extraction mode (`extraction.mode`), and for agentic extraction, deterministic table parsing (`extraction.agentic.table_parsing.enabled`)"
    varies: "extraction mode and table parsing"
    values: ["Single-pass · Claude Haiku 5.5", "Agentic, table parsing on · Claude Haiku 5.5", "Agentic, table parsing off · Claude Haiku 5.5"]
    set: [{"extraction.mode": "simple", "extraction.agentic.enabled": false, "ocr.features": [{"name": "TABLES"}, {"name": "LAYOUT"}]}, {"extraction.mode": "advanced", "extraction.agentic.enabled": true, "ocr.features": [{"name": "TABLES"}, {"name": "LAYOUT"}], "extraction.agentic.table_parsing.enabled": true}, {"extraction.mode": "advanced", "extraction.agentic.enabled": true, "ocr.features": [{"name": "TABLES"}, {"name": "LAYOUT"}], "extraction.agentic.table_parsing.enabled": false}]
    holds: "Amazon Textract with Tables and Layout for every value; extraction on Claude Haiku 5.5"
    baseline: develop
    reference: "Single-pass · Claude Haiku 5.5"
    datasets: [synth_100, synth_400, synth_800, synth_1600, synth_3200]
    runs: 3
    metrics: [completeness, cell_accuracy, median_seconds]
    plot: completeness
    cost_metric: extraction_cost_per_1000_docs
    by_size: {metric: completeness, x: list_rows, name: "Synthetic statements", bands: each, points: runs}
    econ: {against: "Single-pass · Claude Haiku 5.5", line: "Agentic, table parsing on · Claude Haiku 5.5", dataset: synth_800, names: {"Agentic, table parsing on · Claude Haiku 5.5": "agentic extraction with table parsing"}}
