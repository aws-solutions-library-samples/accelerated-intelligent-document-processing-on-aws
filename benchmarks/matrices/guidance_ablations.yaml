# Ablation registry for the "Benchmarks by Problem Set" pages (docs/benchmark-guidance/).
#
# Each ablation answers one customer question by changing ONE setting. An ablation with a
# `baseline` changes it from that configuration (the recommended setup); one without
# changes it from each dataset's configuration preset (docs/benchmark-guidance/index.md,
# "How we run a benchmark").
# benchmarks/harness/render_guidance.py renders every ablation into its page between the
# `<!-- BEGIN GENERATED FAQ -->` and `<!-- BEGIN GENERATED ABLATIONS -->` markers. When
# a results file exists at benchmarks/results/guidance/<ID>.json, the renderer writes the
# ablation's answer, chart and tables from it; otherwise the question is listed once, with
# its ID, under "Planned" at the end of the page's FAQ.
#
# Fields:
#   id        stable ID used by the run scripts and the results file name
#   page      page slug under docs/benchmark-guidance/
#   question  the customer question, as a customer asks it
#   changes   the one setting that varies
#   values    its values; the default value is marked "(default)"
#   holds     settings that differ from the preset for every value
#   datasets  keys of `datasets` below
#   runs      runs per document per value
#   metrics   keys of `metrics` below, in column order
#   derives   for ablations computed from another ablation's runs, that ablation's ID
#   plot      the metric to plot (default: the first metric that applies), or a list
#             of metrics, which a cost or tokens chart draws as a row of panels each
#   families  true when the values are models: each point takes its model family's
#             color and shape, with a legend naming the families on the chart
#   series    true to color and shape each value's points as its by-size chart's
#             series are (its place in `values`), with a key naming the values
#   takeaway  optional: the headline chart's title, the answer in one short sentence
#             (12 words at most). Without it the chart is titled with the question
#   details_takeaway
#             optional: the title of a chart that follows a by-size chart, which
#             carries `takeaway` itself
#   short_values
#             optional: {value, or one " · " part of a grid value: short form}, the
#             name a point is labelled with on a chart. Without it a value is its own
#             label, with a model's vendor left out ("Claude Haiku 5.5" is
#             "Haiku 5.5"); the default value is marked "(default)"
#   varies    optional: what changes between the points, in plain words, for a
#             chart's subtitle and caption (default: `changes` without its code)
#   fixed     optional: the pipeline step whose model a chart's subtitle names as held
#             fixed (default: the page's own step, or Extraction when that step varies)
#   plot_x    the tokens metric for the x-axis when cost is not available (default:
#             total tokens when measured). Cost per 1,000 documents is used whenever
#             every plotted value has usage in its results file.
#   cost_metric
#             optional: a cost cell of the results file (a key of `metrics` below,
#             such as classification_cost_per_1000_docs) to use in place of the
#             whole pipeline's cost per 1,000 documents: the chart's cost axis, the
#             tables' cost column, the cost per error prevented and the cheapest
#             value. Used where the setting under test changes one step's cost and
#             the other steps' cost would hide it
#   by_size   optional {metric, x, name}: a chart of one per-document metric of the
#             results file's `per_doc` against a per-document size, one point per
#             document per value, on a log x axis, with a running median per value.
#             Datasets whose keys share a prefix (realkie, realkie_short, realkie_long)
#             are one pool and share one chart, deduplicated by document name, which
#             `name` names (default: the first dataset's `chart`). A pool's
#             `<prefix>_all` dataset (realkie_all), once it has per-document results,
#             stands for the whole pool, and the subsets are not drawn. `bands` sets
#             the size bands its points are averaged in: lower bounds, or `each` for
#             a band per size (default: `strata.bands`, else decades). `points: runs`
#             draws each document's score in each run (the results' `<metric>_runs`)
#             with each value's mean per band, its dots not sized by cost, and
#             writes "not sent" where the results' `not_sent` says a value never ran
#   strata    optional {by, bands, noun, score, documents}: under each by-size chart, a
#             table of the pool's documents banded by the per-document metric `by`
#             (bands are lower bounds: [0, 1, 21] reads "no <noun>", "1–20", "21 or
#             more"), with each value's mean `score`, weighted accuracy and cost per
#             1,000 documents, and what each model's agentic value costs against its
#             single-pass value. `documents` names the documents in the table.
#   grid      optional {rows, cols}: values are named "<row> · <col>" and render as a grid
#   baseline  optional: a key of `baselines`, the configuration every value starts from
#             before its own `set` overrides; without it a value starts from the preset
#   reference optional: the value that equals the baseline, drawn and named as the
#             reference point (bold) on the chart, in place of a "(default)" value. A
#             results table bolds it and adds "(recommended)" unless the value already
#             carries a parenthesized note, such as "(preset default)"
#   econ      optional {against, line, dataset, names}: the economics under the answer.
#             `against` is the value the others are priced against (the question's
#             Claude Haiku 5.5 setting); `line` is the value, or list of values, the
#             economics sentence prices against it; a table under the sentence
#             prices every other measured value. Each counts the cost the page shows
#             (`cost_metric`, else the whole pipeline's) against the plotted
#             accuracy (`plot`, its first metric), in errors per 1,000 documents:
#             one per document's fields, the results file's `sections_per_doc`
#             for a packet's section, label or boundary accuracy, or its
#             `rows_per_doc` for a list's completeness. A gap within
#             twice the combined standard error is no measurable difference.
#             `dataset` picks the dataset (default: the first that measured
#             `against`); `names` {value: words} names a value in the sentence
#             (default: the value without the parts it shares with the other)
#   transform optional: per value, the name of a function in
#             benchmarks/harness/profile_transforms.py applied to the profile last
#   notes     optional: caveats and secondary results, printed in the details
#   deprecated
#             optional: true to list the ablation under Planned, its results kept but
#             not shown, while its test is redesigned
#   set       per value, the configuration overrides that produce it (dotted paths),
#             in the order of `values`; run_guidance_ablation.py applies them
#
# A dataset's `testset` is its Test Studio test set ID and `docs` the number of its
# documents a run uses. `max_failed` is how many failed documents a run may have and
# still count (default 0): one DocSplit packet trips a Bedrock content filter during
# extraction, after classification has finished, and fails the document. Claude Haiku
# 5.5 classification occasionally returns a reply that is not JSON, and a Bedrock HTTP
# 500 is not retried; either fails a document. Scores count only documents every run
# of every value scored. Test Studio's evaluation outruns its 900-second limit on a
# complete statement of 1,600 rows or more and counts the statement as failed, so those
# runs allow every statement to fail: the collector scores a statement's rows by their
# SEQ tags whenever the statement finished (collect_guidance_results.SeqLists).
#
# A dataset's `preset` names the config_library/unified preset its runs start from, and
# its `chart` names it on a chart ("RealKIE invoices"; default: `short`).

datasets:
  synth_100: {name: "Synthetic statement, 100 rows (3 pages)", short: "Statement, 100 rows", chart: "100-row statements", kind: list, link: "../idp-fundamentals/benchmark-datasets.md#synthetic-bank-statements", preset: bench-synth-statements, testset: synth-statements-100, docs: 5}
  synth_400: {name: "Synthetic statement, 400 rows (9 pages)", short: "Statement, 400 rows", chart: "400-row statements", kind: list, link: "../idp-fundamentals/benchmark-datasets.md#synthetic-bank-statements", preset: bench-synth-statements, testset: synth-statements-400, docs: 5}
  synth_800: {name: "Synthetic statement, 800 rows (17 pages)", short: "Statement, 800 rows", chart: "800-row statements", kind: list, link: "../idp-fundamentals/benchmark-datasets.md#synthetic-bank-statements", preset: bench-synth-statements, testset: synth-statements-800, docs: 5}
  synth_1600: {name: "Synthetic statement, 1,600 rows (33 pages)", short: "Statement, 1,600 rows", chart: "1,600-row statements", kind: list, link: "../idp-fundamentals/benchmark-datasets.md#synthetic-bank-statements", preset: bench-synth-statements, testset: synth-statements-1600, docs: 5, max_failed: 5}
  synth_3200: {name: "Synthetic statement, 3,200 rows (66 pages)", short: "Statement, 3,200 rows", chart: "3,200-row statements", kind: list, link: "../idp-fundamentals/benchmark-datasets.md#synthetic-bank-statements", preset: bench-synth-statements, testset: synth-statements-3200, docs: 5, max_failed: 5}
  synth_two_docs: {name: "Synthetic file holding two statements", short: "Two statements in one file", kind: packet, link: "../idp-fundamentals/benchmark-datasets.md#synthetic-bank-statements", preset: bank-statement-sample}
  realkie: {name: "RealKIE-FCC-Verified (20 invoices)", short: "RealKIE", chart: "RealKIE invoices", kind: fields, link: "../idp-fundamentals/benchmark-datasets.md#realkie-fcc-verified", preset: realkie-fcc-verified, testset: realkie-fcc-verified, docs: 20}
  realkie_all: {name: "RealKIE-FCC-Verified, all 75 invoices", short: "RealKIE, all", chart: "RealKIE invoices", kind: fields, link: "../idp-fundamentals/benchmark-datasets.md#realkie-fcc-verified", preset: realkie-fcc-verified, testset: realkie-fcc-verified, docs: 75}
  realkie_long: {name: "RealKIE-FCC-Verified, long invoices (19 invoices, 8 to 33 pages)", short: "RealKIE, long", chart: "RealKIE long invoices", kind: fields, link: "../idp-fundamentals/benchmark-datasets.md#realkie-fcc-verified", preset: realkie-fcc-verified, testset: realkie-fcc-long, docs: 19, max_failed: 1}
  realkie_short: {name: "RealKIE-FCC-Verified, short invoices (24 invoices, 1 or 2 pages)", short: "RealKIE, short", chart: "RealKIE short invoices", kind: fields, link: "../idp-fundamentals/benchmark-datasets.md#realkie-fcc-verified", preset: realkie-fcc-verified, testset: realkie-fcc-short, docs: 24}
  confbench: {name: "ConfBench (RealKIE invoices with scan noise)", short: "ConfBench", chart: "ConfBench invoices", kind: fields, link: "../extensions/confbench-testset.md", preset: realkie-fcc-verified}
  omniai: {name: "OmniAI-OCR-Benchmark, bank checks (20)", short: "OmniAI, bank checks", chart: "OmniAI bank checks", kind: fields, link: "../idp-fundamentals/benchmark-datasets.md#omniai-ocr-benchmark", preset: ocr-benchmark, testset: ocr-benchmark, docs: 20, max_failed: 3}
  omniai_all: {name: "OmniAI-OCR-Benchmark, all 9 formats (293 documents)", short: "OmniAI", chart: "OmniAI documents", kind: fields, link: "../idp-fundamentals/benchmark-datasets.md#omniai-ocr-benchmark", preset: ocr-benchmark, testset: ocr-benchmark, docs: 293}
  fake_w2: {name: "Fake-W2-Tax-Forms (W-2 forms, 45 fields)", short: "Fake-W2", chart: "Fake-W2 forms", kind: fields, link: "../idp-fundamentals/benchmark-datasets.md#fake-w2-tax-forms", preset: fake-w2, testset: fake-w2, docs: 20}
  docsplit: {name: "DocSplit-Poly-Seq (20 packets)", short: "DocSplit", chart: "DocSplit packets", kind: packet, link: "../idp-fundamentals/benchmark-datasets.md#docsplit-poly-seq", preset: docsplit, testset: docsplit, docs: 20, max_failed: 6}
  docsplit_100: {name: "DocSplit-Poly-Seq (100 packets)", short: "DocSplit", chart: "DocSplit packets", kind: packet, link: "../idp-fundamentals/benchmark-datasets.md#docsplit-poly-seq", preset: docsplit, testset: docsplit, docs: 100, max_failed: 10}
  docsplit_sameclass: {name: "DocSplit same-class runs (60 packets)", short: "Same-class runs", chart: "Same-class packets", kind: packet, about: "60 packets we built from the pages of DocSplit packets 101 to 500, 879 pages in all. Each packet holds one run of documents of the same class back to back: 40 runs of two and 20 of three, over all 13 classes. DocSplit reuses a small pool of documents, so many also appear in packets 1 to 100.", preset: docsplit, testset: docsplit-sameclass, docs: 60, max_failed: 6}
  docsplit_long: {name: "DocSplit long packets (40 packets, 30 to 60 pages)", short: "Long packets", chart: "Long packets", kind: packet, about: "40 packets we built from the pages of DocSplit packets 101 to 500, 1,815 pages and 508 documents in all, 10 packets in each of 30 to 37, 38 to 45, 46 to 53 and 54 to 60 pages. As in DocSplit, no two neighbouring documents share a class. DocSplit reuses a small pool of documents, so many also appear in packets 1 to 100.", preset: docsplit, testset: docsplit-long, docs: 40, max_failed: 4}
  packets_with_fields: {name: "Packets with section and field ground truth (to be built)", short: "Packets with fields", kind: packet_fields, new: true}
  handwritten: {name: "Handwritten forms (to be built)", short: "Handwritten forms", kind: fields, new: true}

# A metric's `short` name labels a key entry, and its `axis` titles its chart axis in
# plain words (default: the name, with "(%)" for a share). A `baseline` is drawn as a
# dashed reference line on its chart: either a results-file `metric`, averaged, or a
# constant `value`; `name` labels the line and `caption` says what it is.
#
# `kinds` lists the dataset kinds a metric applies to. The renderer draws one results table
# per dataset kind, with only the metrics that apply to it. `cost_per_1000_docs` is not
# listed in any ablation: the renderer prices the results file's usage with
# config_library/pricing.yaml and adds the column whenever usage is there. Nor are
# `classification_cost_per_1000_docs` and `extraction_cost_per_1000_docs`, which the
# collector writes and an ablation's `cost_metric` puts in the cost column's place;
# each one's `note` says what it counts, under every table that shows it.
metrics:
  completeness: {name: "Completeness", axis: "Rows that came back (%)", kinds: [list]}
  cell_accuracy: {name: "Accuracy over rows returned", short: "Accuracy", axis: "Cells right in the rows returned (%)", kinds: [list]}
  weighted_accuracy: {name: "Weighted accuracy", kinds: [fields, packet_fields]}
  all_fields_right: {name: "Documents with every field right", kinds: [fields]}
  page_accuracy: {name: "Page accuracy", axis: "Pages with the right class (%)", kinds: [packet, packet_fields]}
  boundary_accuracy: {name: "Boundary accuracy", kinds: [packet, packet_fields]}
  label_accuracy: {name: "Label accuracy", kinds: [packet, packet_fields]}
  list_recall: {name: "List recall", kinds: [list]}
  list_score: {name: "List score", short: "List score", axis: "Line items matched, list score (%)", kinds: [list, fields]}
  list_rows: {name: "Rows in the list (ground truth)", short: "Rows in the list", kinds: [list, fields]}
  list_precision: {name: "List precision", kinds: [list]}
  section_accuracy: {name: "Section accuracy", axis: "Sections exactly right (%)", kinds: [packet, packet_fields]}
  grouping_score: {name: "Grouping score", kinds: [packet, packet_fields]}
  over_splits: {name: "Over-splits", kinds: [packet, packet_fields]}
  merges: {name: "Merges", kinds: [packet, packet_fields]}
  auroc: {name: "AUROC", axis: "Separates right from wrong values, AUROC (%)", kinds: [list, fields, packet], baseline: {value: 0.5, name: "coin flip", caption: "50%, no better than chance"}}
  calibration_error: {name: "Calibration error", kinds: [list, fields, packet]}
  alert_rate: {name: "Values below threshold", kinds: [list, fields, packet]}
  errors_caught: {name: "Errors below threshold", kinds: [list, fields, packet]}
  errors_caught_30: {name: "Errors caught reviewing 30% of values", axis: "Errors caught, reviewing 30% of values (%)", short: "Errors caught at 30%", kinds: [fields], baseline: {metric: errors_caught_30_random, name: "random review", caption: "what a review of a random 30% of values catches"}}
  ecarb_30: {name: "ECARB at a 30% review budget", short: "ECARB@30", axis: "Errors caught vs random review, 30% reviewed (×)", kinds: [list, fields, packet], baseline: {value: 1.0, name: "random review", caption: "1×, what reviewing a random 30% of values catches"}}
  ocr_tokens: {name: "OCR tokens per page", kinds: [list, fields, packet, packet_fields]}
  classification_tokens: {name: "Classification tokens per page", kinds: [list, fields, packet, packet_fields]}
  extraction_tokens: {name: "Extraction tokens per page", kinds: [list, fields, packet_fields]}
  scoring_tokens: {name: "Scoring tokens per page", kinds: [list, fields, packet_fields]}
  total_tokens: {name: "Total tokens per page", kinds: [list, fields, packet, packet_fields]}
  cost_per_1000_docs: {name: "Cost per 1,000 documents (USD)", kinds: [list, fields, packet, packet_fields]}
  classification_cost_per_1000_docs: {name: "Classification cost per 1,000 documents (USD)", kinds: [packet, packet_fields], note: "Classification cost counts only the classification step: its Amazon Bedrock calls and a decision model's AWS Lambda time. OCR, extraction, confidence scoring and other AWS charges are left out."}
  extraction_cost_per_1000_docs: {name: "Extraction cost per 1,000 documents (USD)", kinds: [list, fields, packet_fields], note: "Extraction cost counts only the extraction step's Amazon Bedrock calls. OCR, classification, confidence scoring and other AWS charges are left out."}
  cached_share: {name: "Share of input served from cache", kinds: [list, fields, packet, packet_fields]}
  median_seconds: {name: "Median seconds per document", kinds: [list, fields, packet, packet_fields]}

# The configuration we recommend (docs/benchmark-guidance/index.md, "What we recommend").
# An ablation that names it changes one setting from it rather than from the preset.
# Escalation is off so that scoring runs on the model named, and nothing else.
# `develop` sets `extraction.confidence.enabled` as well as the mode: a preset that
# still carries the legacy `enabled: false` (bench-synth-statements) turns a `separate`
# mode off when it is set alone.
baselines:
  recommended:
    name: "Baseline setup"
    summary: "Amazon Textract with Layout only; holistic classification reading text and page images, single-pass extraction with structured output, and confidence scoring, all on Claude Haiku 5.5, with no escalation to a second scoring model"
    set: {"ocr.backend": "textract", "ocr.features": [{"name": "LAYOUT"}], "classification.strategy": "combined", "classification.combined.granularity": "packet", "classification.combined.llm.model": "us.anthropic.claude-haiku-5-5", "classification.split_then_classify.splitting.llm.model": "us.anthropic.claude-haiku-5-5", "classification.split_then_classify.section_classification.llm.model": "us.anthropic.claude-haiku-5-5", "extraction.model": "us.anthropic.claude-haiku-5-5", "extraction.mode": "simple", "extraction.schema_enforcement.mode": "structured_output", "extraction.confidence.mode": "separate", "extraction.confidence.model": "us.anthropic.claude-haiku-5-5", "extraction.confidence.escalation_enabled": false}

  develop:
    name: "Baseline setup"
    summary: "Amazon Textract with Layout only; holistic classification reading text and page images, single-pass extraction, and confidence scoring, all on Claude Haiku 5.5, with no escalation to a second scoring model"
    set: {"ocr.backend": "textract", "ocr.features": [{"name": "LAYOUT"}], "classification.strategy": "combined", "classification.combined.granularity": "packet", "classification.combined.llm.model": "us.anthropic.claude-haiku-5-5", "classification.split_then_classify.splitting.llm.model": "us.anthropic.claude-haiku-5-5", "classification.split_then_classify.section_classification.llm.model": "us.anthropic.claude-haiku-5-5", "extraction.model": "us.anthropic.claude-haiku-5-5", "extraction.mode": "simple", "extraction.confidence.mode": "separate", "extraction.confidence.enabled": true, "extraction.confidence.model": "us.anthropic.claude-haiku-5-5", "extraction.confidence.escalation_enabled": false}

ablations:
  # ------------------------------------------------------------- every problem set
  - id: TR-01
    page: index
    question: "How much do results vary between identical runs?"
    heading: "Run-to-run variation"
    changes: "Nothing: the preset, run 10 times"
    values: ["Preset"]
    datasets: [realkie, docsplit]
    runs: 10
    metrics: [weighted_accuracy, boundary_accuracy, list_recall, total_tokens]

  # ---------------------------------------------------------------- digitization
  - id: DG-01
    page: digitization
    notes: "On OmniAI bank checks, Textract with Layout only got every field right on 47% of checks, against 16% with Amazon Nova 2 Lite, which cost less ($4.84 against $7.76 per 1,000)."
    question: "Does the OCR reader make a difference to extraction accuracy?"
    heading: "OCR reader and extraction accuracy"
    takeaway: "Textract Layout only matches the other readers"
    changes: "OCR reader"
    varies: "OCR reader"
    values: ["Textract, layout only (recommended)", "Textract, tables and layout", "Amazon Nova 2 Lite vision"]
    set: [{"ocr.backend": "textract", "ocr.features": [{"name": "LAYOUT"}]}, {"ocr.backend": "textract", "ocr.features": [{"name": "TABLES"}, {"name": "LAYOUT"}, {"name": "SIGNATURES"}]}, {"ocr.backend": "bedrock", "ocr.model_id": "us.amazon.nova-2-lite-v1:0", "ocr.task_prompt": "Extract all text from this document image. Preserve the layout, including paragraphs, tables, and formatting.\n<document-image>\n{DOCUMENT_IMAGE}\n</document-image>"}]
    baseline: recommended
    reference: "Textract, layout only (recommended)"
    datasets: ["realkie", "omniai"]
    runs: 3
    metrics: ["weighted_accuracy", "all_fields_right", "ocr_tokens", "total_tokens"]
  - id: DG-02
    page: digitization
    question: "If I read pages with a vision model, which model?"
    heading: "Vision models as readers"
    changes: "Model used for Bedrock vision OCR"
    values: ["Amazon Nova 2 Lite", "Claude Haiku 5.5", "Claude Sonnet 5"]
    holds: "OCR reader set to the Bedrock vision model"
    datasets: [realkie, confbench]
    runs: 3
    metrics: [weighted_accuracy, list_precision, ocr_tokens, total_tokens]
  - id: DG-03
    page: digitization
    question: "Does a specialized OCR model beat Textract?"
    heading: "Specialized OCR models or Textract"
    changes: "OCR reader"
    values: ["Textract, tables and layout (default)", "Chandra (Lambda hook)", "Mistral OCR (Lambda hook)", "Cohere Parse (Lambda hook)"]
    datasets: [realkie, confbench, omniai]
    runs: 3
    metrics: [weighted_accuracy, all_fields_right, total_tokens]
  - id: DG-04
    page: digitization
    question: "What resolution should pages be rendered at?"
    heading: "Page resolution"
    takeaway: "Lower resolution saved nothing; keep 300 DPI"
    varies: "page resolution"
    changes: "`ocr.image.dpi`"
    values: ["300 DPI (preset default)", "200 DPI", "150 DPI"]
    set: [{"ocr.image.dpi": 300}, {"ocr.image.dpi": 200}, {"ocr.image.dpi": 150}]
    baseline: recommended
    reference: "300 DPI (preset default)"
    datasets: ["realkie"]
    runs: 3
    metrics: ["weighted_accuracy", "total_tokens"]
  - id: DG-05
    page: digitization
    question: "Does image preprocessing help on poor scans?"
    heading: "Image preprocessing on poor scans"
    changes: "`ocr.image.preprocessing`"
    values: ["Off (default)", "On"]
    datasets: [confbench, realkie]
    runs: 3
    metrics: [weighted_accuracy, all_fields_right, total_tokens]
  - id: DG-06
    page: digitization
    question: "Which Textract features do I need?"
    heading: "Textract features"
    takeaway: "Layout only scores best and costs least"
    varies: "Textract features"
    changes: "`ocr.features`"
    values: ["Layout only (recommended)", "Tables, layout, signatures (preset default)", "Tables only", "Tables, layout, signatures, forms"]
    set: [{"ocr.features": [{"name": "LAYOUT"}]}, {"ocr.features": [{"name": "TABLES"}, {"name": "LAYOUT"}, {"name": "SIGNATURES"}]}, {"ocr.features": [{"name": "TABLES"}]}, {"ocr.features": [{"name": "TABLES"}, {"name": "LAYOUT"}, {"name": "SIGNATURES"}, {"name": "FORMS"}]}]
    baseline: recommended
    reference: "Layout only (recommended)"
    datasets: ["realkie", "fake_w2"]
    runs: 3
    metrics: ["weighted_accuracy", "all_fields_right", "ocr_tokens", "total_tokens"]
    plot: ["weighted_accuracy", "all_fields_right"]
  - id: DG-07
    page: digitization
    question: "How much accuracy does scan quality cost?"
    heading: "Scan quality"
    changes: "Scan quality"
    values: ["Clean original", "Light noise", "Moderate noise", "Heavy noise"]
    datasets: [confbench]
    runs: 3
    metrics: [weighted_accuracy, all_fields_right, auroc]
  - id: DG-08
    page: digitization
    question: "Which reader handles handwriting best?"
    heading: "Handwriting"
    changes: "OCR reader"
    values: ["Textract, tables and layout (default)", "Bedrock vision model (Claude Sonnet 5)", "Chandra (Lambda hook)"]
    datasets: [handwritten]
    runs: 3
    metrics: [weighted_accuracy, all_fields_right, total_tokens]

  # ------------------------------------------------- splitting and classification
  - id: SC-11
    page: splitting-and-classification
    question: "Does holistic classification beat page-by-page classification?"
    heading: "Holistic or page-by-page classification"
    takeaway: "Holistic classification with Claude Sonnet 5.5 beats page by page"
    varies: "granularity, strategy and model"
    short_values: {"Two steps: split page by page, then classify": "Two steps, page by page", "Two steps: split holistically, then classify": "Two steps, holistic"}
    changes: "Granularity and strategy, by classification model"
