mutation RotateMcpCredential($clientId: ID!, $overlapDays: Int) {
  rotateMcpCredential(clientId: $clientId, overlapDays: $overlapDays) {
    clientId
    clientSecret
    tokenUrl
    gatewayUrl
    secretArn
    oauthScopes
    credential {
      clientId
      name
      role
      allowedConfigVersions
      tenant
      writeTools
      enabled
      status
      kind
      createdBy
      createdAt
      updatedBy
      updatedAt
      expiresAt
      lastUsedAt
      rotatedFrom
      replacedBy
      secretArn
    }
  }
}
