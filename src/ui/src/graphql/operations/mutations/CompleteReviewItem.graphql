mutation CompleteReviewItem($objectKey: String!, $cycleId: String!, $checklist: [Boolean!], $note: String) {
  completeReviewItem(objectKey: $objectKey, cycleId: $cycleId, checklist: $checklist, note: $note) {
    objectKey
    cycleId
    profile
    queue
    priority
    state
    reviewStatus
    enqueuedAt
    reasons {
      kind
      sectionId
      field
      label
      score
      threshold
    }
    reasonCount
    sections
    ownerEmail
    claimedAt
    leaseExpiresAt
    isMine
    hasDraft
    draftUpdatedAt
    draftUpdatedBy
    escalated
    escalationNote
    disposition
    disposedBy
    disposedAt
    rejectReason
    version
  }
}
