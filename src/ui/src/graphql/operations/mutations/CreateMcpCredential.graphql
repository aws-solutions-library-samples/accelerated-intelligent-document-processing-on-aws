mutation CreateMcpCredential(
  $name: String!
  $role: String!
  $allowedConfigVersions: [String]
  $writeTools: Boolean
  $expiresInDays: Int
) {
  createMcpCredential(
    name: $name
    role: $role
    allowedConfigVersions: $allowedConfigVersions
    writeTools: $writeTools
    expiresInDays: $expiresInDays
  ) {
    clientId
    clientSecret
    tokenUrl
    gatewayUrl
    secretArn
    oauthScopes
    credential {
      clientId
      name
      role
      allowedConfigVersions
      tenant
      writeTools
      enabled
      status
      kind
      createdBy
      createdAt
      updatedBy
      updatedAt
      expiresAt
      lastUsedAt
      rotatedFrom
      replacedBy
      secretArn
    }
  }
}
