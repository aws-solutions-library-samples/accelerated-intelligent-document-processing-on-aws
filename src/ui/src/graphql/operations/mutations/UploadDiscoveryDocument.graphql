mutation UploadDiscoveryDocument($fileName: String!, $contentType: String, $prefix: String, $bucket: String, $groundTruthFileName: String, $version: String, $pageRanges: [String], $pageLabels: [String], $skipJobCreation: Boolean, $discoveryType: String, $saveMode: String, $policyGroup: String, $policyGroupMode: String, $supersededRules: [String]) {
  uploadDiscoveryDocument(fileName: $fileName, contentType: $contentType, prefix: $prefix, bucket: $bucket, groundTruthFileName: $groundTruthFileName, version: $version, pageRanges: $pageRanges, pageLabels: $pageLabels, skipJobCreation: $skipJobCreation, discoveryType: $discoveryType, saveMode: $saveMode, policyGroup: $policyGroup, policyGroupMode: $policyGroupMode, supersededRules: $supersededRules) {
    presignedUrl
    objectKey
    usePostMethod
    groundTruthObjectKey
    groundTruthPresignedUrl
  }
}
