mutation UpdateMcpCredential(
  $clientId: ID!
  $role: String
  $allowedConfigVersions: [String]
  $clearScope: Boolean
  $writeTools: Boolean
  $enabled: Boolean
) {
  updateMcpCredential(
    clientId: $clientId
    role: $role
    allowedConfigVersions: $allowedConfigVersions
    clearScope: $clearScope
    writeTools: $writeTools
    enabled: $enabled
  ) {
    clientId
    name
    role
    allowedConfigVersions
    tenant
    writeTools
    enabled
    status
    kind
    createdBy
    createdAt
    updatedBy
    updatedAt
    expiresAt
    lastUsedAt
    rotatedFrom
    replacedBy
    secretArn
  }
}
