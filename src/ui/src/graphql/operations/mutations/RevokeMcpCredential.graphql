mutation RevokeMcpCredential($clientId: ID!) {
  revokeMcpCredential(clientId: $clientId) {
    clientId
    name
    role
    allowedConfigVersions
    tenant
    writeTools
    enabled
    status
    kind
    createdBy
    createdAt
    updatedBy
    updatedAt
    expiresAt
    lastUsedAt
    rotatedFrom
    replacedBy
    secretArn
  }
}
