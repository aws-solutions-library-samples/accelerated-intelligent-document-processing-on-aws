mutation SkipAllSectionsReview($objectKey: String!, $reason: String!, $note: String, $resubmit: Boolean) {
  skipAllSectionsReview(objectKey: $objectKey, reason: $reason, note: $note, resubmit: $resubmit) {
    ObjectKey
    ObjectStatus
    HITLStatus
    HITLTriggered
    HITLCompleted
    HITLSectionsPending
    HITLSectionsCompleted
    HITLSectionsSkipped
    HITLReviewOwner
    HITLReviewOwnerEmail
    HITLReviewHistory
  }
}
