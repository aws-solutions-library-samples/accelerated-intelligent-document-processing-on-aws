query ListReviewQueueItems($queueProfile: String, $queueName: String, $claimable: Boolean, $limit: Int, $nextToken: String) {
  listReviewQueueItems(queueProfile: $queueProfile, queueName: $queueName, claimable: $claimable, limit: $limit, nextToken: $nextToken) {
    items {
      objectKey
      cycleId
      profile
      queue
      priority
      state
      reviewStatus
      enqueuedAt
      reasons {
        kind
        sectionId
        field
        label
        score
        threshold
      }
      reasonCount
      sections
      ownerEmail
      claimedAt
      leaseExpiresAt
      isMine
      hasDraft
      draftUpdatedAt
      draftUpdatedBy
      escalated
      escalationNote
      disposition
      disposedBy
      disposedAt
      rejectReason
      version
    }
    nextToken
  }
}
