query ListConfigPrefixMappings {
  listConfigPrefixMappings {
    success
    mappings {
      prefix
      matchKind
      configProfile
      configRevision
      metadataPrecedence
      enabled
      description
      createdAt
      createdBy
      updatedAt
      updatedBy
    }
    error {
      type
      message
    }
  }
}
