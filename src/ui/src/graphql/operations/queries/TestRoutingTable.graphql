query TestRoutingTable($objectKey: String!, $routing: AWSJSON) {
  testRoutingTable(objectKey: $objectKey, routing: $routing) {
    decision
    matchedRuleId
    ruleLabel
    outcomeKind
    outcomeQueue
    placedQueue
    fallbackReason
    inputs
    staleReferences
    reason
    reasonSource
  }
}
