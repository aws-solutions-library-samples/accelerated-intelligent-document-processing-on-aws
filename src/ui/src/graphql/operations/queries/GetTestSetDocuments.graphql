query GetTestSetDocuments($testSetId: String!, $limit: Int, $nextToken: String, $objectKey: String, $search: String) {
  getTestSetDocuments(testSetId: $testSetId, limit: $limit, nextToken: $nextToken, objectKey: $objectKey, search: $search) {
    documents {
      objectKey
      inputKey
      size
      lastModified
      sections {
        sectionId
        baselineKey
        documentClass
        pageIndices
      }
      labelSource
      minConfidence
      confidenceThreshold
      alertCount
      fieldCount
    }
    nextToken
    totalCount
    activeLabelJobId
    status
    matchCount
    searchTruncated
  }
}
