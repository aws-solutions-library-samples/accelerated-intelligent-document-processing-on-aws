query GetTestSetDocuments($testSetId: String!, $limit: Int, $nextToken: String, $objectKey: String) {
  getTestSetDocuments(testSetId: $testSetId, limit: $limit, nextToken: $nextToken, objectKey: $objectKey) {
    documents {
      objectKey
      inputKey
      size
      lastModified
      sections {
        sectionId
        baselineKey
      }
      labelSource
      minConfidence
      confidenceThreshold
      alertCount
      fieldCount
    }
    nextToken
    activeLabelJobId
  }
}
