query ListDocumentVersions($objectKey: ID!) {
  listDocumentVersions(objectKey: $objectKey) {
    RunId
    ObjectKey
    CompletionTime
    QueuedTime
    WorkflowStartTime
    WorkflowExecutionArn
    ConfigVersion
    ConfigRevision
    PageCount
    FileCount
    ManifestUri
    SummaryReportUri
    EvaluationReportUri
  }
}
