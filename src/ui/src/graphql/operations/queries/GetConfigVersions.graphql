query GetConfigVersions {
  getConfigVersions {
    success
    versions {
      versionName
      isActive
      createdAt
      updatedAt
      description
      managed
      bdaProjectArn
      bdaSyncStatus
      bdaLastSyncedAt
      latestRevision
      publishedRevision
    }
    error {
      type
      message
    }
  }
}
