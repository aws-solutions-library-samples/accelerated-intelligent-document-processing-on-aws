query ListDocuments($startDateTime: AWSDateTime, $endDateTime: AWSDateTime, $limit: Int, $nextToken: String, $view: DocumentView) {
  listDocuments(startDateTime: $startDateTime, endDateTime: $endDateTime, limit: $limit, nextToken: $nextToken, view: $view) {
    Documents {
      PK
      SK
      ObjectKey
      ObjectStatus
      InitialEventTime
      CompletionTime
      ConfigVersion
      ConfigRevision
      EvaluationStatus
      HITLStatus
      HITLTriggered
      HITLCompleted
      HITLReviewOwner
      HITLReviewedBy
      PageCount
      ConfidenceAlertCount
      ProcessingIssueCount
    }
    nextToken
  }
}
