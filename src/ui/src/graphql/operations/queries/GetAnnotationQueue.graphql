query GetAnnotationQueue($testSetId: String!, $limit: Int, $includeCompleted: Boolean) {
  getAnnotationQueue(testSetId: $testSetId, limit: $limit, includeCompleted: $includeCompleted) {
    testSetId
    totalDocs
    inspectedDocs
    reviewedDocs
    remainingDocs
    claimedByOthers
    nextObjectKey
    labelJobStatus
    labelJobLabeled
    labelJobTotal
    documents {
      objectKey
      inputKey
      reviewObjectKey
      minConfidence
      confidenceThreshold
      alertCount
      fieldCount
      labelSource
      sectionCount
      sections {
        sectionId
        baselineKey
      }
      claimedBy
      claimedByMe
      reviewStatus
      reviewed
      available
    }
  }
}
