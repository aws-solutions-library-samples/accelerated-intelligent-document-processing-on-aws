query ListConfigProfileRevisions($profileName: String!) {
  listConfigProfileRevisions(profileName: $profileName) {
    success
    revisions {
      revision
      createdAt
      createdBy
      label
      notes
      sizeBytes
      classFingerprint
      pinned
      published
    }
    profileMatchesPublished
    error {
      type
      message
    }
  }
}
