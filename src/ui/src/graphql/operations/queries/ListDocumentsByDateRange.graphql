# Issue #712: no web-UI consumer today (the document list uses listDocuments).
# Retained deliberately, not by oversight: this is a live API operation with a
# backend resolver (nested/api-resolvers/.../list_documents_range_resolver), an
# entry in the dispatcher api_validation_spec.json, and an authorization case in
# scripts/api_rbac_expectations.yaml exercised by "make api-test". Retiring it is
# a backend decision, not a UI cleanup.
query ListDocumentsByDateRange($startDateTime: AWSDateTime!, $endDateTime: AWSDateTime!, $limit: Int, $nextToken: String) {
  listDocumentsByDateRange(startDateTime: $startDateTime, endDateTime: $endDateTime, limit: $limit, nextToken: $nextToken) {
    Documents {
      PK
      SK
      ObjectKey
      ObjectStatus
      InitialEventTime
      QueuedTime
      WorkflowStartTime
      CompletionTime
      WorkflowExecutionArn
      WorkflowStatus
      PageCount
      Sections {
        Id
        PageIds
        Class
        Confidence
        OutputJSONUri
        InstanceCount
        Excluded
        ExclusionReason
        ConfidenceThresholdAlerts {
          attributeName
          confidence
          confidenceThreshold
        }
        ProcessingIssues {
          stage
          severity
          code
          message
          rootCause
        }
      }
      Pages {
        Id
        Class
        ClassConfidence
        ClassReason
        ClassCandidates {
          Class
          Probability
        }
        ImageUri
        TextUri
        TextConfidenceUri
        OcrPageDataUri
      }
      EvaluationReportUri
      EvaluationStatus
      SummaryReportUri
      RuleValidationResultUri
      ExpiresAfter
      HITLStatus
      HITLReviewURL
      HITLTriggered
      HITLCompleted
      HITLSectionsPending
      HITLSectionsCompleted
      HITLSectionsSkipped
      HITLReviewOwner
      HITLReviewOwnerEmail
      HITLReviewedBy
      HITLReviewedByEmail
      TraceId
    }
    nextToken
  }
}
