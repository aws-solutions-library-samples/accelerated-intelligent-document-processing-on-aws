                  before the next step runs. Each hook receives the
                  document state and returns a JSON-serializable result
                  (logged for traceability). Hooks let vertical-product
                  packs (claims, loans, etc.) inject business logic
                  without forking the accelerator. Admins can edit, add,
                  reorder, or disable hooks here. The Lambda function
                  ARN must EITHER be tagged with `idp:feature-id=<anything>`
                  (vertical packs do this automatically) OR have a function
                  name starting with `GENAIIDP-` (admin-managed Lambdas).
                  Functions outside both categories will be rejected by
                  the dispatcher's IAM policy at invoke time.
