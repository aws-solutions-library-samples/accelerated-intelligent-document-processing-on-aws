        # Data plane — per-doc (or per-shard) Bedrock batch runtime. See docs/reporting-sql-layer.md §10.3.
        idp:plane: data
      VpcConfig: !If
        - DeployInVPC
        - SubnetIds: !Ref PrivateSubnetIds
          SecurityGroupIds:
            - !Ref LambdaSecurityGroupId
        - !If
