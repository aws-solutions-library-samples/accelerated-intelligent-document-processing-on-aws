                order: 1
              model_lambda_hook_arn:
                type: string
                title: Model Lambda hook ARN
                description: "Lambda function ARN for custom inference (used when model is 'LambdaHook'). Function name must start with GENAIIDP-."
                default: ""
                order: 3
                dependsOn: { field: "model", value: "LambdaHook" }
              model_params:
                type: object
                title: Model parameters
                sectionLabel: Model parameters
                # ghostGroup => children save at the PARENT path (classification.temperature,
                # classification.max_tokens, ...), so this is a purely visual grouping.
                ghostGroup: true
                collapsible: true
                defaultExpanded: false
                description: "Advanced inference tuning (sampling + output limits). Defaults are sensible; most users never change these."
                order: 2
                properties:
                  temperature:
                    type: number
                    title: Temperature
                    minimum: 0
                    maximum: 1
                    description: "Sampling temperature: Controls randomness in model output (0.0 = deterministic, higher = more random). Used when top_p is 0. Set temperature=0.0 for consistent, deterministic outputs. Not used for Claude 4.7+ or OpenAI GPT-5.x models."
                    order: 1
                  top_k:
                    type: integer
                    title: Top K
                    minimum: 1
                    description: "Sampling Top K. Not used for Claude 4.7+ or OpenAI GPT-5.x models."
                    order: 2
                  top_p:
                    type: number
                    title: Top P
                    description: "Sampling Top P: Nucleus sampling threshold (0.0-1.0). When set to a positive value (> 0), overrides temperature parameter. Set to 0 to use temperature instead. Not used for Claude 4.7+ or OpenAI GPT-5.x models."
                    order: 3
                  max_tokens:
                    type: number
                    title: Max tokens
                    description: "Optional cap on output tokens. Leave empty to use the selected model's maximum output limit (recommended). If set, it must not exceed the model's limit."
                    order: 4
                  reasoning_effort:
                    type: string
                    title: Reasoning effort
                    enum: ["none", "minimal", "low", "medium", "high", "xhigh", "max"]
                    default: "medium"
                    description: "Reasoning effort for reasoning-capable models: OpenAI GPT-5.x (minimal|low|medium|high), Claude Sonnet 5 / Sonnet 4.6 / Opus 4.5-4.8 / Fable 5 (low|medium|high|xhigh|max), and xAI Grok (none|low|medium|high|xhigh). Controls how much the model reasons before answering. This list is a superset across families; a value your model does not accept is dropped with a warning rather than sent. Higher effort costs more output tokens with little accuracy gain for extraction (measured), so lower is usually better. Ignored by Nova, Sonnet 4.5, and Haiku 4.5."
                    order: 5
                    dependsOn: { field: "model", reasoningCapable: true }
              classificationMethod:
                type: string
                title: Classification method
                description: "Classification methodology to use"
                enum:
                  [
                    "multimodalPageLevelClassification",
                    "textbasedHolisticClassification",
                  ]
                order: 3.5
              maxPagesForClassification:
                type: string
                title: Pages to classify
                description: "Number of pages to use for classification [When set to a number, forces the entire document to be assigned a single class]"
                enum: ["ALL", "1", "2", "3", "5", "10"]
                order: 4
              sectionSplitting:
                type: string
                title: Section splitting
                description: "Section splitting strategy: 'disabled' (entire doc as one section), 'page' (one section per page - prevents joining same-type documents), 'llm_determined' (use LLM boundary detection - default)"
                enum: ["disabled", "page", "llm_determined"]
                default: "llm_determined"
                order: 5
              contextPagesCount:
                type: integer
                title: Context pages
                description: "Number of surrounding pages to include as context for multi-modal page-level classification. Value of 0 means no additional context (default). Value of 1 includes 1 page before and after. Value of 2 includes 2 pages before and after. Only applies to multimodalPageLevelClassification method."
                minimum: 0
                maximum: 5
                default: 0
                order: 6
                dependsOn: { field: "classificationMethod", value: "multimodalPageLevelClassification" }
              enforceValidClasses:
                type: boolean
                title: Enforce valid classes
                description: "When enabled, the predicted class is validated against the defined class vocabulary. If the model returns a class that is not in the list, it is re-prompted with the valid choices and retried (see Max Validation Retries). If retries are exhausted, the page is assigned the Invalid Class Fallback and flagged with a validation error. When disabled, an out-of-vocabulary prediction is used as-is (legacy behavior). Only applies to multimodalPageLevelClassification."
                default: true
                order: 7
                dependsOn: { field: "classificationMethod", value: "multimodalPageLevelClassification" }
              maxValidationRetries:
                type: integer
                title: Max validation retries
                description: "Maximum number of times to re-prompt the model when it returns a class outside the defined vocabulary. Only used when Enforce Valid Classes is enabled. 0 disables retries (a single invalid prediction goes straight to the fallback)."
                minimum: 0
                maximum: 5
                default: 2
                order: 8
                dependsOn: { field: "enforceValidClasses", value: true }
              invalidClassFallback:
                type: string
                title: Invalid class fallback
                description: "Class label assigned to a page when all validation retries are exhausted. Should be one of your defined classes, or the built-in 'unclassified'. Only used when Enforce Valid Classes is enabled."
                default: "unclassified"
                order: 9
                dependsOn: { field: "enforceValidClasses", value: true }
              confidence:
                type: object
                sectionLabel: Class confidence
                description: "How much confidence the classifier reports in the CLASS it chose (not in the extracted fields — that is Extraction > Confidence). Costs output tokens on every page, because page-level classification is one inference per page."
                order: 10
                properties:
                  mode:
                    type: string
                    title: Class confidence mode
                    description: "'topk' (default) asks the model for its ranked candidate classes with probabilities ('80% W-2, 15% 1099') — better calibrated than a single self-reported number, and it shows you what else the page could have been. 'verbalized' asks for one 0-1 number: cheapest and the most overconfident. 'off' asks for nothing. Measured on a 13-class corpus, topk added ~0.5% to total document cost with no consistent accuracy change; how USEFUL the score is depends strongly on the classification model — see the Classification Confidence benchmark page."
                    enum: ["topk", "verbalized", "off"]
                    default: "topk"
                    order: 0
                  top_k_candidates:
                    type: integer
                    title: Candidates to request
                    description: "How many ranked candidate classes to ask for in 'topk' mode. Automatically reduced to the number of classes you have defined. At least 2 — the calibration benefit comes from the model having to rank alternatives."
                    minimum: 2
                    maximum: 10
                    default: 3
                    order: 1
                    dependsOn: { field: "mode", value: "topk" }
                  task_prompt_topk:
                    type: string
                    title: Top-K instruction block
                    format: textarea
                    description: "The instruction spliced into the classification Task prompt in 'topk' mode. Inserted before the document content (so it stays inside the Bedrock prompt-cache prefix, which matters because classification runs per page). {TOP_K_CANDIDATES} is replaced with the resolved candidate count. Keep the <class-confidence> wrapper: a Task prompt that already contains one is left alone, which is how you take over the wording completely."
                    order: 2
                    dependsOn: { field: "mode", value: "topk" }
                  task_prompt_verbalized:
                    type: string
                    title: Verbalized instruction block
                    format: textarea
                    description: "The instruction spliced into the classification Task prompt in 'verbalized' mode, on the same rules as the Top-K block."
                    order: 3
                    dependsOn: { field: "mode", value: "verbalized" }
              system_prompt:
                type: string
                title: System prompt
                format: textarea
                description: System prompt
                order: 15
              task_prompt:
                type: string
                title: Task prompt
                format: textarea
                description: Task prompt - include placeholders {CLASS_NAMES_AND_DESCRIPTIONS} (replaced with the class names and descriptions for all specified classes), {FEW_SHOT_EXAMPLES} (replaced by the x-aws-idp-class-prompt text and image data from each class's x-aws-idp-examples; renders empty when no class defines examples, so it is safe to leave in), {DOCUMENT_TEXT} (replaced by the OCR output), and for multi-modal classification {DOCUMENT_IMAGE} (replaced by the page image attachment). Optionally include {CLASS_AND_ATTRIBUTE_NAMES_AND_DESCRIPTIONS} (replaced with class names, descriptions, AND schema attribute field names — useful for disambiguating classes with similar names but different extraction schemas; opt-in and cost-neutral when not referenced). Optionally use <<CACHEPOINT>> to separate static and dynamic elements of prompt for Bedrock prompt caching.
                order: 16
              postHook:
                type: array
                collapsible: true
                defaultExpanded: false
                sectionLabel: Post-step pipeline hooks
                description: >-
                  Lambda functions invoked after this step completes,
                  before the next step runs. Each hook receives the
                  document state and returns a JSON-serializable result
                  (logged for traceability). Hooks let vertical-product
                  packs (claims, loans, etc.) inject business logic
                  without forking the accelerator. Admins can edit, add,
                  reorder, or disable hooks here. The Lambda function
                  ARN must EITHER be tagged with `idp:feature-id=<anything>`
                  (vertical packs do this automatically) OR have a function
                  name starting with `GENAIIDP-` (admin-managed Lambdas).
                  Functions outside both categories will be rejected by
                  the dispatcher's IAM policy at invoke time.
                listLabel: Post-step pipeline hooks
                itemLabel: Hook
                order: 99
                items:
                  type: object
                  required:
                    - featureId
                    - arn
                  properties:
                    featureId:
                      type: string
                      description: Feature that owns this hook (label only)
                      order: 0
                    arn:
                      type: string
                      description: >-
                        Lambda function ARN to invoke. Must either be
                        tagged `idp:feature-id=<anything>` OR have a
                        function name beginning with `GENAIIDP-`.
                      order: 1
                    order:
                      type: number
                      description: Execution order (lower = earlier)
                      default: 100
                      order: 2
                    onError:
                      type: string
                      enum: ["continue", "fail", "skip-remaining"]
                      default: continue
                      description: Behavior when this hook errors
                      order: 3
                    enabled:
                      type: boolean
                      description: Disable without removing
                      default: true
                      order: 4
          extraction:
            order: 5
            type: object
            format: section
            collapsible: true
            defaultExpanded: false
            sectionLabel: Extraction
            description: "Extracts structured attributes from each section. LLM-powered extraction is skipped for any section whose class has no attributes defined in the Document Schema (an empty extraction result is recorded)."
            dependsOn: { field: "use_bda", value: false }
            required:
              - model
              - temperature
              - top_k
              - top_p
              - system_prompt
              - task_prompt
            properties:
              mode:
                type: string
                title: Extraction mode
                enum: ["simple", "advanced"]
                default: "simple"
                order: 1
                description: "'simple' (default): single-pass extraction — fast and cheap, best for short documents. 'advanced': the robust, sharded extraction engine for large documents, big tables, and completeness (exposes the Advanced extraction settings below). Recommended with Anthropic Claude models."
              agentic:
                type: object
                sectionLabel: Advanced extraction settings
                description: "Tuning for Advanced extraction mode: page sharding/concurrency, deterministic table parsing, and schema validation/escalation. Shown only when Extraction mode is 'advanced'."
                order: 2
                dependsOn: { field: "extraction.mode", value: "advanced" }
                properties:
                  max_concurrent_batches:
                    type: number
                    description: "Max concurrent extraction agents / shards. 1 = single pass. >1 shards a section's pages into ranges (each agent sees only its pages) and runs them concurrently — speeds up long documents and avoids context-window overflow. Higher values raise Bedrock requests/min; tune to your quota. Default: 10."
                    minimum: 1
                    maximum: 10
                    default: 10
                    order: 1
                  max_pages_per_shard:
                    type: number
                    description: "Max pages per shard (wall-clock guard). Shard token budget is auto-sized from the model's context window, but a shard is still capped at this many pages so very large documents can't collapse into one long-running agent. 0 = page cap off (token budget alone). Default: 5."
                    minimum: 0
                    maximum: 100
                    default: 5
                    order: 2
                  restate_schema_in_system_prompt:
                    type: boolean
                    description: "Repeat the document schema in the agent's system prompt. It is already sent as the extraction tool's input schema — the identical JSON — so this is a duplicate worth roughly 2,600 of the ~6,700 schema tokens in every request (38%). Turning it OFF reclaims that; the agent can still fetch the schema on demand. Kept ON by default because restating a schema often improves how closely the model follows it, so the duplication may be doing real work — measure completeness on your own documents before turning it off. Both copies sit inside the prompt cache, so the dollar saving is much smaller than the token count suggests. It does NOT make long documents split into fewer parts — the schema text is not counted when the pipeline decides how to split a document, so the tokens you reclaim come out of a safety margin that was already unused. Measured on the benchmark suite: turning it off costs no completeness and no accuracy, and buys nothing measurable either. Default: on."
                    default: true
                    order: 2.5
                  table_parsing:
                    type: object
                    sectionLabel: Table Parsing Tool (Requires OCR TABLES enabled)
                    description: "Only used when Agentic Extraction is enabled. Gives the agent a deterministic parse_table tool that extracts well-formatted Markdown tables from OCR output without LLM inference - faster and more reliable for large/dense tables (bank statements, transaction logs). The agent decides when to use it based on table quality."
                    order: 4
                    properties:
                      enabled:
                        type: boolean
                        description: "Enable the parse_table tool. When enabled, the agent can use deterministic table parsing for well-formatted OCR tabular data instead of generating table rows with the LLM."
                        order: 0
                        default: false
                      min_confidence_threshold:
                        type: number
                        description: "Minimum average OCR text confidence (Textract 0-100 scale) for the agent to prefer table parsing over LLM extraction. Included in the agent system prompt as guidance. Default: 95."
                        minimum: 0
                        maximum: 100
                        default: 95
                        order: 1
                        dependsOn: { field: "enabled", value: true }
                      min_parse_success_rate:
                        type: number
                        description: "Minimum parse_success_rate from the parse_table tool for the agent to trust parsed results. Below this threshold, the agent falls back to LLM extraction. Default: 0.9."
                        minimum: 0
                        maximum: 1
                        default: 0.9
                        order: 2
                        dependsOn: { field: "enabled", value: true }
                      use_confidence_data:
                        type: boolean
                        description: "Load and provide OCR confidence data to the parse_table tool for quality assessment. Requires text_confidence_uri from Textract OCR (no effect with other OCR backends). Default: on."
                        default: true
                        order: 3
                        dependsOn: { field: "enabled", value: true }
                      max_empty_line_gap:
                        type: number
                        description: "Maximum consecutive empty lines tolerated inside a table before treating it as a boundary - helps recover tables split by OCR page breaks. Higher = more tolerant but may merge unrelated tables. Tuning: 2 for high-quality OCR, 3 standard, 5-7 for noisy documents. Default: 3."
                        minimum: 0
                        maximum: 10
                        default: 3
                        order: 4
                        dependsOn: { field: "enabled", value: true }
                      auto_merge_adjacent_tables:
                        type: boolean
                        description: "Automatically merge consecutive tables with identical columns (recovers tables split by page breaks). Disable if a document legitimately contains multiple separate tables with the same columns. Default: on."
                        default: true
                        order: 5
                        dependsOn: { field: "enabled", value: true }
                      lazy_images:
                        type: boolean
                        description: "When a table parse succeeds, skip pre-loading page images into the extraction prompt (the parser is text-driven; the agent can still fetch a page via view_image). Big cost saver on multi-page documents. Turn off for image-dependent corpora where the model must see page layout even when a table is present. Default: on."
                        default: true
                        order: 6
                        dependsOn: { field: "enabled", value: true }
              forced_tool:
                type: object
                sectionLabel: Schema Enforcement (experimental)
                description: "Send the document schema to the model as a required tool rather than describing it in the prompt, so the response structure is enforced by the API. EXPERIMENTAL and off by default: this constrains the SHAPE of the reply, not the accuracy of the values in it, and whether it helps is still being measured. Models reached through a custom Lambda hook or the GPT-5.x route cannot use it and fall back to the prompt automatically. Applies to Simple extraction only (Advanced already sends a tool schema), so this is shown only when Extraction mode is 'simple'."
                order: 4.05
                dependsOn: { field: "extraction.mode", value: "simple" }
                properties:
                  enabled:
                    type: boolean
                    description: "Require the model to answer by calling a tool whose input is your document schema. A malformed-JSON reply becomes structurally impossible for the fields the schema declares. Off by default because it is unproven — measure accuracy and completeness on your own documents before enabling it."
                    default: false
                    order: 0
                  fallback_to_prompt:
                    type: boolean
                    description: "If the model accepts the tool but replies in prose anyway (which happens, and is not an error), read the prose reply as usual. Leave this ON. Turning it off makes such a reply a failed section, which is only useful for measuring how often the model actually complies."
                    default: true
                    order: 1
                    dependsOn: { field: "enabled", value: true }
              multi_instance_detection:
                type: object
                sectionLabel: Multi-document Section Detection
                description: "Detects a section that turned out to hold SEVERAL separate documents of the same class when extraction returned only one of them, and raises a warning naming both counts. It asks the model, in the same extraction call, how many documents the pages contain - one extra integer of output, no second inference. Detection only: it never changes the extracted data, never fails a section, and never turns on a schema flag for you. To actually extract every document, set 'Multi-instance Sections' on the class in the Document Schema editor. Applies to Simple extraction only, so this is shown only when Extraction mode is 'simple'."
                order: 4.08
                dependsOn: { field: "extraction.mode", value: "simple" }
                properties:
                  enabled:
                    type: boolean
                    description: "Warn when a section appears to contain more documents of its class than were extracted - the silent case, where the section reports success with zero issues while holding one record out of three. TURN THIS ON if one section can hold several documents of the same class: measured on 40 real bank-check images with ground truth, it found all 18 multi-check images, raised zero false alarms on the 22 single-check ones, and got the count exactly right every time, for about 2% more input tokens. It is OFF by default only because on a corpus with no multi-record documents to find it is pure cost - one real forms corpus lost about 1.3 accuracy points. It never changes the extracted data."
                    default: false
                    order: 0
                  question:
                    type: string
                    description: "The question put to the model, as the description of the auxiliary count property. {DOCUMENT_CLASS} is replaced with the section's class name. Leave blank to use the shipped wording. Two clauses are load-bearing and should survive any edit: 'do not count pages, sections or repeated headers' (without it, a document carrying an identical banner on each of four pages reads as four documents), and 'DIAGNOSTIC METADATA, not extracted document data' (so the model does not treat the field as something to extract from the page)."
                    order: 1
                    dependsOn: { field: "enabled", value: true }
              coercion:
                type: object
                sectionLabel: Value Coercion
                description: "Deterministically repairs type/format mismatches in the extraction result before it is validated - currency and thousands separators in either convention into a number field, named-month and unambiguous numeric dates into a 'format: date' field, boolean-ish strings into a boolean. Costs nothing (no model call) and every change is recorded in the section's metadata. Applies to Simple extraction only (Advanced already coerces through its generated model), so this is shown only when Extraction mode is 'simple'."
                # Fractional slots keep these two next to the other
                # result-handling groups (confidence 3, geometry 4) without
                # colliding with model (5) / model_lambda_hook_arn (6), whose
                # integer slots are already taken.
                order: 4.1
                dependsOn: { field: "extraction.mode", value: "simple" }
                properties:
                  enabled:
                    type: boolean
                    description: "Repair type/format mismatches before validating. On by default, because the alternative is a wrongly-typed value reaching storage. Turn OFF to leave the model's output exactly as returned - validation (if enabled) will then simply report the mismatches instead of fixing them."
                    order: 0
                    default: true
                  date_order:
                    type: string
                    description: "How to read an all-numeric date whose day/month order is ambiguous, e.g. '01/02/2024'. 'auto' (default) refuses to guess and leaves such values untouched, so nothing is silently mis-dated. Choose MDY or DMY only for a corpus whose convention you know - it never overrides a value that is already unambiguous (a 15 cannot be a month whatever this is set to)."
                    enum: ["auto", "MDY", "DMY"]
                    order: 1
                    default: "auto"
                    dependsOn: { field: "enabled", value: true }
              validation:
                type: object
                sectionLabel: Schema Validation & Escalation
                description: "Validates the extraction result against the full class JSON Schema (notably 'format' keywords like date/email/uuid that the model's type validation does not enforce), and optionally escalates failing fields to a stronger model. Applies to BOTH Simple and Advanced extraction. On by default at Fail Action 'warn', which adds no inference cost."
                order: 4.2
                properties:
                  enabled:
                    type: boolean
                    description: "Enable full JSON-Schema validation of the extraction result. In Advanced (agentic) extraction violations are fed back to the agent for self-correction first; Simple extraction has no such loop (re-asking the same model with the same prompt mostly buys another invalid answer at full cost), so it goes straight to Fail Action. Remaining failures are handled per Fail Action below. On by default: at Fail Action 'warn' this is free and only makes an otherwise-silent schema violation visible."
                    order: 0
                    default: true
                  check_formats:
                    type: boolean
                    description: "Enforce JSON-Schema 'format' keywords (date, date-time, email, uri, uuid, ...). Note: 'format: date' means ISO-8601 (YYYY-MM-DD); disable this if your schema uses 'format: date' for non-ISO values such as MM/DD/YYYY (or use a 'pattern' instead). Default: on."
                    order: 1
                    default: true
                    dependsOn: { field: "enabled", value: true }
                  fail_action:
                    type: string
                    description: "What to do when validation fails (in Advanced extraction, after the agent's own retries). 'warn': record the outcome in metadata and proceed. 'escalate': re-extract only the failing fields with the Escalation Model (roughly doubles that section's cost, still far cheaper than human review), then warn if still invalid. 'reject': mark the section as failed so downstream/HITL can act. Default: warn — it is free, whereas 'escalate' spends real money on every failure, so opt into it deliberately."
                    enum: ["warn", "escalate", "reject"]
                    order: 2
                    default: "warn"
                    dependsOn: { field: "enabled", value: true }
                  escalation_model:
                    type: string
                    description: "Stronger Bedrock model used to re-extract failing fields (used when Fail Action is 'escalate'). Select blank to retry with the extraction model. Can be overridden per document class via the 'x-aws-idp-extraction-escalation-model' schema extension in the Document Schema editor."
                    order: 3
                    dependsOn: { field: "fail_action", value: "escalate" }
                    hideWhen: { field: "extraction.validation.enabled", value: false }
                    enum:
                      - ""
                      - "us.amazon.nova-lite-v1:0"
                      - "us.amazon.nova-pro-v1:0"
