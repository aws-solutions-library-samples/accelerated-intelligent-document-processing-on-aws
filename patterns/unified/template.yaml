  ##########################################################################
  # Test Execution Aggregation Function
  ##########################################################################

  TestExecutionAggregationFunction:
    Type: AWS::Serverless::Function
    DependsOn: DockerBuildRun
    Metadata:
      SkipBuild: True
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: "Cloudwatch does not support resource-level permissions"
          - id: W89
            reason: "This Lambda function does not require VPC access as it only interacts with AWS services via AWS APIs"
          - id: W92
            reason: "Function does not require concurrent execution limits as it is designed to scale based on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required for this function as it is invoked synchronously"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only configuration values"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    Properties:
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      PackageType: Image
      ImageUri: !Sub "${ECRRepository.RepositoryUri}:test-execution-aggregation-function-${ImageVersion}"
      Architectures:
        - !Ref LambdaArchitecture
      Timeout: 900
      MemorySize: 4096
      Tracing: Active
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          # Pin idp_common.metrics.put_metric to the stack namespace so
          # any future emit from imported evaluation modules matches the
          # PutMetricData IAM Condition below. Round-27 review fix
          # (adversarial pass): this function's condition was in place
          # but the env var was missing — currently latent (no put_metric
          # call today) but a future addition would silently AccessDenied.
          METRIC_NAMESPACE: !Ref StackName
          TRACKING_TABLE: !Ref TrackingTable
          OUTPUT_BUCKET: !Ref OutputBucket
      LoggingConfig:
        LogGroup: !Ref TestExecutionAggregationFunctionLogGroup
      Policies:
        - AWSLambdaBasicExecutionRole
        # Crud, not Read: besides reading the run's documents this function folds
        # the run's measured calibration into the test set's confidence curve
        # (the review-effort estimator's highest-fidelity input). With read-only
        # access that write fails with AccessDenied, and because the curve update
        # is deliberately best-effort it would fail *silently* — the estimator
        # would stay prior-driven forever with nothing in the logs to explain it.
        - DynamoDBCrudPolicy:
            TableName: !Ref TrackingTable
        - S3ReadPolicy:
            BucketName: !Ref OutputBucket
        - Statement:
          - Effect: Allow
            Action: cloudwatch:PutMetricData
            Resource: "*"
            # Round-22 hardening: scope PutMetricData to the stack's own
            # metric namespace so a compromised Lambda can't spam metrics
            # to arbitrary namespaces or names that trigger alarms on
            # neighbouring stacks. Data-plane Lambdas emit to
            # METRIC_NAMESPACE=<StackName> via idp_common.metrics.put_metric.
            Condition:
              StringEquals:
                "cloudwatch:namespace": !Ref StackName
          - Effect: Allow
            Action:
              - kms:Decrypt
              - kms:DescribeKey
            Resource: !Ref CustomerManagedEncryptionKeyArn

