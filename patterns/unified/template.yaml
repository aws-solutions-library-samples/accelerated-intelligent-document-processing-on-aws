      realkie-fcc-verified: !Sub "s3://${ConfigurationBucket}/config_library/managed_config/realkie-fcc-verified/config.yaml"


  ##########################################################################
  # ECR Repository for Lambda container images
  ##########################################################################

  ECRRepository:
    Type: AWS::ECR::Repository
    # checkov:skip=CKV_AWS_51: "Mutable tags allowed for workflow flexibility and version updates."
    Properties:
      EmptyOnDelete: true
      # checkov:skip=CKV_AWS_163: "ECR scanning controlled by parameter for environment-specific deployment requirements"
      ImageScanningConfiguration:
        ScanOnPush: !If [IsECRImageScanningEnabled, true, false]
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last 15 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 15
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }
      EncryptionConfiguration:
        EncryptionType: KMS
        KmsKey: !Ref CustomerManagedEncryptionKeyArn

  ##########################################################################
  # CodeBuild for building Lambda container images
  ##########################################################################

  DockerBuildRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: "Wildcard permissions required for CloudWatch Logs creation"
          - id: W12
            reason: "Amazon Inspector ListCoverage and ListFindings require wildcard resource per AWS documentation"
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: !Sub "codebuild.${AWS::URLSuffix}"
      PermissionsBoundary:
        !If [
          HasPermissionsBoundary,
          !Ref PermissionsBoundaryArn,
          !Ref AWS::NoValue,
        ]
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonEC2ContainerRegistryPowerUser"
      Policies:
        - PolicyName: CodeBuildAccess
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${ArtifactBucket}"
                  - !Sub "arn:${AWS::Partition}:s3:::${ArtifactBucket}/${ArtifactPrefix}/*"
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:GetBucketLocation
                  - s3:ListBucket
              - Resource:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*:*"
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
              - Resource:
                  - !GetAtt ECRRepository.Arn
                Effect: Allow
                Action:
                  - ecr:DescribeImageScanFindings
                  - ecr:DescribeImages
                  - ecr:StartImageScan
              # Required for Amazon Inspector Enhanced Scanning
              # https://docs.aws.amazon.com/AmazonECR/latest/userguide/image-scanning-enhanced-iam.html
              - Resource: "*"
                Effect: Allow
                Action:
                  - inspector2:ListCoverage
                  - inspector2:ListFindings
              # Required when ECR repository uses customer-managed KMS key encryption
              - Resource:
                  - !Ref CustomerManagedEncryptionKeyArn
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:CreateGrant
              # Grant kms:Decrypt on the artifacts bucket KMS key when provided
              # This allows DockerBuildRole to download source code from a KMS-encrypted artifact bucket
              - !If
                - HasArtifactsBucketKmsKey
                - Effect: Allow
                  Action:
                    - kms:Decrypt
                    - kms:GenerateDataKey*
                    - kms:DescribeKey
                  Resource: !Ref ArtifactsBucketKmsKeyArn
                - !Ref AWS::NoValue
              - !If
                - DeployInVPC
                - Effect: Allow
                  Action:
                    - ec2:CreateNetworkInterface
                    - ec2:DescribeNetworkInterfaces
                    - ec2:DeleteNetworkInterface
                    - ec2:DescribeSecurityGroups
                    - ec2:DescribeSubnets
                    - ec2:DescribeVpcs
                    - ec2:DescribeDhcpOptions
                  Resource: "*"
                - !Ref AWS::NoValue
              - !If
                - DeployInVPC
                - Effect: Allow
                  Action:
                    - ec2:CreateNetworkInterfacePermission
                  Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*"
                  Condition:
                    StringEquals:
                      ec2:AuthorizedService: !Sub "codebuild.${AWS::URLSuffix}"
                - !Ref AWS::NoValue

  DockerBuildProject:
    Type: AWS::CodeBuild::Project
    # cdk-nag suppress: AwsSolutions-CB5 - Privileged mode required for Docker image builds
    Properties:
      Name: !Sub "${AWS::StackName}-docker-build"
      Description: !Sub >-
        Unified Docker image builder for GenAIIDP stack - ${AWS::StackName}
      ServiceRole: !GetAtt DockerBuildRole.Arn
      EncryptionKey: !Ref CustomerManagedEncryptionKeyArn
      VpcConfig:
        !If
          - DeployInVPC
          - VpcId: !Ref VpcId
            Subnets: !Ref PrivateSubnetIds
            SecurityGroupIds:
              - !Ref LambdaSecurityGroupId
          - !Ref AWS::NoValue
      Artifacts:
        Type: NO_ARTIFACTS
      Source:
        Location: !Sub "arn:${AWS::Partition}:s3:::${ArtifactBucket}/${ArtifactPrefix}/${SourceZipfile}"
        Type: S3
        BuildSpec: patterns/unified/buildspec.yml
      Environment:
        ComputeType: BUILD_GENERAL1_LARGE
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        Type: LINUX_CONTAINER
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: ECR_URI
            Value: !GetAtt ECRRepository.RepositoryUri
          - Name: IMAGE_VERSION
            Value: !Ref ImageVersion
          - Name: AWS_REGION
            Value: !Ref AWS::Region
          - Name: LAMBDA_ARCHITECTURE
            Value: !Ref LambdaArchitecture
      TimeoutInMinutes: 90

  CodeBuildExecutionRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: "Role requires * resource access for CloudWatch Logs and CloudFormation custom resource operations"
    # checkov:skip=CKV_AWS_111: "Write access required for CloudWatch Logs and CloudFormation custom resource operations"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - !Sub "lambda.${AWS::URLSuffix}"
            Action:
              - sts:AssumeRole
      Path: "/"
      PermissionsBoundary:
        !If [
          HasPermissionsBoundary,
          !Ref PermissionsBoundaryArn,
          !Ref AWS::NoValue,
        ]
      Policies:
        - PolicyName: root
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource:
                  - !GetAtt DockerBuildProject.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:ListImages
                  - ecr:BatchDeleteImage
                  - ecr:DescribeImages
                Resource:
                  - !GetAtt ECRRepository.Arn
        # Used by custom resource helper poller
        # https://github.com/aws-cloudformation/custom-resource-helper
        - PolicyName: CustomResourcePoller
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - events:PutRule
                  - events:DeleteRule
                  - events:PutTargets
                  - events:RemoveTargets
                Resource:
                  - !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/*"
              - Effect: Allow
                Action:
                  - lambda:AddPermission
                  - lambda:RemovePermission
                Resource:
                  - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:*"
      ManagedPolicyArns:
        - !If
          - DeployInVPC
          - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole"
          - !Ref AWS::NoValue

  CodeBuildTrigger:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function does not require VPC access as it only interacts with AWS services via APIs"
          - id: W92
            reason: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required for Cfn Custom Resource function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    Properties:
      PermissionsBoundary:
        !If [
          HasPermissionsBoundary,
          !Ref PermissionsBoundaryArn,
          !Ref AWS::NoValue,
        ]
      Role: !GetAtt CodeBuildExecutionRole.Arn
      Runtime: python3.12
      Timeout: 60
      VpcConfig:
        !If
          - DeployInVPC
          - SecurityGroupIds:
              - !Ref LambdaSecurityGroupId
            SubnetIds: !Ref PrivateSubnetIds
          - !Ref AWS::NoValue
      MemorySize: 128
      Handler: index.handler
      CodeUri: ../../src/lambda/start_codebuild
      Description:  CodeBuild trigger Lambda for Docker image builds
      LoggingConfig:
        LogGroup: !Ref CodeBuildTriggerLogGroup

  CodeBuildTriggerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn
      LogGroupName: !Sub "/${AWS::StackName}/lambda/CodeBuildTrigger"
      RetentionInDays: !Ref LogRetentionDays

  DockerBuildRun:
    Type: Custom::CodeBuildRun
    Properties:
      ServiceToken: !GetAtt CodeBuildTrigger.Arn
      BuildProjectName: !Ref DockerBuildProject
      # Force rebuild when source changes (filename includes content hash)
      CodeLocation: !Sub "arn:${AWS::Partition}:s3:::${ArtifactBucket}/${ArtifactPrefix}/${SourceZipfile}"
      ImageVersion: !Ref ImageVersion
      LambdaArchitecture: !Ref LambdaArchitecture
      ExpectedImages:
        - "bda-invoke-function"
        - "bda-completion-function"
        - "bda-processresults-function"
        - "ocr-function"
        - "classification-function"
        - "extraction-function"
        - "assessment-function"
        - "processresults-function"
        - "summarization-function"
        - "evaluation-function"
        - "rule-validation-function"
        - "rule-validation-orchestration-function"
        - "mlflow-logger-function"

  EcrRepositoryCleanup:
    Type: Custom::ECRRepositoryCleanup
    DependsOn:
      - DockerBuildRun
    Properties:
      ServiceToken: !GetAtt CodeBuildTrigger.Arn
      RepositoryName: !Ref ECRRepository

  # Shared IAM policy for Lambda functions to pull container images from ECR
  LambdaECRAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Allows Lambda functions to pull container images from ECR
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
              - ecr:BatchCheckLayerAvailability
            Resource: !Sub "arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/*"


  ##########################################################################
  # BDA Branch Lambda Functions (from Pattern-1)
  ##########################################################################

  InvokeBDAFunction:
    DependsOn: DockerBuildRun
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: True
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: "Cloudwatch does not support resource-level permissions"
          - id: W89
            reason: "This Lambda function does not require VPC access as it only interacts with AWS services via AWS APIs"
          - id: W92
            reason: "Function does not require concurrent execution limits as it is designed to scale based on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required for this function as StepFunctions will handle retries"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only configuration values like feature flags and non-sensitive settings"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    Properties:
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      PackageType: Image
      ImageUri: !Sub "${ECRRepository.RepositoryUri}:bda-invoke-function-${ImageVersion}"
      Architectures:
        - !Ref LambdaArchitecture
      Timeout: 900
      MemorySize: 4096
      Tracing: Active
      Tags:
        # Data plane — per-doc BDA invocation. See docs/reporting-sql-layer.md §10.3.
        idp:plane: data
      Environment:
        Variables:
          TRACKING_TABLE: !Ref TrackingTable
          METRIC_NAMESPACE: !Ref StackName
          MAX_WORKERS: 20
          LOG_LEVEL: !Ref LogLevel
      LoggingConfig:
        LogGroup: !Ref InvokeBDAFunctionLogGroup
      Policies:
        - AWSLambdaBasicExecutionRole
        - S3ReadPolicy:
            BucketName: !Ref InputBucket
        - S3CrudPolicy:
            BucketName: !Ref WorkingBucket
        - S3CrudPolicy:
            BucketName: !Ref OutputBucket
        - DynamoDBCrudPolicy:
           TableName: !Ref TrackingTable
        - Statement:
          - Effect: Allow
            Action: cloudwatch:PutMetricData
            Resource: "*"
            # Round-22 hardening: scope PutMetricData to the stack's own
            # metric namespace so a compromised Lambda can't spam metrics
            # to arbitrary namespaces or names that trigger alarms on
            # neighbouring stacks. Data-plane Lambdas emit to
            # METRIC_NAMESPACE=<StackName> via idp_common.metrics.put_metric.
            Condition:
              StringEquals:
                "cloudwatch:namespace": !Ref StackName
          - Effect: Allow
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: !Ref CustomerManagedEncryptionKeyArn
          - Effect: Allow
            Action: bedrock:InvokeDataAutomationAsync
            Resource: 
              - !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:data-automation-project/*"
              - !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:data-automation-profile/*.data-automation-v1"
  
  InvokeBDAFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn
      LogGroupName: !Sub "/${AWS::StackName}/lambda/InvokeBDAFunction"
      RetentionInDays: !Ref LogRetentionDays
  
  BDAProcessResultsFunction:
    Type: AWS::Serverless::Function
    DependsOn: DockerBuildRun
    Metadata:
      SkipBuild: True
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: "Cloudwatch does not support resource-level permissions"
          - id: W89
            reason: "This Lambda function does not require VPC access as it only interacts with AWS services via AWS APIs — placed in VPC when ApiGatewayVisibility=PRIVATE"
          - id: W92
            reason: "Function does not require concurrent execution limits as it is designed to scale based on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required for this function as StepFunctions will handle retries"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only configuration values like feature flags and non-sensitive settings"    
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    Properties:
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      PackageType: Image
      ImageUri: !Sub "${ECRRepository.RepositoryUri}:bda-processresults-function-${ImageVersion}"
      Architectures:
        - !Ref LambdaArchitecture
      Timeout: 900
      MemorySize: 4096
      Tracing: Active
      Tags:
        # Data plane — per-doc BDA result parsing. See docs/reporting-sql-layer.md §10.3.
        idp:plane: data
      VpcConfig: !If
        - DeployInVPC
        - SubnetIds: !Ref PrivateSubnetIds
          SecurityGroupIds:
            - !Ref LambdaSecurityGroupId
        - !If
          - IsPrivateApi
          - SubnetIds: !Ref LambdaSubnetIds
            SecurityGroupIds:
              - !Ref LambdaSecurityGroupId
          - !Ref AWS::NoValue
      Environment:
        Variables:
          METRIC_NAMESPACE: !Ref StackName
          LOG_LEVEL: !Ref LogLevel
          TRACKING_TABLE: !Ref TrackingTable
          DOCUMENT_TRACKING_MODE: dynamodb
          DB_NAME: !Ref BDAMetadataTable
          WORKING_BUCKET: !Ref WorkingBucket
          CONFIGURATION_TABLE_NAME: !Ref ConfigurationTable
          # Read a pinned configuration revision's body when a document or
          # test run is pinned to one (config_revisions/ prefix).
          CONFIGURATION_BUCKET: !Ref ConfigurationBucket
      LoggingConfig:
        LogGroup: !Ref BDAProcessResultsFunctionLogGroup
      Policies:
        - AWSLambdaBasicExecutionRole
        - S3ReadPolicy:
            BucketName: !Ref InputBucket
        - S3CrudPolicy:
            BucketName: !Ref WorkingBucket
        - S3CrudPolicy:
            BucketName: !Ref OutputBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref BDAMetadataTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConfigurationTable
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "arn:${AWS::Partition}:s3:::${ConfigurationBucket}/config_revisions/*"
        - DynamoDBCrudPolicy:
            TableName: !Ref TrackingTable
        - Statement:
          - Effect: Allow
            Action: cloudwatch:PutMetricData
            Resource: "*"
            # Round-22 hardening: scope PutMetricData to the stack's own
            # metric namespace so a compromised Lambda can't spam metrics
            # to arbitrary namespaces or names that trigger alarms on
            # neighbouring stacks. Data-plane Lambdas emit to
            # METRIC_NAMESPACE=<StackName> via idp_common.metrics.put_metric.
            Condition:
              StringEquals:
                "cloudwatch:namespace": !Ref StackName
          - Effect: Allow
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: !Ref CustomerManagedEncryptionKeyArn
          - Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:PutParameter
              - ssm:GetParametersByPath
            Resource: '*'
          - Effect: Allow
            Action:
              - bedrock:GetDataAutomationProject
              - bedrock:ListDataAutomationProjects
              - bedrock:GetBlueprint
              - bedrock:GetBlueprintRecommendation
            Resource: '*'

  
  BDAProcessResultsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn
      LogGroupName: !Sub "/${AWS::StackName}/lambda/BDAProcessResultsFunction"
      RetentionInDays: !Ref LogRetentionDays

  BDACompletionFunctionDLQ:
    Type: AWS::SQS::Queue
    Metadata:
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-SQS3
            reason: "This queue is itself a DLQ - does not need its own DLQ"
    Properties:
      KmsMasterKeyId: !Ref CustomerManagedEncryptionKeyArn
      VisibilityTimeout: 30
      MessageRetentionPeriod: 345600 # 4 days

  BDACompletionFunctionDLQPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref BDACompletionFunctionDLQ
      PolicyDocument:
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: 'sqs:*'
            Resource: !GetAtt BDACompletionFunctionDLQ.Arn
            Condition:
              Bool:
                'aws:SecureTransport': false

  BDACompletionFunction:
    DependsOn: DockerBuildRun
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: True
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: "Cloudwatch does not support resource-level permissions"
          - id: W89
            reason: "This Lambda function does not require VPC access as it only interacts with AWS services via AWS APIs"
          - id: W92
            reason: "Function does not require concurrent execution limits as it is designed to scale based on demand"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only configuration values like feature flags and non-sensitive settings"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    Properties:
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      PackageType: Image
      ImageUri: !Sub "${ECRRepository.RepositoryUri}:bda-completion-function-${ImageVersion}"
      Architectures:
        - !Ref LambdaArchitecture
      Timeout: 900
      MemorySize: 4096
      Tracing: Active
      Tags:
        # Data plane — per-doc BDA completion signal. See docs/reporting-sql-layer.md §10.3.
        idp:plane: data
      Environment:
        Variables:
          TRACKING_TABLE: !Ref TrackingTable
          METRIC_NAMESPACE: !Ref StackName
          LOG_LEVEL: !Ref LogLevel
      DeadLetterQueue:
       Type: SQS
       TargetArn: !GetAtt BDACompletionFunctionDLQ.Arn
      LoggingConfig:
        LogGroup: !Ref BDACompletionFunctionLogGroup
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBReadPolicy:
           TableName: !Ref TrackingTable
        - Statement:
          - Effect: Allow
            Action: cloudwatch:PutMetricData
            Resource: "*"
            # Round-22 hardening: scope PutMetricData to the stack's own
            # metric namespace so a compromised Lambda can't spam metrics
            # to arbitrary namespaces or names that trigger alarms on
            # neighbouring stacks. Data-plane Lambdas emit to
            # METRIC_NAMESPACE=<StackName> via idp_common.metrics.put_metric.
            Condition:
              StringEquals:
                "cloudwatch:namespace": !Ref StackName
          - Effect: Allow
            Action: 
              - states:SendTaskSuccess
              - states:SendTaskFailure
            Resource: !GetAtt DocumentProcessingStateMachine.Arn
          - Effect: Allow
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: !Ref CustomerManagedEncryptionKeyArn

  
  BDACompletionFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn
      LogGroupName: !Sub "/${AWS::StackName}/lambda/BDACompletionFunction"
      RetentionInDays: !Ref LogRetentionDays

  BDAEventRule:
    Type: AWS::Events::Rule
    Properties:
      EventPattern:
        source:
          - aws.bedrock
        detail-type:
          - Bedrock Data Automation Job Succeeded
          - Bedrock Data Automation Job Failed With Client Error
          - Bedrock Data Automation Job Failed With Service Error
      State: ENABLED
      Targets:
        - Arn: !GetAtt BDACompletionFunction.Arn
          Id: BDACompletionFunction
          RetryPolicy:
            MaximumRetryAttempts: 3

  BDAEventPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref BDACompletionFunction
      Principal: !Sub "events.${AWS::URLSuffix}"
      SourceArn: !GetAtt BDAEventRule.Arn


  # DynamoDB Table for BDA process records metadata
  BDAMetadataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: execution_id
          AttributeType: S
        - AttributeName: record_number
          AttributeType: N
      KeySchema:
        - AttributeName: execution_id
          KeyType: HASH
        - AttributeName: record_number
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ExpiresAfter
        Enabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref CustomerManagedEncryptionKeyArn


  ##########################################################################
  # Stack-scoped BDA OCR project (CloudFormation custom resource)
  #
  # Provisions a per-stack Bedrock Data Automation standard-output SYNC project
  # for the 'bda' OCR backend, created on stack create and deleted on stack
  # delete. Replaces the former account-global auto-created project so multiple
  # stacks in one account no longer interfere. Degrades gracefully (empty ARN)
  # in regions/partitions without Bedrock Data Automation.
  #
  # Gated on ShouldCreateBDAOCRProject (commercial partition only) — see that
  # condition for why GovCloud/China cannot create this project shape at all.
  ##########################################################################

  BDAOCRProjectFunction:
    Type: AWS::Serverless::Function
    Condition: ShouldCreateBDAOCRProject
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function does not require VPC access as it only interacts with AWS services via APIs"
          - id: W92
            reason: "Function does not require reserved concurrency as it scales based on demand"
    # checkov:skip=CKV_AWS_116: "DLQ not required for Cfn Custom Resource function"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    Properties:
      PermissionsBoundary:
        !If [
          HasPermissionsBoundary,
          !Ref PermissionsBoundaryArn,
          !Ref AWS::NoValue,
        ]
      Runtime: python3.12
      Handler: index.handler
      CodeUri: ../../src/lambda/bda_ocr_project
      Description: Manages the stack-scoped BDA OCR standard-output project
      # Timeout must exceed the ~120s wait for the project to reach COMPLETED.
      Timeout: 300
      MemorySize: 128
      VpcConfig:
        !If
          - DeployInVPC
          - SecurityGroupIds:
              - !Ref LambdaSecurityGroupId
            SubnetIds: !Ref PrivateSubnetIds
          - !Ref AWS::NoValue
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          # Main stack name (not the verbose nested stack name) so the project
          # is named <mainstack>_OCR_StdOutput.
          STACK_NAME: !Ref StackName
      LoggingConfig:
        LogGroup: !Ref BDAOCRProjectFunctionLogGroup
      Policies:
        - AWSLambdaBasicExecutionRole
        - !If
          - DeployInVPC
          - Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                Resource: "*"
          - !Ref AWS::NoValue
        - Statement:
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:ReEncrypt*
                - kms:GenerateDataKey*
                - kms:DescribeKey
              Resource: !Ref CustomerManagedEncryptionKeyArn
            # Control-plane management of the stack-scoped BDA OCR project.
            - Effect: Allow
              Action:
                - bedrock:CreateDataAutomationProject
                - bedrock:GetDataAutomationProject
                - bedrock:UpdateDataAutomationProject
                - bedrock:DeleteDataAutomationProject
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:data-automation-project/*"
            # ListDataAutomationProjects is a collection op without resource-level scoping.
            - Effect: Allow
              Action:
                - bedrock:ListDataAutomationProjects
              Resource: "*"

  BDAOCRProjectFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: ShouldCreateBDAOCRProject
    Properties:
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn
      LogGroupName: !Sub "/${AWS::StackName}/lambda/BDAOCRProjectFunction"
      RetentionInDays: !Ref LogRetentionDays

  BDAOCRProject:
    Type: Custom::BDAOCRProject
    Condition: ShouldCreateBDAOCRProject
    Properties:
      ServiceToken: !GetAtt BDAOCRProjectFunction.Arn
      StackName: !Ref StackName
      # Bump ConfigVersion to force the custom resource to re-run (e.g. after
      # changing the project's standard-output / modality-routing config).
      ConfigVersion: "1"

  ##########################################################################
  # Pipeline Branch Lambda Functions (from Pattern-2)
  ##########################################################################

  OCRFunction:
    Type: AWS::Serverless::Function
    # Ordering on BDAOCRProject is enforced implicitly by the !GetAtt on its
    # ProjectArn in the environment below.
    DependsOn: DockerBuildRun
    Metadata:
      SkipBuild: True
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "This Lambda function does not require VPC access as it only interacts with AWS services via AWS APIs"
          - id: W92
            reason: "Function does not require concurrent execution limits as it is designed to scale based on demand"
          - id: W11
            reason: "Textract DetectDocumentText API and Cloudwatch APIs do not support resource-level permissions"
    # checkov:skip=CKV_AWS_116: "DLQ not required for this function as StepFunctions will handle retries"
    # checkov:skip=CKV_AWS_173: "Environment variables do not contain sensitive data - only configuration values like feature flags and non-sensitive settings"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency as it scales based on demand"
    Properties:
      PermissionsBoundary:
        !If [
          HasPermissionsBoundary,
          !Ref PermissionsBoundaryArn,
          !Ref AWS::NoValue,
        ]
      PackageType: Image
      ImageUri: !Sub "${ECRRepository.RepositoryUri}:ocr-function-${ImageVersion}"
      Architectures:
        - !Ref LambdaArchitecture
      ImageConfig:
        Command:
          - "index.handler"
      Timeout: 900
      MemorySize: 4096
      Tracing: Active
      Tags:
        # Data plane — runs per document. See docs/reporting-sql-layer.md §10.3.
        # The rollup Lambda discovers stack membership via the native
        # aws:cloudformation:stack-name tag; no idp:stack tag needed here.
        idp:plane: data
      VpcConfig: !If
        - DeployInVPC
        - SubnetIds: !Ref PrivateSubnetIds
          SecurityGroupIds:
            - !Ref LambdaSecurityGroupId
        - !If
          - IsPrivateApi
          - SubnetIds: !Ref LambdaSubnetIds
            SecurityGroupIds:
              - !Ref LambdaSecurityGroupId
          - !Ref AWS::NoValue
      Environment:
        Variables:
          METRIC_NAMESPACE: !Ref StackName
          MAX_WORKERS: 20
          CONFIGURATION_TABLE_NAME: !Ref ConfigurationTable
          # Read a pinned configuration revision's body when a document or
          # test run is pinned to one (config_revisions/ prefix).
          CONFIGURATION_BUCKET: !Ref ConfigurationBucket
          LOG_LEVEL: !Ref LogLevel
          TRACKING_TABLE: !Ref TrackingTable
          DOCUMENT_TRACKING_MODE: dynamodb
          WORKING_BUCKET: !Ref WorkingBucket
          # ARN of the stack-scoped BDA OCR project (empty in partitions/regions
          # without Bedrock Data Automation — see ShouldCreateBDAOCRProject; the
          # 'bda' backend then errors clearly).
          BDA_OCR_PROJECT_ARN:
            !If [ShouldCreateBDAOCRProject, !GetAtt BDAOCRProject.ProjectArn, ""]
          BEDROCK_ASSUME_ROLE_ARN:
            !If [HasBedrockHubRole, !Ref BedrockHubRoleArn, !Ref AWS::NoValue]
          BEDROCK_ASSUME_ROLE_EXTERNAL_ID:
            !If [HasBedrockHubRoleExternalId, !Ref BedrockHubRoleExternalId, !Ref AWS::NoValue]
          BEDROCK_ASSUME_ROLE_SESSION_NAME:
            !If [HasBedrockHubRoleSessionName, !Ref BedrockHubRoleSessionName, !Ref AWS::NoValue]
      LoggingConfig:
        LogGroup: !Ref OCRFunctionLogGroup
      Policies:
        - AWSLambdaBasicExecutionRole
        - !Ref LambdaECRAccessPolicy
        - S3CrudPolicy:
            BucketName: !Ref OutputBucket
        - S3CrudPolicy:
            BucketName: !Ref WorkingBucket
        - S3ReadPolicy:
            BucketName: !Ref InputBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref ConfigurationTable
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "arn:${AWS::Partition}:s3:::${ConfigurationBucket}/config_revisions/*"
        - DynamoDBCrudPolicy:
            TableName: !Ref TrackingTable
        - Statement:
            - Effect: Allow
              Action: cloudwatch:PutMetricData
              Resource: "*"
              # Round-22 hardening: scope PutMetricData to the stack's own
              # metric namespace so a compromised Lambda can't spam metrics
              # to arbitrary namespaces or names that trigger alarms on
              # neighbouring stacks. Data-plane Lambdas emit to
              # METRIC_NAMESPACE=<StackName> via idp_common.metrics.put_metric.
              Condition:
                StringEquals:
                  "cloudwatch:namespace": !Ref StackName
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:ReEncrypt*
                - kms:GenerateDataKey*
                - kms:DescribeKey
              Resource: !Ref CustomerManagedEncryptionKeyArn
            # Textract APIs require '*' as they don't support resource-level permissions
            - Effect: Allow
              Action:
                - textract:DetectDocumentText
                - textract:AnalyzeDocument
              Resource: "*"
            # Bedrock permissions for OCR
            # OpenAI GPT-5.x models are served via the bedrock-mantle endpoint
            # (OpenAI Responses API) and use a separate IAM action namespace.
            - Effect: Allow
              Action:
                - bedrock-mantle:CreateInference
                - bedrock-mantle:GetProject
                - bedrock-mantle:ListProjects
                - bedrock-mantle:ListTagsForResources
              Resource: "*"
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
                - bedrock:GetInferenceProfile
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:application-inference-profile/*"
                # Custom model deployments created via fine-tuning feature
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:custom-model-deployment/*"
            - Effect: Allow
              Action:
                - aws-marketplace:Subscribe
                - aws-marketplace:Unsubscribe
                - aws-marketplace:ViewSubscriptions
              Resource: "*"
            # Optional cross-account Bedrock invocation via hub-account role.
            # When BedrockHubRoleArn is set, the function assumes this role for
            # all Bedrock data-plane and control-plane calls. The local Bedrock
            # statements above are left in place so same-account invocations
            # continue to work when the parameter is unset.
            - !If
              - HasBedrockHubRole
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: !Ref BedrockHubRoleArn
              - !Ref AWS::NoValue
            # Lambda invoke permission for LambdaHook custom inference
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource:
                - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:GENAIIDP-*"
              Condition:
                StringLike:
                  "lambda:FunctionName": "GENAIIDP-*"
            # Bedrock Data Automation data-plane permission for the 'bda' OCR
            # backend. Sync InvokeDataAutomation on the stack-scoped standard-
            # output project (provisioned by the BDAOCRProject custom resource)
            # + the standard data-automation profile. Control-plane management
            # of the project lives on BDAOCRProjectFunction, not here.
            - Effect: Allow
              Action:
                - bedrock:InvokeDataAutomation
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:data-automation-project/*"
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:data-automation-profile/*.data-automation-v1"
                - !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:data-automation-profile/*.data-automation-v1"

