          BEDROCK_ASSUME_ROLE_SESSION_NAME:
            !If [HasBedrockHubRoleSessionName, !Ref BedrockHubRoleSessionName, !Ref AWS::NoValue]
      LoggingConfig:
        LogGroup: !Ref ShardRuntimeFunctionLogGroup
      Policies:
        - AWSLambdaBasicExecutionRole
        - !Ref LambdaECRAccessPolicy
        - S3CrudPolicy:
            BucketName: !Ref OutputBucket
        - S3CrudPolicy:
            BucketName: !Ref WorkingBucket
        - S3ReadPolicy:
            BucketName: !Ref InputBucket
        - S3ReadPolicy:
            BucketName: !Ref ConfigurationBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref ConfigurationTable
        - Statement:
            - Effect: Allow
