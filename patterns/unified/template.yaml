    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn
      LogGroupName: !Sub "/${AWS::StackName}/lambda/TestExecutionAggregationFunction"
      RetentionInDays: !Ref LogRetentionDays

