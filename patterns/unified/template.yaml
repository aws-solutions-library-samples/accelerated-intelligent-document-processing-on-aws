                  [{"expression": "m1/PERIOD(m1)*60", "label": "Total per Minute"}],
                  [{"expression": "m2/PERIOD(m2)*60", "label": "Succeeded per Minute"}],
                  [{"expression": "m3/PERIOD(m3)*60", "label": "Failed per Minute"}],
                  ["${StackName}", "BDAJobsTotal", {"id": "m1", "stat": "Sum", "visible": false}],
                  [".", "BDAJobsSucceeded", {"id": "m2", "stat": "Sum", "visible": false}],
                  [".", "BDAJobsFailed", {"id": "m3", "stat": "Sum", "visible": false}]
                ],
                "region": "${AWS::Region}",
                "title": "BDA Job Executions (per Minute)",
                "view": "timeSeries",
                "period": 60,
                "yAxis": {
                  "left": {
                    "label": "Count per Minute"
                  }
                }
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 66,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "${BDAProcessResultsFunction}"]
                ],
                "region": "${AWS::Region}",
                "title": "ProcessResults Function Duration",
                "period": 300,
                "annotations": {
                  "horizontal": [{
                    "value": ${ExecutionTimeThresholdMs},
                    "label": "Threshold (${ExecutionTimeThresholdMs}ms)",
                    "color": "#ff0000"
                  }]
                },
                "stat": "Average",
                "view": "timeSeries"
              }
            },
            {
              "type": "metric",
              "x": 16,
              "y": 66,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "${InvokeBDAFunction}"]
                ],
                "region": "${AWS::Region}",
                "title": "InvokeBDAFunction Function Duration",
                "period": 300,
                "annotations": {
                  "horizontal": [{
                    "value": ${ExecutionTimeThresholdMs},
                    "label": "Threshold (${ExecutionTimeThresholdMs}ms)",
                    "color": "#ff0000"
                  }]
                },
                "stat": "Average",
                "view": "timeSeries"
              }
            },
            {
              "type": "log",
              "x": 0,
              "y": 72,
              "width": 12,
              "height": 6,
              "properties": {
                "query": "SOURCE '${InvokeBDAFunctionLogGroup}' | filter @type = \"REPORT\" | fields @timestamp, @logStream, @billedDuration, @maxMemoryUsed/1024/1024 as memoryUsedMB | filter @billedDuration > ${ExecutionTimeThresholdMs} | sort by @billedDuration desc | limit 20",
                "region": "${AWS::Region}",
                "title": "InvokeBDA Lambda Long Running Invocations",
                "view": "table"
              }
            },
            {
              "type": "log",
              "x": 12,
              "y": 72,
              "width": 12,
              "height": 6,
              "properties": {
                "query": "SOURCE '${InvokeBDAFunctionLogGroup}' | fields @timestamp, @logStream, @message | filter @message like /ERROR/ or @message like /Task timed out/ | parse @message /RequestId: (?<requestId>[^ ]*)/ | sort @timestamp desc | limit 20",
                "region": "${AWS::Region}",
                "title": "InvokeBDA Lambda Errors",
                "view": "table"
              }
            },
            {
              "type": "log",
              "x": 0,
              "y": 78,
              "width": 12,
              "height": 6,
              "properties": {
                "query": "SOURCE '${BDAProcessResultsFunctionLogGroup}' | filter @type = \"REPORT\" | fields @timestamp, @logStream, @billedDuration, @maxMemoryUsed/1024/1024 as memoryUsedMB | filter @billedDuration > ${ExecutionTimeThresholdMs} | sort by @billedDuration desc | limit 20",
                "region": "${AWS::Region}",
                "title": "ProcessResults Lambda Long Running Invocations",
                "view": "table"
              }
            },
            {
              "type": "log",
              "x": 12,
              "y": 78,
              "width": 12,
              "height": 6,
              "properties": {
                "query": "SOURCE '${BDAProcessResultsFunctionLogGroup}' | fields @timestamp, @logStream, @message | filter @message like /ERROR/ or @message like /Task timed out/ | parse @message /RequestId: (?<requestId>[^ ]*)/ | sort @timestamp desc | limit 20",
                "region": "${AWS::Region}",
                "title": "ProcessResults Lambda Errors",
                "view": "table"
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 84,
              "width": 24,
              "height": 6,
              "properties": {
                "metrics": [
                  ["AWS/Lambda", "Throttles", "FunctionName", "${OCRFunction}", {"stat": "Sum"}],
                  [".", ".", ".", "${ClassificationFunction}", {"stat": "Sum"}],
                  [".", ".", ".", "${ExtractionFunction}", {"stat": "Sum"}],
                  [".", ".", ".", "${AssessmentFunction}", {"stat": "Sum"}],
                  [".", ".", ".", "${SummarizationFunction}", {"stat": "Sum"}],
                  [".", ".", ".", "${EvaluationFunction}", {"stat": "Sum"}],
                  [".", ".", ".", "${RuleValidationFunction}", {"stat": "Sum"}],
                  [".", ".", ".", "${InvokeBDAFunction}", {"stat": "Sum"}],
                  [".", ".", ".", "${BDAProcessResultsFunction}", {"stat": "Sum"}],
                  [".", ".", ".", "${BDACompletionFunction}", {"stat": "Sum"}],
                  [".", ".", ".", "${ProcessResultsFunction}", {"stat": "Sum"}]
                ],
                "region": "${AWS::Region}",
                "title": "Lambda Concurrency Throttles (429) - All Functions",
                "view": "timeSeries",
                "period": 60,
                "stacked": true,
                "yAxis": {
                  "left": {
                    "label": "Throttle Count"
                  }
                }
              }
            }
          ]
        }

Outputs:

  StateMachineName:
    Description: Step Functions State machine Name
    Value: !GetAtt DocumentProcessingStateMachine.Name

  StateMachineArn:
    Description: Step Functions State machine ARN
    Value: !GetAtt DocumentProcessingStateMachine.Arn

  StateMachineLogGroup:
    Description: Step Functions State machine LogGroup
    Value: !Ref StateMachineLogGroup

  PatternLogGroups:
    Description: Comma-separated list of all pattern-specific log groups
    Value: !Join
      - ","
      - # BDA branch log groups
        - !Ref InvokeBDAFunctionLogGroup
        - !Ref BDAProcessResultsFunctionLogGroup
        - !Ref BDACompletionFunctionLogGroup
        # Pipeline branch log groups
        - !Ref OCRFunctionLogGroup
        - !Ref ClassificationFunctionLogGroup
        - !Ref ExtractionFunctionLogGroup
        - !Ref AssessmentFunctionLogGroup
        - !Ref ProcessResultsFunctionLogGroup
        - !Ref RuleValidationFunctionLogGroup
        - !Ref RuleValidationOrchestrationFunctionLogGroup
        # Shared log groups
        - !Ref SummarizationFunctionLogGroup
        - !Ref EvaluationFunctionLogGroup
        - !Ref TestExecutionAggregationFunctionLogGroup
        - !Ref StateMachineLogGroup

  DashboardName:
    Description: Name of the Unified CloudWatch Dashboard
    Value: !Sub "${AWS::StackName}-${AWS::Region}-Unified"

  DashboardArn:
    Description: ARN of the Unified CloudWatch Dashboard
    Value: !Sub "arn:${AWS::Partition}:cloudwatch::${AWS::AccountId}:dashboard/${AWS::StackName}-${AWS::Region}-Unified"

  TestExecutionAggregationFunctionArn:
    Description: ARN of the Test Execution Aggregation Function
    Value: !GetAtt TestExecutionAggregationFunction.Arn

  MLflowLoggerFunctionArn:
    Condition: IsMLflowEnabled
    Description: ARN of the MLflow Logger Function
    Value: !GetAtt MLflowLoggerFunction.Arn
