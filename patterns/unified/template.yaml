  ##########################################################################
  # PipelineHooksDispatcherFunction — invoked from the SFN at each pipeline
  # extension point. Reads `Configuration#System#PipelineHooks` from the
  # ConfigurationTable and fans out to feature-registered hook Lambdas.
  # Zero-cost when no hooks are registered (one DDB GetItem + return).
  ##########################################################################
  PipelineHooksDispatcherFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: !Sub "lambda.${AWS::URLSuffix}" }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: ReadActiveConfigForHooks
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # GetItem on any Config#* row, plus Scan to find the
              # IsActive=true version when the document doesn't pin one.
              # Hooks are stored inline in each config version under
              # `<step>.postHook` lists.
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Scan
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ConfigurationTable}'
              # Status-only write: flip the doc row to PREPROCESSING while a
              # preprocessing hook runs (UI step visibility; best-effort).
              - Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TrackingTable}'
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                  # Encrypt/GenerateDataKey are needed to WRITE the
                  # compressed-document object below (the working bucket is
                  # encrypted with the customer-managed key).
                  - kms:Encrypt
                  - kms:GenerateDataKey
                Resource: !Ref CustomerManagedEncryptionKeyArn
              # Document mutation: when a hook returns an INLINE updated
              # document dict, the dispatcher spills it to the working bucket
              # in the same compressed-wrapper shape the step Lambdas use, so
              # the next step's Document.load_document() resolves it normally.
              # Scoped to the compressed_documents/ prefix the wrapper points
              # at. PutObject only — the dispatcher never reads documents back
              # (it passes references through opaquely), so a hook that needs
              # to READ the document uses its own role.
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${WorkingBucket}/compressed_documents/*'
              # Two parallel allow paths for hook Lambdas:
              #
              # 1. Tag-based ABAC for vertical-product packs. Pack-shipped
              #    hook Lambdas MUST carry the tag `idp:feature-id=<id>`
              #    (see e.g. claims-pack/template.yaml). The condition
              #    matches any value of that tag.
              #
              # 2. Name-prefix for admin-managed Lambdas. Mirrors the
              #    GENAIIDP-* convention used elsewhere in the host (e.g.
              #    custom-extraction-prompt). Admins can paste any
              #    GENAIIDP-* function ARN into the postHook fields without
              #    having to tag it.
              #
              # The dispatcher trusts whichever clears IAM. Function ARNs
              # outside both categories fail closed with AccessDenied —
              # the schema description warns admins.
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:*'
                Condition:
                  StringLike:
                    'aws:ResourceTag/idp:feature-id': '*'
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:GENAIIDP-*'

  PipelineHooksDispatcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      CodeUri: src/pipeline_hooks_function/
      Handler: index.lambda_handler
      Runtime: python3.12
      Architectures: [arm64]
      # Hooks are invoked synchronously (RequestResponse) through the
      # dispatcher, so its timeout must cover the LONGEST hook it fronts —
      # the PII-redaction preprocessing hook budgets up to ~890s for
      # multi-page Textract+vision passes. 900 is the Lambda maximum. (The
      # boto3 lambda client read_timeout is raised to match in index.py;
      # boto's default ~60s would sever the invoke early regardless of this
      # value.)
      Timeout: 900
      MemorySize: 256
      Tracing: Active
      Tags:
        # Data plane — sync-invoked from pipeline per doc for pre/post-process hooks.
        # See docs/reporting-sql-layer.md §10.3.
        idp:plane: data
      Role: !GetAtt PipelineHooksDispatcherFunctionRole.Arn
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          CONFIGURATION_TABLE_NAME: !Ref ConfigurationTable
          # Lets the dispatcher surface PREPROCESSING as the document's visible
          # status while a preprocessing hook runs (best-effort, cosmetic).
          TRACKING_TABLE: !Ref TrackingTable
          # Destination for a hook-returned INLINE updated document, spilled to
          # S3 as a compressed reference for the next step. Unused when hooks
          # are read-only or return their own compressed reference.
          WORKING_BUCKET: !Ref WorkingBucket

  PipelineHooksDispatcherFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${PipelineHooksDispatcherFunction}'
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn

