                    type: number
                    description: "Target image width in pixels. Images larger than this will be resized. No resize by default: the page image produced by OCR is used as-is, so ocr.image settings act as the upper bound. Set this only to send a smaller image than OCR produced."
                    minimum: 100
                    maximum: 3500
                    order: 0
                  target_height:
                    type: number
                    description: "Target image height in pixels. Images larger than this will be resized. No resize by default: the page image produced by OCR is used as-is, so ocr.image settings act as the upper bound. Set this only to send a smaller image than OCR produced."
                    minimum: 100
                    maximum: 3500
                    order: 1
              missing_field_handling:
                type: object
                collapsible: false
                sectionLabel: Missing vs Blank Fields
                description: >-
                  Distinguish a field that is BLANK (its source page IS in the section but the value is empty)
                  from one that is MISSING (its source page is ABSENT from the section — e.g. a multi-page
                  packet where a whole document is not present). Without this, both look identical (empty/null),
                  so you can't tell "the form had this field but it was left blank" from "that page wasn't
                  submitted at all." Applies to both standard and agentic extraction. Requires class schemas to
                  declare 'x-aws-idp-page-types' and properties to declare 'x-aws-idp-source-page-types'. Off by default.
