                # NOTE: the Web UI edits document classes with the JSON Schema
                # builder, not this schema-driven form (ConfigurationLayout filters
                # `classes` out), so this block is descriptive only. Field names here
                # are the canonical v0.6 keys; the legacy camelCase aliases
                # (classPrompt / attributesPrompt / imagePath) are still accepted on
                # read. Only `name` is required: each service uses its own prompt
                # field and skips examples that leave it empty.
                x-aws-idp-examples:
                  type: array
                  description: Class few-shot examples
                  listLabel: Few-shot examples
                  itemLabel: Few-shot example
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                        description: Example name
                        order: 0
                      x-aws-idp-class-prompt:
                        type: string
                        description: Classification prompt as few-shot classification example for this class. Optional - examples without it are skipped by classification.
                        order: 2
                      x-aws-idp-attributes-prompt:
                        type: string
                        description: Extraction prompt as few-shot attribute value extraction example for this class. Optional - examples without it are skipped by extraction.
                        order: 3
                      x-aws-idp-image-path:
                        type: string
                        description: Image(s) Path in the Configuration Bucket. Supports single files, or S3 prefixes for folders with multiple images. Optional but recommended for better visual understanding. An unreadable path logs a warning and the example is still sent as text.
                        order: 4
                attributes:
                  type: array
                  listLabel: Attributes
                  itemLabel: Attribute
                  items:
                    type: object
                    required:
                      - name
                      - description
                      - attributeType
                    properties:
                      name:
                        type: string
                        description: Attribute name
                        order: 0
                      description:
                        type: string
                        description: Attribute description. Instruct the LLM how to identify the attribute from the context provided in the extraction prompt. Include synonyms and positional infomation where it might help the LLM to resolve ambiquities.
                        order: 1
                      attributeType:
                        type: string
                        description: Type of attribute
                        enum: ["simple", "group", "list"]
                        order: 2
                      # Simple attribute properties (existing fields)
                      evaluation_method:
                        type: string
                        description: Evaluation Method
                        enum:
                          [
                            "",
                            "LLM",
                            "SEMANTIC",
                            "FUZZY",
                            "NUMERIC_EXACT",
                            "EXACT",
                          ]
                        order: 3
                        dependsOn: { field: "attributeType", value: "simple" }
                      evaluation_threshold:
                        type: number
                        description: Evaluation Threshold - used for SEMANTIC, and FUZZY methods
                        minimum: 0
                        maximum: 1
                        order: 5
                        dependsOn:
                          {
                            field: "evaluation_method",
                            values: ["SEMANTIC", "FUZZY"],
                          }
                      confidence_threshold:
                        type: number
                        description: Confidence threshold for this specific attribute (0.0 to 1.0). If not set, the default confidence threshold from assessment section will be used.
                        minimum: 0
                        maximum: 1
                        order: 6
                        dependsOn: { field: "attributeType", value: "simple" }
                      # Group-specific properties
                      groupAttributes:
                        type: array
                        listLabel: Group Attributes
                        itemLabel: Attribute
                        order: 7
                        dependsOn: { field: "attributeType", value: "group" }
                        items:
                          type: object
                          required:
                            - name
                            - description
                          properties:
                            name:
                              type: string
                              description: Attribute name
                              order: 0
                            description:
                              type: string
                              description: Attribute description. Instruct the LLM how to identify the attribute from the context provided in the extraction prompt. Include synonyms and positional infomation where it might help the LLM to resolve ambiquities.
                              order: 1
                            evaluation_method:
                              type: string
                              description: Evaluation Method
                              enum:
                                [
                                  "",
                                  "LLM",
                                  "SEMANTIC",
                                  "FUZZY",
                                  "NUMERIC_EXACT",
                                  "EXACT",
                                ]
                              order: 2
                            evaluation_threshold:
                              type: number
                              description: Evaluation Threshold - used for SEMANTIC, and FUZZY methods
                              minimum: 0
                              maximum: 1
                              order: 4
                              dependsOn:
                                {
                                  field: "evaluation_method",
                                  values: ["SEMANTIC", "FUZZY"],
                                }
                            confidence_threshold:
                              type: number
                              description: Confidence threshold for this specific attribute (0.0 to 1.0). If not set, the default confidence threshold from assessment section will be used.
                              minimum: 0
                              maximum: 1
                              order: 5
                          columns: 2
                      # List-specific properties
                      listItemTemplate:
                        type: object
                        sectionLabel: List Item Template
                        order: 8
                        dependsOn: { field: "attributeType", value: "list" }
                        required:
                          - itemAttributes
                        properties:
                          itemDescription:
                            type: string
                            description: Description of each list item. Instruct the LLM how to identify the list item (e.g. a transaction in a bank statement).
                            order: 0
                          itemAttributes:
                            type: array
                            listLabel: Item Attributes
                            itemLabel: Attribute
                            order: 1
                            items:
                              type: object
                              required:
                                - name
                                - description
                              properties:
                                name:
                                  type: string
                                  description: Attribute name
                                  order: 0
                                description:
                                  type: string
                                  description: Attribute description. Instruct the LLM how to identify the attribute from the context provided in the extraction prompt. Include synonyms and positional infomation where it might help the LLM to resolve ambiquities.
                                  order: 1
                                evaluation_method:
                                  type: string
                                  description: Evaluation Method
                                  enum:
                                    [
                                      "",
                                      "LLM",
                                      "SEMANTIC",
                                      "FUZZY",
                                      "NUMERIC_EXACT",
                                      "EXACT",
                                    ]
                                  order: 2
                                evaluation_threshold:
                                  type: number
                                  description: Evaluation Threshold - used for SEMANTIC, and FUZZY methods
                                  minimum: 0
                                  maximum: 1
                                  order: 4
                                  dependsOn:
                                    {
                                      field: "evaluation_method",
                                      values: ["SEMANTIC", "FUZZY"],
                                    }
                                confidence_threshold:
                                  type: number
                                  description: Confidence threshold for this specific attribute (0.0 to 1.0). If not set, the default confidence threshold from assessment section will be used.
                                  minimum: 0
                                  maximum: 1
                                  order: 5
                              columns: 2
                    # This controls the layout of the form fields inside each attribute item
                    columns: 2
