                    description: "Reasoning effort for reasoning-capable models: OpenAI GPT-5.x (minimal|low|medium|high), Claude Sonnet 5 / Sonnet 4.6 / Opus 4.5-4.8 / Fable 5 (low|medium|high|xhigh|max), and xAI Grok (none|low|medium|high|xhigh). Controls how much the model reasons before answering. This list is a superset across families; a value your model does not accept is dropped with a warning rather than sent. Defaults to low. Raise for reasoning-heavy documents. Ignored by Nova, Sonnet 4.5, and Haiku 4.5."
                    order: 1
                    dependsOn: { field: "model", reasoningCapable: true }
                  temperature:
                    type: number
                    title: Temperature
                    minimum: 0
                    maximum: 1
                    description: "Sampling temperature: Controls randomness in model output (0.0 = deterministic, higher = more random). Used when top_p is 0. Set temperature=0.0 for consistent, deterministic outputs. Not used for Claude 4.7+ or OpenAI GPT-5.x models."
                    order: 2
                  top_k:
                    type: integer
                    title: Top K
                    minimum: 1
                    description: "Sampling Top K. Not used for Claude 4.7+ or OpenAI GPT-5.x models."
                    order: 3
                  top_p:
                    type: number
                    title: Top P
                    description: "Sampling Top P: Nucleus sampling threshold (0.0-1.0). When set to a positive value (> 0), overrides temperature parameter. Set to 0 to use temperature instead. Not used for Claude 4.7+ or OpenAI GPT-5.x models."
                    order: 4
              system_prompt:
                type: string
                description: "System prompt. Can be overridden per document class via the 'x-aws-idp-extraction-system-prompt' schema extension in the Document Schema editor."
                order: 12
              task_prompt:
                type: string
                title: Task prompt (extraction)
                format: textarea
                description: "Extraction-only task prompt — used when confidence runs separately or is disabled. Placeholders: {DOCUMENT_CLASS}, {ATTRIBUTE_NAMES_AND_DESCRIPTIONS}, {FEW_SHOT_EXAMPLES} (the class's x-aws-idp-examples x-aws-idp-attributes-prompt text + images; renders empty when the class defines none), {DOCUMENT_TEXT}, {DOCUMENT_IMAGE}. Use <<CACHEPOINT>> for Bedrock prompt caching. Overridable per class via 'x-aws-idp-extraction-task-prompt'."
                order: 13
                hideWhen: { field: "extraction.confidence.mode", value: "integrated" }
              task_prompt_extraction_with_confidence:
                type: string
                title: Task prompt (extraction + confidence — advanced/agentic)
                format: textarea
                description: "INTEGRATED task prompt for ADVANCED (agentic) mode — used when Confidence Assessment mode is 'integrated' and Extraction mode is 'advanced'. Instructs the agent to call the provide_field_assessment tool after extracting. The bounding-box block (Bounding-box Geometry section) is appended automatically when Geometry mode is 'llm' or 'llm_grounded'."
                order: 14
                dependsOn: { field: "extraction.confidence.mode", value: "integrated" }
                hideWhen: { field: "extraction.mode", value: "simple" }
              task_prompt_extraction_with_confidence_topk:
                type: string
                title: Task prompt (1-Stage TopK extraction + confidence — simple)
                format: textarea
                description: "1-Stage TopK INTEGRATED task prompt for SIMPLE (non-agentic) mode — used when Confidence Assessment mode is 'integrated' and Extraction mode is 'simple'. A single LLM call emits its top-K guesses with probabilities per field (G1/P1 … GK/PK); the top guess becomes the value and its probability the confidence. Requesting ranked alternatives yields better-calibrated confidence than single-value self-assessment."
                order: 15
                dependsOn: { field: "extraction.confidence.mode", value: "integrated" }
                hideWhen: { field: "extraction.mode", value: "advanced" }
              custom_prompt_lambda_arn:
                type: string
                title: Custom Prompt Lambda ARN
                format: single-line
                description: "(Optional) ARN of a Lambda function to generate custom extraction prompts. Function name must start with 'GENAIIDP-'. If not provided, default prompts will be used. The Lambda function receives the complete config, prompt placeholders, default task prompt content, and serialized document, and returns custom system_prompt and task_prompt_content. Example: arn:partition:lambda:us-east-1:123456789012:function:GENAIIDP-my-extractor"
                order: 100
              geometry:
                type: object
                order: 4
                collapsible: false
                sectionLabel: Bounding-box Geometry
                description: "How field bounding boxes (geometry) are produced. Geometry is advisory enrichment shown in the UI viewer."
                properties:
                  mode:
                    type: string
                    title: Geometry mode
                    enum: ["ocr_only", "llm_grounded", "llm", "off"]
                    default: "ocr_only"
                    description: "'ocr_only' (default): derive boxes purely by matching each extracted value to real OCR lines — cheapest and most accurate, no bbox tokens. 'llm_grounded': the model emits boxes and OCR grounding refines them. 'llm': use the model's boxes as-is (no grounding). 'off': produce no geometry."
                    order: 0
                  task_prompt_bbox:
                    type: string
                    title: Bounding-box instructions
                    format: textarea
                    description: "Instruction block telling the model to emit bounding boxes. Appended to whichever confidence-bearing prompt is active (integrated or confidence-only) ONLY when Geometry mode is 'llm' or 'llm_grounded'. Ignored for 'ocr_only'/'off' (geometry comes from OCR matching)."
