              Resource: !Sub "arn:${AWS::Partition}:s3:::sagemaker-${AWS::Region}-${AWS::AccountId}/mlflow-artifacts/*"


  ##########################################################################
  # Unified Document Processing State Machine
  # Routes between BDA and step-by-step pipeline based on use_bda config
  ##########################################################################

  DocumentProcessingStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      Name: !Sub "${AWS::StackName}-DocumentProcessingWorkflow"
      DefinitionUri: statemachine/workflow.asl.json
      DefinitionSubstitutions:
        # Partition for service-integration ARNs (arn:${Partition}:states:::...).
        # Hardcoded 'aws' breaks in GovCloud — Step Functions validates the
        # partition and fails states like PostOcrHook with "resource belongs to a
        # different partition ... Expected 'aws-us-gov', was 'aws'".
        Partition: !Ref AWS::Partition
        # BDA branch functions
        InvokeBDALambdaArn: !GetAtt InvokeBDAFunction.Arn
        BDAProcessResultsLambdaArn: !GetAtt BDAProcessResultsFunction.Arn
        WorkingBucket: !Ref WorkingBucket
        # Bounds the waitForTaskToken wait on BDA_InvokeDataAutomation. The
        # placeholder is UNQUOTED in the ASL because TimeoutSeconds must be an
        # integer, which is why that file is not parseable as JSON without
        # resolving substitutions first.
        BDACallbackTimeoutSeconds: !Ref BDACallbackTimeoutSeconds
        # Pipeline branch functions
        OCRFunctionArn: !GetAtt OCRFunction.Arn
        ClassificationFunctionArn: !GetAtt ClassificationFunction.Arn
        ExtractionFunctionArn: !GetAtt ExtractionFunction.Arn
        ShardRuntimeFunctionArn: !GetAtt ShardRuntimeFunction.Arn
        AssessmentFunctionArn: !GetAtt AssessmentFunction.Arn
        PipelineProcessResultsLambdaArn: !GetAtt ProcessResultsFunction.Arn
        RuleValidationPolicyClassificationLambdaArn: !GetAtt RuleValidationPolicyClassificationFunction.Arn
        RuleValidationLambdaArn: !GetAtt RuleValidationFunction.Arn
        RuleValidationOrchestrationLambdaArn: !GetAtt RuleValidationOrchestrationFunction.Arn
        # Shared tail functions
        SummarizationLambdaArn: !GetAtt SummarizationFunction.Arn
        EvaluationLambdaArn: !GetAtt EvaluationFunction.Arn
        # Pipeline-hooks dispatcher — invoked by the SFN at each extension
        # point. Returns immediately when no hooks are registered.
        PipelineHooksDispatcherLambdaArn: !GetAtt PipelineHooksDispatcherFunction.Arn
        OutputBucket: !Ref OutputBucket
      Logging:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup: !GetAtt StateMachineLogGroup.Arn
      Tracing:
        Enabled: !Ref EnableXRayTracing
      Policies:
        # BDA branch
        - LambdaInvokePolicy:
            FunctionName: !Ref InvokeBDAFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref BDAProcessResultsFunction
        # Pipeline branch
        - LambdaInvokePolicy:
            FunctionName: !Ref OCRFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref ClassificationFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref ExtractionFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref ShardRuntimeFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref AssessmentFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref ProcessResultsFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref RuleValidationPolicyClassificationFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref RuleValidationFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref RuleValidationOrchestrationFunction
        # Shared tail
        - LambdaInvokePolicy:
            FunctionName: !Ref SummarizationFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref EvaluationFunction
        # Pipeline-hooks dispatcher — single SFN Task per hook point.
        - LambdaInvokePolicy:
            FunctionName: !Ref PipelineHooksDispatcherFunction
        - CloudWatchLogsFullAccess
        # Nested Distributed Map (Phase 3 sharded extraction): the state machine
        # starts/manages its own child executions for the inline Distributed Map
        # and reads/writes map item batches in the working bucket.
        - Statement:
            - Effect: Allow
              Action:
                - states:StartExecution
                - states:DescribeExecution
                - states:StopExecution
              Resource:
                - !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${AWS::StackName}-DocumentProcessingWorkflow"
                - !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:${AWS::StackName}-DocumentProcessingWorkflow/*"
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:ListBucket
              Resource:
                - !Sub "arn:${AWS::Partition}:s3:::${WorkingBucket}"
                - !Sub "arn:${AWS::Partition}:s3:::${WorkingBucket}/*"

  StateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn
      LogGroupName: !Sub "/aws/vendedlogs/states/${AWS::StackName}/workflow"
      RetentionInDays: !Ref LogRetentionDays


