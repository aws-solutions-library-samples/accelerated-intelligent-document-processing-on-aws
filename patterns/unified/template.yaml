      ImageUri: !Sub "${ECRRepository.RepositoryUri}:extraction-function-${ImageVersion}"
      Architectures:
        - !Ref LambdaArchitecture
      ImageConfig:
        Command:
          - "sfn_runtime_handler.handler"
      Timeout: 900
      MemorySize: 4096
      Tracing: Active
