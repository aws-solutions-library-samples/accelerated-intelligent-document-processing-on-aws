                order: 3
                sectionLabel: Confidence Assessment
                collapsible: false
                description: "Per-field confidence scoring. Confidence is an optional output of extraction; when enabled, each extracted value gets a confidence score (and drives HITL review). Turn OFF to skip assessment entirely (no second model pass, no explainability info)."
                properties:
                  mode:
                    type: string
                    title: Confidence scoring mode
                    enum: ["off", "separate", "integrated"]
                    default: "separate"
                    description: "How per-field confidence is produced. 'off': no confidence scoring (no extra model pass, no confidence data). 'separate' (default): scored in a distinct inference — a per-shard second pass in Advanced extraction mode, or the standalone Assessment step in Simple mode. 'integrated': the extraction inference emits each value's confidence in one pass (saves a model call). Confidence drives HITL review and the UI confidence display."
