  # Nested SFN Distributed Map shard-runtime function (Phase 3). Reuses the SAME
  # extraction container image (no extra Docker build), selected via a different
  # ImageConfig.Command. A single handler dispatches plan/shard/merge modes, each
  # reusing idp_common.extraction primitives (extract_one_shard, merge_shard_dicts)
  # — the single source of truth shared with the in-process runtime. One fresh
  # 15-min Lambda runs per shard, so SFN's native per-iteration retry re-runs only
  # failed/incomplete shards (completed shards load idempotently from S3).
  ShardRuntimeFunction:
    Type: AWS::Serverless::Function
    DependsOn: DockerBuildRun
    Metadata:
      SkipBuild: True
      cfn_nag:
        rules_to_suppress:
          - id: W89
