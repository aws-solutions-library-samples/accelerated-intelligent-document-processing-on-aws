AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: AWS GenAI IDP Accelerator - Unified Pattern (BDA + Bedrock FMs Pipeline)

Metadata:
  cfn-lint:
    config:
      ignore_checks:
        - W1030  # ARN pattern matching when Ref resolves to empty string

Parameters:
  StackName:
    Type: String

  InputBucket:
    Type: String

  DiscoveryBucket:
    Type: String
    Default: ""

  DiscoveryTrackingTable:
    Type: String
    Default: ""

  ConfigurationBucket:
    Type: String

  WorkingBucket:
    Type: String

  OutputBucket:
    Type: String

  TrackingTable:
    Type: String

  CustomerManagedEncryptionKeyArn:
    Type: String

  LogRetentionDays:
    Type: Number

  LogLevel:
    Type: String
    Default: WARN
    AllowedValues:
      - DEBUG
      - INFO
      - WARN
      - ERROR
      - CRITICAL
    Description: Default logging level for all Lambda functions

  ExecutionTimeThresholdMs:
    Type: Number
    Default: 30000

  BDACallbackTimeoutSeconds:
    Type: Number
    Default: 7200
    MinValue: 60
    MaxValue: 86400
    Description: >-
      Maximum seconds the BDA step waits for its asynchronous completion
      callback before failing the execution. Only affects BDA mode
      (use_bda: true). The BDA step uses waitForTaskToken, so it blocks until an
      external SendTaskSuccess/SendTaskFailure arrives; without a bound, any
      break in that path (BDA job stuck, task token lost, a dropped EventBridge
      hop, the completion handler failing before it responds) leaves the
      execution waiting forever, emitting neither ExecutionsFailed nor
      ExecutionTime -- so no alarm can see it while it holds a concurrency slot.
      Raise this if you process very large packets and see spurious
      States.Timeout failures; the cost of a high value is only slower detection
      of a genuinely stuck job, while too low a value fails healthy work.

  PreviousIDPPattern:
    Type: String
    Default: ''
    Description: Previous IDPPattern from SSM (used to detect Pattern-1 → Unified upgrades)

  UpdateConfigurationFunctionArn:
    Type: String

  ConfigurationTable:
    Type: String

  BedrockGuardrailId:
    Type: String
    Default: ""
    Description: "Optionally provide the Id (not name) of an existing Bedrock Guardrail to be used for Bedrock interactions"

  BedrockGuardrailVersion:
    Type: String
    Default: ""
    Description: "If you provided a Bedrock Guardrail Id above, provide the corresponding Guardrail version here"

  BedrockHubRoleArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:(aws|aws-cn|aws-us-gov|aws-iso|aws-iso-b):iam::[0-9]{12}:role/[\\w+=,.@\\-/]+$"
    ConstraintDescription: "Must be empty or a valid IAM role ARN. The ARN must NOT contain spaces — pass ExternalId via the separate BedrockHubRoleExternalId parameter."
    Description: >
      (Optional) ARN of an IAM role in a centralized hub account to assume for all
      Bedrock invocations. When set, processing Lambdas use sts:AssumeRole and route
      Bedrock data-plane and control-plane traffic through this role.

  BedrockHubRoleExternalId:
    Type: String
    Default: ""
    NoEcho: true
    Description: "(Optional) ExternalId for sts:AssumeRole into the Bedrock hub-account role."

  BedrockHubRoleSessionName:
    Type: String
    Default: ""
    AllowedPattern: "^[\\w+=,.@-]{0,64}$"
    Description: "(Optional) Session name for sts:AssumeRole into the Bedrock hub-account role."

  ConfigurationDefaultS3Uri:
    Type: String
    Description: "S3 URI (s3://bucket/path/config.json) to import default configuration from S3"

  ConfigLibraryHash:
    Type: String
    Description: "Hash token from config library to force updates when config library changes"

  ReportingBucket:
    Type: String
    Description: "S3 bucket for evaluation metrics and analytics"

  BaselineBucket:
    Type: String
    Description: "S3 bucket containing baseline/ground truth documents"

  SaveReportingFunctionName:
    Type: String
    Description: "Name of Lambda function to save evaluation metrics"

  ImageVersion:
    Type: String
    Description: "Content-based version for Lambda container images"

  LambdaArchitecture:
    Type: String
    Default: "arm64"
    AllowedValues: ["arm64", "x86_64"]
    Description: >-
      CPU architecture for Lambda container images. Must match the base image
      used in the Docker build. Use arm64 (Graviton) for best price-performance
      or x86_64 when using custom base images that only support AMD64.

  ArtifactBucket:
    Type: String
    Description: "S3 bucket containing deployment artifacts"

  ArtifactsBucketKmsKeyArn:
    Type: String
    Default: ""
    Description: >-
      (Optional) KMS CMK ARN used to encrypt the artifacts bucket. When provided,
      the DockerBuildRole and other CodeBuild roles receive kms:Decrypt permission.
    AllowedPattern: "^(|arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/.+)$"

  ArtifactPrefix:
    Type: String
    Description: "S3 prefix for deployment artifacts"

  SourceZipfile:
    Type: String
    Description: "Name of the unified source code zipfile in S3"

  BedrockModelId:
    Type: String
    Description: "Bedrock model id to use for label extraction"
    Default: "us.amazon.nova-pro-v1:0"

  EnableXRayTracing:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Enable X-Ray tracing

  PermissionsBoundaryArn:
    Type: String
    Default: ""
    Description: >-
      (Optional) ARN of an existing IAM Permissions Boundary policy to attach to all IAM roles.
    AllowedPattern: "^(|arn:aws[a-z-]*:iam::[0-9]{12}:policy/.+)$"
    ConstraintDescription: Must be empty or a valid IAM policy ARN

  EnableECRImageScanning:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Enable automatic vulnerability scanning for Lambda container images in ECR

  CustomClassificationModelARN:
    Type: String
    Default: ""

  CustomExtractionModelARN:
    Type: String
    Default: ""

  # Private REST API VPC config (req #2)
  UsePrivateApi:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Set to "true" when ApiGatewayVisibility=PRIVATE — puts processing Lambdas in VPC

  LambdaSubnetIds:
    Type: CommaDelimitedList
    Default: ""
    Description: Subnet IDs for Lambda VpcConfig (required when UsePrivateApi=true)

  LambdaSecurityGroupId:
    Type: String
    Default: ""
    Description: Security group ID for Lambda VpcConfig (required when UsePrivateApi=true)

  VpcId:
    Type: String
    Default: ""
    Description: "Optional - VPC ID for VPC-secured deployment"

  PrivateSubnetIds:
    Type: CommaDelimitedList
    Default: ""
    Description: "Optional - Comma-separated list of private subnet IDs"

  EnableMLflow:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable MLflow experiment tracking integration

  MlflowTrackingURI:
    Type: String
    Default: ""
    Description: SageMaker MLflow tracking server ARN

Conditions:
  DeployInVPC: !Not [!Equals [!Ref VpcId, ""]]
  HasGuardrailConfig:
    !And [
      !Not [!Equals [!Ref BedrockGuardrailId, ""]],
      !Not [!Equals [!Ref BedrockGuardrailVersion, ""]],
    ]
  HasBedrockHubRole:
    !Not [!Equals [!Ref BedrockHubRoleArn, ""]]
  HasBedrockHubRoleExternalId:
    !Not [!Equals [!Ref BedrockHubRoleExternalId, ""]]
  HasBedrockHubRoleSessionName:
    !Not [!Equals [!Ref BedrockHubRoleSessionName, ""]]
  HasCustomClassificationModelARN:
    !Not [!Equals [!Ref CustomClassificationModelARN, ""]]
  HasCustomExtractionModelARN:
    !Not [!Equals [!Ref CustomExtractionModelARN, ""]]
  HasPermissionsBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, ""]]
  IsECRImageScanningEnabled: !Equals [!Ref EnableECRImageScanning, "true"]
  IsPrivateApi: !Equals [!Ref UsePrivateApi, "true"]
  IsMLflowEnabled: !Equals [!Ref EnableMLflow, "true"]
  HasArtifactsBucketKmsKey: !Not [!Equals [!Ref ArtifactsBucketKmsKeyArn, ""]]
  # The stack-scoped BDA-as-OCR project is a Bedrock Data Automation *SYNC*
  # project carrying a `document` block in its standardOutputConfiguration.
  # That shape is only accepted in the commercial partition: GovCloud rejects it
  # with `ValidationException: Sync project does not support video/audio/document
  # modality in Standard Output Configuration` (BDA itself exists in
  # us-gov-west-1 — it is this one project shape that is unsupported), and BDA
  # is absent from aws-cn entirely. Creating it there fails the nested stack and
  # rolls back the whole deployment even when `ocr.backend` is `textract`, so
  # skip the project outside `aws` and let BDA_OCR_PROJECT_ARN be empty — the
  # `bda` OCR backend then errors clearly if it is actually selected, which is
  # the graceful degradation the OCR service already implements.
  ShouldCreateBDAOCRProject: !Equals [!Ref "AWS::Partition", "aws"]

Resources:

  ##########################################################################
  # Configuration Schema and Default Config
  # Uses Pattern-2 schema (superset - includes use_bda toggle for routing)
  ##########################################################################

  UpdateSchemaConfig:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !Ref UpdateConfigurationFunctionArn
      Schema:
        type: object
        required:
          - notes
          - classes
          - classification
          - extraction
        properties:
          notes:
            order: 0
            type: string
            description: Notes
          use_bda:
            order: 1
            type: boolean
            description: Use Bedrock Data Automation (BDA) for OCR, classification, extraction, and assessment
            default: false
          enable_blueprint_optimization:
            order: 1.5
            type: boolean
            description: Automatically optimize BDA blueprints using ground truth data during discovery to improve extraction accuracy
            default: false
            dependsOn: { field: "use_bda", value: true }
          preprocessing:
            order: 2.5
            type: object
            collapsible: true
            defaultExpanded: false
            sectionLabel: Preprocessing
            description: A single generic preprocessing hook (Lambda ARN + args) that runs FIRST, before OCR/BDA routing, in both processing modes.
            properties:
              enabled:
                type: boolean
                description: Run the preprocessing hook for this config version.
                default: false
                order: 0
              arn:
                type: string
                description: >-
                  Lambda function ARN to invoke on the source document. Must
                  either be tagged `idp:feature-id=<anything>` OR have a function
                  name beginning with `GENAIIDP-`.
                order: 1
              onError:
                # `skip-remaining` is deliberately NOT offered: there is only
                # ever one preprocessing hook, so "stop the later hooks at this
                # point" has nothing to act on and behaves exactly like
                # `continue`. The dispatcher still accepts the value if an older
                # config stores it (it falls through to the continue path).
                type: string
                enum: ["continue", "fail"]
                default: continue
                description: >-
                  Behavior when the hook errors. `fail` STOPS the execution in a
                  terminal state and never falls through to processing the
                  un-preprocessed original — use it whenever the hook must gate
                  processing (e.g. PII redaction).
                order: 2
              args:
                type: array
                sectionLabel: Hook arguments
                description: >-
                  Key/value arguments passed to the hook (as strings). The hook
                  reads its own configuration from these — keeping the step
                  generic (e.g. PII Anonymization reads mode/model/redaction here).
                listLabel: Arguments
                itemLabel: Argument
                order: 3
                items:
                  type: object
                  required:
                    - key
                  properties:
                    key:
                      type: string
                      description: Argument name
                      order: 0
                    value:
                      type: string
                      description: Argument value (string)
                      order: 1
              featureId:
                type: string
                description: Feature/owner that provides this hook (label only).
                order: 4
              allowDocumentUpdate:
                type: boolean
                description: >-
                  Allow this hook to return an `updatedDocument` that replaces
                  the source document for the rest of the pipeline. Turn off to
                  pin the hook to observe-only (it can still halt, read the
                  document, and write to S3).
                default: true
                order: 5
          ocr:
            order: 3
            type: object
            collapsible: true
            defaultExpanded: false
            sectionLabel: OCR
            description: "Extracts text from document pages. Enable Textract features (LAYOUT, TABLES, FORMS) or use the BDA backend to add layout, tables, and forms support."
            dependsOn: { field: "use_bda", value: false }
            required:
              - features
            properties:
              image:
                type: object
                sectionLabel: Image Processing Settings
                description: Configure image resolution and processing options for OCR
                order: 0
                properties:
                  dpi:
                    type: number
                    description: "DPI (dots per inch) for extracting images from PDF pages. Higher values produce better quality but larger images. Lowering this below 200 makes Textract likely to silently drop small, faint or skewed characters such as page numbers and hand-filled values. Default: 300"
                    minimum: 72
                    maximum: 300
                    default: 300
                    order: 0
                  target_width:
                    type: number
                    description: "Target image width in pixels. Images larger than this will be resized. If not specified, an automatic ceiling of 2600 pixels is applied as an out-of-memory guard; it does not bind for A4 or US Letter at 300 DPI. Note that lowering this only takes effect if it is smaller than the page rendered at the configured DPI - images are never upscaled."
                    minimum: 100
                    maximum: 3500
                    order: 1
                  target_height:
                    type: number
                    description: "Target image height in pixels. Images larger than this will be resized. If not specified, an automatic ceiling of 3600 pixels is applied as an out-of-memory guard; it does not bind for A4 or US Letter at 300 DPI. Note that lowering this only takes effect if it is smaller than the page rendered at the configured DPI - images are never upscaled."
                    minimum: 100
                    maximum: 3500
                    order: 2
                  preprocessing:
                    type: boolean
                    description: "Apply adaptive binarization preprocessing to improve OCR accuracy on documents with uneven lighting or low contrast. Warning: May slightly increase processing time."
                    default: false
                    order: 3
              backend:
                type: string
                title: OCR backend
                description: >-
                  OCR engine. 'textract' (default): AWS Textract — cheapest for
                  plain text ($1.50/1K pages raw) and best when you need only raw
                  text or already tune specific Textract features (Tables
                  $15/1K, Forms $50/1K). 'bda': Amazon Bedrock Data Automation —
                  flat $10/1K pages returning markdown with tables and layout
                  plus word-level confidence/bounding boxes in one call; choose
                  it for table-aware OCR (enables the extraction table tool) and
                  predictable pricing without composing Textract features.
                  'bedrock': LLM-based OCR. 'none': image-only, no OCR.
                enum: ["textract", "bedrock", "bda", "none"]
                default: "textract"
                order: 1
              model_id:
                type: string
                title: Model
                description: "Bedrock model ID (only used if backend is 'bedrock'). Select 'LambdaHook' to use a custom Lambda function for inference."
                enum:
                  - "LambdaHook"
                  - "us.amazon.nova-lite-v1:0"
                  - "us.amazon.nova-pro-v1:0"
                  - "us.amazon.nova-premier-v1:0"
                  - "us.amazon.nova-2-lite-v1:0"
                  - "us.amazon.nova-2-lite-v1:0:priority"
                  - "us.amazon.nova-2-lite-v1:0:flex"
                  - "global.amazon.nova-2-lite-v1:0"
                  - "global.amazon.nova-2-lite-v1:0:priority"
                  - "global.amazon.nova-2-lite-v1:0:flex"
                  - "us.anthropic.claude-haiku-4-5-20251001-v1:0"
                  - "us.anthropic.claude-sonnet-4-5-20250929-v1:0"
                  - "us.anthropic.claude-sonnet-4-6"
                  - "us.anthropic.claude-sonnet-4-6:1m"
                  - "us.anthropic.claude-sonnet-5"
                  - "us.anthropic.claude-sonnet-5:1m"
                  - "us.anthropic.claude-opus-4-5-20251101-v1:0"
                  - "us.anthropic.claude-opus-4-6-v1"
                  - "us.anthropic.claude-opus-4-6-v1:1m"
                  - "us.anthropic.claude-opus-4-7"
                  - "us.anthropic.claude-opus-4-7:1m"
                  - "us.anthropic.claude-opus-4-8"
                  - "us.anthropic.claude-opus-4-8:1m"
                  - "us.anthropic.claude-opus-5"
                  - "us.anthropic.claude-opus-5:1m"
                  - "openai.gpt-5.4"
                  - "openai.gpt-5.5"
                  - "openai.gpt-5.6-sol"
                  - "openai.gpt-5.6-terra"
                  - "openai.gpt-5.6-luna"
                  - "eu.amazon.nova-lite-v1:0"
                  - "eu.amazon.nova-pro-v1:0"
                  - "eu.amazon.nova-2-lite-v1:0"
                  - "eu.amazon.nova-2-lite-v1:0:priority"
                  - "eu.amazon.nova-2-lite-v1:0:flex"
                  - "eu.anthropic.claude-haiku-4-5-20251001-v1:0"
                  - "eu.anthropic.claude-sonnet-4-5-20250929-v1:0"
                  - "eu.anthropic.claude-sonnet-4-6"
                  - "eu.anthropic.claude-sonnet-4-6:1m"
                  - "eu.anthropic.claude-sonnet-5"
                  - "eu.anthropic.claude-sonnet-5:1m"
                  - "eu.anthropic.claude-opus-4-5-20251101-v1:0"
                  - "eu.anthropic.claude-opus-4-6-v1"
                  - "eu.anthropic.claude-opus-4-6-v1:1m"
                  - "eu.anthropic.claude-opus-4-7"
                  - "eu.anthropic.claude-opus-4-7:1m"
                  - "eu.anthropic.claude-opus-4-8"
                  - "eu.anthropic.claude-opus-4-8:1m"
                  - "eu.anthropic.claude-opus-5"
                  - "eu.anthropic.claude-opus-5:1m"
                  - "qwen.qwen3-vl-235b-a22b"
                  - "us.meta.llama4-maverick-17b-instruct-v1:0"
                  - "us.meta.llama4-scout-17b-instruct-v1:0"
                  - "us.xai.grok-4.6"
                  - "google.gemma-3-27b-it"
                  - "nvidia.nemotron-nano-12b-v2"
                  - "global.amazon.nova-2-lite-v1:0"
                  - "global.anthropic.claude-haiku-4-5-20251001-v1:0"
                  - "global.anthropic.claude-sonnet-4-5-20250929-v1:0"
                  - "global.anthropic.claude-sonnet-4-6:1m"
                  - "global.anthropic.claude-sonnet-5"
                  - "global.anthropic.claude-sonnet-5:1m"
                  - "global.anthropic.claude-opus-4-5-20251101-v1:0"
                  - "global.anthropic.claude-opus-4-6-v1"
                  - "global.anthropic.claude-opus-4-6-v1:1m"
                  - "global.anthropic.claude-opus-4-7"
                  - "global.anthropic.claude-opus-4-7:1m"
                  - "global.anthropic.claude-opus-4-8"
                  - "global.anthropic.claude-opus-4-8:1m"
                  - "global.anthropic.claude-opus-5"
                  - "global.anthropic.claude-opus-5:1m"
                  - "global.xai.grok-4.6"
                order: 2
                dependsOn: { field: "backend", value: "bedrock" }
              model_lambda_hook_arn:
                type: string
                title: Model Lambda hook ARN
                description: "Lambda function ARN for custom inference (used when model_id is 'LambdaHook'). Function name must start with GENAIIDP-."
                default: ""
                order: 3
                dependsOn: { field: "model_id", value: "LambdaHook" }
              reasoning_effort:
                type: string
                title: Reasoning effort
                enum: ["none", "minimal", "low", "medium", "high", "xhigh", "max"]
                default: "medium"
                description: "Reasoning effort for reasoning-capable models: OpenAI GPT-5.x (minimal|low|medium|high), Claude Sonnet 5 / Sonnet 4.6 / Opus 4.5-4.8 / Fable 5 (low|medium|high|xhigh|max), and xAI Grok (none|low|medium|high|xhigh). Controls how much the model reasons before answering. This list is a superset across families; a value your model does not accept is dropped with a warning rather than sent. Higher effort costs more output tokens with little accuracy gain for extraction (measured), so lower is usually better. Ignored by Nova, Sonnet 4.5, and Haiku 4.5."
                order: 4
                dependsOn: { field: "model_id", reasoningCapable: true }
              features:
                type: array
                title: Textract features
                listLabel: "Textract Features"
                itemLabel: "Feature"
                description: "Textract features (only used if backend is 'textract')"
                order: 6
                dependsOn: { field: "backend", values: ["textract"] }
                items:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                      description: "Feature - select one of the supported OCR feature types"
                      enum: ["TABLES", "FORMS", "SIGNATURES", "LAYOUT"]
              system_prompt:
                type: string
                title: System prompt
                format: textarea
                description: "System prompt for Bedrock OCR (only used if backend is 'bedrock')"
                default: "You are an expert OCR system. Extract all text from the provided image accurately, preserving layout where possible."
                order: 8
                dependsOn: { field: "backend", value: "bedrock" }
              task_prompt:
                type: string
                title: Task prompt
                format: textarea
                description: "Task prompt for Bedrock OCR (only used if backend is 'bedrock')"
                default: "Extract all text from this document image. Preserve the layout, including paragraphs, tables, and formatting."
                order: 9
                dependsOn: { field: "backend", value: "bedrock" }
              postHook:
                type: array
                collapsible: true
                defaultExpanded: false
                sectionLabel: Post-step pipeline hooks
                description: >-
                  Lambda functions invoked after this step completes,
                  before the next step runs. Each hook receives the
                  document state and returns a JSON-serializable result
                  (logged for traceability). Hooks let vertical-product
                  packs (claims, loans, etc.) inject business logic
                  without forking the accelerator. Admins can edit, add,
                  reorder, or disable hooks here. The Lambda function
                  ARN must EITHER be tagged with `idp:feature-id=<anything>`
                  (vertical packs do this automatically) OR have a function
                  name starting with `GENAIIDP-` (admin-managed Lambdas).
                  Functions outside both categories will be rejected by
                  the dispatcher's IAM policy at invoke time.
                listLabel: Post-step pipeline hooks
                itemLabel: Hook
                order: 99
                items:
                  type: object
                  required:
                    - featureId
                    - arn
                  properties:
                    featureId:
                      type: string
                      description: Feature that owns this hook (label only)
                      order: 0
                    arn:
                      type: string
                      description: >-
                        Lambda function ARN to invoke. Must either be
                        tagged `idp:feature-id=<anything>` OR have a
                        function name beginning with `GENAIIDP-`.
                      order: 1
                    order:
                      type: number
                      description: Execution order (lower = earlier)
                      default: 100
                      order: 2
                    onError:
                      type: string
                      enum: ["continue", "fail", "skip-remaining"]
                      default: continue
                      description: Behavior when this hook errors
                      order: 3
                    enabled:
                      type: boolean
                      description: Disable without removing
                      default: true
                      order: 4
          classes:
            order: 2
            type: array
            sectionLabel: Class definitions
            listLabel: Classes
            itemLabel: Class
            columns: 2
            items:
              type: object
              required:
                - name
                - description
                - attributes
              properties:
                name:
                  type: string
                  title: Class name
                  description: Class name
                  order: 0
                description:
                  type: string
                  title: Class description
                  description: Class description. Instruct LLM how to identify the class from the context provided in the classification prompt.
                  order: 1
                document_name_regex:
                  type: string
                  title: Document name regex
                  description: "Optional regex pattern to match against document ID/name. When matched, all pages will be classified as this class type without LLM processing. Use only when all pages should be the same class."
                  order: 2
                document_page_content_regex:
                  type: string
                  title: Page content regex
                  description: "Optional regex pattern to match against page content text. When matched during multi-modal page-level classification, the page will be classified as this class type without LLM processing."
                  order: 3
                extraction_model:
                  type: string
                  title: Extraction model override
                  description: "Optional per-class extraction model override. When set, this model is used for extraction instead of the global extraction.model. Useful for classes that benefit from a different model. NOTE: OpenAI GPT-5.x models (openai.gpt-5.*) are NOT compatible with 'advanced' Extraction mode; that combination is rejected by config validation."
                  order: 4
                  enum:
                    - ""
                    - "us.amazon.nova-lite-v1:0"
                    - "us.amazon.nova-pro-v1:0"
                    - "us.amazon.nova-premier-v1:0"
                    - "us.amazon.nova-2-lite-v1:0"
                    - "us.anthropic.claude-haiku-4-5-20251001-v1:0"
                    - "us.anthropic.claude-sonnet-4-5-20250929-v1:0"
                    - "us.anthropic.claude-sonnet-4-6"
                    - "us.anthropic.claude-sonnet-4-6:1m"
                    - "us.anthropic.claude-sonnet-5"
                    - "us.anthropic.claude-sonnet-5:1m"
                    - "us.anthropic.claude-opus-4-5-20251101-v1:0"
                    - "us.anthropic.claude-opus-4-6-v1"
                    - "us.anthropic.claude-opus-4-6-v1:1m"
