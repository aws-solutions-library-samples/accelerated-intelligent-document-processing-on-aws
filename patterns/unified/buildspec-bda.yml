# NOTE: This buildspec is NOT referenced by the main stack (DockerBuildProject
# uses buildspec.yml). Retained as an alternative for BDA-only standalone builds.
version: 0.2
phases:
  pre_build:
    commands:
      - echo "Logging into Amazon ECR..."
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_URI
      - echo "Verifying Docker..."
      - docker --version
      - echo "Setting up Docker buildx for cross-platform builds..."
      - docker buildx create --use --name multiarch-builder --driver docker-container || docker buildx use multiarch-builder
      - docker buildx inspect --bootstrap
  build:
    commands:
      - echo "Building BDA Docker images..."
      - echo "Using IMAGE_VERSION from environment (content-based hash)"
      - echo "Image tag will be $IMAGE_VERSION"
      - export FUNCTION_bda_invoke="patterns/unified/src/bda_invoke_function"
      - export FUNCTION_bda_completion="patterns/unified/src/bda_completion_function"
      - export FUNCTION_bda_processresults="patterns/unified/src/bda_processresults_function"
      - |
        # errexit, because this whole block is ONE CodeBuild command and its exit
        # status is the last loop iteration's. Without it a failed build leaves the
        # phase -- and so the build -- reporting success with an image missing from
        # ECR. Retry first, so a transient registry error does not fail a deploy.
        # See the fuller note in buildspec.yml (#1310).
        set -e

        # Retries are bounded by a DEADLINE as well as by an attempt count, and
        # the deadline is the half that matters. DockerBuildRun is a
        # Custom::CodeBuildRun, so CloudFormation's 60-minute custom-resource
        # ServiceTimeout is the real budget -- and a build that eventually
        # succeeds after burning through it produces exactly the message #1310
        # is about ("CloudFormation did not receive a response from your Custom
        # Resource"), now in the recovering case. 2400s leaves time for the
        # images still queued behind the current one. $SECONDS counts from the
        # start of this shell, which CodeBuild starts at the top of the phase.
        RETRY_DEADLINE_SECONDS="${RETRY_DEADLINE_SECONDS:-2400}"

        build_with_retry() {
          local label="$1"; shift
          local attempt=1 max_attempts=3
          until docker buildx build "$@"; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "ERROR: failed to build/push ${label} after ${max_attempts} attempts"
              return 1
            fi
            if [ "$SECONDS" -ge "$RETRY_DEADLINE_SECONDS" ]; then
              echo "ERROR: failed to build/push ${label}; ${SECONDS}s elapsed is past the ${RETRY_DEADLINE_SECONDS}s retry deadline, so failing now rather than letting the stack operation time out"
              return 1
            fi
            echo "WARNING: build of ${label} failed (attempt ${attempt}/${max_attempts}); retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
            attempt=$((attempt + 1))
          done
        }

        for func_var in FUNCTION_bda_invoke FUNCTION_bda_completion FUNCTION_bda_processresults; do
          func_path="${!func_var}"
          func_name=$(basename "$func_path" | sed 's/_/-/g')
          echo "Building ${func_name} from ${func_path}..."
          DOCKER_PLATFORM="linux/${LAMBDA_ARCHITECTURE:-arm64}"
          if [ "$LAMBDA_ARCHITECTURE" = "x86_64" ]; then
            DOCKER_PLATFORM="linux/amd64"
          fi
          build_with_retry "${func_name}" \
            --platform "$DOCKER_PLATFORM" \
            -f Dockerfile.optimized \
            --build-arg FUNCTION_PATH="${func_path}" \
            --build-arg BASE_IMAGE_SUFFIX="${LAMBDA_ARCHITECTURE:-arm64}" \
            --tag "${ECR_URI}:${func_name}-${IMAGE_VERSION}" \
            --provenance=false \
            --push \
            .
        done
  post_build:
    commands:
      # post_build runs after a FAILED build phase too, so this is guarded rather
      # than unconditional. See the note in buildspec.yml (#1310).
      - |
        if [ "${CODEBUILD_BUILD_SUCCEEDING:-1}" = "1" ]; then
          echo "BDA Docker images built and pushed successfully"
          echo "Images tagged with version ${IMAGE_VERSION}"
        else
          echo "BUILD FAILED — one or more images were not pushed. The actionable error is above, in this log."
        fi
