<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" width="1200" height="530" role="img" aria-labelledby="title desc" font-family="'Amazon Ember', 'Open Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="title">Human-in-the-loop review with review queues</title>
  <desc id="desc">A processed document is held in the Default review queue when HITL and the Default queue are enabled and the document raised confidence alerts; otherwise it completes with its machine output. A Reviewer or Annotator claims the item, or an Admin assigns it, and corrects it in the edit page. Skip returns the item to the queue. Process Changes starts the finalize run, which applies the corrections, and the document completes with the corrected data.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#5f6b7a"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f1b2a" flood-opacity="0.12"/>
    </filter>
    <style>
      .lane { fill: #f8fafc; stroke: #e3e8ef; stroke-width: 1; }
      .lane-label { font-size: 11px; font-weight: 700; letter-spacing: 1.4px; fill: #7a8697; }
      .card { stroke-width: 1.25; filter: url(#shadow); }
      .process { fill: #f2f7fd; stroke: #0972d3; }
      .queue { fill: #f6f1fd; stroke: #7d3ee0; }
      .final { fill: #f2f7fd; stroke: #0972d3; }
      .done { fill: #effaf2; stroke: #037f0c; }
      .neutral { fill: #ffffff; stroke: #8d99a8; }
      .decision { fill: #fff9ee; stroke: #d98c00; stroke-width: 1.25; filter: url(#shadow); }
      .edge { stroke: #5f6b7a; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .title { font-size: 14px; font-weight: 700; fill: #0f1b2a; text-anchor: middle; }
      .sub { font-size: 12px; fill: #4b5563; text-anchor: middle; }
      .q { font-size: 13px; font-weight: 600; fill: #0f1b2a; text-anchor: middle; }
      .pill { fill: #ffffff; stroke: #d5dbe3; stroke-width: 1; }
      .pill-text { font-size: 11.5px; font-weight: 600; fill: #414d5c; text-anchor: middle; }
    </style>
  </defs>

  <!-- Lanes -->
  <rect class="lane" x="16" y="16" width="1168" height="182" rx="14"/>
  <rect class="lane" x="16" y="212" width="1168" height="160" rx="14"/>
  <rect class="lane" x="16" y="386" width="1168" height="128" rx="14"/>
  <text class="lane-label" x="36" y="42">PROCESSING</text>
  <text class="lane-label" x="36" y="238">REVIEW QUEUE</text>
  <text class="lane-label" x="36" y="412">FINALIZE</text>

  <!-- Processing lane -->
  <rect class="card process" x="56" y="90" width="188" height="72" rx="12"/>
  <text class="title" x="150" y="119">Document processed</text>
  <text class="sub" x="150" y="138">OCR, classification,</text>
  <text class="sub" x="150" y="153">extraction, assessment</text>

  <polygon class="decision" points="370,74 452,126 370,178 288,126"/>
  <text class="q" x="370" y="114">HITL and</text>
  <text class="q" x="370" y="130">Default queue</text>
  <text class="q" x="370" y="146">enabled?</text>

  <polygon class="decision" points="610,74 692,126 610,178 528,126"/>
  <text class="q" x="610" y="122">Confidence</text>
  <text class="q" x="610" y="138">alerts?</text>

  <rect class="card neutral" x="840" y="90" width="230" height="72" rx="12"/>
  <text class="title" x="955" y="120">Completed</text>
  <text class="sub" x="955" y="140">with its machine output, no review</text>

  <!-- Review queue lane -->
  <rect class="card queue" x="505" y="258" width="210" height="72" rx="12"/>
  <text class="title" x="610" y="288">Held in the Default queue</text>
  <text class="sub" x="610" y="308">Status: In Review</text>

  <rect class="card queue" x="840" y="250" width="230" height="88" rx="12"/>
  <text class="title" x="955" y="277">Claim and correct</text>
  <text class="sub" x="955" y="297">Reviewer or Annotator claims,</text>
  <text class="sub" x="955" y="312">or an Admin assigns</text>
  <text class="sub" x="955" y="327">Home › Queues and Tasks</text>

  <!-- Finalize lane -->
  <rect class="card final" x="840" y="414" width="230" height="76" rx="12"/>
  <text class="title" x="955" y="440">Finalize run</text>
  <text class="sub" x="955" y="459">Applies the corrections, then re-runs</text>
  <text class="sub" x="955" y="474">summarization, evaluation and hooks</text>

  <rect class="card done" x="505" y="414" width="210" height="76" rx="12"/>
  <text class="title" x="610" y="446">Completed</text>
  <text class="sub" x="610" y="466">with the corrected data</text>

  <!-- Edges -->
  <path class="edge" d="M244,126 H284"/>
  <path class="edge" d="M452,126 H524"/>
  <path class="edge" d="M370,74 V56 H955 V86"/>
  <path class="edge" d="M692,126 H836"/>
  <path class="edge" d="M610,178 V254"/>
  <path class="edge" d="M715,294 H836"/>
  <path class="edge" d="M900,338 C900,362 640,362 640,334"/>
  <path class="edge" d="M955,338 V410"/>
  <path class="edge" d="M840,452 H719"/>

  <!-- Edge labels -->
  <rect class="pill" x="470" y="115" width="36" height="22" rx="11"/>
  <text class="pill-text" x="488" y="130">Yes</text>

  <rect class="pill" x="644" y="45" width="34" height="22" rx="11"/>
  <text class="pill-text" x="661" y="60">No</text>

  <rect class="pill" x="747" y="115" width="34" height="22" rx="11"/>
  <text class="pill-text" x="764" y="130">No</text>

  <rect class="pill" x="592" y="205" width="36" height="22" rx="11"/>
  <text class="pill-text" x="610" y="220">Yes</text>

  <rect class="pill" x="728" y="283" width="96" height="22" rx="11"/>
  <text class="pill-text" x="776" y="298">Claim or assign</text>

  <rect class="pill" x="706" y="347" width="128" height="22" rx="11"/>
  <text class="pill-text" x="770" y="362">Skip: back to queue</text>

  <rect class="pill" x="964" y="363" width="108" height="22" rx="11"/>
  <text class="pill-text" x="1018" y="378">Process Changes</text>
</svg>
