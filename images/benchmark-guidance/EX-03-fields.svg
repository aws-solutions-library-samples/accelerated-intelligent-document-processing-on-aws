<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="792" height="410" viewBox="0 0 792 410" role="img"><title>Higher reasoning effort adds a little accuracy for a little cost</title><desc>RealKIE invoices, 20 × 3 runs: Low (default) 79% at $136 per 1,000 documents, Medium 81% at $141 per 1,000 documents, High 83% at $149 per 1,000 documents; Fake-W2 forms, 20 × 3 runs: Low (default) 95% at $33.3 per 1,000 documents, Medium 97% at $36.8 per 1,000 documents, High 97% at $40.8 per 1,000 documents; RealKIE invoices, 20 × 3 runs, marginal cost of error against Low (default): Medium no measurable gain, High no measurable gain; Fake-W2 forms, 20 × 3 runs, marginal cost of error against Low (default): Medium no measurable gain, High no measurable gain</desc><style>
  .viz { --series: #2a78d6; --ring: #ffffff; --ink: #0b0b0b; --ink-2: #52514e;
         --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7;
         --fam-nova: #2a78d6; --fam-claude: #eb6834; --fam-other: #1baf7a; }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz, svg.viz:root { --series: #3987e5;
      --ring: #17181c; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835;
      --fam-nova: #3987e5; --fam-claude: #d95926; --fam-other: #199e70; }
  }
  :root[data-theme="dark"] .viz { --series: #3987e5; --ring: #17181c; --ink: #f0efec;
    --ink-2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835;
    --fam-nova: #3987e5; --fam-claude: #d95926; --fam-other: #199e70; }
  .viz { max-width: 100%; height: auto; }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .viz .ctitle { font-size: 15px; font-weight: 600; fill: var(--ink); }
  .panel { font-size: 13px; font-weight: 600; fill: var(--ink); }
  .sub { font-size: 12px; fill: var(--muted); }
  .viz .lead { font-size: 12px; fill: var(--ink); }
  .label { font-size: 12px; fill: var(--ink-2); }
  .viz .plabel { font-size: 12px; fill: var(--ink-2); }
  .viz .plabel.dflt { fill: var(--ink); font-weight: 600; }
  .tick { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .none { font-size: 12px; fill: var(--muted); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .viz .gap { fill: var(--ring); }
  .viz .leader { stroke: var(--muted); stroke-width: 1; }
  .band { fill: var(--series); opacity: 0.12; }
  .dot { fill: var(--series); stroke: var(--ring); stroke-width: 2; }
  .axislabel { font-size: 12px; fill: var(--ink-2); }
  .prices { font-size: 10px; fill: var(--muted); }
  .num { font-size: 11px; font-weight: 700; fill: var(--ink); }
  .halo { paint-order: stroke; stroke: var(--ring); stroke-width: 3px;
          stroke-linejoin: round; }
  .mcoe { stroke: var(--ink-2); stroke-width: 1; fill: none; }
  .mcoelabel { font-size: 11px; fill: var(--ink-2); }
  .viz .ptitle { font-size: 12px; font-weight: 600; fill: var(--ink); }
  .viz .fam-nova { fill: var(--fam-nova); }
  .viz .fam-claude { fill: var(--fam-claude); }
  .viz .fam-other { fill: var(--fam-other); }
  .viz .baseline { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 5 4; }
  .viz .baselinelabel { font-size: 11px; fill: var(--ink-2); }
</style><text class="ctitle" x="0" y="18.0">Higher reasoning effort adds a little accuracy for a little cost</text><text class="sub" x="0" y="38.0">Varies: reasoning effort · Fixed: extraction on Claude Sonnet 5</text><g transform="translate(0.0 50.0)"><text class="ptitle" x="0" y="14">RealKIE invoices, 20 × 3 runs</text><text class="axislabel" x="0" y="33">Weighted accuracy (%) ↑</text><line class="grid" x1="46" x2="360.0" y1="294.0" y2="294.0"/><text class="tick" x="38" y="298.0" text-anchor="end">70%</text><line class="grid" x1="46" x2="360.0" y1="210.7" y2="210.7"/><text class="tick" x="38" y="214.7" text-anchor="end">80%</text><line class="grid" x1="46" x2="360.0" y1="127.3" y2="127.3"/><text class="tick" x="38" y="131.3" text-anchor="end">90%</text><line class="grid" x1="46" x2="360.0" y1="44.0" y2="44.0"/><text class="tick" x="38" y="48.0" text-anchor="end">100%</text><text class="tick" x="46.0" y="310" text-anchor="middle">$0</text><text class="tick" x="124.5" y="310" text-anchor="middle">$50</text><text class="tick" x="203.0" y="310" text-anchor="middle">$100</text><text class="tick" x="281.5" y="310" text-anchor="middle">$150</text><text class="tick" x="360.0" y="310" text-anchor="middle">$200</text><line class="axis" x1="46" x2="360.0" y1="294" y2="294"/><line class="axis" x1="46" x2="46" y1="44" y2="294"/><text class="axislabel" x="203.0" y="330" text-anchor="middle">Cost per 1,000 documents ($) — cheaper ←</text><rect class="band" x="254.7" y="164.4" width="10" height="106.0" rx="5"/><rect class="band" x="263.1" y="144.4" width="10" height="111.8" rx="5"/><rect class="band" x="274.8" y="128.4" width="10" height="109.6" rx="5"/><g><title>Low (default): Weighted accuracy 79% ± 6%, $136 per 1,000 documents</title><circle class="dot" cx="259.7" cy="217.4" r="5"/></g><g><title>Medium: Weighted accuracy 81% ± 7%, $141 per 1,000 documents</title><circle class="dot" cx="268.1" cy="200.3" r="5"/></g><g><title>High: Weighted accuracy 83% ± 7%, $149 per 1,000 documents</title><circle class="dot" cx="279.8" cy="183.2" r="5"/></g><text class="plabel halo" x="289.8" y="187.2" text-anchor="start">High</text><text class="plabel halo" x="276.1" y="217.3" text-anchor="start">Medium</text><text class="plabel dflt halo" x="249.7" y="221.4" text-anchor="end">Low (default)</text></g><g transform="translate(410.0 50.0)"><text class="ptitle" x="0" y="14">Fake-W2 forms, 20 × 3 runs</text><text class="axislabel" x="0" y="33">Weighted accuracy (%) ↑</text><line class="grid" x1="46" x2="360.0" y1="294.0" y2="294.0"/><text class="tick" x="38" y="298.0" text-anchor="end">70%</text><line class="grid" x1="46" x2="360.0" y1="210.7" y2="210.7"/><text class="tick" x="38" y="214.7" text-anchor="end">80%</text><line class="grid" x1="46" x2="360.0" y1="127.3" y2="127.3"/><text class="tick" x="38" y="131.3" text-anchor="end">90%</text><line class="grid" x1="46" x2="360.0" y1="44.0" y2="44.0"/><text class="tick" x="38" y="48.0" text-anchor="end">100%</text><text class="tick" x="46.0" y="310" text-anchor="middle">$0</text><text class="tick" x="124.5" y="310" text-anchor="middle">$50</text><text class="tick" x="203.0" y="310" text-anchor="middle">$100</text><text class="tick" x="281.5" y="310" text-anchor="middle">$150</text><text class="tick" x="360.0" y="310" text-anchor="middle">$200</text><line class="axis" x1="46" x2="360.0" y1="294" y2="294"/><line class="axis" x1="46" x2="46" y1="44" y2="294"/><text class="axislabel" x="203.0" y="330" text-anchor="middle">Cost per 1,000 documents ($) — cheaper ←</text><rect class="band" x="93.3" y="69.6" width="10" height="31.0" rx="5"/><rect class="band" x="98.8" y="63.1" width="10" height="14.0" rx="5"/><rect class="band" x="105.0" y="61.8" width="10" height="13.3" rx="5"/><line class="leader" x1="117.0" y1="68.2" x2="134.0" y2="67.5"/><line class="leader" x1="110.8" y1="70.1" x2="134.0" y2="70.1"/><line class="leader" x1="105.3" y1="85.1" x2="134.0" y2="85.1"/><g><title>Low (default): Weighted accuracy 95% ± 2%, $33.3 per 1,000 documents</title><circle class="dot" cx="98.3" cy="85.1" r="5"/></g><g><title>Medium: Weighted accuracy 97% ± 1%, $36.8 per 1,000 documents</title><circle class="dot" cx="103.8" cy="70.1" r="5"/></g><g><title>High: Weighted accuracy 97% ± 1%, $40.8 per 1,000 documents</title><circle class="dot" cx="110.0" cy="68.5" r="5"/></g><text class="plabel halo" x="136.0" y="63.5" text-anchor="start">High</text><text class="plabel halo" x="136.0" y="78.5" text-anchor="start">Medium</text><text class="plabel dflt halo" x="136.0" y="93.5" text-anchor="start">Low (default)</text></g><text class="prices" x="0" y="405.0">Prices: on-demand, us-east-1, config_library/pricing.yaml as of 2026-11-13</text></svg>
