<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="792" height="462" viewBox="0 0 792 462" role="img"><title>With Claude Sonnet 5.5, more reasoning effort adds cost, not accuracy</title><desc>RealKIE invoices, 20 documents × 3 runs: Low (preset default) 83% at $85.7 per 1,000 documents, Medium 83% at $87.1 per 1,000 documents, High 82% at $90.5 per 1,000 documents; Baseline setup, except extraction on Claude Sonnet 5.5: Amazon Textract with Layout only; holistic classification reading text and page images, single-pass extraction with structured output, and confidence scoring, all on Claude Haiku 5.5, with no escalation to a second scoring model.</desc><style>
  .viz { --series: #2a78d6; --ring: #ffffff; --ink: #0b0b0b; --ink-2: #52514e;
         --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7;
         --fam-nova: #2a78d6; --fam-claude: #eb6834; --fam-other: #1baf7a; }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz, svg.viz:root { --series: #3987e5;
      --ring: #17181c; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835;
      --fam-nova: #3987e5; --fam-claude: #d95926; --fam-other: #199e70; }
  }
  :root[data-theme="dark"] .viz { --series: #3987e5; --ring: #17181c; --ink: #f0efec;
    --ink-2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835;
    --fam-nova: #3987e5; --fam-claude: #d95926; --fam-other: #199e70; }
  .viz { max-width: 100%; height: auto; }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .viz .ctitle { font-size: 15px; font-weight: 600; fill: var(--ink); }
  .panel { font-size: 13px; font-weight: 600; fill: var(--ink); }
  .sub { font-size: 12px; fill: var(--muted); }
  .viz .lead { font-size: 12px; fill: var(--ink); }
  .label { font-size: 12px; fill: var(--ink-2); }
  .viz .plabel { font-size: 12px; fill: var(--ink-2); }
  .viz .plabel.dflt, .viz .plabel .dflt { fill: var(--ink); font-weight: 700; }
  .viz .dot.ref { stroke: var(--ink); stroke-width: 1.5; }
  .tick { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .none { font-size: 12px; fill: var(--muted); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--ink-2); stroke-width: 1; }
  .viz .gap { fill: var(--ring); }
  .viz .leader { stroke: var(--muted); stroke-width: 1; }
  .band { fill: var(--series); opacity: 0.12; }
  .dot { fill: var(--series); stroke: var(--ring); stroke-width: 2; }
  .axislabel { font-size: 12px; fill: var(--ink-2); }
  .prices { font-size: 10px; fill: var(--muted); }
  .num { font-size: 11px; font-weight: 700; fill: var(--ink); }
  .halo { paint-order: stroke; stroke: var(--ring); stroke-width: 3px;
          stroke-linejoin: round; }
  .mcoe { stroke: var(--ink-2); stroke-width: 1; fill: none; }
  .mcoelabel { font-size: 11px; fill: var(--ink-2); }
  .viz .ptitle { font-size: 12px; font-weight: 600; fill: var(--ink); }
  .viz .fam-nova { fill: var(--fam-nova); }
  .viz .fam-claude { fill: var(--fam-claude); }
  .viz .fam-other { fill: var(--fam-other); }
  .viz .baseline { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 5 4; }
  .viz .baselinelabel { font-size: 11px; fill: var(--ink-2); }
</style><text class="ctitle" x="0" y="18.0" fill="#0b0b0b">With Claude Sonnet 5.5, more reasoning effort adds cost, not accuracy</text><text class="sub" x="0" y="38.0" fill="#898781">RealKIE invoices, 20 documents × 3 runs · Varies: reasoning effort · Claude Haiku 5.5 takes no effort setting ·</text><text class="sub" x="0" y="54.0" fill="#898781">Everything else: baseline setup</text><g transform="translate(0.0 66.0)"><text class="axislabel" x="42" y="13" fill="#52514e">Weighted accuracy (%) ↑</text><line class="grid" x1="46" x2="770" y1="294.0" y2="294.0" stroke="#e1e0d9"/><line class="axis" x1="42" x2="46" y1="294.0" y2="294.0" stroke="#52514e"/><text class="tick" x="39" y="298.0" text-anchor="end" fill="#898781">70%</text><line class="grid" x1="46" x2="770" y1="204.0" y2="204.0" stroke="#e1e0d9"/><line class="axis" x1="42" x2="46" y1="204.0" y2="204.0" stroke="#52514e"/><text class="tick" x="39" y="208.0" text-anchor="end" fill="#898781">80%</text><line class="grid" x1="46" x2="770" y1="114.0" y2="114.0" stroke="#e1e0d9"/><line class="axis" x1="42" x2="46" y1="114.0" y2="114.0" stroke="#52514e"/><text class="tick" x="39" y="118.0" text-anchor="end" fill="#898781">90%</text><line class="grid" x1="46" x2="770" y1="24.0" y2="24.0" stroke="#e1e0d9"/><line class="axis" x1="42" x2="46" y1="24.0" y2="24.0" stroke="#52514e"/><text class="tick" x="39" y="28.0" text-anchor="end" fill="#898781">100%</text><line class="axis" x1="46.0" x2="46.0" y1="294" y2="298" stroke="#52514e"/><text class="tick" x="46.0" y="310" text-anchor="middle" fill="#898781">$0</text><line class="axis" x1="190.8" x2="190.8" y1="294" y2="298" stroke="#52514e"/><text class="tick" x="190.8" y="310" text-anchor="middle" fill="#898781">$20</text><line class="axis" x1="335.6" x2="335.6" y1="294" y2="298" stroke="#52514e"/><text class="tick" x="335.6" y="310" text-anchor="middle" fill="#898781">$40</text><line class="axis" x1="480.4" x2="480.4" y1="294" y2="298" stroke="#52514e"/><text class="tick" x="480.4" y="310" text-anchor="middle" fill="#898781">$60</text><line class="axis" x1="625.2" x2="625.2" y1="294" y2="298" stroke="#52514e"/><text class="tick" x="625.2" y="310" text-anchor="middle" fill="#898781">$80</text><line class="axis" x1="770.0" x2="770.0" y1="294" y2="298" stroke="#52514e"/><text class="tick" x="770.0" y="310" text-anchor="middle" fill="#898781">$100</text><line class="axis" x1="46" x2="770" y1="294" y2="294" stroke="#52514e"/><line class="axis" x1="46" x2="46" y1="24" y2="294" stroke="#52514e"/><text class="axislabel" x="408.0" y="330" text-anchor="middle" fill="#52514e">Cost per 1,000 documents ($) — cheaper ←</text><rect class="band" x="661.7" y="118.3" width="10" height="122.7" rx="5" fill="#2a78d6"/><rect class="band" x="671.5" y="116.1" width="10" height="122.8" rx="5" fill="#2a78d6"/><rect class="band" x="696.5" y="123.1" width="10" height="122.4" rx="5" fill="#2a78d6"/><g><title>Low (preset default): Weighted accuracy 83% ± 7%, $85.7 per 1,000 documents</title><circle class="dot ref" cx="666.7" cy="179.7" r="5" fill="#2a78d6" stroke="#0b0b0b"/></g><g><title>Medium: Weighted accuracy 83% ± 7%, $87.1 per 1,000 documents</title><circle class="dot" cx="676.5" cy="177.5" r="5" fill="#2a78d6" stroke="#ffffff"/></g><g><title>High: Weighted accuracy 82% ± 7%, $90.5 per 1,000 documents</title><circle class="dot" cx="701.5" cy="184.3" r="5" fill="#2a78d6" stroke="#ffffff"/></g><text class="plabel halo" x="656.7" y="183.7" text-anchor="end" fill="#52514e" stroke="#ffffff"><tspan class="dflt" fill="#0b0b0b">Low (preset default)</tspan>, Medium</text><text class="plabel halo" x="711.5" y="188.3" text-anchor="start" fill="#52514e" stroke="#ffffff">High</text></g><text class="prices" x="0" y="425.0" fill="#898781">Baseline setup, except extraction on Claude Sonnet 5.5: Amazon Textract with Layout only; holistic classification reading text and page images, single-pass</text><text class="prices" x="0" y="439.0" fill="#898781">extraction with structured output, and confidence scoring, all on Claude Haiku 5.5, with no escalation to a second scoring model.</text><text class="prices" x="0" y="457.0" fill="#898781">Prices: on-demand, us-east-1, config_library/pricing.yaml as of 2026-11-18</text></svg>
