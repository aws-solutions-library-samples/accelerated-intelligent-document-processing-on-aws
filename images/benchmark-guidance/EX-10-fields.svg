<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="792" height="524" viewBox="0 0 792 524" role="img"><title>Validation and coercion change nothing measurable; keep them on</title><desc>RealKIE invoices, 20 documents × 3 runs: On · Haiku 5.5 (baseline setup) 81% at $24.1 per 1,000 documents, On · Sonnet 5.5 82% at $87.8 per 1,000 documents, On · Opus 5.5 83% at $153 per 1,000 documents, On · Nova 2 Lite 76% at $26.8 per 1,000 documents, Off · Haiku 5.5 81% at $22.9 per 1,000 documents, Off · Sonnet 5.5 83% at $87.8 per 1,000 documents, Off · Opus 5.5 82% at $149 per 1,000 documents, Off · Nova 2 Lite 75% at $24.8 per 1,000 documents; Baseline setup: Amazon Textract with Layout only; holistic classification reading text and page images, single-pass extraction with structured output, and confidence scoring, all on Claude Haiku 5.5, with no escalation to a second scoring model.</desc><style>
