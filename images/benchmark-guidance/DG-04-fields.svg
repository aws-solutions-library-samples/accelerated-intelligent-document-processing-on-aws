<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="792" height="410" viewBox="0 0 792 410" role="img"><title>200 DPI scored like 300 DPI; 150 DPI slipped slightly</title><desc>RealKIE invoices, 20 × 3 runs: 300 DPI (default) 81% at $143 per 1,000 documents, 200 DPI 82% at $134 per 1,000 documents, 150 DPI 79% at $119 per 1,000 documents; RealKIE invoices, 20 × 3 runs, marginal cost of error against 150 DPI: 300 DPI (default) no measurable gain, 200 DPI no measurable gain</desc><style>
  .viz { --series: #2a78d6; --ring: #ffffff; --ink: #0b0b0b; --ink-2: #52514e;
         --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7;
         --fam-nova: #2a78d6; --fam-claude: #eb6834; --fam-other: #1baf7a; }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz, svg.viz:root { --series: #3987e5;
      --ring: #17181c; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835;
      --fam-nova: #3987e5; --fam-claude: #d95926; --fam-other: #199e70; }
  }
  :root[data-theme="dark"] .viz { --series: #3987e5; --ring: #17181c; --ink: #f0efec;
    --ink-2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835;
    --fam-nova: #3987e5; --fam-claude: #d95926; --fam-other: #199e70; }
  .viz { max-width: 100%; height: auto; }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .viz .ctitle { font-size: 15px; font-weight: 600; fill: var(--ink); }
  .panel { font-size: 13px; font-weight: 600; fill: var(--ink); }
  .sub { font-size: 12px; fill: var(--muted); }
  .viz .lead { font-size: 12px; fill: var(--ink); }
  .label { font-size: 12px; fill: var(--ink-2); }
  .viz .plabel { font-size: 12px; fill: var(--ink-2); }
  .viz .plabel.dflt { fill: var(--ink); font-weight: 600; }
  .tick { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .none { font-size: 12px; fill: var(--muted); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .viz .gap { fill: var(--ring); }
  .viz .leader { stroke: var(--muted); stroke-width: 1; }
  .band { fill: var(--series); opacity: 0.12; }
  .dot { fill: var(--series); stroke: var(--ring); stroke-width: 2; }
  .axislabel { font-size: 12px; fill: var(--ink-2); }
  .prices { font-size: 10px; fill: var(--muted); }
  .num { font-size: 11px; font-weight: 700; fill: var(--ink); }
  .halo { paint-order: stroke; stroke: var(--ring); stroke-width: 3px;
          stroke-linejoin: round; }
  .mcoe { stroke: var(--ink-2); stroke-width: 1; fill: none; }
  .mcoelabel { font-size: 11px; fill: var(--ink-2); }
  .viz .ptitle { font-size: 12px; font-weight: 600; fill: var(--ink); }
  .viz .fam-nova { fill: var(--fam-nova); }
  .viz .fam-claude { fill: var(--fam-claude); }
  .viz .fam-other { fill: var(--fam-other); }
  .viz .baseline { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 5 4; }
  .viz .baselinelabel { font-size: 11px; fill: var(--ink-2); }
</style><text class="ctitle" x="0" y="18.0">200 DPI scored like 300 DPI; 150 DPI slipped slightly</text><text class="sub" x="0" y="38.0">RealKIE invoices, 20 × 3 runs · Varies: page resolution · Fixed: OCR on Amazon Textract (Tables, Layout, Signatures)</text><g transform="translate(0.0 50.0)"><text class="axislabel" x="0" y="13">Weighted accuracy (%) ↑</text><line class="grid" x1="46" x2="770" y1="294.0" y2="294.0"/><text class="tick" x="38" y="298.0" text-anchor="end">70%</text><line class="grid" x1="46" x2="770" y1="204.0" y2="204.0"/><text class="tick" x="38" y="208.0" text-anchor="end">80%</text><line class="grid" x1="46" x2="770" y1="114.0" y2="114.0"/><text class="tick" x="38" y="118.0" text-anchor="end">90%</text><line class="grid" x1="46" x2="770" y1="24.0" y2="24.0"/><text class="tick" x="38" y="28.0" text-anchor="end">100%</text><text class="tick" x="60.0" y="310" text-anchor="middle">$110</text><text class="tick" x="237.5" y="310" text-anchor="middle">$120</text><text class="tick" x="415.0" y="310" text-anchor="middle">$130</text><text class="tick" x="592.5" y="310" text-anchor="middle">$140</text><text class="tick" x="770.0" y="310" text-anchor="middle">$150</text><line class="axis" x1="46" x2="770" y1="294" y2="294"/><line class="axis" x1="46" x2="46" y1="24" y2="294"/><text class="axislabel" x="408.0" y="330" text-anchor="middle">Cost per 1,000 documents ($) — cheaper ←</text><rect class="gap" x="49.0" y="288" width="8" height="12"/><line class="axis" x1="48.0" y1="298" x2="52.0" y2="290"/><line class="axis" x1="54.0" y1="298" x2="58.0" y2="290"/><rect class="band" x="644.6" y="142.2" width="10" height="111.6" rx="5"/><rect class="band" x="478.2" y="129.5" width="10" height="119.6" rx="5"/><rect class="band" x="210.4" y="149.9" width="10" height="130.4" rx="5"/><g><title>300 DPI (default): Weighted accuracy 81% ± 6%, $143 per 1,000 documents</title><circle class="dot" cx="649.6" cy="197.9" r="5"/></g><g><title>200 DPI: Weighted accuracy 82% ± 7%, $134 per 1,000 documents</title><circle class="dot" cx="483.2" cy="189.3" r="5"/></g><g><title>150 DPI: Weighted accuracy 79% ± 7%, $119 per 1,000 documents</title><circle class="dot" cx="215.4" cy="215.1" r="5"/></g><text class="plabel halo" x="493.2" y="193.3" text-anchor="start">200 DPI</text><text class="plabel dflt halo" x="649.6" y="186.9" text-anchor="middle">300 DPI (default)</text><text class="plabel halo" x="225.4" y="219.1" text-anchor="start">150 DPI</text></g><text class="prices" x="0" y="405.0">Prices: on-demand, us-east-1, config_library/pricing.yaml as of 2026-11-13</text></svg>
