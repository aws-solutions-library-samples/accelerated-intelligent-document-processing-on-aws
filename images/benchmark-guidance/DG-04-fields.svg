<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="792" height="446" viewBox="0 0 792 446" role="img"><title>With Claude Haiku 5.5, lower resolution saved nothing; keep 300 DPI</title><desc>RealKIE invoices, 20 documents × 3 runs: 300 DPI (preset default) 81% at $22.1 per 1,000 documents, 200 DPI 81% at $26.0 per 1,000 documents, 150 DPI 77% at $23.8 per 1,000 documents; Baseline setup: Amazon Textract with Layout only; holistic classification reading text and page images, single-pass extraction with structured output, and confidence scoring, all on Claude Haiku 5.5, with no escalation to a second scoring model.</desc><style>
  .viz { --series: #2a78d6; --ring: #ffffff; --ink: #0b0b0b; --ink-2: #52514e;
         --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7;
         --fam-nova: #2a78d6; --fam-claude: #eb6834; --fam-other: #1baf7a; }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz, svg.viz:root { --series: #3987e5;
      --ring: #17181c; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835;
      --fam-nova: #3987e5; --fam-claude: #d95926; --fam-other: #199e70; }
  }
  :root[data-theme="dark"] .viz { --series: #3987e5; --ring: #17181c; --ink: #f0efec;
    --ink-2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835;
    --fam-nova: #3987e5; --fam-claude: #d95926; --fam-other: #199e70; }
  .viz { max-width: 100%; height: auto; }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .viz .ctitle { font-size: 15px; font-weight: 600; fill: var(--ink); }
  .panel { font-size: 13px; font-weight: 600; fill: var(--ink); }
  .sub { font-size: 12px; fill: var(--muted); }
  .viz .lead { font-size: 12px; fill: var(--ink); }
  .label { font-size: 12px; fill: var(--ink-2); }
  .viz .plabel { font-size: 12px; fill: var(--ink-2); }
  .viz .plabel.dflt, .viz .plabel .dflt { fill: var(--ink); font-weight: 700; }
  .viz .dot.ref { stroke: var(--ink); stroke-width: 1.5; }
  .tick { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .none { font-size: 12px; fill: var(--muted); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--ink-2); stroke-width: 1; }
  .viz .gap { fill: var(--ring); }
  .viz .leader { stroke: var(--muted); stroke-width: 1; }
  .band { fill: var(--series); opacity: 0.12; }
  .dot { fill: var(--series); stroke: var(--ring); stroke-width: 2; }
  .axislabel { font-size: 12px; fill: var(--ink-2); }
  .prices { font-size: 10px; fill: var(--muted); }
  .num { font-size: 11px; font-weight: 700; fill: var(--ink); }
  .halo { paint-order: stroke; stroke: var(--ring); stroke-width: 3px;
          stroke-linejoin: round; }
  .mcoe { stroke: var(--ink-2); stroke-width: 1; fill: none; }
  .mcoelabel { font-size: 11px; fill: var(--ink-2); }
  .viz .ptitle { font-size: 12px; font-weight: 600; fill: var(--ink); }
  .viz .fam-nova { fill: var(--fam-nova); }
  .viz .fam-claude { fill: var(--fam-claude); }
  .viz .fam-other { fill: var(--fam-other); }
  .viz .baseline { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 5 4; }
  .viz .baselinelabel { font-size: 11px; fill: var(--ink-2); }
</style><text class="ctitle" x="0" y="18.0" fill="#0b0b0b">With Claude Haiku 5.5, lower resolution saved nothing; keep 300 DPI</text><text class="sub" x="0" y="38.0" fill="#898781">RealKIE invoices, 20 documents × 3 runs · Varies: page resolution · Everything else: baseline setup</text><g transform="translate(0.0 50.0)"><text class="axislabel" x="42" y="13" fill="#52514e">Weighted accuracy (%) ↑</text><line class="grid" x1="46" x2="770" y1="294.0" y2="294.0" stroke="#e1e0d9"/><line class="axis" x1="42" x2="46" y1="294.0" y2="294.0" stroke="#52514e"/><text class="tick" x="39" y="298.0" text-anchor="end" fill="#898781">60%</text><line class="grid" x1="46" x2="770" y1="226.5" y2="226.5" stroke="#e1e0d9"/><line class="axis" x1="42" x2="46" y1="226.5" y2="226.5" stroke="#52514e"/><text class="tick" x="39" y="230.5" text-anchor="end" fill="#898781">70%</text><line class="grid" x1="46" x2="770" y1="159.0" y2="159.0" stroke="#e1e0d9"/><line class="axis" x1="42" x2="46" y1="159.0" y2="159.0" stroke="#52514e"/><text class="tick" x="39" y="163.0" text-anchor="end" fill="#898781">80%</text><line class="grid" x1="46" x2="770" y1="91.5" y2="91.5" stroke="#e1e0d9"/><line class="axis" x1="42" x2="46" y1="91.5" y2="91.5" stroke="#52514e"/><text class="tick" x="39" y="95.5" text-anchor="end" fill="#898781">90%</text><line class="grid" x1="46" x2="770" y1="24.0" y2="24.0" stroke="#e1e0d9"/><line class="axis" x1="42" x2="46" y1="24.0" y2="24.0" stroke="#52514e"/><text class="tick" x="39" y="28.0" text-anchor="end" fill="#898781">100%</text><line class="axis" x1="46.0" x2="46.0" y1="294" y2="298" stroke="#52514e"/><text class="tick" x="46.0" y="310" text-anchor="middle" fill="#898781">$0</text><line class="axis" x1="166.7" x2="166.7" y1="294" y2="298" stroke="#52514e"/><text class="tick" x="166.7" y="310" text-anchor="middle" fill="#898781">$5</text><line class="axis" x1="287.3" x2="287.3" y1="294" y2="298" stroke="#52514e"/><text class="tick" x="287.3" y="310" text-anchor="middle" fill="#898781">$10</text><line class="axis" x1="408.0" x2="408.0" y1="294" y2="298" stroke="#52514e"/><text class="tick" x="408.0" y="310" text-anchor="middle" fill="#898781">$15</text><line class="axis" x1="528.7" x2="528.7" y1="294" y2="298" stroke="#52514e"/><text class="tick" x="528.7" y="310" text-anchor="middle" fill="#898781">$20</text><line class="axis" x1="649.3" x2="649.3" y1="294" y2="298" stroke="#52514e"/><text class="tick" x="649.3" y="310" text-anchor="middle" fill="#898781">$25</text><line class="axis" x1="770.0" x2="770.0" y1="294" y2="298" stroke="#52514e"/><text class="tick" x="770.0" y="310" text-anchor="middle" fill="#898781">$30</text><line class="axis" x1="46" x2="770" y1="294" y2="294" stroke="#52514e"/><line class="axis" x1="46" x2="46" y1="24" y2="294" stroke="#52514e"/><text class="axislabel" x="408.0" y="330" text-anchor="middle" fill="#52514e">Cost per 1,000 documents ($) — cheaper ←</text><rect class="band" x="575.0" y="102.9" width="10" height="100.3" rx="5" fill="#2a78d6"/><rect class="band" x="669.5" y="102.2" width="10" height="98.1" rx="5" fill="#2a78d6"/><rect class="band" x="614.6" y="128.1" width="10" height="104.1" rx="5" fill="#2a78d6"/><line class="leader" x1="624.6" y1="185.1" x2="647.6" y2="208.1" stroke="#898781"/><g><title>300 DPI (preset default): Weighted accuracy 81% ± 7%, $22.1 per 1,000 documents</title><circle class="dot ref" cx="580.0" cy="153.0" r="5" fill="#2a78d6" stroke="#0b0b0b"/></g><g><title>200 DPI: Weighted accuracy 81% ± 7%, $26.0 per 1,000 documents</title><circle class="dot" cx="674.5" cy="151.2" r="5" fill="#2a78d6" stroke="#ffffff"/></g><g><title>150 DPI: Weighted accuracy 77% ± 8%, $23.8 per 1,000 documents</title><circle class="dot" cx="619.6" cy="180.1" r="5" fill="#2a78d6" stroke="#ffffff"/></g><text class="plabel halo" x="684.5" y="155.2" text-anchor="start" fill="#52514e" stroke="#ffffff">200 DPI</text><text class="plabel dflt halo" x="570.0" y="157.0" text-anchor="end" fill="#0b0b0b" stroke="#ffffff">300 DPI (preset default)</text><text class="plabel halo" x="649.6" y="220.1" text-anchor="start" fill="#52514e" stroke="#ffffff">150 DPI</text></g><text class="prices" x="0" y="409.0" fill="#898781">Baseline setup: Amazon Textract with Layout only; holistic classification reading text and page images, single-pass extraction with structured output, and</text><text class="prices" x="0" y="423.0" fill="#898781">confidence scoring, all on Claude Haiku 5.5, with no escalation to a second scoring model.</text><text class="prices" x="0" y="441.0" fill="#898781">Prices: on-demand, us-east-1, config_library/pricing.yaml as of 2026-11-18</text></svg>
