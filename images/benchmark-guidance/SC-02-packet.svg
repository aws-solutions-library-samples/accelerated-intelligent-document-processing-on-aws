<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="792" height="446" viewBox="0 0 792 446" role="img"><title>With Claude Haiku 5.5, text alone gets the most sections right, for the least</title><desc>DocSplit packets, 19–20 packets × 3 runs: Text and images (baseline) 76% at $23.1 classification cost per 1,000 packets, Text only 88% at $2.55 classification cost per 1,000 packets, Images only 74% at $9.13 classification cost per 1,000 packets; Baseline setup: Amazon Textract with Layout only; holistic classification reading text and page images, single-pass extraction with structured output, and confidence scoring, all on Claude Haiku 5.5, with no escalation to a second scoring model.</desc><style>
  .viz { --series: #2a78d6; --ring: #ffffff; --ink: #0b0b0b; --ink-2: #52514e;
         --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7;
         --fam-nova: #2a78d6; --fam-claude: #eb6834; --fam-other: #1baf7a; }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz, svg.viz:root { --series: #3987e5;
      --ring: #17181c; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835;
      --fam-nova: #3987e5; --fam-claude: #d95926; --fam-other: #199e70; }
  }
  :root[data-theme="dark"] .viz { --series: #3987e5; --ring: #17181c; --ink: #f0efec;
    --ink-2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835;
    --fam-nova: #3987e5; --fam-claude: #d95926; --fam-other: #199e70; }
  .viz { max-width: 100%; height: auto; }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .viz .ctitle { font-size: 15px; font-weight: 600; fill: var(--ink); }
  .panel { font-size: 13px; font-weight: 600; fill: var(--ink); }
  .sub { font-size: 12px; fill: var(--muted); }
  .viz .lead { font-size: 12px; fill: var(--ink); }
  .label { font-size: 12px; fill: var(--ink-2); }
  .viz .plabel { font-size: 12px; fill: var(--ink-2); }
  .viz .plabel.dflt, .viz .plabel .dflt { fill: var(--ink); font-weight: 700; }
  .viz .dot.ref { stroke: var(--ink); stroke-width: 1.5; }
  .tick { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .none { font-size: 12px; fill: var(--muted); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--ink-2); stroke-width: 1; }
  .viz .gap { fill: var(--ring); }
  .viz .leader { stroke: var(--muted); stroke-width: 1; }
  .band { fill: var(--series); opacity: 0.12; }
  .dot { fill: var(--series); stroke: var(--ring); stroke-width: 2; }
  .axislabel { font-size: 12px; fill: var(--ink-2); }
  .prices { font-size: 10px; fill: var(--muted); }
  .num { font-size: 11px; font-weight: 700; fill: var(--ink); }
  .halo { paint-order: stroke; stroke: var(--ring); stroke-width: 3px;
          stroke-linejoin: round; }
  .mcoe { stroke: var(--ink-2); stroke-width: 1; fill: none; }
  .mcoelabel { font-size: 11px; fill: var(--ink-2); }
  .viz .ptitle { font-size: 12px; font-weight: 600; fill: var(--ink); }
  .viz .fam-nova { fill: var(--fam-nova); }
  .viz .fam-claude { fill: var(--fam-claude); }
  .viz .fam-other { fill: var(--fam-other); }
  .viz .baseline { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 5 4; }
  .viz .baselinelabel { font-size: 11px; fill: var(--ink-2); }
</style><text class="ctitle" x="0" y="18.0">With Claude Haiku 5.5, text alone gets the most sections right, for the least</text><text class="sub" x="0" y="38.0">DocSplit packets, 19–20 packets × 3 runs · Varies: classification input · Everything else: baseline setup</text><g transform="translate(0.0 50.0)"><text class="axislabel" x="42" y="13">Sections exactly right (%) ↑</text><line class="grid" x1="46" x2="770" y1="294.0" y2="294.0"/><line class="axis" x1="42" x2="46" y1="294.0" y2="294.0"/><text class="tick" x="39" y="298.0" text-anchor="end">60%</text><line class="grid" x1="46" x2="770" y1="226.5" y2="226.5"/><line class="axis" x1="42" x2="46" y1="226.5" y2="226.5"/><text class="tick" x="39" y="230.5" text-anchor="end">70%</text><line class="grid" x1="46" x2="770" y1="159.0" y2="159.0"/><line class="axis" x1="42" x2="46" y1="159.0" y2="159.0"/><text class="tick" x="39" y="163.0" text-anchor="end">80%</text><line class="grid" x1="46" x2="770" y1="91.5" y2="91.5"/><line class="axis" x1="42" x2="46" y1="91.5" y2="91.5"/><text class="tick" x="39" y="95.5" text-anchor="end">90%</text><line class="grid" x1="46" x2="770" y1="24.0" y2="24.0"/><line class="axis" x1="42" x2="46" y1="24.0" y2="24.0"/><text class="tick" x="39" y="28.0" text-anchor="end">100%</text><line class="axis" x1="46.0" x2="46.0" y1="294" y2="298"/><text class="tick" x="46.0" y="310" text-anchor="middle">$0</text><line class="axis" x1="190.8" x2="190.8" y1="294" y2="298"/><text class="tick" x="190.8" y="310" text-anchor="middle">$5</text><line class="axis" x1="335.6" x2="335.6" y1="294" y2="298"/><text class="tick" x="335.6" y="310" text-anchor="middle">$10</text><line class="axis" x1="480.4" x2="480.4" y1="294" y2="298"/><text class="tick" x="480.4" y="310" text-anchor="middle">$15</text><line class="axis" x1="625.2" x2="625.2" y1="294" y2="298"/><text class="tick" x="625.2" y="310" text-anchor="middle">$20</text><line class="axis" x1="770.0" x2="770.0" y1="294" y2="298"/><text class="tick" x="770.0" y="310" text-anchor="middle">$25</text><line class="axis" x1="46" x2="770" y1="294" y2="294"/><line class="axis" x1="46" x2="46" y1="24" y2="294"/><text class="axislabel" x="408.0" y="330" text-anchor="middle">Classification cost per 1,000 packets ($) — cheaper ←</text><rect class="band" x="710.6" y="162.1" width="10" height="49.4" rx="5"/><rect class="band" x="114.9" y="97.8" width="10" height="17.3" rx="5"/><rect class="band" x="305.3" y="160.2" width="10" height="79.0" rx="5"/><g><title>Text and images (baseline): Section accuracy 76% ± 4%, $23.1 classification cost per 1,000 packets</title><circle class="dot ref" cx="715.6" cy="186.8" r="5"/></g><g><title>Text only: Section accuracy 88% ± 1%, $2.55 classification cost per 1,000 packets</title><circle class="dot" cx="119.9" cy="106.5" r="5"/></g><g><title>Images only: Section accuracy 74% ± 6%, $9.13 classification cost per 1,000 packets</title><circle class="dot" cx="310.3" cy="199.7" r="5"/></g><text class="plabel halo" x="129.9" y="110.5" text-anchor="start">Text only</text><text class="plabel dflt halo" x="705.6" y="190.8" text-anchor="end">Text and images (baseline)</text><text class="plabel halo" x="320.3" y="203.7" text-anchor="start">Images only</text></g><text class="prices" x="0" y="409.0">Baseline setup: Amazon Textract with Layout only; holistic classification reading text and page images, single-pass extraction with structured output, and</text><text class="prices" x="0" y="423.0">confidence scoring, all on Claude Haiku 5.5, with no escalation to a second scoring model.</text><text class="prices" x="0" y="441.0">Prices: on-demand, us-east-1, config_library/pricing.yaml as of 2026-11-18</text></svg>
