<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="792" height="410" viewBox="0 0 792 410" role="img"><title>Page images alone classified the most pages correctly</title><desc>DocSplit packets, 19–20 × 3 runs: Text and images (default) 82% at $498 per 1,000 packets, Text only 79% at $499 per 1,000 packets, Images only 84% at $484 per 1,000 packets</desc><style>
  .viz { --series: #2a78d6; --ring: #ffffff; --ink: #0b0b0b; --ink-2: #52514e;
         --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7;
         --fam-nova: #2a78d6; --fam-claude: #eb6834; --fam-other: #1baf7a; }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz, svg.viz:root { --series: #3987e5;
      --ring: #17181c; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835;
      --fam-nova: #3987e5; --fam-claude: #d95926; --fam-other: #199e70; }
  }
  :root[data-theme="dark"] .viz { --series: #3987e5; --ring: #17181c; --ink: #f0efec;
    --ink-2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835;
    --fam-nova: #3987e5; --fam-claude: #d95926; --fam-other: #199e70; }
  .viz { max-width: 100%; height: auto; }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .viz .ctitle { font-size: 15px; font-weight: 600; fill: var(--ink); }
  .panel { font-size: 13px; font-weight: 600; fill: var(--ink); }
  .sub { font-size: 12px; fill: var(--muted); }
  .viz .lead { font-size: 12px; fill: var(--ink); }
  .label { font-size: 12px; fill: var(--ink-2); }
  .viz .plabel { font-size: 12px; fill: var(--ink-2); }
  .viz .plabel.dflt { fill: var(--ink); font-weight: 600; }
  .tick { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .none { font-size: 12px; fill: var(--muted); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .viz .gap { fill: var(--ring); }
  .viz .leader { stroke: var(--muted); stroke-width: 1; }
  .band { fill: var(--series); opacity: 0.12; }
  .dot { fill: var(--series); stroke: var(--ring); stroke-width: 2; }
  .axislabel { font-size: 12px; fill: var(--ink-2); }
  .prices { font-size: 10px; fill: var(--muted); }
  .num { font-size: 11px; font-weight: 700; fill: var(--ink); }
  .halo { paint-order: stroke; stroke: var(--ring); stroke-width: 3px;
          stroke-linejoin: round; }
  .mcoe { stroke: var(--ink-2); stroke-width: 1; fill: none; }
  .mcoelabel { font-size: 11px; fill: var(--ink-2); }
  .viz .ptitle { font-size: 12px; font-weight: 600; fill: var(--ink); }
  .viz .fam-nova { fill: var(--fam-nova); }
  .viz .fam-claude { fill: var(--fam-claude); }
  .viz .fam-other { fill: var(--fam-other); }
  .viz .baseline { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 5 4; }
  .viz .baselinelabel { font-size: 11px; fill: var(--ink-2); }
</style><text class="ctitle" x="0" y="18.0">Page images alone classified the most pages correctly</text><text class="sub" x="0" y="38.0">DocSplit packets, 19–20 × 3 runs · Varies: classification input · Fixed: classification on Amazon Nova 2 Lite, page by page</text><g transform="translate(0.0 50.0)"><text class="axislabel" x="0" y="13">Pages with the right class (%) ↑</text><line class="grid" x1="46" x2="770" y1="294.0" y2="294.0"/><text class="tick" x="38" y="298.0" text-anchor="end">70%</text><line class="grid" x1="46" x2="770" y1="204.0" y2="204.0"/><text class="tick" x="38" y="208.0" text-anchor="end">80%</text><line class="grid" x1="46" x2="770" y1="114.0" y2="114.0"/><text class="tick" x="38" y="118.0" text-anchor="end">90%</text><line class="grid" x1="46" x2="770" y1="24.0" y2="24.0"/><text class="tick" x="38" y="28.0" text-anchor="end">100%</text><text class="tick" x="60.0" y="310" text-anchor="middle">$475</text><text class="tick" x="178.3" y="310" text-anchor="middle">$480</text><text class="tick" x="296.7" y="310" text-anchor="middle">$485</text><text class="tick" x="415.0" y="310" text-anchor="middle">$490</text><text class="tick" x="533.3" y="310" text-anchor="middle">$495</text><text class="tick" x="651.7" y="310" text-anchor="middle">$500</text><text class="tick" x="770.0" y="310" text-anchor="middle">$505</text><line class="axis" x1="46" x2="770" y1="294" y2="294"/><line class="axis" x1="46" x2="46" y1="24" y2="294"/><text class="axislabel" x="408.0" y="330" text-anchor="middle">Cost per 1,000 packets ($) — cheaper ←</text><rect class="gap" x="49.0" y="288" width="8" height="12"/><line class="axis" x1="48.0" y1="298" x2="52.0" y2="290"/><line class="axis" x1="54.0" y1="298" x2="58.0" y2="290"/><rect class="band" x="600.0" y="180.0" width="10" height="11.1" rx="5"/><rect class="band" x="616.0" y="213.6" width="10" height="5.7" rx="5"/><rect class="band" x="277.9" y="162.9" width="10" height="8.1" rx="5"/><g><title>Text and images (default): Page accuracy 82% ± 1%, $498 per 1,000 packets</title><circle class="dot" cx="605.0" cy="185.5" r="5"/></g><g><title>Text only: Page accuracy 79% ± 0%, $499 per 1,000 packets</title><circle class="dot" cx="621.0" cy="216.4" r="5"/></g><g><title>Images only: Page accuracy 84% ± 0%, $484 per 1,000 packets</title><circle class="dot" cx="282.9" cy="167.0" r="5"/></g><text class="plabel halo" x="292.9" y="171.0" text-anchor="start">Images only</text><text class="plabel dflt halo" x="595.0" y="189.5" text-anchor="end">Text and images (default)</text><text class="plabel halo" x="631.0" y="220.4" text-anchor="start">Text only</text></g><text class="prices" x="0" y="405.0">Prices: on-demand, us-east-1, config_library/pricing.yaml as of 2026-11-13</text></svg>
