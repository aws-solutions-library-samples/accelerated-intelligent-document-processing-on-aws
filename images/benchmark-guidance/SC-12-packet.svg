<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="792" height="462" viewBox="0 0 792 462" role="img"><title>With one-line descriptions, Decider 2B comes close to Haiku 5.5 at classifying sections</title><desc>DocSplit packets, 90–100 packets × 2–3 runs: LLM · Haiku 5.5 (baseline setup) 96% at $31.1 classification cost per 1,000 packets, LLM · Haiku 5.5 · short desc. 98% at $30.9 classification cost per 1,000 packets, Decider 2B · first page image 77% at $31.7 classification cost per 1,000 packets, Decider 2B · first page image · short desc. 90% at $30.7 classification cost per 1,000 packets, Decider 2B · first 2 page images · short desc. 95% at $31.7 classification cost per 1,000 packets, Decider 2B · first page image and text · short desc. 94% at $32.3 classification cost per 1,000 packets; Baseline setup: Amazon Textract with Layout only; holistic classification reading text and page images, single-pass extraction, and confidence scoring, all on Claude Haiku 5.5, with no escalation to a second scoring model.</desc><style>
