<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="792" height="460" viewBox="0 0 792 460" role="img"><title>With the preset&#x27;s descriptions, Claude Haiku 5.5 classifies sections better than the Decider 2B</title><desc>DocSplit packets, 18–20 packets × 3 runs: LLM · Haiku 5.5 (baseline setup) 96% at $17.2 classification cost per 1,000 packets, LLM · Nova 2 Lite 94% at $15.3 classification cost per 1,000 packets, Decider 2B · first page image 81% at $20.3 classification cost per 1,000 packets, Decider 2B · first page image and text 83% at $20.5 classification cost per 1,000 packets, Decider 2B · first 2 page images 82% at $19.0 classification cost per 1,000 packets; Baseline setup: Amazon Textract with Layout only; holistic classification reading text and page images, single-pass extraction, and confidence scoring, all on Claude Haiku 5.5, with no escalation to a second scoring model. Interim: 20 packets, the preset&#x27;s class descriptions; a 100-packet re-run with one-line descriptions is in progress.</desc><style>
  .viz { --series: #2a78d6; --ring: #ffffff; --ink: #0b0b0b; --ink-2: #52514e;
         --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7;
         --fam-nova: #2a78d6; --fam-claude: #eb6834; --fam-other: #1baf7a; }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz, svg.viz:root { --series: #3987e5;
      --ring: #17181c; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835;
      --fam-nova: #3987e5; --fam-claude: #d95926; --fam-other: #199e70; }
  }
  :root[data-theme="dark"] .viz { --series: #3987e5; --ring: #17181c; --ink: #f0efec;
    --ink-2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835;
    --fam-nova: #3987e5; --fam-claude: #d95926; --fam-other: #199e70; }
  .viz { max-width: 100%; height: auto; }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
