<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="792" height="448" viewBox="0 0 792 448" role="img"><title>An LLM scores confidence better than the Strands Decider 2B, for less</title><desc>RealKIE invoices, 20 documents × 3 runs: AUROC: LLM · Haiku 5.5 (baseline setup) 80% at $29.0 per 1,000 documents, LLM · Sonnet 5.5 90% at $130 per 1,000 documents, Decider 2B · page images 68% at $104 per 1,000 documents; ECARB at a 30% review budget: LLM · Haiku 5.5 (baseline setup) 2.5× at $29.0 per 1,000 documents, LLM · Sonnet 5.5 3.0× at $130 per 1,000 documents, Decider 2B · page images 2.0× at $104 per 1,000 documents; RealKIE invoices, 20 documents × 3 runs, AUROC, coin flip: 50%; RealKIE invoices, 20 documents × 3 runs, ECARB at a 30% review budget, random review: 1.0×; Baseline setup: Amazon Textract with Layout only; holistic classification reading text and page images, single-pass extraction, and confidence scoring, all on Claude Haiku 5.5, with no escalation to a second scoring model.</desc><style>
  .viz { --series: #2a78d6; --ring: #ffffff; --ink: #0b0b0b; --ink-2: #52514e;
