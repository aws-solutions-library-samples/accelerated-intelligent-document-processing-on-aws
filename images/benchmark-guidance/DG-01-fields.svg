<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="792" height="468" viewBox="0 0 792 468" role="img"><title>With Claude Haiku 5.5, Textract Layout only matches the other readers</title><desc>RealKIE invoices, 20 documents × 3 runs: Textract, layout only (recommended) 80% at $22.8 per 1,000 documents, Textract, tables and layout 76% at $69.0 per 1,000 documents, Nova 2 Lite vision 79% at $26.2 per 1,000 documents; OmniAI bank checks, 17–20 documents × 3 runs: Textract, layout only (recommended) 99% at $7.76 per 1,000 documents, Textract, tables and layout 99% at $18.7 per 1,000 documents, Nova 2 Lite vision 95% at $4.84 per 1,000 documents; Baseline setup: Amazon Textract with Layout only; holistic classification reading text and page images, single-pass extraction with structured output, and confidence scoring, all on Claude Haiku 5.5, with no escalation to a second scoring model.</desc><style>
  .viz { --series: #2a78d6; --ring: #ffffff; --ink: #0b0b0b; --ink-2: #52514e;
         --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7;
         --fam-nova: #2a78d6; --fam-claude: #eb6834; --fam-other: #1baf7a; }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz, svg.viz:root { --series: #3987e5;
      --ring: #17181c; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835;
      --fam-nova: #3987e5; --fam-claude: #d95926; --fam-other: #199e70; }
  }
  :root[data-theme="dark"] .viz { --series: #3987e5; --ring: #17181c; --ink: #f0efec;
    --ink-2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835;
    --fam-nova: #3987e5; --fam-claude: #d95926; --fam-other: #199e70; }
  .viz { max-width: 100%; height: auto; }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .viz .ctitle { font-size: 15px; font-weight: 600; fill: var(--ink); }
  .panel { font-size: 13px; font-weight: 600; fill: var(--ink); }
  .sub { font-size: 12px; fill: var(--muted); }
  .viz .lead { font-size: 12px; fill: var(--ink); }
