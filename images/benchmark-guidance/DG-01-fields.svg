<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="792" height="425" viewBox="0 0 792 425" role="img"><title>Keep Textract: the other readers scored no better</title><desc>RealKIE invoices, 20 × 3 runs: Textract, tables + layout (default) 81% at $135 per 1,000 documents, Textract, layout only 80% at $94.2 per 1,000 documents, Nova 2 Lite vision 81% at $107 per 1,000 documents; OmniAI bank checks, 20 × 3 runs: Textract, tables + layout (default) 94% at $17.5 per 1,000 documents, Textract, layout only 94% at $6.46 per 1,000 documents, Nova 2 Lite vision 90% at $3.74 per 1,000 documents; RealKIE invoices, 20 × 3 runs, marginal cost of error against Textract, layout only: Textract, tables + layout (default) no measurable gain, Nova 2 Lite vision no measurable gain; OmniAI bank checks, 20 × 3 runs, marginal cost of error against Nova 2 Lite vision: Textract, tables + layout (default) no measurable gain, Textract, layout only no measurable gain</desc><style>
  .viz { --series: #2a78d6; --ring: #ffffff; --ink: #0b0b0b; --ink-2: #52514e;
         --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7;
         --fam-nova: #2a78d6; --fam-claude: #eb6834; --fam-other: #1baf7a; }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz, svg.viz:root { --series: #3987e5;
      --ring: #17181c; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835;
      --fam-nova: #3987e5; --fam-claude: #d95926; --fam-other: #199e70; }
  }
  :root[data-theme="dark"] .viz { --series: #3987e5; --ring: #17181c; --ink: #f0efec;
    --ink-2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835;
    --fam-nova: #3987e5; --fam-claude: #d95926; --fam-other: #199e70; }
  .viz { max-width: 100%; height: auto; }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .viz .ctitle { font-size: 15px; font-weight: 600; fill: var(--ink); }
  .panel { font-size: 13px; font-weight: 600; fill: var(--ink); }
  .sub { font-size: 12px; fill: var(--muted); }
  .viz .lead { font-size: 12px; fill: var(--ink); }
  .label { font-size: 12px; fill: var(--ink-2); }
  .viz .plabel { font-size: 12px; fill: var(--ink-2); }
  .viz .plabel.dflt { fill: var(--ink); font-weight: 600; }
  .tick { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .none { font-size: 12px; fill: var(--muted); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .viz .gap { fill: var(--ring); }
  .viz .leader { stroke: var(--muted); stroke-width: 1; }
  .band { fill: var(--series); opacity: 0.12; }
  .dot { fill: var(--series); stroke: var(--ring); stroke-width: 2; }
  .axislabel { font-size: 12px; fill: var(--ink-2); }
  .prices { font-size: 10px; fill: var(--muted); }
  .num { font-size: 11px; font-weight: 700; fill: var(--ink); }
  .halo { paint-order: stroke; stroke: var(--ring); stroke-width: 3px;
          stroke-linejoin: round; }
  .mcoe { stroke: var(--ink-2); stroke-width: 1; fill: none; }
  .mcoelabel { font-size: 11px; fill: var(--ink-2); }
  .viz .ptitle { font-size: 12px; font-weight: 600; fill: var(--ink); }
  .viz .fam-nova { fill: var(--fam-nova); }
  .viz .fam-claude { fill: var(--fam-claude); }
  .viz .fam-other { fill: var(--fam-other); }
  .viz .baseline { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 5 4; }
  .viz .baselinelabel { font-size: 11px; fill: var(--ink-2); }
</style><text class="ctitle" x="0" y="18.0">Keep Textract: the other readers scored no better</text><text class="sub" x="0" y="38.0">Varies: OCR reader</text><g transform="translate(0.0 50.0)"><text class="ptitle" x="0" y="14">RealKIE invoices, 20 × 3 runs</text><text class="sub" x="0" y="31">Fixed: extraction on Claude Sonnet 5</text><text class="axislabel" x="0" y="48">Weighted accuracy (%) ↑</text><line class="grid" x1="46" x2="360.0" y1="309.0" y2="309.0"/><text class="tick" x="38" y="313.0" text-anchor="end">70%</text><line class="grid" x1="46" x2="360.0" y1="225.7" y2="225.7"/><text class="tick" x="38" y="229.7" text-anchor="end">80%</text><line class="grid" x1="46" x2="360.0" y1="142.3" y2="142.3"/><text class="tick" x="38" y="146.3" text-anchor="end">90%</text><line class="grid" x1="46" x2="360.0" y1="59.0" y2="59.0"/><text class="tick" x="38" y="63.0" text-anchor="end">100%</text><text class="tick" x="46.0" y="325" text-anchor="middle">$0</text><text class="tick" x="150.7" y="325" text-anchor="middle">$50</text><text class="tick" x="255.3" y="325" text-anchor="middle">$100</text><text class="tick" x="360.0" y="325" text-anchor="middle">$150</text><line class="axis" x1="46" x2="360.0" y1="309" y2="309"/><line class="axis" x1="46" x2="46" y1="59" y2="309"/><text class="axislabel" x="203.0" y="345" text-anchor="middle">Cost per 1,000 documents ($) — cheaper ←</text><rect class="band" x="323.1" y="160.9" width="10" height="108.2" rx="5"/><rect class="band" x="238.1" y="174.6" width="10" height="108.8" rx="5"/><rect class="band" x="264.0" y="165.4" width="10" height="109.8" rx="5"/><line class="leader" x1="269.0" y1="227.3" x2="269.0" y2="244.3"/><g><title>Textract, tables + layout (default): Weighted accuracy 81% ± 6%, $135 per 1,000 documents</title><circle class="dot" cx="328.1" cy="215.0" r="5"/></g><g><title>Textract, layout only: Weighted accuracy 80% ± 7%, $94.2 per 1,000 documents</title><circle class="dot" cx="243.1" cy="229.0" r="5"/></g><g><title>Nova 2 Lite vision: Weighted accuracy 81% ± 7%, $107 per 1,000 documents</title><circle class="dot" cx="269.0" cy="220.3" r="5"/></g><text class="plabel halo" x="233.1" y="233.0" text-anchor="end">Textract, layout only</text><text class="plabel dflt halo" x="360.0" y="203.0" text-anchor="end">Textract, tables + layout (default)</text><text class="plabel halo" x="269.0" y="256.3" text-anchor="middle">Nova 2 Lite vision</text></g><g transform="translate(410.0 50.0)"><text class="ptitle" x="0" y="14">OmniAI bank checks, 20 × 3 runs</text><text class="sub" x="0" y="31">Fixed: extraction on Amazon Nova 2 Lite</text><text class="axislabel" x="0" y="48">Weighted accuracy (%) ↑</text><line class="grid" x1="46" x2="360.0" y1="309.0" y2="309.0"/><text class="tick" x="38" y="313.0" text-anchor="end">70%</text><line class="grid" x1="46" x2="360.0" y1="225.7" y2="225.7"/><text class="tick" x="38" y="229.7" text-anchor="end">80%</text><line class="grid" x1="46" x2="360.0" y1="142.3" y2="142.3"/><text class="tick" x="38" y="146.3" text-anchor="end">90%</text><line class="grid" x1="46" x2="360.0" y1="59.0" y2="59.0"/><text class="tick" x="38" y="63.0" text-anchor="end">100%</text><text class="tick" x="46.0" y="325" text-anchor="middle">$0</text><text class="tick" x="150.7" y="325" text-anchor="middle">$50</text><text class="tick" x="255.3" y="325" text-anchor="middle">$100</text><text class="tick" x="360.0" y="325" text-anchor="middle">$150</text><line class="axis" x1="46" x2="360.0" y1="309" y2="309"/><line class="axis" x1="46" x2="46" y1="59" y2="309"/><text class="axislabel" x="203.0" y="345" text-anchor="middle">Cost per 1,000 documents ($) — cheaper ←</text><rect class="band" x="77.7" y="81.9" width="10" height="57.9" rx="5"/><rect class="band" x="54.5" y="71.6" width="10" height="67.9" rx="5"/><rect class="band" x="48.8" y="92.5" width="10" height="104.2" rx="5"/><g><title>Textract, tables + layout (default): Weighted accuracy 94% ± 3%, $17.5 per 1,000 documents</title><circle class="dot" cx="82.7" cy="110.8" r="5"/></g><g><title>Textract, layout only: Weighted accuracy 94% ± 4%, $6.46 per 1,000 documents</title><circle class="dot" cx="59.5" cy="105.6" r="5"/></g><g><title>Nova 2 Lite vision: Weighted accuracy 90% ± 6%, $3.74 per 1,000 documents</title><circle class="dot" cx="53.8" cy="144.6" r="5"/></g><text class="plabel dflt halo" x="92.7" y="114.8" text-anchor="start">Textract, tables + layout (default)</text><text class="plabel halo" x="63.8" y="148.6" text-anchor="start">Nova 2 Lite vision</text><text class="plabel halo" x="48.0" y="93.6" text-anchor="start">Textract, layout only</text></g><text class="prices" x="0" y="420.0">Prices: on-demand, us-east-1, config_library/pricing.yaml as of 2026-11-13</text></svg>
