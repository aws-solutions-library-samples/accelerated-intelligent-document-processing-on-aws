<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="792" height="446" viewBox="0 0 792 446" role="img"><title>With Claude Haiku 5.5, escalation never ran: validation never failed</title><desc>RealKIE invoices, 20 documents × 3 runs: Warn (recommended) 80% at $22.3 per 1,000 documents, Escalate to Sonnet 5.5 81% at $22.4 per 1,000 documents; Baseline setup: Amazon Textract with Layout only; holistic classification reading text and page images, single-pass extraction with structured output, and confidence scoring, all on Claude Haiku 5.5, with no escalation to a second scoring model.</desc><style>
  .viz { --series: #2a78d6; --ring: #ffffff; --ink: #0b0b0b; --ink-2: #52514e;
         --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7;
