" x2="625.2" y1="294" y2="298" stroke="#52514e"/><text class="tick" x="625.2" y="310" text-anchor="middle" fill="#898781">$20</text><line class="axis" x1="770.0" x2="770.0" y1="294" y2="298" stroke="#52514e"/><text class="tick" x="770.0" y="310" text-anchor="middle" fill="#898781">$25</text><line class="axis" x1="46" x2="770" y1="294" y2="294" stroke="#52514e"/><line class="axis" x1="46" x2="46" y1="24" y2="294" stroke="#52514e"/><text class="axislabel" x="408.0" y="330" text-anchor="middle" fill="#52514e">Cost per 1,000 documents ($) — cheaper ←</text><rect class="band" x="687.1" y="138.7" width="10" height="132.0" rx="5" fill="#2a78d6"/><rect class="band" x="689.1" y="133.5" width="10" height="129.8" rx="5" fill="#2a78d6"/><g><title>Warn (recommended): Weighted accuracy 80% ± 7%, $22.3 per 1,000 documents</title><circle class="dot ref" cx="692.1" cy="204.7" r="5" fill="#2a78d6" stroke="#0b0b0b"/></g><g><title>Escalate to Sonnet 5.5: Weighted accuracy 81% ± 7%, $22.4 per 1,000 documents</title><circle class="dot" cx="694.1" cy="198.4" r="5" fill="#2a78d6" stroke="#ffffff"/></g><text class="plabel halo" x="682.1" y="208.7" text-anchor="end" fill="#52514e" stroke="#ffffff"><tspan class="dflt" fill="#0b0b0b">Warn (recommended)</tspan>, Escalate to Sonnet 5.5</text></g><text class="prices" x="0" y="409.0" fill="#898781">Baseline setup: Amazon Textract with Layout only; holistic classification reading text and page images, single-pass extraction with structured output, and</text><text class="prices" x="0" y="423.0" fill="#898781">confidence scoring, all on Claude Haiku 5.5, with no escalation to a second scoring model.</text><text class="prices" x="0" y="441.0" fill="#898781">Prices: on-demand, us-east-1, config_library/pricing.yaml as of 2026-11-18</text></svg>
