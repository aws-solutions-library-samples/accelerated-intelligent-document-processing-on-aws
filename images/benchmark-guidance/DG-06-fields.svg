<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="792" height="410" viewBox="0 0 792 410" role="img"><title>No Textract feature combination changed accuracy measurably</title><desc>RealKIE invoices, 20 × 3 runs: Tables, layout, signatures (default) 80% at $137 per 1,000 documents, Layout only 79% at $87.5 per 1,000 documents, Tables only 81% at $143 per 1,000 documents, Tables, layout, signatures, forms 79% at $339 per 1,000 documents; Fake-W2 forms, 20 × 3 runs: Tables, layout, signatures (default) 95% at $33.8 per 1,000 documents, Layout only 96% at $20.2 per 1,000 documents, Tables only 97% at $32.2 per 1,000 documents, Tables, layout, signatures, forms 97% at $82.2 per 1,000 documents; RealKIE invoices, 20 × 3 runs, marginal cost of error against Layout only: Tables, layout, signatures (default) no measurable gain, Tables only no measurable gain, Tables, layout, signatures, forms no measurable gain; Fake-W2 forms, 20 × 3 runs, marginal cost of error against Layout only: Tables only no measurable gain, Tables, layout, signatures, forms no measurable gain</desc><style>
