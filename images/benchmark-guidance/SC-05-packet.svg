<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="792" height="426" viewBox="0 0 792 426" role="img"><title>One neighboring page finds more boundaries; two help less</title><desc>DocSplit packets, 19–20 × 3 runs: 0 pages (default) 49% at $496 per 1,000 packets, 1 page 63% at $496 per 1,000 packets, 2 pages 53% at $505 per 1,000 packets</desc><style>
  .viz { --series: #2a78d6; --ring: #ffffff; --ink: #0b0b0b; --ink-2: #52514e;
         --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7;
         --fam-nova: #2a78d6; --fam-claude: #eb6834; --fam-other: #1baf7a; }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz, svg.viz:root { --series: #3987e5;
      --ring: #17181c; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835;
      --fam-nova: #3987e5; --fam-claude: #d95926; --fam-other: #199e70; }
  }
  :root[data-theme="dark"] .viz { --series: #3987e5; --ring: #17181c; --ink: #f0efec;
    --ink-2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835;
    --fam-nova: #3987e5; --fam-claude: #d95926; --fam-other: #199e70; }
  .viz { max-width: 100%; height: auto; }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .viz .ctitle { font-size: 15px; font-weight: 600; fill: var(--ink); }
  .panel { font-size: 13px; font-weight: 600; fill: var(--ink); }
  .sub { font-size: 12px; fill: var(--muted); }
  .viz .lead { font-size: 12px; fill: var(--ink); }
  .label { font-size: 12px; fill: var(--ink-2); }
  .viz .plabel { font-size: 12px; fill: var(--ink-2); }
  .viz .plabel.dflt { fill: var(--ink); font-weight: 600; }
  .tick { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .none { font-size: 12px; fill: var(--muted); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .viz .gap { fill: var(--ring); }
  .viz .leader { stroke: var(--muted); stroke-width: 1; }
  .band { fill: var(--series); opacity: 0.12; }
  .dot { fill: var(--series); stroke: var(--ring); stroke-width: 2; }
  .axislabel { font-size: 12px; fill: var(--ink-2); }
  .prices { font-size: 10px; fill: var(--muted); }
  .num { font-size: 11px; font-weight: 700; fill: var(--ink); }
  .halo { paint-order: stroke; stroke: var(--ring); stroke-width: 3px;
          stroke-linejoin: round; }
  .mcoe { stroke: var(--ink-2); stroke-width: 1; fill: none; }
  .mcoelabel { font-size: 11px; fill: var(--ink-2); }
  .viz .ptitle { font-size: 12px; font-weight: 600; fill: var(--ink); }
  .viz .fam-nova { fill: var(--fam-nova); }
  .viz .fam-claude { fill: var(--fam-claude); }
  .viz .fam-other { fill: var(--fam-other); }
  .viz .baseline { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 5 4; }
  .viz .baselinelabel { font-size: 11px; fill: var(--ink-2); }
</style><text class="ctitle" x="0" y="18.0">One neighboring page finds more boundaries; two help less</text><text class="sub" x="0" y="38.0">DocSplit packets, 19–20 × 3 runs · Varies: neighboring pages in the prompt ·</text><text class="sub" x="0" y="54.0">Fixed: classification on Amazon Nova 2 Lite, page by page</text><g transform="translate(0.0 66.0)"><text class="axislabel" x="0" y="13">Boundary accuracy (%) ↑</text><line class="grid" x1="46" x2="770" y1="294.0" y2="294.0"/><text class="tick" x="38" y="298.0" text-anchor="end">40%</text><line class="grid" x1="46" x2="770" y1="204.0" y2="204.0"/><text class="tick" x="38" y="208.0" text-anchor="end">60%</text><line class="grid" x1="46" x2="770" y1="114.0" y2="114.0"/><text class="tick" x="38" y="118.0" text-anchor="end">80%</text><line class="grid" x1="46" x2="770" y1="24.0" y2="24.0"/><text class="tick" x="38" y="28.0" text-anchor="end">100%</text><text class="tick" x="60.0" y="310" text-anchor="middle">$490</text><text class="tick" x="202.0" y="310" text-anchor="middle">$495</text><text class="tick" x="344.0" y="310" text-anchor="middle">$500</text><text class="tick" x="486.0" y="310" text-anchor="middle">$505</text><text class="tick" x="628.0" y="310" text-anchor="middle">$510</text><text class="tick" x="770.0" y="310" text-anchor="middle">$515</text><line class="axis" x1="46" x2="770" y1="294" y2="294"/><line class="axis" x1="46" x2="46" y1="24" y2="294"/><text class="axislabel" x="408.0" y="330" text-anchor="middle">Cost per 1,000 packets ($) — cheaper ←</text><rect class="gap" x="49.0" y="288" width="8" height="12"/><line class="axis" x1="48.0" y1="298" x2="52.0" y2="290"/><line class="axis" x1="54.0" y1="298" x2="58.0" y2="290"/><rect class="band" x="214.3" y="244.2" width="10" height="19.1" rx="5"/><rect class="band" x="224.3" y="160.4" width="10" height="59.3" rx="5"/><rect class="band" x="481.4" y="233.6" width="10" height="3.0" rx="5"/><g><title>0 pages (default): Boundary accuracy 49% ± 2%, $496 per 1,000 packets</title><circle class="dot" cx="219.3" cy="253.7" r="5"/></g><g><title>1 page: Boundary accuracy 63% ± 7%, $496 per 1,000 packets</title><circle class="dot" cx="229.3" cy="190.1" r="5"/></g><g><title>2 pages: Boundary accuracy 53% ± 0%, $505 per 1,000 packets</title><circle class="dot" cx="486.4" cy="235.1" r="5"/></g><text class="plabel halo" x="239.3" y="194.1" text-anchor="start">1 page</text><text class="plabel halo" x="496.4" y="239.1" text-anchor="start">2 pages</text><text class="plabel dflt halo" x="229.3" y="257.7" text-anchor="start">0 pages (default)</text></g><text class="prices" x="0" y="421.0">Prices: on-demand, us-east-1, config_library/pricing.yaml as of 2026-11-13</text></svg>
