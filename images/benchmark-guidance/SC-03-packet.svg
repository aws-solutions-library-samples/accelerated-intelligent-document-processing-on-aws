<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="792" height="432" viewBox="0 0 792 432" role="img"><title>Claude Haiku 5.5 matches Claude Sonnet 5 at the default&#x27;s cost</title><desc>DocSplit packets, 19–20 × 3 runs: Nova 2 Lite (default) 51% at $494 per 1,000 packets, Nova Pro 48% at $513 per 1,000 packets, Haiku 5.5 71% at $488 per 1,000 packets, Sonnet 5 71% at $738 per 1,000 packets; DocSplit packets, 19–20 × 3 runs, marginal cost of error against Haiku 5.5: Sonnet 5 no measurable gain</desc><style>
  .viz { --series: #2a78d6; --ring: #ffffff; --ink: #0b0b0b; --ink-2: #52514e;
         --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7;
         --fam-nova: #2a78d6; --fam-claude: #eb6834; --fam-other: #1baf7a; }
  @media (prefers-color-scheme: dark) {
