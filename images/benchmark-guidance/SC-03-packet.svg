ircle class="dot fam-nova" cx="493.3" cy="243.7" r="5"/></g><g><title>Nova Pro: Section accuracy 48% ± 0%, $513 per 1,000 packets</title><circle class="dot fam-nova" cx="510.6" cy="259.0" r="5"/></g><g><title>Haiku 5.5: Section accuracy 71% ± 3%, $488 per 1,000 packets</title><rect class="dot fam-claude" x="483.2" y="151.3" width="9.0" height="9.0" rx="1.5"/></g><g><title>Sonnet 5: Section accuracy 71% ± 2%, $738 per 1,000 packets</title><rect class="dot fam-claude" x="709.6" y="150.4" width="9.0" height="9.0" rx="1.5"/></g><text class="plabel halo" x="704.1" y="158.9" text-anchor="end">Sonnet 5</text><text class="plabel halo" x="497.7" y="159.8" text-anchor="start">Haiku 5.5</text><text class="plabel dflt halo" x="483.3" y="247.7" text-anchor="end">Nova 2 Lite (default)</text><text class="plabel halo" x="520.6" y="263.0" text-anchor="start">Nova Pro</text></g><text class="prices" x="0" y="427.0">Prices: on-demand, us-east-1, config_library/pricing.yaml as of 2026-11-13</text></svg>
