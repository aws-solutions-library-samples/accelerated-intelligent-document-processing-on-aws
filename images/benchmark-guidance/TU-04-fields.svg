cle class="dot" cx="105.1" cy="186.8" r="5"/></g><text class="plabel halo" x="115.1" y="190.8" text-anchor="start">Haiku 5.5, Haiku scoring</text><text class="plabel dflt halo" x="318.7" y="200.1" text-anchor="end">Default</text><text class="plabel halo" x="48.0" y="209.4" text-anchor="start">Haiku 5.5, no scoring</text></g><g transform="translate(410.0 50.0)"><text class="ptitle" x="0" y="14">Fake-W2 forms, 20 × 3 runs</text><text class="axislabel" x="0" y="33">Weighted accuracy (%) ↑</text><line class="grid" x1="46" x2="360.0" y1="294.0" y2="294.0"/><text class="tick" x="38" y="298.0" text-anchor="end">70%</text><line class="grid" x1="46" x2="360.0" y1="210.7" y2="210.7"/><text class="tick" x="38" y="214.7" text-anchor="end">80%</text><line class="grid" x1="46" x2="360.0" y1="127.3" y2="127.3"/><text class="tick" x="38" y="131.3" text-anchor="end">90%</text><line class="grid" x1="46" x2="360.0" y1="44.0" y2="44.0"/><text class="tick" x="38" y="48.0" text-anchor="end">100%</text><text class="tick" x="46.0" y="310" text-anchor="middle">$0</text><text class="tick" x="150.7" y="310" text-anchor="middle">$50</text><text class="tick" x="255.3" y="310" text-anchor="middle">$100</text><text class="tick" x="360.0" y="310" text-anchor="middle">$150</text><line class="axis" x1="46" x2="360.0" y1="294" y2="294"/><line class="axis" x1="46" x2="46" y1="44" y2="294"/><text class="axislabel" x="203.0" y="330" text-anchor="middle">Cost per 1,000 documents ($) — cheaper ←</text><rect class="band" x="108.8" y="62.0" width="10" height="20.1" rx="5"/><rect class="band" x="52.2" y="44.0" width="10" height="4.0" rx="5"/><rect class="band" x="57.3" y="44.0" width="10" height="3.9" rx="5"/><line class="leader" x1="64.2" y1="45.8" x2="146.3" y2="45.8"/><line class="leader" x1="69.3" y1="46.2" x2="146.3" y2="50.0"/><g><title>Default: Weighted accuracy 97% ± 1%, $32.4 per 1,000 documents</title><circle class="dot" cx="113.8" cy="72.0" r="5"/></g><g><title>Haiku 5.5, no scoring: Weighted accuracy 100% ± 0%, $5.34 per 1,000 documents</title><circle class="dot" cx="57.2" cy="45.8" r="5"/></g><g><title>Haiku 5.5, Haiku scoring: Weighted accuracy 100% ± 0%, $7.80 per 1,000 documents</title><circle class="dot" cx="62.3" cy="45.8" r="5"/></g><text class="plabel dflt halo" x="123.8" y="76.0" text-anchor="start">Default</text><text class="plabel halo" x="148.3" y="47.0" text-anchor="start">Haiku 5.5, no scoring</text><text class="plabel halo" x="148.3" y="62.0" text-anchor="start">Haiku 5.5, Haiku scoring</text></g><text class="prices" x="0" y="405.0">Prices: on-demand, us-east-1, config_library/pricing.yaml as of 2026-11-13</text></svg>
