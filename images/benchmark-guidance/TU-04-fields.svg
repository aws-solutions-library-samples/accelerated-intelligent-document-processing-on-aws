<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="792" height="432" viewBox="0 0 792 432" role="img"><title>Claude Haiku 5.5 and Layout only: same accuracy, a sixth the cost</title><desc>RealKIE invoices, 20 documents × 3 runs: Preset default · Sonnet 5, Textract tables, Nova Lite scoring 82% at $135 per 1,000 documents, Haiku 5.5, no scoring 83% at $21.0 per 1,000 documents, Haiku 5.5, Haiku scoring (recommended) 83% at $28.2 per 1,000 documents; Fake-W2 forms, 20 documents × 3 runs: Preset default · Sonnet 5, Textract tables, Nova Lite scoring 97% at $32.4 per 1,000 documents, Haiku 5.5, no scoring 100% at $5.34 per 1,000 documents, Haiku 5.5, Haiku scoring (recommended) 100% at $7.80 per 1,000 documents</desc><style>
