<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="792" height="410" viewBox="0 0 792 410" role="img"><title>Structured output scores the same as the schema in the prompt</title><desc>RealKIE invoices, 20 × 3 runs: Schema in prompt (default) 81% at $145 per 1,000 documents, Schema in prompt, Sonnet 5.5 80% at $133 per 1,000 documents, Structured output, Sonnet 5.5 82% at $134 per 1,000 documents; Fake-W2 forms, 20 × 3 runs: Schema in prompt (default) 96% at $34.0 per 1,000 documents, Schema in prompt, Sonnet 5.5 92% at $30.6 per 1,000 documents, Structured output, Sonnet 5.5 92% at $30.5 per 1,000 documents; RealKIE invoices, 20 × 3 runs, marginal cost of error against Schema in prompt, Sonnet 5.5: Schema in prompt (default) no measurable gain, Structured output, Sonnet 5.5 no measurable gain; Fake-W2 forms, 20 × 3 runs, marginal cost of error against Structured output, Sonnet 5.5: Schema in prompt (default) $0.08 per error prevented</desc><style>
  .viz { --series: #2a78d6; --ring: #ffffff; --ink: #0b0b0b; --ink-2: #52514e;
         --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7;
         --fam-nova: #2a78d6; --fam-claude: #eb6834; --fam-other: #1baf7a; }
  @media (prefers-color-scheme: dark) {
