<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="792" height="522" viewBox="0 0 792 522" role="img"><title>To be measured</title><desc>DocSplit packets, 90–100 packets × 2–3 runs: Page by page · Nova 2 Lite 49% at $13.2 classification cost per 1,000 packets, Holistic · Nova 2 Lite 51% at $5.39 classification cost per 1,000 packets, Split, LLM classifies · Nova 2 Lite 46% at $7.83 classification cost per 1,000 packets, Page by page · Haiku 5.5 70% at $14.5 classification cost per 1,000 packets, Holistic · Haiku 5.5 (baseline setup) 75% at $10.4 classification cost per 1,000 packets, Split, LLM classifies · Haiku 5.5 75% at $16.4 classification cost per 1,000 packets, Page by page · Sonnet 5.5 73% at $252 classification cost per 1,000 packets, Holistic · Sonnet 5.5 90% at $200 classification cost per 1,000 packets, Split, LLM classifies · Sonnet 5.5 88% at $315 classification cost per 1,000 packets; Baseline setup: Amazon Textract with Layout only; holistic classification reading text and page images, single-pass extraction, and confidence scoring, all on Claude Haiku 5.5, with no escalation to a second scoring model. Partial: 7 of 12 settings measured; Claude Sonnet 5.5, the decision-model row and the same-class packets are still running.</desc><style>
