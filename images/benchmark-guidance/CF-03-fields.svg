<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="792" height="748" viewBox="0 0 792 748" role="img"><title>Integrated scoring catches more W-2 errors but lowers accuracy</title><desc>RealKIE invoices, 20 × 3 runs: Weighted accuracy: Separate (default) 81% at $137 per 1,000 documents, Integrated 81% at $135 per 1,000 documents, Off 80% at $134 per 1,000 documents; Errors caught reviewing 30% of values: Separate (default) 18% at $137 per 1,000 documents, Integrated 18% at $135 per 1,000 documents; Fake-W2 forms, 20 × 3 runs: Weighted accuracy: Separate (default) 96% at $35.3 per 1,000 documents, Integrated 92% at $61.5 per 1,000 documents, Off 96% at $31.8 per 1,000 documents; Errors caught reviewing 30% of values: Separate (default) 13% at $35.3 per 1,000 documents, Integrated 47% at $61.5 per 1,000 documents; RealKIE invoices, 20 × 3 runs, marginal cost of error against Off: Separate (default) no measurable gain, Integrated no measurable gain; Fake-W2 forms, 20 × 3 runs, marginal cost of error against Off: Separate (default) no measurable gain; RealKIE invoices, 20 × 3 runs, Errors caught reviewing 30% of values, random review: 30%; Fake-W2 forms, 20 × 3 runs, Errors caught reviewing 30% of values, random review: 30%</desc><style>
