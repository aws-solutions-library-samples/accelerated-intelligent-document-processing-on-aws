<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="792" height="446" viewBox="0 0 792 446" role="img"><title>With Claude Haiku 5.5, integrated scoring costs W-2 accuracy; off is cheapest</title><desc>RealKIE invoices, 20 documents × 3 runs: Separate (recommended) 80% at $22.2 per 1,000 documents, Integrated 82% at $22.3 per 1,000 documents, Off 82% at $19.4 per 1,000 documents; Fake-W2 forms, 20 documents × 3 runs: Separate (recommended) 100% at $7.42 per 1,000 documents, Integrated 96% at $6.61 per 1,000 documents, Off 100% at $5.37 per 1,000 documents; Baseline setup: Amazon Textract with Layout only; holistic classification reading text and page images, single-pass extraction with structured output, and confidence scoring, all on Claude Haiku 5.5, with no escalation to a second scoring model.</desc><style>
