<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="720" height="1124" viewBox="0 0 720 1124" role="img"><title>List recall against Cost per 1,000 documents (USD), mean of 3 runs with two standard errors either side</title><desc>Statement, 400 rows: Single pass, Simple (default) 1 at $545, Iterative, Advanced 1 at $546; Statement, 800 rows: Single pass, Simple (default) 0.82 at $957, Iterative, Advanced 1 at $1,036; Statement, 1,600 rows: Single pass, Simple (default) 0.03 at $1,127; Statement, 800 rows, marginal cost of error against Single pass, Simple (default): Iterative, Advanced $0.45 per error prevented</desc><style>
  .viz { --series: #2a78d6; --ring: #ffffff; --ink: #0b0b0b; --ink-2: #52514e;
