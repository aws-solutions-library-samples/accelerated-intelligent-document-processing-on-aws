  .viz .strip { opacity: 0.3; }
  .viz .whisker { stroke: var(--ink-2); stroke-width: 1.5; }
  .viz .median { stroke: var(--ink); stroke-width: 2; }
  .viz .short { fill: var(--ring); stroke: var(--ink-2); stroke-width: 2; }
  .viz .ebar2 { stroke: var(--ink-2); stroke-width: 1.5; stroke-linecap: round; }
