<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="792" height="390" viewBox="0 0 792 390" role="img"><title>With Claude Haiku 5.5, holistic still groups long packets better than page by page</title><desc>Sections exactly right, 5–20 pages: +0.08 ± 0.05. Sections exactly right, 30–60 pages: 0.00 ± 0.06. Grouping score, 5–20 pages: +0.09 ± 0.03. Grouping score, 30–60 pages: +0.06 ± 0.02. Boundary accuracy, 5–20 pages: +0.11 ± 0.05. Boundary accuracy, 30–60 pages: +0.03 ± 0.06. V-measure, 5–20 pages: +0.07 ± 0.03. V-measure, 30–60 pages: +0.03 ± 0.01. Rand index, 5–20 pages: +0.05 ± 0.02. Rand index, 30–60 pages: +0.01 ± 0.01. Ordering, 5–20 pages: +0.12 ± 0.04. Ordering, 30–60 pages: +0.10 ± 0.04. Page accuracy, 5–20 pages: +0.01 ± 0.04. Page accuracy, 30–60 pages: +0.01 ± 0.03. Label accuracy, 5–20 pages: −0.03 ± 0.02. Label accuracy, 30–60 pages: −0.05 ± 0.02.</desc><style>
