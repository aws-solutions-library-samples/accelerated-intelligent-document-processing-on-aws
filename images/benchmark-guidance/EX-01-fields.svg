<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="792" height="410" viewBox="0 0 792 410" role="img"><title>Averaged over whole datasets, the two modes score within the noise</title><desc>RealKIE invoices, 74–75 documents × 3 runs: Single-pass · Haiku 5.5 82% at $108 per 1,000 documents, Agentic · Haiku 5.5 81% at $105 per 1,000 documents, Single-pass · Sonnet 5.5 82% at $200 per 1,000 documents, Agentic · Sonnet 5.5 84% at $227 per 1,000 documents</desc><style>
  .viz { --series: #2a78d6; --ring: #ffffff; --ink: #0b0b0b; --ink-2: #52514e;
         --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7;
         --fam-nova: #2a78d6; --fam-claude: #eb6834; --fam-other: #1baf7a; }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz, svg.viz:root { --series: #3987e5;
      --ring: #17181c; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835;
      --fam-nova: #3987e5; --fam-claude: #d95926; --fam-other: #199e70; }
  }
  :root[data-theme="dark"] .viz { --series: #3987e5; --ring: #17181c; --ink: #f0efec;
    --ink-2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835;
    --fam-nova: #3987e5; --fam-claude: #d95926; --fam-other: #199e70; }
  .viz { max-width: 100%; height: auto; }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .viz .ctitle { font-size: 15px; font-weight: 600; fill: var(--ink); }
  .panel { font-size: 13px; font-weight: 600; fill: var(--ink); }
  .sub { font-size: 12px; fill: var(--muted); }
  .viz .lead { font-size: 12px; fill: var(--ink); }
  .label { font-size: 12px; fill: var(--ink-2); }
  .viz .plabel { font-size: 12px; fill: var(--ink-2); }
  .viz .plabel.dflt, .viz .plabel .dflt { fill: var(--ink); font-weight: 700; }
  .viz .dot.ref { stroke: var(--ink); stroke-width: 1.5; }
  .tick { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .none { font-size: 12px; fill: var(--muted); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--ink-2); stroke-width: 1; }
  .viz .gap { fill: var(--ring); }
  .viz .leader { stroke: var(--muted); stroke-width: 1; }
  .band { fill: var(--series); opacity: 0.12; }
  .dot { fill: var(--series); stroke: var(--ring); stroke-width: 2; }
  .axislabel { font-size: 12px; fill: var(--ink-2); }
  .prices { font-size: 10px; fill: var(--muted); }
  .num { font-size: 11px; font-weight: 700; fill: var(--ink); }
  .halo { paint-order: stroke; stroke: var(--ring); stroke-width: 3px;
          stroke-linejoin: round; }
  .mcoe { stroke: var(--ink-2); stroke-width: 1; fill: none; }
  .mcoelabel { font-size: 11px; fill: var(--ink-2); }
  .viz .ptitle { font-size: 12px; font-weight: 600; fill: var(--ink); }
  .viz .fam-nova { fill: var(--fam-nova); }
  .viz .fam-claude { fill: var(--fam-claude); }
  .viz .fam-other { fill: var(--fam-other); }
  .viz .baseline { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 5 4; }
  .viz .baselinelabel { font-size: 11px; fill: var(--ink-2); }
</style><text class="ctitle" x="0" y="18.0" fill="#0b0b0b">Averaged over whole datasets, the two modes score within the noise</text><text class="sub" x="0" y="38.0" fill="#898781">RealKIE invoices, 74–75 documents × 3 runs · Varies: extraction mode and model · Everything else: each dataset&#x27;s preset</text><g transform="translate(0.0 50.0)"><text class="axislabel" x="42" y="13" fill="#52514e">Weighted accuracy (%) ↑</text><line class="grid" x1="46" x2="770" y1="294.0" y2="294.0" stroke="#e1e0d9"/><line class="axis" x1="42" x2="46" y1="294.0" y2="294.0" stroke="#52514e"/><text class="tick" x="39" y="298.0" text-anchor="end" fill="#898781">70%</text><line class="grid" x1="46" x2="770" y1="204.0" y2="204.0" stroke="#e1e0d9"/><line class="axis" x1="42" x2="46" y1="204.0" y2="204.0" stroke="#52514e"/><text class="tick" x="39" y="208.0" text-anchor="end" fill="#898781">80%</text><line class="grid" x1="46" x2="770" y1="114.0" y2="114.0" stroke="#e1e0d9"/><line class="axis" x1="42" x2="46" y1="114.0" y2="114.0" stroke="#52514e"/><text class="tick" x="39" y="118.0" text-anchor="end" fill="#898781">90%</text><line class="grid" x1="46" x2="770" y1="24.0" y2="24.0" stroke="#e1e0d9"/><line class="axis" x1="42" x2="46" y1="24.0" y2="24.0" stroke="#52514e"/><text class="tick" x="39" y="28.0" text-anchor="end" fill="#898781">100%</text><line class="axis" x1="46.0" x2="46.0" y1="294" y2="298" stroke="#52514e"/><text class="tick" x="46.0" y="310" text-anchor="middle" fill="#898781">$0</text><line class="axis" x1="190.8" x2="190.8" y1="294" y2="298" stroke="#52514e"/><text class="tick" x="190.8" y="310" text-anchor="middle" fill="#898781">$50</text><line class="axis" x1="335.6" x2="335.6" y1="294" y2="298" stroke="#52514e"/><text class="tick" x="335.6" y="310" text-anchor="middle" fill="#898781">$100</text><line class="axis" x1="480.4" x2="480.4" y1="294" y2="298" stroke="#52514e"/><text class="tick" x="480.4" y="310" text-anchor="middle" fill="#898781">$150</text><line class="axis" x1="625.2" x2="625.2" y1="294" y2="298" stroke="#52514e"/><text class="tick" x="625.2" y="310" text-anchor="middle" fill="#898781">$200</text><line class="axis" x1="770.0" x2="770.0" y1="294" y2="298" stroke="#52514e"/><text class="tick" x="770.0" y="310" text-anchor="middle" fill="#898781">$250</text><line class="axis" x1="46" x2="770" y1="294" y2="294" stroke="#52514e"/><line class="axis" x1="46" x2="46" y1="24" y2="294" stroke="#52514e"/><text class="axislabel" x="408.0" y="330" text-anchor="middle" fill="#52514e">Cost per 1,000 documents ($) — cheaper ←</text><rect class="band" x="353.2" y="155.3" width="10" height="66.5" rx="5" fill="#2a78d6"/><rect class="band" x="346.1" y="161.5" width="10" height="71.0" rx="5" fill="#2a78d6"/><rect class="band" x="620.3" y="153.1" width="10" height="67.1" rx="5" fill="#2a78d6"/><rect class="band" x="698.5" y="140.6" width="10" height="63.0" rx="5" fill="#2a78d6"/><line class="leader" x1="698.5" y1="167.1" x2="675.5" y2="144.1" stroke="#898781"/><line class="leader" x1="363.4" y1="184.0" x2="376.2" y2="172.6" stroke="#898781"/><g><title>Single-pass · Haiku 5.5: Weighted accuracy 82% ± 4%, $108 per 1,000 documents</title><circle class="dot" cx="358.2" cy="188.6" r="5" fill="#2a78d6" stroke="#ffffff"/></g><g><title>Agentic · Haiku 5.5: Weighted accuracy 81% ± 4%, $105 per 1,000 documents</title><circle class="dot" cx="351.1" cy="196.9" r="5" fill="#2a78d6" stroke="#ffffff"/></g><g><title>Single-pass · Sonnet 5.5: Weighted accuracy 82% ± 4%, $200 per 1,000 documents</title><circle class="dot" cx="625.3" cy="186.7" r="5" fill="#2a78d6" stroke="#ffffff"/></g><g><title>Agentic · Sonnet 5.5: Weighted accuracy 84% ± 3%, $227 per 1,000 documents</title><circle class="dot" cx="703.5" cy="172.1" r="5" fill="#2a78d6" stroke="#ffffff"/></g><text class="plabel halo" x="615.3" y="190.7" text-anchor="end" fill="#52514e" stroke="#ffffff">Single-pass · Sonnet 5.5</text><text class="plabel halo" x="673.5" y="140.1" text-anchor="end" fill="#52514e" stroke="#ffffff">Agentic · Sonnet 5.5</text><text class="plabel halo" x="378.2" y="168.6" text-anchor="start" fill="#52514e" stroke="#ffffff">Single-pass · Haiku 5.5</text></g><text class="prices" x="0" y="405.0" fill="#898781">Prices: on-demand, us-east-1, config_library/pricing.yaml as of 2026-11-18</text></svg>
