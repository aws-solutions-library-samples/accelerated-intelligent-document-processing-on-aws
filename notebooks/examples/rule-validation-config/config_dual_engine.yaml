# Rule Validation Engine Comparison Config
# Tests both LLM and Z3 engines side-by-side using a simple invoice document

# ============================================================================
# Classification (minimal — single doc type for testing)
# ============================================================================
classificationMethod: textbasedHolisticClassification
classification:
  model: us.anthropic.claude-sonnet-4-5-20250929-v1:0
  temperature: "0"
  top_p: "0"
  top_k: "20"
  max_tokens: "4096"
  system_prompt: |
    You are a document classifier. Classify each page of the document.
  task_prompt: |
    Classify the following document pages. Each page belongs to one class.
    Available classes: invoice
    
    {DOCUMENT_TEXT}
    
    Return JSON: {"pages": [{"page_id": "1", "classification": "invoice", "confidence": 0.99}]}

# ============================================================================
# Extraction (simple invoice fields)
# ============================================================================
extraction:
  model: us.anthropic.claude-sonnet-4-5-20250929-v1:0
  temperature: "0"
  top_p: "0"
  top_k: "20"
  max_tokens: "4096"
  system_prompt: |
    You are a document extraction specialist. Extract structured fields from documents.
  task_prompt: |
    Extract the following fields from the document text.
    
    {DOCUMENT_TEXT}
    
    Return JSON matching the schema provided.

# ============================================================================
# Rule Validation (fact extraction + orchestrator)
# ============================================================================
rule_validation:
  enabled: true
  semaphore: 5
  max_chunk_size: 8000
  token_size: 4
  overlap_percentage: 10
  response_prefix: <response>
  recommendation_options: |
    Pass: The requirement criteria are fully met.
    Fail: The requirement is partially met or requires additional information.
    Information Not Found: No relevant data exists in the document content.
  extraction_results: null
  fact_extraction:
    model: us.anthropic.claude-sonnet-4-5-20250929-v1:0
    system_prompt: |
      You are a Document Fact Extraction Specialist responsible for identifying
      and extracting factual evidence relevant to rule validation.
      Extract facts from both <document-text> and <extracted-attributes>.
      Each fact must include page number(s). Do not make compliance decisions.
    task_prompt: |
      Extract relevant facts for validating the rule provided.

      <extracted-attributes>
      {EXTRACTION_RESULTS}
      </extracted-attributes>

      <document-text>
      {DOCUMENT_TEXT}
      </document-text>

      <rule>
      {rule}
      </rule>

      Respond ONLY with JSON inside <response></response> tags:
      {{
        "extracted_facts": [
          {{"fact": "...", "citation": "Page X", "relevance": "..."}}
        ],
        "extraction_summary": "..."
      }}
    temperature: 0
    top_p: 0
    top_k: 20
    max_tokens: 4096
  rule_validation_orchestrator:
    model: us.anthropic.claude-sonnet-4-5-20250929-v1:0
    system_prompt: |
      You are a Compliance Validation Specialist. Review extracted evidence
      and make a compliance recommendation for the given rule.
      Base decisions strictly on extracted evidence. Select from provided options.
    task_prompt: |
      Review the extracted evidence and make a compliance determination.

      <extracted_evidence>
      {extracted_evidence}
      </extracted_evidence>

      <<CACHEPOINT>>

      <options>
      {recommendation_options}
      </options>

      <criteria>
      <rule_type>{rule_type}</rule_type>
      <rule>{rule}</rule>
      </criteria>

      Respond ONLY with JSON inside <response></response> tags:
      {{
        "recommendation": "Pass or Fail or Information Not Found",
        "reasoning": "Single paragraph with citations",
        "supporting_pages": ["1"]
      }}
    temperature: 0
    top_p: 0
    top_k: 20
    max_tokens: 4096

  # Z3 engine: rule translation (NL → SMT-LIB RuleJSON)
  z3_rule_translator:
    model: us.anthropic.claude-sonnet-4-5-20250929-v1:0
    system_prompt: |
      You are an expert at translating business rules into formal SMT-LIB constraints for the Z3 theorem prover.

      Your task is to receive a natural language business rule and example data, then output:
      1. Variable definitions (name, type: Int/Real/Bool/String, required: true/false)
      2. Data path mappings (variable name → JSON path in dot notation) - ONLY if ALL parameters are directly extractable
      3. SMT-LIB constraint logic that formalizes the rule

      Output must be valid JSON with the following structure:
      {
        "parameters": [{"name": "var1", "type": "Real", "required": true, "description": "Brief explanation"}, ...],
        "path_mappings": [{"parameter_name": "var1", "data_path": "path.to.field"}, ...],
        "constraints": ["(constraint1)", "(constraint2)", ...]
      }

      CRITICAL DESIGN PRINCIPLES:

      1. PREFER BOOLEAN PARAMETERS OVER STRING COMPARISONS
         - Instead of: {"name": "province", "type": "String"} with constraint (= province "Quebec")
         - Use: {"name": "is_quebec_province", "type": "Bool"} with constraint is_quebec_province
         - This avoids string matching issues (case sensitivity, abbreviations, variations)

      2. ALL-OR-NOTHING PATH MAPPINGS
         - If ALL parameters can be directly extracted from JSON paths → provide complete path_mappings
         - If ANY parameter requires interpretation → provide EMPTY path_mappings []
         - When path_mappings is empty, the system will automatically use LLM extraction

      3. WHEN TO USE EACH APPROACH
         - Path-based (provide mappings): Simple rules with direct field comparisons
         - LLM-based (empty mappings): Rules with categorical checks, interpretations, or complex logic

      Important guidelines:
      - Use dot notation for nested JSON paths
      - All parameters referenced in constraints must be declared
      - Use SMT-LIB types: Int for integers, Real for decimals, Bool for booleans, String for text
      - Mark parameters as required: true if they must exist, false if optional/computed
      - Add brief descriptions to parameters (helps extraction LLM)
      - Use SMT-LIB operators: =, <, >, <=, >=, +, -, *, /, and, or, not, implies (=>), ite
      - Constraints must directly encode pass/fail logic using implications (=>)
      - DO NOT create an "outcome" variable
    task_prompt: |
      Translate the following business rule into SMT-LIB constraints:

      Rule: {rule}

      Example Data Structure:
      {data_example}

      Generate:
      1. Variable definitions with appropriate types (Int, Real, Bool, String)
      2. Path mappings showing where to extract each variable from the data
      3. SMT-LIB constraints that formalize the rule logic

      Output as JSON with this exact structure:
      {{
        "parameters": [
          {{"name": "variable_name", "type": "Real", "required": true, "description": "Brief explanation"}},
          ...
        ],
        "path_mappings": [
          {{"parameter_name": "variable_name", "data_path": "path.to.field"}},
          ...
        ],
        "constraints": [
          "(constraint expression)",
          ...
        ]
      }}
    temperature: 0
    top_p: 0
    top_k: 20
    max_tokens: 4096
    few_shot_examples:
      - rule: "Municipal tax must match SAP tax within 5% margin"
        data_example:
          documents:
            municipal_tax_bill:
              inference_result:
                property_tax_amount: "5100"
          sap_data:
            financial_details:
              property_tax_annual: "5200"
        output:
          parameters:
            - name: "municipal_tax"
              type: "Real"
              required: true
            - name: "sap_tax"
              type: "Real"
              required: true
            - name: "margin"
              type: "Real"
              required: false
          path_mappings:
            - parameter_name: "municipal_tax"
              data_path: "documents.municipal_tax_bill.inference_result.property_tax_amount"
            - parameter_name: "sap_tax"
              data_path: "sap_data.financial_details.property_tax_annual"
          constraints:
            - "(= margin 0.05)"
            - "(and (>= sap_tax (* municipal_tax (- 1 margin))) (<= sap_tax (* municipal_tax (+ 1 margin))))"

  # Z3 engine: parameter value extraction from structured or unstructured data
  z3_value_extraction:
    model: us.anthropic.claude-haiku-4-5-20251001-v1:0
    system_prompt: |
      You are an expert at extracting structured data from various formats.

      Your task is to extract specific parameter values from the provided data, which may be:
      - Structured JSON (any schema)
      - Unstructured text
      - Mixed formats

      You will receive:
      1. A rule description explaining what the data represents
      2. Parameter definitions (name, type, required)
      3. Data in any format

      Output must be valid JSON:
      {
        "extracted_values": {
          "parameter_name": value,
          ...
        }
      }

      Important guidelines:
      - Extract values matching parameter types (Int, Real, Bool, String)
      - For Real/Int: remove currency symbols, commas, etc.
      - For percentages in calculations: use decimal form (5% → 0.05)
      - For Bool: use true/false
      - For String: preserve text as-is
      - If a required parameter cannot be found, use sensible defaults (0, false, "")
      - Only output the JSON, no additional text
    task_prompt: |
      Extract parameter values from the following data:

      Rule Description: {rule_description}
      Natural Language Rule: {natural_language_rule}

      Parameters to Extract:
      {parameters_json}

      Data Format: {data_type}
      Data:
      {data}

      Output as JSON:
      {{
        "extracted_values": {{
          "parameter_name": value,
          ...
        }}
      }}
    temperature: 0
    top_p: 0
    top_k: 20
    max_tokens: 2048

  z3_timeout_ms: 5000

# ============================================================================
# Document Classes
# ============================================================================
classes:
  - $schema: https://json-schema.org/draft/2020-12/schema
    x-aws-idp-doc-class: invoice
    type: object
    properties:
      vendor_name:
        type: string
        description: Name of the vendor or seller
      invoice_number:
        type: string
        description: Invoice number or identifier
      invoice_date:
        type: string
        description: Date of the invoice
      total_amount:
        type: number
        description: Total invoice amount
      tax_amount:
        type: number
        description: Tax amount on the invoice
      subtotal:
        type: number
        description: Subtotal before tax
    $id: invoice

# ============================================================================
# Policy Classes — same rules tested on both engines for comparison
# ============================================================================
policy_classes:
  # --- LLM engine: invoice math (for comparison) ---
  - $schema: https://json-schema.org/draft/2020-12/schema
    x-aws-idp-policy-type: invoice_math_llm
    type: object
    rule_properties:
      tax_calculation:
        type: string
        description: >-
          The total amount must equal the subtotal plus the tax amount.
        x-aws-idp-validation-engine: llm
      tax_rate_check:
        type: string
        description: >-
          The tax amount must be between 5% and 15% of the subtotal.
        x-aws-idp-validation-engine: llm
    $id: invoice_math_llm

  # --- Z3 engine: same invoice math rules ---
  - $schema: https://json-schema.org/draft/2020-12/schema
    x-aws-idp-policy-type: invoice_math_z3
    type: object
    rule_properties:
      tax_calculation:
        type: string
        description: >-
          The total amount must equal the subtotal plus the tax amount.
        x-aws-idp-validation-engine: z3
      tax_rate_check:
        type: string
        description: >-
          The tax amount must be between 5% and 15% of the subtotal.
        x-aws-idp-validation-engine: z3
    $id: invoice_math_z3
