name: Developer Tests

on:
  pull_request:
    branches:
      - "**" # Run on PR open, update, or synchronize (i.e., any push to PR branch)
  # ⚠️ A manual re-run path, because the `pull_request` event is not guaranteed
  # to arrive. Observed on this repository: a push updated the PR head (the ref
  # and the API's `headRefOid` both advanced, the PR was open and not a draft,
  # and every workflow read `state: active`), and GitHub dispatched nothing for
  # that SHA — zero workflow runs and zero check-runs, while a `schedule` run
  # fired normally minutes later. `reopened` is in the default `types:` and
  # closing and reopening the PR did not fix it either.
  #
  # With no `workflow_dispatch` there was no way to get the gates onto that
  # commit at all, and the symptom is the dangerous one: `gh pr checks` reports
  # "no checks reported", which a reviewer cannot tell apart from checks that
  # have not started yet. Running this against the branch produces branch checks
  # rather than PR checks, so they will not appear in the PR's own list — read
  # the run directly (`gh run list --branch <branch>`).
  workflow_dispatch:

# Least-privilege default for the GITHUB_TOKEN. Without this, any job that
# omits its own `permissions:` block inherits the repository default, which can
# be write-all. Jobs that need more declare it themselves (see below), and this
# floor is what any future job gets until it does.
permissions:
  contents: read

# ⚠️ WHY THIS IS FOUR JOBS. It was one `developer_tests` job running lint,
# typecheck and every pytest suite in sequence, and it took 34-46 minutes of which
# 88% was pytest (`test-packages-cicd` 942s, `test-cicd -C lib/idp_common_pkg`
# 783s, UI 94s, against 106s of lint and 50s of typecheck). Splitting it is worth
# MORE here than on the GitLab side, and for a different reason: GitLab ran one
# 16-vCPU runner, so splitting only stopped the lint half waiting on the test half,
# whereas `ubuntu-latest` is 4 vCPU and **each job gets its own runner** — so four
# jobs multiply the available CPU rather than merely overlapping the work.
#
# The jobs are deliberately independent (no `needs:`), so the workflow costs its
# slowest member rather than the sum. Nothing is shared between them except the
# checkout, which each does for itself.
#
# ⚠️ Splitting changed how many requireable status-check CONTEXTS the shared gates
# produce — it was one job holding eight of them, and is now four. That number is
# derived and asserted by scripts/tests/test_documented_counts.py, which fails any
# document stating a stale figure, and the branch-protection checker in
# scripts/sdlc/ reads the job names out of this file to build its expected
# required-check list. Adding or renaming a job here moves both; it is not a local
# edit.
#
# Four parallel jobs on a free-for-public-repos runner pool cost nothing extra
# here, which is the one way this is cheaper than the GitLab equivalent.
jobs:
  # Lint, format, types, and the static scans. Everything that reads the tree
  # without running a test suite.
  #
  # ⚠️ Named for what it runs. It was `developer_tests`, which after the split ran
  # no tests at all - the most misleading name in either CI - and the display name
  # is what becomes the requireable status-check context, so both move together.
  # Not named after a Makefile target: `make lint-cicd` is one of five steps here.
  static_checks:
    name: Static Checks (lint, types, scans)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read

    # Use Python 3.13 to match GitLab configuration
    container:
      image: python:3.13-bookworm

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          # Full clone. No gate below diffs against the base ref any more, but a
          # shallow clone is a trap for any that later does, and the cost here is
          # negligible. scripts/tests/test_no_skip_ci_markers.py also relies on
          # full history.
          fetch-depth: 0

      - name: Set up Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # No step fetches or interpolates `github.base_ref`. If one is ever added,
      # note that it is attacker-controllable — a fork can name its branch
      # anything — so it must be passed through `env:` and quoted, never
      # interpolated straight into `run:` where the shell would evaluate it.
      - name: Set up the Python environment
        uses: ./.github/actions/python-env
        with:
          node: "true"       # basedpyright, for `make typecheck`
          cfn-lint: "true"   # `make lint-cicd` gates templates

      - name: Run linting checks
        run: make lint-cicd

      # Parity with GitLab's static_checks. `api-test-static` and
      # `validate_service_role_permissions.py` ran only on GitLab, so a change
      # merged via a GitHub PR skipped them entirely — the same class of gap the
      # SRT/dep-audit note in CLAUDE.md describes. Both are pure static checks:
      # no AWS credentials, no network.
      #
      # The first-party check below is NOT in that category: `make
      # install-first-party` already runs it (Makefile:79). It is re-asserted here
      # as its own named step so a dependency-confusion failure is attributable at
      # a glance rather than buried in install output — it is the check that stops
      # a squatted PyPI package being resolved in place of a sibling package.
      - name: Check first-party dependency resolution
        run: python scripts/check_first_party_deps.py

      - name: Static API RBAC scan
        run: make api-test-static

      - name: Validate CloudFormation service-role permissions
        run: python scripts/sdlc/validate_service_role_permissions.py

      # The WHOLE tree, not just the files this PR touched. A PR-scoped check
      # (`make typecheck-pr`) was what ran here, and it narrows basedpyright to
      # the changed files — so it cannot see a break the change caused in a file
      # the diff did not include, which is the ordinary shape of a type error.
      # It also meant nothing ever ran the check that pyrightconfig.json's
      # `include` closure is a closure OF. A full run is ~1 minute over the whole
      # tracked tree.
      - name: Run type checking
        run: make typecheck

  # The idp_common_pkg suite — the largest in the repo, and the critical path of
  # this workflow.
  #
  # ⚠️ Its runtime is not a parallelism problem, so do not reach for more workers:
  # profiled over the whole suite the slowest single test is 2.2s and the top 20
  # together are ~35s of a 10-minute run, so the cost is ~10,000 x per-test fixture
  # setup spread flat. It already runs `-n auto` via PYTEST_PARALLEL.
  #
  # The coverage ratchet, the artifact upload and the Test Results check all live
  # here because they read the report this job writes. Splitting them into a
  # dependent job would mean passing that report between jobs as an artifact for no
  # gain.
  unit_tests:
    name: Unit Tests (idp_common)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: read
      issues: read
      checks: write
      # pull-requests: write - Not needed: PR comments are disabled (see below)

    container:
      image: python:3.13-bookworm

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # ⚠️ Node and the pinned cfn-lint are load-bearing here, and neither is visible
      # from any `run:` line below. This job used to need neither; the coverage
      # producer two steps down re-runs the `scripts` and `idp_sdk` suites to measure
      # them, which drags their toolchain requirements into this job wholesale —
      # `scripts/tests/test_ux_recorder.py` runs the recorder's cursor-overlay
      # JavaScript under node and FAILS rather than skipping without it, and
      # `scripts/tests/test_pyright_config.py` runs basedpyright live. cfn-lint is
      # about PINNING rather than availability, for the cfn-lint-gated assertions
      # in `lib/idp_sdk/tests/unit/` — see `package_tests` below, which carries the
      # same three inputs for the same three reasons. Read the suites, not the steps.
      # `ui-deps: true` is the third and the least visible: the same coverage step
      # brings in `test_ui_test_discovery.py`, which checks its hand-written copies
      # of Vitest's file-naming convention against the installed Vitest. Those three
      # assertions used to SKIP wherever the UI's npm dependencies were absent,
      # which was every job but `ui_tests`, and a skip leaves the job exiting 0
      # (#1390) — so the literals that are the input to that module's gate
      # assertions were calibrated on developer machines and in neither CI.
      - name: Set up the Python environment
        uses: ./.github/actions/python-env
        with:
          node: "true"
          cfn-lint: "true"
          ui-deps: "true"

      - name: Run tests
        id: run-tests
        run: make test-cicd -C lib/idp_common_pkg

      # The step above writes ONE of the ratchet's nine trees. Without this step the
      # other eight resolve to no report at all, so the ratchet named them as
      # "not checked" and exited 0 — advisory-but-passing over exactly the trees
      # where coverage had actually been lost, including this repository's own hook
      # guards (issue #1256). Trees are measured concurrently and `idp_common` is
      # skipped because the step above already produced its report; the ratchet below
      # still requires it by name.
      - name: Coverage reports for every other measurable tree (concurrent)
        run: make coverage-all-cicd
        continue-on-error: false

      - name: Coverage ratchet (per-file, every registry tree required by name)
        run: make check-coverage-debt-cicd
        continue-on-error: false

      - name: Upload coverage reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always() && steps.run-tests.outcome != 'skipped'
        with:
          name: test-reports
          path: |
            lib/idp_common_pkg/test-reports/coverage.xml
            lib/idp_common_pkg/test-reports/test-results.xml
          retention-days: 7

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@c950f6fb443cb5af20a377fd0dfaa78838901040  # v2.23.0
        if: always() && hashFiles('lib/idp_common_pkg/test-reports/test-results.xml') != ''
        with:
          files: lib/idp_common_pkg/test-reports/test-results.xml
          check_name: Test Results
          comment_mode: off  # Disable PR comments to avoid permission issues on fork PRs

      # COVERAGE IS REPORTED, NOT ENFORCED, AND DELIBERATELY SO.
      #
      # `fail_below_min: false` is the decision, and `thresholds` below only
      # colours the badge — read together they look like a 60% gate, and they are
      # not one. The reason is scope, not laziness: the only coverage.xml that
      # exists is lib/idp_common_pkg's, which is ONE of the ~64 test roots
      # scripts/run_all_tests.py discovers. A repo-wide minimum computed from it
      # would be a number about one package presented as a number about the
      # repository, and it would move whenever that package's share of the code
      # changed, with no relation to whether a PR was tested.
      #
      # Widening the measurement is the prerequisite for enforcing it, in that
      # order. See the "Coverage is reported, not enforced" section in
      # CONTRIBUTING.md.
      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95  # v1.3.0
        if: always() && hashFiles('lib/idp_common_pkg/test-reports/coverage.xml') != ''
        with:
          filename: lib/idp_common_pkg/test-reports/coverage.xml
          badge: true
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          # Badge colour thresholds only. Enforcement is `fail_below_min`, above.
          thresholds: "60 80"

      # Note: PR comments disabled for fork PRs due to permission restrictions
      # Coverage results are available in:
      # 1. Workflow artifacts (test-reports)
      # 2. Job summary (automatically generated by CodeCoverageSummary)
      # 3. GitHub checks tab

  # The package / Lambda suites `test-cicd -C lib/idp_common_pkg` does not cover:
  # idp_cli, idp_sdk, idp_feature_sdk, the feature-platform resolvers, the seller
  # entitlement service (including its template-security assertions and
  # payload-robustness fuzz corpus), and the repo's own gate suites under
  # `scripts/` (deployment-variant probes, the API security cases, and the IAM
  # trust-policy partition guards that keep a GovCloud-only principal out of a
  # commercial trust policy — see issue #632). All offline — no AWS, no credentials.
  package_tests:
    name: Package and Lambda Test Suites
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: read

    container:
      image: python:3.13-bookworm

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          # Full history: `scripts/tests` includes test_no_skip_ci_markers.py,
          # which scans the commits after a pinned start point.
          fetch-depth: 0

      - name: Set up Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # ⚠️ `node: true` is load-bearing here and is NOT obvious from the step
      # below. `scripts/tests` is one of the suites this target runs, and
      # test_pyright_config.py RUNS basedpyright — a live probe confirming that
      # pyrightconfig.json's `extraPaths` really resolve the first-party packages
      # rather than merely looking right. Omitting it on the GitLab side cost a red
      # job plus four tests that SKIPPED green, which is the worse half. The answer
      # is to give the job the tool, not to let the probe skip when it is absent.
      # Node is also needed on its own account: test_ux_recorder.py runs the
      # recorder's cursor-overlay JavaScript under node to check that a click is
      # never labelled by what was typed, and fails in CI when node is missing.
      # ⚠️ `cfn-lint: true` here is about PINNING, not availability. cfn-lint
      # arrives transitively either way — moto declares `cfn-lint>=0.40.0` under
      # several of its extras, and the first-party install pulls moto — so the
      # ~10 cfn-lint-gated assertions in `lib/idp_sdk/tests/unit/` do run without
      # it. What they would run against is whatever that open range resolves to,
      # where the single pre-split job installed the pinned version before any
      # suite started. Asking for the pin keeps those assertions measuring the
      # same linter `make cfn-lint` uses, rather than coinciding with it by luck.
      # ⚠️ `ui-deps: true` is the third of these and was the one that cost most to
      # find, because omitting it did NOT turn this job red.
      # `test_ui_test_discovery.py` calibrates its hand-written copies of Vitest's
      # file-naming convention against the installed Vitest — `vitest list
      # --filesOnly`, `defaultInclude`, and the expanded extension set against
      # picomatch — and answered an absent `src/ui/node_modules` with a skip. So
      # three assertions reported as skipped, the job exited 0, and the literals
      # that are the *input* to that module's gate assertions were checked nowhere
      # but on a developer's machine (#1390). The module now fails rather than
      # skips when it finds them missing under CI, so this input is load-bearing
      # for the job staying green as well as for the check meaning anything.
      - name: Set up the Python environment
        uses: ./.github/actions/python-env
        with:
          node: "true"
          cfn-lint: "true"
          ui-deps: "true"

      - name: Run package and Lambda test suites
        id: run-package-tests
        run: make test-packages-cicd
        continue-on-error: false

  # UI unit tests (Vitest + jsdom, no browser).
  #
  # Its own job because it is the one member of this workflow that needs Node and
  # NOT the Python packages, so pairing it with anything else would mean installing
  # a whole toolchain for nothing. No container: the default runner image already
  # has what setup-node needs, and skipping the container pull is most of why this
  # job is the fastest of the four.
  ui_tests:
    name: UI Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      # `--silent` for the reason spelled out beside the GitLab copy of this step:
      # the suites console.log from component code and React emits a full component
      # stack per act(...) warning, which is enough output to bury whatever follows
      # it. GitHub does not truncate the log the way GitLab does, so here it is
      # legibility rather than lost diagnostics — but the two steps are compared by
      # scripts/tests/test_ci_gate_parity.py and should not drift on a flag.
      - name: Run UI unit tests
        id: run-ui-tests
        run: cd src/ui && npm ci --prefer-offline --no-audit && npx vitest run --silent
        continue-on-error: false
