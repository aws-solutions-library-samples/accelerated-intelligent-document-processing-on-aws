# The Python toolchain plus every first-party package, for the jobs in
# developer-tests.yml that run Python gates.
#
# This exists because that workflow is four parallel jobs sharing most of one
# environment, and GitHub Actions does NOT support YAML anchors — so without a
# composite action the setup would be copy-pasted four times and would drift. The
# GitLab side solves the same problem with `&python_setup`; this is the equivalent.
name: Set up the Python environment
description: uv, a virtualenv on PATH, and all first-party packages from source

inputs:
  node:
    description: >-
      Also install Node 22 and basedpyright. Needed by any job whose gates shell
      out to basedpyright — which is not only the type gate: `scripts/tests`
      contains a LIVE basedpyright probe, so the package suites need it too — and
      by any job that runs `scripts/tests/test_ux_recorder.py`, whose click-label
      tests run under node and fail in CI without it.
    required: false
    default: "false"
  cfn-lint:
    description: Also install the pinned cfn-lint (only `make lint-cicd` needs it).
    required: false
    default: "false"
  ui-deps:
    description: >-
      Also run `npm ci` in `src/ui`, for a job that runs `scripts/tests`.
      `test_ui_test_discovery.py` checks its hand-written copies of Vitest's
      file-naming convention against the installed Vitest, so without the UI's
      dependencies those three assertions cannot run — and until #1390 they
      answered that by SKIPPING, in every job but the UI one, so the literals that
      are the input to that module's gate assertions were calibrated nowhere.
      Implies `node`.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up environment
      shell: bash
      run: |
        python --version
        apt-get update -y
        apt-get install make curl -y

    # Use the first-party pinned action rather than
    # `curl -LsSf https://astral.sh/uv/install.sh | sh`: piping a remote script
    # into a shell executes whatever the endpoint serves, and the pipeline also
    # hid failures (it exited with sh's status, not curl's). The action also puts
    # uv on PATH itself.
    - name: Install uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.3.1

    - name: Create virtual environment
      shell: bash
      run: |
        uv venv .venv
        echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

    # Node 22 via the first-party action rather than piping NodeSource's installer
    # into bash: that pipeline swallowed a failed download (`curl ... | bash -`
    # exits with bash's status, not curl's), so a NodeSource 403 silently left the
    # repo unregistered, the following apt-get installed Debian's own nodejs 18 —
    # which ships no npm — and the job failed later with a bare `npm: not found`.
    - name: Install Node.js
      if: inputs.node == 'true' || inputs.ui-deps == 'true'
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22

    - name: Install basedpyright
      if: inputs.node == 'true'
      shell: bash
      run: npm install -g basedpyright

    # Deliberately inside this action rather than as a step in the caller, which is
    # what puts it before the caller's own steps: a setup step that lands after the
    # step it is setting up for is a configuration error nothing in the job's exit
    # code reveals.
    #
    # Uncached, unlike the GitLab side and unlike the `ui_tests` job in
    # developer-tests.yml, and that is a choice rather than an omission.
    # `actions/setup-node`'s npm cache has only ever run here in `ui_tests`, which
    # has no `container:`; these jobs do, and asking a mechanism proven elsewhere to
    # work in a configuration this repository has not run it in trades about 30
    # seconds against both of these jobs going red. `--prefer-offline` keeps the
    # install cheap, and nothing about whether the calibrations RUN depends on a
    # cache hit — which is the property worth protecting, since a cache that
    # silently stops hitting is how they came to be skipped in the first place.
    - name: Install the web UI's npm dependencies
      if: inputs.ui-deps == 'true'
      shell: bash
      run: cd src/ui && npm ci --prefer-offline --no-audit

    - name: Install Python dependencies
      shell: bash
      env:
        WANT_CFN_LINT: ${{ inputs.cfn-lint }}
      run: |
        # Every install below is constrained to lib/idp_common_pkg/uv.lock, so CI
        # tests the dependency set the lock records rather than whatever the index
        # resolves to today. The tool pins take the same `-c`, so a tool installed
        # first cannot hold a shared dependency at an unlocked version, and
        # `install-first-party` applies it itself. Passed per command rather than
        # as UV_CONSTRAINT, which would reach every later `uv` call in the job,
        # including the layer builds a publish test could start. Same file, same
        # form as `.python_setup` in .gitlab-ci.yml; see LOCK_CONSTRAINTS in the
        # Makefile (#1707).
        export LOCK_CONSTRAINTS="$GITHUB_WORKSPACE/build/lock-constraints/idp_common_pkg.txt"
        make lock-constraints
        # Pinned for the same reason as cfn-lint below: an unpinned linter on a
        # blocking gate can red-line develop with no code change. Keep in step
        # with RUFF_VERSION in the Makefile, which is the single source of truth
        # — scripts/tests/test_ci_gate_parity.py fails if this, .gitlab-ci.yml
        # and the Makefile disagree.
        uv pip install -c "$LOCK_CONSTRAINTS" 'ruff==0.15.13'
        if [ "$WANT_CFN_LINT" = "true" ]; then
          # Pinned: cfn-lint gates templates via `make lint-cicd`, and an unpinned
          # linter can red-line develop with no code change when a new release
          # promotes a check to ERROR class. Keep in step with CFN_LINT_VERSION in
          # the Makefile.
          uv pip install -c "$LOCK_CONSTRAINTS" 'cfn-lint==1.51.0'
        fi
        uv pip install -c "$LOCK_CONSTRAINTS" typer rich boto3
        # ALL first-party packages in a single pip pass. They depend on each other
        # by bare name and those names are squatted on public PyPI, so a split
        # install would resolve a sibling from PyPI — see the FIRST_PARTY_EDITABLES
        # note in the Makefile. The target also runs
        # scripts/check_first_party_deps.py, which fails if any of them did.
        make install-first-party PIP="uv pip"
