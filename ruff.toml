# What the Python lint gates do and do not read, and why.
#
# EVERY EXCLUSION BELOW NAMES A PATH, NEVER A BARE DIRECTORY NAME. A bare name in
# ruff's exclusion patterns matches at *any* path depth, and `make ruff-lint`,
# `make format` and `make lint-cicd` all invoke ruff with no path argument, so the
# exclusions apply. This file used to exclude `notebooks`, `options`, `patterns`,
# `src` and `scripts` that way, which meant 442 of 1230 tracked .py files were read
# by neither the linter nor the formatter -- including all 138 files under
# `scripts/` (this repository's own gate layer, 137 of them at its root plus one
# under `security/threat-modeling/scripts/`) and 76 files under `nested/*/src/` --
# 67 API-resolver Lambdas and 9 Bedrock Knowledge Base custom-resource handlers --
# which nobody had counted because `src` matched there too. A clean `ruff check` on
# any of them meant the file was never opened. Issue #975.
#
# The three arrays below are GENERATED from scripts/lint_debt.json, which also
# records, per file, exactly which findings each exclusion shields. `make
# check-lint-debt` re-measures with the exclusions bypassed and fails if a listed
# file gains a finding, becomes clean (delist it), or disappears -- so a new
# violation inside an excluded file is still caught, and a new file anywhere in the
# repository is linted by default. To change any of them:
#
#     python3 scripts/check_lint_debt.py --write
#
# which REFUSES to grow either list without --allow-new-debt "<reason>". To ask
# whether one file is read by either gate, use `--explain <path>`: no ruff
# invocation answers that correctly, because --force-exclude restores only the
# discovery-level exclusions and the two arrays below filter after discovery.
#
# `scope` is the only array that is a judgement rather than debt: those paths hold
# code ruff's rules do not describe. Each carries a premise that
# scripts/check_lint_debt.py evaluates against this tree.
extend-exclude = [
# >>> GENERATED scope — edit scripts/lint_debt.json, then --write
    "**/*.ipynb",
    "feature-platform/pii-anonymizer/hook/vendor",
# <<< GENERATED scope
]

# Build output, caches and checkouts-inside-the-checkout. These ARE bare names on
# purpose -- a `build/` or `.venv/` at any depth is build output wherever it sits,
# which is the opposite of the `src`/`scripts` case above. `scratch/` and
# `.claude/worktrees/` routinely hold whole copies of this repository.
#
# Because these ARE bare names, `check_lint_debt.py`'s bare-name check deliberately
# does not read this array — so it asserts the property instead, in both
# directions: ruff's walk must reach nothing git ignores, and it must reach every
# tracked source file that no `scope` entry accounts for. Naming a source tree here
# would therefore fail, which is what stops issue #975 being re-opened through this
# array with every other check green.
exclude = [
    ".aws-sam",
    ".bzr",
    ".claude",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "cdk.out",
    "dist",
    "node_modules",
    "scratch",
    "site-packages",
    "venv",
]

