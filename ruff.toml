# Let's exclude some whole directories until we are ready to format them individually
extend-exclude = [
    "lib/appsync_helper_pkg",
    "lib/get_config_pkg",
    "lib/idp_common_pkg/idp_common/bedrock",
    # idp_common/config is excluded FILE-BY-FILE rather than as a directory, so
    # that anything NEW added there is linted by default. A shared helper
    # (schema_utils.py) landed in this package and silently got no lint, isort or
    # format enforcement because the whole directory was skipped. These entries
    # are pre-existing debt (31 findings); do not add to the list.
    "lib/idp_common_pkg/idp_common/config/__init__.py",
    "lib/idp_common_pkg/idp_common/config/class_names.py",
    "lib/idp_common_pkg/idp_common/config/configuration_manager.py",
    "lib/idp_common_pkg/idp_common/config/constants.py",
    "lib/idp_common_pkg/idp_common/config/merge_utils.py",
    "lib/idp_common_pkg/idp_common/config/migration.py",
    "lib/idp_common_pkg/idp_common/config/migrations",
    "lib/idp_common_pkg/idp_common/config/models.py",
    "lib/idp_common_pkg/idp_common/config/schema_constants.py",
    "lib/idp_common_pkg/idp_common/config/system_defaults",
    "lib/idp_common_pkg/idp_common/image",
    "lib/idp_common_pkg/idp_common/metrics",
    "lib/idp_common_pkg/idp_common/s3",
    "lib/idp_common_pkg/idp_common/utils",
    "notebooks",
    "options",
    "patterns",
    "src",
    "scripts",
    # Vendored third-party code (AWS Labs pii-anonymizer, Apache-2.0). Kept
    # byte-for-byte to ease re-sync; not linted against our style. See
    # feature-platform/pii-anonymizer/hook/vendor/PROVENANCE.md.
    "feature-platform/pii-anonymizer/hook/vendor",
]

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.12
target-version = "py312"

[lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F"]
ignore = []
# Note: if you're using Ruff to organize imports in VS Code and also expect to run Ruff from the command line, you'll want to enable Ruff's isort rules by adding "I" to your extend-select.
# TID251: enforce banned-api rules (prevents direct imports from idp_sdk._core)
extend-select = ["I", "TID251"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.isort]
known-first-party = ["idp_common", "idp_cli", "idp_sdk", "idp_feature_sdk", "idp_mcp_connector"]

[lint.flake8-tidy-imports.banned-api]
"idp_sdk._core" = {msg = "This is a private internal module. Use IDPClient from idp_sdk instead."}

[lint.per-file-ignores]
# Let's ignore some annoying rules in notebooks
"notebooks/*" = ["F401"]
# Internal SDK implementation files are allowed to import from _core
"lib/idp_sdk/idp_sdk/**" = ["TID251"]
# Lambda tools that need direct _core access
"src/lambda/**" = ["TID251"]
# Tests mock _core internals directly
"lib/idp_cli_pkg/tests/**" = ["TID251"]
"lib/idp_sdk/tests/**" = ["TID251"]

[format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"
