[lint.per-file-ignores]
# Internal SDK implementation files are allowed to import from _core
"lib/idp_sdk/idp_sdk/**" = ["TID251"]
# Lambda tools that need direct _core access
"src/lambda/**" = ["TID251"]
# Tests mock _core internals directly
"lib/idp_cli_pkg/tests/**" = ["TID251"]
"lib/idp_sdk/tests/**" = ["TID251"]
# The gate tests reach into _core for the same reason the SDK's own tests do: they
# monkeypatch the template transformer, or read its resource list to compare against
# a template. Neither has a public equivalent -- the public wrapper is what they are
# standing in for. Listed per directory rather than as `scripts/**/tests/**` so a
# new gate-test directory fails closed and its author makes the same decision.
"scripts/tests/**" = ["TID251"]
"scripts/sdlc/tests/**" = ["TID251"]

