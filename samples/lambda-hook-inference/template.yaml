AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Sample Lambda Hook functions for GenAI IDP Accelerator's LambdaHook custom inference feature.
  Deploy these to test and illustrate the LambdaHook integration pattern.

Parameters:
  LogRetentionDays:
    Type: Number
    Default: 30
    Description: >
      Days to retain this sample hook's CloudWatch logs. Without an explicit log
      group, Lambda auto-creates one with NO retention and the logs are billed
      indefinitely — these hooks run per document, so that adds up (issue #826).
    AllowedValues:
      [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]

  IDPWorkingBucket:
    Type: String
    Description: >
      Name of the IDP stack's working S3 bucket. Required for reading images
      that are uploaded as S3 references in the LambdaHook payload.

  TargetModelId:
    Type: String
    Default: "us.amazon.nova-pro-v1:0"
    Description: Bedrock model ID for the bedrock-proxy sample function.

  SageMakerEndpointName:
    Type: String
    Default: ""
    Description: >
      SageMaker endpoint name for the sagemaker-hook sample function.
      Leave empty if not using the SageMaker sample.

  ChandraApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: >
      Datalab API key for the Chandra OCR hook sample function.
      Get your key from https://www.datalab.to
      Leave empty if not using the Chandra sample.

  ChandraApiUrl:
    Type: String
    Default: "https://www.datalab.to"
    Description: Datalab API base URL.

  ChandraOutputFormat:
    Type: String
    Default: "markdown"
    AllowedValues:
      - markdown
      - json
      - html
    Description: Output format for Chandra OCR results.

  ChandraConversionMode:
    Type: String
    Default: "accurate"
    AllowedValues:
      - fast
      - balanced
      - accurate
    Description: >
      Conversion quality mode. 'fast' for lowest latency, 'accurate' for highest quality.

  MistralApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: >
      Mistral API key (Bearer token) for the Mistral OCR hook sample function.
      Get your key from https://console.mistral.ai
      Leave empty if not using the Mistral sample.

  MistralApiUrl:
    Type: String
    Default: "https://api.mistral.ai/v1/ocr"
    Description: Mistral OCR endpoint URL.

  MistralOcrModel:
    Type: String
    Default: "mistral-ocr-latest"
    Description: Mistral OCR model id (e.g. mistral-ocr-latest).

  MistralIncludeBlocks:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Request paragraph bounding boxes (geometry) from Mistral OCR.

  MistralConfidenceGranularity:
    Type: String
    Default: "word"
    AllowedValues:
      - word
      - page
    Description: Confidence score granularity for Mistral OCR.

Resources:
  # =========================================================================
  # GENAIIDP-bedrock-proxy
  # Forwards LambdaHook payloads to Amazon Bedrock Converse API
  # =========================================================================
  BedrockProxyFunction:
    Type: AWS::Serverless::Function
    # checkov:skip=CKV_AWS_173: "Environment variables contain non-sensitive configuration values (model ID and log level)"
    # checkov:skip=CKV_AWS_116: "DLQ not required for sample Lambda hook function - errors handled by IDP pipeline"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency - sample function for demonstration purposes"
    Properties:
      FunctionName: GENAIIDP-bedrock-proxy
      Runtime: python3.12
      Handler: index.lambda_handler
      CodeUri: GENAIIDP-bedrock-proxy/
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          TARGET_MODEL_ID: !Ref TargetModelId
          LOG_LEVEL: INFO
      Policies:
        - Statement:
            # Read images from IDP working bucket
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource:
                - !Sub "arn:${AWS::Partition}:s3:::${IDPWorkingBucket}/temp/lambdahook/*"
            # Invoke Bedrock models
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
                - bedrock:GetInferenceProfile
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:application-inference-profile/*"
      LoggingConfig:
        LogGroup: !Ref BedrockProxyFunctionLogGroup

  BedrockProxyFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/${AWS::StackName}/lambda/BedrockProxyFunction"
      RetentionInDays: !Ref LogRetentionDays

  # =========================================================================
  # GENAIIDP-sagemaker-hook
  # Forwards LambdaHook payloads to a SageMaker real-time inference endpoint
  # =========================================================================
  SageMakerHookFunction:
    Type: AWS::Serverless::Function
    # checkov:skip=CKV_AWS_173: "Environment variables contain non-sensitive configuration values (endpoint name and log level)"
    # checkov:skip=CKV_AWS_116: "DLQ not required for sample Lambda hook function - errors handled by IDP pipeline"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it only interacts with AWS services via APIs"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency - sample function for demonstration purposes"
    Properties:
      FunctionName: GENAIIDP-sagemaker-hook
      Runtime: python3.12
      Handler: index.lambda_handler
      CodeUri: GENAIIDP-sagemaker-hook/
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          SAGEMAKER_ENDPOINT_NAME: !Ref SageMakerEndpointName
          LOG_LEVEL: INFO
      Policies:
        - Statement:
            # Read images from IDP working bucket
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource:
                - !Sub "arn:${AWS::Partition}:s3:::${IDPWorkingBucket}/temp/lambdahook/*"
            # Invoke SageMaker endpoint
            - Effect: Allow
              Action:
                - sagemaker:InvokeEndpoint
              Resource:
                - !Sub "arn:${AWS::Partition}:sagemaker:${AWS::Region}:${AWS::AccountId}:endpoint/*"
      LoggingConfig:
        LogGroup: !Ref SageMakerHookFunctionLogGroup

  SageMakerHookFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/${AWS::StackName}/lambda/SageMakerHookFunction"
      RetentionInDays: !Ref LogRetentionDays

  # =========================================================================
  # GENAIIDP-chandra-ocr-hook
  # Calls the Chandra OCR 2 hosted API for high-quality OCR
  # =========================================================================
  ChandraOcrHookFunction:
    Type: AWS::Serverless::Function
    # checkov:skip=CKV_AWS_173: "API key is passed via NoEcho parameter, encrypted at rest by Lambda service"
    # checkov:skip=CKV_AWS_116: "DLQ not required for sample Lambda hook function - errors handled by IDP pipeline"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it calls an external HTTPS API"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency - sample function for demonstration purposes"
    Properties:
      FunctionName: GENAIIDP-chandra-ocr-hook
      Runtime: python3.12
      Handler: index.lambda_handler
      CodeUri: GENAIIDP-chandra-ocr-hook/
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          CHANDRA_API_KEY: !Ref ChandraApiKey
          CHANDRA_API_URL: !Ref ChandraApiUrl
          OUTPUT_FORMAT: !Ref ChandraOutputFormat
          CONVERSION_MODE: !Ref ChandraConversionMode
          POLL_INTERVAL: "3"
          MAX_POLL_ATTEMPTS: "60"
          LOG_LEVEL: INFO
      Policies:
        - Statement:
            # Read images from IDP working bucket
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource:
                - !Sub "arn:${AWS::Partition}:s3:::${IDPWorkingBucket}/temp/lambdahook/*"
      LoggingConfig:
        LogGroup: !Ref ChandraOcrHookFunctionLogGroup

  ChandraOcrHookFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/${AWS::StackName}/lambda/ChandraOcrHookFunction"
      RetentionInDays: !Ref LogRetentionDays

  # =========================================================================
  # GENAIIDP-mistral-ocr-hook
  # Calls the hosted Mistral OCR API for high-quality OCR with confidence + geometry
  # =========================================================================
  MistralOcrHookFunction:
    Type: AWS::Serverless::Function
    # checkov:skip=CKV_AWS_173: "API key is passed via NoEcho parameter, encrypted at rest by Lambda service"
    # checkov:skip=CKV_AWS_116: "DLQ not required for sample Lambda hook function - errors handled by IDP pipeline"
    # checkov:skip=CKV_AWS_117: "Function does not require VPC access as it calls an external HTTPS API"
    # checkov:skip=CKV_AWS_115: "Function does not require reserved concurrency - sample function for demonstration purposes"
    Properties:
      FunctionName: GENAIIDP-mistral-ocr-hook
      Runtime: python3.12
      Handler: index.lambda_handler
      CodeUri: GENAIIDP-mistral-ocr-hook/
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          MISTRAL_API_KEY: !Ref MistralApiKey
          MISTRAL_API_URL: !Ref MistralApiUrl
          MISTRAL_OCR_MODEL: !Ref MistralOcrModel
          INCLUDE_BLOCKS: !Ref MistralIncludeBlocks
          CONFIDENCE_GRANULARITY: !Ref MistralConfidenceGranularity
          REQUEST_TIMEOUT: "120"
          LOG_LEVEL: INFO
      Policies:
        - Statement:
            # Read images from IDP working bucket
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource:
                - !Sub "arn:${AWS::Partition}:s3:::${IDPWorkingBucket}/temp/lambdahook/*"
      LoggingConfig:
        LogGroup: !Ref MistralOcrHookFunctionLogGroup

  MistralOcrHookFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/${AWS::StackName}/lambda/MistralOcrHookFunction"
      RetentionInDays: !Ref LogRetentionDays

Outputs:
  BedrockProxyFunctionArn:
    Description: ARN of the Bedrock proxy Lambda hook function
    Value: !GetAtt BedrockProxyFunction.Arn

  SageMakerHookFunctionArn:
    Description: ARN of the SageMaker Lambda hook function
    Value: !GetAtt SageMakerHookFunction.Arn

  ChandraOcrHookFunctionArn:
    Description: ARN of the Chandra OCR Lambda hook function
    Value: !GetAtt ChandraOcrHookFunction.Arn

  MistralOcrHookFunctionArn:
    Description: ARN of the Mistral OCR Lambda hook function
    Value: !GetAtt MistralOcrHookFunction.Arn

  BedrockProxyUsage:
    Description: How to use the Bedrock proxy in IDP configuration
    Value: !Sub |
      Set model to "LambdaHook" and model_lambda_hook_arn to "${BedrockProxyFunction.Arn}"

  SageMakerHookUsage:
    Description: How to use the SageMaker hook in IDP configuration
    Value: !Sub |
      Set model to "LambdaHook" and model_lambda_hook_arn to "${SageMakerHookFunction.Arn}"

  ChandraOcrHookUsage:
    Description: How to use the Chandra OCR hook in IDP configuration
    Value: !Sub |
      Set OCR backend to "bedrock", model_id to "LambdaHook", and model_lambda_hook_arn to "${ChandraOcrHookFunction.Arn}"

  MistralOcrHookUsage:
    Description: How to use the Mistral OCR hook in IDP configuration
    Value: !Sub |
      Set OCR backend to "bedrock", model_id to "LambdaHook", and model_lambda_hook_arn to "${MistralOcrHookFunction.Arn}"
