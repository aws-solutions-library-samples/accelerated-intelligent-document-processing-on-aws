# Any publicly available image
image: public.ecr.aws/docker/library/python:3.13-bookworm

# Global timeout for all jobs
default:
  timeout: 2h

# Change pip's cache directory to be inside the project directory since we can
# only cache local items.
# variables:
#   PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# https://pip.pypa.io/en/stable/topics/caching/
# cache:
#   paths:
#     - .cache/pip

# Pipeline structure (see scripts/sdlc/docs/CI_TEST_COVERAGE.md for the full
# trigger matrix):
#   - fast_checks: the whole no-AWS gate, as SEVEN parallel jobs on every push and
#     every MR. Nothing in this stage depends on anything else in it, so they all
#     carry `needs: []` and the stage costs its SLOWEST member rather than their
#     sum.
#   - deployment_validation / integration_tests: the real AWS deploy + probe
#     suite. NIGHTLY (scheduled) plus a manual button — no longer triggered by an
#     MR or a push to develop. See the note on integration_tests for what that
#     trades away.
#
# ⚠️ WHY fast_checks IS SPLIT. It used to be one `static_checks` job running lint,
# typecheck and every pytest suite in sequence, and it took 45 minutes of which 80%
# was pytest: `test-packages-cicd` alone was 25 min because every one of its pytest
# invocations ran serial, single-process, on a 16-vCPU runner. The largest of them
# now run with `-n auto` (see PYTEST_XDIST in the Makefile) AND the job is split,
# because the two fixes address different halves — xdist shortens each suite, the
# split stops the lint half from waiting on the test half. Measured on this
# repository: a 111-minute merge-request pipeline became 14 minutes, and the stage's
# cost is now its slowest job rather than the sum.
#
# The cost of the split, stated plainly: the Python environment is now built in
# four jobs instead of one, so the pipeline burns MORE runner minutes than it did
# to finish in less wall-clock time. Each job installs only what it needs —
# `ui_tests` skips the Python packages entirely — which keeps that bill down, but
# it is a real trade, not a free win.
#
# ⚠️ Trimming a toolchain out of a job is NOT the free saving it looks like, and
# the way to find out is to read the SUITES rather than the `script:` block. Twice
# over, in opposite directions. `package_tests` was written without Node on the
# reasoning that pytest does not need it, and went red: `test_pyright_config.py`
# runs basedpyright live, so a suite whose name says nothing about types reaches an
# npm package. And the two jobs that run `scripts/tests` were written without the
# UI's npm dependencies, which did NOT go red — `test_ui_test_discovery.py` skipped
# the three assertions that need them and the job exited 0, so the calibration of
# that module's literals ran on developer machines and in neither CI (#1390). A
# missing toolchain is the cheap failure; a toolchain whose absence is answered
# with a skip is the expensive one.
stages:
  - fast_checks
  - deployment_validation
  - integration_tests
  # Advisory UX tests of a merge request (ux_test_build, ai_ux_test and
  # ai_ux_test_stories). After the deploy stages so nothing in them waits on
  # them; every job here sets `needs`, so none waits for an earlier stage. Not
  # gates, and not in fast_checks, whose jobs are the no-AWS gates and all
  # carry `needs: []`.
  - ux_review
  # Runs on a scheduled pipeline whatever happened upstream, so that a nightly
  # which never reached the deploy stage is still reported. See
  # nightly_notification.
  - notify

# ---------------------------------------------------------------------------
# Shared setup fragments.
#
# These exist because fast_checks is four jobs that need overlapping but NOT
# identical environments, and spelling each one out separately is how they drift.
# A job `extends:` the fragment it needs.
# ---------------------------------------------------------------------------

# Every no-AWS gate job: same runner class, same triggers, same cancel-on-push.
#
# Triggers are deliberately broad — EVERY push on any branch, and every MR — so a
# developer gets lint/typecheck/test feedback (GitLab emails on failure) without
# opening an MR first. There is no `changes:` filter: these are cheap and must run
# on everything, including docs-only commits.
.fast_check_job: &fast_check_job
  stage: fast_checks
  interruptible: true
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# Python toolchain + all first-party packages, for the jobs that run Python gates.
#
# SECURITY — dependency confusion: the first-party packages depend on each other by
# bare name (idp_cli_pkg -> "idp-sdk", idp_sdk -> "idp_common") and those names are
# squatted on public PyPI. Installing them one at a time lets a not-yet-installed
# sibling resolve from the index instead of the checkout, so they go in a SINGLE
# resolution pass. Do not split this. See docs/dependency-confusion.md.
.python_setup: &python_setup
  - python --version
  - apt-get update -y
  - apt-get install make curl git -y
  - pip install uv
  - uv venv .venv
  - source .venv/bin/activate
  # Pinned: ruff gates every Python file via `make lint-cicd`, and an unpinned
  # linter can red-line develop with no code change when a release promotes a
  # check to ERROR class or changes `ruff format` output. Keep in step with
  # RUFF_VERSION in the Makefile, which is the single source of truth — the
  # Makefile installs this version, the GitHub composite action installs it, and
  # scripts/tests/test_ci_gate_parity.py fails if any of the three drift.
  - uv pip install 'ruff==0.15.13'
  # Needed by publish.py for test imports
  - uv pip install typer rich boto3
  - uv pip install -e "lib/idp_common_pkg[test,evaluation]"
                   -e "lib/idp_sdk[test]"
                   -e "lib/idp_cli_pkg[test]"
                   -e "lib/idp_feature_sdk[test]"
  # Fail the build if any first-party package came from an index, not source.
  - python3 scripts/check_first_party_deps.py

# Node 22.14.0, pinned. Only the jobs that need it install it — the four
# `fast_checks` gate jobs, and the five AWS-facing ones below do not. Only
# `ui_tests` needs it for a reason its own `script:` block shows. The two that
# run `scripts/tests` — `unit_tests` and `package_tests` — need it for three
# modules in there: test_pyright_config.py runs
# basedpyright, an npm package; test_ux_recorder.py runs the recorder's
# cursor-overlay JavaScript under node; and test_ui_test_discovery.py consults the
# installed Vitest. All three fail in CI rather than skipping when their toolchain
# is missing, which is deliberate — see the npm lines in those jobs.
#
# Pick the tarball matching the runner arch: the size:2xlarge pool is arm64, and a
# hardcoded x64 binary fails with "Syntax error: ')' unexpected".
.node_setup: &node_setup
  - NODE_ARCH=$(case "$(uname -m)" in x86_64) echo x64;; aarch64|arm64) echo arm64;; *) echo x64;; esac)
  - echo "Runner arch $(uname -m) -> node $NODE_ARCH"
  - curl -fsSL https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-$NODE_ARCH.tar.xz | tar -xJ -C /usr/local --strip-components=1
  - npm install -g npm@11.1.0 || { echo "npm upgrade failed"; exit 1; }

# Paths whose change can actually affect a real stack deploy / its behavior.
#
# ⚠️ THIS NO LONGER GATES ANYTHING. It is kept deliberately, as the definition of
# "touches the deploy path" that the integration_tests comment below tells you to
# apply by hand when deciding whether to click the manual deploy button. It was a
# `changes:` filter on deployment_validation and integration_tests while those ran
# automatically per-MR; now that both are nightly-plus-manual there is no automatic
# deploy left for a path filter to suppress, and a manual button you click
# deliberately should always be available regardless of what the diff touched.
#
# Keep it current anyway — add a new deploy-affecting top-level directory here — so
# the judgement it encodes does not rot. Intentionally GENEROUS: when in doubt, a
# path belongs in the list.
#
# (If the deploy is ever returned to an automatic per-MR trigger, re-attaching this
# as a `changes:` rule is the first thing to do.)
.deploy_affecting_changes: &deploy_affecting_changes
  - template.yaml
  - publish.py
  - "requirements*.txt"
  - "patterns/**/*"
  - "nested/**/*"
  - "src/**/*"
  - "lib/**/*"
  - "config_library/**/*"
  - "feature-platform/**/*"
  - "iam-roles/**/*"
  - "scripts/**/*"          # includes scripts/sdlc/* (the CI harness itself)
  - ".gitlab-ci.yml"        # a pipeline-config change must re-run to validate itself

# Prevent DUPLICATE pipelines: without this, a push to a branch that has an open
# MR triggers BOTH a branch pipeline and an MR pipeline. Run the MR pipeline when
# an MR is open, otherwise the branch pipeline — never both.
#
# auto_cancel on develop: GitLab's "auto-cancel redundant pipelines" cancels the
# previous pipeline on a ref whenever ANY new pipeline is created there, and it
# cannot condition that on what the new commit touched. `on_new_commit: none`
# (GitLab >= 16.8) disables it on develop.
#
# It STAYS disabled, for a reason that survives the deploy going nightly. The
# original one did not: a doc-only commit to develop used to cancel the in-flight
# ~70-min deploy of the prior code commit, which was then never re-run, so that
# merge ended up never integration-tested. No deploy runs automatically on develop
# any more, so that exact sequence cannot happen. What can is the manual button —
# somebody clicks the deploy on a develop pipeline, a doc commit lands while it is
# running, and default auto-cancel would kill a ~1h run that a person deliberately
# started. Re-enabling the cancel would make the only remaining pre-merge deploy
# signal unreliable, to save a few minutes of fast_checks time.
#
# MR pipelines keep the default (conservative) supersede behavior.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == "develop"
      auto_cancel:
        on_new_commit: none
    - if: $CI_COMMIT_BRANCH

# Lint, format, type check, and the static API RBAC scan. Everything that reads the
# tree without running a test suite.
#
# ⚠️ Named for what it runs, which is the whole point of the name. It was
# `code_checks` while it ran lint, typecheck AND every pytest suite; once the
# suites moved out, "code checks" was vague enough that a green mark read as "the
# code is fine" when the tests had not been consulted — and on one merge this job
# went green five minutes before `unit_tests` finished. `static_checks` says what
# is true: everything here is static analysis.
#
# It is deliberately NOT named after a Makefile target, because no single target
# covers it — `make lint-cicd` is one of five steps, alongside `make typecheck`,
# `make api-test-static` and the two scans. A target-shaped name would trade
# today's over-claiming for under-claiming, leaving a reader to wonder whether
# types were checked at all.
static_checks:
  <<: *fast_check_job
  # Larger runner (16 vCPU / 64 GB, size:2xlarge): the Vite production build
  # tsc/eslint are CPU-bound and ran ~6 min on the default small runner vs
  # seconds locally.
  tags:
    - size:2xlarge
    - arch:arm64

  # Cache the UI dependencies across runs so the single `npm ci` (in
  # before_script) is near-instant. Keyed on the lockfile so a dependency change
  # invalidates it; `npm ci --prefer-offline` then serves from the restored
  # node_modules.
  cache:
    key:
      files:
        - src/ui/package-lock.json
    paths:
      - src/ui/node_modules/

  before_script:
    # No gate in this job diffs against the MR target branch, so no target-branch
    # fetch is needed. The type gate is `make typecheck`, over the whole tree.
    - *python_setup
    - *node_setup
    # basedpyright is an npm package, which is the only reason this job needs Node
    # at all besides the UI lint below.
    - npm install -g basedpyright
    # Install UI deps ONCE here (restored from cache when unchanged). The
    # lint-cicd UI targets run with SKIP_NPM_CI=1 so they reuse this instead of
    # each doing its own `npm ci` (which previously happened 3× per run).
    - cd src/ui && npm ci --prefer-offline --no-audit && cd ../..

  script:
    # SKIP_NPM_CI=1: UI deps already installed once in before_script, so the UI
    # lint/build/codegen targets don't each re-run `npm ci`.
    # `make lint-cicd` also runs validate-buildspec and cfn-lint; cfn-lint
    # ran in NEITHER CI before, so a template error could reach deploy time.
    # Pinned deliberately — an unpinned linter on a blocking gate can red-line
    # the branch with no code change. Keep in step with CFN_LINT_VERSION in the
    # Makefile.
    - pip install 'cfn-lint==1.51.0'
    - make lint-cicd SKIP_NPM_CI=1
    # The WHOLE tree, not just the files this MR touched. `make typecheck-pr` was
    # what ran here, and it narrows basedpyright to the changed files — so it
    # cannot see a break the change caused in a file the diff did not include,
    # which is the ordinary shape of a type error. It also meant nothing ever ran
    # the check that pyrightconfig.json's `include` closure is a closure OF.
    # A full run is ~1 minute over the whole tracked tree.
    - make typecheck
    # Static API RBAC/authorization scan (no AWS needed; catches op/schema/
    # expectations drift and missing server-side group checks).
    - make api-test-static
    # Pre-deploy IAM sanity check. It reads template.yaml against the service role's
    # policy and needs no credentials, so it belongs with the offline gates — it
    # used to sit in its own `deployment_validation` job, which now runs only on the
    # nightly path and so would have taken this check off every MR with it.
    - python3 scripts/sdlc/validate_service_role_permissions.py

# The idp_common_pkg suite — the largest single suite in the repo (~10,500 tests)
# and now the critical path of the whole pipeline at ~11 min.
#
# ⚠️ Its runtime is NOT a parallelism problem, so do not reach for more workers.
# Profiled over the whole suite, the slowest single test is 2.2s and the top 20
# together are ~35s of a 10-min run: the cost is ~10,000 × per-test fixture setup
# (moto, boto3 client construction), spread flat. It already runs `-n auto`
# (PYTEST_PARALLEL in lib/idp_common_pkg/Makefile) and measures 62% CPU on 14
# cores, so the remaining time is not CPU-bound either. Cutting it further means
# sharding it across several JOBS, which needs a splitter plugin and a
# `coverage combine` step before the ratchet below can read a complete report.
unit_tests:
  <<: *fast_check_job
  tags:
    - size:2xlarge
    - arch:arm64

  # For the UI dependencies the `scripts` suite needs — see the npm line in
  # before_script. Same key and path as the other three jobs that declare it.
  cache:
    key:
      files:
        - src/ui/package-lock.json
    paths:
      - src/ui/node_modules/

  before_script:
    - *python_setup
    # ⚠️ Node and the pinned cfn-lint are load-bearing here, and neither is visible
    # from any line in the `script:` block. This job needed neither until the coverage
    # producer below started re-running the `scripts` and `idp_sdk` suites in order to
    # measure them, which drags their toolchain requirements into this job wholesale:
    # `scripts/tests/test_ux_recorder.py` runs the recorder's cursor-overlay
    # JavaScript under node and FAILS rather than skipping without it, and
    # `scripts/tests/test_pyright_config.py` runs basedpyright live. `package_tests`
    # carries the same two for the same two reasons. Read the suites, not the script
    # block.
    - *node_setup
    - npm install -g basedpyright
    # PINNING, not availability — same reasoning as on `package_tests`: cfn-lint
    # arrives transitively via moto either way, and what the cfn-lint-gated
    # assertions in `lib/idp_sdk/tests/unit/` would otherwise run against is whatever
    # that open range resolves to. Keep in step with CFN_LINT_VERSION.
    - pip install 'cfn-lint==1.51.0'
    # The UI's npm dependencies, needed here for the same reason as the two above
    # and discoverable the same way: `make coverage-all-cicd` below re-runs the
    # `scripts` suite in order to measure it, and
    # `scripts/tests/test_ui_test_discovery.py` calibrates its hand-written copies
    # of Vitest's naming convention against the installed Vitest. Those three
    # assertions used to skip wherever the UI dependencies were absent, which was
    # every job but `ui_tests` (#1390); the module now fails instead, so this job
    # needs them to pass as well as to check anything.
    - cd src/ui && npm ci --prefer-offline --no-audit && cd ../..

  script:
    # SKIP_INSTALL=1: idp_common[test] already installed via uv above (avoids a
    # redundant plain-pip resolve that recompiled numpy from source).
    #
    # `-n auto` is not passed here: it is the Makefile's own default
    # (PYTEST_PARALLEL), so GitHub gets it too. Passing it again would put `-n auto`
    # on the command line twice, which pytest answers by collecting NOTHING and
    # exiting 5 -- loud rather than silent, but a broken job either way.
    - make test-cicd -C lib/idp_common_pkg SKIP_INSTALL=1
    # The line above writes ONE of the ratchet's trees. Without the next step the
    # others resolve to no report at all, so the ratchet named them as
    # "not checked" and exited 0 — advisory-but-passing over exactly the trees where
    # coverage had actually been lost, including this repository's own hook guards
    # (issue #1256). Trees are measured concurrently and `idp_common` is skipped
    # because the line above already produced its report; the ratchet below still
    # requires it by name.
    - make coverage-all-cicd
    # Ratchet per-file coverage against scripts/coverage_debt.json. Must follow the
    # two lines above: it reads the coverage reports those steps write, which is also
    # why none of the three could be split into separate JOBS without passing the
    # reports between them as artifacts. `--require-all-trees` (inside the -cicd
    # target) is what makes a tree with no report red BY NAME instead of named and
    # passed.
    - make check-coverage-debt-cicd

  # COVERAGE IS REPORTED, NOT ENFORCED. There is deliberately no `coverage:`
  # minimum here, for the same reason GitHub's report sets fail_below_min: false:
  # the only coverage.xml produced is lib/idp_common_pkg's, one of the ~64 test
  # roots scripts/run_all_tests.py discovers, so a repo-wide minimum from it would
  # be a number about one package presented as a number about the repository. See
  # the "Coverage is reported, not enforced" section in CONTRIBUTING.md.
  artifacts:
    when: always
    paths:
      - lib/idp_common_pkg/test-reports/coverage.xml
      - lib/idp_common_pkg/test-reports/test-results.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: lib/idp_common_pkg/test-reports/coverage.xml
      junit: lib/idp_common_pkg/test-reports/test-results.xml
    expire_in: 1 week

# The package / Lambda suites not covered by idp_common_pkg (idp_cli, idp_sdk,
# idp_feature_sdk, feature-platform, capacity, circuit-breaker, chat,
# config_library, and the repo's own gate suites under scripts/).
#
# Many separate pytest invocations, of which the nine measured above 20s in CI run
# `-n auto` — see PYTEST_XDIST in the Makefile for the selection rule and why it is
# not applied to all of them.
package_tests:
  <<: *fast_check_job
  tags:
    - size:2xlarge
    - arch:arm64

  # Same key and same path as `static_checks` and `ui_tests`, so the `npm ci` in
  # before_script restores from whatever those two last pushed for this lockfile.
  # The install is kept anyway rather than relying on the cache alone: a cache is
  # a performance assumption, not a guarantee — the first pipeline after a
  # lockfile change has no entry for the new key at all, and within one pipeline
  # these jobs run in parallel so nothing orders this one after a producer. With
  # `npm ci` the dependencies are there unconditionally and the cache only decides
  # whether it takes 10 seconds or 60; without it, the suites below would go back
  # to skipping on a cold key, which is the failure this is fixing.
  cache:
    key:
      files:
        - src/ui/package-lock.json
    paths:
      - src/ui/node_modules/

  before_script:
    - *python_setup
    # ⚠️ Node and basedpyright ARE needed here, which is not obvious from the
    # script below and cost this job a red run when they were left out.
    # `scripts/tests` is one of the suites `test-packages-cicd` runs, and
    # `test_pyright_config.py` RUNS basedpyright — a live 0.5s probe confirming
    # that pyrightconfig.json's five `extraPaths` really resolve the first-party
    # packages, rather than trusting that the config looks right. That is the whole
    # point of the check (see the typecheck notes in CLAUDE.md), so the answer is to
    # give this job the tool, not to let the probe skip when it is absent.
    # basedpyright ships as an npm package, hence Node. Node is also needed on its
    # own account: `test_ux_recorder.py` runs the recorder's cursor-overlay
    # JavaScript under node to check that a click is never labelled by what was
    # typed, and fails in CI when node is missing.
    - *node_setup
    - npm install -g basedpyright
    # ⚠️ This is about PINNING, not availability. cfn-lint arrives transitively
    # either way — moto declares `cfn-lint>=0.40.0` under several of its extras and
    # the install above pulls moto — so the ~10 cfn-lint-gated assertions in
    # `lib/idp_sdk/tests/unit/` do run without this line. What they would run
    # against is whatever that open range resolves to, where the single pre-split
    # job installed the pinned version before any suite started. Pinning keeps
    # those assertions measuring the same linter `make cfn-lint` uses rather than
    # coinciding with it by luck. Keep in step with CFN_LINT_VERSION.
    - pip install 'cfn-lint==1.51.0'
    # ⚠️ A THIRD toolchain this job's `script:` block does not show, and the same
    # lesson as the two above. `scripts/tests/test_ui_test_discovery.py` checks its
    # hand-written copies of Vitest's naming convention against the installed
    # Vitest — `vitest list --filesOnly`, `defaultInclude`, and the expanded
    # extension set against picomatch — and those three need the UI's npm
    # dependencies, which were installed only in `ui_tests`. So they SKIPPED here,
    # on both platforms, and a skip is not a failure: the job exited 0 and the
    # literals that are the *input* to that module's gate assertions were
    # calibrated against nothing but a developer's machine (#1390). The module now
    # fails rather than skips when it finds them missing under CI, so this line is
    # load-bearing for the job staying green as well as for the check meaning
    # anything.
    - cd src/ui && npm ci --prefer-offline --no-audit && cd ../..

  script:
    - make test-packages-cicd

# UI unit tests (Vitest + jsdom, no browser).
#
# Its own job because it is the one fast_checks member that needs Node and NOT the
# Python packages, so pairing it with anything else would mean installing one
# toolchain for nothing. ~1 min including the install.
ui_tests:
  <<: *fast_check_job
  tags:
    - size:large

  cache:
    key:
      files:
        - src/ui/package-lock.json
    paths:
      - src/ui/node_modules/

  before_script:
    - apt-get update -y
    - apt-get install curl git -y
    - *node_setup

  script:
    # ⚠️ `--silent` is load-bearing, not tidiness. These suites `console.log` from
    # component code and React emits an act(...) warning with a full component stack
    # per occurrence; on the run profiled for this change that output hit GitLab's
    # trace cap — "Job's log exceeded limit of 4194304 bytes. Job execution will
    # continue but no more output will be collected." — partway through vitest. The
    # job still passed, but anything that failed after that point would have had no
    # diagnostic in the log at all, which is the worst shape a CI failure can have.
    # It silences console output from tests only; failure output is unaffected.
    - cd src/ui && npm ci --prefer-offline --no-audit && npx vitest run --silent && cd ../..

deployment_validation:
  stage: deployment_validation
  interruptible: true
  # Pre-deploy IAM sanity check, on the same trigger as the deploy it validates:
  # the nightly schedule, or a manual click. There is no point validating a role
  # for a deploy that is not about to happen.
  #
  # ⚠️ This job going nightly does NOT take the check off merge requests. The same
  # script runs as the last step of `static_checks` above, where it costs seconds and
  # needs no credentials. What is nightly-only is this job's AWS-CLI-installing
  # form, kept because the nightly deploy path should validate the role in the
  # environment that is about to use it rather than trusting the offline read.
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual
      allow_failure: true
    - when: never

  before_script:
    - apt-get update -y
    - apt-get install curl unzip python3-pip -y
    # Install AWS CLI
    - curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
    - unzip awscliv2.zip
    - ./aws/install
    # Install PyYAML for template analysis
    - pip install PyYAML

  script:
    # Check if service role has sufficient permissions for main stack deployment
    - python3 scripts/sdlc/validate_service_role_permissions.py

integration_tests:
  stage: integration_tests
  # Must exceed the pipeline monitor's max_wait (8100s / 135 min in
  # integration_test_deployment.py — the monitor refreshes its 1h-capped creds
  # so it can watch that long) plus before_script (~5 min) and after_script log
  # capture (~2 min), so the SCRIPT owns the deadline and always exits cleanly.
  # When this equalled the monitor's deadline, GitLab hard-killed the job first
  # and after_script never captured logs.
  timeout: 2h30m
  # Serialize deploys. The resource_group is a size-1 mutex; it is now scoped to a
  # single SHARED group rather than per-branch, which is the right choice once the
  # trigger is a nightly schedule plus occasional manual clicks: the thing it has to
  # prevent is a manual run colliding with the scheduled one, and those are on
  # different refs, so a per-branch group would not see the collision at all.
  #
  # (It was `integration_deploy_$CI_COMMIT_REF_SLUG` while every MR deployed
  # automatically, to let different MRs deploy concurrently. That concurrency is
  # what used to exhaust account quotas, and it no longer exists to be bounded.)
  interruptible: true
  resource_group: integration_deploy
  variables:
    IDP_ADMIN_EMAIL: ${GITLAB_USER_EMAIL}
  # variables:
  #   # In order to run tests in another account, add a AWS_CREDS_TARGET_ROLE variable to the Gitlab pipeline variables.
  #   AWS_CREDS_TARGET_ROLE: ${AWS_CREDS_TARGET_ROLE}
  #   AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
  #   IDP_ACCOUNT_ID: ${IDP_ACCOUNT_ID}

  # The expensive (~1h) real-AWS deploy + probe suite. Trigger policy:
  #   - the nightly schedule                     → auto
  #   - any MR targeting develop                 → MANUAL button on the MR page
  #   - push to develop                          → MANUAL button on the pipeline
  #   - anything else                            → never
  #
  # ⚠️ THIS IS NO LONGER A MERGE GATE, and that is a deliberate trade — read it
  # before relying on a green MR pipeline.
  #
  # What it buys: an MR pipeline is the fast_checks stage alone. The deploy used to
  # add ~62-113 min to every MR and every push to develop, serialized AFTER a 45-min
  # check stage, which is how a pipeline reached 111 min (MR) and 160 min (develop).
  # It also removes the concurrent-deploy load that exhausted account quotas.
  #
  # What it costs: a change that breaks the deploy, or any of the twelve suite steps
  # or five variant probes the deploy runs, can now MERGE and stay undetected until
  # the next nightly run — by which time other merges may sit on top of it, so the
  # nightly failure does not name the commit that caused it. There is no required
  # status check on this repository to fall back on (issue #933), so nothing else
  # catches it either.
  #
  # Three things follow from that, and all three matter:
  #   - Somebody has to WATCH the nightly result. A scheduled pipeline nobody reads
  #     is strictly worse than no pipeline, because it looks like coverage.
  #   - Before merging anything that touches the deploy path (template.yaml,
  #     patterns/, nested/, lib/, publish.py, the scripts/sdlc harness), CLICK THE
  #     BUTTON on the MR. That is what it is for, and it is the only pre-merge
  #     signal left. The `.deploy_affecting_changes` list above is the same set of
  #     paths and is still the right definition of "touches the deploy path" — it is
  #     no longer wired to a `changes:` rule here, because a manual button you click
  #     deliberately should always be available.
  #   - A nightly failure is triaged by bisecting the day's merges, not by reading
  #     the pipeline's own commit.
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: on_success
    # Any MR targeting develop (Draft or not) gets the button. No `changes:`
    # filter — a manual button you click deliberately should always be available,
    # even on a doc-only branch. allow_failure so an un-clicked button does not
    # hold the pipeline (manual rules block by default).
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual
      allow_failure: true
    - when: never

  before_script:
    - apt-get update -y
    - apt-get install zip unzip curl python3-pip -y
    # Install AWS CLI
    - curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
    - unzip awscliv2.zip
    - ./aws/install
    # Install boto3 for Python script
    - pip install boto3 rich

  script:
    - aws --version
    - aws sts get-caller-identity --no-cli-pager

    # Set environment variables for Python script
    - export IDP_ACCOUNT_ID=${IDP_ACCOUNT_ID:-020432867916}
    - export AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    - export IDP_PIPELINE_NAME=genaiic-sdlc-deploy-pipeline

    # Run integration test deployment
    - python3 scripts/sdlc/integration_test_deployment.py

  after_script:
    # ⚠️ RE-CREDENTIAL FIRST. Everything below runs on the JOB's credentials,
    # which the runner's credential vendor mints BEFORE the job starts and which
    # AWS hard-caps at 1h for a chained assume. This job routinely runs 58-63
    # minutes, so whether after_script has working credentials at all was a coin
    # flip decided by how long the deploy took. The monitor persists each
    # session it mints (AFTER_SCRIPT_CREDS_FILE in
    # scripts/sdlc/integration_test_deployment.py, written at startup and on
    # every 50-min refresh), and sourcing it is what makes the log capture below
    # independent of the job's own credential lifetime. after_script cannot
    # re-assume the role itself: that call needs live credentials, which is
    # exactly what it has run out of.
    #
    # Absent (the script died before the monitor started, or the self-assume
    # failed), we fall through on the ambient creds — the pre-fix behaviour.
    - |
      if [ -f "aws_after_script_creds.env" ]; then
        . ./aws_after_script_creds.env
        echo "🔑 Sourced the monitor's refreshed credentials for log capture"
      else
        echo "ℹ️ No persisted credentials — using the job's own (expired past ~1h)"
      fi

    # Display CodeBuild logs directly in GitLab runner console
    - |
      if [ -f "pipeline_execution_id.txt" ]; then
        EXECUTION_ID=$(cat pipeline_execution_id.txt)
        echo "Pipeline Execution: $EXECUTION_ID"

        # Get CodeBuild ID from the pipeline execution.
        # RETRY, because list-action-executions is eventually consistent: the
        # monitor exits the moment the PIPELINE reports a terminal state, which
        # can be seconds before the BuildAction's action-execution record carries
        # output.executionResult.externalExecutionId. When that raced we printed
        # "Could not find CodeBuild execution" and produced neither
        # codebuild_logs.txt nor deployment_summary.txt — so a SUCCESSFUL run
        # left no record of what it ran, and GitLab then warned about all three
        # missing artifacts. Observed on execution 0eeaf069 (job 28681138), whose
        # BuildAction id resolved fine when queried a few minutes later.
        #
        # ⚠️ KEEP THE STDERR. This loop used to send it to /dev/null, which made
        # a dead credential look exactly like that race — the 2026-10-11 nightly
        # (job 30872567) spent all 12 attempts re-sending an ExpiredToken and
        # then reported "no logs were fetched" for a run that passed 12/12.
        # Retrying cannot fix a credential, so those errors break the loop
        # immediately and are carried into the artifact instead of being hidden.
        BUILD_ID=""
        RESOLVE_ERR=""
        for attempt in $(seq 1 12); do
          if BUILD_ID=$(aws codepipeline list-action-executions --pipeline-name ${IDP_PIPELINE_NAME:-genaiic-sdlc-deploy-pipeline} --filter pipelineExecutionId=$EXECUTION_ID --query 'actionExecutionDetails[?actionName==`BuildAction`].output.executionResult.externalExecutionId' --output text 2>resolve_err.txt); then
            if [ "$BUILD_ID" != "" ] && [ "$BUILD_ID" != "None" ]; then
              [ "$attempt" -gt 1 ] && echo "Resolved CodeBuild id on attempt $attempt"
              break
            fi
            echo "CodeBuild action-execution record not queryable yet (attempt $attempt/12); waiting 5s..."
          else
            RESOLVE_ERR=$(tr -d '\r' < resolve_err.txt | grep -v '^$' | tail -2 | tr '\n' ' ')
            BUILD_ID=""
            echo "⚠️ list-action-executions FAILED (attempt $attempt/12): $RESOLVE_ERR"
            case "$RESOLVE_ERR" in
              *ExpiredToken*|*RequestExpired*|*InvalidClientTokenId*|*UnrecognizedClientException*|*AccessDenied*|*NoCredentialProviders*|*Unable\ to\ locate\ credentials*)
                echo "   ↳ This is a CREDENTIAL failure, not eventual consistency — retrying cannot help. Stopping."
                break
                ;;
            esac
          fi
          sleep 5
        done
        rm -f resolve_err.txt

        if [ "$BUILD_ID" != "" ] && [ "$BUILD_ID" != "None" ]; then
          echo "CodeBuild ID: $BUILD_ID"
          # Extract just the build ID part (after the colon)
          LOG_STREAM_NAME="${BUILD_ID#*:}"
          echo "Log Stream: $LOG_STREAM_NAME"
          echo ""
          echo "=== DEPLOYMENT SUMMARY ==="
          # Wait for CloudWatch Logs to flush all events
          echo "Waiting 30 seconds for logs to flush..."
          sleep 30
          # Paginate get-log-events: a single call returns only ~1MB/10K
          # events, which truncates 2h builds (the summary printed at the
          # very end was regularly cut off).
          : > codebuild_logs.txt
          NEXT_TOKEN=""
          PREV_TOKEN="none"
          PAGES=0
          while [ "$NEXT_TOKEN" != "$PREV_TOKEN" ] && [ $PAGES -lt 200 ]; do
            PREV_TOKEN="$NEXT_TOKEN"
            if [ -z "$NEXT_TOKEN" ]; then
              PAGE=$(aws logs get-log-events --log-group-name "/aws/codebuild/app-sdlc" --log-stream-name "$LOG_STREAM_NAME" --start-from-head --output json 2>/dev/null || echo '{}')
            else
              PAGE=$(aws logs get-log-events --log-group-name "/aws/codebuild/app-sdlc" --log-stream-name "$LOG_STREAM_NAME" --start-from-head --next-token "$NEXT_TOKEN" --output json 2>/dev/null || echo '{}')
            fi
            echo "$PAGE" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("\n".join(e["message"].rstrip("\n") for e in d.get("events",[])))' >> codebuild_logs.txt
            NEXT_TOKEN=$(echo "$PAGE" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("nextForwardToken",""))')
            PAGES=$((PAGES+1))
          done
          echo -e "\033[1;36m📁 Full deployment logs saved to: \033[1;33mcodebuild_logs.txt\033[0m (${PAGES} pages)"
          echo -e "\033[1;34m🔗 View logs: ${CI_JOB_URL}/artifacts/external_file/codebuild_logs.txt\033[0m"
          echo ""
          # Preferred source: the summary file the build uploads to S3
          # (deterministic key from the build id) — no log scraping needed.
          SOURCE_BUCKET="genaiic-sdlc-sourcecode-${IDP_ACCOUNT_ID:-020432867916}-${AWS_DEFAULT_REGION:-us-east-1}"
          SUMMARY=""
          if aws s3 cp "s3://${SOURCE_BUCKET}/deploy/summaries/${LOG_STREAM_NAME}.txt" deployment_summary.txt 2>/dev/null; then
            SUMMARY=$(cat deployment_summary.txt)
          else
            # Fallback: extract from the (now fully paginated) logs
            SUMMARY=$(sed -n '/🤖 Generating deployment summary with Bedrock.../,$p' codebuild_logs.txt | sed 's/^\t*//' | grep -v '\[Container\]' | grep -v 'Phase complete:' | grep -v 'Phase context status code:' | grep -v 'Entering phase' || true)
            echo "$SUMMARY" > deployment_summary.txt
          fi

          if [ -n "$SUMMARY" ]; then
            echo "┌─────────────────────────────────────────────────────────────────────────┐"
            echo "│                        DEPLOYMENT SUMMARY                               │"
            echo "├─────────────────────────────────────────────────────────────────────────┤"
            echo "$SUMMARY" | while IFS= read -r line; do
              printf "│ %-71s │\n" "$line"
            done
            echo "└─────────────────────────────────────────────────────────────────────────┘"
          else
            echo "⚠️ No deployment summary found - check codebuild_logs.txt for details"
          fi
          # Pull this run's ZAP DAST report (if the probe ran) into a GitLab
          # artifact. The probe uploads to deploy/zap/<stack>-<LOG_STREAM_NAME>-*
          # so filter by the build's log-stream tag. Best effort — absent when
          # IDP_TEST_ZAP=false or the probe didn't run.
          aws s3 cp "s3://${SOURCE_BUCKET}/deploy/zap/" ./ --recursive \
            --exclude "*" --include "*${LOG_STREAM_NAME}-zap-report.html" 2>/dev/null || true
          ZAP_HTML=$(ls -1 *${LOG_STREAM_NAME}-zap-report.html 2>/dev/null | head -1 || true)
          if [ -n "$ZAP_HTML" ]; then
            cp "$ZAP_HTML" zap-report.html
            echo -e "\033[1;34m🔗 ZAP DAST report: ${CI_JOB_URL}/artifacts/external_file/zap-report.html\033[0m"
          else
            echo "ℹ️ No ZAP DAST report for this run (probe skipped or not yet uploaded)"
            # Placeholder so the declared artifact always exists. GitLab has no
            # per-path "optional" flag, so a legitimately absent report used to
            # emit a scary "WARNING: no matching files" on every green run. A
            # file that states WHY it is empty beats a warning that implies
            # something broke.
            printf '<!doctype html><meta charset="utf-8"><title>No ZAP DAST report</title>\n<p>No ZAP DAST report for this run: the zapdast probe was skipped (IDP_TEST_ZAP=false or the probe did not run).</p>\n' > zap-report.html
          fi
        else
          echo "⚠️ Could not resolve the CodeBuild execution for $EXECUTION_ID."
          echo "   The build itself is unaffected — this only costs the log/summary artifacts."
          echo "   Look it up manually: aws codepipeline list-action-executions --pipeline-name ${IDP_PIPELINE_NAME:-genaiic-sdlc-deploy-pipeline} --filter pipelineExecutionId=$EXECUTION_ID"
          # Name WHICH failure this was. "after 12 attempts (~60s)" on its own
          # reads as an eventual-consistency race and sent triage down that path
          # for a credential expiry; the two need different fixes.
          {
            printf 'Could not resolve the CodeBuild execution for pipeline execution %s.\n' "$EXECUTION_ID"
            if [ -n "$RESOLVE_ERR" ]; then
              printf '\nThe AWS CLI call itself failed: %s\n' "$RESOLVE_ERR"
              printf 'That is an API/credential failure, NOT the eventual-consistency race\n'
              printf 'the retry loop exists for. If it mentions an expired token, the job\n'
              printf 'outlived its 1h credentials and did not source the persisted session.\n'
            else
              printf '\nThe query succeeded but returned no BuildAction record after 12\n'
              printf 'attempts (~60s) — the eventual-consistency race.\n'
            fi
            printf '\nNo logs were fetched. The build result itself is reported by the job status above.\n'
          } > codebuild_logs.txt
          cp codebuild_logs.txt deployment_summary.txt
          printf '<!doctype html><meta charset="utf-8"><title>No ZAP DAST report</title>\n<p>Not collected: the CodeBuild execution could not be resolved.</p>\n' > zap-report.html
        fi
      else
        echo "⚠️ No pipeline execution ID found — integration_test_deployment.py exited before recording one."
        printf 'No pipeline_execution_id.txt was produced, so no CodeBuild logs could be fetched.\nThis means the deploy script exited before it started (or recorded) a pipeline execution.\n' > codebuild_logs.txt
        cp codebuild_logs.txt deployment_summary.txt
        printf '<!doctype html><meta charset="utf-8"><title>No ZAP DAST report</title>\n<p>Not collected: no pipeline execution was recorded.</p>\n' > zap-report.html
      fi

    # Post the nightly result to Slack.
    #
    # ⚠️ WHY THIS IS HERE AND NOT GitLab's OWN SLACK INTEGRATION. That integration
    # fires on `pipeline_events` for a branch, and like the pipeline BADGE it cannot
    # filter by pipeline SOURCE — so it would post every push pipeline to `develop`
    # as well, which is the majority of them and is not what anybody subscribed for.
    # Posting from this job is the only place that knows the run was the scheduled
    # one, and it is also the only place with the deploy's own summary and the
    # agentic root-cause analysis to put in the message.
    #
    # Scoped to `schedule` deliberately: a manually clicked deploy is watched by the
    # person who clicked it and does not need to interrupt a channel.
    #
    # SLACK_WEBHOOK_URL is a MASKED CI variable, never a committed value — this
    # repository is public, and a webhook URL is a bearer credential that lets anyone
    # post to the channel. Absent, the block prints one line and exits 0, the same
    # contract GITLAB_REVIEW_TOKEN has in ai_mr_review.
    #
    # ⚠️ The variable must be MASKED and **NOT PROTECTED**. This project has no
    # protected branches, so a protected variable is absent from every pipeline
    # including the scheduled one — the block would log "not set" forever and look
    # like it was working.
    #
    # ⚠️ PAYLOAD SHAPE: this targets a Slack **Workflow Builder** webhook, not an
    # incoming webhook, because installing a Slack *app* needs workspace-admin
    # approval that a workflow does not. The two take different bodies and the
    # difference is silent — an incoming webhook wants `{"text":…,"blocks":[…]}`,
    # while a Workflow Builder trigger wants a FLAT object whose keys are the
    # variables declared on the trigger, and ignores anything it does not recognise.
    # So the keys below are a contract with the workflow: `status`, `commit`,
    # `job_url` and `summary` must be declared there, as Text, under exactly these
    # names. Renaming one here without renaming it there posts a message with a
    # blank variable rather than failing.
    #
    # ⚠️ The workflow's message template must NOT use Slack's `<url|label>` link
    # syntax, or backticks/asterisks typed as characters. Those are **API** mrkdwn:
    # they render only in a `blocks`/`text` body sent by an app, and a message
    # composed in Workflow Builder shows them literally — `<https://…|view job>`
    # appears verbatim, which is how the first version of this went out. Put
    # `{{job_url}}` on its own line and Slack auto-links it; use the editor's own
    # formatting buttons for bold and code. `job_url` is therefore sent as a bare
    # URL, and keeping it bare is the point.
    - |
      if [ -z "$SLACK_WEBHOOK_URL" ]; then
        echo "ℹ️ SLACK_WEBHOOK_URL not set — skipping the Slack post"
      elif [ "$CI_PIPELINE_SOURCE" != "schedule" ]; then
        echo "ℹ️ Not the scheduled run (source=$CI_PIPELINE_SOURCE) — skipping the Slack post"
      else
        # Build the payload in python rather than by string-concatenating shell:
        # the summary is multi-line model output that reliably contains quotes,
        # backslashes and newlines, and a hand-built JSON body breaks on all three.
        python3 - "$CI_JOB_STATUS" "$CI_JOB_URL" "$CI_COMMIT_SHA" > slack-payload.json <<'PY'
      import json, pathlib, sys

      job_status, job_url, sha = sys.argv[1:4]
      ok = job_status == "success"
      # ⚠️ A green job is NOT the same claim as "the suite passed".
      # integration_test_deployment.py exits 0 on the HANDOFF path too (the
      # monitor stopped before the pipeline reached a terminal state, on the
      # 110-min deadline or on a credential expiry it could not refresh), and it
      # drops this marker when it does. Reporting that as ✅ PASSED asserts
      # something nobody checked.
      handed_off = pathlib.Path("monitor_handoff.txt").is_file()

      summary = ""
      p = pathlib.Path("deployment_summary.txt")
      if p.is_file():
          summary = p.read_text(errors="replace").strip()
      if not summary:
          summary = "(no deployment summary was produced — see the job log)"
      # A Slack message caps at 4000 characters and the whole post is rejected past
      # it, so truncate rather than lose the notification. The rest is in the job
      # artifacts, which the message links to. Truncate AFTER the notes below are
      # attached, so a long summary can never push the handoff warning off the end
      # — that warning is the part a reader most needs.
      if not ok:
          summary += ("\n\nTriage by bisecting the day's merges: the pipeline's own "
                      "commit is not necessarily the cause.")
      elif handed_off:
          summary = (
              pathlib.Path("monitor_handoff.txt").read_text(errors="replace").strip()
              + "\n\n" + summary
          )
      if len(summary) > 2000:
          summary = summary[:2000] + "\n… (truncated — full summary in the job artifacts)"

      if not ok:
          status = "❌ FAILED"
      elif handed_off:
          status = "⚠️ UNVERIFIED (monitor handed off)"
      else:
          status = "✅ PASSED"

      # Flat, all-string values: a Workflow Builder Text variable takes nothing else.
      json.dump({
          "status": status,
          "commit": sha[:8],
          "job_url": job_url,
          "summary": summary,
      }, sys.stdout)
      PY
        # --fail so a 4xx from Slack is visible rather than silently discarded, but
        # `|| true` so a notification problem never changes the job's verdict: the
        # deploy result is what this job reports.
        if curl -sS --fail -X POST -H 'Content-type: application/json' \
             --data @slack-payload.json "$SLACK_WEBHOOK_URL" >/dev/null; then
          echo "💬 Nightly result posted to Slack"
          # Tell nightly_notification (the always-run job in the `notify` stage)
          # that the channel already has this run's result, so it stays quiet.
          # Written ONLY on a successful post: if the post failed, the channel
          # has nothing and the fallback should try again.
          : > slack_posted.txt
        else
          echo "⚠️ Slack post failed (HTTP error or bad webhook) — deploy result unaffected"
        fi
      fi

    # Shred the persisted session. It is not in `artifacts:` (that list is
    # explicit paths), but a GitLab runner can reuse a workspace between jobs,
    # and the next job's deployment zip is built from this directory.
    - rm -f aws_after_script_creds.env

  artifacts:
    when: always
    paths:
      - pipeline_execution_id.txt
      - codebuild_logs.txt
      - deployment_summary.txt
      # ZAP DAST HTML report, if the zapdast probe ran (best effort — the
      # after_script copies it out of S3; absent runs just have no file).
      - zap-report.html
      # Present only when the Slack post above SUCCEEDED. nightly_notification
      # reads it to decide whether the channel already has this run's result.
      - slack_posted.txt
    expire_in: 1 week

srt_security_review:
  stage: fast_checks
  interruptible: true
  # Cold prerequisite install (checkov+semgrep+jupyter+syft+bandit into SRT's
  # managed venv, no pip cache) can take 10-15 min; setup.py retries once, then
  # the scan itself runs 5-15 min. 50m leaves headroom for the worst case.
  # It's not "fast", but it needs no AWS and runs in PARALLEL with static_checks
  # (needs: []), so it adds no wall-clock to the fast gate while still gating the
  # expensive deploy.
  timeout: 50m

  # Use runner with more memory for SRT security scanning
  # saas-linux-medium-amd64: 4 vCPUs, 16 GB RAM
  tags:
    - size:large

  # Run on EVERY push and every MR (same as static_checks) — no AWS needed, and
  # this surfaces security regressions early on any branch (GitLab emails the
  # committer on failure).
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

  # Start immediately, in parallel with static_checks — SRT needs no artifacts.
  needs: []

  # `make srt-setup` resolves SRT's latest release through the GitHub API, which
  # allows 60 requests/hour PER IP unauthenticated — and the hosted runner fleet
  # shares its IPs, so the anonymous request returns 403 "rate limit exceeded"
  # whenever another project on the same runner has spent the hour's budget. That
  # is one API call per job, before any scanning: the job then fails at setup with
  # no findings read and no artifacts to upload, which reads like a security gate
  # failure and is not one.
  #
  # The fix is the `GITHUB_TOKEN` project CI/CD variable (masked, NOT protected —
  # this job runs on every branch, and a protected variable reaches only protected
  # refs). A token raises the limit to 5,000/hour for the token rather than for the
  # shared IP. setup.py reads `GITHUB_TOKEN` or `GH_TOKEN` from the environment,
  # and GitLab injects project variables into every job, so there is nothing to
  # wire in `variables:` here — this comment is the only place the dependency is
  # visible.
  #
  # ⚠️  With the variable absent or expired the job fails exactly as above; the
  #     scan does not silently degrade to anonymous-and-green. The hint in
  #     setup.py's failure output names this variable. A read-public-only token is
  #     sufficient: the only call is a release lookup against a public repository.
  before_script:
    - python --version
    - apt-get update -y
    - apt-get install curl python3-pip -y
    # Install Python dependencies for SRT setup script
    - pip install --upgrade pip PyYAML

  script:
    - echo "Running SRT (Sample Security Review Tool) security assessment..."
    - make srt-setup
    - make srt-scan

  after_script:
    - |
      if [ -d ".srt" ]; then
        echo "SRT assessment completed"
        # Copy SRT reports to artifacts root for easy access
        [ -f ".srt/issues.json" ] && cp .srt/issues.json srt-issues.json
        [ -f ".srt/dashboard.html" ] && cp .srt/dashboard.html srt-dashboard.html
        [ -f ".srt/bandit-summary.json" ] && cp .srt/bandit-summary.json srt-bandit-summary.json
        [ -f ".srt/syft-summary.json" ] && cp .srt/syft-summary.json srt-syft-summary.json
        echo "✓ SRT reports captured for download"
      fi

  artifacts:
    when: always
    paths:
      - srt-issues.json
      - srt-dashboard.html
      - srt-bandit-summary.json
      - srt-syft-summary.json
    reports:
      # Future: Add security scanning report format when GitLab supports it
    expire_in: 1 week

# Dependency vulnerability gate (SCA). Complements srt_security_review rather
# than duplicating it: SRT runs syft, which builds an SBOM but does NO
# vulnerability matching, so a known-CVE dependency could previously merge with
# every security job green. This job matches the repo's pinned Python and Node
# dependency manifests against OSV and fails on HIGH/CRITICAL.
#
# Cheap and AWS-free like the other fast_checks jobs, so it runs on every push
# and MR with needs: [] (in parallel, adding no wall-clock to the gate).
dep_audit:
  stage: fast_checks
  interruptible: true
  # Manifest generation resolves a handful of extra requirements with uv, then
  # ~1800 packages are queried against OSV in batches. Comfortably under 20m.
  timeout: 20m

  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

  needs: []

  before_script:
    - python --version
    - apt-get update -y
    # jq is REQUIRED: generate-dep-manifest.sh builds the Node manifest by
    # reading the committed package-lock.json files with jq. It is absent from
    # the python:3.13-bookworm image (and preinstalled on GitHub's runners, which
    # is why the sibling GitHub workflow never needed it) — without it the Node
    # half of the manifest silently comes out empty.
    - apt-get install curl git jq -y
    # uv provides the Python runtime + `packaging` that
    # scripts/generate-dep-manifest.sh needs to resolve the loose pins.
    - pip install --upgrade pip uv
    # Node/npm are NOT needed: the manifest is read from the committed
    # package-lock.json files, not from an install.

  script:
    - python3 scripts/security/dep_audit.py --json dep-audit-report.json

  artifacts:
    when: always
    paths:
      - dep-audit-report.json
      - dist/manifests/python-packages.txt
      - dist/manifests/node-packages.txt
    expire_in: 1 week

# Advisory AI code review. Runs Claude Code (via Amazon Bedrock) over the MR diff
# with .claude/skills/pr-review.md and posts the result as an MR note.
#
# ⚠️ NOT A GATE, and `allow_failure: true` says so in the one place a reader will
# look. A model's opinion must not decide whether code merges — the fast_checks
# gates above do that. A Bedrock throttle, a token expiry or an empty response
# must therefore not red-line an MR, and this job is excluded from
# scripts/tests/test_ci_gate_parity.py's SHARED_GATES on the same basis (it is
# GitLab-only because the AWS credentials are here; the GitHub side would need
# its own OIDC role).
#
# ⚠️ AUTOMATIC on every push to a non-Draft MR targeting develop, and the thing to
# understand about that is the cost. A review is a real Bedrock spend — $3.42
# measured in CI on a 5,400-line MR, $6.12 for the same MR locally — and reviews
# are idempotent per HEAD SHA, so a NEW push means a NEW paid review. Three
# properties bound it, and all three have to stay:
#   - `interruptible: true` — a push while a review is running cancels it, so a
#     burst of pushes costs roughly one review rather than one per push. This is
#     the main protection and it is easy to delete by accident.
#   - idempotent per HEAD SHA — a re-run of the same pipeline posts nothing.
#   - Draft MRs are excluded, so the WIP phase (where pushes are frequent) is free.
# What is NOT bounded: pushes spaced further apart than a review takes (~9 min in
# CI, of which ~3.5 is installing Node and the CLI). An MR revised over a week
# pays per revision. If that becomes the dominant cost, the cheapest fix is a
# cooldown in ai_mr_review.py (skip if the last review note is younger than N
# hours) rather than going back to a manual button.
#
# The other consequence of automatic: no human is in the loop before a model reads
# author-controlled text. That is why the tool sandbox is enforced by
# --permission-mode in the argv rather than by a settings file — see the comment on
# PERMISSION_MODE in ai_mr_review.py.
#
# NO SCHEDULED SWEEP, deliberately. The script supports one (`--all-open`, which
# is what `make ai-mr-review` runs locally) and the script: block below still
# dispatches to it, but no `$CI_PIPELINE_SOURCE == "schedule"` rule exists, so in
# CI it is unreachable. To turn it on later: add
# `- if: $CI_PIPELINE_SOURCE == "schedule"` above the terminal `never`, then
# create the schedule in Build -> Pipeline schedules. Read the cost note above
# first — a daily sweep of 10 MRs is the case that gets expensive.
#
# Requires two CI variables:
#   GITLAB_REVIEW_TOKEN  project access token, `api` scope, MASKED. The review is
#                        posted as this token's identity. CI_JOB_TOKEN cannot
#                        create notes, so there is no fallback — without this the
#                        job prints SKIPPED and exits 0.
#   AWS credentials      the same ones integration_tests uses, plus
#                        bedrock:InvokeModel. See the script's --help for how to
#                        scope this job down to a Bedrock-only role.
ai_mr_review:
  stage: fast_checks
  interruptible: true
  # One review is a few minutes; --max-mrs 10 bounds the sweep. 45m leaves room
  # for a slow sweep without letting a wedged run hold a runner for hours.
  timeout: 45m
  allow_failure: true

  # Reviewing is read-only, but it reads the whole checkout at the MR head and a
  # large diff wants memory for the model client + git worktree.
  tags:
    - size:large

  rules:
    # Non-Draft MRs targeting develop, automatically. Ordered before the catch-all
    # so a Draft falls through to `never` — a review posted on somebody's WIP is
    # noise they did not ask for, and the Draft phase is where pushes are
    # frequent, so excluding it is a cost control as well as a courtesy.
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" && $CI_MERGE_REQUEST_TITLE !~ /^Draft:/
      when: on_success
    - when: never

  # Nothing to wait for: it reads the MR, not another job's artifacts. In
  # particular it does NOT wait for static_checks — a lint failure is exactly when
  # a review is most useful, and gating the review on the gates would mean the
  # MRs most in need of one never get it.
  needs: []

  variables:
    # Pinned for the same reason CFN_LINT_VERSION is: an unpinned tool on a
    # scheduled job changes behaviour with no commit here.
    CLAUDE_CODE_VERSION: "2.1.281"
    # Bedrock inference-profile id. Must be one this account has model access to.
    ANTHROPIC_MODEL: "us.anthropic.claude-opus-5"
    AWS_REGION: "us-east-1"
    # Full history: the review diffs the MR head against its merge base with
    # develop, which a shallow clone does not have.
    GIT_DEPTH: 0

  before_script:
    - apt-get update -y
    - apt-get install curl git -y
    # Node 22: @anthropic-ai/claude-code declares `engines: {node: ">=22.0.0"}`, and
    # an older major fails in the quietest way available — npm's EBADENGINE is only a
    # warning, `npm install` and `claude --version` both succeed on 20, and the CLI
    # then exits 1 with an empty stderr on the first real session.
    #
    # ⚠️ `curl ... | bash -` exits with BASH's status, not curl's, which is why
    # .github/workflows/developer-tests.yml replaced this same pattern with
    # actions/setup-node: a NodeSource 403 there left the repo unregistered, the
    # apt-get below installed Debian's own nodejs, and the job failed several steps
    # later with an unrelated error. GitLab has no equivalent first-party action
    # and this image ships no Node, so the install stays — but the RUNTIME is now
    # asserted rather than the intent, because a check on the pattern stays green
    # in exactly that scenario.
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y nodejs
    - node --version
    - >-
      node -e 'const m=+process.versions.node.split(".")[0];
      if (m < 22) { console.error("FATAL: node "+process.versions.node+
      " but @anthropic-ai/claude-code needs >=22. The NodeSource install did not"+
      " take (a `curl | bash` failure is silent) and Debian nodejs is in use.");
      process.exit(1); }'
    - npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
    - claude --version

  script:
    # ⚠️ PIN THE HARNESS TO THE TARGET BRANCH BEFORE RUNNING IT.
    #
    # This checkout is the MR head, so without this the reviewer is the MR's own
    # copy of itself: the permission mode, both tool lists, the secret-stripping
    # list and the prompt are all author-controlled, and the script's internal
    # pinning of instruction files runs too late to matter because the code doing
    # the pinning is also the MR's. The blast radius is this job's environment,
    # which holds an AWS credential and GITLAB_REVIEW_TOKEN.
    #
    # So the harness comes from the target branch and only the DIFF comes from the
    # MR. The tradeoff is explicit: an MR that improves the reviewer is not
    # exercised by its own pipeline — it takes effect once merged. That is the same
    # trade the instruction-file pinning makes, for the same reason.
    #
    # The `||` arm covers the first landing, when the target branch has no copy
    # yet. It says so loudly rather than proceeding silently, because "no pinned
    # copy" and "pinned successfully" must not look alike in a log.
    - |
      TARGET="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-develop}"
      git fetch -q origin "$TARGET"
      HARNESS="scripts/sdlc/ai_mr_review.py .claude/skills/pr-review.md .claude/skills/pr-review-ci.md CLAUDE.md"
      if git checkout FETCH_HEAD -- $HARNESS 2>/dev/null; then
        echo "Harness pinned to origin/$TARGET: $HARNESS"
      else
        echo "⚠️  Could not pin the harness to origin/$TARGET — it does not carry"
        echo "    all of: $HARNESS"
        echo "    Running the MR's own copy. Expected only on the MR that adds this."
      fi
    - |
      if [ -n "$CI_MERGE_REQUEST_IID" ]; then
        python3 scripts/sdlc/ai_mr_review.py --mr "$CI_MERGE_REQUEST_IID"
      else
        # --max-mrs 3, not the script's default of 10: at --timeout 1200 a batch of
        # ten has a 200-minute worst case against this job's 45m timeout, so the
        # sweep's own bound would never be the one that fires and the job would
        # truncate the batch silently. Three fits. (Unreachable today — no schedule
        # rule exists, so CI always takes the --mr branch above.)
        python3 scripts/sdlc/ai_mr_review.py --all-open --max-mrs 3
      fi

  artifacts:
    when: always
    paths:
      - ai-reviews/
    expire_in: 1 week

# ---------------------------------------------------------------------------
# Advisory UX test of a merge request's web UI, with a narrated video added to
# the ai_mr_review note for the same head. NOT A GATE: `allow_failure: true` on
# both jobs, and neither is in test_ci_gate_parity.py's SHARED_GATES. See
# footnote ³ in scripts/sdlc/docs/CI_TEST_COVERAGE.md and
# .claude/skills/ux-test-ci.md.
#
# ⚠️ TWO JOBS, because the browser job must not run MR code. Chrome's DevTools
# port is unauthenticated, so the MR's build (npm ci with its lifecycle scripts,
# and vite with its config) runs in ux_test_build, and reaches ai_ux_test only as
# static files that the egress proxy serves at http://localhost:3000.
# ux_test_build declares no cache, so nothing the MR's install writes reaches
# another job either: the node_modules cache the other UI jobs restore is keyed
# on the lockfile alone, and so shared with other pipelines that have the same
# lockfile. Restoring it would do this job no good, since npm ci deletes
# node_modules before it installs.
#
# AUTOMATIC on non-Draft MRs to develop that change src/ui/, with identical rules
# on both jobs. If they differed, `needs: [ux_test_build]` could name a job absent
# from the pipeline and break pipeline creation on every MR. `interruptible`
# bounds a push burst. ai_ux_test is idempotent per head SHA, and
# `resource_group: ux_test_stack` serialises runs against the shared review stack.
#
# ⚠️ EACH UX VARIABLE IS SCOPED TO THE JOBS THAT READ IT, OR EVERY JOB GETS IT.
# Requires masked, NOT protected CI variables (a protected variable is absent
# from MR pipelines). Each UX job declares an environment of its own with
# `action: prepare`, which gives a job the variables scoped to that environment
# and creates no deployment: ai_ux_test declares `ux-review` and ux_test_build
# declares `ux-review-build`. The first-time-user story job that drives the
# browser, ai_ux_test_stories, reads what ai_ux_test reads and declares
# `ux-review` as well; no other job declares either.
# UX_TEST_PERSONAS and UX_TEST_AWS_ACCOUNT_ID have environment scope `ux-review`
# alone, so the job that runs the MR's `npm ci` never holds the persona's
# password. UX_TEST_UI_ENV, which both jobs read, is stored twice with the same
# value, at environment scope `ux-review` and at `ux-review-build`. Each scope is
# an exact name, never a wildcard: `ux-review*` would match both.
# GITLAB_REVIEW_TOKEN is shared with ai_mr_review, a job with no environment, and
# so keeps the default scope. Without them the jobs print SKIPPED: and exit 0. A
# variable left at the default scope, All (`*`), reaches every job of every
# pipeline: static_checks, unit_tests, package_tests and ui_tests each run
# `npm ci` in src/ui, and so every lifecycle script of every UI dependency, with
# it in the environment. A job's own `variables:` cannot take a project variable
# away, because project variables outrank this file, so the scope is the only
# thing that keeps it out of those jobs. No rule may read a scoped variable:
# GitLab can leave it undefined while it evaluates `rules` at pipeline creation.
# The setup steps are under footnote ³ in CI_TEST_COVERAGE.md.
# ---------------------------------------------------------------------------
# ⚠️ EVERY STEP THAT RUNS THIRD-PARTY CODE BUT ONE INHERITS NONE OF THE JOB'S
# SECRETS.
#
# Both UX jobs run them under this function, which hands on an environment built
# from nothing: the search path, the home directory, npm's cache location when
# the runner names one, a locale, the proxy variables when the runner sets them,
# and install.sh's prefix. ux_test_build runs apt (its packages' maintainer
# scripts), the MR's `npm ci` (every src/ui dependency's lifecycle scripts) and
# its vite build (the MR's config and plugins) under it; ai_ux_test runs apt and
# install.sh (pip, `npm ci` and the npm packages' own install scripts). None of
# them needs the GitLab token, the persona passwords, the stack's UI env or an
# AWS credential. An allowlist, because a denylist passes every variable nobody
# named: CI_REPOSITORY_URL carries the job token, and a job receives every
# project variable its environment's scope admits. It keeps the secrets out of a
# package script's environment and its logs; it does not stop a hostile package,
# which runs as root beside the job's shell and could read its /proc/<pid>/environ
# and the checkout's .git/config. The one step outside it is ux_test_build's
# .node_setup, the anchor every job that builds the UI shares: it unpacks the
# Node.js release from nodejs.org, which nothing checks against a digest, and has
# that release's npm upgrade itself, both with the job's environment.
# before_script and script share one shell, so a job includes the definition
# once, ahead of its first use.
.without_job_secrets: &without_job_secrets
  - |
    without_job_secrets() {
      env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 \
        ${npm_config_cache:+npm_config_cache="$npm_config_cache"} \
        ${http_proxy:+http_proxy="$http_proxy"} \
        ${https_proxy:+https_proxy="$https_proxy"} \
        ${no_proxy:+no_proxy="$no_proxy"} \
        ${HTTP_PROXY:+HTTP_PROXY="$HTTP_PROXY"} \
        ${HTTPS_PROXY:+HTTPS_PROXY="$HTTPS_PROXY"} \
        ${NO_PROXY:+NO_PROXY="$NO_PROXY"} \
        ${UX_RUNNER_PREFIX:+UX_RUNNER_PREFIX="$UX_RUNNER_PREFIX"} \
        "$@"
    }

ux_test_build:
  stage: ux_review
  interruptible: true
  timeout: 20m
  # A UI build that fails here also fails static_checks' `make ui-build-only`,
  # which is the gate; this job must not add a second red mark for it.
  allow_failure: true
  tags:
    - size:large
  rules: &ux_test_rules
    # Ordered before the catch-all so a Draft falls through to `never`, as in
    # ai_mr_review. `changes` is what keeps the job off non-UI MRs.
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" && $CI_MERGE_REQUEST_TITLE !~ /^Draft:/
      changes:
        paths:
          - src/ui/**/*
        compare_to: refs/heads/develop
      when: on_success
    - when: never
  needs: []
  # An environment of this job's own, not ai_ux_test's: the one UX variable this
  # job reads, UX_TEST_UI_ENV, is stored at this scope too, and the persona's
  # password is not, so the job that runs the MR's `npm ci` never holds it. See
  # the note above the section.
  environment:
    name: ux-review-build
    action: prepare
  variables:
    # The merge base with develop, which ui_change.py diffs against.
    GIT_DEPTH: 0
  before_script:
    - *without_job_secrets
    - without_job_secrets apt-get update -y
    - without_job_secrets apt-get install curl git -y
    - *node_setup
  script:
    - python3 scripts/ux_runner/ui_change.py --target-branch "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-develop}" --out ui-change.json
    # The env file is written before npm ci and the build, from the one variable
    # this job needs. It holds no credential: the review stack's UI configuration, which the build
    # inlines into the bundle anyway, and its bucket names. npm ci then runs every
    # src/ui dependency's lifecycle scripts, a malicious version the lockfile
    # already resolves included, since its integrity hashes check only that a
    # package is the one recorded; and the build runs vite with the MR's config.
    # Both run under without_job_secrets, which keeps the job's secrets out of
    # their environment and logs. This job holds no persona password to keep out,
    # since its environment is not ai_ux_test's; what it does hold,
    # GITLAB_REVIEW_TOKEN and any AWS session the runner gave the job among them,
    # a package that goes looking can still read from this shell's
    # /proc/<pid>/environ. Node and npm themselves come from .node_setup, which
    # runs with the job's environment, as in every job using it.
    - |
      if python3 -c 'import json, sys; sys.exit(0 if json.load(open("ui-change.json"))["skip"] else 1)'; then
        echo "Only tests changed under src/ui; nothing to build."
        exit 0
      fi
      if [ -z "${UX_TEST_UI_ENV:-}" ]; then
        echo "SKIPPED: UX_TEST_UI_ENV is not set in this job, so the MR's UI cannot be built against the review stack. This job's copy belongs at environment scope ux-review-build."
        exit 0
      fi
      printf '%s' "$UX_TEST_UI_ENV" | base64 -d > src/ui/.env.production.local
      cd src/ui && without_job_secrets npm ci --prefer-offline --no-audit && without_job_secrets npm run build:only
  artifacts:
    paths:
      - src/ui/build/
      - ui-change.json
    expire_in: 1 day

ai_ux_test:
  stage: ux_review
  interruptible: true
  # Install about 5 min, plus a session bounded to 25 min, plus render and post.
  # The job's AWS credentials are a chained session capped at 1h, which is why
  # claude and render get freshly minted, scoped sessions (account.py).
  timeout: 60m
  allow_failure: true
  resource_group: ux_test_stack
  tags:
    - size:large
  rules: *ux_test_rules
  needs:
    - job: ux_test_build
      artifacts: true
  # The environment UX_TEST_PERSONAS and UX_TEST_AWS_ACCOUNT_ID are scoped to,
  # with this job's copy of UX_TEST_UI_ENV; see the note above the section.
  environment:
    name: ux-review
    action: prepare
  variables:
    # Bedrock inference-profile id; the GitLab role grants the Opus family only.
    ANTHROPIC_MODEL: "us.anthropic.claude-opus-5"
    AWS_REGION: "us-east-1"
    GIT_DEPTH: 0
    UX_HARNESS_DIR: "/tmp/ux-harness"
    # What the setup anchored below (&ux_confined_setup) extracts, runs, passes and
    # writes into. A project or pipeline variable of the same name overrides a job
    # variable, so the precheck refuses to start unless UX_HARNESS and UX_ENTRY
    # are exactly the entry's own HARNESS_PATHS and path: the pin fails closed
    # whatever the variables say. A merge request whose .gitlab-ci.yml predates
    # this setup runs this job as it was then, naming the harness in its own script
    # where no variable reaches it and setting neither; ai_ux_test.py runs for it.
    UX_HARNESS: "scripts/sdlc/ai_ux_test.py scripts/sdlc/ai_mr_review.py scripts/ux_runner scripts/ux_test_proxy.py scripts/ux_recorder.py scripts/ux_recorder_cdp.py scripts/ux_recorder_render.py scripts/ux_recorder_mcp.py scripts/check_markdown_links.py scripts/ux_flows.yaml .claude/skills/ux-test.md .claude/skills/ux-test-ci.md"
    UX_ENTRY: "scripts/sdlc/ai_ux_test.py"
    UX_MODE_ARGS: "--mr $CI_MERGE_REQUEST_IID"
    UX_ARTIFACTS: "ux-tests"
  before_script: &ux_confined_setup
    # ⚠️ SET THE MODES, DO NOT INHERIT THEM. A GitLab Docker executor runs a job
    # at umask 0000 by default, and Chrome runs as uxbrowser with --no-sandbox,
    # so one renderer bug is code running as that uid. Under 0000 the harness,
    # its bytecode, the toolchain, the recorder's session and socket and the
    # artifact directory would all be writable by it, and root runs and reads
    # them later in this job. before_script and script share one shell, so this
    # holds for every command below, and ai_ux_test.py sets the same umask itself.
    - umask 022
    # ⚠️ THE STEPS THAT RUN THIRD-PARTY CODE INHERIT NONE OF THE JOB'S SECRETS.
    #
    # apt and install.sh run under the shared without_job_secrets above, which
    # keeps the secrets out of a package script's environment and logs but does
    # not stop a hostile package. What guards against one here is that each
    # download is checked before it is used: install.sh checks the Chrome for
    # Testing zip and the Node tarball against the sha256 it records for each
    # architecture, installs the Python packages with pip --require-hashes from
    # the digests in requirements.txt and the npm packages from the lockfile's
    # integrity hashes, and apt checks its repositories' signatures. npm's
    # upgrade of itself is checked only against what the npm registry publishes
    # for that version.
    - *without_job_secrets
    - without_job_secrets apt-get update -y
    - without_job_secrets apt-get install curl git -y
    # ⚠️ EXTRACT THE HARNESS FROM THE TARGET BRANCH, AND FAIL CLOSED.
    #
    # This checkout is the MR, so its copy of the harness (the tool lists, the
    # egress allowlist, the environment allowlist, the prompt) is
    # author-controlled. `git archive` into a fresh directory, rather than
    # `git checkout FETCH_HEAD -- ...` in place, because an in-place checkout
    # leaves MR-added files beside the pinned ones, and Python resolves imports
    # from the script's own directory first: an MR adding scripts/sdlc/json.py
    # would run in this job, beside an AWS credential and GITLAB_REVIEW_TOKEN.
    # The fetch names refs/heads/ so a tag called like the branch cannot stand in
    # for it. The extracted tree is made writable by root alone. Everything below
    # runs from $UX_HARNESS_DIR, the toolchain install from inside it, and Python
    # runs it with -B, so no bytecode is written into it for root to read back;
    # nothing runs from the checkout. The MR that adds this job cannot exercise
    # it, which is the same trade ai_mr_review makes, except that this one
    # refuses rather than warns.
    - |
      TARGET="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-develop}"
      git fetch -q origin "refs/heads/$TARGET"
      rm -rf "$UX_HARNESS_DIR" && mkdir -p "$UX_HARNESS_DIR"
      if git archive --format=tar -o /tmp/ux-harness.tar FETCH_HEAD -- $UX_HARNESS && tar -xf /tmp/ux-harness.tar -C "$UX_HARNESS_DIR" && chmod -R go-w "$UX_HARNESS_DIR"; then
        echo "UX harness pinned to origin/$TARGET in $UX_HARNESS_DIR: $UX_HARNESS"
      else
        echo "❌ Could not pin the UX harness to origin/$TARGET — it does not carry"
        echo "   all of: $UX_HARNESS"
        echo "   REFUSING to run this checkout's own copy: in an MR pipeline that would"
        echo "   make the harness, its tool lists and its egress allowlist the MR's own."
        echo "   Expected only on the MR that adds the UX test."
        exit 1
      fi
    # The checkout was made by the runner at its own umask, and once Chrome runs
    # the browser's uid must not be able to rename or replace anything in it that
    # root writes into or the proxy serves (ux-tests, src/ui/build), so the whole
    # tree is made writable by root alone before any of this job's Python runs.
    - chmod -R go-w "$CI_PROJECT_DIR"
    # The artifact directory sits in the checkout, which could hold `ux-tests` as
    # a symlink, and the harness writes into it as root, so it starts fresh:
    # `rm -rf` removes a symlink itself, not what it points at. It removes the
    # path's first component, so `mkdir -p` then makes every level afresh.
    - rm -rf "${UX_ARTIFACTS%%/*}" && mkdir -p "$UX_ARTIFACTS"
    # About a minute: test-only, already-tested, Draft and missing-precondition
    # heads stop here, before the toolchain install.
    - python3 -B "$UX_HARNESS_DIR/$UX_ENTRY" $UX_MODE_ARGS --precheck --artifact-dir "$UX_ARTIFACTS"
    - if [ -f "$UX_ARTIFACTS/proceed" ]; then (cd "$UX_HARNESS_DIR" && without_job_secrets bash "$UX_HARNESS_DIR/scripts/ux_runner/install.sh"); fi
  script:
    - |
      if [ ! -f "$UX_ARTIFACTS/proceed" ]; then
        echo "Nothing to UX-test for this head; see the precheck line above."
        exit 0
      fi
      echo "umask $(umask); modes:" && stat -c '%a %U %n' "$CI_PROJECT_DIR" "$UX_ARTIFACTS" "$UX_HARNESS_DIR" "$UX_HARNESS_DIR/scripts" /opt/ux-runner
      python3 -B "$UX_HARNESS_DIR/$UX_ENTRY" $UX_MODE_ARGS --inputs "$UX_ARTIFACTS/inputs.json" --artifact-dir "$UX_ARTIFACTS"
  artifacts:
    when: always
    paths:
      - ux-tests/
    expire_in: 1 week

# ---------------------------------------------------------------------------
# Advisory first-time-user stories (scripts/ux_stories.toml), run by
# scripts/sdlc/ai_ux_test_stories.py: a model that knows the product only from
# its published documentation attempts one story as one persona, in the confined
# browser of ai_ux_test, and the verdict comes from the journal of its tool
# calls. NOT A GATE: ai_ux_test_stories is `allow_failure: true`, GitLab-only,
# and absent from test_ci_gate_parity.py's SHARED_GATES. See footnote ⁴ in
# scripts/sdlc/docs/CI_TEST_COVERAGE.md and .claude/skills/ux-test-stories-ci.md;
# test_ux_test_stories_ci_jobs.py pins the job's shape.
#
# UX_TEST_STORIES switches it: unset, empty or `mr` runs it, and any other value,
# `off` among them, does not, so a mistyped `off` still stops it.
#
# This job takes &ux_confined_setup from ai_ux_test, so it pins the harness to
# the target branch the same way and fails closed, and its precheck refuses a
# UX_HARNESS or UX_ENTRY other than the entry's own HARNESS_PATHS and path. It
# reads ai_ux_test's masked, unprotected CI variables UX_TEST_UI_ENV,
# UX_TEST_PERSONAS, UX_TEST_AWS_ACCOUNT_ID and GITLAB_REVIEW_TOKEN; a run against
# the deployed UI also needs a UX_TEST_WEB_URL=<the stack's ApplicationWebURL>
# line in UX_TEST_UI_ENV. Without them the precheck prints SKIPPED: and the job
# exits 0. The three UX_TEST_* variables are set at environment scope
# `ux-review`, and a variable set at an environment's scope reaches only a job
# that declares that environment, so this job declares exactly the environment
# ai_ux_test declares, `ux-review` with `action: prepare`, as
# test_ux_test_stories_ci_jobs.py pins.
# ---------------------------------------------------------------------------
ai_ux_test_stories:
  stage: ux_review
  interruptible: true
  # About 6 min of install and docs index, then flows only while one can finish
  # inside the catalogue's deadline_minutes (55), counted from the job's start.
  # Most CHANGELOG MRs stop at the precheck in about a minute.
  timeout: 60m
  allow_failure: true
  # No resource_group: the job replies in the code-review thread, never edits the
  # review note, and only reads the review stack (its flows are told to change
  # nothing, and a best-effort guard refuses the saves it recognises), so it runs
  # alongside ai_ux_test.
  tags:
    - size:large
  rules:
    - if: $UX_TEST_STORIES && $UX_TEST_STORIES != "mr"
      when: never
    # The code review's own trigger, narrowed by `changes`: the reply goes into
    # that review's thread, and the CHANGELOG entries an MR adds are what select
    # its stories.
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" && $CI_MERGE_REQUEST_TITLE !~ /^Draft:/
      changes:
        paths:
          - CHANGELOG.md
        compare_to: refs/heads/develop
      when: on_success
    - when: never
  # The MR's UI build, when the MR changes src/ui. An optional need on a job the
  # pipeline does not hold is dropped, so on any other MR this job starts at once
  # and tests the deployed UI with the MR head's docs.
  needs:
    - job: ux_test_build
      artifacts: true
      optional: true
  # ai_ux_test's environment, which UX_TEST_PERSONAS and UX_TEST_AWS_ACCOUNT_ID
  # are scoped to, with its copy of UX_TEST_UI_ENV; see the note above.
  environment:
    name: ux-review
    action: prepare
  variables:
    # Bedrock inference-profile id, inside the Opus family the GitLab role grants.
    ANTHROPIC_MODEL: "us.anthropic.claude-opus-5-5"
    AWS_REGION: "us-east-1"
    # The MR's story inputs diff against its merge base with develop.
    GIT_DEPTH: 0
    UX_HARNESS_DIR: "/tmp/ux-harness"
    UX_HARNESS: &ux_story_harness "scripts/sdlc/ai_ux_test_stories.py scripts/sdlc/ai_mr_review.py scripts/ux_runner scripts/ux_test_proxy.py scripts/ux_recorder.py scripts/ux_recorder_cdp.py scripts/ux_recorder_render.py scripts/ux_recorder_mcp.py scripts/ux_story_mcp.py scripts/ux_stories.toml scripts/check_markdown_links.py docs-site/setup.sh .claude/skills/ux-test-stories.md .claude/skills/ux-test-stories-ci.md"
    UX_ENTRY: "scripts/sdlc/ai_ux_test_stories.py"
    # Posting is opt-in: this flag is what lets the precheck's one-line replies
    # and the run's reply reach the MR.
    UX_MODE_ARGS: "--mr $CI_MERGE_REQUEST_IID --post"
    UX_ARTIFACTS: "ux-test-stories"
  before_script: *ux_confined_setup
  # UX_HARNESS_SHA labels the run with the harness commit, read from the archive
  # the setup extracted: the extracted tree has no git of its own, and the
  # precheck's own fetches of the MR head and the target branch rewrite
  # FETCH_HEAD.
  script:
    - |
      if [ ! -f "$UX_ARTIFACTS/proceed" ]; then
        echo "No first-time-user story to run for this head; see the precheck line above."
        exit 0
      fi
      echo "umask $(umask); modes:" && stat -c '%a %U %n' "$CI_PROJECT_DIR" "$UX_ARTIFACTS" "$UX_HARNESS_DIR" "$UX_HARNESS_DIR/scripts" /opt/ux-runner
      export UX_HARNESS_SHA="$(git get-tar-commit-id < /tmp/ux-harness.tar)"
      python3 -B "$UX_HARNESS_DIR/$UX_ENTRY" $UX_MODE_ARGS --inputs "$UX_ARTIFACTS/inputs.json" --artifact-dir "$UX_ARTIFACTS"
  artifacts:
    when: always
    paths:
      - ux-test-stories/
    expire_in: 1 week

# ---------------------------------------------------------------------------
# The nightly result reaches Slack even when the deploy stage never ran.
#
# ⚠️ WHY THIS JOB EXISTS, AND WHY THE FIX IS NOT MORE LOGIC IN integration_tests.
# The Slack post lives in integration_tests' after_script, which means it can
# only describe outcomes it is positioned to see. On 2026-10-14 the 20:03 run
# failed in `package_tests` — Claude Sonnet 4 reached the end-of-life date AWS
# published for it, so the LEGACY expiry alarm in
# scripts/tests/test_model_surface_consistency.py fired with no code change at
# all. GitLab then SKIPPED deployment_validation and integration_tests, so the
# after_script never ran and the channel got NOTHING.
#
# That is the worst available shape: a silent nightly is indistinguishable from
# a nightly nobody scheduled, and the whole point of the post is that somebody
# has to watch this run. No amount of extra branching inside integration_tests
# can cover it, because the job does not execute.
#
# It is the same defect class as the ✅ PASSED-on-handoff bug fixed earlier: a
# notifier that reports the status of the thing it happens to be attached to
# rather than the status of the run.
#
# ⚠️ NO `needs:`, DELIBERATELY. `needs` on a skipped job skips the dependent job
# too, which would reproduce the exact silence this exists to remove. Without
# `needs` the job downloads artifacts from every earlier-stage job that ran, and
# simply finds none when integration_tests was skipped — which is the signal it
# keys on.
nightly_notification:
  stage: notify
  # `when: always` is what makes this run after a failed or skipped upstream
  # stage; the source check keeps it to the scheduled run, matching the post in
  # integration_tests (a manually clicked deploy is watched by whoever clicked
  # it). allow_failure so a notification problem can never be the thing that
  # reddens a nightly.
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: always
      allow_failure: true
    - when: never
  # No checkout needed: the script is inline and everything it reads is an
  # artifact. This also keeps the job to a few seconds.
  variables:
    GIT_STRATEGY: none
  script:
    # ⚠️ Posted with urllib, not curl. curl is NOT in the python:3.13-bookworm
    # image — integration_tests apt-installs it in before_script, which this job
    # deliberately does not have. A `curl: command not found` here would restore
    # the silence this job exists to remove.
    - |
      if [ -z "$SLACK_WEBHOOK_URL" ]; then
        echo "ℹ️ SLACK_WEBHOOK_URL not set — nothing to post"
        exit 0
      fi
      if [ -f slack_posted.txt ]; then
        echo "✅ integration_tests already posted this run's result — staying quiet"
        exit 0
      fi
      echo "⚠️ No Slack post was made by integration_tests — posting the fallback"
      python3 - "$CI_PIPELINE_URL" "$CI_COMMIT_SHA" "$SLACK_WEBHOOK_URL" <<'PY'
      import json
      import pathlib
      import sys
      import urllib.error
      import urllib.request

      pipeline_url, sha, webhook = sys.argv[1:4]

      # Two distinct situations reach this job, and they need different words.
      #
      #   * deployment_summary.txt present — integration_tests RAN and produced a
      #     summary, but its own post did not succeed (bad webhook, HTTP error,
      #     or the job was cancelled/timed out before finishing after_script).
      #     The summary is the valuable part, so send it.
      #   * absent — the pipeline never reached the deploy stage. Nothing was
      #     deployed and nothing was tested, and saying so plainly is the whole
      #     job. Do NOT guess which upstream job failed: enumerating them needs
      #     an API token this job has no reason to hold, and a wrong guess in a
      #     channel is worse than a pipeline link.
      summary_path = pathlib.Path("deployment_summary.txt")
      if summary_path.is_file():
          status = "⚠️ RESULT NOT DELIVERED"
          body = (
              "The deploy ran but its own Slack post did not succeed, so this is "
              "a replacement carrying the summary it would have sent.\n\n"
              + summary_path.read_text(errors="replace").strip()
          )
      else:
          status = "❌ FAILED BEFORE THE DEPLOY"
          body = (
              "This nightly did not reach the deploy stage, so NOTHING was "
              "deployed and no integration test ran. An earlier stage failed and "
              "GitLab skipped the rest of the pipeline.\n\n"
              "There is no deployment summary for this run. Open the pipeline to "
              "see which job failed — a failure here is usually a check that is "
              "independent of the deploy, including a dated expiry alarm that can "
              "fire with no code change at all."
          )

      if len(body) > 2000:
          body = body[:2000] + "\n… (truncated — the rest is in the job artifacts)"

      # Same flat, all-string contract as the post in integration_tests: these
      # four keys are declared on the Slack Workflow Builder trigger as Text, and
      # renaming one here posts a blank variable rather than failing.
      payload = json.dumps(
          {
              "status": status,
              "commit": sha[:8],
              "job_url": pipeline_url,
              "summary": body,
          }
      ).encode()

      request = urllib.request.Request(
          webhook,
          data=payload,
          headers={"Content-Type": "application/json"},
          method="POST",
      )
      try:
          # nosec B310 - webhook is an https URL from a masked CI variable
          with urllib.request.urlopen(request, timeout=30) as response:  # noqa: S310
              print(f"💬 Fallback nightly notification posted to Slack ({response.status})")
      except (urllib.error.URLError, OSError) as exc:
          # Never fail the job for this. The pipeline's own verdict is already
          # red; adding a second red mark for the notification would only
          # obscure which one matters.
          print(f"⚠️ Fallback Slack post failed: {exc}")
      PY
