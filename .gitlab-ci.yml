# Any publicly available image
image: public.ecr.aws/docker/library/python:3.13-bookworm

# Global timeout for all jobs
default:
  timeout: 2h

# Change pip's cache directory to be inside the project directory since we can
# only cache local items.
# variables:
#   PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# https://pip.pypa.io/en/stable/topics/caching/
# cache:
#   paths:
#     - .cache/pip

# Pipeline structure (see scripts/sdlc/docs/CI_TEST_COVERAGE.md for the full
# trigger matrix):
#   - fast_checks: cheap, no-AWS gate — code_checks (lint/typecheck/units/UI) and
#     the SRT security scan run in PARALLEL here, on EVERY push and every MR.
#     Both gate the expensive deploy that follows.
#   - deployment_validation: pre-deploy IAM sanity check; runs only when the
#     integration deploy is going to run.
#   - integration_tests: the ~1h real AWS deploy + probe suite. Auto on develop
#     and on non-Draft MRs targeting develop; a manual button on Draft MRs.
stages:
  - fast_checks
  - deployment_validation
  - integration_tests

# Paths whose change can actually affect a real stack deploy / its behavior.
# The expensive deploy jobs (deployment_validation, integration_tests) only run
# when a commit/MR touches one of these — so doc-only / version-bump commits
# (VERSION, CHANGELOG.md, **/*.md, docs/**, images/**, notebooks/**, etc.) skip
# the ~70-min deploy. Intentionally GENEROUS: a false "run" wastes CI minutes,
# but a false "skip" could merge a broken deploy — so err toward running. Update
# this list if a new deploy-affecting top-level dir is added.
# NOTE: fast_checks (lint / SRT) deliberately has NO changes: filter — it is
# cheap and SHOULD run on every commit, including docs.
.deploy_affecting_changes: &deploy_affecting_changes
  - template.yaml
  - publish.py
  - "requirements*.txt"
  - "patterns/**/*"
  - "nested/**/*"
  - "src/**/*"
  - "lib/**/*"
  - "config_library/**/*"
  - "feature-platform/**/*"
  - "iam-roles/**/*"
  - "scripts/**/*"          # includes scripts/sdlc/* (the CI harness itself)
  - ".gitlab-ci.yml"        # a pipeline-config change must re-run to validate itself

# Prevent DUPLICATE pipelines: without this, a push to a branch that has an open
# MR triggers BOTH a branch pipeline and an MR pipeline. Run the MR pipeline when
# an MR is open, otherwise the branch pipeline — never both.
#
# auto_cancel on develop: GitLab's "auto-cancel redundant pipelines" cancels the
# previous pipeline on a ref whenever ANY new pipeline is created there. A
# doc-only commit to develop creates a pipeline (fast_checks has no changes:
# filter) but SKIPS integration_tests (deploy_affecting_changes filter) — so it
# used to cancel the in-flight ~70-min deploy of the prior code commit, which
# was then never re-run: that merge ended up never integration-tested. GitLab
# can't condition the cancel on what the NEW commit touched, so on develop we
# disable auto-cancel entirely (`on_new_commit: none`, GitLab >= 16.8): every
# merge to the integration branch gets its own completed deploy, serialized by
# integration_tests' per-branch resource_group. MR pipelines keep the default
# (conservative) supersede behavior — the bug doesn't exist there, because MR
# `changes:` compares against the target branch, so a doc push to an MR whose
# diff still touches deploy-affecting files re-runs the deploy anyway.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == "develop"
      auto_cancel:
        on_new_commit: none
    - if: $CI_COMMIT_BRANCH

code_checks:
  stage: fast_checks
  interruptible: true
  # Larger runner (4 vCPU / 16 GB, same as SRT): the Vite production build and
  # tsc/eslint are CPU-bound and ran ~6 min on the default small runner vs
  # seconds locally; more cores also make `pytest -n auto` worthwhile.
  tags:
    - size:large
  # Cheap, no-AWS checks — run on EVERY push (any branch) and every MR, so
  # developers get lint/typecheck/unit feedback (emailed by GitLab on failure)
  # without waiting for an MR, and this gates the expensive deploy.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

  # Cache the UI dependencies across runs so the single `npm ci` (in
  # before_script) is near-instant. Keyed on the lockfile so a dependency change
  # invalidates it; `npm ci --prefer-offline` then serves from the restored
  # node_modules.
  cache:
    key:
      files:
        - src/ui/package-lock.json
    paths:
      - src/ui/node_modules/

  before_script:
    - python --version
    - apt-get update -y
    - apt-get install make curl git -y
    # Fetch target branch for comparison in typecheck-pr. On an MR, compare
    # against its target; on a bare branch push (no MR), compare against develop
    # (this repo's integration branch), not main.
    - export TARGET_BRANCH="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-develop}"
    - echo "MR target branch (CI_MERGE_REQUEST_TARGET_BRANCH_NAME):$TARGET_BRANCH"
    - git fetch origin $TARGET_BRANCH:$TARGET_BRANCH || echo "Could not fetch $TARGET_BRANCH branch"
    # Install uv
    - pip install uv
    # Create virtual environment
    - uv venv .venv
    - source .venv/bin/activate
    # Install pinned Node.js 22.14.0 and npm 11.1.0 for basedpyright. Pick the
    # tarball matching the runner arch — the size:large pool is arm64, so a
    # hardcoded x64 binary fails with "Syntax error: ')' unexpected".
    - NODE_ARCH=$(case "$(uname -m)" in x86_64) echo x64;; aarch64|arm64) echo arm64;; *) echo x64;; esac)
    - echo "Runner arch $(uname -m) -> node $NODE_ARCH"
    - curl -fsSL https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-$NODE_ARCH.tar.xz | tar -xJ -C /usr/local --strip-components=1
    - npm install -g npm@11.1.0 || { echo "npm upgrade failed"; exit 1; }
    - npm install -g basedpyright
    # Install UI deps ONCE here (restored from cache when unchanged). The
    # lint-cicd UI targets run with SKIP_NPM_CI=1 so they reuse this instead of
    # each doing its own `npm ci` (which previously happened 3× per run).
    - cd src/ui && npm ci --prefer-offline --no-audit && cd ../..
    - uv pip install 'ruff==0.15.13'
    # Install dependencies needed by publish.py for test imports
    - uv pip install typer rich boto3
    # Install ALL first-party packages in a SINGLE resolution pass.
    # SECURITY — dependency confusion: these depend on each other by bare name
    # (idp_cli_pkg -> "idp-sdk", idp_sdk -> "idp_common") and those names are
    # squatted on public PyPI. Installing them one at a time lets a
    # not-yet-installed sibling resolve from the index instead of the checkout.
    # Do not split this into per-package calls. See docs/dependency-confusion.md.
    - uv pip install -e "lib/idp_common_pkg[test,evaluation]"
                     -e "lib/idp_sdk[test]"
                     -e "lib/idp_cli_pkg[test]"
                     -e "lib/idp_feature_sdk[test]"
    # Fail the build if any first-party package came from an index, not source.
    - python3 scripts/check_first_party_deps.py

  script:
    # SKIP_NPM_CI=1: UI deps already installed once in before_script, so the UI
    # lint/build/codegen targets don't each re-run `npm ci`.
    - make lint-cicd SKIP_NPM_CI=1
    - echo "=== Type Checking Configuration ==="
    - echo "MR target branch:$TARGET_BRANCH"
    - echo "Comparing:$TARGET_BRANCH...HEAD"
    - echo "===================================="
    - echo ""
    - make typecheck-pr TARGET_BRANCH=$TARGET_BRANCH
    # Static API RBAC/authorization scan (no AWS needed; catches op/schema/
    # expectations drift and missing server-side group checks).
    - make api-test-static
    # SKIP_INSTALL=1: idp_common[test] already installed via uv above (avoids a
    # redundant plain-pip resolve that recompiled numpy from source). PYTEST_ARGS
    # `-n auto` parallelizes the suite across the runner's cores (pytest-xdist).
    - make test-cicd -C lib/idp_common_pkg SKIP_INSTALL=1 PYTEST_ARGS="-n auto"
    # Package/Lambda suites not covered by idp_common_pkg (idp_cli, idp_sdk,
    # idp_feature_sdk, feature-platform, capacity, circuit-breaker, chat,
    # config_library) — all green headless, previously CI-untested.
    - make test-packages-cicd
    # UI unit tests (Vitest + jsdom, no browser). Node 22 installed above.
    - cd src/ui && npm ci --prefer-offline --no-audit && npx vitest run && cd ../..

  artifacts:
    paths:
      - lib/idp_common_pkg/test-reports/coverage.xml
      - lib/idp_common_pkg/test-reports/test-results.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: lib/idp_common_pkg/test-reports/coverage.xml
      junit: lib/idp_common_pkg/test-reports/test-results.xml
    expire_in: 1 week

deployment_validation:
  stage: deployment_validation
  interruptible: true
  # Pre-deploy IAM sanity check — only worth running when the integration deploy
  # is actually going to run: on develop, or on an MR targeting develop (incl.
  # Draft, so the manual integration button has a validated role when clicked).
  rules:
    # Same deploy-affecting gate as integration_tests: skip the pre-deploy IAM
    # check for doc/VERSION/CHANGELOG-only commits (there's no deploy to validate).
    - if: $CI_COMMIT_BRANCH == "develop"
      changes: *deploy_affecting_changes
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"
      changes: *deploy_affecting_changes
    - when: never

  before_script:
    - apt-get update -y
    - apt-get install curl unzip python3-pip -y
    # Install AWS CLI
    - curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
    - unzip awscliv2.zip
    - ./aws/install
    # Install PyYAML for template analysis
    - pip install PyYAML

  script:
    # Check if service role has sufficient permissions for main stack deployment
    - python3 scripts/sdlc/validate_service_role_permissions.py

integration_tests:
  stage: integration_tests
  # Must exceed the pipeline monitor's max_wait (8100s / 135 min in
  # integration_test_deployment.py — the monitor refreshes its 1h-capped creds
  # so it can watch that long) plus before_script (~5 min) and after_script log
  # capture (~2 min), so the SCRIPT owns the deadline and always exits cleanly.
  # When this equalled the monitor's deadline, GitLab hard-killed the job first
  # and after_script never captured logs.
  timeout: 2h30m
  # Serialize + auto-cancel superseded deploys: rapid pushes to a ready MR won't
  # stack up N concurrent ~1h stack deploys (which previously exhausted account
  # quotas). The resource_group is a size-1 mutex, so scoping it PER-BRANCH
  # (CI_COMMIT_REF_SLUG) still serializes rapid pushes to the SAME MR (a newer
  # pipeline supersedes an older queued one via interruptible) while letting
  # DIFFERENT MRs deploy concurrently. NOTE: on develop, auto-cancel is disabled
  # (workflow rule `on_new_commit: none` above), so `interruptible` has no
  # effect there — every develop deploy runs to completion, serialized by this
  # resource_group; supersede-on-push applies to MR pipelines only. Concurrency is therefore bounded by the
  # number of active MRs (typically <=5); this is NOT a hard cap of 5. If
  # concurrent deploys ever exhaust account quotas again, revert to a single
  # shared group (`resource_group: integration_deploy`).
  interruptible: true
  resource_group: integration_deploy_$CI_COMMIT_REF_SLUG
  variables:
    IDP_ADMIN_EMAIL: ${GITLAB_USER_EMAIL}
  # variables:
  #   # In order to run tests in another account, add a AWS_CREDS_TARGET_ROLE variable to the Gitlab pipeline variables.
  #   AWS_CREDS_TARGET_ROLE: ${AWS_CREDS_TARGET_ROLE}
  #   AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
  #   IDP_ACCOUNT_ID: ${IDP_ACCOUNT_ID}

  # The expensive (~1h) real-AWS deploy + probe suite. Trigger policy:
  #   - push to develop                          → auto
  #   - NON-Draft MR targeting develop           → auto (gates the merge)
  #   - Draft MR targeting develop               → MANUAL button on the MR page
  #     (run it when you want, not on every WIP push)
  #   - anything else                            → never
  # Note: rules are ordered — the non-Draft rule must precede the catch-all MR
  # rule so a Draft MR falls through to the manual rule, not the auto one.
  rules:
    # Auto-run only when deploy-affecting files changed — a doc/VERSION/CHANGELOG-
    # only commit skips the ~70-min deploy. (Draft MRs stay a manual button
    # regardless, so you can always force a run by clicking it.)
    - if: $CI_COMMIT_BRANCH == "develop"
      changes: *deploy_affecting_changes
      when: on_success
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" && $CI_MERGE_REQUEST_TITLE !~ /^Draft:/
      changes: *deploy_affecting_changes
      when: on_success
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"
      # Draft MR → optional manual button; allow_failure so it doesn't block the
      # pipeline while it sits un-clicked (manual rules block by default). No
      # changes: filter — a manual button you click deliberately should always be
      # available, even on a doc-only Draft.
      when: manual
      allow_failure: true
    - when: never

  before_script:
    - apt-get update -y
    - apt-get install zip unzip curl python3-pip -y
    # Install AWS CLI
    - curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
    - unzip awscliv2.zip
    - ./aws/install
    # Install boto3 for Python script
    - pip install boto3 rich

  script:
    - aws --version
    - aws sts get-caller-identity --no-cli-pager

    # Set environment variables for Python script
    - export IDP_ACCOUNT_ID=${IDP_ACCOUNT_ID:-020432867916}
    - export AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    - export IDP_PIPELINE_NAME=genaiic-sdlc-deploy-pipeline

    # Run integration test deployment
    - python3 scripts/sdlc/integration_test_deployment.py

  after_script:
    # Display CodeBuild logs directly in GitLab runner console
    - |
      if [ -f "pipeline_execution_id.txt" ]; then
        EXECUTION_ID=$(cat pipeline_execution_id.txt)
        echo "Pipeline Execution: $EXECUTION_ID"

        # Get CodeBuild ID from the pipeline execution
        BUILD_ID=$(aws codepipeline list-action-executions --pipeline-name ${IDP_PIPELINE_NAME:-genaiic-sdlc-deploy-pipeline} --filter pipelineExecutionId=$EXECUTION_ID --query 'actionExecutionDetails[?actionName==`BuildAction`].output.executionResult.externalExecutionId' --output text 2>/dev/null || echo "")

        if [ "$BUILD_ID" != "" ] && [ "$BUILD_ID" != "None" ]; then
          echo "CodeBuild ID: $BUILD_ID"
          # Extract just the build ID part (after the colon)
          LOG_STREAM_NAME="${BUILD_ID#*:}"
          echo "Log Stream: $LOG_STREAM_NAME"
          echo ""
          echo "=== DEPLOYMENT SUMMARY ==="
          # Wait for CloudWatch Logs to flush all events
          echo "Waiting 30 seconds for logs to flush..."
          sleep 30
          # Paginate get-log-events: a single call returns only ~1MB/10K
          # events, which truncates 2h builds (the summary printed at the
          # very end was regularly cut off).
          : > codebuild_logs.txt
          NEXT_TOKEN=""
          PREV_TOKEN="none"
          PAGES=0
          while [ "$NEXT_TOKEN" != "$PREV_TOKEN" ] && [ $PAGES -lt 200 ]; do
            PREV_TOKEN="$NEXT_TOKEN"
            if [ -z "$NEXT_TOKEN" ]; then
              PAGE=$(aws logs get-log-events --log-group-name "/aws/codebuild/app-sdlc" --log-stream-name "$LOG_STREAM_NAME" --start-from-head --output json 2>/dev/null || echo '{}')
            else
              PAGE=$(aws logs get-log-events --log-group-name "/aws/codebuild/app-sdlc" --log-stream-name "$LOG_STREAM_NAME" --start-from-head --next-token "$NEXT_TOKEN" --output json 2>/dev/null || echo '{}')
            fi
            echo "$PAGE" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("\n".join(e["message"].rstrip("\n") for e in d.get("events",[])))' >> codebuild_logs.txt
            NEXT_TOKEN=$(echo "$PAGE" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("nextForwardToken",""))')
            PAGES=$((PAGES+1))
          done
          echo -e "\033[1;36m📁 Full deployment logs saved to: \033[1;33mcodebuild_logs.txt\033[0m (${PAGES} pages)"
          echo -e "\033[1;34m🔗 View logs: ${CI_JOB_URL}/artifacts/external_file/codebuild_logs.txt\033[0m"
          echo ""
          # Preferred source: the summary file the build uploads to S3
          # (deterministic key from the build id) — no log scraping needed.
          SOURCE_BUCKET="genaiic-sdlc-sourcecode-${IDP_ACCOUNT_ID:-020432867916}-${AWS_DEFAULT_REGION:-us-east-1}"
          SUMMARY=""
          if aws s3 cp "s3://${SOURCE_BUCKET}/deploy/summaries/${LOG_STREAM_NAME}.txt" deployment_summary.txt 2>/dev/null; then
            SUMMARY=$(cat deployment_summary.txt)
          else
            # Fallback: extract from the (now fully paginated) logs
            SUMMARY=$(sed -n '/🤖 Generating deployment summary with Bedrock.../,$p' codebuild_logs.txt | sed 's/^\t*//' | grep -v '\[Container\]' | grep -v 'Phase complete:' | grep -v 'Phase context status code:' | grep -v 'Entering phase' || true)
            echo "$SUMMARY" > deployment_summary.txt
          fi

          if [ -n "$SUMMARY" ]; then
            echo "┌─────────────────────────────────────────────────────────────────────────┐"
            echo "│                        DEPLOYMENT SUMMARY                               │"
            echo "├─────────────────────────────────────────────────────────────────────────┤"
            echo "$SUMMARY" | while IFS= read -r line; do
              printf "│ %-71s │\n" "$line"
            done
            echo "└─────────────────────────────────────────────────────────────────────────┘"
          else
            echo "⚠️ No deployment summary found - check codebuild_logs.txt for details"
          fi
          # Pull this run's ZAP DAST report (if the probe ran) into a GitLab
          # artifact. The probe uploads to deploy/zap/<stack>-<LOG_STREAM_NAME>-*
          # so filter by the build's log-stream tag. Best effort — absent when
          # IDP_TEST_ZAP=false or the probe didn't run.
          aws s3 cp "s3://${SOURCE_BUCKET}/deploy/zap/" ./ --recursive \
            --exclude "*" --include "*${LOG_STREAM_NAME}-zap-report.html" 2>/dev/null || true
          ZAP_HTML=$(ls -1 *${LOG_STREAM_NAME}-zap-report.html 2>/dev/null | head -1 || true)
          if [ -n "$ZAP_HTML" ]; then
            cp "$ZAP_HTML" zap-report.html
            echo -e "\033[1;34m🔗 ZAP DAST report: ${CI_JOB_URL}/artifacts/external_file/zap-report.html\033[0m"
          else
            echo "ℹ️ No ZAP DAST report for this run (probe skipped or not yet uploaded)"
          fi
        else
          echo "Could not find CodeBuild execution"
        fi
      else
        echo "No pipeline execution ID found"
      fi

  artifacts:
    when: always
    paths:
      - pipeline_execution_id.txt
      - codebuild_logs.txt
      - deployment_summary.txt
      # ZAP DAST HTML report, if the zapdast probe ran (best effort — the
      # after_script copies it out of S3; absent runs just have no file).
      - zap-report.html
    expire_in: 1 week

srt_security_review:
  stage: fast_checks
  interruptible: true
  # Cold prerequisite install (checkov+semgrep+jupyter+syft+bandit into SRT's
  # managed venv, no pip cache) can take 10-15 min; setup.py retries once, then
  # the scan itself runs 5-15 min. 50m leaves headroom for the worst case.
  # It's not "fast", but it needs no AWS and runs in PARALLEL with code_checks
  # (needs: []), so it adds no wall-clock to the fast gate while still gating the
  # expensive deploy.
  timeout: 50m

  # Use runner with more memory for SRT security scanning
  # saas-linux-medium-amd64: 4 vCPUs, 16 GB RAM
  tags:
    - size:large

  # Run on EVERY push and every MR (same as code_checks) — no AWS needed, and
  # this surfaces security regressions early on any branch (GitLab emails the
  # committer on failure).
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

  # Start immediately, in parallel with code_checks — SRT needs no artifacts.
  needs: []

  before_script:
    - python --version
    - apt-get update -y
    - apt-get install curl python3-pip -y
    # Install Python dependencies for SRT setup script
    - pip install --upgrade pip

  script:
    - echo "Running SRT (Sample Security Review Tool) security assessment..."
    - make srt-setup
    - make srt-scan

  after_script:
    - |
      if [ -d ".srt" ]; then
        echo "SRT assessment completed"
        # Copy SRT reports to artifacts root for easy access
        [ -f ".srt/issues.json" ] && cp .srt/issues.json srt-issues.json
        [ -f ".srt/dashboard.html" ] && cp .srt/dashboard.html srt-dashboard.html
        [ -f ".srt/bandit-summary.json" ] && cp .srt/bandit-summary.json srt-bandit-summary.json
        [ -f ".srt/syft-summary.json" ] && cp .srt/syft-summary.json srt-syft-summary.json
        echo "✓ SRT reports captured for download"
      fi

  artifacts:
    when: always
    paths:
      - srt-issues.json
      - srt-dashboard.html
      - srt-bandit-summary.json
      - srt-syft-summary.json
    reports:
      # Future: Add security scanning report format when GitLab supports it
    expire_in: 1 week

# Dependency vulnerability gate (SCA). Complements srt_security_review rather
# than duplicating it: SRT runs syft, which builds an SBOM but does NO
# vulnerability matching, so a known-CVE dependency could previously merge with
# every security job green. This job matches the repo's pinned Python and Node
# dependency manifests against OSV and fails on HIGH/CRITICAL.
#
# Cheap and AWS-free like the other fast_checks jobs, so it runs on every push
# and MR with needs: [] (in parallel, adding no wall-clock to the gate).
dep_audit:
  stage: fast_checks
  interruptible: true
  # Manifest generation resolves a handful of extra requirements with uv, then
  # ~1800 packages are queried against OSV in batches. Comfortably under 20m.
  timeout: 20m

  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

  needs: []

  before_script:
    - python --version
    - apt-get update -y
    # jq is REQUIRED: generate-dep-manifest.sh builds the Node manifest by
    # reading the committed package-lock.json files with jq. It is absent from
    # the python:3.13-bookworm image (and preinstalled on GitHub's runners, which
    # is why the sibling GitHub workflow never needed it) — without it the Node
    # half of the manifest silently comes out empty.
    - apt-get install curl git jq -y
    # uv provides the Python runtime + `packaging` that
    # scripts/generate-dep-manifest.sh needs to resolve the loose pins.
    - pip install --upgrade pip uv
    # Node/npm are NOT needed: the manifest is read from the committed
    # package-lock.json files, not from an install.

  script:
    - python3 scripts/security/dep_audit.py --json dep-audit-report.json

  artifacts:
    when: always
    paths:
      - dep-audit-report.json
      - dist/manifests/python-packages.txt
      - dist/manifests/node-packages.txt
    expire_in: 1 week
