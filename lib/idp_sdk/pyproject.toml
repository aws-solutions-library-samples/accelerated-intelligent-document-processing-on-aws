[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idp-sdk"
version = "0.6.7"
description = "Python SDK for IDP Accelerator - programmatic access to document processing capabilities"
authors = [{name = "AWS"}]
license = {text = "MIT-0"}
requires-python = ">=3.12,<3.14"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["idp", "document-processing", "aws", "bedrock", "ocr", "extraction"]
dependencies = [
    "boto3>=1.28.0",
    "botocore>=1.31.0",
    "pydantic>=2.0.0",
    # SECURITY: idp_common is a FIRST-PARTY package that lives in this repo at
    # lib/idp_common_pkg. It is NOT published to PyPI, and the name `idp-common` on
    # PyPI is squatted by a third party. A bare requirement here lets pip resolve it
    # from public PyPI whenever it is not already installed (dependency confusion),
    # so it must always be installed from the local checkout — install first-party
    # packages together in one pip invocation:
    #   pip install -e lib/idp_common_pkg -e lib/idp_sdk
    # `make setup` / `make setup-venv` do this for you.
    "idp_common",
    "click>=8.0.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.11.0",
    "moto>=4.2.0",
    "pyyaml>=6.0",
]
lambda = [
    # Minimal dependencies for Lambda deployment
    "boto3>=1.28.0",
    "pydantic>=2.0.0",
]

[project.urls]
"Homepage" = "https://github.com/aws-samples/sample-genai-idp"
"Documentation" = "https://github.com/aws-samples/sample-genai-idp/blob/main/docs/idp-sdk.md"

[tool.setuptools.packages.find]
include = ["idp_sdk*"]
