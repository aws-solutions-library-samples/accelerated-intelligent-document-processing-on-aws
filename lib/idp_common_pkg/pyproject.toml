[build-system]
# Floor matches the `test` extra below: 78.1.1 is where CVE-2025-47273
# (setuptools PackageIndex path traversal) is fixed. This was the only one of the
# five first-party distributions with an unfloored build requirement, so a build
# here could resolve an arbitrarily old setuptools while the same file pinned a
# floor for the test path.
requires = ["setuptools>=78.1.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
exclude = [
  "build",
  "build.*",
  "*build",
  "*build.*",
  "*.build",
  "*.build.*",
  "**build**",
]

# Include YAML and MD files for system defaults configuration
[tool.setuptools.package-data]
"idp_common.config.system_defaults" = ["*.yaml", "*.md"]
"idp_common.discovery.prompts" = ["*.jinja2"]
"idp_common.rule_validation.z3.config" = ["*.yaml"]

[project]
name = "idp_common"
version = "0.6.9"
description = "Common utilities for GenAI IDP Accelerator patterns"
authors = [{ name = "AWS", email = "noreply@amazon.com" }]
requires-python = ">=3.12,<3.14"
dependencies = [
  "boto3>=1.42.86,<1.43.0",      # Core dependency for AWS services (>=1.42.86 required by bedrock-agentcore>=1.6.1)
  "jsonschema>=4.25.1",
  "pydantic>=2.12.0",
  "deepdiff>=6.0.0",
  "PyYAML>=6.0.0",      # Required for YAML configuration parsing
  # Floor pin for a transitive dependency, not a direct import. anyio arrives
  # via httpx/mcp/starlette under ``strands-agents`` (the ``agents``,
  # ``multi_document_discovery``, ``code_intel`` and ``all`` extras) and via
  # ``jupyter-server`` under ``dev``. GHSA-82r6-8w77-94w6 (anyio <=4.14.1:
  # ``TLSStream`` encodes host names with IDNA 2003, so a look-alike name can
  # be accepted against a certificate for a different host) is fixed in 4.14.2.
  # The floor lives here rather than in each of those five extras so no
  # resolution path can miss it.
  "anyio>=4.14.2",
]
readme = "README.md"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

# Optional dependencies for each component
[project.optional-dependencies]
# Core utilities only - minimal dependencies
core = []

# Development only dependencies
dev = [
  "python-dotenv (>=1.1.0,<2.0.0)",
  "ipykernel (>=6.29.5,<7.0.0)",
  "jupyter (>=1.1.1,<2.0.0)",
  # Floor pin to lift the ``jupyter`` meta-package's transitive resolution past
  # GHSA-c3mw-737p-c7g2 (jupyter-server <=2.20.0: 5xx request logging leaks
  # token-bearing Referer headers). Fixed in 2.21.0. Never touches a Lambda —
  # this dep exists so ``notebooks/`` runs locally — but the ``dep-audit``
  # gate audits every pinned dep regardless of runtime path.
  "jupyter-server>=2.21.0",
]

# Image handling dependencies
image = [
  "Pillow==12.3.0",
  "pypdfium2>=5.5.0",  # PDF page extraction for discovery multi-section support
]

# OCR module dependencies
ocr = [
  "Pillow==12.3.0",
  "pypdfium2>=5.5.0",
  "amazon-textract-textractor[pandas]==1.9.2",
  "numpy==1.26.4",
  "pandas==2.2.3",
  "openpyxl==3.1.5",
  "xlrd==2.0.2",
  "python-docx==1.2.0",
]

# Classification module dependencies
classification = [
  "Pillow==12.3.0", # For image handling
]

# Extraction module dependencies
extraction = [
  "Pillow==12.3.0",  # For image handling
]

# Assessment module dependencies
assessment = [
  "Pillow==12.3.0",               # For image handling
  "aws-lambda-powertools>=3.2.0", # Structured logging and observability
]

# Evaluation module dependencies
evaluation = [
  # Note: the `[llm]` extra (strands-based LLM comparator) is intentionally
  # NOT installed — IDP provides its own Bedrock-backed comparator via
  # ``idp_common.evaluation.llm_comparator.LLMComparator``, which rides
  # ``idp_common.bedrock`` (retry/throttling, cost metering, GovCloud endpoints,
  # robust JSON response parsing) that upstream's strands-based comparator does
  # not replicate.
  #
  # ``[docsplit]`` IS required — we import ``stickler.doc_split.*``
  # (DocSplitClassificationMetrics, evaluate_packet, compute_graded_packet_metrics)
  # in ``stickler_backend/doc_split.py``. Stickler 1.0 moved pandas — which
  # ``doc_split`` needs — from a runtime dep to this optional extra
  # (upstream release note #284). Without ``[docsplit]``, the
  # EvaluationFunction Lambda fails at import time with
  # ``stickler.doc_split requires pandas``.
  "stickler-eval[docsplit]==1.0.0",
  "genson==1.3.0",  # For automatic JSON Schema generation from data
  # Numpy pin relaxed: stickler-eval declares ``numpy>=1.26,<3``; an exact 1.26.4
  # pin invited resolver conflicts on upgrade. Kept above 1.26 so the eval
  # extras still install into environments that need matching numpy on other
  # extras.
  "numpy>=1.26,<3",
  # Explicitly prevent ruamel-yaml C extensions (they require compilation in Lambda)
  "ruamel-yaml>=0.17.0,<0.19.0; python_version>='3.10'",  # Pure Python YAML, no C extensions
]

# Rule validation module dependencies
rule_validation = [
  "z3-solver==4.15.4.0",
]

# Reporting module dependencies
reporting = [
  "pyarrow==23.0.1", # For Parquet conversion
]

# Appsync module dependencies
appsync = ["requests<3.0.0,>=2.32.3"]

# Agents module dependencies
#
# bedrock-agentcore stays capped below 1.9.0 despite GHSA-j6g5-3hh3-pgw8 (HIGH,
# argument-delimiter injection, fixed in 1.18.1). The vulnerable entry point is
# the SDK's ``install_packages()`` helper, which this repo never calls — the
# only code-interpreter tools invoked are ``writeFiles``/``listFiles``/
# ``executeCode`` (see agents/analytics/tools/code_interpreter_tools.py), so the
# advisory is unreachable here. Upgrading is not a local change either: 1.18.1
# requires boto3>=1.43.31, which breaks the deliberate ``boto3<1.43.0`` pin
# above and would move every Lambda and layer onto the 1.43 line. Revisit this
# together with that boto3 migration, or sooner if install_packages() is ever
# used.
agents = [
  "strands-agents==1.14.0; python_version>='3.10'",
  "strands-agents-tools==0.2.22; python_version>='3.10'",
  "bedrock-agentcore>=1.6.1,<1.9.0; python_version>='3.10'",    # Specifically for the code interpreter tool
  "jsonschema>=4.0.0",
]

# Multi-document discovery dependencies (clustering + agent analysis)
multi_document_discovery = [
  "scikit-learn>=1.5.0",       # KMeans clustering and silhouette analysis
  "scipy>=1.14.0",             # KDTree for nearest-neighbor search
  "numpy==1.26.4",             # Embedding matrices and vector operations
  "Pillow==12.3.0",            # Image processing for document rendering
  "pypdfium2>=5.5.0",          # PDF page rendering
  "jinja2>=3.1.0",             # Prompt template rendering
  "strands-agents==1.14.0; python_version>='3.10'",  # Agentic schema generation
]

# Synthesis / cold-start bootstrap dependencies. Schema authoring + config /
# test-set creation only need jsonschema; the document GENERATOR is a separate,
# heavier extra (see synthesis-generator) so the base capability stays light.
synthesis = [
  "jsonschema>=4.0.0",
]

# Optional synthetic-document generator (SEED). Heavy (Strands + Bedrock +
# rendering); install only where document generation actually runs. The engine
# adapter imports it lazily and degrades gracefully when absent.
# NOTE: seed-data requires numpy 2.x (opencv/scikit-image/numba), which conflicts
# with the numpy==1.26.4 pin in the ocr/evaluation/all extras. Install this in an
# isolated environment (the generator's own container / AgentCore runtime), NOT
# alongside idp_common[ocr|evaluation|all].
synthesis-generator = [
  "seed-data>=0.0.6",
]

# Code intelligence module dependencies
code_intel = [
    "requests==2.33.0",
    "strands-agents==1.14.0",
    "strands-agents-tools==0.2.22",
    "bedrock-agentcore>=1.6.1,<1.9.0",  # cap rationale: see the [agents] extra
    "PyYAML>=6.0.0",
    "pathspec>=0.11.0",
    "chardet>=5.0.0"
]

# Document service factory dependencies (includes both appsync and dynamodb support)
# This includes all dependencies needed for both backends
docs_service = [
  "requests==2.33.0", # Required for appsync module (dynamodb only needs boto3 which is core)
  "aws-xray-sdk>=2.14.0", # Required for X-Ray tracing
]

# Testing dependencies
test = [
  "pytest>=9.0.3",
  "pytest-cov>=4.1.0",
  "pytest-xdist>=3.3.1",            # For parallel test execution
  "requests (>=2.32.3,<3.0.0)",
  "pyarrow==23.0.1",
  "PyYAML==6.0.2",
  "openpyxl==3.1.5",
  "xlrd==2.0.2",
  "python-docx==1.2.0",
  "moto[s3,cloudformation]==5.1.8", # For mocking AWS services in tests (cloudformation extra needed by feature-platform launch-url tests)
  "Pillow==12.3.0",                 # Required for image processing in assessment tests
  "rich>=13.0.0",                   # Required for publish tests
  "graphql-core>=3.2,<4",           # Real GraphQL parser: oracle for the API-validation-spec parser-correctness test
  "idp_common[agentic-extraction]", # Required for agentic_idp tests
  # "s3fs==2023.12.2",  # Required for criteria validation tests - disabled till we fix package dependencies
  "moto>=5.1.8",
  "pytest-asyncio>=1.1.0",
  "typer>=0.19.2",
  # Keep in sync with the ruff pin in .gitlab-ci.yml. Cap below 0.16: ruff 0.16
  # formats Python code blocks in Markdown files, which fails `ruff format
  # --check` on ~49 README/skill-file snippets during CodeBuild publish.
  "ruff>=0.14.0,<0.16",
  "deepdiff>=6.0.0",                    # Required for BDA blueprint service tests
  "datamodel-code-generator>=0.64.0",   # Required for schema/pydantic generator tests
  "mypy-boto3-bedrock-runtime>=1.39.0", # Required for bedrock_utils tests
  # Evaluation module dependencies (from evaluation group)
  "stickler-eval[docsplit]==1.0.0",
  "genson==1.3.0",
  "numpy>=1.26,<3",
  "build==1.3.0",
  # scripts/tests/test_package_discovery.py imports setuptools directly (its
  # package finders and read_configuration) to check the packaging policy. No
  # first-party pyproject declared it outside build-system.requires, which pip
  # provisions only for the build backend, so the suite silently depended on an
  # ambient install. Floor is the security floor (CVE-2025-47273 path traversal
  # is fixed in 78.1.1); the APIs used are much older than that.
  "setuptools>=78.1.1",
  # scripts/tests/test_xray_annotations.py calls the real
  # aws_xray_sdk Segment offline to assert which annotation keys and values the
  # SDK keeps rather than silently drops. Already declared in the `docs_service`
  # extra, but that one is not in `all`, so the test suite would have skipped the
  # behavioural layer in CI (which installs `[all,dev,test]`). Same floor as
  # docs_service; no new third-party surface.
  "aws-xray-sdk>=2.14.0",
  "z3-solver==4.15.4.0",                  # Required for Z3 engine validation tests (pinned - newer versions require building from source)
  # Discovery/clustering tests need scikit-learn (KMeans + silhouette) and
  # scipy (KDTree for nearest-neighbor). They ride along in the
  # ``multi_document_discovery`` extra, but the test extra needs them too:
  # the discovery unit tests (``tests/unit/discovery/*``) don't install that
  # extra and used to inherit both packages transitively through
  # ``stickler-eval==0.5.0``. Stickler 1.0 dropped scikit-learn as a
  # runtime dep and scoped scipy to its ``semantic`` extra (upstream release
  # note #284), so CI's fresh install no longer picks them up transitively
  # and those tests started failing with ``ModuleNotFoundError``. Declaring
  # them here makes the dependency explicit rather than accidental.
  "scikit-learn>=1.5.0",
  "scipy>=1.14.0",
  # benchmarks/tests/test_typed_scoring.py exec's the corpus generators in
  # benchmarks/corpus/generators/, which render their PDFs with reportlab. That
  # root is registered in scripts/run_all_tests.py, so `make test` needs the
  # dependency declared here — it was only mentioned in the run-benchmarks skill
  # as a manual `pip install`, which made those tests fail on any environment
  # that had not run the benchmark harness by hand.
  "reportlab>=4.0.0",
]

# Full package with all dependencies
all = [
  "stickler-eval[docsplit]==1.0.0",
  "genson==1.3.0",
  "Pillow==12.3.0",
  "pypdfium2>=5.5.0",
  "amazon-textract-textractor[pandas]==1.9.2",
  "numpy==1.26.4",
  "pandas==2.2.3",
  # Discovery/clustering module deps — before Stickler 1.0 these were pulled
  # transitively via ``stickler-eval==0.5.0``; 1.0 dropped scikit-learn as a
  # runtime dep, scoped scipy to its ``semantic`` extra, and removed jinja2
  # entirely, so ``idp_common[all]`` would otherwise stop being sufficient
  # to run ``idp_common.discovery.clustering_service`` and
  # ``discovery_agent`` (the latter has a module-level ``from jinja2 import
  # Environment, FileSystemLoader``).
  "scikit-learn>=1.5.0",
  "scipy>=1.14.0",
  "jinja2>=3.1.0",
  "requests==2.33.0",
  "pyarrow==23.0.1",
  "openpyxl==3.1.5",
  "xlrd==2.0.2",
  "python-docx==1.2.0",
  "strands-agents==1.14.0; python_version>='3.10'",
  "strands-agents-tools==0.2.22; python_version>='3.10'",
  "bedrock-agentcore>=1.6.1,<1.9.0; python_version>='3.10'",  # cap rationale: see the [agents] extra
  "jsonschema>=4.0.0",
  # "s3fs==2023.12.2" - - disabled till we fix package dependencies
]
agentic-extraction = [
  "jsonpatch==1.33",
  "strands-agents==1.14.0 ; python_full_version >= '3.10'",
  "pandas>=2.2.3",
  "pypdfium2>=5.5.0",  # Apache-2.0 OR BSD-3-Clause licensed (replaces AGPL-licensed PyMuPDF)
  "email-validator>=2.3.0",
  "tabulate>=0.9.0",
  "aws-lambda-powertools>=3.2.0",                          # Structured logging and observability
  "datamodel-code-generator>=0.64.0",                      # Generate Pydantic models from JSON Schema
  "mypy-boto3-bedrock-runtime>=1.39.0",                    # Type stubs for bedrock_utils.py
]

[project.urls]
"Homepage" = "https://github.com/aws-samples/sample-genai-idp"

[dependency-groups]