# =============================================================================
# BASE CLASSIFICATION - LLM classification defaults
# =============================================================================

classification:
  # How many model calls classification makes, and what each one does.
  # combined (UI: Split and classify together (one call)): one call returns
  # boundaries AND classes.
  # split_then_classify (UI: Split first, then classify each section): a splitting
  # call finds the boundaries with no class vocabulary, then one call per section
  # classifies it. Every setting below lives inside the call that
  # uses it, so nothing here is silently ignored by the other strategy.
  strategy: combined
  # The ONE fallback: assigned when a class cannot be decided — validation
  # retries ran out, or (split_then_classify, non-LLM methods) the classifier was not
  # confident. Normally one of the configured classes, or the built-in
  # 'unclassified'.
  #
  # Any other string is accepted and stored as written, and a page given it has no
  # extraction schema; `validate_config` (idp-cli config-validate) warns when the
  # name matches no class's x-aws-idp-document-type, but does not reject it.
  fallback_class: unclassified
  # ── strategy: combined ────────────────────────────────────────────────
  # Each default prompt lives in its own file under prompts/classification/, named
  # by its key path, and `{_file: <path>}` stands for that file's text (one trailing
  # newline removed). The reference is resolved when the defaults are loaded
  # (merge_utils.load_system_defaults), so a merged, stored or exported configuration
  # carries the prompt text itself, never the reference. Each prompt starts with a
  # {# ... #} comment stating its contract; comments are removed before a prompt is
  # sent (idp_common/prompt_comments.py).
  combined:
    # page: one call per page, each also saying whether the page starts a document. packet: one call per packet or window.
    granularity: page
    page:
      # Pages either side of the page being read, sent as context. Each call carries up to 2k+1 pages.
      contextPagesCount: '0'
      system_prompt: {_file: prompts/classification/combined.page.system_prompt.txt}
      task_prompt: {_file: prompts/classification/combined.page.task_prompt.txt}
    packet:
      system_prompt: {_file: prompts/classification/combined.packet.system_prompt.txt}
      task_prompt: {_file: prompts/classification/combined.packet.task_prompt.txt}
      # Most pages one packet call covers; longer packets are windowed and merged. 0 never windows.
      window_pages: '20'
      # Pages repeated between adjacent windows; must be smaller than window_pages.
      overlap_pages: '2'
    llm:
      model: us.amazon.nova-2-lite-v1:0
      # ARN of a custom inference Lambda, used only when model is 'LambdaHook'.
      model_lambda_hook_arn: null
      temperature: '0.0'
      top_p: '0.0'
      top_k: '5'
      # Output cap. A classification reply is short, and Bedrock holds input +
      # max_tokens of the tokens-per-minute quota while a call runs, so this is
      # capped below Nova 2 Lite's 64,000-token limit. Empty uses the selected
      # model's maximum (model_config_limits.yaml).
      max_tokens: '10000'
      # How hard a reasoning-capable model thinks before answering. Ignored by
      # models with no effort control (Nova, Sonnet 4.5, Haiku 4.5).
      reasoning_effort: medium
      # What this call is sent. Empty infers each flag from this call's task prompt placeholders.
      modality:
        text: ''
        images: ''
      # Downscale page images for this call. Empty sends the image OCR produced.
      image:
        target_height: ''
        target_width: ''
      # Re-prompt on a class outside the vocabulary; fallback_class once retries run out.
      validation:
        enforceValidClasses: true
        maxValidationRetries: '2'
      # Confidence in the class: topk (ranked candidates), verbalized (one number) or off.
      confidence:
        mode: topk
        top_k_candidates: '3'
        task_prompt_topk: {_file: prompts/classification/combined.llm.confidence.task_prompt_topk.txt}
        task_prompt_verbalized: {_file: prompts/classification/combined.llm.confidence.task_prompt_verbalized.txt}
        task_prompt_topk_packet: {_file: prompts/classification/combined.llm.confidence.task_prompt_topk_packet.txt}
        task_prompt_verbalized_packet: {_file: prompts/classification/combined.llm.confidence.task_prompt_verbalized_packet.txt}
  # ── strategy: split_then_classify ──────────────────────────────────────────────────
  split_then_classify:
    # Boundaries only, with no class vocabulary: the prefix saving.
    splitting:
      method: llm
      llm:
        # page: one call per page, each also saying whether the page starts a document. packet: one call per packet or window.
        granularity: page
        page:
          # Pages either side of the page being read, sent as context. Each call carries up to 2k+1 pages.
          contextPagesCount: '0'
          system_prompt: {_file: prompts/classification/split_then_classify.splitting.llm.page.system_prompt.txt}
          task_prompt: {_file: prompts/classification/split_then_classify.splitting.llm.page.task_prompt.txt}
        packet:
          # Most pages one packet call covers; longer packets are windowed and merged. 0 never windows.
          window_pages: '20'
          # Pages repeated between adjacent windows; must be smaller than window_pages.
          overlap_pages: '2'
          system_prompt: {_file: prompts/classification/split_then_classify.splitting.llm.packet.system_prompt.txt}
          task_prompt: {_file: prompts/classification/split_then_classify.splitting.llm.packet.task_prompt.txt}
        # none sends no class vocabulary; class_names sends the names only.
        boundary_hints: none
        model: us.amazon.nova-2-lite-v1:0
        # ARN of a custom inference Lambda, used only when model is 'LambdaHook'.
        model_lambda_hook_arn: null
        temperature: '0.0'
        top_p: '0.0'
        top_k: '5'
        # Output cap. A classification reply is short, and Bedrock holds input +
        # max_tokens of the tokens-per-minute quota while a call runs, so this is
        # capped below Nova 2 Lite's 64,000-token limit. Empty uses the selected
        # model's maximum (model_config_limits.yaml).
        max_tokens: '10000'
        # How hard a reasoning-capable model thinks before answering. Ignored by
        # models with no effort control (Nova, Sonnet 4.5, Haiku 4.5).
        reasoning_effort: medium
        # What this call is sent. Empty infers each flag from this call's task prompt placeholders.
        modality:
          text: ''
          images: ''
        # Downscale page images for this call. Empty sends the image OCR produced.
        image:
          target_height: ''
          target_width: ''
    # One call per section, not per page.
    section_classification:
      method: llm
      # Pages sent per section: first, first_k (k below) or all.
      pages: first_k
      k: '2'
      llm:
        model: us.amazon.nova-2-lite-v1:0
        # ARN of a custom inference Lambda, used only when model is 'LambdaHook'.
        model_lambda_hook_arn: null
        temperature: '0.0'
        top_p: '0.0'
        top_k: '5'
        # Output cap. A classification reply is short, and Bedrock holds input +
        # max_tokens of the tokens-per-minute quota while a call runs, so this is
        # capped below Nova 2 Lite's 64,000-token limit. Empty uses the selected
        # model's maximum (model_config_limits.yaml).
        max_tokens: '10000'
        # How hard a reasoning-capable model thinks before answering. Ignored by
        # models with no effort control (Nova, Sonnet 4.5, Haiku 4.5).
        reasoning_effort: medium
        # What this call is sent. Empty infers each flag from this call's task prompt placeholders.
        modality:
          text: ''
          images: ''
        # Downscale page images for this call. Empty sends the image OCR produced.
        image:
          target_height: ''
          target_width: ''
        system_prompt: {_file: prompts/classification/split_then_classify.section_classification.llm.system_prompt.txt}
        task_prompt: {_file: prompts/classification/split_then_classify.section_classification.llm.task_prompt.txt}
        # Re-prompt on a class outside the vocabulary; fallback_class once retries run out.
        validation:
          enforceValidClasses: true
          maxValidationRetries: '2'
        # Confidence in the class: topk (ranked candidates), verbalized (one number) or off.
        # The per-segment (`_packet`) variants of these two blocks are deliberately
        # absent: this call is one call per section and always returns one class, so
        # the page-shaped block is the only one it can ever read.
        confidence:
          mode: topk
          top_k_candidates: '3'
          task_prompt_topk: {_file: prompts/classification/split_then_classify.section_classification.llm.confidence.task_prompt_topk.txt}
          task_prompt_verbalized: {_file: prompts/classification/split_then_classify.section_classification.llm.confidence.task_prompt_verbalized.txt}
      # method: decision_model — one choice question per section, answered by a
      # decision model over the System One API (docs/decision-models.md).
      decision_model:
        # lambda (the only backend today). The function name must start GENAIIDP-.
        backend: lambda
        # Function ARN (GENAIIDP- prefix). Required when method is decision_model.
        endpoint: ''
        # images | text | both. Page images measured best for classification.
        input: images
        # Pages read per section after `pages` selects them: 1 to 4 (the API's image limit).
        max_pages: 1
        # The most tokens one request holds (section text, images, class question),
        # an estimate from characters. Text past it is cut from the end and never
        # read, so a class cue only in the cut part is not seen. Window 4,096 less 512.
        max_input_tokens: 3584
        instructions: Which type of document is this?
        timeout_ms: 300000
        max_concurrency: 4
        # For metering GB-seconds; the Strands Decider's Lambda runs at 10240.
        function_memory_mb: 10240
        price_per_request: 0.0
        # Model label -> configured class, for a model trained on its own labels.
        label_map: {}
        # none (the only value today): probabilities are used as returned.
        score_calibration: none
      # What a decision-model or embeddings answer below min_confidence does. 0 keeps
      # every answer. method: embeddings requires on_low_confidence: llm.
      low_confidence:
        min_confidence: 0.0
        # fallback_class | llm (the llm block above classifies the section again)
        on_low_confidence: fallback_class
      # method: embeddings — the section's page images are compared with each class's
      # references, and the sections below a threshold go to the llm block above
      # (docs/classification.md, "Section classification by embeddings"). Left out of
      # the shipped defaults so a configuration that does not use it is unchanged;
      # these are the code defaults:
      # embeddings:
      #   model: ''                 # empty: Cohere Embed v4 for the Region
      #   references: examples      # examples (x-aws-idp-examples images) | descriptions
      #   min_similarity: 0.0       # below it the LLM labels the section
      #   temperature: 0.034        # softmax over similarities; refit per model/references
      #   max_image_dimension: 512  # px, longer side; Cohere bills images by pixels
  # ── Advanced: known document shape ───────────────────────────────────────────
  # By default every document is treated as a packet and its section
  # boundaries are detected. These ASSERT the shape instead.
  # sectionSplitting: llm_determined (detect) | disabled (one section for the
  #   whole document) | page (one section per page).
  # maxPagesForClassification: with 'disabled' only — classify the first N
  #   pages and give the whole document their majority class.
  # pageOrder: scan (classify pages in scan order) | printed_page_numbers (read
  #   each page's printed page number from its OCR header/footer text, no model
  #   call, and classify in that order — only when every page has exactly one
  #   number and they form one gap-free run; otherwise scan order is kept and a
  #   classification_page_order_not_applied warning says why). Page IDs in the
  #   results are unchanged either way.
  document_shape:
    sectionSplitting: llm_determined
    maxPagesForClassification: ALL
    pageOrder: scan
