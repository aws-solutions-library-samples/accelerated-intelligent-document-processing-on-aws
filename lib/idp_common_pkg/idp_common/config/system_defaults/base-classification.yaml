# =============================================================================
# BASE CLASSIFICATION - LLM classification defaults
# =============================================================================

classification:
  # How many model calls classification makes, and what each one does.
  # single_pass (UI: One stage): one call returns boundaries AND classes.
  # two_stage: boundaries first with no class vocabulary, then one call per
  # section to classify it. Every setting below lives inside the call that
  # uses it, so nothing here is silently ignored by the other strategy.
  strategy: single_pass
  # The ONE fallback: assigned when a class cannot be decided — validation
  # retries ran out, or (two-stage, non-LLM methods) the classifier was not
  # confident. Normally one of the configured classes, or the built-in
  # 'unclassified'.
  #
  # NOT validated against the class list: any string is accepted and stored as
  # written, and `validate_config` reports no error and no warning for a name no
  # class declares. Sections then carry that name downstream, where nothing
  # matches it. Check the spelling yourself against `classes`.
  fallback_class: unclassified
  # ── strategy: single_pass ────────────────────────────────────────────────
  one_stage:
    # page: one call per page, each also saying whether the page starts a document. packet: one call per packet or window.
    granularity: page
    page:
      # Pages either side of the page being read, sent as context. Each call carries up to 2k+1 pages.
      contextPagesCount: '0'
      system_prompt: >-
        You are a multimodal document classification expert that analyzes business documents
        using both visual layout and textual content. Your task is to classify single-page
        documents into predefined categories based on their structural patterns, visual features,
        and text content. Your output must be valid JSON according to the requested format.
        <variables> <document-ocr-data>: OCR-extracted text content from the document page
        that provides textual information for classification <document-image>: Visual representation
        of the document page that provides layout, formatting, and visual structure information
        <document-types>: List of valid document types with their descriptions that the document
        must be classified into </variables>
      task_prompt: |-
        <task-description> Analyze the provided document using both its visual layout and textual content to determine its document type and whether this page begins a new document or continues the previous one. </task-description>
        <document-types> {CLASS_NAMES_AND_DESCRIPTIONS} </document-types>
        <few-shot-examples> {FEW_SHOT_EXAMPLES} </few-shot-examples>
        <classification-instructions> Follow these steps to classify the document: 1. Examine the visual layout: headers, logos, formatting, structure, and visual organization 2. Analyze the textual content: key phrases, terminology, purpose, and information type 3. Identify distinctive features that match the document type descriptions 4. Decide the document_boundary by applying the <boundary-detection-rules> below 5. Consider both visual and textual evidence together to determine the best match 6. CRITICAL: Only use document types explicitly listed in the <document-types> section </classification-instructions>
        <boundary-detection-rules> You are classifying ONE page at a time. Any pages shown to you as context are there only to help you judge this page; classify only the page identified as the page to classify. "document_boundary" answers one question: is this page the FIRST page of a document instance ("start"), or a later page of a document instance that already began on an earlier page ("continue")? Decide from this page's own evidence, in priority order: 1. PAGINATION: If the page shows pagination such as "Page 2 of 2", "Page 3 of 5", "2/2", or "continued" with a number greater than 1, this page is NOT a first page - output "continue". 2. If pagination indicates the first page (for example "Page 1 of 2"), output "start". 3. OPENING HEADER BLOCK: A first page carries the document's opening identity block - the document title or form name, the issuer or institution name, the addressee or account holder name AND address, the statement or document date or period, and account or reference numbers. Output "start" ONLY when this page carries that opening block. 4. TABLE CONTINUATION: A page whose content is a table or list of rows - even when the table's COLUMN HEADINGS (for example "Date | Description | Amount") are repeated at the top of the page - and that does NOT carry the opening block is a continuation page. Repeated column headings are printed on every page of a long table; they are NOT a document title and do NOT make a page a first page. Output "continue" for such a page. 5. OTHER CONTINUATION EVIDENCE: A later page may also show a form number only in the footer, a running balance or subtotal carried forward, or a trailing signature/consent/certification section. Output "continue" for such a page. CRITICAL - no preceding page shown: If you are not shown the preceding page, do NOT conclude that this page must be a first page. Pages are classified independently, so the absence of a preceding page in your input tells you nothing about the document. Judge only from this page's own evidence: a page that shows only table rows, or is marked "Page 2 of 2", is a continuation page and must be "continue" even when you cannot see page 1. CRITICAL - consecutive documents of the same type: Output "start" whenever this page IS a first page (it carries the opening block), even when the preceding page has the same document type. Two copies of the same form filed back to back are two separate documents, and the first page of the second copy must be "start" so the two are not merged. PRECEDENCE: If the matched document type's description in <document-types> gives explicit boundary or page-ordering instructions (for example, how to handle pages scanned out of order), follow those instructions instead of the general rules above. If evidence is genuinely balanced, prefer "continue" for a page that lacks the opening block, and prefer "start" for a page that carries a complete opening block. </boundary-detection-rules>
        <output-format> {
          "classification_reason": "Detailed reasoning including specific visual and textual evidence that led to this classification, and which opening-block elements (title, issuer, addressee and address, date or period, account or reference number) this page does or does not carry",
          "class": "exact_document_type_from_list",
          "document_boundary": "start or continue"
        } </output-format>
        <<CACHEPOINT>>
        <document-ocr-data> {DOCUMENT_TEXT} </document-ocr-data>
        <document-image> {DOCUMENT_IMAGE} </document-image>
        <final-instructions> Analyze the document above by: 1. Applying the <classification-instructions> to examine both visual and textual features 2. Selecting ONLY from document types in <document-types> 3. Providing clear reasoning with specific evidence 4. Outputting in the exact JSON format specified in <output-format> </final-instructions>
    packet:
      system_prompt: >-
        You are a document classification expert who analyses multi-document packets. Your
        task is to identify where each document in the packet starts and ends, and to classify
        each one into a predefined category, using both the visual layout of each page and
        its text content. Your output must be valid JSON according to the requested format.
        <variables> <document-text>: OCR-extracted text for every page of the packet, each
        page preceded by its page number <document-images>: Page images for every page of
        the packet, each preceded by its page number <document-types>: List of valid document
        types with their descriptions </variables>
      task_prompt: |-
        <task-description> Analyse the document packet below and split it into the separate documents it contains. For each document, report the page range it occupies and its document type. </task-description>
        <document-types> {CLASS_NAMES_AND_DESCRIPTIONS} </document-types>
        <few-shot-examples> {FEW_SHOT_EXAMPLES} </few-shot-examples>
        <segmentation-instructions> 1. Read every page of the packet before deciding anything. A boundary is a statement about the packet, not about one page. 2. A new document STARTS on a page that carries an opening identity block: the document title or form name, the issuer or institution name, the addressee or account holder name AND address, the statement date or period, and account or reference numbers. 3. A page CONTINUES the current document when it lacks that opening block. Repeated table column headings (for example "Date | Description | Amount") are printed on every page of a long table and do NOT start a new document. 4. Pagination is strong evidence: "Page 1 of 3" starts a document, "Page 2 of 3" or "continued" does not. 5. Two copies of the same form filed back to back are TWO documents. Emit two segments of the same type rather than one merged segment. 6. Every page of the packet must belong to exactly one segment. Segments must be contiguous, must not overlap, and must cover the full page range in order. 7. CRITICAL: use only document types listed in <document-types>. If a segment matches none of them, use the closest listed type and say so in its reason. 8. PRECEDENCE: if a matched type's description gives explicit boundary or page-ordering instructions, follow those instead of rules 2-5 for that type. </segmentation-instructions>
        <output-format> Report page numbers exactly as they are labelled in the packet below, where the first page shown is page 1. {
          "segments": [
            {
              "ordinal_start_page": <first page of this document>,
              "ordinal_end_page": <last page of this document>,
              "type": "exact_document_type_from_list",
              "reason": "The opening-block elements and pagination evidence that place this document's start and end here"
            }
          ]
        } </output-format>
        <<CACHEPOINT>>
        <document-text> {DOCUMENT_TEXT} </document-text>
        <document-images> {DOCUMENT_IMAGE} </document-images>
        <final-instructions> Split the packet above by: 1. Applying the <segmentation-instructions> across every page 2. Selecting ONLY from document types in <document-types> 3. Covering every page exactly once, in order 4. Outputting in the exact JSON format specified in <output-format> </final-instructions>
      # Most pages one packet call covers; longer packets are windowed and merged. 0 never windows.
      window_pages: '20'
      # Pages repeated between adjacent windows; must be smaller than window_pages.
      overlap_pages: '2'
    llm:
      model: us.amazon.nova-2-lite-v1:0
      # ARN of a custom inference Lambda, used only when model is 'LambdaHook'.
      model_lambda_hook_arn: null
      temperature: '0.0'
      top_p: '0.0'
      top_k: '5'
      # Optional output cap; empty uses the model's maximum.
      max_tokens: ''
      # How hard a reasoning-capable model thinks before answering. Ignored by
      # models with no effort control (Nova, Sonnet 4.5, Haiku 4.5).
      reasoning_effort: medium
      # What this call is sent. Empty infers each flag from this call's task prompt placeholders.
      modality:
        text: ''
        images: ''
      # Downscale page images for this call. Empty sends the image OCR produced.
      image:
        target_height: ''
        target_width: ''
      # Re-prompt on a class outside the vocabulary; fallback_class once retries run out.
      validation:
        enforceValidClasses: true
        maxValidationRetries: '2'
      # Confidence in the class: topk (ranked candidates), verbalized (one number) or off.
      confidence:
        mode: topk
        top_k_candidates: '3'
        task_prompt_topk: |-
          <class-confidence> Your JSON object MUST also contain a "candidates" key: the {TOP_K_CANDIDATES} document types most likely to be correct for this page, most likely first, each with the probability that it is the correct type.
          "candidates": [
            {"class": "<most likely type>", "probability": <number between 0.0 and 1.0>},
            {"class": "<next most likely type>", "probability": <number between 0.0 and 1.0>}
          ]
          Rules: 1. Every "class" value must be one of the types listed in <document-types>. 2. The first candidate must be the same type you report in "class". 3. The probabilities must not sum to more than 1.0. Mass you leave unassigned means "possibly some other type". 4. Distribute the probability honestly. If a second type is genuinely plausible for this page, give it real probability mass instead of assigning close to 1.0 to the first — a page that is hard to classify should not look certain. </class-confidence>
        task_prompt_verbalized: |-
          <class-confidence> Your JSON object MUST also contain a "confidence" key: the probability, as a number between 0.0 and 1.0, that the type you report in "class" is correct for this page.
          Base it on how much better the page matches the type you chose than the other types in <document-types>. Do not default to a high value: a page whose evidence is thin or ambiguous should carry a low confidence. </class-confidence>
        task_prompt_topk_packet: |-
          <class-confidence> Each object in your "segments" array MUST also contain a "candidates" key: the {TOP_K_CANDIDATES} document types most likely to be correct for THAT segment, most likely first, each with the probability that it is the correct type.
          "candidates": [
            {"class": "<most likely type>", "probability": <number between 0.0 and 1.0>},
            {"class": "<next most likely type>", "probability": <number between 0.0 and 1.0>}
          ]
          Rules: 1. Every "class" value must be one of the types listed in <document-types>. 2. The first candidate must be the same type you report in that segment's "type". 3. The probabilities for a segment must not sum to more than 1.0. Mass you leave unassigned means "possibly some other type". 4. Score each segment independently and honestly. A short segment, or one whose evidence is thin, should not look as certain as a clearly-identified multi-page document. </class-confidence>
        task_prompt_verbalized_packet: |-
          <class-confidence> Each object in your "segments" array MUST also contain a "confidence" key: the probability, as a number between 0.0 and 1.0, that the type you report for THAT segment is correct.
          Base it on how much better the segment's pages match the type you chose than the other types in <document-types>. Do not default to a high value: a segment whose evidence is thin or ambiguous should carry a low confidence. </class-confidence>
  # ── strategy: two_stage ──────────────────────────────────────────────────
  two_stage:
    # Boundaries only, with no class vocabulary: the prefix saving.
    segmentation:
      method: llm
      llm:
        # page: one call per page, each also saying whether the page starts a document. packet: one call per packet or window.
        granularity: page
        page:
          # Pages either side of the page being read, sent as context. Each call carries up to 2k+1 pages.
          contextPagesCount: '0'
          system_prompt: >-
            You are a document segmentation expert. Your only task is to decide where each
            document in a packet starts. You do not classify documents and you do not name
            document types. Your output must be valid JSON according to the requested format.
          task_prompt: |-
            <task-description> Decide whether the page below is the FIRST page of a document, or a later page of a document that began earlier. </task-description>
            {BOUNDARY_HINTS}
            <boundary-detection-rules> You are looking at ONE page. Any pages shown to you as context are there only to help you judge this page. Decide from this page's own evidence, in priority order: 1. PAGINATION: pagination such as "Page 2 of 2", "Page 3 of 5", "2/2", or "continued" with a number greater than 1 means this page is NOT a first page - output "continue". 2. If pagination indicates the first page (for example "Page 1 of 2"), output "start". 3. OPENING HEADER BLOCK: a first page carries the document's opening identity block - the document title or form name, the issuer or institution name, the addressee or account holder name AND address, the statement or document date or period, and account or reference numbers. Output "start" ONLY when this page carries that opening block. 4. TABLE CONTINUATION: a page whose content is a table or list of rows - even when the table's COLUMN HEADINGS (for example "Date | Description | Amount") are repeated at the top of the page - and that does NOT carry the opening block is a continuation page. Repeated column headings are printed on every page of a long table; they are NOT a document title. Output "continue". 5. OTHER CONTINUATION EVIDENCE: a later page may show a form number only in the footer, a running balance or subtotal carried forward, or a trailing signature/consent/certification section. Output "continue". CRITICAL - no preceding page shown: if you are not shown the preceding page, do NOT conclude that this page must be a first page. Pages are judged independently, so the absence of a preceding page tells you nothing. A page showing only table rows, or marked "Page 2 of 2", is a continuation page even when you cannot see page 1. CRITICAL - consecutive documents: output "start" whenever this page IS a first page, even when the preceding page belongs to a document of the same kind. Two copies of the same form filed back to back are two separate documents. If evidence is genuinely balanced, prefer "continue" for a page lacking the opening block and "start" for a page carrying a complete opening block. </boundary-detection-rules>
            <output-format> {
              "boundary_reason": "Which opening-block elements (title, issuer, addressee and address, date or period, account or reference number) and pagination evidence this page does or does not carry",
              "document_boundary": "start or continue"
            } </output-format>
            <<CACHEPOINT>>
            <document-ocr-data> {DOCUMENT_TEXT} </document-ocr-data>
            <document-image> {DOCUMENT_IMAGE} </document-image>
        packet:
          # Most pages one packet call covers; longer packets are windowed and merged. 0 never windows.
          window_pages: '20'
          # Pages repeated between adjacent windows; must be smaller than window_pages.
          overlap_pages: '2'
          system_prompt: >-
            You are a document segmentation expert who analyses multi-document packets. Your
            only task is to decide where each document in the packet starts and ends. You
            do not classify documents and you do not name document types. Your output must
            be valid JSON according to the requested format.
          task_prompt: |-
            <task-description> Split the document packet below into the separate documents it contains. Report only the page range each document occupies. Do NOT name or classify the documents. </task-description>
            {BOUNDARY_HINTS}
            <segmentation-instructions> 1. Read every page of the packet before deciding anything. A boundary is a statement about the packet, not about one page. 2. A new document STARTS on a page that carries an opening identity block: the document title or form name, the issuer or institution name, the addressee or account holder name AND address, the statement date or period, and account or reference numbers. 3. A page CONTINUES the current document when it lacks that opening block. Repeated table column headings (for example "Date | Description | Amount") are printed on every page of a long table and do NOT start a new document. 4. Pagination is strong evidence: "Page 1 of 3" starts a document, "Page 2 of 3" or "continued" does not. 5. Two copies of the same form filed back to back are TWO documents. Report two ranges rather than one merged range. 6. Every page of the packet must belong to exactly one range. Ranges must be contiguous, must not overlap, and must cover the full page range in order. </segmentation-instructions>
            <output-format> Report page numbers exactly as they are labelled in the packet below, where the first page shown is page 1. {
              "segments": [
                {
                  "ordinal_start_page": <first page of this document>,
                  "ordinal_end_page": <last page of this document>,
                  "boundary_reason": "The opening-block elements and pagination evidence that place this document's start and end here"
                }
              ]
            } </output-format>
            <<CACHEPOINT>>
            <document-text> {DOCUMENT_TEXT} </document-text>
            <document-images> {DOCUMENT_IMAGE} </document-images>
        # none sends no class vocabulary; class_names sends the names only.
        boundary_hints: none
        model: us.amazon.nova-2-lite-v1:0
        # ARN of a custom inference Lambda, used only when model is 'LambdaHook'.
        model_lambda_hook_arn: null
        temperature: '0.0'
        top_p: '0.0'
        top_k: '5'
        # Optional output cap; empty uses the model's maximum.
        max_tokens: ''
        # How hard a reasoning-capable model thinks before answering. Ignored by
        # models with no effort control (Nova, Sonnet 4.5, Haiku 4.5).
        reasoning_effort: medium
        # What this call is sent. Empty infers each flag from this call's task prompt placeholders.
        modality:
          text: ''
          images: ''
        # Downscale page images for this call. Empty sends the image OCR produced.
        image:
          target_height: ''
          target_width: ''
    # One call per section, not per page.
    section_classification:
      method: llm
      # Pages sent per section: first, first_k (k below) or all.
      pages: first_k
      k: '2'
      llm:
        model: us.amazon.nova-2-lite-v1:0
        # ARN of a custom inference Lambda, used only when model is 'LambdaHook'.
        model_lambda_hook_arn: null
        temperature: '0.0'
        top_p: '0.0'
        top_k: '5'
        # Optional output cap; empty uses the model's maximum.
        max_tokens: ''
        # How hard a reasoning-capable model thinks before answering. Ignored by
        # models with no effort control (Nova, Sonnet 4.5, Haiku 4.5).
        reasoning_effort: medium
        # What this call is sent. Empty infers each flag from this call's task prompt placeholders.
        modality:
          text: ''
          images: ''
        # Downscale page images for this call. Empty sends the image OCR produced.
        image:
          target_height: ''
          target_width: ''
        system_prompt: >-
          You are a document classification expert. You are given the opening pages of ONE
          document and a list of document types. Your task is to say which type it is. Your
          output must be valid JSON according to the requested format.
        task_prompt: |-
          <task-description> Identify the type of the single document whose pages are shown below. The pages all belong to one document; you are not being asked to split anything. </task-description>
          <document-types> {CLASS_NAMES_AND_DESCRIPTIONS} </document-types>
          <few-shot-examples> {FEW_SHOT_EXAMPLES} </few-shot-examples>
          <classification-instructions> 1. Examine the visual layout: headers, logos, formatting, structure, and visual organization 2. Analyze the textual content: key phrases, terminology, purpose, and information type 3. Identify distinctive features that match the document type descriptions 4. CRITICAL: only use document types explicitly listed in the <document-types> section </classification-instructions>
          <output-format> {
            "classification_reason": "Specific visual and textual evidence that identifies this document's type",
            "class": "exact_document_type_from_list"
          } </output-format>
          <<CACHEPOINT>>
          <document-ocr-data> {DOCUMENT_TEXT} </document-ocr-data>
          <document-image> {DOCUMENT_IMAGE} </document-image>
        # Re-prompt on a class outside the vocabulary; fallback_class once retries run out.
        validation:
          enforceValidClasses: true
          maxValidationRetries: '2'
        # Confidence in the class: topk (ranked candidates), verbalized (one number) or off.
        # The per-segment (`_packet`) variants of these two blocks are deliberately
        # absent: this call is one call per section and always returns one class, so
        # the page-shaped block is the only one it can ever read.
        confidence:
          mode: topk
          top_k_candidates: '3'
          task_prompt_topk: |-
            <class-confidence> Your JSON object MUST also contain a "candidates" key: the {TOP_K_CANDIDATES} document types most likely to be correct for this page, most likely first, each with the probability that it is the correct type.
            "candidates": [
              {"class": "<most likely type>", "probability": <number between 0.0 and 1.0>},
              {"class": "<next most likely type>", "probability": <number between 0.0 and 1.0>}
            ]
            Rules: 1. Every "class" value must be one of the types listed in <document-types>. 2. The first candidate must be the same type you report in "class". 3. The probabilities must not sum to more than 1.0. Mass you leave unassigned means "possibly some other type". 4. Distribute the probability honestly. If a second type is genuinely plausible for this page, give it real probability mass instead of assigning close to 1.0 to the first — a page that is hard to classify should not look certain. </class-confidence>
          task_prompt_verbalized: |-
            <class-confidence> Your JSON object MUST also contain a "confidence" key: the probability, as a number between 0.0 and 1.0, that the type you report in "class" is correct for this page.
            Base it on how much better the page matches the type you chose than the other types in <document-types>. Do not default to a high value: a page whose evidence is thin or ambiguous should carry a low confidence. </class-confidence>
  # ── Advanced: known file shape ───────────────────────────────────────────
  # By default every file is treated as a packet and its boundaries are
  # detected. These ASSERT the shape instead.
  # sectionSplitting: llm_determined (detect) | disabled (one document) |
  #   page (one document per page).
  # maxPagesForClassification: with 'disabled' only — classify the first N
  #   pages and give the whole file their majority class.
  file_shape:
    sectionSplitting: llm_determined
    maxPagesForClassification: ALL
