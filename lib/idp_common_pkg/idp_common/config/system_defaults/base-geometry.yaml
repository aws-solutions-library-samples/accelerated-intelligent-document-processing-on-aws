# =============================================================================
# BASE GEOMETRY - field bounding-box (geometry) defaults (v0.6)
# =============================================================================
# Geometry is advisory enrichment on per-field confidence. It lives under
# `extraction.geometry` (v0.6 — replaces `assessment.geometry_mode`).
#
# A box locates an extracted VALUE on the page, so a field the model returned
# nothing for is never located, whichever mode is set.
#
#   ocr_only     (default) : match each extracted value to real OCR lines. The
#                            model is not asked for boxes, so no added tokens.
#   llm_grounded           : model emits boxes, OCR grounding corrects them. For
#                            values not present verbatim in the OCR text.
#   llm                    : model boxes as-is. DISCOURAGED — same prompt and
#                            cost as llm_grounded without the correction step,
#                            so never the better of the two. Kept for
#                            compatibility with existing configurations.
#   off                    : no geometry produced
# =============================================================================

extraction:
  geometry:
    mode: ocr_only
    task_prompt_bbox: >-
      <spatial-localization-guidelines>
      Additionally, for each field provide bounding box coordinates alongside its
      confidence:
      - bbox: [x1, y1, x2, y2] in a normalized 0-1000 scale
      - page: page number where the field appears (starting from 1)
      Use x1,y1 = top-left and x2,y2 = bottom-right (ensure x2 > x1, y2 > y1). Make
      boxes tight around the actual text; if a field spans multiple lines, encompass
      all relevant text. Include bbox/page in the JSON alongside each field's confidence.
      </spatial-localization-guidelines>
