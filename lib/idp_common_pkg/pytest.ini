[pytest]
markers =
    unit: mark a test as a unit test
    integration: mark a test as an integration test
    # A live agentic run against real Bedrock. ALWAYS combine with `integration`:
    # `agentic` alone is not filtered by anything, so a test carrying only this
    # marker runs in the default gate and bills a real model call.
    agentic: mark a test as a live agentic (real Bedrock) test

# By default, run all tests except those marked as integration
addopts = -m "not integration"

# manual_tests/ holds operator-run scripts that call real Bedrock, Athena and
# DynamoDB. They are named test_*.py, so a pathless `pytest` from this directory
# would collect and bill them. Excluding them here rather than with --ignore on
# individual recipes covers every invocation, including a bare `pytest`.
#
# The rest of this list is pytest's own default, restated because setting
# norecursedirs REPLACES the default rather than extending it — dropping it would
# start walking build/, node_modules/ and .venv/.
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} manual_tests

# Filter warnings
filterwarnings =
    # Ignore the datetime.utcnow() deprecation warning from botocore
    ignore:datetime.datetime.utcnow\(\) is deprecated:DeprecationWarning
