  - id: reporting-database
    title: Reporting database for analytics over results and costs
    description: >-
      Processing writes evaluation results, rule-validation results, metering (token
      and page usage per step) and the extracted section data as Parquet in S3,
      catalogued as AWS Glue tables and queryable with Amazon Athena. Section tables
      are created per document class automatically, and scheduled rollup tables answer
      cost and volume questions over wide time ranges. The analytics agent and the MCP
      search tool query the same data.
    evidence:
