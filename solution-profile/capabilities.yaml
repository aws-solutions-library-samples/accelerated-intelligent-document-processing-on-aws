  - id: input-file-formats
    title: Input file formats
    description: >-
      The pipeline OCR step reads PDF and image files (JPG, JPEG, PNG, GIF, BMP, TIFF,
      TIF, WebP; formats Bedrock cannot take are converted to JPEG, and an image file is
      processed as one page) and converts Word .docx, Excel .xlsx and legacy .xls (each
      sheet becomes a page), CSV and plain-text files to pages. The type is taken from
      the file extension, with a content check for files without a known one. The web
      UI upload picker offers PDF, PNG, JPG, JPEG, TIFF, TIF, XLSX, XLS, CSV, DOCX and
      TXT; GIF, BMP and WebP reach the pipeline through the input bucket, CLI or SDK.
      Legacy .doc fails the document with an error asking for .docx, and BDA mode
      passes the original file to Bedrock Data Automation, whose accepted formats this
      repository does not document.
