  - id: knowledge-base
    title: Document knowledge base query
    description: >-
      Processed documents are indexed into an Amazon Bedrock Knowledge Base, by
      default on S3 Vectors (OpenSearch Serverless optional), and users ask questions
      across the collection in the web UI with citations to source documents.
      Documents are chunked into fixed-size chunks of up to 8,192 tokens and ingested
      every 30 minutes, so a new document is not queryable at once. It is controlled by
      the DocumentKnowledgeBase stack parameter, on (Create) by default, needs access
      to the embedding model (default Titan Text Embeddings V2) and is removed in
      headless deployments; the private-network runbook requires DocumentKnowledgeBase
      DISABLED.
    evidence:
      - docs/knowledge-base.md
      - docs/knowledge-base.md#configuration
      - template.yaml
    related:
      - deployment:headless
      - deployment:private-network

  - id: language-support
    title: Documents in languages other than English
    description: >-
      Language support depends on mode and OCR backend. BDA's own supported-language
      list, last checked in the docs on 2025-09-19, was English, Portuguese, French,
      Italian, Spanish and German, without vertical text. Textract's coverage depends on
      the operation: plain text detection, Queries and handwriting are English only,
      FORMS covers six Western European languages, and the default TABLES, LAYOUT and
      SIGNATURES features cover the broadest set. For languages Textract does not
      read, the Bedrock OCR backend uses an LLM instead. Model accuracy is not
      published per language, so the docs advise testing with 50-100 representative
      documents for a high-resource language and 5-10 times that for a low-resource
      one.
    evidence:
      - docs/languages.md
      - docs/languages.md#ocr-backend-considerations-for-language-support
    modes: [bda, pipeline]
    configuration: [ocr.backend, ocr.features]
    related:
      - capability:ocr-backends
      - limitation:language-script-support
      - question:languages-scripts
      - question:handwriting

  - id: cost-reporting
    title: Per-document cost estimates and cost data
    description: >-
      Every document records its token and page usage per step, and the web UI shows an
      estimated cost per document from a pricing table in the configuration, which can
      be edited to reflect negotiated prices; a reprocessed document's estimate sums all
      its runs. The same metering lands in the reporting database for Athena queries,
      and a DocumentEstimatedCost CloudWatch metric can be alarmed on. Completed model
      calls whose result is not used are counted, but the calls of an attempt that Step
      Functions retries after a transient error are not, so the estimate can be lower
      than the bill. Bedrock application inference profiles can attribute costs in AWS
      billing.
    evidence:
      - docs/cost-calculator.md#cost-monitoring-and-estimation
      - docs/reporting-database.md#metering-table
      - config_library/pricing.yaml
    configuration: [pricing]
    related:
      - capability:reporting-database
      - capability:capacity-planning
      - question:monthly-volume

  - id: load-testing
    title: Load testing by copying files into the input bucket
    description: >-
      idp-cli load-test (and client.testing.load_test in the SDK) copies one source
      file into the input bucket at a set rate, 100 files per minute for 1 minute by
      default, or follows a CSV schedule of files per minute, optionally under a named
      configuration profile. The documented examples go up to 2,500 files per minute.
      It measures the deployed stack's real throughput and quota behaviour, and the
      documents it creates are processed and billed like any others.
    evidence:
      - docs/idp-cli.md#load-test
      - docs/idp-sdk.md
      - lib/idp_cli_pkg/examples/load-test-schedule.csv
    related:
      - capability:idp-cli
      - capability:capacity-planning
      - question:peak-volume

  - id: malware-scanning
    title: Malware scanning of uploads at ingest
    description: >-
      With stack parameter MalwareScanning set to CREATE_PLAN or GATE_ONLY, Amazon
      GuardDuty Malware Protection for S3 scans each upload and the document starts
      processing only after a clean verdict; an infected or unscannable document
      reaches its own terminal status with an alert. It is off by default. It is
      static, signature and model based detection, not behavioural analysis, so novel
      malware can pass. GuardDuty allows 25 protected buckets per account per Region
      (not adjustable) and prices beyond the free tier at $0.09 per GB plus $0.215 per
      1,000 objects.
    evidence:
      - docs/malware-scanning.md
      - docs/malware-scanning.md#enabling-it
      - docs/malware-scanning.md#cost-and-quotas
      - template.yaml
    configuration: [malware_scanning.on_unscannable]
    related:
      - question:pii
      - prerequisite:service-quotas

  - id: document-versions
    title: Retained versions of each processed document
    description: >-
      Every processing run of a document is kept as a read-only version, so
      reprocessing or re-uploading a document does not lose its earlier results.
      Versions can be viewed, compared, downloaded and deleted in the web UI, which
      helps when comparing a configuration change on the same document.
    evidence:
      - docs/document-versions.md
    related:
      - capability:configuration-versions
      - capability:web-ui
