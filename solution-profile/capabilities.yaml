  - id: bedrock-model-choice
    title: Choice of model for each step
    description: >-
      Each model-using step (OCR with the Bedrock backend, classification, extraction,
      confidence, summarization, evaluation, rule validation, chat) names its own
      model in the configuration, so a cheap model can do one step and a stronger one
      another. The selectable models are on Bedrock: Amazon Nova, Anthropic Claude, OpenAI
      GPT, xAI Grok, Meta Llama 4, Qwen, Google Gemma and NVIDIA Nemotron models, with
      Amazon Titan and Cohere embedding models for the knowledge base. Fine-tuned Nova
      models can be used too, and any other endpoint is reached through a Lambda hook
      that speaks the Converse API. Each selectable model is listed in this item's model tags. The shipped defaults are
      Amazon Nova 2 Lite for classification, Claude Sonnet 5 for extraction, Amazon Nova
      Lite for confidence and Claude Sonnet 5 (1M context) for summarization; model
