  - id: multi-tenancy
    title: Multi-tenant isolation within one stack
    description: >-
      One stack can serve several tenants: an Input-bucket prefix maps documents to a
      configuration profile, a user's scope limits them to documents of matching
      profiles, and a tenant declaration ties prefixes and profile patterns together.
      Stack parameter TenantIsolationMode=Strict makes it fail closed (unscoped non-Admin
      users see nothing; uploads outside or across tenants are refused). Isolation is
      enforced by the application, not IAM: processing functions, tables and buckets
      are shared, throughput is shared, and test sets carry no tenant; the docs advise
      separate stacks or accounts where a tenant needs credential separation, its own
      throughput or Region, or complete removal.
    evidence:
      - docs/multi-tenancy.md#how-isolation-works
      - docs/multi-tenancy.md#strict-mode
      - docs/multi-tenancy.md#what-this-does-not-isolate
      - docs/multi-tenancy.md#when-to-use-separate-stacks-instead
    related:
      - capability:configuration-profiles
      - question:multi-tenant

  - id: fine-tuning
