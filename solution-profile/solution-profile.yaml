  statement: >-
    A sample from the AWS Solutions Library, published as open source under MIT-0.
    The customer deploys, owns and operates it in their own AWS account, including
    upgrades, security review and the AWS charges it incurs. Questions and fixes go
    through the public GitHub repository; there is no service-level agreement.
docs_url: https://aws-solutions-library-samples.github.io/accelerated-intelligent-document-processing-on-aws/
