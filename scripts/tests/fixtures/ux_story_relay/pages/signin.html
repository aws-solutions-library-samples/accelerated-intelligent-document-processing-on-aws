<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
</head>
<body>
<main>
  <h1>Welcome to GenAI Intelligent Document Processing!</h1>
  <div role="tablist">
    <button type="button" role="tab" aria-selected="true">Sign In</button>
    <button type="button" role="tab" aria-selected="false">Create Account</button>
  </div>
  <form>
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" type="text" placeholder="Enter your Username">
    <label for="password">Password</label>
    <input id="password" name="password" autocomplete="current-password" type="password" placeholder="Enter your Password">
    <button type="button" aria-label="Show password">show</button>
    <button type="submit">Sign in</button>
    <button type="button">Forgot your password?</button>
  </form>
</main>
</body>
</html>
