#
# Storyboards for the product-demo skill (.claude/skills/product-demo.md).
#
# A storyboard is a demo that has been proposed, confirmed by a person and (usually)
# recorded once. It is kept so the same demo can be re-recorded on a later release
# without re-deriving what to show and what to say — the equivalent of what
# scripts/ux_flows.yaml is for UX reviews.
#
# This file is memory, not scope. A demo run starts from what the user asks for
# (a changelog section, a PR, a feature) and proposes three storyboards; an entry
# here is offered as one of the three when it covers the request. Add an entry
# AFTER the user has confirmed it, when its chapters, fixtures and narration have
# been rehearsed against a real stack. Written beforehand it encodes a guess.
#
# Storyboards hold no document content, account ids, stack names or people, so
# they are safe to commit. The recordings themselves live under
# scratch/ux-recordings/ and are never committed.
#
# Fields:
#   id             Stable slug. The session's docs-entry and report name it.
#   title          The title card and the docs/demo-videos.md heading.
#   source         What the demo is of: a CHANGELOG section and entries, a PR/MR,
#                  or a feature doc.
#   audience       Who it is for, in a phrase.
#   hook           One sentence: what the viewer can do after watching. Spoken on
#                  the title card (start --say).
#   persona        The Cognito group the demo is recorded as (Admin, Author,
#                  Reviewer, Annotator, Viewer).
#   duration_target  "m:ss". Published demos run 2–5 minutes; aim for 2–4.
#   fixtures       What must exist before recording, and how to make it. Shipped
#                  samples and synthetic data unless the user agreed otherwise.
#   chapters       One per `mark`. `label` is the chapter name, `say` the narration
#                  spoken before the action (first person plural, present tense,
#                  why before what), `do` the browser steps precise enough to
#                  rehearse from.
#   closing        Spoken on the end card (stop --say): the takeaway and the doc.
#   takeaways      3–5 lines for the Key takeaways end card. Claims, not a table
#                  of contents.
#   not_shown      What the demo deliberately leaves out, and why.
#   docs           The docs page (and anchor) the docs entry links to.
#   category       The docs/demo-videos.md heading the entry belongs under.
#   last_recorded  {date, version} of the most recent recording, or null.

storyboards:
  - id: test-set-from-documents-only-zip
    title: Start a test set from documents alone
    source: 'CHANGELOG [Unreleased] Fixed — a test-set zip with only an input/ folder is accepted as an unlabeled set (#897)'
    audience: Teams beginning ground-truth collection with no labels yet
    hook: >-
      You can start a test set from a folder of documents and nothing else, and let
      the pipeline draft the first labels for you.
    persona: Admin
    duration_target: '2:30'
    fixtures:
      - A zip holding a single input/ folder with two or three PDFs from samples/
        (for example lending_package.pdf and a bank statement sample), zipped from
        the command line with no baseline/ folder.
      - The stack signed in as an Admin, on Test Studio → Test sets.
    chapters:
      - label: Why start without labels
        say: >-
          Ground truth is the expensive part of a test set. Test Studio lets us start
          with just the documents and have the pipeline draft the labels, so the
          reviewers correct instead of type.
        do:
          - Open Test Studio → Test sets so the table of existing sets is on screen.
      - label: Create a set from a documents-only zip
        say: >-
          We create a test set and choose Upload documents only. The zip we are
          uploading is a plain input folder with a few sample PDFs and nothing else.
        do:
          - Create test set → Upload documents only → choose the fixture zip →
            name the set → submit.
      - label: The set completes as unlabeled
        say: >-
          The zip is processed in the background. The set completes with its
          documents counted and the Labels column reading Unlabeled, which is a
          healthy state, not an error.
        do:
          - Wait for the row to reach COMPLETED (pause/resume around the wait if it
            runs long); point out the file count and the Labels column.
      - label: Draft labels are one action away
        say: >-
          Inside the set every document is present and unlabeled, and Generate draft
          labels is offered. That is the next step, and the reviewers take it from
          there in the annotation queue.
        do:
          - Open the set; show the document list, the Unlabeled state, and the
            Generate draft labels action.
      - label: A mismatched zip is still refused
        say: >-
          The guard for real mistakes stays. A zip whose baseline folder covers only
          some of its documents is refused, and the row says which files are
          missing.
        do:
          - Upload the second fixture (baselines for one of two documents); show the
            FAILED row and its reason popover.
      - label: Clean up
        say: We remove both fixture sets so nothing is left behind.
        do:
          - Delete both sets from the table.
    closing: >-
      That is a test set started from documents alone. The details are in the Test
      Studio documentation under creating custom test sets.
    takeaways:
      - A zip with only an input/ folder creates an unlabeled test set
      - Unlabeled is a healthy state; draft labels are one action away
      - Baselines that do not match the documents are still refused, with a reason
    not_shown:
      - Generating the draft labels and reviewing them (its own demo — the
        annotation queue)
      - Adding documents to an existing set by zip (same path, covered by the
        test-set editing demo)
    docs: docs/creating-custom-test-sets.md
    category: Evaluation & Testing
    last_recorded:
      date: '2026-09-18'
      version: 0.6.9.dev2

  - id: tenant-isolation-shared-deployment
    title: Tenant isolation in a shared deployment
    source: 'CHANGELOG [Unreleased] Added — Tenant isolation for shared deployments; Tenants granted by the identity provider or an entitlement system; docs/multi-tenancy.md'
    audience: Admins and platform teams serving several business units or customers from one stack
    hook: >-
      One deployment can serve several tenants and keep each tenant's documents
      visible only to that tenant's users. We set up a tenant, map its folder, give
      it a user, and watch the safeguards refuse every way of crossing the boundary.
    persona: Admin
    duration_target: '5:30'
    fixtures:
      - Stack deployed with TenantIsolationMode=Strict and TenantGrantSource=Manual.
      - Tenants acme (clients/acme/, acme-*) and globex (clients/globex/, globex-*)
        declared, each with a prefix mapping to its own profile and one Viewer user
        whose first sign-in is complete.
      - A processed copy of samples/lending_package.pdf under each of clients/acme/
        and clients/globex/.
      - A Configuration Profile initech-invoices, copied from acme-invoices with
        idp-cli config-upload, so the new tenant has a profile to map to.
      - Terminal pages (local HTML) holding the real output of the stack-parameter
        query and of idp-cli tenancy put, list, audit, generate-policies and verify,
        captured before recording. generate-policies uses a principals file naming
        roles in the documentation account 111122223333.
    chapters:
      - label: The deployment parameters
        say: >-
          Tenant isolation is controlled by three deployment parameters. Tenant Isolation
          Mode is Off by default, and Strict makes isolation fail closed. Tenant Grant
          Source decides who sets a user's tenant: an Admin, the identity provider's
          claim, or an entitlement system through the API. And Refresh Token Validity
          Hours bounds how long a web session can keep a tenant that was taken away.
        do:
          - Terminal page — describe-stacks table, then smooth-scroll through the three
            parameter definitions from template.yaml.
      - label: Tenants
        say: >-
          Tenants are declared on the Prefix Mappings page. Each one owns a set of
          Input bucket folders, and the Configuration Profiles whose names match its
          pattern. This deployment already serves Acme and Globex, with strict
          isolation on.
        do:
          - Configuration › Prefix Mappings (fresh load); hold on the Tenants table and
            the Strict alert.
      - label: Declare a tenant
        say: >-
          A folder can belong to only one tenant, so a new tenant that reaches inside
          Acme's folder is refused, and the message names the folder it collides with.
          Instead we add Initech. It owns the clients initech folder, and every profile
          whose name starts with initech dash belongs to it.
        do:
          - Create tenant → ID overlap, prefix clients/acme/eu/, pattern overlap-* →
            Save tenant → refusal shown.
          - Same dialog → ID initech, prefix clients/initech/, pattern initech-*,
            description "Initech business unit" → Save tenant → three tenants listed.
      - label: Map the tenant's folder
        say: >-
          Prefix mappings respect the same boundary. Sending a folder inside Acme to a
          Globex profile is refused when it is saved. A mapping for Initech's own folder
          is accepted, so the folder a document arrives in decides both how it is
          processed and who can see it.
        do:
          - Create mapping → folder clients/acme/eu → profile globex-invoices → Save →
            refusal shown.
          - Same dialog → folder clients/initech → profile initech-invoices → Save →
            mapping listed. (The dialog's Cancel sits beside Save; pick Save by label.)
      - label: Give the tenant a user
        say: >-
          In strict mode a user with no scope sees nothing, so a new Initech Viewer gets
          a configuration profile scope. Adding a Globex profile as well would let one
          person read across two tenants, so that scope is refused. Confined to Initech,
          the user is created alongside the existing Acme and Globex users.
        do:
          - User Management → Create User → email, role Viewer, scope initech-invoices
            and globex-invoices → Create User → refusal shown.
          - Remove globex-invoices → Create User → success; hold on the users table.
      - label: Strict mode checks every upload
        say: >-
          Strict mode also checks uploads. A folder outside every tenant is refused,
          and the panel says so before anything is sent. A document that asks for
          another tenant's profile is processed under its own tenant's profile instead.
        do:
          - Upload Documents → choose samples/lending_package.pdf → prefix inbox/2026 →
            refusal alert, Upload disabled.
          - Prefix clients/acme/2026, profile globex-invoices → "Your profile selection
            will be ignored" notice.
      - label: The same from the command line
        say: >-
          Everything we did in the console has a command line equivalent. Tenancy put
          declares a tenant, list shows the tenants with the isolation mode, and audit
          reports anything that weakens isolation. Here, there is nothing to report.
        do:
          - Terminal page — idp-cli tenancy put, list, audit.
      - label: Per-tenant access points
        say: >-
          Generate policies writes a template of S3 access points, one per tenant and
          bucket, that let each tenant's uploaders write only under its own folders,
          and its consumers read only its own results.
        do:
          - Terminal page — generate-policies output, then smooth-scroll through Acme's
            Input access point policy.
      - label: A live cross-tenant check
        say: >-
          Verify proves the boundary on the running deployment. It signs in as throwaway
          users of two tenants, checks that each one reads only its own documents, and
          that strict mode refuses the uploads it should, then removes what it made.
        do:
          - Terminal page — tenancy verify, every check PASS.
      - label: The tenant's own view
        say: >-
          Finally, we sign in as Acme's user. They see Acme's document and nothing of
          Globex's, the assistants that read across documents are not offered, and a
          direct link to another tenant's document is refused.
        do:
          - App tab → user menu → Sign out → sign in as the acme user → Document List
            shows only clients/acme/... → open the clients/globex/test/lending.pdf
            link directly → "Couldn't open this document".
    closing: >-
      Declare tenants, audit, then switch to strict mode, and one deployment keeps each
      tenant's documents to its own users. The Multi-Tenant Isolation guide has the
      details.
    takeaways:
      - A tenant is a set of Input folders plus a profile name pattern
      - Overlapping tenants, cross-tenant mappings and spanning scopes are refused when saved
      - Strict mode fails closed — unscoped users see nothing, out-of-tenant uploads are refused
      - Admins stay cross-tenant, so keep that group small
      - idp-cli tenancy audit, generate-policies and verify cover the rollout
    not_shown:
      - TenantGrantSource IdpClaim and Api (described in the parameters chapter only;
        this stack uses Manual and has no external identity provider).
      - Deploying the generated access point template, and the s3:CreateAccessPoint
        prerequisite (an account-level control; see the guide).
      - Creating the initech-invoices Configuration Profile (a fixture).
      - The Test Studio and PII anonymizer exceptions to the ingest rule.
    docs: docs/multi-tenancy.md
    category: Access Control & Tenant Isolation
    last_recorded: {date: 2026-11-05, version: 0.6.13}

  - id: terraform-deploy-update-migrate
    title: Deploy the IDP Accelerator with Terraform
    source: 'CHANGELOG [0.6.15] Added — Experimental Terraform deployment; migrate-from-genai-idp-terraform'
    audience: Teams that standardise on Terraform or OpenTofu, and current genai-idp-terraform users
    hook: >-
      Every release of the IDP Accelerator now ships as a Terraform module as well as
      CloudFormation templates. In the next few minutes we deploy it from a published
      module and from a local clone, update it, and plan a move off the
      genai-idp-terraform repository, all from the command line.
    persona: Admin
    duration_target: '4:30'
    fixtures:
      - A Terraform deployment made with idp-cli deploy --terraform from the published
        0.6.15 module, with its state directory (reused, not created for the demo).
      - A scratch root configuration with one module block pointing at the published
        zip URL, used for init and plan only — never applied.
      - An upstream genai-idp-terraform deployment at the pinned tag, seeded with
        sample documents and users, made with scripts/sdlc/terraform_migration_test.py
        --stop-after seed --keep and torn down with --teardown-only afterwards.
      - Terminal footage is real command output, captured with script(1), redacted
        (account ids, emails) and long output trimmed, replayed in a local file://
        terminal page in the recorded tab. The web UI is a disposable Admin user
        from ux_test_session.py setup, torn down after.
    chapters:
      - label: One release, two formats
        say: >-
          Each release publishes its Terraform module beside its CloudFormation
          templates, in the same bucket, with a checksum, and a small pointer file
          that always names the newest one.
        do:
          - Terminal - aws s3 ls of the release's terraform/ prefix; curl the
            idp-terraform-latest.json pointer.
      - label: The published module in your own configuration
        say: >-
          If you already run Terraform, the accelerator is one module block. Point its
          source at the release zip, give it a name and an admin email, and init and
          plan as usual. The module is generated from the same templates, so it
          deploys the same resources with the same settings.
        do:
          - Terminal - cat main.tf; terraform init (module download); terraform plan
            ending in its Plan summary line.
      - label: Or let idp-cli write it for you
        say: >-
          For a quicker start, idp-cli deploy with the terraform flag writes the root
          configuration, plans, checks the plan and applies it. The parameters are the
          same CloudFormation parameter names you already use.
        do:
          - Terminal - idp-cli deploy --terraform against the existing deployment's
            directory; show the generated main.tf, terraform.tfvars and
            idp-cli-parameters.json, and the init, plan, check and apply lines.
      - label: Build and deploy from a local clone
        say: >-
          To deploy your own changes, add from-code and point it at your clone. It
          builds and publishes the templates and the module to your own bucket, then
          deploys that module the same way.
        do:
          - Terminal - idp-cli deploy --terraform --from-code . ; show the build and
            publish summary, then the plan and apply.
      - label: Updates keep your data safe
        say: >-
          Updating is the same command with only what changes. idp-cli remembers the
          earlier parameters, and it refuses any plan that would delete or replace a
          bucket, table, user pool or key, unless we explicitly allow it.
        do:
          - Terminal - idp-cli deploy --terraform --parameters with one setting
            changed; show the small plan and the apply. If rehearsal finds a safe
            parameter that triggers it, show the stateful-replace refusal.
      - label: Still the same IDP
        say: >-
          A small read-only CloudFormation label lets idp-cli and the SDK find a
          Terraform deployment by name, so the commands you already know work
          unchanged. Here we send a sample document through it.
        do:
          - Terminal - describe the label's description and tags; idp-cli process
            --stack-name with a sample document.
      - label: The web application you know
        say: >-
          And the web application is exactly the one you know. The document we sent is
          processed and classified, and the deployment info shows the version it runs.
        do:
          - Browser - the deployment's web UI, signed in as a disposable Admin; open the
            processed document; scroll to its sections and to Deployment Info.
      - label: Moving off genai-idp-terraform
        say: >-
          The separate genai-idp-terraform repository is now deprecated. The migrate
          command moves a deployment onto the built-in module in place. Its plan
          phase reads the old state and decides, for every resource, whether it is
          adopted, recreated or kept, so documents, configuration, users and
          passwords stay.
        do:
          - Terminal - idp-cli terraform migrate-from-genai-idp-terraform plan against
            the seeded upstream deployment; show the verdict table and the files it
            writes.
      - label: Every phase is a dry run first
        say: >-
          Each later phase is a dry run until we add apply, and the command refuses
          anything it cannot prove is safe. The migration guide walks through every
          step.
        do:
          - Terminal - migrate-from-genai-idp-terraform --help listing the phases in
            order.
    closing: >-
      Terraform support is experimental, and we want your feedback. If anything does
      not work, open an issue on GitHub and we will do our best to fix it quickly.
      From now on, every release ships for Terraform and CloudFormation at the same
      time. Start with the Terraform Deployment page in the documentation.
    takeaways:
      - Every release now ships for CloudFormation and Terraform at the same time
      - Use the published module in your own Terraform, or idp-cli deploy --terraform
      - --from-code builds and deploys your local clone the same way
      - Updates refuse to replace buckets, tables, user pools and keys unless you allow it
      - Migrate from genai-idp-terraform in place, and tell us what breaks on GitHub
    not_shown:
      - A full first apply (about half an hour); the published-module chapter stops at
        plan, and the idp-cli chapters run against an existing deployment
      - The migration phases after plan (check-retention through detach) — plan only,
        by choice; they are listed, not run
      - Headless and GovCloud module variants, --terraform-assume-role-arn, deleting
        a Terraform deployment
      - Feature-platform extensions, which still install as CloudFormation stacks
    docs: docs/terraform.md
    category: Command Line Interface (CLI)
    last_recorded:
      date: '2026-11-13'
      version: 0.6.15
