  getLatestPublishedVersion:
    groups: ANY
    kind: read
    enforced_in: src/lambda/version_check_resolver/index.py
    args: {}
    note: >-
      ANY is deliberate: the published release number, which is public
      information on GitHub, readable by every authenticated user so the UI can
      show an upgrade notice whatever the caller's role.
  listSampleDocuments:
    groups: [Admin, Author, Viewer]
    kind: read
    enforced_in: nested/api-resolvers/src/lambda/upload_resolver/index.py
    args: {}
