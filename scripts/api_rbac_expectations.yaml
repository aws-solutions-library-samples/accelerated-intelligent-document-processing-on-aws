# accepted risks — a regression now hard-FAILS the gate):
#   GAP-01 getStepFunctionExecution now requires the caller-supplied
#          executionArn to name this deployment's state machine, and enforces
#          allowedConfigVersions against the execution input's config_version.
#   GAP-03 listAvailableAgents / sendAgentChatMessage now carry a server-side
#          _caller_in_groups check (Admin/Author/Viewer; Reviewer excluded)
#          matching their schema directives — the exclusion is no longer
#          UI-only. (AppSync, which forbade cognito_groups + @aws_iam on one
#          field, has been removed, so the schema now declares the real groups.)
#   GAP-04 listUsers is now Admin-only (server-side check in user_management).
#   GAP-05 calculateCapacity now has a server-side group check matching its
#          schema directive (Admin/Author/Viewer; Reviewer excluded).
#   GAP-06 the three feature-platform ops now declare
#          @aws_cognito_user_pools(cognito_groups:["Admin"]) instead of the
#          silently-ignored @aws_auth / group-less directive.
#   GAP-07 the chat Function URL now verifies the caller's Cognito ID token
#          (x-idp-id-token header) on both routes, so the group checks, the
#          Chat-with-Document config-version scope and the session owner all
#          read verified claims; a request without a valid token is a 401.
