# ============================================================================
# API RBAC EXPECTATIONS — single source of truth for API authorization tests
# ============================================================================
#
# One entry per operation routable through the UI REST API dispatcher
# (POST /op/{field}). Consumed by:
#
#   * scripts/sdlc/scan_api_rbac.py   (static scan: make api-test-static)
#   * scripts/test_api_rbac.py        (dynamic tests: make api-test)
#
# The op universe is: FIELD_FUNCTION_MAP in nested/api-resolvers/template.yaml
# (SSM param /<stack>/http-api/field-function-map) UNION the dispatcher's
# ddb_direct._HANDLED set, plus FIELD_ALIASES. The static scan fails if this
# file and that universe drift apart, so ADD AN ENTRY HERE WHENEVER YOU ADD AN
# API OPERATION (and update nested/api-resolvers/src/api/schema.graphql).
#
# Entry schema
# ------------
#   groups:        [Admin, Author, ...]  groups the SERVER must enforce
#                  ANY       = any authenticated Cognito user
#                  IAM_ONLY  = backend/IAM principals only; every Cognito
#                              caller must be rejected (403)
#   kind:          read | mutation  (mutations are driven with bogus ids so an
#                  allowed caller fails benign validation, never mutates data)
#   enforced_in:   repo-relative source file that must contain the group check
#                  (or the ownership/scope logic for ANY ops). The static scan
#                  verifies an enforcement pattern exists in this file.
#   scope_checked: true  -> op takes a config version and must enforce the
#                  caller's allowedConfigVersions (UsersTable) — 403 when out
#                  of scope. Static scan requires 'allowedConfigVersions' (or
#                  allowed_config_versions) to appear in enforced_in.
#   scope_filtered: true -> op returns lists row-filtered by the caller's
#                  allowedConfigVersions / reviewer status instead of 403.
#   ownership:     true  -> ANY-auth op further scoped to caller's own records
#                  (chat sessions, agent jobs).
#   schema_groups: set only when the code INTENTIONALLY enforces different
#                  groups than the schema.graphql directive (documented drift).
#   conditional:   circuit_breaker | feature_platform — op is only routable
#                  when that stack feature is enabled; dynamic test skips on
#                  404-for-admin instead of failing.
#   args:          safe arguments for the dynamic test. Mutations use
#                  nonexistent ids (benign validation failure proves the call
#                  passed authorization).
#   skip_allowed:  true -> dynamic test exercises ONLY the denied cells
#                  (unauth + disallowed roles); the allowed-role call is
#                  skipped because it would do real work (start an LLM agent,
#                  create a session, ...). Denial coverage is unaffected.
#   known_gap:     GAP-NN — enforcement intentionally weaker than ideal or a
#                  tracked deficiency. Mismatches become WARN, not FAIL. Every
#                  id must exist in the known_gaps register at the bottom;
#                  also referenced from
#                  security/threat-modeling/feature-threats/rbac-authentication.md.
#   note:          free text for humans.
#
# Paths are relative to the repo root. DDB_DIRECT is shorthand for
# nested/api-resolvers/src/lambda/http_api_dispatcher/ddb_direct.py.

# YAML anchors for the two files that enforce many ops (*ddb / *cfg below).
anchors:
  ddb_direct: &ddb nested/api-resolvers/src/lambda/http_api_dispatcher/ddb_direct.py
  config_resolver: &cfg nested/api-resolvers/src/lambda/configuration_resolver/index.py

operations:
  # ==========================================================================
  # Documents — read (any authenticated user; row-level filtering only)
  # ==========================================================================
  getDocument:
    groups: ANY
    kind: read
    enforced_in: *ddb
    args: { ObjectKey: "__nonexistent__.pdf" }
  listDocuments:
    groups: ANY
    kind: read
    scope_filtered: true
    enforced_in: nested/api-resolvers/src/lambda/list_documents_gsi_resolver/index.py
    args: {}
  getDocumentCount:
    groups: ANY
    kind: read
    scope_filtered: true
    enforced_in: nested/api-resolvers/src/lambda/list_documents_gsi_resolver/index.py
    args: {}
  listDocumentsDateHour:
    groups: ANY
    kind: read
    enforced_in: *ddb
    args: {}
  listDocumentsDateShard:
    groups: ANY
    kind: read
    enforced_in: *ddb
    args: {}
  listDocumentsByDateRange:
    groups: ANY
    kind: read
    scope_filtered: true
    enforced_in: nested/api-resolvers/src/lambda/list_documents_range_resolver/index.py
    args:
      startDateTime: "2020-01-01T00:00:00Z"
      endDateTime: "2020-01-02T00:00:00Z"
  getFileContents:
    groups: ANY
    kind: read
    enforced_in: nested/api-resolvers/src/lambda/get_file_contents_resolver/index.py
    args: { s3Uri: "s3://__nonexistent-bucket__/x" }
    note: bucket allow-list enforced in resolver, not groups
  getFilePresignedUrl:
    groups: ANY
    kind: read
    alias_of: getFileContents
    enforced_in: nested/api-resolvers/src/lambda/get_file_contents_resolver/index.py
    args: { s3Uri: "s3://__nonexistent-bucket__/x" }
  getStepFunctionExecution:
    groups: ANY
    kind: read
    enforced_in: nested/api-resolvers/src/lambda/get_stepfunction_execution_resolver/index.py
    args: { executionArn: "arn:aws:states:us-east-1:000000000000:execution:x:y" }
    known_gap: GAP-01
  listDocumentVersions:
    groups: ANY
    kind: read
    enforced_in: nested/api-resolvers/src/lambda/document_versions_resolver/index.py
    args: { objectKey: "__nonexistent__.pdf" }
  getDocumentVersion:
    groups: ANY
    kind: read
    enforced_in: nested/api-resolvers/src/lambda/document_versions_resolver/index.py
    args: { objectKey: "__nonexistent__.pdf", runId: "__x__" }
  compareDocumentVersions:
    groups: ANY
    kind: read
    enforced_in: nested/api-resolvers/src/lambda/document_versions_resolver/index.py
    args: { objectKey: "__nonexistent__.pdf", runIdA: "__a__", runIdB: "__b__" }

  # ==========================================================================
  # Documents — mutations (Admin + Author)
  # ==========================================================================
  deleteDocument:
    groups: [Admin, Author]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/delete_document_resolver/index.py
    args: { objectKeys: ["__nope__"] }
  reprocessDocument:
    groups: [Admin, Author]
    kind: mutation
    scope_checked: true
    enforced_in: nested/api-resolvers/src/lambda/reprocess_document_resolver/index.py
    args: { objectKeys: ["__nope__"] }
  abortWorkflow:
    groups: [Admin, Author]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/abort_workflow_resolver/index.py
    args: { objectKeys: ["__nope__"] }
  copyToBaseline:
    groups: [Admin, Author]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/copy_to_baseline_resolver/index.py
    # schema: copyToBaseline(objectKey: String!) — single key, not a list
    args: { objectKey: "__nope__" }
  uploadDocument:
    groups: [Admin, Author]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/upload_resolver/index.py
    args: { fileName: "x.pdf" }
    note: presigned-URL generation only; nothing uploaded by the test
  uploadSampleDocument:
    groups: [Admin, Author]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/upload_resolver/index.py
    args: { sampleId: "__nope__" }
  deleteDocumentVersion:
    groups: [Admin]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/document_versions_resolver/index.py
    args: { objectKey: "__nonexistent__.pdf", runId: "__x__" }
    note: irreversible S3 version delete — stricter than deleteDocument

  # ==========================================================================
  # Configuration & pricing (configuration_resolver)
  # ==========================================================================
  getConfigVersions:
    groups: [Admin, Author, Viewer]
    kind: read
    scope_filtered: true
    enforced_in: *cfg
    args: {}
  getConfigVersion:
    # Annotator included deliberately: the annotate view needs the class list to
    # correct a misclassified section, and that correction's write side
    # (reextractTestSetDocument) already accepts Annotator. A caller with no group in
    # {Admin, Author, Viewer} receives ONLY the class names and descriptions — the
    # resolver reduces the payload via _class_vocabulary_only, so prompts, model ids
    # and every other setting stay out of reach of the lowest-privilege role. The
    # reduction is an allow-list, so a config key added later cannot leak by default.
    groups: [Admin, Author, Viewer, Annotator]
    kind: read
    scope_checked: true
    enforced_in: *cfg
    args: { versionName: "default" }
  updateConfiguration:
    groups: [Admin, Author]
    kind: mutation
    scope_checked: true
    enforced_in: *cfg
    # schema: updateConfiguration(versionName: String!, customConfig: AWSJSON!, description: String)
    args: { versionName: "__nope__", customConfig: "{}" }
    note: saveAsVersion/saveAsDefault flags are additionally Admin-only in-code
  setActiveVersion:
    groups: [Admin, Author]
    kind: mutation
    scope_checked: true
    enforced_in: *cfg
    args: { versionName: "__nope__" }
  generateRuleJson:
    groups: [Admin, Author]
    kind: mutation
    enforced_in: *cfg
    args: { ruleDescription: "" }
  deleteConfigVersion:
    groups: [Admin]
    kind: mutation
    scope_checked: true
    enforced_in: *cfg
    args: { versionName: "__nope__" }
  # Configuration Profile revisions. Scope is checked at the PROFILE for all
  # five: a revision is content inside a profile, never its own RBAC object.
  listConfigProfileRevisions:
    groups: [Admin, Author, Viewer]
    kind: read
    scope_checked: true
    enforced_in: *cfg
    args: { profileName: "default" }
  getConfigProfileRevision:
    groups: [Admin, Author, Viewer]
    kind: read
    scope_checked: true
    enforced_in: *cfg
    args: { profileName: "default", revision: 1 }
  restoreConfigProfileRevision:
    groups: [Admin, Author]
    kind: mutation
    scope_checked: true
    enforced_in: *cfg
    args: { profileName: "__nope__", revision: 1 }
  labelConfigProfileRevision:
    groups: [Admin, Author]
    kind: mutation
    scope_checked: true
    enforced_in: *cfg
    args: { profileName: "__nope__", revision: 1 }
  deleteConfigProfileRevision:
    groups: [Admin]
    kind: mutation
    scope_checked: true
    enforced_in: *cfg
    args: { profileName: "__nope__", revision: 1 }
  getPricing:
    groups: [Admin, Author, Viewer]
    kind: read
    enforced_in: *cfg
    args: {}
  updatePricing:
    groups: [Admin]
    kind: mutation
    enforced_in: *cfg
    # schema: updatePricing(pricingConfig: AWSJSON!)
    args: { pricingConfig: "{}" }
  restoreDefaultPricing:
    groups: [Admin]
    kind: mutation
    enforced_in: *cfg
    args: {}
  getModelConfigLimits:
    groups: [Admin, Author, Viewer]
    kind: read
    enforced_in: *cfg
    args: {}
  updateModelConfigLimits:
    groups: [Admin]
    kind: mutation
    enforced_in: *cfg
    args: { modelConfigLimits: "{}" }
  restoreDefaultModelConfigLimits:
    groups: [Admin]
    kind: mutation
    enforced_in: *cfg
    args: {}
  listConfigurationLibrary:
    groups: [Admin, Author, Viewer]
    kind: read
    enforced_in: *cfg
    args: { pattern: "default" }
  getConfigurationLibraryFile:
    groups: [Admin, Author, Viewer]
    kind: read
    enforced_in: *cfg
    args: { pattern: "default", configName: "__nope__", fileName: "__nope__" }
  syncBdaIdp:
    groups: [Admin, Author]
    kind: mutation
    scope_checked: true
    enforced_in: nested/api-resolvers/src/lambda/sync_bda_idp_resolver/index.py
    args: { direction: "__nope__" }

  # ==========================================================================
  # Discovery (Admin + Author)
  # ==========================================================================
  listDiscoveryJobs:
    groups: [Admin, Author]
    kind: read
    enforced_in: *ddb
    args: {}
  deleteDiscoveryJob:
    groups: [Admin, Author]
    kind: mutation
    enforced_in: *ddb
    args: { jobId: "__nope__" }
  updateDiscoveryJobStatus:
    groups: IAM_ONLY
    kind: mutation
    enforced_in: *ddb
    args: { jobId: "x", status: "QUEUED" }
  uploadDiscoveryDocument:
    groups: [Admin, Author]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/discovery_upload_resolver/index.py
    args: { fileName: "x.pdf", contentType: "application/pdf" }
  autoDetectSections:
    groups: [Admin, Author]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/discovery_upload_resolver/index.py
    args: { documentKey: "__nope__", bucket: "__nope__" }
  startMultiDocDiscovery:
    groups: [Admin, Author]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/discovery_upload_resolver/index.py
    args: { configVersion: "__nope__" }
  uploadMultiDocDiscoveryZip:
    groups: [Admin, Author]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/discovery_upload_resolver/index.py
    args: { fileName: "x.zip", fileSize: 1, configVersion: "__nope__" }

  # ==========================================================================
  # Test Studio (Admin + Author)
  # ==========================================================================
  startTestRun:
    groups: [Admin, Author]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/test_runner/index.py
    # schema: startTestRun(input: TestRunInput!) — wrapped input object
    args: { input: {} }
  sendTestRunToReview:
    groups: [Admin, Author]
    kind: mutation
    # Shares TestRunnerFunction with startTestRun; the resolver branches on
    # fieldName after the Admin/Author group check.
    enforced_in: nested/api-resolvers/src/lambda/test_runner/index.py
    args: { testRunId: "__nope__" }
  getTestRun:
    groups: [Admin, Author]
    kind: read
    enforced_in: nested/api-resolvers/src/lambda/test_results_resolver/index.py
    args: { testRunId: "__x__" }
  getTestRuns:
    groups: [Admin, Author]
    kind: read
    enforced_in: nested/api-resolvers/src/lambda/test_results_resolver/index.py
    args: {}
  getTestRunStatus:
    groups: [Admin, Author]
    kind: read
    enforced_in: nested/api-resolvers/src/lambda/test_results_resolver/index.py
    args: { testRunId: "__x__" }
  compareTestRuns:
    groups: [Admin, Author]
    kind: read
    enforced_in: nested/api-resolvers/src/lambda/test_results_resolver/index.py
    args: { testRunIds: ["__x__"] }
  deleteTests:
    groups: [Admin, Author]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/delete_tests/index.py
    # schema: deleteTests(testRunIds: [String!]!) — arg is testRunIds, not testIds
    args: { testRunIds: ["__x__"] }
  abortTestRuns:
    groups: [Admin, Author]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/abort_test_runs/index.py
    args: { testRunIds: ["__x__"] }
  getTestSets:
    groups: [Admin, Author]
    # kind stays `read` — it takes no arguments and returns a list, which is what the
    # driver needs to know. But it is not side-effect free: it repairs a stale
    # labelState and fails test sets whose owning job has disappeared, both of which
    # write to the tracking table. Running `make api-test` against a live stack can
    # therefore reap a genuinely abandoned test set. That is the intended behaviour, not
    # a test artefact, but it is worth knowing before pointing the harness at a stack
    # someone is using.
    kind: read
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    args: {}
  getTestSetDocuments:
    # Annotator reads its scoped queue's documents; the resolver additionally
    # enforces allowedTestSets per set.
    groups: [Admin, Author, Annotator]
    kind: read
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    args: { testSetId: "nonexistent-test-set" }
  getAnnotationQueue:
    groups: [Admin, Author, Annotator]
    kind: read
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    args: { testSetId: "nonexistent-test-set" }
  getTestSetVersions:
    groups: [Admin, Author]
    kind: read
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    args: { testSetId: "nonexistent-test-set" }
  getDraftLabelJob:
    # Annotator included: the ground-truth editor polls this for the outcome of the
    # re-extract it just started via reextractTestSetDocument, which annotators may
    # already run. Without it the job completed server-side while the UI reported
    # "Could not re-extract this document" — observed on a dev stack. Per-set scope
    # is asserted in the handler, so group membership alone does not expose another
    # set's jobs.
    groups: [Admin, Author, Annotator]
    kind: read
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    args: { testSetId: "nonexistent-test-set", jobId: "__nope__" }
  estimateReviewEffort:
    # Annotator reads it for their own queue's "what review is buying" panel; the
    # resolver additionally enforces allowedTestSets per set.
    groups: [Admin, Author, Annotator]
    kind: read
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    args: { testSetId: "nonexistent-test-set" }
  generateDraftLabels:
    groups: [Admin, Author]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    # schema: generateDraftLabels(input: GenerateDraftLabelsInput!)
    args: { input: {} }
  # Internally publishes version 1 of a never-published set (via
  # publish_test_set_version, bypassing that mutation's Admin/Author gate) so there
  # is a state to snapshot. Deliberate: an Annotator is the role that starts a
  # session. It does NOT set the set's active reference — that remains a
  # publishTestSetVersion decision — so the crossing creates a version and nothing
  # a future run depends on by default.
  openTestSetAnnotationDraft:
    # Annotator opens the version transition that annotating their own set commits to.
    # An annotator is the role that starts a session, so refusing this would make the
    # queue unusable for them. The resolver additionally enforces allowedTestSets per
    # set. Note this is the one annotation operation with a side effect on the *set*
    # rather than on a document: it snapshots the baselines being annotated away from,
    # which is what makes the version number refer to bytes.
    groups: [Admin, Author, Annotator]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    args: { input: { testSetId: "nonexistent-test-set" } }

  updateTestSetDocumentSections:
    # Annotator corrects a wrong packet split in their own set — the same kind of
    # annotation work as reextractTestSetDocument, and the correction most
    # often needed in practice. The resolver additionally enforces allowedTestSets per set,
    # and writes only the grouping and class: field values, labelSource and edit
    # history are preserved.
    groups: [Admin, Author, Annotator]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    args: { input: { testSetId: "nonexistent-test-set", objectKey: "__x__", sections: [] } }

  reextractTestSetDocument:
    # Annotator corrects a misclassified document in their own set; the resolver
    # additionally enforces allowedTestSets per set.
    groups: [Admin, Author, Annotator]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    args: { input: { testSetId: "nonexistent-test-set", objectKey: "__x__" } }
  resetTestSetLabels:
    # Admin-only: discards human-reviewed labels, so an Author who can otherwise
    # manage test sets cannot destroy the team's annotation work.
    groups: [Admin]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    args: { testSetId: "nonexistent-test-set" }
  clearDraftLabels:
    groups: [Admin, Author]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    args: { testSetId: "nonexistent-test-set" }
  publishTestSetVersion:
    groups: [Admin, Author]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    # schema: publishTestSetVersion(input: PublishTestSetVersionInput!)
    args: { input: {} }
  removeDocumentsFromTestSet:
    groups: [Admin, Author]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    args: { testSetId: "__nope__", fileNames: ["__nope__"] }
  addTestSet:
    groups: [Admin, Author]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    args: { name: "__nope__", filePattern: "x", bucketType: "input", fileCount: 0 }
  addTestSetFromUpload:
    groups: [Admin, Author]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    # schema: addTestSetFromUpload(input: TestSetUploadInput!)
    args: { input: {} }
  addDocumentsToTestSet:
    groups: [Admin, Author]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    args: { testSetId: "__nope__", filePattern: "x", bucketType: "input", fileCount: 0 }
  addDocumentsToTestSetFromUpload:
    groups: [Admin, Author]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    # schema: addDocumentsToTestSetFromUpload(input: TestSetDocumentsUploadInput!)
    args: { input: {} }
  updateTestSet:
    groups: [Admin, Author]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    # schema: updateTestSet(input: UpdateTestSetInput!)
    args: { input: {} }
  deleteTestSets:
    groups: [Admin, Author]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    args: { testSetIds: ["__nope__"] }
  listBucketFiles:
    groups: [Admin, Author]
    kind: read
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    args: { bucketType: "input", filePattern: "__nope__" }
  validateTestFileName:
    groups: [Admin, Author]
    kind: read
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    args: { fileName: "x.pdf" }

  # ==========================================================================
  # HITL review (Admin + Reviewer)
  # ==========================================================================
  updateDocumentSections:
    # Re-groups a document's pages without reprocessing it, so the extracted values
    # survive. Admin/Reviewer/Annotator matches completeSectionReview, the sibling that
    # edits a section's content — processChanges stays narrower because it destroys and
    # regenerates extraction data. Refused while the document is in flight.
    groups: [Admin, Reviewer, Annotator]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/process_changes_resolver/index.py
    args: { objectKey: "__nonexistent__.pdf", sections: [] }

  processChanges:
    groups: [Admin, Reviewer]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/process_changes_resolver/index.py
    args: { objectKey: "__x__", modifiedSections: [] }
  completeSectionReview:
    # Annotator annotates test-set ground truth; the resolver additionally
    # requires the document's test set to be in their allowedTestSets.
    groups: [Admin, Reviewer, Annotator]
    kind: mutation
    enforced_in: src/lambda/complete_section_review/index.py
    args: { objectKey: "__x__", sectionId: "1" }
  claimReview:
    # Annotator annotates test-set ground truth; the resolver additionally
    # requires the document's test set to be in their allowedTestSets.
    groups: [Admin, Reviewer, Annotator]
    kind: mutation
    enforced_in: src/lambda/complete_section_review/index.py
    args: { objectKey: "__x__" }
  releaseReview:
    # Annotator annotates test-set ground truth; the resolver additionally
    # requires the document's test set to be in their allowedTestSets.
    groups: [Admin, Reviewer, Annotator]
    kind: mutation
    enforced_in: src/lambda/complete_section_review/index.py
    args: { objectKey: "__x__" }
  skipAllSectionsReview:
    groups: [Admin, Reviewer]
    kind: mutation
    enforced_in: src/lambda/complete_section_review/index.py
    args: { objectKey: "__x__" }
    note: >-
      HITL review op. The handler gates on {Admin,Reviewer} both at the global
      gate (index.py:51) and the per-field check (index.py:72), matching the
      schema directive. Authorization is checked BEFORE objectKey is used, so an
      allowed role passing a bogus objectKey gets a benign 400 (doc-not-found),
      never a masked auth failure; a disallowed role (Viewer/Author) is rejected
      with Unauthorized regardless of the objectKey.

