# ============================================================================
# Known gaps register — tracked deviations between the ideal authorization
# posture and current enforcement. Each id must be referenced by at least one
# operation above, and is mirrored in
# security/threat-modeling/feature-threats/rbac-authentication.md (AUTH.T07/T08).
# A gap entry downgrades a scan/test mismatch from FAIL to WARN; remove the
# gap (and its references) when the enforcement is fixed, and the harness
# will then hold the line.
# ============================================================================
known_gaps:
  GAP-01:
    summary: getStepFunctionExecution has no group or ownership check
    detail: >
      Any authenticated user can fetch execution details for any execution ARN
      the resolver's IAM role can describe. Mitigated by the role being scoped
      to the stack's state machines; still exposes processing metadata to
      Reviewers/Viewers.
  GAP-02:
    summary: queryKnowledgeBase has no group check
    detail: >
      Any authenticated user (including Reviewer) can query the knowledge base
      when one is configured.
# GAP-03, GAP-04, GAP-05 and GAP-06 were RESOLVED (no longer accepted risks — a
# regression now hard-FAILS the gate):
#   GAP-03 listAvailableAgents / sendAgentChatMessage now carry a server-side
#          _caller_in_groups check (Admin/Author/Viewer; Reviewer excluded)
#          matching their schema directives — the exclusion is no longer
#          UI-only. (AppSync, which forbade cognito_groups + @aws_iam on one
#          field, has been removed, so the schema now declares the real groups.)
#   GAP-04 listUsers is now Admin-only (server-side check in user_management).
#   GAP-05 calculateCapacity now has a server-side group check matching its
#          schema directive (Admin/Author/Viewer; Reviewer excluded).
#   GAP-06 the three feature-platform ops now declare
#          @aws_cognito_user_pools(cognito_groups:["Admin"]) instead of the
#          silently-ignored @aws_auth / group-less directive.
# Their ids are retired; the ops' entries above carry a "Formerly GAP-0x" note.
