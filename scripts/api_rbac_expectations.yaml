  getSampleDocumentUrl:
    groups: [Admin, Author, Viewer]
    kind: read
    enforced_in: nested/api-resolvers/src/lambda/get_sample_document_resolver/index.py
    args: { s3Key: "__nope__" }

  # ==========================================================================
  # Circuit breaker (conditional on CircuitBreakerEnabled)
  # ==========================================================================
  getCircuitBreakerStatus:
    groups: ANY_GROUP
    kind: read
    enforced_in: *ddb
    args: {}
    note: >-
      served by ddb_direct when the breaker is disabled, resolver when enabled.
      ANY_GROUP because of `lastError`. One global singleton row, so there is
      nothing per-caller to scope, and the rest of the payload — enabled, state,
      timestamps, counters — is genuinely just the badge. But `lastError` has two
      writers, and the second is `f"Manual pause by {user}: {reason}"` in
      circuit_breaker_manager, where `user` is the pausing administrator's EMAIL
      (circuit_breaker_resolver sends `caller["email"]`). So after any manual pause
      this operation serves an administrator's address and an operator's free-text
      note. The floor costs nothing, and the reason is structural rather than a claim
      about who signs in: the badge has exactly one render site, the documents table
      header, and AuthRoutes returns the no-role notice IN PLACE OF the router for a
      session in no group, so no route mounts and the badge is never requested. A
      groupless user can still sign in; they just cannot reach it. The three controls
      that change the breaker stay Admin-only.
  pauseCircuitBreaker:
    groups: [Admin]
    kind: mutation
    conditional: circuit_breaker
    enforced_in: nested/api-resolvers/src/lambda/circuit_breaker_resolver/index.py
    args: { reason: "test" }
  resumeCircuitBreaker:
    groups: [Admin]
    kind: mutation
    conditional: circuit_breaker
    enforced_in: nested/api-resolvers/src/lambda/circuit_breaker_resolver/index.py
    args: { reason: "test" }
  probeCircuitBreaker:
    groups: [Admin]
    kind: mutation
    conditional: circuit_breaker
    enforced_in: nested/api-resolvers/src/lambda/circuit_breaker_resolver/index.py
    args: { reason: "test" }

  # ==========================================================================
  # Feature platform (conditional on EnableFeaturePlatform)
  # ==========================================================================
  # ANY is deliberate for all three, but they return three different things and the
  # note on each says what its own payload is. What they share is that none reads
  # cognito:groups, none scopes per caller, and none returns document data.
  # Installing, subscribing and launching a feature are Admin-only.
  #
  # Note what is NOT the reason: "the UI needs these before it knows the caller's
  # role" does not hold at all. use-user-role.ts reads cognito:groups straight off
  # the ID token with no API call, and the pre-token-generation trigger injects the
  # groups into the FIRST token rather than only the second, so the role is known
  # before any of these three is called. (The forced token refresh in that hook is a
  # fallback for a token that arrives without the claim anyway, not a window in which
  # the role is unknowable.) The reason is the payloads, per operation, below.
  listInstalledFeatures:
    groups: ANY
    kind: read
    conditional: feature_platform
    enforced_in: feature-platform/main-stack-extensions/lambdas/list_installed_features/index.py
    args: {}
    note: >-
      ANY is deliberate: the install inventory — feature id, display name,
      installed and latest version, whether an update is available, and where the
      feature's own UI bundle and API live. Nothing document-derived, nothing
      per-caller, and every role needs it to render the nav at all. It does
      disclose deployment topology (stack id, stack name, the feature API endpoint,
      a generation queue ARN) to any authenticated caller, which is reconnaissance
      value rather than data; that is the accepted cost, and it is the one thing on
      this entry a future reviewer might weigh differently.
  listCatalogFeatures:
    groups: ANY
    kind: read
    conditional: feature_platform
    enforced_in: feature-platform/main-stack-extensions/lambdas/list_catalog_features/index.py
    args: {}
    note: >-
      ANY is deliberate: the published catalog manifest — what optional features
      exist, their versions, descriptions, docs links, and the artifact bucket and
      prefix the published extension templates are fetched from. That is the
      feature-artifacts location, not a document bucket, and the manifest is the
      same for every caller.
  checkFeatureEntitlement:
    groups: ANY
    kind: read
    conditional: feature_platform
    enforced_in: feature-platform/main-stack-extensions/lambdas/check_feature_entitlement/index.py
    args: { featureId: "__nope__" }
    note: >-
      ANY is deliberate, and this one is not a catalog read: it answers whether
      THIS DEPLOYMENT is entitled to one feature, and the answer carries the
      deployment's own AWS Marketplace customer identifier, product code and
      license mode. Those are per-deployment billing identifiers, not per-caller
      and not document-derived: the answer is the same whoever asks, and the UI
      needs it for every role to decide whether to offer the feature at all.
  getFeatureLaunchUrl:
    groups: [Admin]
    kind: read
    conditional: feature_platform
    enforced_in: feature-platform/main-stack-extensions/lambdas/get_feature_launch_url/index.py
    args: { featureId: "__nope__" }
    note: schema directive now @aws_cognito_user_pools(cognito_groups:[Admin]),
      matching the resolver's Admin enforcement. Formerly GAP-06.
  subscribeFeature:
    groups: [Admin]
    kind: mutation
    conditional: feature_platform
    enforced_in: feature-platform/main-stack-extensions/lambdas/subscribe_feature/index.py
    args: { featureId: "__nope__" }
    note: schema directive switched from the silently-ignored @aws_auth to
      @aws_cognito_user_pools(cognito_groups:[Admin]). Formerly GAP-06.
  unsubscribeFeature:
    groups: [Admin]
    kind: mutation
    conditional: feature_platform
    enforced_in: feature-platform/main-stack-extensions/lambdas/unsubscribe_feature/index.py
    args: { featureId: "__nope__" }
    note: schema directive switched from the silently-ignored @aws_auth to
      @aws_cognito_user_pools(cognito_groups:[Admin]). Formerly GAP-06.

# ============================================================================
# Lambda Function URL endpoints — the OTHER way into the backend
# ============================================================================
#
# Chat streaming does not go through the REST dispatcher. The browser POSTs
# SigV4-signed requests straight to a Lambda Function URL whose FastAPI app
# calls the chat processors, so none of the checks above (Cognito authorizer,
# FIELD_FUNCTION_MAP, schema directives) apply to it. Declare every such
# endpoint and route here; scan_api_rbac.py checks S6-S9 against them.
#
# Entry schema
# ------------
#   <UrlLogicalId>:      an AWS::Lambda::Url resource in template.yaml
#     auth_type:         must equal the template's AuthType (NONE always fails)
#     handler:           repo-relative FastAPI app file; must be inside the
#                        target function's CodeUri
#     routes:            "<METHOD> <path>" -> route policy:
#       groups:          groups the SERVER must enforce, or ANY
#       ownership:       true -> scoped to the caller's own records
#       equivalent_op:   the operations: entry serving the same user action;
#                        the two must declare the same groups
#       enforced_in:     the processor this route invokes, which must carry the
#                        group check for a group-restricted route
#       transport_enforces:
#                        what this transport can ACTUALLY apply, declared only
#                        when it is weaker than `groups`. `groups` is the policy
#                        and must equal the equivalent_op's — one user action has
#                        one policy — so without this key the only way to keep
#                        S9's equivalent_op comparison quiet was to weaken the
#                        declared policy, and then the real divergence appeared
#                        nowhere. With it, S9 emits a finding naming the gap
#                        (WARN, FAIL under --strict) and requires a
#                        residual_gap/known_gap id, so the divergence is reported
#                        by the check that measures it rather than declared away.
#       known_gap:       GAP-NN, as for operations above — downgrades a
#                        mismatch on this route from FAIL to WARN
#       residual_gap:    GAP-NN listed in the register for auditability that
#                        does NOT downgrade anything: S6-S9 findings on the
#                        route stay hard FAILs. Use this for a limitation of
#                        the transport itself, so recording it cannot disarm
#                        the checks on the code.
#       note:            free text
#
# The key lists above are CLOSED, and the scanner enforces them (S6): an
# unrecognised key is a hard FAIL rather than being ignored. Every key here is
# read by name, so a misspelling makes the setting vanish silently — writing
# `residual_gapp:` was measured to leave the scan at 0 FAIL while removing GAP-07
# from this register. Adding a key means adding it to ENDPOINT_ENTRY_KEYS /
# ROUTE_POLICY_KEYS in scripts/sdlc/scan_api_rbac.py, which is a code change a
# reviewer sees.
#
# Routes needing no per-user authorization (health checks) are allowlisted in
# FUNCTION_URL_OPEN_ROUTES in the scanner, not here.
function_url_endpoints:
  ChatStreamProcessorUrl:
    auth_type: AWS_IAM
    handler: src/lambda/chat_stream_processor/app.py
    routes:
      POST /chat/document:
        groups: ANY_GROUP
        transport_enforces: ANY
        ownership: true
        equivalent_op: sendChatDocumentMessage
        enforced_in: src/lambda/chat_with_document_processor/index.py
        residual_gap: GAP-07
        note: >
          the same processor as the REST path, carrying the same
          allowedConfigVersions scope check, but that check does not apply to
          callers arriving this way: it resolves the caller from the verified
          claims an invoking transport supplies, and this one can supply none
          (GAP-07). The route forwards an explicit null identity, the processor
          stands the check down and logs that it did so per turn. On the
          dispatcher path the same code denies a turn whose scope cannot be
          evaluated for any reason. The ANY_GROUP floor its equivalent REST op
          carries is enforced by the dispatcher, which this transport does not go
          through, and cannot be re-applied here for the same reason: no
          cognito:groups claim arrives. So a caller in no group is refused on the
          REST route and is not refused here. Both halves close together when the
          endpoint verifies an ID token.
      POST /chat/agent:
        groups: [Admin, Author, Viewer]
        transport_enforces: ANY
        equivalent_op: sendAgentChatMessage
        enforced_in: src/lambda/agent_chat_processor/index.py
        residual_gap: GAP-07
        note: >
          the processor now carries the same Admin/Author/Viewer check as the
          agent_chat_resolver, and the route resolves the caller identity from
          the verified transport principal only. The group check is enforced for
          callers whose groups are known (the dispatcher path forwards them);
          this transport forwards no group claim at all, hence GAP-07.
          transport_enforces: ANY states that plainly — _caller_identity() in
          chat_stream_processor/app.py returns None unconditionally and
          _enforce_agent_chat_groups returns early on a null identity, so the
          declared three-group policy applies on neither half of this route. The
          span is wider than /chat/document's (three groups' worth of denial lost
          rather than the group-less caller's), which is why the key belongs on
          both rather than only on the route whose policy this branch changed.

# ============================================================================
# Known gaps register — tracked deviations between the ideal authorization
# posture and current enforcement. Each id must be referenced by at least one
# operation or route above (the scan enforces that in both directions).
#
# CORRECTION: this header previously claimed every id here "is mirrored in
# security/threat-modeling/feature-threats/rbac-authentication.md
# (AUTH.T07/T08)". That is not true and never was — `grep -rn GAP-02
# security/threat-modeling/` returns nothing. What IS true: GAP-07 is recorded
# under AUTH.T14 in that document, and the retired GAP-06 is referenced under
# AUTH.T08. GAP-02 (queryKnowledgeBase) is recorded only here and in the
# published scan snapshots under security/test-results/. Giving it a threat-model
# entry is a documentation follow-up, deliberately not done on this branch
# because rbac-authentication.md is being edited concurrently.
#
# A gap entry downgrades a scan/test mismatch from FAIL to WARN; remove the
# gap (and its references) when the enforcement is fixed, and the harness
# will then hold the line.
# ============================================================================
known_gaps:
  GAP-SEC-INCONCLUSIVE-5XX:
    # Assigned by the DYNAMIC harness from the observed response, not declared on
    # an operation — so the orphan check in the static scanner (S0) verifies the
    # reference HERE instead, and fails if this file stops mentioning the id.
    assigned_by: scripts/test_api_rbac.py
    summary: >
      a 5xx makes a matrix cell INCONCLUSIVE, and 5xx is common because ~50
      resolver-level validation refusals raise a bare Exception
    detail: >
      An authorization check establishes that a caller was refused. A 5xx
      establishes nothing: whether the resolver refused this caller before or
      after doing the work is exactly what is unknown. classify() therefore
      records a 5xx as ERROR rather than as a pass — the published 0.6.9
      snapshot contains 43 cells reading "500 OK" beneath a header claiming the
      gate passed, because the positive arms asserted only "not denied".
      It is registered here rather than left as a hard failure because the cause
      is a known backlog and not a regression: the dispatcher chooses an HTTP
      status from the resolver exception's class name, and roughly 50 validation
      refusals across the resolvers (test_set_resolver alone has ~40) raise a
      bare `Exception`, which can only map to 500 `InternalError`. This harness
      deliberately sends bogus arguments to prove auth ran before the argument
      was used, so it lands on many of them.
      Closing it means giving those refusals a `ValueError` so they become 400
      `BadRequest`. Until then these are WARN: visible, counted separately, and
      never counted as passes. Everything else inconclusive — a timeout, a dead
      connection, an unreadable body — is a HARD failure, because none of those
      is a known condition of this deployment.
  GAP-02:
    summary: queryKnowledgeBase has no group check
    detail: >
      Any authenticated user (including Reviewer) can query the knowledge base
      when one is configured.
  GAP-07:
    summary: >
      the chat Function URL transport carries no Cognito group claim, so
      neither chat route's group check can be applied to callers arriving
      that way
    detail: >
      POST /chat/agent on ChatStreamProcessorUrl is authenticated by IAM
      (SigV4 with the authenticated Cognito Identity Pool role), which proves
      the caller is a signed-in user of this deployment but says nothing about
      their group. Lambda Function URLs do not forward the Cognito identity:
      requestContext.authorizer.iam.cognitoIdentity is documented as unused
      ("Lambda sets this to null or excludes this from the JSON"), and an
      assumed-role ARN has no cognito:groups claim. The processor's
      Admin/Author/Viewer check therefore applies to invocations that carry
      known groups (the dispatcher path forwards them) and stands down on this
      transport, exactly as it does for IAM-authorized backend invocations.
      Closing it means the browser presenting its Cognito ID token to this
      endpoint in addition to signing the request, and the endpoint verifying
      that token — a change to the transport's auth contract (UI, template and
      a JWKS verification dependency) that cannot be validated without a
      deployment. _caller_identity() in
      src/lambda/chat_stream_processor/app.py is where the claims are obtained;
      _enforce_groups_or_403() beside it is what turns them into a 403, and it
      already runs synchronously in the route so closing this gap needs no
      second change on that path.

      On /chat/agent the practical exposure is limited to the Reviewer group,
      the only signed-in role excluded from agent chat. On /chat/document the
      population is different and is not a group at all: that route's declared
      floor is ANY_GROUP, so what this transport fails to refuse is a caller in
      NO group — the user a domain-scoped self-signup produces
      (AllowedSignUpEmailDomain, AUTH.T04). Such a caller is refused
      sendChatDocumentMessage on the REST route and is not refused
      POST /chat/document here.

      SCOPE — what the Reviewer sentence does and does not cover. "Limited to
      the Reviewer group" is true of the AGENT-CHAT GROUP CHECK on this transport
      specifically: Admin, Author and Viewer are all allowed the operation, so
      the only group whose denial is lost is Reviewer, and a Reviewer reaching
      /chat/agent is still an authenticated user of this deployment. The residual
      is wider than that one check, though: NEITHER streaming route obtains a
      per-user identity from the transport. That also leaves the
      allowedConfigVersions scope lookup in
      src/lambda/chat_with_document_processor/index.py
      (_allowed_config_versions_for_event) with no verified subject to resolve,
      so Chat-with-Document turns arriving on this transport are NOT restricted
      by allowedConfigVersions. The route forwards an explicit null identity,
      which is the same signal an IAM-authorized backend invocation carries, and
      the processor stands the check down and logs that it did so on every turn
      rather than appearing to have consulted the UsersTable. Enforcing the check
      against the request body's self-asserted identity instead would not be a
      control: the caller it would restrict is the same caller that chooses the
      value. Both halves close together when the endpoint verifies an ID token —
      at which point _caller_identity() returning real claims (which must include
      `email`, the only identifier that joins to a UsersTable row) turns both on
      with no further change on this path.

      RESIDUAL — the transport principal's session name is undocumented. The
      identity resolution in src/lambda/chat_stream_processor/sse.py has to
      recognise the assumed-role session name Cognito chooses, and AWS documents
      no RoleSessionName for the Identity Pool enhanced flow. The value is
      MEASURED, not documented: 499 CloudTrail AssumeRoleWithWebIdentity events
      across three identity pools and three roles all carry
      "CognitoIdentityCredentials", with zero counter-examples, and the call is
      made by an AWS-internal principal so a client cannot influence it. There is
      no compatibility commitment on that string. The code is written so an
      unrecognised future value degrades safely — is_user_specific_identity() is
      a POSITIVE shape test (Cognito sub, or <region>:<uuid> identity id), so an
      unknown value falls through to the body-supplied fallback rather than
      refusing every request — but a change to a genuinely per-user session name
      would silently shift attribution from the body value to the transport one.
      This is accepted rather than fixed because the only durable fix is the same
      ID-token verification that closes the gap itself.

      PARTITION — this transport exists in the commercial partition only. On
      GovCloud the UI falls back to the REST dispatcher plus polling
      (src/ui/src/components/chat-panel/ChatPanel.tsx), which is the dispatcher
      path and
      carries the group claim, so this gap does not apply there.
# GAP-01, GAP-03, GAP-04, GAP-05 and GAP-06 were RESOLVED (no longer accepted
# risks — a regression now hard-FAILS the gate):
#   GAP-01 getStepFunctionExecution now requires the caller-supplied
#          executionArn to name this deployment's state machine, and enforces
#          allowedConfigVersions against the execution input's config_version.
#   GAP-03 listAvailableAgents / sendAgentChatMessage now carry a server-side
#          _caller_in_groups check (Admin/Author/Viewer; Reviewer excluded)
#          matching their schema directives — the exclusion is no longer
#          UI-only. (AppSync, which forbade cognito_groups + @aws_iam on one
#          field, has been removed, so the schema now declares the real groups.)
#   GAP-04 listUsers is now Admin-only (server-side check in user_management).
#   GAP-05 calculateCapacity now has a server-side group check matching its
#          schema directive (Admin/Author/Viewer; Reviewer excluded).
#   GAP-06 the three feature-platform ops now declare
#          @aws_cognito_user_pools(cognito_groups:["Admin"]) instead of the
#          silently-ignored @aws_auth / group-less directive.
# Their ids are retired; the ops' entries above carry a "Formerly GAP-0x" note.
