# ============================================================================
# API RBAC EXPECTATIONS — single source of truth for API authorization tests
# ============================================================================
#
# One entry per operation routable through the UI REST API dispatcher
# (POST /op/{field}). Consumed by:
#
#   * scripts/sdlc/scan_api_rbac.py   (static scan: make api-test-static)
#   * scripts/test_api_rbac.py        (dynamic tests: make api-test)
#
# The op universe is: FIELD_FUNCTION_MAP in nested/api-resolvers/template.yaml
# (SSM param /<stack>/http-api/field-function-map) UNION the dispatcher's
# ddb_direct._HANDLED set, plus FIELD_ALIASES. The static scan fails if this
# file and that universe drift apart, so ADD AN ENTRY HERE WHENEVER YOU ADD AN
# API OPERATION (and update nested/api-resolvers/src/api/schema.graphql).
#
# Entry schema
# ------------
#   groups:        [Admin, Author, ...]  groups the SERVER must enforce
#                  ANY       = any authenticated Cognito user, whether or not an
#                              administrator has placed them in any group
#                  ANY_GROUP = authenticated AND holding at least one of the
#                              groups this stack creates. Resolved at build time
#                              into the concrete list of
#                              AWS::Cognito::UserPoolGroup names in
#                              template.yaml, so a group added there joins the
#                              set without editing any operation here.
#                  IAM_ONLY  = backend/IAM principals only; every Cognito
#                              caller must be rejected (403)
#
#                  ANY vs ANY_GROUP is the distinction that matters when
#                  AllowedSignUpEmailDomain is set: template.yaml then sets
#                  AllowAdminCreateUserOnly: false, so a user can self-register
#                  and holds a valid token with an EMPTY cognito:groups claim.
#                  That caller satisfies ANY and satisfies nothing else, so ANY
#                  is "anyone with an address at the permitted domain", not
#                  "anyone an administrator onboarded". Every ANY entry below
#                  says why ANY is the intended answer for it; an undecided ANY
#                  and a decided one would otherwise be indistinguishable.
#                  An unrecognised policy string is a hard error in both
#                  generate_api_rbac_manifest.py and scan_api_rbac.py (check
#                  S0), never a permissive default.
#   kind:          read | mutation  (mutations are driven with bogus ids so an
#                  allowed caller fails benign validation, never mutates data)
#   enforced_in:   repo-relative source file that must contain the group check
#                  (or the ownership/scope logic for ANY ops). The static scan
#                  verifies an enforcement pattern exists in this file.
#   scope_checked: true  -> op takes a config version and must enforce the
#                  caller's allowedConfigVersions (UsersTable) — 403 when out
#                  of scope. Static scan requires 'allowedConfigVersions' (or
#                  allowed_config_versions) to appear in enforced_in.
#   scope_filtered: true -> op returns lists row-filtered by the caller's
#                  allowedConfigVersions / reviewer status instead of 403. Static
#                  scan (S4-per-item) also requires the code this op reaches,
#                  following calls into idp_common, to call a recognised per-item
#                  scope predicate inside an iteration over its results (see
#                  SCOPE_ITEM_PREDICATES in scan_api_rbac.py). scope_enforced_in
#                  does not change where that search starts: it starts at the
#                  op's own dispatch.
#   document_scope_checked: true -> op names a document, key or prefix AND a
#                  profile, and checks the object against the caller's profile
#                  scope through the profile the object is recorded or mapped
#                  under. S10 requires a DOCUMENT_SCOPE_PATTERNS entry point in
#                  the code the op reaches.
#   testset_checked: true -> op names a test-set document (objectKey) and confines
#                  the caller with the test-set scope (allowedTestSets) rather than
#                  the profile scope. Static scan (S10) requires the code this op
#                  reaches to call assert_can_access_test_set (or the resolver's
#                  _assert_set_access wrapper over it).
#
#                  S10 is the other direction of S4: an op whose arguments
#                  (schema.graphql, input types included, plus `args:` below) name
#                  a configuration profile, a stored object or a session — decided
#                  by the words of the argument's name (SCOPE_KEYED_WORDS in
#                  scan_api_rbac.py), not a list of spellings — must declare how
#                  that object is scoped:
#                  scope_checked/scope_filtered for a profile; those,
#                  document_scope_checked, testset_checked or ownership for a
#                  document; ownership or scope_checked for a
#                  session. On an op naming both a profile and a document,
#                  scope_checked answers for the profile only. An op callable only
#                  by Admin or IAM needs none, since neither carries a profile scope.
#                  Otherwise the op needs a known_gap, or a per-op entry in
#                  SCOPE_KEYED_ARGUMENT_EXEMPT (scan_api_rbac.py), registered in
#                  scripts/tests/gate_exemptions.json.
#   scope_enforced_in: OPTIONAL function name, for a scope_checked/scope_filtered
#                  op whose module has no dispatch S4 can find on the op's name.
#                  S4 reads only the code THIS op can reach — its dispatch branch
#                  plus the module-level functions that branch calls — because
#                  grepping the whole file let `getDocumentCount` declare
#                  `scope_filtered: true` while enforcing nothing, satisfied by
#                  `listDocuments` in the same module. S4 FAILs (rather than
#                  passing quietly) when the entry point cannot be determined and
#                  the file serves more than one declared op.
#   ownership:     true  -> ANY-auth op further scoped to caller's own records
#                  (chat sessions, agent jobs).
#   schema_groups: set only when the code INTENTIONALLY enforces different
#                  groups than the schema.graphql directive (documented drift).
#   conditional:   circuit_breaker | feature_platform | mcp — op is only routable
#                  when that stack feature is enabled; dynamic test skips on
#                  404-for-admin instead of failing.
#   args:          safe arguments for the dynamic test. Mutations use
#                  nonexistent ids (benign validation failure proves the call
#                  passed authorization). An op whose authorization depends on
#                  the referenced object existing (getStepFunctionExecution)
#                  has its args replaced at run time by apply_dynamic_args in
#                  scripts/test_api_rbac.py.
#   object_scoped_roles: [Annotator, ...] — roles the FIELD-level policy admits
#                  and a PER-OBJECT control in the resolver refuses for the args
#                  above. The dynamic matrix then asserts a refusal that is NOT
#                  attributed to the group floor (authzControl != api-group-floor),
#                  which is two assertions in one cell: the floor still admits the
#                  role, AND the per-object control still refuses an object outside
#                  the caller's scope.
#                  ⚠️ The cell needs the authzControl label (#1308), so against a
#                  stack deployed before that field existed it records "could not be
#                  run" — blocking, and not a pass — rather than a verdict it has no
#                  way to reach. Redeploy to evaluate it.
#                  Every role named here must appear in
#                  `groups:` — scripts/test_api_rbac.py exits non-zero otherwise,
#                  because on a role the policy EXCLUDES the cell would assert the
#                  opposite of the floor's job.
#                  Use it only where the ordinary remedy is unavailable. Normally an
#                  allowed role refused by a per-object control is a cell that did
#                  not measure the group check (scored ERROR, see issue #1308), and
#                  the fix is to give the operation an argument that control admits.
#                  The three review mutations have no such argument: the control
#                  reads the named document's TestSetId from the tracking table, so
#                  the only admitting argument is a real document in a real test
#                  set, which the matrix would then have Admin and Reviewer perform
#                  a real review mutation against.
#   skip_allowed:  true -> dynamic test exercises ONLY the denied cells
#                  (unauth + disallowed roles); the allowed-role call is
#                  skipped because it would do real work (start an LLM agent,
#                  create a session, ...). Denial coverage is unaffected.
#   known_gap:     GAP-NN — enforcement intentionally weaker than ideal or a
#                  tracked deficiency. Mismatches become WARN, not FAIL. Every
#                  id must exist in the known_gaps register at the bottom;
#                  also referenced from
#                  security/threat-modeling/feature-threats/rbac-authentication.md.
#   note:          free text for humans.
#
# Paths are relative to the repo root. DDB_DIRECT is shorthand for
# nested/api-resolvers/src/lambda/http_api_dispatcher/ddb_direct.py.

# YAML anchors for the two files that enforce many ops (*ddb / *cfg below).
anchors:
  ddb_direct: &ddb nested/api-resolvers/src/lambda/http_api_dispatcher/ddb_direct.py
  config_resolver: &cfg nested/api-resolvers/src/lambda/configuration_resolver/index.py
  inbox_resolver: &inbox nested/api-resolvers/src/lambda/notifications_resolver/index.py
  review_queues_resolver: &rq nested/api-resolvers/src/lambda/review_queues_resolver/index.py

operations:
  # ==========================================================================
  # Documents — read
  # ==========================================================================
  # Document CONTENT, and the means of obtaining it, requires an assigned group
  # (ANY_GROUP): a self-registered user in no group is refused. Every operation in
  # this section carries that floor, because the means of obtaining content is not
  # only the operations that return it — an object key, an `s3://` URI, a state
  # machine execution ARN and a prose description of what a document contains are
  # each a step of the same chain, and #1033 measured that chain composing end to
  # end for a caller in no group. The payload these return is the sensitive thing
  # the whole system exists to process, and the narrowing they do carry — reviewer
  # row filtering, allowedConfigVersions, get_file_contents_resolver's bucket
  # allow-list — bounds WHICH objects are reachable, not WHO may ask. Two of those
  # three also stand down for a self-registered caller specifically: a caller in no
  # group is not a Reviewer, and a caller no UsersTable row matches is unrestricted
  # on the config-version axis. Group membership is still the wrong axis for
  # per-document privacy; a Viewer may read any document a Viewer can see. That
  # is a separate question, tracked in the notes on issue #979 rather than
  # settled by this declaration.
  getDocument:
    groups: ANY_GROUP
    kind: read
    scope_checked: true
    scope_enforced_in: _get_document
    enforced_in: *ddb
    args: { ObjectKey: "__nonexistent__.pdf" }
  listDocuments:
    groups: ANY_GROUP
    kind: read
    scope_filtered: true
    enforced_in: nested/api-resolvers/src/lambda/list_documents_gsi_resolver/index.py
    args: {}
  getDocumentCount:
    groups: ANY_GROUP
    kind: read
    scope_filtered: true
    enforced_in: nested/api-resolvers/src/lambda/list_documents_gsi_resolver/index.py
    args: {}
    note: >-
      The header figure beside listDocuments, which is ANY_GROUP, and it carries
      the same two filters (config-version scope, reviewer-only) from the same
      helpers. Neither filter narrows anything for a caller in no group, so they
      cannot carry the policy on their own: _is_reviewer_only requires "Reviewer"
      among the caller's groups, and resolve_allowed_config_versions returns None —
      unrestricted, deliberately — for a caller no UsersTable row matches, which is
      what self-service sign-up produces. A count is data, and the one a groupless
      caller receives is the deployment's whole tally. ANY_GROUP, matching the list
      it is the header for.
  listDocumentsDateHour:
    groups: ANY_GROUP
    kind: read
    scope_checked: true
    scope_enforced_in: _refuse_scoped_date_partition_read
    enforced_in: *ddb
    args: {}
    note: >-
      ANY_GROUP. It returns raw TrackingTable index rows for one date and hour,
      each carrying ObjectKey, with no filter of any kind applied — so it is a
      source of document keys rather than a volume-and-timing summary, and it is
      the pairing with listDocuments (ANY_GROUP) that decides it. The web UI does
      not call this operation: the timeline pages through listDocuments and
      listDocumentsByDateRange, so the floor costs the UI nothing.
  listDocumentsDateShard:
    groups: ANY_GROUP
    kind: read
    scope_checked: true
    scope_enforced_in: _refuse_scoped_date_partition_read
    enforced_in: *ddb
    args: {}
    note: >-
      ANY_GROUP. Same unfiltered TrackingTable index rows carrying ObjectKey as
      listDocumentsDateHour, for a four-hour shard instead of an hour. This is the
      operation the #1033 chain was measured against: on a live stack a
      self-registered caller in no group got 200 and a document's object key and
      queued time from it, so a caller needs no prior knowledge of the deployment
      to obtain a key. Not called by the web UI.
  listDocumentsByDateRange:
    groups: ANY_GROUP
    kind: read
    scope_filtered: true
    enforced_in: nested/api-resolvers/src/lambda/list_documents_range_resolver/index.py
    args:
      startDateTime: "2020-01-01T00:00:00Z"
      endDateTime: "2020-01-02T00:00:00Z"
  getFileContents:
    groups: ANY_GROUP
    kind: read
    scope_checked: true
    # `_parse_and_validate_one` is the one function ALL THREE fields call before
    # touching S3, and it is where every authorization check lives — the bucket
    # allow-list, the per-user key scope and the per-document scope. Named
    # explicitly because this module dispatches on the two presign field names
    # only — `getFileContents` is the default branch, so S4 can find no `if` test
    # on its name and would otherwise fall back to module scope, which is what it
    # stopped doing on purpose.
    scope_enforced_in: _parse_and_validate_one
    enforced_in: nested/api-resolvers/src/lambda/get_file_contents_resolver/index.py
    args: { s3Uri: "s3://__resolved-at-runtime__/__sectest-nonexistent-key__.json" }
    note: >-
      Two controls, both in the resolver rather than in groups. The BUCKET
      allow-list stops the operation being a generic S3-read gadget; before
      ANY_GROUP it was the only thing between an authenticated caller and any
      object in a permitted bucket, and the group floor removed the groupless
      caller only. The KEY scope is the per-user half: two allow-listed buckets
      are partitioned per user — the Configuration bucket by configuration
      profile (`config_revisions/<profile>/`) and the Test Set bucket by test set
      (`<test_set_id>/`) — so `key_scope` applies the caller's
      allowedConfigVersions / allowedTestSets to the key, fail-closed, before any
      S3 call. A bucket-only check was the negation of both axes for exactly the
      callers they restrict. Per-DOCUMENT scope on the Input and Output buckets
      is the third control, in `document_scope`: the owning document is found on
      the tracking table from the key and its `ConfigVersion` matched against the
      caller's allowedConfigVersions, fail-closed on an unidentifiable document
      and on an unstamped one. It narrows a SCOPED caller only — a caller whose
      row sets no allowedConfigVersions is deliberately unrestricted, the same
      answer listDocuments gives — so the cross-document read is closed for
      scoped callers and bounded by the group floor for everyone else (UI.T06,
      #1033).
      ⚠️ The matrix cannot assert that third control and must not be made to try.
      Every principal it drives is unscoped, so `assert_document_in_scope` is a
      no-op for all of them and the substituted nonexistent key never reaches it;
      `object_scoped_roles:` declares a ROLE a per-object control refuses, and this
      axis is allowedConfigVersions rather than a group, so declaring it here
      would score a cell that was correctly NOT refused as a failure. The live
      assertion is `run_document_bytes_scope_suite` in scripts/test_api_rbac.py,
      driven as the seeded ScopedAuthor against a real document, and it requires
      the refusal to carry `authzControl: "resource"` — which is why the three
      per-object refusals in `document_scope` raise `ResourceAccessDenied` (#1478).
      The `args` bucket is REPLACED by apply_dynamic_args() with this
      deployment's own input bucket, because the matrix measures the GROUP floor
      and an out-of-allow-list bucket is refused to every caller by the
      allow-list instead — which the matrix would read as the allowed roles
      being wrongly denied. An in-allow-list bucket with a key that does not
      exist gives an allowed role a clean 400 (auth passed, argument bogus) and
      a disallowed role the dispatcher's 403. The input bucket is also
      deliberately NOT one of the two scoped buckets, so the substitution does
      not turn a group-floor measurement into a scope measurement. Both the
      allow-list refusal and the out-of-scope-key refusal are 403s asserted
      offline, where the buckets and keys are knowable:
      get_file_contents_resolver/test_index.py and
      get_file_contents_resolver/test_key_scope.py.
      ⚠️ `groups: ANY_GROUP` UNDERSTATES what this operation refuses for
      Test-Set-bucket keys. The test-set axis is enforced with the canonical
      `assert_can_access_test_set`, whose rule is Admin/Author unscoped, an
      Annotator restricted to their `allowedTestSets`, and **every other role
      refused outright** — so a Viewer or Reviewer is denied any
      `<test_set_id>/…` key even though they hold a group. That is deliberate and
      consistent rather than stricter than the rest: `getTestSetDocuments` is
      `[Admin, Author, Annotator]`, so no other role has a route to discover such
      a key, and serving the bytes to them would be the only one they had. It is
      recorded here because the declared policy is a per-FIELD group floor and
      cannot express a per-key role rule, so the manifest is not the place a
      reader would learn it. The live matrix does not exercise it either: its
      `args` bucket is substituted with the input bucket, which no axis
      partitions.
  getFilePresignedUrl:
    groups: ANY_GROUP
    kind: read
    alias_of: getFileContents
    scope_checked: true
    # Same choke point as getFileContents, and named for the same reason: this
    # field DOES have a dispatch branch, but pinning the entry point makes the
    # three fields verifiably identical rather than identical by coincidence of
    # call graph.
    scope_enforced_in: _parse_and_validate_one
    enforced_in: nested/api-resolvers/src/lambda/get_file_contents_resolver/index.py
    args: { s3Uri: "s3://__resolved-at-runtime__/__sectest-nonexistent-key__.json" }
    note: >-
      capability-issuing: the returned URL carries its own authorization for the
      lifetime of the signature, so it is the operation least able to rely on a
      later check. That is why every authorization check is in the shared
      `_parse_and_validate_one` rather than in any handler — a check this field
      could be added without is one that will eventually be missing from it. Same
      runtime bucket substitution as getFileContents, and the same per-document
      scope check — see its note.
  getFilePresignedUrls:
    groups: ANY_GROUP
    kind: read
    alias_of: getFileContents
    scope_checked: true
    # The same choke point as the two single-object fields, which is the point of
    # naming it: a batch field that validated once outside its loop and signed the
    # rest would satisfy a reference check, so the entry point is pinned to the
    # function every entry goes through individually.
    scope_enforced_in: _parse_and_validate_one
    enforced_in: nested/api-resolvers/src/lambda/get_file_contents_resolver/index.py
    args:
      files:
        - s3Uri: "s3://__resolved-at-runtime__/__sectest-nonexistent-key__.json"
    note: >-
      The batch form of getFilePresignedUrl, and capability-issuing for the same
      reason: it returns URLs that carry their own authorization for the lifetime
      of the signature. Every entry goes through `_parse_and_validate_one`
      individually — bucket allow-list, key scope, document scope — and all of
      them are authorized BEFORE the first URL is minted, so no partial result
      exists. A refusal fails the WHOLE request rather than being reported per
      entry: a per-entry refusal would turn one call into an N-key authorization
      oracle, telling the caller key by key which documents are in their scope.
      The list is capped server-side (MAX_BATCH_OBJECTS) and refused rather than
      truncated past the cap, because the argument is caller-supplied and an
      uncapped list amplifies one API call into an arbitrary number of signings,
      tracking-table reads and response bytes. The number of distinct documents
      one call may look up is bounded separately and more tightly
      (document_scope.MAX_DOCUMENT_LOOKUP_BATCHES), since those are DynamoDB reads.
      Same runtime bucket substitution as getFileContents: apply_dynamic_args()
      replaces the placeholder bucket inside the `files` list.
  getStepFunctionExecution:
    groups: ANY_GROUP
    kind: read
    scope_checked: true
    enforced_in: nested/api-resolvers/src/lambda/get_stepfunction_execution_resolver/index.py
    args: { executionArn: "arn:aws:states:us-east-1:000000000000:execution:x:y" }
    note: >-
      Caller-supplied executionArn. The resolver requires it to name this
      deployment's state machine (STATE_MACHINE_ARN) before calling Step
      Functions, then enforces the caller's allowedConfigVersions against the
      config_version in the execution input. Formerly GAP-01. The args here are
      a placeholder the resolver correctly refuses; the dynamic harness replaces
      them with a live execution ARN read from listDocuments (see
      apply_dynamic_args in scripts/test_api_rbac.py) and SKIPs the op when the
      stack has processed no documents.

      ANY_GROUP. The two per-object checks are real but neither binds a
      self-registered caller: the ARN arm only asks that the execution be this
      deployment's own, and resolve_allowed_config_versions returns None —
      unrestricted — for a caller no UsersTable row matches, so the config-version
      arm stands down for exactly the population the floor is about. Measured on a
      live stack (#1033), a caller in no group passed both and received 317,614
      bytes: the execution input and the step history, which name the document and
      the S3 location of its full state.
  listDocumentVersions:
    groups: ANY_GROUP
    kind: read
    scope_checked: true
    scope_enforced_in: handler
    enforced_in: nested/api-resolvers/src/lambda/document_versions_resolver/index.py
    args: { objectKey: "__nonexistent__.pdf" }
    note: >-
      ANY_GROUP. It shapes every run of one object key through the same
      _shape_version helper as getDocumentVersion (ANY_GROUP), so for EVERY run it
      returns what getDocumentVersion returns for one, less a single field:
      getDocumentVersion adds the run manifest's file list (version["Files"]).
      The asymmetry therefore runs in the direction that argues for the floor —
      more runs, one fewer field. The shared fields are Sections[].OutputJSONUri,
      Pages[].ImageUri / TextUri / OcrPageDataUri, the whole
      ConfidenceThresholdAlerts list — which names every extracted attribute — and
      Pages[].ClassReason, model-generated prose about what the document contains.
      Measured on a live stack (#1033), a caller in no group received 17,527 bytes
      in which ClassReason named "employee personal information (name, address,
      Social Security Number), pay period dates". The object key is not prior
      knowledge either: listDocumentsDateShard hands one over.
  getDocumentVersion:
    groups: ANY_GROUP
    kind: read
    scope_checked: true
    scope_enforced_in: handler
    enforced_in: nested/api-resolvers/src/lambda/document_versions_resolver/index.py
    args: { objectKey: "__nonexistent__.pdf", runId: "__x__" }
  compareDocumentVersions:
    groups: ANY_GROUP
    kind: read
    scope_checked: true
    scope_enforced_in: handler
    enforced_in: nested/api-resolvers/src/lambda/document_versions_resolver/index.py
    args: { objectKey: "__nonexistent__.pdf", runIdA: "__a__", runIdB: "__b__" }

  # ==========================================================================
  # Documents — mutations (Admin + Author)
  # ==========================================================================
  deleteDocument:
    groups: [Admin, Author]
    kind: mutation
    scope_checked: true
    enforced_in: nested/api-resolvers/src/lambda/delete_document_resolver/index.py
    args: { objectKeys: ["__nope__"] }
  reprocessDocument:
    groups: [Admin, Author]
    kind: mutation
    document_scope_checked: true
    scope_checked: true
    enforced_in: nested/api-resolvers/src/lambda/reprocess_document_resolver/index.py
    args: { objectKeys: ["__nope__"] }
  abortWorkflow:
    groups: [Admin, Author]
    kind: mutation
    scope_checked: true
    enforced_in: nested/api-resolvers/src/lambda/abort_workflow_resolver/index.py
    args: { objectKeys: ["__nope__"] }
  copyToBaseline:
    groups: [Admin, Author]
    kind: mutation
    scope_checked: true
    enforced_in: nested/api-resolvers/src/lambda/copy_to_baseline_resolver/index.py
    # schema: copyToBaseline(objectKey: String!) — single key, not a list
    args: { objectKey: "__nope__" }
  uploadDocument:
    groups: [Admin, Author]
    kind: mutation
    document_scope_checked: true
    scope_checked: true
    enforced_in: nested/api-resolvers/src/lambda/upload_resolver/index.py
    scope_enforced_in: _handle_upload_document
    args: { fileName: "x.pdf" }
    note: >
      Presigned-URL generation only; nothing is uploaded by the test. The scope
      check is on the RESOLVED Configuration Profile, not on the requested one, and
      that is the only form that works: there are two routes to choosing a profile
      and checking the request would cover one of them. The `version` argument names
      a profile directly; a config prefix mapping lets the DESTINATION PREFIX choose
      one with no metadata involved at all. `resolve_destination` resolves both
      through one function and refuses when the result is outside the caller's
      allowedConfigVersions. Before that this operation checked the caller's Cognito
      group and the target bucket and nothing else, so a scoped Author could put a
      document into any profile in the deployment -- i.e. into any scoped user's
      document-visibility partition -- by naming it. A section result
      (`<document>/sections/<id>/result.json` in the Output bucket) of a document
      that is in a review queue is refused with QUEUE_MANAGED (400), as
      processChanges and saveSectionReviewEdits refuse it: the queue item's
      finalize run owns those results, so a direct write would be lost or would
      overwrite the review's input. The groups are unchanged.
  uploadSampleDocument:
    groups: [Admin, Author]
    kind: mutation
    document_scope_checked: true
    scope_checked: true
    enforced_in: nested/api-resolvers/src/lambda/upload_resolver/index.py
    scope_enforced_in: _handle_upload_sample_document
    args: { sampleId: "__nope__" }
    note: >
      The second caller-chosen-prefix writer into the Input bucket, so it carries
      the identical resolved-profile scope check as uploadDocument above.
  deleteDocumentVersion:
    groups: [Admin]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/document_versions_resolver/index.py
    args: { objectKey: "__nonexistent__.pdf", runId: "__x__" }
    note: irreversible S3 version delete — stricter than deleteDocument

  # ==========================================================================
  # Configuration & pricing (configuration_resolver)
  # ==========================================================================
  getConfigVersions:
    groups: [Admin, Author, Viewer]
    kind: read
    scope_filtered: true
    enforced_in: *cfg
    args: {}
  getConfigVersion:
    # Annotator and Reviewer included deliberately: the annotate and review editors
    # need the class list to correct a misclassified section (an Annotator's write
    # side is reextractTestSetDocument; a Reviewer's is the Production editor's
    # processChanges / updateDocumentSections). A caller with no group in
    # {Admin, Author, Viewer} receives ONLY the class names and descriptions — the
    # resolver reduces the payload via _class_vocabulary_only, so prompts, model ids
    # and every other setting stay out of reach of the lowest-privilege role. The
    # reduction is an allow-list, so a config key added later cannot leak by default.
    groups: [Admin, Author, Viewer, Annotator, Reviewer]
    kind: read
    scope_checked: true
    enforced_in: *cfg
    args: { versionName: "default" }
  updateConfiguration:
    groups: [Admin, Author]
    kind: mutation
    scope_checked: true
    enforced_in: *cfg
    # schema: updateConfiguration(versionName: String!, customConfig: AWSJSON!, description: String)
    args: { versionName: "__nope__", customConfig: "{}" }
    note: saveAsVersion/saveAsDefault flags are additionally Admin-only in-code
  setActiveVersion:
    groups: [Admin, Author]
    kind: mutation
    scope_checked: true
    enforced_in: *cfg
    args: { versionName: "__nope__" }
  generateRuleJson:
    groups: [Admin, Author]
    kind: mutation
    enforced_in: *cfg
    args: { ruleDescription: "" }
  deleteConfigVersion:
    groups: [Admin]
    kind: mutation
    scope_checked: true
    enforced_in: *cfg
    args: { versionName: "__nope__" }
  # Configuration Profile revisions. Scope is checked at the PROFILE for all
  # five: a revision is content inside a profile, never its own RBAC object.
  listConfigProfileRevisions:
    groups: [Admin, Author, Viewer]
    kind: read
    scope_checked: true
    enforced_in: *cfg
    args: { profileName: "default" }
  getConfigProfileRevision:
    groups: [Admin, Author, Viewer]
    kind: read
    scope_checked: true
    enforced_in: *cfg
    args: { profileName: "default", revision: 1 }
  restoreConfigProfileRevision:
    groups: [Admin, Author]
    kind: mutation
    scope_checked: true
    enforced_in: *cfg
    args: { profileName: "__nope__", revision: 1 }
  labelConfigProfileRevision:
    groups: [Admin, Author]
    kind: mutation
    scope_checked: true
    enforced_in: *cfg
    args: { profileName: "__nope__", revision: 1 }
  deleteConfigProfileRevision:
    groups: [Admin]
    kind: mutation
    scope_checked: true
    enforced_in: *cfg
    args: { profileName: "__nope__", revision: 1 }
  # Config prefix mappings: an S3 prefix in the Input bucket -> a Configuration
  # Profile. CRUD is Admin-only, and that is an access-control decision rather than
  # a convenience one: a mapping ASSIGNS a profile, a document's profile is the
  # document-visibility partition for every scoped user, so writing a mapping
  # decides who can see the documents landing under that prefix. The three write/read
  # ops carry no `scope_checked` because an Admin has no scope to check; the scope
  # that matters for a mapping is enforced where a non-Admin meets it, at upload
  # time, on the RESOLVED profile -- see uploadDocument above.
  listConfigPrefixMappings:
    groups: [Admin]
    kind: read
    enforced_in: *cfg
    args: {}
    note: >
      Deliberately NOT scope-filtered, and Admin-only for that reason. The mapping
      set is a statement of the deployment's routing policy; a partially-filtered
      view of a longest-prefix rule is actively misleading, because you cannot tell
      which mapping wins when some of them are hidden from you.
  putConfigPrefixMapping:
    groups: [Admin]
    kind: mutation
    enforced_in: *cfg
    args: { prefix: "__nope__/", configProfile: "__nope__" }
  deleteConfigPrefixMapping:
    groups: [Admin]
    kind: mutation
    enforced_in: *cfg
    args: { prefix: "__nope__/" }
  # Tenant declarations. Admin-only on the same grounds as mapping CRUD: a
  # declaration decides which prefixes and profiles a scoped user can be confined
  # to, and saving one re-judges every existing mapping against it.
  listTenants:
    groups: [Admin]
    kind: read
    enforced_in: *cfg
    args: {}
    note: >
      Not scope-filtered, and Admin-only for that reason: the tenant set is the
      deployment's isolation policy, and its prefixes and patterns would tell a
      scoped user where every other tenant's documents land.
  putTenant:
    groups: [Admin]
    kind: mutation
    enforced_in: *cfg
    # `profilePattern: "nope"` has no separator-and-`*` tail, so an allowed caller
    # is refused by validation after the group check and nothing is written; every
    # other value here is valid, and a valid set would declare a real tenant on
    # the stack under test.
    args: { tenantId: "nope", prefixes: ["__nope__/"], profilePattern: "nope" }
  deleteTenant:
    groups: [Admin]
    kind: mutation
    enforced_in: *cfg
    args: { tenantId: "nope" }
  resolveConfigPrefixMapping:
    # Admin+Author, NOT Viewer. The dry run exists to serve the upload form, and
    # Author is the lowest role that can upload at all -- a Viewer has no Upload
    # entry in the navigation, so the grant would have no consumer while still
    # disclosing routing policy. That matters because the scope filter only
    # engages for a caller who HAS a scope: an unscoped Viewer would get the
    # profile, the prefix and the reason in full, and could enumerate the mapping
    # set one probed key at a time -- reconstructing exactly what makes
    # listConfigPrefixMappings Admin-only.
    groups: [Admin, Author]
    kind: read
    # scope_FILTERED, not scope_checked: this operation returns 200 with every
    # naming field nulled for an out-of-scope destination, and never 403s. The
    # dynamic driver cannot tell the two flags apart, and scan_api_rbac's S4 adds
    # only a per-item filter requirement for scope_filtered, which a refusing op
    # with a loop could also meet -- but they feed different published figures, so
    # declaring the refusing kind here moved one operation from the filtering tally
    # to the verifying one and published both wrong. No figure is restated here on
    # purpose: test_api_policy_counts_in_docs.py reads these declarations back and
    # pins them against DOC PROSE, and it cannot see a number inside a YAML
    # comment -- so a count written here is one nothing can stop going stale. The
    # threat model and docs/rbac.md are where they live.
    scope_filtered: true
    enforced_in: *cfg
    args: { objectKey: "__nope__/x.pdf" }
    note: >
      The dry run, and the one prefix-mapping op a non-Admin may call: it answers
      "what configuration would this key process under?", which is what makes a
      longest-prefix rule checkable before it is live. Its answer is SCOPE-FILTERED
      rather than refused -- a caller outside the resolved profile's scope is told
      the destination is out of scope and is NOT told the profile's name, because
      returning it would make this a profile-name enumeration oracle for every
      scoped caller. getConfigVersions is scope_filtered for the same reason.
  getPricing:
    groups: [Admin, Author, Viewer]
    kind: read
    enforced_in: *cfg
    args: {}
  updatePricing:
    groups: [Admin]
    kind: mutation
    enforced_in: *cfg
    # schema: updatePricing(pricingConfig: AWSJSON!)
    args: { pricingConfig: "{}" }
  restoreDefaultPricing:
    groups: [Admin]
    kind: mutation
    enforced_in: *cfg
    args: {}
  getModelConfigLimits:
    groups: [Admin, Author, Viewer]
    kind: read
    enforced_in: *cfg
    args: {}
  updateModelConfigLimits:
    groups: [Admin]
    kind: mutation
    enforced_in: *cfg
    args: { modelConfigLimits: "{}" }
  restoreDefaultModelConfigLimits:
    groups: [Admin]
    kind: mutation
    enforced_in: *cfg
    args: {}
  listConfigurationLibrary:
    groups: [Admin, Author, Viewer]
    kind: read
    enforced_in: *cfg
    args: { pattern: "default" }
  getConfigurationLibraryFile:
    groups: [Admin, Author, Viewer]
    kind: read
    enforced_in: *cfg
    args: { pattern: "default", configName: "__nope__", fileName: "__nope__" }
  syncBdaIdp:
    groups: [Admin, Author]
    kind: mutation
    scope_checked: true
    enforced_in: nested/api-resolvers/src/lambda/sync_bda_idp_resolver/index.py
    args: { direction: "__nope__" }

  # ==========================================================================
  # Discovery (Admin + Author)
  # ==========================================================================
  listDiscoveryJobs:
    groups: [Admin, Author]
    kind: read
    enforced_in: *ddb
    args: {}
  deleteDiscoveryJob:
    groups: [Admin, Author]
    kind: mutation
    enforced_in: *ddb
    args: { jobId: "__nope__" }
  updateDiscoveryJobStatus:
    groups: IAM_ONLY
    kind: mutation
    enforced_in: *ddb
    args: { jobId: "x", status: "QUEUED" }
  uploadDiscoveryDocument:
    groups: [Admin, Author]
    kind: mutation
    scope_checked: true
    scope_enforced_in: handle_upload_discovery_document
    enforced_in: nested/api-resolvers/src/lambda/discovery_upload_resolver/index.py
    args: { fileName: "x.pdf", contentType: "application/pdf" }
  autoDetectSections:
    groups: [Admin, Author]
    kind: mutation
    scope_checked: true
    enforced_in: nested/api-resolvers/src/lambda/discovery_upload_resolver/index.py
    # EMPTY rather than "__nope__", and the difference decides which control the
    # matrix measures. This op now calls s3_targets.assert_bucket_allowed, which
    # refuses a bucket outside this deployment's allow-list for EVERY caller — so a
    # nonexistent bucket name made all four role cells read "DENIED but allowed",
    # reporting the allow-list working as a group-check failure. A real allow-listed
    # bucket is no better: the key then has to exist, and reading it sends a whole
    # PDF to Bedrock. An empty required argument is refused by the resolver's own
    # `if not document_key or not bucket` BEFORE the allow-list assertion, so an
    # allowed role gets a clean 400 and no work is done, while a disallowed role
    # still gets the dispatcher's 403 — authz.enforce runs before argument
    # validation, so the probe's shape cannot weaken the denial cells.
    args: { documentKey: "", bucket: "" }
  startMultiDocDiscovery:
    groups: [Admin, Author]
    kind: mutation
    document_scope_checked: true
    scope_checked: true
    enforced_in: nested/api-resolvers/src/lambda/discovery_upload_resolver/index.py
    args: { configVersion: "__nope__" }
  uploadMultiDocDiscoveryZip:
    groups: [Admin, Author]
    kind: mutation
    scope_checked: true
    enforced_in: nested/api-resolvers/src/lambda/discovery_upload_resolver/index.py
    args: { fileName: "x.zip", fileSize: 1, configVersion: "__nope__" }

  # ==========================================================================
  # Test Studio (Admin + Author)
  # ==========================================================================
  startTestRun:
    groups: [Admin, Author]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/test_runner/index.py
    # A run's documents are stamped with its profile and so become visible to
    # everyone scoped to it, so the profile the run starts under (named, or the
    # active one) is held to the caller's allowedConfigVersions. Named because
    # startTestRun is the handler's default branch, with no `if` on its name.
    scope_checked: true
    scope_enforced_in: _require_profile_in_scope
    # schema: startTestRun(input: TestRunInput!) — wrapped input object
    args: { input: {} }
  sendTestRunToReview:
    groups: [Admin, Author]
    kind: mutation
    # Shares TestRunnerFunction with startTestRun; the resolver branches on
    # fieldName after the Admin/Author group check. Queueing a run's documents for
    # review acts on documents stamped with the run's profile, so that profile is
    # held to the caller's allowedConfigVersions, as when the run was started.
    enforced_in: nested/api-resolvers/src/lambda/test_runner/index.py
    scope_checked: true
    scope_enforced_in: _require_profile_in_scope
    args: { testRunId: "__nope__" }
  getTestRun:
    groups: [Admin, Author]
    kind: read
    scope_checked: true
    enforced_in: nested/api-resolvers/src/lambda/test_results_resolver/index.py
    args: { testRunId: "__x__" }
  getTestRuns:
    groups: [Admin, Author]
    kind: read
    scope_filtered: true
    enforced_in: nested/api-resolvers/src/lambda/test_results_resolver/index.py
    args: {}
  getTestRunStatus:
    groups: [Admin, Author]
    kind: read
    scope_checked: true
    enforced_in: nested/api-resolvers/src/lambda/test_results_resolver/index.py
    args: { testRunId: "__x__" }
  compareTestRuns:
    groups: [Admin, Author]
    kind: read
    scope_checked: true
    enforced_in: nested/api-resolvers/src/lambda/test_results_resolver/index.py
    args: { testRunIds: ["__x__"] }
  deleteTests:
    groups: [Admin, Author]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/delete_tests/index.py
    # schema: deleteTests(testRunIds: [String!]!) — arg is testRunIds, not testIds
    args: { testRunIds: ["__x__"] }
  abortTestRuns:
    groups: [Admin, Author]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/abort_test_runs/index.py
    args: { testRunIds: ["__x__"] }
  getTestSets:
    groups: [Admin, Author]
    # kind stays `read` — it takes no arguments and returns a list, which is what the
    # driver needs to know. But it is not side-effect free: it repairs a stale
    # labelState and fails test sets whose owning job has disappeared, both of which
    # write to the tracking table. Running `make api-test` against a live stack can
    # therefore reap a genuinely abandoned test set. That is the intended behaviour, not
    # a test artefact, but it is worth knowing before pointing the harness at a stack
    # someone is using.
    kind: read
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    args: {}
  getTestSetDocuments:
    # Annotator reads its scoped queue's documents; the resolver additionally
    # enforces allowedTestSets per set.
    groups: [Admin, Author, Annotator]
    kind: read
    testset_checked: true
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    args: { testSetId: "nonexistent-test-set" }
  getAnnotationQueue:
    groups: [Admin, Author, Annotator]
    kind: read
    testset_checked: true
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    args: { testSetId: "nonexistent-test-set" }
  assignTestSetDocuments:
    groups: [Admin]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    args: { testSetId: "nonexistent-test-set", objectKeys: ["__x__"], assigneeEmail: "nobody@example.com" }
    note: >-
      Assigns test-set documents to an Annotator listed on the set's queue (the assignee must hold the Annotator persona) and adds the set to their allowedTestSets. Admin only.
  unassignTestSetDocuments:
    groups: [Admin]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    args: { testSetId: "nonexistent-test-set", objectKeys: ["__x__"] }
    note: >-
      Clears test-set document assignments and notifies the former assignee. Admin only.
  skipTestSetDocument:
    groups: [Admin, Author, Annotator]
    kind: mutation
    testset_checked: true
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    args: { testSetId: "nonexistent-test-set", objectKey: "__x__", reason: "Other (see note)" }
    note: >-
      Hands a test-set document back to its queue, with a reason from the set's skip list: the assignment ends and the document is unassigned again, not completed. Annotators must hold the set in allowedTestSets and be the document's assignee (NOT_ASSIGNED otherwise).

  claimTestSetDocument:
    groups: [Annotator]
    kind: mutation
    testset_checked: true
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    args: { testSetId: "nonexistent-test-set", objectKey: "__x__" }
    note: >-
      An Annotator listed on the set's queue assigns one of its unassigned, unreviewed documents to themselves. Admins assign test-set documents (assignTestSetDocuments) rather than claim them, and Reviewers work Production review queues only, so the gateway refuses a caller outside the Annotator group; a user in both Admin and Annotator is admitted. An Annotator not listed on the queue is refused NOT_ELIGIBLE, and a held or reviewed document is refused (ALREADY_CLAIMED, ALREADY_REVIEWED).
  saveTestSetDocumentSection:
    groups: [Admin, Author, Annotator]
    kind: mutation
    testset_checked: true
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    args: { testSetId: "nonexistent-test-set", objectKey: "__x__", sectionId: "1" }
    note: >-
      Saves or confirms one section's labels of a test-set document without a review copy. Annotators must hold the set in allowedTestSets and be the document's assignee (NOT_ASSIGNED otherwise); the label is stamped reviewed-human with the token's identity.
  saveTestSetDocumentSectionDraft:
    groups: [Admin, Author, Annotator]
    kind: mutation
    testset_checked: true
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    args: { testSetId: "nonexistent-test-set", objectKey: "__x__", sectionId: "1", data: "{}" }
    note: >-
      Saves one section's edits of a test-set document as a draft that is not reviewed and starts nothing (no HITL completion, no reprocessing); Process Changes applies it through completeSectionReview or saveTestSetDocumentSection. Annotators must hold the set in allowedTestSets and be the document's assignee (NOT_ASSIGNED otherwise); an Author is refused a document with a review copy, whose completion excludes Authors.
  updateTestSetQueue:
    groups: [Admin]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    args: { input: { testSetId: "nonexistent-test-set", priority: 50 } }
    note: >-
      Sets a test set's queue settings (description, priority, reminder time limit, eligible Annotators, checklist). Admin only.
  listTestSetQueues:
    groups: [Admin, Annotator]
    kind: read
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    args: {}
    note: >-
      Lists test sets as Test Studio queues with their stored counts, from DynamoDB metadata only: every set for an Admin, only the sets whose queue lists the caller for an Annotator.
  listMyTestSetTasks:
    groups: [Admin, Author, Annotator]
    kind: read
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    args: {}
    note: >-
      Lists only the Test Studio documents assigned to the caller (assignee key from verified claims).
  getTestSetVersions:
    groups: [Admin, Author]
    kind: read
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    args: { testSetId: "nonexistent-test-set" }
  getDraftLabelJob:
    # Annotator included: the ground-truth editor polls this for the outcome of the
    # re-extract it just started via reextractTestSetDocument, which annotators may
    # already run. Without it the job completed server-side while the UI reported
    # "Could not re-extract this document" — observed on a dev stack. Per-set scope
    # is asserted in the handler, so group membership alone does not expose another
    # set's jobs.
    groups: [Admin, Author, Annotator]
    kind: read
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    args: { testSetId: "nonexistent-test-set", jobId: "__nope__" }
  estimateReviewEffort:
    # Annotator reads it for their own queue's "what review is buying" panel; the
    # resolver additionally enforces allowedTestSets per set.
    groups: [Admin, Author, Annotator]
    kind: read
    scope_checked: true
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    args: { testSetId: "nonexistent-test-set" }
  generateDraftLabels:
    groups: [Admin, Author]
    kind: mutation
    scope_checked: true
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    # schema: generateDraftLabels(input: GenerateDraftLabelsInput!)
    args: { input: {} }
  # Internally publishes version 1 of a never-published set (via
  # publish_test_set_version, bypassing that mutation's Admin/Author gate) so there
  # is a state to snapshot. Deliberate: an Annotator is the role that starts a
  # session. It does NOT set the set's active reference — that remains a
  # publishTestSetVersion decision — so the crossing creates a version and nothing
  # a future run depends on by default.
  openTestSetAnnotationDraft:
    # Annotator opens the version transition that annotating their own set commits to.
    # An annotator is the role that starts a session, so refusing this would make the
    # queue unusable for them. The resolver additionally enforces allowedTestSets per
    # set. Note this is the one annotation operation with a side effect on the *set*
    # rather than on a document: it snapshots the baselines being annotated away from,
    # which is what makes the version number refer to bytes.
    groups: [Admin, Author, Annotator]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    args: { input: { testSetId: "nonexistent-test-set" } }

  updateTestSetDocumentSections:
    # Annotator corrects a wrong packet split in their own set — the same kind of
    # annotation work as reextractTestSetDocument, and the correction most
    # often needed in practice. The resolver additionally enforces allowedTestSets per set,
    # and writes only the grouping and class: field values, labelSource and edit
    # history are preserved.
    groups: [Admin, Author, Annotator]
    kind: mutation
    testset_checked: true
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    args: { input: { testSetId: "nonexistent-test-set", objectKey: "__x__", sections: [] } }

  reextractTestSetDocument:
    # Annotator corrects a misclassified document in their own set; the resolver
    # additionally enforces allowedTestSets per set.
    groups: [Admin, Author, Annotator]
    kind: mutation
    scope_checked: true
    testset_checked: true
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    args: { input: { testSetId: "nonexistent-test-set", objectKey: "__x__" } }
  resetTestSetLabels:
    # Admin-only: discards human-reviewed labels, so an Author who can otherwise
    # manage test sets cannot destroy the team's annotation work.
    groups: [Admin]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    args: { testSetId: "nonexistent-test-set" }
  clearDraftLabels:
    groups: [Admin, Author]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    args: { testSetId: "nonexistent-test-set" }
  publishTestSetVersion:
    groups: [Admin, Author]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    # schema: publishTestSetVersion(input: PublishTestSetVersionInput!)
    args: { input: {} }
  removeDocumentsFromTestSet:
    groups: [Admin, Author]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    args: { testSetId: "__nope__", fileNames: ["__nope__"] }
  addTestSet:
    groups: [Admin]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    args: { name: "__nope__", filePattern: "x", bucketType: "input", fileCount: 0 }
  createEmptyTestSet:
    groups: [Admin, Author]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    args: { name: "__nope__" }
  addTestSetFromUpload:
    groups: [Admin, Author]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    # schema: addTestSetFromUpload(input: TestSetUploadInput!)
    args: { input: {} }
  addDocumentsToTestSet:
    groups: [Admin]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    args: { testSetId: "__nope__", filePattern: "x", bucketType: "input", fileCount: 0 }
  # Unlike the pattern import this names exact keys rather than searching the
  # bucket, and every key is checked server-side before anything is queued: the
  # document must have finished processing under a profile the caller's
  # allowedConfigVersions admits. One refusal message covers every failing case, so
  # the op cannot be used to learn which keys exist.
  addDocumentsToTestSetByKey:
    groups: [Admin, Author]
    kind: mutation
    scope_checked: true
    scope_enforced_in: _enforce_selection_scope
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    # An EMPTY selection, for the same reason autoDetectSections takes empty
    # arguments. `_enforce_selection_scope` refuses a key with no COMPLETED
    # tracking row, which a nonexistent key never has, so every allowed cell read
    # "DENIED but allowed" — the selection-scope check answering in place of the
    # group floor. Satisfying that check needs a real completed document, and then
    # the append is real work on a real test set. `_normalize_object_keys` rejects
    # an empty list BEFORE the scope lookup, so an allowed role gets a clean 400.
    args: { testSetId: "__nope__", objectKeys: [] }
  addDocumentsToTestSetFromUpload:
    groups: [Admin, Author]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    # schema: addDocumentsToTestSetFromUpload(input: TestSetDocumentsUploadInput!)
    args: { input: {} }
  updateTestSet:
    groups: [Admin, Author]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    # schema: updateTestSet(input: UpdateTestSetInput!)
    args: { input: {} }
  deleteTestSets:
    groups: [Admin, Author]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    args: { testSetIds: ["__nope__"] }
  listBucketFiles:
    groups: [Admin]
    kind: read
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    args: { bucketType: "input", filePattern: "__nope__" }
  validateTestFileName:
    groups: [Admin, Author]
    kind: read
    enforced_in: nested/api-resolvers/src/lambda/test_set_resolver/index.py
    args: { fileName: "x.pdf" }

  # ==========================================================================
  # HITL review (Admin + Reviewer)
  # ==========================================================================
  updateDocumentSections:
    # Re-groups a document's pages without reprocessing it, so the extracted values
    # survive. Admin/Reviewer/Annotator matches completeSectionReview, the sibling that
    # edits a section's content — processChanges stays narrower because it destroys and
    # regenerates extraction data. Refused while the document is in flight.
    groups: [Admin, Reviewer, Annotator]
    kind: mutation
    scope_checked: true
    scope_enforced_in: update_document_sections
    testset_checked: true
    enforced_in: nested/api-resolvers/src/lambda/process_changes_resolver/index.py
    args: { objectKey: "__nonexistent__.pdf", sections: [] }
    object_scoped_roles: [Annotator]
    note: >-
      As completeSectionReview, and for the same reason: the group list admits
      Annotator, and `_assert_annotator_scope` in the same resolver then confines an
      Annotator to the test sets in their `allowedTestSets`, or, for a production
      document, to one whose review-queue item they hold (CLAIMED, by their owner key
      from verified claims) with the item's own profile in their
      allowedConfigVersions (`_assert_holds_review_item`); `regroup_refusal` then
      decides an in-review document as for every caller. The group list was copied
      from that sibling and the per-object check was not, so the operation admitted
      the role without confining it; this entry is what makes the omission a failure
      rather than a silence. `__nonexistent__.pdf` names no document, so it carries no
      `TestSetId` and a scoped annotator is refused for the object rather than for
      their group. The refusal is `ResourceAccessDenied`
      (`authzControl: "resource"`), not this resolver's `PermissionError` group floor,
      so the two are distinguishable — which they must be here, since a floor-labelled
      refusal on this operation would mean the manifest stopped admitting Annotator.
      Resolving `allowedTestSets` and allowedConfigVersions reads the users table via
      `USERS_TABLE_NAME`, and the review item is read from HITLTable via
      `HITL_TABLE_NAME`; ProcessChangesResolverFunction has both, with read grants. A
      lookup that cannot be answered refuses the Annotator (fail-closed).

  processChanges:
    groups: [Admin, Reviewer]
    kind: mutation
    scope_checked: true
    scope_enforced_in: _assert_caller_may_process
    enforced_in: nested/api-resolvers/src/lambda/process_changes_resolver/index.py
    args: { objectKey: "__x__", modifiedSections: [] }
  completeSectionReview:
    # Annotator annotates test-set ground truth; the resolver additionally
    # requires the document's test set to be in their allowedTestSets.
    groups: [Admin, Reviewer, Annotator]
    kind: mutation
    scope_checked: true
    enforced_in: src/lambda/complete_section_review/index.py
    args: { objectKey: "__x__", sectionId: "1" }
    # This operation is the handler's FALL-THROUGH path — claimReview, releaseReview
    # and skipAllSectionsReview each return from their own `if`, and what is left runs
    # for this one. So there is no branch named after it for a per-operation entry
    # point to be found in, and naming the handler is both the accurate answer and a
    # stronger one than a branch: `_assert_annotator_scope` is called there
    # unconditionally. Read by the Annotator-scope closure test, which otherwise
    # cannot determine the entry point and reports that rather than guessing.
    scope_enforced_in: handler
    object_scoped_roles: [Annotator]
    note: >-
      The Annotator cell asserts a refusal that is NOT the group floor's.
      _assert_annotator_scope reads this objectKey's TestSetId out of the tracking
      table before completing anything, and `__x__` names no document, so a scoped
      annotator is refused for the object rather than for their group. The pair of
      failures that assertion catches: a 403 labelled api-group-floor (the manifest
      stopped admitting Annotator) and no refusal at all (an annotator completed a
      review on a document belonging to no test set of theirs).
  claimReview:
    # Annotator annotates test-set ground truth; the resolver additionally
    # requires the document's test set to be in their allowedTestSets.
    groups: [Admin, Reviewer, Annotator]
    kind: mutation
    scope_checked: true
    # The configuration-scope check runs in the handler before any branch, and
    # before the queue-managed guard, whose distinct refusal would otherwise tell an
    # out-of-scope caller something about the document; so the handler is the entry.
    scope_enforced_in: handler
    enforced_in: src/lambda/complete_section_review/index.py
    args: { objectKey: "__x__" }
    object_scoped_roles: [Annotator]
    note: >-
      As completeSectionReview, and for this operation specifically: claimReview is
      what makes a queue entry exclusive to one annotator, so "refused for the
      object" is the answer that keeps one annotator from claiming a document in a
      test set they were never assigned. _assert_annotator_scope runs before
      claim_review, and `__x__` names no document, so the refusal is the per-object
      one and a 403 from the group floor instead would mean the manifest no longer
      admits the role.
  releaseReview:
    # Annotator annotates test-set ground truth; the resolver additionally
    # requires the document's test set to be in their allowedTestSets.
    groups: [Admin, Reviewer, Annotator]
    kind: mutation
    scope_checked: true
    # The configuration-scope check runs in the handler before any branch, and
    # before the queue-managed guard, whose distinct refusal would otherwise tell an
    # out-of-scope caller something about the document; so the handler is the entry.
    scope_enforced_in: handler
    enforced_in: src/lambda/complete_section_review/index.py
    args: { objectKey: "__x__" }
    object_scoped_roles: [Annotator]
    note: >-
      As claimReview, and for this operation specifically: releasing another
      annotator's claim is how a queue entry would be taken from them, so a caller
      not assigned to the document's test set must be refused for the object.
      _assert_annotator_scope runs before release_review, and `__x__` names no
      document, so the refusal is the per-object one.
  skipAllSectionsReview:
    groups: [Admin, Reviewer]
    kind: mutation
    scope_checked: true
    # The configuration-scope check runs in the handler before any branch, and
    # before the queue-managed guard, whose distinct refusal would otherwise tell an
    # out-of-scope caller something about the document; so the handler is the entry.
    scope_enforced_in: handler
    enforced_in: src/lambda/complete_section_review/index.py
    args: { objectKey: "__x__", reason: "Other (see note)" }
    note: >-
      HITL review op. The handler gates on {Admin,Reviewer} both at the global
      gate (index.py:51) and the per-field check (index.py:72), matching the
      schema directive. Authorization is checked BEFORE objectKey is used, so an
      allowed role passing a bogus objectKey gets a benign 400 (doc-not-found),
      never a masked auth failure; a disallowed role (Viewer/Author) is rejected
      with Unauthorized regardless of the objectKey.
  saveSectionReviewEdits:
    groups: [Admin, Reviewer]
    kind: mutation
    scope_checked: true
    # The configuration-scope check runs in the handler before any branch, and
    # before the queue-managed guard, whose distinct refusal would otherwise tell an
    # out-of-scope caller something about the document; so the handler is the entry.
    scope_enforced_in: handler
    enforced_in: src/lambda/complete_section_review/index.py
    args: { objectKey: "__x__", sectionId: "1", editedData: "{}" }
    note: >-
      HITL review op. It overwrites a section's extraction result in the output
      bucket, so it is limited to the production review roles; Annotator saves
      Test Studio labels through completeSectionReview instead. The per-field
      check refuses any other group before objectKey is read, then the handler
      refuses a Reviewer who is not the document's review owner.

  # ==========================================================================
  # Agents & chat
  # ==========================================================================
  submitAgentQuery:
    groups: [Admin, Author, Viewer]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/agent_request_handler/index.py
    args: { query: "hi", agentIds: ["x"] }
  getAgentJobStatus:
    groups: [Admin, Author, Viewer]
    kind: read
    ownership: true
    enforced_in: *ddb
    args: { jobId: "__nope__" }
  listAgentJobs:
    groups: [Admin, Author, Viewer]
    kind: read
    ownership: true
    enforced_in: *ddb
    args: {}
  updateAgentJobStatus:
    groups: IAM_ONLY
    kind: mutation
    enforced_in: *ddb
    args: { jobId: "x", userId: "y", status: "COMPLETED" }
  deleteAgentJob:
    groups: ANY_GROUP
    kind: mutation
    ownership: true
    enforced_in: *ddb
    args: { jobId: "__nope__" }
    note: >-
      A mutation, so ANY_GROUP: a caller with no assigned group has no agent jobs
      to delete, the three groups that can create one (submitAgentQuery is
      Admin/Author/Viewer) all hold a group, and the per-caller PK scope in
      ddb_direct is what stops a grouped caller deleting someone else's.
  listAvailableAgents:
    groups: [Admin, Author, Viewer]
    kind: read
    enforced_in: nested/api-resolvers/src/lambda/list_available_agents/index.py
    args: {}
    note: server-side _caller_in_groups check matches the schema directive
      (Reviewer excluded). Formerly GAP-03.
  listChatSessions:
    groups: ANY
    kind: read
    ownership: true
    enforced_in: nested/api-resolvers/src/lambda/list_agent_chat_sessions_resolver/index.py
    args: {}
    note: >-
      ANY is deliberate, and the reason is the SHAPE of the scope rather than the
      existence of one: the resolver's DynamoDB read is a KeyConditionExpression on
      `userId`, taken from the verified identity, so the caller's own partition is
      the only one it can address and there is no branch on which it addresses
      another. A caller in no group also has nothing to list — neither operation
      that creates a session admits one (sendAgentChatMessage is Admin/Author/Viewer,
      sendChatDocumentMessage is ANY_GROUP). getChatMessages is ANY_GROUP: its scope
      is a separate ownership VERIFICATION with two stand-down branches, which is a
      different control, so it gets its own decision rather than this one.
      deleteChatSession is ANY_GROUP because it is a mutation.
  getChatMessages:
    groups: ANY_GROUP
    kind: read
    ownership: true
    enforced_in: nested/api-resolvers/src/lambda/get_agent_chat_messages_resolver/index.py
    # EMPTY, not "__nope__". The ownership check below refuses a session the caller
    # does not own, and nobody owns a nonexistent one, so all four allowed cells read
    # "DENIED but allowed" — ownership answering in place of the group floor. (It read
    # as a PASS until #1060 stopped the resolver reporting its own refusal as a 500
    # and the harness stopped scoring a 5xx as "not denied": the cell was never
    # measuring the floor, it was measuring a crash.) An empty sessionId is refused by
    # the resolver's own `if not session_id` before ownership is consulted, so an
    # allowed role gets a clean 400.
    args: { sessionId: "" }
    note: >-
      ANY_GROUP. The message read itself is `PK = sessionId` with no caller term;
      what bounds it to the caller is _verify_session_ownership, which accepts only
      the owner ChatSessionOwnersTable records for the id (the caller's own
      ChatSessionsTable row counts only for an id with no recorded owner, i.e. a
      session written before that table existed) and denies when either table is
      unconfigured. An operator can still switch it off wholesale with
      ENFORCE_CHAT_SESSION_OWNERSHIP=false, and on that branch a session id is the
      whole credential; the resolver's own comment says the messages can hold
      "user queries, document content quoted by the LLM". So the group floor is
      not redundant with the ownership check; it is the layer that holds when that
      check is switched off. Its cost is provably nil: neither operation
      that creates a session admits a groupless caller (sendAgentChatMessage is
      Admin/Author/Viewer, sendChatDocumentMessage is ANY_GROUP), so no reachable
      record is lost. The ownership verification stays — it is what stops one
      GROUPED caller reading another's session, which the floor does not.
  deleteChatSession:
    groups: ANY_GROUP
    kind: mutation
    ownership: true
    enforced_in: nested/api-resolvers/src/lambda/delete_agent_chat_session_resolver/index.py
    # EMPTY, not "__nope__", for exactly the reason getChatMessages is — the delete
    # side gained the same per-session ownership refusal the read side has, and a
    # well-formed id nobody owns is refused by THAT control before the group floor is
    # reached, so all five admitted cells read `403!grp?` (ERROR, "could not be run").
    # An empty sessionId trips `if not session_id` at index.py:101, which precedes the
    # ownership check at :135, so an allowed role gets a clean 400 and a disallowed one
    # still gets the dispatcher's 403 — authz.enforce runs ahead of the resolver.
    args: { sessionId: "" }
    note: >-
      A mutation, so ANY_GROUP even though the ownership scope already bounds it
      to the caller's own sessions: a caller who may hold no session has nothing
      to delete, and a state-changing operation is the wrong place to rely on the
      reachable set being empty.
  sendAgentChatMessage:
    groups: [Admin, Author, Viewer]
    kind: mutation
    ownership: true
    skip_allowed: true
    enforced_in: nested/api-resolvers/src/lambda/agent_chat_resolver/index.py
    args: { prompt: "hi" }
    note: server-side _caller_in_groups check matches the schema directive
      (Reviewer excluded, closes former GAP-03); allowed-role call skipped
      (would start a live agent session)
  sendChatDocumentMessage:
    groups: ANY_GROUP
    kind: mutation
    ownership: true
    scope_checked: true
    skip_allowed: true
    enforced_in: src/lambda/chat_with_document_processor/index.py
    args: { sessionId: "__nope__", prompt: "hi" }
    note: >
      scope enforced in the downstream processor Lambda, not the resolver, from
      the verified claims the resolver forwards as `identity`; every failure to
      evaluate it denies the turn. The live scope suite does not reach this op —
      it is skip_allowed, because an allowed-role call would start chat
      processing — so the enforcement is covered by the processor's own unit
      suite (src/lambda/chat_with_document_processor/tests/), including a check
      that the index it queries is one template.yaml declares.
      ANY_GROUP: a mutation that sends document content to a model and bills
      inference to the deployment. On the REST route the dispatcher applies this
      floor; the streaming Lambda Function URL (POST /chat/document below)
      applies the same floor from the verified ID token it requires. The session
      id is registered to, or checked against, its owner in
      ChatSessionOwnersTable before the processor is invoked.
  queryKnowledgeBase:
    groups: ANY_GROUP
    kind: read
    skip_allowed: true
    enforced_in: nested/api-resolvers/src/lambda/query_knowledgebase_resolver/index.py
    args: { input: "hi" }
    known_gap: GAP-02
    note: >-
      allowed-role call skipped (live Bedrock KB invocation). ANY_GROUP: the
      knowledge base is built from processed document content, so a query
      against it returns that content in synthesised form, and the call bills
      Bedrock inference. GAP-02 records that the resolver itself still has no
      group check — the dispatcher floor is now the only group gate, which is
      why the gap stays open rather than being retired here.

  # ==========================================================================
  # Inbox (idp_common.notifications) — self-scoped by verified identity
  # ==========================================================================
  # The mark/delete args name a well-formed id nobody owns, so an allowed role
  # gets a benign 404 (ResourceNotFound), which the matrix does not read as a
  # denial.
  listInboxMessages:
    groups: ANY_GROUP
    kind: read
    ownership: true
    enforced_in: *inbox
    args: { limit: 1 }
    note: >-
      Lists only the caller's own Inbox; the partition key is built from verified ID-token claims and no user argument exists. Any assigned group, because every signed-in role has an Inbox.
  getInboxUnreadCount:
    groups: ANY_GROUP
    kind: read
    ownership: true
    enforced_in: *inbox
    args: {}
    note: >-
      Counts the caller's own unread messages; no other user's data is reachable.
  getInboxPreferences:
    groups: ANY_GROUP
    kind: read
    ownership: true
    enforced_in: *inbox
    args: {}
    note: >-
      Returns the caller's own mute settings and the public type catalogue.
  markInboxMessages:
    groups: ANY_GROUP
    kind: mutation
    ownership: true
    enforced_in: *inbox
    args: { ids: ["0000000000000000000000000"], read: true }
    note: >-
      Changes read state only for ids in the caller's own partition; other users' ids are not found.
  markAllInboxMessagesRead:
    groups: ANY_GROUP
    kind: mutation
    ownership: true
    enforced_in: *inbox
    args: {}
    note: >-
      Marks only the caller's own messages read.
  deleteInboxMessages:
    groups: ANY_GROUP
    kind: mutation
    ownership: true
    enforced_in: *inbox
    args: { ids: ["0000000000000000000000000"] }
    note: >-
      Deletes only ids in the caller's own partition; other users' ids are not found.
  clearReadInboxMessages:
    groups: ANY_GROUP
    kind: mutation
    ownership: true
    enforced_in: *inbox
    args: {}
    note: >-
      Deletes only the caller's own read messages.
  updateInboxPreferences:
    groups: ANY_GROUP
    kind: mutation
    ownership: true
    enforced_in: *inbox
    args: { mutedTypes: [] }
    note: >-
      Writes only the caller's own preferences item; unknown type ids are rejected.

  # ==========================================================================
  # HITL review queues (idp_common.review_queues)
  # ==========================================================================
  # Queues are system-wide, so one queue holds items of several configuration
  # profiles. An Admin and a Reviewer work every Production queue; an Annotator
  # works the queues that list them; each claims items or is assigned them (owner
  # key from verified claims). Test Studio queues are Annotator work: an Annotator
  # works the sets in their allowedTestSets (testset_scope); a Reviewer works
  # Production queues only.
  # Profile scope (allowedConfigVersions) is applied to each item by its own
  # profile, in the listings as in the per-item operations, and an item with no
  # profile is admitted to no scoped caller. Every other operation is Admin only. The mutation args name an item nobody has, so
  # an allowed role gets a benign 404 (ITEM_NOT_FOUND); claimNextReviewItem names
  # an undefined queue (400).
  getMyReviewQueues:
    groups: [Admin, Annotator, Reviewer]
    kind: read
    enforced_in: *rq
    scope_filtered: true
    scope_enforced_in: _caller_context
    args: { itemLimit: 1 }
    note: >-
      Lists the queues the caller works with their depth, and those queues' items: every queue for an Admin or a Reviewer, the queues that list them for an Annotator (Home › Queues). Each listed item is filtered by its own profile against the caller's allowedConfigVersions.
  listReviewQueueItems:
    groups: [Admin, Annotator, Reviewer]
    kind: read
    enforced_in: *rq
    scope_filtered: true
    scope_enforced_in: _caller_context
    args: { limit: 1 }
    note: >-
      Lists a queue's items, or the items of every queue the caller works, in priority then FIFO order. An Annotator is refused a queue that doesn't list them (NOT_A_MEMBER); a Reviewer works every Production queue. Each listed item is filtered by its own profile against the caller's allowedConfigVersions.
  listMyReviewWork:
    groups: [Admin, Annotator, Reviewer]
    kind: read
    enforced_in: *rq
    scope_filtered: true
    scope_enforced_in: _caller_context
    args: { limit: 1 }
    note: >-
      Lists only the items the caller holds (owner key from verified claims), each filtered by its own profile against the caller's allowedConfigVersions as they are now.
  getReviewItem:
    groups: [Admin, Annotator, Reviewer]
    kind: read
    enforced_in: *rq
    scope_checked: true
    scope_enforced_in: _caller_context
    args: { objectKey: "__x__" }
    note: >-
      One queue item, its reasons, drafts and history. An Annotator or a Reviewer may open, read-only until they claim it, an item in a queue they work (every Production queue for a Reviewer), or an item they hold (NOT_A_MEMBER otherwise), and only when the item's own profile is in their allowedConfigVersions (OUT_OF_SCOPE otherwise). A nonexistent key is a benign 404.
  claimReviewItem:
    groups: [Admin, Annotator, Reviewer]
    kind: mutation
    enforced_in: *rq
    scope_checked: true
    scope_enforced_in: _caller_context
    args: { objectKey: "__x__", cycleId: "000000000000000000000" }
    note: >-
      Takes one queue item for the caller, assigning it to them (no expiry); the claim is one conditional write. An Annotator may claim only in a queue that lists them (NOT_A_MEMBER); a Reviewer in any Production queue.
  claimNextReviewItem:
    groups: [Admin, Annotator, Reviewer]
    kind: mutation
    enforced_in: *rq
    scope_filtered: true
    scope_enforced_in: _caller_context
    args: { queueProfile: "__x__", queueName: "__x__" }
    note: >-
      Takes the next eligible item of a queue, or of the caller's queues; an undefined queue is a benign 400 (UNKNOWN_QUEUE). An Annotator draws only from queues that list them, a Reviewer from every Production queue, and only items whose own profile is in their allowedConfigVersions.
  renewReviewLease:
    groups: [Admin]
    kind: mutation
    enforced_in: *rq
    scope_checked: true
    scope_enforced_in: _caller_context
    args: { objectKey: "__x__", cycleId: "000000000000000000000" }
    note: >-
      Extends the caller's own hold; the owner is checked inside the write condition. Admin only.
  releaseReviewItem:
    groups: [Admin, Annotator, Reviewer]
    kind: mutation
    enforced_in: *rq
    scope_checked: true
    scope_enforced_in: _caller_context
    args: { objectKey: "__x__", cycleId: "000000000000000000000", reason: "Other (see note)" }
    note: >-
      Returns the caller's own item to its queue, keeping the draft (Skip), with a reason from the queue's skip list. Only the holder may release (NOT_LEASE_HOLDER).
  saveReviewDraft:
    groups: [Admin, Annotator, Reviewer]
    kind: mutation
    enforced_in: *rq
    scope_checked: true
    scope_enforced_in: _caller_context
    args: { objectKey: "__x__", cycleId: "000000000000000000000", sectionId: "1", data: "{}" }
    note: >-
      Saves a section draft for an item assigned to the caller (bounded size and depth).
  completeReviewItem:
    groups: [Admin, Annotator, Reviewer]
    kind: mutation
    enforced_in: *rq
    scope_checked: true
    scope_enforced_in: _caller_context
    args: { objectKey: "__x__", cycleId: "000000000000000000000" }
    note: >-
      Completes an item assigned to the caller (Admin: any held item) and starts its durable finalize run.
  rejectReviewItem:
    groups: [Admin, Annotator, Reviewer]
    kind: mutation
    enforced_in: *rq
    scope_checked: true
    scope_enforced_in: _caller_context
    args: { objectKey: "__x__", cycleId: "000000000000000000000", reason: "Other (see note)" }
    note: >-
      Rejects an item assigned to the caller with a reason from the queue's list; the document ends REJECTED.
  removeReviewItem:
    groups: [Admin]
    kind: mutation
    enforced_in: *rq
    args: { objectKey: "__x__", cycleId: "000000000000000000000", note: "rbac" }
    note: >-
      Takes an open or assigned item out of review so the document completes with its machine results (the assignee is notified). Admin only.
  getReviewQueuesOverview:
    groups: [Admin]
    kind: read
    enforced_in: *rq
    args: {}
    note: >-
      Supervisor view of every queue's health and Annotator load. Admin only.
  forceReleaseReviewItem:
    groups: [Admin]
    kind: mutation
    enforced_in: *rq
    args: { objectKey: "__x__", cycleId: "000000000000000000000" }
    note: >-
      Unassigns an item (draft kept; the former assignee is notified). Admin only.
  reassignReviewItem:
    groups: [Admin]
    kind: mutation
    enforced_in: *rq
    args: { objectKey: "__x__", cycleId: "000000000000000000000", assigneeEmail: "nobody@example.com" }
    note: >-
      Assigns an item to an Annotator eligible for its queue; notifies the assignee. Admin only.
  takeOverReviewItem:
    groups: [Admin]
    kind: mutation
    enforced_in: *rq
    args: { objectKey: "__x__", cycleId: "000000000000000000000" }
    note: >-
      Assigns an item held by another reviewer to the calling Admin so they can edit and complete it (draft kept; the former assignee is notified). Admin only.
  moveReviewItem:
    groups: [Admin]
    kind: mutation
    enforced_in: *rq
    args: { objectKey: "__x__", cycleId: "000000000000000000000", targetQueue: "__x__" }
    note: >-
      Moves an item to another queue, e.g. Escalation (ends any assignment and notifies the former assignee). Admin only.
  listAnnotators:
    groups: [Admin]
    kind: read
    enforced_in: *rq
    args: {}
    note: >-
      Lists the emails of the Cognito Annotator group's members, the only users HITL work can be assigned to; Reviewers claim their own work and are never assigned it. Admin only.
  listReviewQueues:
    groups: [Admin]
    kind: read
    enforced_in: *rq
    args: {}
    note: >-
      Lists the system-wide queue definitions. Admin only.
  createReviewQueue:
    groups: [Admin]
    kind: mutation
    enforced_in: *rq
    args: { input: { id: "__x__" } }
    note: >-
      Creates a system-wide queue definition; an existing id is a 400 (QUEUE_EXISTS). Admin only.
  updateReviewQueue:
    groups: [Admin]
    kind: mutation
    enforced_in: *rq
    args: { input: { id: "__x__" } }
    note: >-
      Updates a queue definition; an unknown id is a 400 (UNKNOWN_QUEUE). Admin only.
  deleteReviewQueue:
    groups: [Admin]
    kind: mutation
    enforced_in: *rq
    args: { id: "__x__" }
    note: >-
      Deletes a queue definition after moving its items to the Default queue; Default, and a queue with an item being finalized, are refused. Admin only.

  # ==========================================================================
  # Users & profile
  # ==========================================================================
  createUser:
    groups: [Admin]
    kind: mutation
    enforced_in: src/lambda/user_management/index.py
    # schema: createUser(email: String!, persona: String!, allowedConfigVersions: [String])
    args: { email: "__no@no.invalid", persona: "Viewer" }
  updateUser:
    groups: [Admin]
    kind: mutation
    enforced_in: src/lambda/user_management/index.py
    # schema: updateUser(userId: ID!, allowedConfigVersions: [String]) — keyed by userId
    args: { userId: "__nope__" }
  deleteUser:
    groups: [Admin]
    kind: mutation
    enforced_in: src/lambda/user_management/index.py
    # schema: deleteUser(userId: ID!) — keyed by userId, not email
    args: { userId: "__nope__" }
  setUserTenant:
    groups: [Admin]
    kind: mutation
    enforced_in: src/lambda/user_management/index.py
    # Writes another user's configuration scope, so Admin-only, and only on a stack
    # whose TenantGrantSource is Api. The probe address has no user, so an allowed
    # caller is refused (by the mode check, or as user-not-found) and nothing is
    # written.
    args: { email: "__no@no.invalid" }
  listUsers:
    groups: [Admin]
    kind: read
    enforced_in: src/lambda/user_management/index.py
    args: {}
    note: Admin-only server-side (listUsers exposes all user emails/roles); the
      handler adds listUsers to its Admin-gated set. Formerly GAP-04.
  getMyProfile:
    groups: ANY
    kind: read
    ownership: true
    enforced_in: src/lambda/user_management/index.py
    args: {}
    note: >-
      ANY is deliberate and is the clearest case for it. It returns the caller's
      own record and nothing else, so it is exactly what a user with no group
      assigned must still be able to read — the UI calls it to discover the
      caller's scope, and denying it would make a groupless account
      indistinguishable from a broken deployment. `ownership: true` because
      own-record-only IS record ownership: the schema declares no arguments and the
      handler resolves the row from the verified `sub` and `email` claims, so there
      is no arbitrary-user read path. It was previously unflagged, which understated
      by one the count of ANY operations carrying a per-caller narrowing.

  # ==========================================================================
  # Fine-tuning
  # ==========================================================================
  createFinetuningJob:
    groups: [Admin, Author]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/finetuning_jobs_resolver/index.py
    # schema: createFinetuningJob(input: CreateFinetuningJobInput!)
    args: { input: {} }
  deleteFinetuningJob:
    groups: [Admin, Author]
    kind: mutation
    enforced_in: nested/api-resolvers/src/lambda/finetuning_jobs_resolver/index.py
    args: { jobId: "__nope__" }
  listFinetuningJobs:
    groups: ANY
    kind: read
    enforced_in: nested/api-resolvers/src/lambda/finetuning_jobs_resolver/index.py
    args: {}
    note: >-
      ANY is deliberate, and it is a whole-deployment list: the query filters on
      PK begins_with "finetuning#" with no caller term, and the job rows carry no
      creator attribute for one to be written against. What that list holds is
      platform state — job and test-set names, base and custom model ids and ARNs,
      status, hyperparameters, training metrics, deployment endpoint — and no
      document content or document location. Creating and deleting jobs is
      [Admin, Author]. The whole of this reason is a property of ONE dict literal,
      _format_job_for_graphql, and the row it reads from does carry a dataset
      location: `trainingDataUri` and `validationDataUri` are written onto it by the
      data generator and the merge step and are simply not projected, while the
      projection's trainingDataConfig / validationDataConfig / outputDataConfig keys
      are Bedrock request parameter names nothing ever writes to DynamoDB, so they
      resolve to null. That premise is computable, so it is computed:
      finetuning_jobs_resolver/test_projected_keys.py pins the returned key set,
      fails if any projected value carries an `s3://` URI, and fails if the policy
      here stops being ANY — because one added line in that dict would otherwise turn
      an unvetted read into a dataset-location disclosure with nothing to notice. The
      one residual it cannot pin: `errorMessage` relays a caught exception string,
      whose contents are not bounded by anything here.
  getFinetuningJob:
    groups: ANY
    kind: read
    enforced_in: nested/api-resolvers/src/lambda/finetuning_jobs_resolver/index.py
    args: { jobId: "__nope__" }
    note: >-
      ANY is deliberate. One job by jobId, projected through the same
      _format_job_for_graphql as listFinetuningJobs, so the same platform-state
      fields, the same pinned key set (test_projected_keys.py covers both operations
      through the one projection) and the same `errorMessage` residual apply to it —
      and it has no owner check either, because the rows record no owner.

  # ==========================================================================
  # Capacity / version metadata / knowledge
  # ==========================================================================
  calculateCapacity:
    groups: [Admin, Author, Viewer]
    kind: read
    enforced_in: src/lambda/calculate_capacity_resolver/index.py
    args: { input: "{}" }
    note: server-side _caller_in_groups check now matches the schema directive
      (Reviewer excluded). Formerly GAP-05.
  getLatestPublishedVersion:
    groups: ANY
    kind: read
    enforced_in: src/lambda/version_check_resolver/index.py
    args: {}
    note: >-
      ANY is deliberate: the published release number, which is public
      information on GitHub, readable by every authenticated user so the UI can
      show an upgrade notice whatever the caller's role.
  listSampleDocuments:
    groups: [Admin, Author, Viewer]
    kind: read
    enforced_in: nested/api-resolvers/src/lambda/upload_resolver/index.py
    args: {}
    note: aliased to uploadDocument in FIELD_ALIASES; handled by upload_resolver
  getSampleDocumentUrl:
    groups: [Admin, Author, Viewer]
    kind: read
    enforced_in: nested/api-resolvers/src/lambda/get_sample_document_resolver/index.py
    args: { s3Key: "__nope__" }

  # ==========================================================================
  # Circuit breaker (conditional on CircuitBreakerEnabled)
  # ==========================================================================
  getCircuitBreakerStatus:
    groups: ANY_GROUP
    kind: read
    enforced_in: *ddb
    args: {}
    note: >-
      served by ddb_direct when the breaker is disabled, resolver when enabled.
      ANY_GROUP because of `lastError`. One global singleton row, so there is
      nothing per-caller to scope, and the rest of the payload — enabled, state,
      timestamps, counters — is genuinely just the badge. But `lastError` has two
      writers, and the second is `f"Manual pause by {user}: {reason}"` in
      circuit_breaker_manager, where `user` is the pausing administrator's EMAIL
      (circuit_breaker_resolver sends `caller["email"]`). So after any manual pause
      this operation serves an administrator's address and an operator's free-text
      note. The floor costs nothing, and the reason is structural rather than a claim
      about who signs in: the badge has exactly one render site, the documents table
      header, and AuthRoutes returns the no-role notice IN PLACE OF the router for a
      session in no group, so no route mounts and the badge is never requested. A
      groupless user can still sign in; they just cannot reach it. The three controls
      that change the breaker stay Admin-only.
  pauseCircuitBreaker:
    groups: [Admin]
    kind: mutation
    conditional: circuit_breaker
    enforced_in: nested/api-resolvers/src/lambda/circuit_breaker_resolver/index.py
    args: { reason: "test" }
  resumeCircuitBreaker:
    groups: [Admin]
    kind: mutation
    conditional: circuit_breaker
    enforced_in: nested/api-resolvers/src/lambda/circuit_breaker_resolver/index.py
    args: { reason: "test" }
  probeCircuitBreaker:
    groups: [Admin]
    kind: mutation
    conditional: circuit_breaker
    enforced_in: nested/api-resolvers/src/lambda/circuit_breaker_resolver/index.py
    args: { reason: "test" }

  # ==========================================================================
  # Feature platform (conditional on EnableFeaturePlatform)
  # ==========================================================================
  # ANY is deliberate for all three, but they return three different things and the
  # note on each says what its own payload is. What they share is that none reads
  # cognito:groups, none scopes per caller, and none returns document data.
  # Installing, subscribing and launching a feature are Admin-only.
  #
  # Note what is NOT the reason: "the UI needs these before it knows the caller's
  # role" does not hold at all. use-user-role.ts reads cognito:groups straight off
  # the ID token with no API call, and the pre-token-generation trigger injects the
  # groups into the FIRST token rather than only the second, so the role is known
  # before any of these three is called. (The forced token refresh in that hook is a
  # fallback for a token that arrives without the claim anyway, not a window in which
  # the role is unknowable.) The reason is the payloads, per operation, below.
  listInstalledFeatures:
    groups: ANY
    kind: read
    conditional: feature_platform
    enforced_in: feature-platform/main-stack-extensions/lambdas/list_installed_features/index.py
    args: {}
    note: >-
      ANY is deliberate: the install inventory — feature id, display name,
      installed and latest version, whether an update is available, and where the
      feature's own UI bundle and API live. Nothing document-derived, nothing
      per-caller, and every role needs it to render the nav at all. It does
      disclose deployment topology (stack id, stack name, the feature API endpoint,
      a generation queue ARN) to any authenticated caller, which is reconnaissance
      value rather than data; that is the accepted cost, and it is the one thing on
      this entry a future reviewer might weigh differently.
  listCatalogFeatures:
    groups: ANY
    kind: read
    conditional: feature_platform
    enforced_in: feature-platform/main-stack-extensions/lambdas/list_catalog_features/index.py
    args: {}
    note: >-
      ANY is deliberate: the published catalog manifest — what optional features
      exist, their versions, descriptions, docs links, and the artifact bucket and
      prefix the published extension templates are fetched from. That is the
      feature-artifacts location, not a document bucket, and the manifest is the
      same for every caller.
  checkFeatureEntitlement:
    groups: ANY
    kind: read
    conditional: feature_platform
    enforced_in: feature-platform/main-stack-extensions/lambdas/check_feature_entitlement/index.py
    args: { featureId: "__nope__" }
    note: >-
      ANY is deliberate, and this one is not a catalog read: it answers whether
      THIS DEPLOYMENT is entitled to one feature, and the answer carries the
      deployment's own AWS Marketplace customer identifier, product code and
      license mode. Those are per-deployment billing identifiers, not per-caller
      and not document-derived: the answer is the same whoever asks, and the UI
      needs it for every role to decide whether to offer the feature at all.
  getFeatureLaunchUrl:
    groups: [Admin]
    kind: read
    conditional: feature_platform
    enforced_in: feature-platform/main-stack-extensions/lambdas/get_feature_launch_url/index.py
    args: { featureId: "__nope__" }
    note: schema directive now @aws_cognito_user_pools(cognito_groups:[Admin]),
      matching the resolver's Admin enforcement. Formerly GAP-06.
  subscribeFeature:
    groups: [Admin]
    kind: mutation
    conditional: feature_platform
    enforced_in: feature-platform/main-stack-extensions/lambdas/subscribe_feature/index.py
    args: { featureId: "__nope__" }
    note: schema directive switched from the silently-ignored @aws_auth to
      @aws_cognito_user_pools(cognito_groups:[Admin]). Formerly GAP-06.
  unsubscribeFeature:
    groups: [Admin]
    kind: mutation
    conditional: feature_platform
    enforced_in: feature-platform/main-stack-extensions/lambdas/unsubscribe_feature/index.py
    args: { featureId: "__nope__" }
    note: schema directive switched from the silently-ignored @aws_auth to
      @aws_cognito_user_pools(cognito_groups:[Admin]). Formerly GAP-06.

# ============================================================================
# Lambda Function URL endpoints — the OTHER way into the backend
# ============================================================================
#
# Chat streaming does not go through the REST dispatcher. The browser POSTs
# SigV4-signed requests straight to a Lambda Function URL whose FastAPI app
# calls the chat processors, so none of the checks above (Cognito authorizer,
# FIELD_FUNCTION_MAP, schema directives) apply to it. Declare every such
# endpoint and route here; scan_api_rbac.py checks S6-S9 against them.
#
# Entry schema
# ------------
#   <UrlLogicalId>:      an AWS::Lambda::Url resource in template.yaml
#     auth_type:         must equal the template's AuthType (NONE always fails)
#     handler:           repo-relative FastAPI app file; must be inside the
#                        target function's CodeUri
#     routes:            "<METHOD> <path>" -> route policy:
#       groups:          groups the SERVER must enforce, or ANY
#       ownership:       true -> scoped to the caller's own records
#       equivalent_op:   the operations: entry serving the same user action;
#                        the two must declare the same groups
#       enforced_in:     the processor this route invokes, which must carry the
#                        group check for a group-restricted route
#       transport_enforces:
#                        what this transport can ACTUALLY apply, declared only
#                        when it is weaker than `groups`. `groups` is the policy
#                        and must equal the equivalent_op's — one user action has
#                        one policy — so without this key the only way to keep
#                        S9's equivalent_op comparison quiet was to weaken the
#                        declared policy, and then the real divergence appeared
#                        nowhere. With it, S9 emits a finding naming the gap
#                        (WARN, FAIL under --strict) and requires a
#                        residual_gap/known_gap id, so the divergence is reported
#                        by the check that measures it rather than declared away.
#       known_gap:       GAP-NN, as for operations above — downgrades a
#                        mismatch on this route from FAIL to WARN
#       residual_gap:    GAP-NN listed in the register for auditability that
#                        does NOT downgrade anything: S6-S9 findings on the
#                        route stay hard FAILs. Use this for a limitation of
#                        the transport itself, so recording it cannot disarm
#                        the checks on the code.
#       note:            free text
#
# The key lists above are CLOSED, and the scanner enforces them (S6): an
# unrecognised key is a hard FAIL rather than being ignored. Every key here is
# read by name, so a misspelling makes the setting vanish silently — writing
# `residual_gapp:` was measured to leave the scan at 0 FAIL while removing GAP-07
# from this register. Adding a key means adding it to ENDPOINT_ENTRY_KEYS /
# ROUTE_POLICY_KEYS in scripts/sdlc/scan_api_rbac.py, which is a code change a
# reviewer sees.
#
# Routes needing no per-user authorization (health checks) are allowlisted in
# FUNCTION_URL_OPEN_ROUTES in the scanner, not here.
  # ==========================================================================
  # MCP service credentials (McpCredentialManagerFunction). Admin only. Not
  # routable when EnableMCP is false: the field map entry is then empty.
  # ==========================================================================
  listMcpCredentials:
    groups: [Admin]
    kind: read
    conditional: mcp
    enforced_in: src/lambda/mcp_credential_manager/index.py
    args: {}
    note: >-
      Lists every credential's id, name, role, scope and lifecycle fields; never a
      secret, which is not stored on the row.
  createMcpCredential:
    groups: [Admin]
    kind: mutation
    conditional: mcp
    scope_checked: true
    enforced_in: src/lambda/mcp_credential_manager/index.py
    scope_enforced_in: _dispatch
    # An unknown role is refused by validation before anything is created, so an
    # allowed caller is refused benignly.
    args: { name: "rbac-probe", role: "__not_a_role__" }
    note: >-
      A scoped Admin may grant only profiles inside their own allowedConfigVersions
      and cannot create an unscoped credential; the scope must sit inside one
      tenant (scope_rejection_reason, as createUser).
  updateMcpCredential:
    groups: [Admin]
    kind: mutation
    conditional: mcp
    scope_checked: true
    enforced_in: src/lambda/mcp_credential_manager/index.py
    scope_enforced_in: _dispatch
    args: { clientId: "__nonexistent__" }
  rotateMcpCredential:
    groups: [Admin]
    kind: mutation
    conditional: mcp
    scope_checked: true
    enforced_in: src/lambda/mcp_credential_manager/index.py
    scope_enforced_in: _dispatch
    args: { clientId: "__nonexistent__" }
  revokeMcpCredential:
    groups: [Admin]
    kind: mutation
    conditional: mcp
    scope_checked: true
    enforced_in: src/lambda/mcp_credential_manager/index.py
    scope_enforced_in: _dispatch
    args: { clientId: "__nonexistent__" }
  setMcpCredentialTenant:
    groups: [Admin]
    kind: mutation
    conditional: mcp
    scope_checked: true
    enforced_in: src/lambda/mcp_credential_manager/index.py
    scope_enforced_in: _dispatch
    # Only when TenantGrantSource is Api; elsewhere an allowed caller is refused by
    # the mode check, and the probe id names no credential, so nothing is written.
    args: { clientId: "__nonexistent__" }

function_url_endpoints:
  ChatStreamProcessorUrl:
    auth_type: AWS_IAM
    handler: src/lambda/chat_stream_processor/app.py
    routes:
      POST /chat/document:
        groups: ANY_GROUP
        ownership: true
        equivalent_op: sendChatDocumentMessage
        enforced_in: src/lambda/chat_with_document_processor/index.py
        note: >
          the route verifies the caller's Cognito ID token (x-idp-id-token,
          _verified_caller in app.py) and answers 401 without a valid one. The
          ANY_GROUP floor is applied in the route (_require_a_group_or_403), the
          session id is registered to or checked against its owner in
          ChatSessionOwnersTable before the stream opens (_claim_session_or_403,
          403 for another user's session), and the processor's
          allowedConfigVersions scope check reads the verified email and sub it
          forwards. Nothing identity-like is read from the request body.
      POST /chat/agent:
        groups: [Admin, Author, Viewer]
        ownership: true
        equivalent_op: sendAgentChatMessage
        enforced_in: src/lambda/agent_chat_processor/index.py
        note: >
          the same verified ID token as /chat/document. The processor's
          Admin/Author/Viewer check (and the Admin-only rule under tenant
          isolation) is applied in the route before the stream opens
          (_enforce_groups_or_403) and again in the processor. The session is
          checked against its owner the same way, and the processor keys
          conversation memory on the verified sub, so a turn under another
          user's session id is refused before any memory loads. A body
          callerSub is ignored.

# ============================================================================
# MCP tools — the AgentCore Gateway target (src/lambda/agentcore_mcp_handler)
# ============================================================================
# The MCP server is a third way in, beside the REST dispatcher and the Function
# URL routes: an AgentCore Gateway whose JWT authorizer admits the clients listed
# under mcp_clients, and whose one Lambda target serves the tools below. The
# gateway forwards only tool arguments, so a request interceptor
# (src/lambda/mcp_identity_interceptor) resolves the caller, refuses a tool the
# caller may not use, and passes a signed `_caller` block to the handler, which
# verifies it and applies the caller's configuration scope.
#
# Entry schema
# ------------
#   groups:         the roles admitted. The handler and the interceptor both read
#                   the same table, idp_common.mcp_access.MCP_TOOL_POLICY, and the
#                   static scan (checks M1-M5) fails when this file and that table
#                   differ, in either direction.
#   write:          true -> the tool starts processing; a service credential must
#                   also have write tools enabled.
#   unscoped_only:  true -> the tool reads across every Configuration Profile with
#                   nothing to filter its output on, so a caller with a
#                   configuration scope is refused (Admin-only under Strict).
#   scope_checked:  true -> refuses a request naming a document or a destination
#                   profile outside the caller's scope.
#   scope_filtered: true -> returns only documents inside the caller's scope.
#   equivalent_op:  the REST operation the tool corresponds to. Its groups must
#                   admit every role this entry admits, so MCP is never the more
#                   permissive way to do the same thing.
#   enforced_in:    the tool module; it must call the shared scope helper.
mcp_clients:
  # Every Cognito client the gateway authorizer admits, and how the interceptor
  # resolves a token from it. The scan reads AgentCoreGateway's client properties
  # and the interceptor's environment and fails if either names a client this
  # list does not, so a client cannot be allowed in without a resolution rule.
  ExternalAppClient: user
  MCPConnectorClient: service

mcp_tools:
  search:
    groups: [Admin, Author, Viewer]
    write: false
    unscoped_only: true
    equivalent_op: sendAgentChatMessage
    enforced_in: src/lambda/agentcore_mcp_handler/tools/search.py
    note: >-
      Runs the analytics agent over the reporting tables, which hold rows for
      every document and cannot be filtered per row, so it is refused to any
      scoped caller. Under TenantIsolationMode=Strict every non-admin is scoped,
      which makes it Admin-only there, as Agent Chat is.
  status:
    groups: [Admin, Author, Reviewer, Viewer]
    write: false
    unscoped_only: false
    scope_filtered: true
    equivalent_op: getDocument
    enforced_in: src/lambda/agentcore_mcp_handler/tools/batch_status.py
    note: >-
      Counts and lists only the batch's documents inside the caller's scope. A
      batch with none in scope is answered exactly as a batch that does not exist.
      The four document roles, not ANY_GROUP: Annotator reaches documents only
      through test-set labelling, whose per-object control MCP does not have.
  get_results:
    groups: [Admin, Author, Reviewer, Viewer]
    write: false
    unscoped_only: false
    scope_checked: true
    scope_filtered: true
    equivalent_op: getDocument
    enforced_in: src/lambda/agentcore_mcp_handler/tools/batch_results.py
    note: >-
      Single-document mode refuses a document outside the caller's scope; batch
      mode pages over the in-scope documents only.
  process:
    groups: [Admin, Author]
    write: true
    unscoped_only: false
    scope_checked: true
    equivalent_op: uploadDocument
    enforced_in: src/lambda/agentcore_mcp_handler/tools/batch_run.py
    note: >-
      Resolves the Configuration Profile the uploaded document will process
      under exactly as uploadDocument does (prefix mappings, the requested
      profile, the active profile) and refuses one outside the caller's scope.
      Processing from an S3 location reads with the handler's own role, which
      can read every profile's documents, so it is limited to unscoped callers.
  reprocess:
    groups: [Admin, Author]
    write: true
    unscoped_only: false
    scope_checked: true
    equivalent_op: reprocessDocument
    enforced_in: src/lambda/agentcore_mcp_handler/tools/batch_reprocess.py
    note: >-
      Every named document, or every document of the named batch, must be in the
      caller's scope; one outside it refuses the whole request.

# ============================================================================
# Known gaps register — tracked deviations between the ideal authorization
# posture and current enforcement. Each id must be referenced by at least one
# operation or route above (the scan enforces that in both directions).
#
# CORRECTION: this header previously claimed every id here "is mirrored in
# security/threat-modeling/feature-threats/rbac-authentication.md
# (AUTH.T07/T08)". That is not true and never was — `grep -rn GAP-02
# security/threat-modeling/` returns nothing. What IS true: GAP-07 is recorded
# under AUTH.T14 in that document, and the retired GAP-06 is referenced under
# AUTH.T08. GAP-02 (queryKnowledgeBase) is recorded only here and in the
# published scan snapshots under security/test-results/. Giving it a threat-model
# entry is a documentation follow-up, deliberately not done on this branch
# because rbac-authentication.md is being edited concurrently.
#
# A gap entry downgrades a scan/test mismatch from FAIL to WARN; remove the
# gap (and its references) when the enforcement is fixed, and the harness
# will then hold the line.
# ============================================================================
known_gaps:
  GAP-SEC-INCONCLUSIVE-5XX:
    # Assigned by the DYNAMIC harness from the observed response, not declared on
    # an operation — so the orphan check in the static scanner (S0) verifies the
    # reference HERE instead, and fails if this file stops mentioning the id.
    assigned_by: scripts/test_api_rbac.py
    summary: >
      a 5xx makes a matrix cell INCONCLUSIVE, and a resolver refusal that raises
      a bare Exception can only reach the caller as one
    detail: >
      An authorization check establishes that a caller was refused. A 5xx
      establishes nothing: whether the resolver refused this caller before or
      after doing the work is exactly what is unknown. classify() therefore
      records a 5xx as ERROR rather than as a pass — the published 0.6.9
      snapshot contains 43 cells reading "500 OK" beneath a header claiming the
      gate passed, because the positive arms asserted only "not denied".
      It is registered here rather than left as a hard failure because the cause
      is a property of the resolvers and not a regression: the dispatcher chooses
      an HTTP status from the resolver exception's class name, so a refusal that
      raises a bare `Exception` can only map to 500 `InternalError`. This harness
      deliberately sends bogus arguments to prove auth ran before the argument
      was used, so it lands on any such site.
      Most of the backlog this gap was opened for is closed (issue #1304):
      test_set_resolver's not-found refusals now raise `ResourceNotFound` -> 404
      and its argument refusals raise `ValueError` -> 400, which is what the 15
      operations listed in that issue were 500ing on. The gap stays open because
      the condition it describes is a standing one, not a count — a bare
      `Exception` anywhere in a resolver still reaches the caller as a 5xx, and
      `scripts/tests/test_resolver_error_status_codes.py` is the offline guard
      that keeps new ones from being added. Most residual sites left at 500 are
      internal failures rather than caller-input refusals (a downstream invoke
      that failed, an unroutable field, a misconfigured env var) — but SIX are
      not, and the exception is named here rather than left as a set-wide claim
      that is false for specific members:
        - agent_request_handler/index.py:78,83,88 — missing query, query over
          100,000 characters, no agent ids
        - agent_chat_resolver/index.py:128,133,139 — missing prompt, missing
          sessionId, prompt over 100,000 characters
      Both files are dispatcher-routed (`submitAgentQuery` and
      `sendAgentChatMessage` in FIELD_FUNCTION_MAP), each site is
      `raise Exception(error_msg)`, and each is a malformed *argument*, so the
      right answer is 400 `ValueError` and NOT the 404 `ResourceNotFound` that
      issue #1304 is about. They are deliberately out of scope for it: a 400 is a
      different convention from a 404, converting them changes the status six
      caller-visible operations return, and that belongs in its own change with
      its own CHANGELOG entry. The offline guard does not catch them either — it
      matches not-found wording, and none of these is a not-found.
      While it stands, such cells are WARN: visible, counted separately, and
      never counted as passes. Everything else inconclusive — a timeout, a dead
      connection, an unreadable body — is a HARD failure, because none of those
      is a known condition of this deployment.
  GAP-02:
    summary: queryKnowledgeBase has no group check
    detail: >
      Any authenticated user (including Reviewer) can query the knowledge base
      when one is configured.
