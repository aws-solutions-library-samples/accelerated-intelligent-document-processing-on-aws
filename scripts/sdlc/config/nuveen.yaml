classes:
- $schema: https://json-schema.org/draft/2020-12/schema
  $id: Estimated2024AnnualTaxableDistributions
  x-aws-idp-document-type: Estimated2024AnnualTaxableDistributions
  type: object
  # The BOUNDARY sentence is load-bearing, not decoration (#750). Every page of
  # this document reprints the title, the logo and the full column-header block
  # (which itself carries a date, "NAV as of 10/31/2024") and paginates with a
  # BARE page number, never "Page N of M". That defeats the shipped
  # <boundary-detection-rules>: their OPENING HEADER BLOCK test is satisfied by
  # the running header and is evaluated BEFORE their CONTINUATION EVIDENCE test,
  # while a lone "7" matches none of their PAGINATION patterns. Measured on the
  # config's own classifier (us.amazon.nova-2-lite-v1:0, temperature 0): without
  # this sentence the 16-page fund table splits into 2-5 sections in 10 out of 10
  # runs; with it, 1 section in 10 out of 10. The rules' own PRECEDENCE clause is
  # what makes a class description the supported place to say this.
  description: 'Estimated 2024 Annual Taxable Distributions for Nuveen Mutual Funds.
    BOUNDARY: this is ONE continuous multi-page document - a single fund table that
    runs from the first page to the disclosures page. Every page reprints the title,
    logo and table column headers and carries only a bare page number, so only the
    page numbered 1 is "start"; every other page is "continue".'
  properties:
    FundInformation:
      type: array
      description: List of Nuveen Mutual Funds with estimated distributions
      items:
        type: object
        properties:
          FundName:
            type: string
            description: Name of the Nuveen Mutual Fund
          Ticker:
            type: string
            description: Ticker symbol of the fund
          RecordDate:
            type: string
            description: Record date for the distribution
          ExDividendDate:
            type: string
            description: Ex-Dividend date for the distribution
          PaymentDate:
            type: string
            description: Payment date for the distribution
          EstimatedShortTermCapitalGains:
            type: string
            description: Estimated short-term capital gains
          EstimatedLongTermCapitalGains:
            type: string
            description: Estimated long-term capital gains
          NAVasof10312024:
            type: string
            description: Net Asset Value as of October 31, 2024
          TotalCapGainDistributionas%ofNAV:
            type: string
            description: Total capital gain distribution as a percentage of NAV
rule_classes: []
discovery:
  without_ground_truth:
    model_id: us.amazon.nova-pro-v1:0
    system_prompt: You are an expert in processing forms. Extracting data from images and documents. Analyze
      forms line by line to identify field names, data types, and organizational structure. Focus on creating
      comprehensive blueprints for document processing without extracting actual values.
    temperature: '1.0'
    top_p: '0.1'
    max_tokens: '10000'
    user_prompt: 'This image contains forms data. Analyze the form line by line. Image may contain multiple
      pages, process all the pages. Form may contain multiple name value pair in one line. Extract all
      the names in the form including the name value pair which doesn''t have value. Organize them into
      groups, extract field_name, data_type and field description. Field names should be less than 30
      characters, use camelCase or snake_case, name should not start with number and name should not have
      special characters. Field descriptions should include location hints (box number, line number, section).
      Field_name should be unique within the group. Make sure to fill out the top-level "$id" and "x-aws-idp-document-type"
      with the extracted document class, and the top-level "description" with a brief description of the
      document class. Group the fields based on the section they are grouped in the form. Group should
      have attributeType as "group". Nesting Groups: Do not nest the groups i.e. groups within groups.
      All groups should be directly associated under main "properties". If the group repeats and follows
      table format, update the attributeType as "list". Do not extract the values. Return the extracted
      data in JSON format. Format the extracted data using the below JSON format: Format the extracted
      groups and fields using the below JSON format:'
  with_ground_truth:
    model_id: us.amazon.nova-pro-v1:0
    system_prompt: You are an expert in processing forms. Extracting data from images and documents. Use
      provided ground truth data as reference to optimize field extraction and ensure consistency with
      expected document structure and field definitions.
    temperature: '1.0'
    top_p: '0.1'
    max_tokens: '10000'
    user_prompt: 'This image contains unstructured data. Analyze the data line by line using the provided
      ground truth as reference. <GROUND_TRUTH_REFERENCE> {ground_truth_json} </GROUND_TRUTH_REFERENCE>
      Ground truth reference JSON has the fields we are interested in extracting from the document/image.
      Use the ground truth to optimize field extraction. Match field names, data types, and groupings
      from the reference. Image may contain multiple pages, process all pages. Extract all field names
      including those without values. Do not change the group name and field name from ground truth in
      the extracted data json. Add field_description field for every field which will contain instruction
      to LLM to extract the field data from the image/document. Add data_type field for every field. Make
      sure to fill out the top-level "$id" and "x-aws-idp-document-type" with the extracted document class,
      and the top-level "description" with a brief description of the document class. Nesting Groups:
      Do not nest the groups i.e. groups within groups. All groups should be directly associated under
      main "properties". If the group repeats and follows table format, update the attributeType as "list".
      Do not extract the values. Format the extracted data using the below JSON format: Format the extracted
      groups and fields using the below JSON format:'
  auto_split:
    model_id: us.anthropic.claude-opus-4-6-v1:1m
    system_prompt: You are an expert document analyst. Your task is to identify distinct document sections
      within a multi-page document package. Return only valid JSON.
    temperature: '0.0'
    top_p: '0.1'
    max_tokens: '4096'
    user_prompt: 'Analyze this multi-page document package. Identify the page boundaries where different
      document types or sections begin and end. For each distinct document section, provide: - "start":
      the first page number (1-based) - "end": the last page number (1-based) - "type": a short label
      for the document type (e.g., "W2 Form", "Letter", "Invoice") Return ONLY a JSON array, no other
      text: [{"start": 1, "end": 2, "type": "Letter"}, {"start": 3, "end": 3, "type": "Invoice"}]'
  multi_document:
    embedding_model_id: us.cohere.embed-v4:0
    analysis_model_id: us.anthropic.claude-sonnet-4-6
    temperature: '0.0'
    max_tokens: '10000'
    max_documents: '500'
    min_cluster_size: '2'
    num_sample_documents: '3'
    max_sample_size: '5'
    max_concurrent_embeddings: '5'
    max_concurrent_clusters: '3'
    system_prompt: ''
evaluation:
  enabled: true
  llm_method:
    top_p: '0.0'
    max_tokens: '4096'
    top_k: '5.0'
    task_prompt: "I need to evaluate attribute extraction for a document of class: {DOCUMENT_CLASS}. For\
      \ the attribute named \"{ATTRIBUTE_NAME}\" described as \"{ATTRIBUTE_DESCRIPTION}\": - Expected\
      \ value: {EXPECTED_VALUE} - Actual value: {ACTUAL_VALUE} Do these values match in meaning, taking\
      \ into account formatting differences, word order, abbreviations, and semantic equivalence? Provide\
      \ your assessment as a JSON with three fields: - \"match\": boolean (true if they match, false if\
      \ not) - \"score\": number between 0 and 1 representing the confidence/similarity score - \"reason\"\
      : brief explanation of your decision Respond ONLY with the JSON and nothing else. Here's the exact\
      \ format: {\n  \"match\": true or false,\n  \"score\": 0.0 to 1.0,\n  \"reason\": \"Your explanation\
      \ here\"\n}"
    temperature: '0.0'
    model: us.amazon.nova-2-lite-v1:0
    system_prompt: You are an evaluator that helps determine if the predicted and expected values match
      for document attribute extraction. You will consider the context and meaning rather than just exact
      string matching.
