# CI/CD Test 8 config (agentic extraction, large tables) — native v0.6 format.
# Converted from the pre-0.6 shape via idp_common.config.migrations.v05_to_v06.

use_bda: false
enable_blueprint_optimization: false
managed: false
test_set: null
notes: CI/CD test configuration for agentic extraction with large tables (Test 8). Processes Nuveen annual
  taxable distributions document with 532 fund items. Uses agentic extraction with deterministic table
  parsing to handle large multi-page tables with completeness validation.
ocr:
  backend: textract
  model_id: us.amazon.nova-2-lite-v1:0
  model_lambda_hook_arn: null
  system_prompt: You are an expert OCR system. Extract all text from the provided image accurately, preserving
    layout where possible.
  task_prompt: Extract all text from this document image. Preserve the layout, including paragraphs, tables,
    and formatting.
  features:
  - name: LAYOUT
  - name: TABLES
  max_workers: '20'
  image:
    target_width: null
    target_height: null
    dpi: null
    preprocessing: null
classification:
  model: us.amazon.nova-2-lite-v1:0
  model_lambda_hook_arn: null
  system_prompt: 'You are a multimodal document classification expert that analyzes business documents
    using both visual layout and textual content. Your task is to classify single-page documents into
    predefined categories based on their structural patterns, visual features, and text content. Your
    output must be valid JSON according to the requested format. <variables> <document-ocr-data>: OCR-extracted
    text content from the document page that provides textual information for classification <document-image>:
    Visual representation of the document page that provides layout, formatting, and visual structure
    information <document-types>: List of valid document types with their descriptions that the document
    must be classified into </variables>'
  task_prompt: "<task-description> Analyze the provided document using both its visual layout and textual content to determine\
    \ its document type and whether this page begins a new document or continues the previous one. </task-description>\n\
    <document-types> {CLASS_NAMES_AND_DESCRIPTIONS} </document-types>\n<classification-instructions> Follow these steps to\
    \ classify the document: 1. Examine the visual layout: headers, logos, formatting, structure, and visual organization\
    \ 2. Analyze the textual content: key phrases, terminology, purpose, and information type 3. Identify distinctive features\
    \ that match the document type descriptions 4. Decide the document_boundary by applying the <boundary-detection-rules>\
    \ below 5. Consider both visual and textual evidence together to determine the best match 6. CRITICAL: Only use document\
    \ types explicitly listed in the <document-types> section </classification-instructions>\n<boundary-detection-rules>\
    \ You are classifying ONE page at a time. Any pages shown to you as context are there only to help you judge this page;\
    \ classify only the page identified as the page to classify. \"document_boundary\" answers one question: is this page\
    \ the FIRST page of a document instance (\"start\"), or a later page of a document instance that already began on an\
    \ earlier page (\"continue\")? Decide from this page's own evidence, in priority order: 1. PAGINATION: If the page shows\
    \ pagination such as \"Page 2 of 2\", \"Page 3 of 5\", \"2/2\", or \"continued\" with a number greater than 1, this page\
    \ is NOT a first page - output \"continue\". 2. If pagination indicates the first page (for example \"Page 1 of 2\"),\
    \ output \"start\". 3. OPENING HEADER BLOCK: A first page normally carries the document's opening identity block - form\
    \ number and title, addressee name AND full address, date, account or reference numbers. Output \"start\" when this page\
    \ carries that opening block. 4. CONTINUATION EVIDENCE: A later page normally lacks the opening block and instead shows\
    \ a form number only in the footer, a table or list continuing from a previous page, or a trailing signature/consent/certification\
    \ section. Output \"continue\" for such a page. CRITICAL - no preceding page shown: If you are not shown the preceding\
    \ page, do NOT conclude that this page must be a first page. Pages are classified independently, so the absence of a\
    \ preceding page in your input tells you nothing about the document. Judge only from this page's own evidence: a page\
    \ marked \"Page 2 of 2\" is a continuation page and must be \"continue\" even when you cannot see page 1. CRITICAL -\
    \ consecutive documents of the same type: Output \"start\" whenever this page IS a first page, even when the preceding\
    \ page has the same document type. Two copies of the same form filed back to back are two separate documents, and the\
    \ first page of the second copy must be \"start\" so the two are not merged. PRECEDENCE: If the matched document type's\
    \ description in <document-types> gives explicit boundary or page-ordering instructions (for example, how to handle pages\
    \ scanned out of order), follow those instructions instead of the general rules above. If evidence is genuinely balanced,\
    \ prefer \"continue\" for a page that is clearly not a first page, and prefer \"start\" for a page that carries a complete\
    \ opening header block. </boundary-detection-rules>\n<output-format> {\n  \"classification_reason\": \"Detailed reasoning\
    \ including specific visual and textual evidence that led to this classification\",\n  \"class\": \"exact_document_type_from_list\"\
    ,\n  \"document_boundary\": \"start or continue\"\n} </output-format>\n<<CACHEPOINT>>\n<document-ocr-data> {DOCUMENT_TEXT}\
    \ </document-ocr-data>\n<document-image> {DOCUMENT_IMAGE} </document-image>\n<final-instructions> Analyze the document\
    \ above by: 1. Applying the <classification-instructions> to examine both visual and textual features 2. Selecting ONLY\
    \ from document types in <document-types> 3. Providing clear reasoning with specific evidence 4. Outputting in the exact\
    \ JSON format specified in <output-format> </final-instructions>"
  temperature: '0.0'
  top_p: '0.0'
  top_k: '5.0'
  max_tokens: '4096'
  maxPagesForClassification: ALL
  classificationMethod: multimodalPageLevelClassification
  sectionSplitting: llm_determined
  contextPagesCount: '0'
  image:
    target_width: null
    target_height: null
    dpi: null
    preprocessing: null
extraction:
  model: us.anthropic.claude-sonnet-4-6
  model_lambda_hook_arn: null
  system_prompt: You are a document assistant. Respond only with JSON. Never make up data, only provide
    data found in the document being provided.
  task_prompt: "<background> You are an expert in document analysis and information extraction.  You can\
    \ understand and extract key information from documents classified as type: \n{DOCUMENT_CLASS}. </background>\n\
    <task> Your task is to take the unstructured text provided and convert it into a well-organized table\
    \ format using JSON. Identify the main entities, attributes, or categories mentioned in the attributes\
    \ list below and use them as keys in the JSON object.  Then, extract the relevant information from\
    \ the text and populate the corresponding values in the JSON object. </task>\n<extraction-guidelines>\
    \ Guidelines:\n    1. Ensure that the data is accurately represented and properly formatted within\n\
    \    the JSON structure\n    2. Include double quotes around all keys and values\n    3. Do not make\
    \ up data - only extract information explicitly found in the\n    document\n    4. Do not use /n for\
    \ new lines, use a space instead\n    5. If a field is not found or if unsure, return null\n    6.\
    \ All dates should be in MM/DD/YYYY format\n    7. Do not perform calculations or summations unless\
    \ totals are explicitly given\n    8. If an alias is not found in the document, return null\n    9.\
    \ Guidelines for checkboxes:\n     9.A. CAREFULLY examine each checkbox, radio button, and selection\
    \ field:\n        - Look for marks like ✓, ✗, x, filled circles (●), darkened areas, or handwritten\
    \ checks indicating selection\n        - For checkboxes and multi-select fields, ONLY INCLUDE options\
    \ that show clear visual evidence of selection\n        - DO NOT list options that have no visible\
    \ selection mark\n     9.B. For ambiguous or overlapping tick marks:\n        - If a mark overlaps\
    \ between two or more checkboxes, determine which option contains the majority of the mark\n     \
    \   - Consider a checkbox selected if the mark is primarily inside the check box or over the option\
    \ text\n        - When a mark touches multiple options, analyze which option was most likely intended\
    \ based on position and density. For handwritten checks, the mark typically flows from the selected\
    \ checkbox outward.\n        - Carefully analyze visual cues and contextual hints. Think from a human\
    \ perspective, anticipate natural tendencies, and apply thoughtful reasoning to make the best possible\
    \ judgment.\n    10. Think step by step first and then answer.\n</extraction-guidelines>\nIf the attributes\
    \ section below contains a list of attribute names and descriptions, then output only those attributes,\
    \ using the provided descriptions as guidance for finding the correct values. \n<attributes> {ATTRIBUTE_NAMES_AND_DESCRIPTIONS}\
    \ </attributes>\n<<CACHEPOINT>>\n<document-text> {DOCUMENT_TEXT} </document-text>\n<document_image>\
    \ {DOCUMENT_IMAGE} </document_image>\n<final-instructions> Extract key information from the document\
    \ and return a JSON object with the following key steps: 1. Carefully analyze the document text to\
    \ identify the requested attributes 2. Extract only information explicitly found in the document -\
    \ never make up data 3. Format all dates as MM/DD/YYYY and replace newlines with spaces 4. For checkboxes,\
    \ only include options with clear visual selection marks 5. Use null for any fields not found in the\
    \ document 6. Ensure the output is properly formatted JSON with quoted keys and values 7. Think step\
    \ by step before finalizing your answer </final-instructions>"
  temperature: '0.0'
  top_p: '0.0'
  top_k: '5.0'
  max_tokens: '64000'
  image:
    target_width: null
    target_height: null
    dpi: null
    preprocessing: null
  agentic:
    enabled: true
    review_agent: false
    review_agent_model: us.anthropic.claude-sonnet-4-6
    max_concurrent_batches: '1'
    table_parsing:
      enabled: true
      min_confidence_threshold: '95.0'
      min_parse_success_rate: '0.9'
      use_confidence_data: true
      max_empty_line_gap: '3'
      auto_merge_adjacent_tables: true
  custom_prompt_lambda_arn: null
  mode: advanced
  confidence:
    mode: 'off'
    model: us.amazon.nova-lite-v1:0
    model_lambda_hook_arn: null
    system_prompt: You are a document analysis assessment expert. Your role is to evaluate the confidence
      and accuracy of data extraction results by analyzing them against source documents. Provide accurate
      confidence scores for each assessment. When bounding boxes are requested, provide precise coordinate
      locations where information appears in the document.
    temperature: '0.0'
    top_p: '0.0'
    top_k: '5.0'
    image:
      target_width: null
      target_height: null
      dpi: null
      preprocessing: null
    task_prompt: "<background> You are an expert document analysis assessment system. Your task is to\
      \ evaluate the confidence of extraction results for a document of class {DOCUMENT_CLASS} and provide\
      \ precise spatial localization for each field. </background>\n<task> Analyze the extraction results\
      \ against the source document and provide confidence assessments AND bounding box coordinates for\
      \ each extracted attribute. Consider factors such as: 1. Text clarity and OCR quality in the source\
      \ regions  2. Alignment between extracted values and document content  3. Presence of clear evidence\
      \ supporting the extraction  4. Potential ambiguity or uncertainty in the source material  5. Completeness\
      \ and accuracy of the extracted information 6. Precise spatial location of each field in the document\
      \ </task>\n<assessment-guidelines> For each attribute, provide:  - A confidence score between 0.0\
      \ and 1.0 where:\n   - 1.0 = Very high confidence, clear and unambiguous evidence\n   - 0.8-0.9\
      \ = High confidence, strong evidence with minor uncertainty\n   - 0.6-0.7 = Medium confidence, reasonable\
      \ evidence but some ambiguity\n   - 0.4-0.5 = Low confidence, weak or unclear evidence\n   - 0.0-0.3\
      \ = Very low confidence, little to no supporting evidence\n- A clear explanation of the confidence\
      \ reasoning - Precise spatial coordinates where the field appears in the document\nGuidelines: \
      \ - Base assessments on actual document content and OCR quality  - Consider both text-based evidence\
      \ and visual/layout clues  - Account for OCR confidence scores when provided  - Be objective and\
      \ specific in reasoning  - If an extraction appears incorrect, score accordingly with explanation\
      \ - Provide tight, accurate bounding boxes around the actual text </assessment-guidelines>\n<spatial-localization-guidelines>\
      \ For each field, provide bounding box coordinates: - bbox: [x1, y1, x2, y2] coordinates in normalized\
      \ 0-1000 scale - page: Page number where the field appears (starting from 1)\nCoordinate system:\
      \ - Use normalized scale 0-1000 for both x and y axes - x1, y1 = top-left corner of bounding box\
      \   - x2, y2 = bottom-right corner of bounding box - Ensure x2 > x1 and y2 > y1 - Make bounding\
      \ boxes tight around the actual text content - If a field spans multiple lines, create a bounding\
      \ box that encompasses all relevant text </spatial-localization-guidelines>\n<final-instructions>\
      \ Analyze the extraction results against the source document and provide confidence assessments\
      \ with spatial localization. Return a JSON object with the following structure based on the attribute\
      \ type:\nFor SIMPLE attributes:  {\n  \"simple_attribute_name\": {\n    \"confidence\": 0.85,\n\
      \    \"bbox\": [100, 200, 300, 250],\n    \"page\": 1\n  }\n}\nFor GROUP attributes (nested object\
      \ structure):  {\n  \"group_attribute_name\": {\n    \"sub_attribute_1\": {\n      \"confidence\"\
      : 0.90,\n      \"bbox\": [150, 300, 250, 320],\n      \"page\": 1\n    },\n    \"sub_attribute_2\"\
      : {\n      \"confidence\": 0.75,\n      \"bbox\": [150, 325, 280, 345],\n      \"page\": 1\n   \
      \ }\n  }\n}\nFor LIST attributes (array of assessed items):  {\n  \"list_attribute_name\": [\n \
      \   {\n      \"item_attribute_1\": {\n        \"confidence\": 0.95,\n        \"bbox\": [100, 400,\
      \ 200, 420],\n        \"page\": 1\n      },\n      \"item_attribute_2\": {\n        \"confidence\"\
      : 0.88,\n        \"bbox\": [250, 400, 350, 420],\n        \"page\": 1\n      }\n    },\n    {\n\
      \      \"item_attribute_1\": {\n        \"confidence\": 0.92,\n        \"bbox\": [100, 425, 200,\
      \ 445],\n        \"page\": 1\n      },\n      \"item_attribute_2\": {\n        \"confidence\": 0.70,\n\
      \        \"bbox\": [250, 425, 350, 445],\n        \"page\": 1\n      }\n    }\n  ]\n}\nIMPORTANT:\
      \   - For LIST attributes like \"Transactions\", assess EACH individual item in the list separately\
      \ with individual bounding boxes - Each transaction should be assessed as a separate object in the\
      \ array with its own spatial coordinates - Do NOT provide aggregate assessments for list items -\
      \ assess each one individually with precise locations - Include assessments AND bounding boxes for\
      \ ALL attributes present in the extraction results - Match the exact structure of the extracted\
      \ data - Provide page numbers for all bounding boxes (starting from 1) </final-instructions>\n<<CACHEPOINT>>\n\
      <document-image> {DOCUMENT_IMAGE} </document-image>\n<ocr-text-confidence-results> {OCR_TEXT_CONFIDENCE}\
      \ </ocr-text-confidence-results>\n<<CACHEPOINT>>\n<attributes-definitions> {ATTRIBUTE_NAMES_AND_DESCRIPTIONS}\
      \ </attributes-definitions>\n<extraction-results> {EXTRACTION_RESULTS} </extraction-results>"
summarization:
  enabled: false
  model: us.amazon.nova-pro-v1:0
  model_lambda_hook_arn: null
  system_prompt: 'You are a document summarization expert who can analyze and summarize documents from
    various domains including medical, financial, legal, and general business documents. Your task is
    to create a summary that captures the key information, main points, and important details from the
    document. Your output must be in valid JSON format. \nSummarization Style: Balanced\\nCreate a balanced
    summary that provides a moderate level of detail. Include the main points and key supporting information,
    while maintaining the document''s overall structure. Aim for a comprehensive yet concise summary.\n
    Your output MUST be in valid JSON format with markdown content. You MUST strictly adhere to the output
    format specified in the instructions.'
  task_prompt: "<document-text> {DOCUMENT_TEXT} </document-text>\n<extracted-attributes> {EXTRACTION_RESULTS}\
    \ </extracted-attributes>\nAnalyze the provided document (<document-text>) along with the extracted\
    \ attributes (<extracted-attributes>) to create a comprehensive and accurate summary.\nCRITICAL INSTRUCTION:\
    \ You MUST return your response as valid JSON with the EXACT structure shown at the end of these instructions.\
    \ Do not include any explanations, notes, or text outside of the JSON structure.\nCreate a summary\
    \ that captures the essential information from the document. Your summary should:\n1. **Integrate\
    \ Extracted Attributes**: Begin with a \"Key Information\" section that highlights the most important\
    \ extracted attributes in a structured format (use tables or lists as appropriate)\n2. **Validate\
    \ and Reference**: Cross-reference the document text with extracted values to ensure accuracy. When\
    \ mentioning specific values, prefer the extracted attributes when they are available\n3. **Maintain\
    \ Document Structure**: Preserve the original document's organizational structure where appropriate,\
    \ using the extracted attributes to enhance each section\n4. **Highlight Critical Data**: Emphasize\
    \ important extracted values such as:\n   - Names, addresses, and identification numbers\n   - Dates\
    \ and time periods\n   - Monetary amounts and financial figures\n   - Status indicators and classifications\n\
    \   - Any calculated or derived values\n\n5. **Use Markdown Formatting**: Apply markdown for better\
    \ readability:\n   - Use headers (##, ###) for sections\n   - Create tables for structured data from\
    \ extracted attributes\n   - Use **bold** for important values and *italics* for emphasis\n   - Create\
    \ lists (bullet or numbered) for multiple items\n\n6. **Provide Context**: For each extracted value\
    \ mentioned, provide brief context from the document text to explain its significance\n7. **Citation\
    \ System**: Cite all facts using inline citations in the format [Cite-X, Page-Y] where X is a sequential\
    \ citation number and Y is the page number. Format citations as markdown links: [[Cite-1, Page-3]](#cite-1-page-3)\n\
    8. **Data Completeness**: If extracted attributes are missing or empty, note this in the summary and\
    \ rely more heavily on the document text\n9. **References Section**: At the end, include a \"References\"\
    \ section listing all citations with their exact text from the source document\nStructure your summary\
    \ as follows: - **Key Information** (from extracted attributes) - **Document Overview** - **Detailed\
    \ Sections** (based on document structure) - **Summary and Conclusions** - **References**\nOutput\
    \ Format:\nYou MUST return ONLY valid JSON with the following structure and nothing else:\n```json\
    \ {\n  \"summary\": \"A comprehensive summary in markdown format that integrates extracted attributes\
    \ with document text, includes inline citations linked to a references section at the bottom\"\n}\
    \ ```\nDo not include any text, explanations, or notes outside of this JSON structure. The JSON must\
    \ be properly formatted and parseable."
  temperature: '0.0'
  top_p: '0.0'
  top_k: '5.0'
  max_tokens: '4096'
rule_validation:
  enabled: false
  semaphore: '5'
  max_chunk_size: '8000'
  token_size: '4'
  overlap_percentage: '10'
  response_prefix: <response>
  recommendation_options: null
  extraction_results: null
  fact_extraction: null
  rule_validation_orchestrator: null
agents:
  error_analyzer:
    model_id: us.anthropic.claude-sonnet-4-20250514-v1:0
    error_patterns:
    - ERROR
    - CRITICAL
    - FATAL
    - Exception
    - Traceback
    - Failed
    - Timeout
    - AccessDenied
    - ThrottlingException
    system_prompt: "You are an intelligent error analysis agent for the GenAI IDP system with access to\
      \ specialized diagnostic tools.\n\nGENERAL TROUBLESHOOTING WORKFLOW:\n1. Identify document status\
      \ from DynamoDB\n2. Find any errors reported during Step Function execution\n3. Collect relevant\
      \ logs from CloudWatch\n4. Identify any performance issues from X-Ray traces\n5. Provide root cause\
      \ analysis based on the collected information\n\nTOOL SELECTION STRATEGY:\n- If user provides a\
      \ filename: Use cloudwatch_document_logs and dynamodb_status for document-specific analysis\n- For\
      \ system-wide issues: Use cloudwatch_logs and dynamodb_query\n- For execution context: Use lambda_lookup\
      \ or stepfunction_details\n- For distributed tracing: Use xray_trace or xray_performance_analysis\n\
      \nALWAYS format your response with exactly these three sections in this order:\n\n## Root Cause\n\
      Identify the specific underlying technical reason why the error occurred. Focus on the primary cause,\
      \ not symptoms.\n\n## Recommendations\nProvide specific, actionable steps to resolve the issue.\
      \ Limit to top three recommendations only.\n\n<details>\n<summary><strong>Evidence</strong></summary>\n\
      \nFormat evidence with source information. Include relevant data from tool responses:\n\n**For CloudWatch\
      \ logs:**\n**Log Group:** [full log_group name]\n**Log Stream:** [full log_stream name]\n```\n[ERROR]\
      \ timestamp message\n```\n\n**For other sources (DynamoDB, Step Functions, X-Ray):**\n**Source:**\
      \ [service name and resource]\n```\nRelevant data from tool response\n```\n\n</details>\n\nFORMATTING\
      \ RULES:\n- Use the exact three-section structure above\n- Make Evidence section collapsible using\
      \ HTML details tags\n- Include relevant data from all tool responses (CloudWatch, DynamoDB, Step\
      \ Functions, X-Ray)\n- For CloudWatch: Show complete log group and log stream names without truncation\n\
      - Present evidence data in code blocks with appropriate source labels\n  \nANALYSIS GUIDELINES:\n\
      - Use multiple tools for comprehensive analysis when needed\n- Start with document-specific tools\
      \ for targeted queries\n- Use system-wide tools for pattern analysis\n- Combine DynamoDB status\
      \ with CloudWatch logs for complete picture\n- Leverage X-Ray for distributed system issues\n\n\
      ROOT CAUSE DETERMINATION:\n1. Document Status: Check dynamodb_status first\n2. Execution Details:\
      \ Use stepfunction_details for workflow failures\n3. Log Analysis: Use cloudwatch_document_logs\
      \ or cloudwatch_logs for error details\n4. Distributed Tracing: Use xray_performance_analysis for\
      \ service interaction issues\n5. Context: Use lambda_lookup for execution environment\n\nRECOMMENDATION\
      \ GUIDELINES:\nFor code-related issues or system bugs:\n- Do not suggest code modifications\n- Include\
      \ error details, timestamps, and context\n\nFor configuration-related issues:\n- Direct users to\
      \ UI configuration panel\n- Specify exact configuration section and parameter names\n\nFor operational\
      \ issues:\n- Provide immediate troubleshooting steps\n- Include preventive measures\n\nTIME RANGE\
      \ PARSING:\n- recent: 1 hour\n- last week: 168 hours  \n- last day: 24 hours\n- No time specified:\
      \ 24 hours (default)\n\nIMPORTANT: Do not include any search quality reflections, search quality\
      \ scores, or meta-analysis sections in your response. Only provide the three required sections:\
      \ Root Cause, Recommendations, and Evidence."
    parameters:
      max_log_events: '5'
      time_range_hours_default: '24'
      max_log_message_length: '400'
      max_events_per_log_group: '5'
      max_log_groups: '20'
      max_stepfunction_timeline_events: '3'
      max_stepfunction_error_length: '400'
      xray_slow_segment_threshold_ms: '5000'
      xray_error_rate_threshold: '0.05'
      xray_response_time_threshold_ms: '10000'
  chat_companion:
    model_id: us.anthropic.claude-haiku-4-5-20251001-v1:0
    error_patterns:
