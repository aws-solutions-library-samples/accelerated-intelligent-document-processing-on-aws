AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation template for GitLab role and permissions'

Parameters:
  AppId:
    Type: String
    Description: Application identifier
    Default: idp
  EnvId:
    Type: String
    Description: Environment identifier
    Default: sdlc
  GitLabGroupName:
    Type: String
    Description: GitLab group name
    AllowedPattern: .+
    ConstraintDescription: GitLab group name must be provided
  GitLabProjectName:
    Type: String
    Description: GitLab project name
    AllowedPattern: .+
    ConstraintDescription: GitLab project name must be provided
  SourceCodeBucket:
    Type: String
    Description: Source code bucket name
    AllowedPattern: .+
    Default: genaiic-sdlc-sourcecode-YOUR_AWS_ACCOUNT-YOUR_REGION
    ConstraintDescription: Source code bucket must be provided

Resources:
  GitLabRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: "Explicit role name is required for GitLab integration and cross-account access patterns"
    Properties:
      RoleName: !Sub "${AppId}-${EnvId}-GitLab"
      Description: Role to allow GitLab access.
      MaxSessionDuration: 7200
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: arn:aws:iam::979517299116:role/gitlab-runners-prod
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                'aws:PrincipalTag/GitLab:Group': !Ref GitLabGroupName
                'aws:PrincipalTag/GitLab:Project': !Ref GitLabProjectName
          - Effect: Allow
            Principal:
              AWS: arn:aws:iam::979517299116:role/gitlab-runners-prod
            Action: sts:TagSession
            Condition:
              StringEquals:
                'aws:PrincipalTag/GitLab:Group': !Ref GitLabGroupName
                'aws:PrincipalTag/GitLab:Project': !Ref GitLabProjectName
          # Self-assume: lets the integration-test MONITOR re-assume this role
          # mid-run to mint a fresh 1h session before its role-chained creds
          # expire (AWS hard-caps each chained session at 1h). Without this the
          # monitor can only watch ~60 min; the pipeline runs longer. The role
          # can only re-assume ITSELF, so this grants no new privilege.
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                'aws:PrincipalArn': !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppId}-${EnvId}-GitLab"
          # ...and TagSession for that same self-assume. The GitLab session
          # carries TRANSITIVE tags (GitLab:Group/Project, set by
          # gitlab-runners-prod at the first assume). Transitive tags cannot be
          # dropped and are auto-re-applied on every downstream assume, so the
          # self-re-assume implicitly needs sts:TagSession too. Without this the
          # refresh fails with AccessDenied on TagSession, the monitor's 1h creds
          # expire mid-run, and a SUCCESSFUL deploy paints the job red.
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: sts:TagSession
            Condition:
              StringEquals:
                'aws:PrincipalArn': !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppId}-${EnvId}-GitLab"
      Policies:
        # IDENTITY-side grant for the monitor's mid-run self-re-assume. The
        # trust (resource) policy above allows the self-assume, but AssumeRole
        # and — crucially — TagSession are BOTH checked against the CALLER's
        # identity policy too. The GitLab session carries transitive tags
        # (GitLab:Group/Project) that auto-reapply on every downstream assume,
        # so the re-assume needs BOTH actions here. Without this the refresh
        # fails with AccessDenied on sts:TagSession (trust-policy grant alone is
        # NOT sufficient — TagSession requires the identity side as well), the
        # monitor's 1h creds expire mid-run, and a SUCCESSFUL deploy can't be
        # watched to completion. Scoped to re-assuming ONLY this same role.
        - PolicyName: SelfAssumeForCredentialRefresh
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SelfReAssumeAndTag
                Effect: Allow
                Action:
                  - sts:AssumeRole
                  - sts:TagSession
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppId}-${EnvId}-GitLab"
        - PolicyName: S3PutObjectPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PutSoruceCode
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${SourceCodeBucket}/deploy/code.zip"
        - PolicyName: CodePipelineMonitorPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CodePipelineAccess
                Effect: Allow
                Action:
                  - codepipeline:GetPipelineState
                  - codepipeline:GetPipeline
                  - codepipeline:GetPipelineExecution
                  - codepipeline:ListPipelineExecutions
                  - codepipeline:ListPipelines
                  - codepipeline:ListActionExecutions
                Resource: !Sub "arn:${AWS::Partition}:codepipeline:*:${AWS::AccountId}:*"
        - PolicyName: CodeBuildAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CodeBuildAccess
                Effect: Allow
                Action:
                  - codebuild:BatchGetBuilds
                Resource: !Sub "arn:${AWS::Partition}:codebuild:*:${AWS::AccountId}:project/*"
        - PolicyName: CloudWatchLogsAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudWatchLogsAccess
                Effect: Allow
                Action:
                  - logs:GetLogEvents
                  - logs:DescribeLogStreams
                  - logs:DescribeLogGroups
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:*"
                  - !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:*:log-stream:*"
Outputs:
  GitLabRoleArn:
    Description: ARN of the GitLab IAM Role
    Value: !GetAtt GitLabRole.Arn
  GitLabRoleName:
    Description: Name of the GitLab IAM Role
    Value: !Ref GitLabRole