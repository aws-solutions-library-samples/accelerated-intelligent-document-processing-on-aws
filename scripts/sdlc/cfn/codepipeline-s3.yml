AWSTemplateFormatVersion: '2010-09-09'
Description: 'CodePipeline for deployment automation'

Parameters:
  PipelineName:
    Type: String
    Description: 'Name of the CodePipeline'
    Default: genaiic-sdlc-deploy-pipeline

  BucketNamePrefix:
    Type: String
    Description: 'Prefix for the S3 bucket name'
    Default: genaiic-sdlc-sourcecode

  FailureAgentRoleName:
    Type: String
    Description: 'Name of the read-only role the CI failure-analysis agent assumes. Created by scripts/sdlc/cfn/sdlc-iam-role.yml as <BuilderRoleName>-failure-agent; must match that stack.'
    Default: genaiic-sdlc-role-failure-agent
  
  FileKey:
    Type: String
    Description: 'S3 key of the deployment asset file'
    Default: deploy/code.zip
    
  CodeBuildRoleArn:
    Type: String
    Description: 'Optional ARN of an existing IAM role for CodeBuild. If not provided, a new role will be created.'
    Default: ''
    
  KMSKeyArn:
    Type: String
    Description: 'ARN of customer-managed KMS key for encrypting CodePipeline artifacts'
    Default: ''

  VpcId:
    Type: String
    Description: '(Optional) VPC ID for CodeBuild to run in private network'
    Default: ''

  PrivateSubnetIds:
    Type: CommaDelimitedList
    Description: '(Optional) Private subnet IDs for CodeBuild VPC config'
    Default: ''

  CodeBuildSecurityGroupId:
    Type: String
    Description: '(Optional) Security group for CodeBuild VPC config'
    Default: ''

  FailureNotificationEmail:
    Type: String
    Description: >-
      (Optional) Email address subscribed to CI failure notifications. The
      deployment script publishes the AI failure root-cause summary to an SNS
      topic on every failed run; the subscription must be confirmed once via
      the email AWS sends. Additional subscribers can be added to the topic
      manually.
    Default: ''

  CreateTestVpc:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: >-
      Create a PERSISTENT test VPC (2 private subnets, NAT egress, a Lambda
      security group, and an execute-api interface endpoint) owned by this
      pipeline stack and reused by every CI run. The deployment-variant probes
      that require a VPC (headless Jobs API, PRIVATE API Gateway hosting)
      reference it instead of standing up a throwaway VPC per run — so no probe
      creates/destroys VPCs, they all run in parallel, and the account's 5-VPC
      quota is never exhausted. Its ids are handed to CodeBuild as
      IDP_TEST_VPC_ID / IDP_TEST_PRIVATE_SUBNET_IDS / IDP_TEST_LAMBDA_SG_ID /
      IDP_TEST_APIGW_VPCE_ID. Set 'false' to skip it (VPC-requiring probes then
      skip themselves with a logged note). NOTE: a NAT gateway carries a small
      standing cost (~US$32/mo + data) — this is the deliberate trade for
      quota-safe, fully-parallel VPC probes.

  TestVpcCidr:
    Type: String
    Default: 10.30.0.0/16
    Description: CIDR for the persistent CI test VPC (must not overlap other VPCs).

Conditions:
  CreateKMSKey: !Equals [!Ref KMSKeyArn, '']
  CreateCodeBuildRole: !Equals [!Ref CodeBuildRoleArn, '']
  DeployInVPC: !Not [!Equals [!Ref VpcId, '']]
  HasNotificationEmail: !Not [!Equals [!Ref FailureNotificationEmail, '']]
  MakeTestVpc: !Equals [!Ref CreateTestVpc, 'true']

Resources:
  # ==========================================================================
  # Persistent CI test VPC (gated by CreateTestVpc, default true)
  #
  # Owned by THIS pipeline stack and reused by every CI run — the harness never
  # creates or destroys a VPC. Deployment-variant probes that require a VPC
  # (headless Jobs API, PRIVATE API Gateway hosting) reference these ids, passed
  # to CodeBuild as env vars below. This is the same topology as the retired
  # per-run scripts/sdlc/apigw-hosting-test-vpc.yaml (2 private subnets across
  # AZs, NAT egress, a Lambda SG, one execute-api interface endpoint), but
  # standing rather than throwaway, so:
  #   * no VPC create/destroy churn or ENI-leak teardown failures per run,
  #   * VPC probes run fully in parallel with everything else (no quota gating),
  #   * concurrent pipelines share it read-only (probes reference, never mutate).
  # Test fixture: no flow logs, permissive egress.
  # ==========================================================================
  TestVpc:
    Type: AWS::EC2::VPC
    Condition: MakeTestVpc
    # checkov:skip=CKV_AWS_178: "VPC flow logs not required for a persistent CI test VPC."
    Properties:
      CidrBlock: !Ref TestVpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-test-vpc"

  TestVpcPrivateSubnet1:
    Type: AWS::EC2::Subnet
    Condition: MakeTestVpc
    Properties:
      VpcId: !Ref TestVpc
      CidrBlock: !Select [0, !Cidr [!Ref TestVpcCidr, 4, 8]]
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-test-private-1"

  TestVpcPrivateSubnet2:
    Type: AWS::EC2::Subnet
    Condition: MakeTestVpc
    Properties:
      VpcId: !Ref TestVpc
      CidrBlock: !Select [1, !Cidr [!Ref TestVpcCidr, 4, 8]]
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-test-private-2"

  # Public subnet hosting the NAT gateway.
  TestVpcPublicSubnet:
    Type: AWS::EC2::Subnet
    Condition: MakeTestVpc
    Properties:
      VpcId: !Ref TestVpc
      CidrBlock: !Select [2, !Cidr [!Ref TestVpcCidr, 4, 8]]
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-test-public"

  TestVpcInternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: MakeTestVpc
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-test-igw"

  TestVpcIGWAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: MakeTestVpc
    Properties:
      VpcId: !Ref TestVpc
      InternetGatewayId: !Ref TestVpcInternetGateway

  TestVpcPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: MakeTestVpc
    Properties:
      VpcId: !Ref TestVpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-test-public-rt"

  TestVpcPublicDefaultRoute:
    Type: AWS::EC2::Route
    Condition: MakeTestVpc
    DependsOn: TestVpcIGWAttachment
    Properties:
      RouteTableId: !Ref TestVpcPublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref TestVpcInternetGateway

  TestVpcPublicSubnetRTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: MakeTestVpc
    Properties:
      SubnetId: !Ref TestVpcPublicSubnet
      RouteTableId: !Ref TestVpcPublicRouteTable

  TestVpcNATGatewayEIP:
    Type: AWS::EC2::EIP
    Condition: MakeTestVpc
    Properties:
      Domain: vpc

  TestVpcNATGateway:
    Type: AWS::EC2::NatGateway
    Condition: MakeTestVpc
    Properties:
      AllocationId: !GetAtt TestVpcNATGatewayEIP.AllocationId
      SubnetId: !Ref TestVpcPublicSubnet
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-test-nat"

  TestVpcPrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: MakeTestVpc
    Properties:
      VpcId: !Ref TestVpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-test-private-rt"

  TestVpcPrivateDefaultRoute:
    Type: AWS::EC2::Route
    Condition: MakeTestVpc
    Properties:
      RouteTableId: !Ref TestVpcPrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref TestVpcNATGateway

  TestVpcPrivateSubnet1RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: MakeTestVpc
    Properties:
      SubnetId: !Ref TestVpcPrivateSubnet1
      RouteTableId: !Ref TestVpcPrivateRouteTable

  TestVpcPrivateSubnet2RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: MakeTestVpc
    Properties:
      SubnetId: !Ref TestVpcPrivateSubnet2
      RouteTableId: !Ref TestVpcPrivateRouteTable

  # Security group for in-VPC IDP Lambdas. Allows all outbound (reaches AWS
  # services via NAT); passed as the IDP stack's LambdaSecurityGroupId.
  TestVpcLambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: MakeTestVpc
    # checkov:skip=CKV_AWS_382: "Test VPC — permissive egress so Lambdas reach AWS services via NAT."
    Properties:
      GroupDescription: !Sub "${AWS::StackName} IDP Lambda SG (CI test VPC)"
      VpcId: !Ref TestVpc
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: "Allow all outbound (AWS services via NAT)"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-test-lambda-sg"

  # Security group for the execute-api interface endpoint: allow 443 from the
  # VPC CIDR so in-VPC clients (and the private REST API's callers) reach it.
  TestVpcEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: MakeTestVpc
    Properties:
      GroupDescription: !Sub "${AWS::StackName} execute-api VPCE SG (CI test VPC)"
      VpcId: !Ref TestVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref TestVpcCidr
          Description: "HTTPS from within the VPC"
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: "Allow all outbound"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-test-vpce-sg"

  # The single interface endpoint the PRIVATE REST API / headless Jobs API
  # require. Private DNS makes "<api-id>.execute-api.<region>.amazonaws.com"
  # resolve to this VPCE inside the VPC.
  TestVpcExecuteApiEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: MakeTestVpc
    Properties:
      VpcId: !Ref TestVpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.execute-api"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref TestVpcPrivateSubnet1
        - !Ref TestVpcPrivateSubnet2
      SecurityGroupIds:
        - !Ref TestVpcEndpointSecurityGroup

  PipelineKMSKey:
    Type: AWS::KMS::Key
    Condition: CreateKMSKey
    Properties:
      Description: 'KMS key for CodePipeline artifact encryption'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: Allow CodePipeline Service
            Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action:
              - 'kms:Decrypt'
              - 'kms:GenerateDataKey'
            Resource: '*'
          - Sid: Allow CodeBuild Service
            Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action:
              - 'kms:Decrypt'
              - 'kms:GenerateDataKey'
            Resource: '*'

  PipelineKMSKeyAlias:
    Type: AWS::KMS::Alias
    Condition: CreateKMSKey
    Properties:
      AliasName: !Sub 'alias/${PipelineName}-key'
      TargetKeyId: !Ref PipelineKMSKey

  CodePipelineRole:
      Type: 'AWS::IAM::Role'
      Properties:
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: codepipeline.amazonaws.com
              Action: 'sts:AssumeRole'
        Policies:
          - PolicyName: CodePipelinePolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - 's3:GetObject'
                    - 's3:GetObjectVersion'
                    - 's3:GetBucketVersioning'
                    - 's3:ListBucket'
                    - 's3:PutObject'
                  Resource:
                    - !Sub 'arn:aws:s3:::${BucketNamePrefix}-${AWS::AccountId}-${AWS::Region}/*'
                    - !Sub 'arn:aws:s3:::${ArtifactBucket}/*'
                    - !Sub 'arn:aws:s3:::${BucketNamePrefix}-${AWS::AccountId}-${AWS::Region}'
                    - !Sub 'arn:aws:s3:::${ArtifactBucket}'
                - Effect: Allow
                  Action:
                    - 'codebuild:BatchGetBuilds'
                    - 'codebuild:StartBuild'
                  Resource: !GetAtt IdkInstallCodeBuild.Arn
                - Effect: Allow
                  Action:
                    - 'kms:Decrypt'
                    - 'kms:GenerateDataKey'
                  Resource: !If [CreateKMSKey, !GetAtt PipelineKMSKey.Arn, !Ref KMSKeyArn]

  CodeBuildRole:
    Type: 'AWS::IAM::Role'
    Condition: CreateCodeBuildRole
    # checkov:skip=CKV_AWS_111: "This role requires specific permissions for CodeBuild deployment operations"
    # checkov:skip=CKV_AWS_109: "SDLC deployment role requires IAM permissions for infrastructure provisioning - access restricted to idp-* resources"
    # checkov:skip=CKV_AWS_110: "SDLC deployment role requires IAM permissions for infrastructure provisioning - access restricted to idp-* resources"
    # checkov:skip=CKV_AWS_107: "This role requires access to resources for deployment operations"
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: F3
            reason: "CodeBuild role requires broad permissions for dynamic deployment operations. Scoped to SDLC pipeline only. All operations logged in CloudTrail."
          - id: W11
            reason: "Some IAM List/Get operations and service-linked roles require wildcard resources"
    Properties:
      MaxSessionDuration: 14400  # 4 hours - allows tests to run beyond default 60-minute token expiration
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: CloudFormationAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:*
                Resource: 
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/idp-*'
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/idp-*/*'
              # ValidateTemplate and ListStacks don't support resource-level
              # permissions (list/global ops), so they need Resource '*'.
              # ListStacks is used by the startup reapers
              # (cleanup_stale_idp_stacks / _buckets / _apigw_test_vpcs) to find
              # leaked stacks from interrupted prior runs; without it those
              # reapers fail with AccessDenied (best-effort, but noisy) and can't
              # converge leaked resources.
              - Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - cloudformation:ListStacks
                Resource: '*'
        - PolicyName: LimitedIAMAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Read-only IAM operations (require wildcard)
              - Effect: Allow
                Action:
                  - iam:Get*
                  - iam:List*
                Resource: '*'
              # Write IAM operations (scoped to IDP resources)
              - Effect: Allow
                Action:
                  - iam:*
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/idp-*'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:policy/idp-*'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:instance-profile/idp-*'
              # PassRole for CloudFormation service role
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/idp-*'
                Condition:
                  StringEquals:
                    iam:PassedToService: 
                      - cloudformation.amazonaws.com
                      - lambda.amazonaws.com
                      - states.amazonaws.com
                      - appsync.amazonaws.com
                      - bedrock.amazonaws.com
              # Service-linked roles
              - Effect: Allow
                Action:
                  - iam:CreateServiceLinkedRole
                  - iam:DeleteServiceLinkedRole
                  - iam:GetServiceLinkedRoleDeletionStatus
                Resource: 'arn:aws:iam::*:role/aws-service-role/*'
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # SDLC source bucket
              - Effect: Allow
                Action:
                  - s3:*
                Resource:
                  - !Sub 'arn:aws:s3:::genaiic-sdlc-sourcecode-${AWS::AccountId}-${AWS::Region}'
                  - !Sub 'arn:aws:s3:::genaiic-sdlc-sourcecode-${AWS::AccountId}-${AWS::Region}/*'
              # IDP stack buckets
              - Effect: Allow
                Action:
                  - s3:*
                Resource:
                  - 'arn:aws:s3:::idp-*'
                  - 'arn:aws:s3:::idp-*/*'
        - PolicyName: MonitoringAndCleanupAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Lambda
              - Effect: Allow
                Action:
                  - lambda:*
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:idp-*'
              # Lambda ListFunctions - required for Test Studio to discover TestRunnerFunction
              # Note: AWS does not support resource-level permissions for ListFunctions
              - Effect: Allow
                Action:
                  - lambda:ListFunctions
                Resource: '*'
              # DynamoDB
              - Effect: Allow
                Action:
                  - dynamodb:*
                Resource: 
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/idp-*'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/idp-*/index/*'
              # Step Functions
              - Effect: Allow
                Action:
                  - states:*
                Resource:
                  - !Sub 'arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:idp-*'
                  - !Sub 'arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:idp-*:*'
              # AppSync - required for cleanup
              - Effect: Allow
                Action:
                  - appsync:ListGraphqlApis
                  - appsync:GetGraphqlApi
                  - appsync:DeleteGraphqlApi
                Resource: '*'
              # CloudFront - required for cleanup
              - Effect: Allow
                Action:
                  - cloudfront:ListDistributions
                  - cloudfront:GetDistribution
                  - cloudfront:DeleteDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:UpdateDistribution
                  - cloudfront:ListResponseHeadersPolicies
                  - cloudfront:GetResponseHeadersPolicy
                  - cloudfront:DeleteResponseHeadersPolicy
                Resource: '*'
        - PolicyName: DeploymentVariantProbeReadAccess
          # Read-only APIs the deployment-variant probe validators call to
          # assert a variant's distinguishing feature deployed correctly:
          #   * apigateway GET  — GLOBAL/PRIVATE endpoint type + headless Jobs API
          #   * wafv2  Get/List — WAF-enabled probe (WebACL exists + associated)
          # None support resource-level scoping for these read ops.
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - apigateway:GET
                Resource: '*'
              - Effect: Allow
                Action:
                  - wafv2:GetWebACL
                  - wafv2:GetWebACLForResource
                  - wafv2:ListWebACLs
                  - wafv2:ListResourcesForWebACL
                Resource: '*'
        - PolicyName: STSAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sts:GetCallerIdentity
                Resource: '*'
              # The failure-analysis agent (scripts/sdlc/failure_agent.py) runs
              # on credentials from this assume, NOT on this role's own — this
              # role is effectively admin, and the CI account is shared with
              # concurrent pipelines, so an agent inheriting it could delete
              # another run's in-flight stack. Scoped to the `*-failure-agent`
              # suffix so it cannot be used to reach any other role. The target's
              # trust policy is the other half of the pair (sdlc-iam-role.yml).
              - Sid: AssumeFailureAnalysisAgentRole
                Effect: Allow
                Action:
                  - sts:AssumeRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/*-failure-agent'
        - PolicyName: CloudWatchLogsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:*
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*'
        # Read-only, so the deployment summary can follow a nested stack's
        # CodeBuild custom-resource failure down to the REAL cause. A failed
        # Docker-image build reports only "CodeBuild failed with status: FAILED"
        # to CloudFormation; the actual error (a pip network fault, a Docker
        # layer error) lives solely in that build's own log stream, which the
        # CloudWatchLogsAccess statement above already permits reading.
        # See get_codebuild_failure_details in codebuild_deployment.py.
        - PolicyName: CodeBuildReadAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - codebuild:ListBuildsForProject
                  - codebuild:BatchGetBuilds
                Resource: !Sub 'arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:project/*'
        - PolicyName: CloudWatchMetricsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace: GENAIDP
        - !If
          - DeployInVPC
          - PolicyName: VPCNetworkAccess
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - ec2:CreateNetworkInterface
                    - ec2:DescribeNetworkInterfaces
                    - ec2:DeleteNetworkInterface
                    - ec2:DescribeSubnets
                    - ec2:DescribeSecurityGroups
                    - ec2:DescribeVpcs
                    - ec2:DescribeDhcpOptions
                  Resource: '*'
                - Effect: Allow
                  Action:
                    - ec2:CreateNetworkInterfacePermission
                  Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*'
                  Condition:
                    StringEquals:
                      ec2:AuthorizedService: !Sub "codebuild.${AWS::URLSuffix}"
          - !Ref AWS::NoValue

  ArtifactBucket:
    Type: 'AWS::S3::Bucket'
    # checkov:skip=CKV_AWS_18: "This is a temporary deployment artifact bucket; access logging not required"
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W51
            reason: "Bucket policy enforces SSL; CodePipeline manages additional access controls"
          - id: W35
            reason: "This is a temporary deployment artifact bucket; access logging not required"
          - id: W41
            reason: "Bucket uses KMS CMK encryption via PipelineKMSKey"
      security-matrix:
        rules_to_suppress:
          - id: S3-001
            reason: "This is a temporary deployment artifact bucket; access logging not required"
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-S1
            reason: "Temporary SDLC deployment artifact bucket; access logging intentionally omitted"
          - id: AwsSolutions-S2
            reason: "Internal SDLC artifact bucket with public access already blocked"
          - id: AwsSolutions-S5
            reason: "Internal SDLC artifact bucket not used with CloudFront"
          - id: AwsSolutions-S10
            reason: "SSL enforced via ArtifactBucketPolicy"
          - id: NIST.800.53.R5-S3BucketLoggingEnabled
            reason: "Temporary SDLC deployment artifact bucket; access logging intentionally omitted"
    Properties:
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !If [CreateKMSKey, !GetAtt PipelineKMSKey.Arn, !Ref KMSKeyArn]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EnforceSSLOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub "${ArtifactBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": false

  FailureNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${PipelineName}-failures'
      DisplayName: 'IDP CI failure notifications'
      KmsMasterKeyId: alias/aws/sns

  FailureNotificationSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasNotificationEmail
    Properties:
      TopicArn: !Ref FailureNotificationTopic
      Protocol: email
      Endpoint: !Ref FailureNotificationEmail

  CodeBuildSNSPolicy:
    Type: 'AWS::IAM::Policy'
    Properties:
      PolicyName: CodeBuildSNSPublish
      Roles:
        - !Ref CodeBuildRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - 'sns:Publish'
            Resource: !Ref FailureNotificationTopic

  # Cognito admin access for the dynamic API RBAC test step (Step 12 in
  # codebuild_deployment.py): creates/deletes temporary test users, sets
  # passwords, manages group membership, and temporarily toggles the UI app
  # client's ADMIN_USER_PASSWORD_AUTH flow (restored afterwards). User pools
  # created by idp-* stacks don't carry a predictable ARN prefix, so this is
  # scoped by action rather than resource.
  CodeBuildCognitoPolicy:
    Type: 'AWS::IAM::Policy'
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W12
            reason: "Cognito user pool ids are generated at stack deploy time; RBAC test needs admin ops on the just-deployed pool"
    Properties:
      PolicyName: CodeBuildCognitoRBACTest
      Roles:
        - !Ref CodeBuildRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - 'cognito-idp:AdminCreateUser'
              - 'cognito-idp:AdminDeleteUser'
              - 'cognito-idp:AdminSetUserPassword'
              - 'cognito-idp:AdminAddUserToGroup'
              - 'cognito-idp:AdminInitiateAuth'
              - 'cognito-idp:DescribeUserPoolClient'
              - 'cognito-idp:UpdateUserPoolClient'
            Resource: !Sub 'arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*'

  # EC2/VPC access for the API Gateway + VPC hosting test (Step 4b in
  # codebuild_deployment.py): it deploys a self-contained throwaway VPC
  # (scripts/sdlc/apigw-hosting-test-vpc.yaml — VPC, subnets, IGW, NAT gateway +
  # EIP, route tables, security groups, execute-api VPC endpoint) to validate
  # PRIVATE API Gateway hosting, then tears it all down. Networking create/*
  # actions cannot be resource-scoped (the resource does not exist yet), so
  # these are scoped by action; Describe* is required by CloudFormation to poll
  # resource state during create and delete.
  CodeBuildEC2VPCPolicy:
    Type: 'AWS::IAM::Policy'
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W12
            reason: "EC2 networking create/delete actions cannot be resource-scoped (resources are created by this policy); the test VPC is a throwaway stack torn down in the same build"
    Properties:
      PolicyName: CodeBuildEC2VPCTest
      Roles:
        - !Ref CodeBuildRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - 'ec2:CreateVpc'
              - 'ec2:DeleteVpc'
              - 'ec2:ModifyVpcAttribute'
              - 'ec2:CreateSubnet'
              - 'ec2:DeleteSubnet'
              - 'ec2:ModifySubnetAttribute'
              - 'ec2:CreateInternetGateway'
              - 'ec2:DeleteInternetGateway'
              - 'ec2:AttachInternetGateway'
              - 'ec2:DetachInternetGateway'
              - 'ec2:CreateNatGateway'
              - 'ec2:DeleteNatGateway'
              - 'ec2:AllocateAddress'
              - 'ec2:ReleaseAddress'
              - 'ec2:CreateRouteTable'
              - 'ec2:DeleteRouteTable'
              - 'ec2:CreateRoute'
              - 'ec2:DeleteRoute'
              - 'ec2:AssociateRouteTable'
              - 'ec2:DisassociateRouteTable'
              - 'ec2:CreateSecurityGroup'
              - 'ec2:DeleteSecurityGroup'
              - 'ec2:AuthorizeSecurityGroupIngress'
              - 'ec2:AuthorizeSecurityGroupEgress'
              - 'ec2:RevokeSecurityGroupIngress'
              - 'ec2:RevokeSecurityGroupEgress'
              - 'ec2:CreateVpcEndpoint'
              - 'ec2:DeleteVpcEndpoints'
              - 'ec2:ModifyVpcEndpoint'
              - 'ec2:CreateTags'
              - 'ec2:DeleteTags'
              - 'ec2:Describe*'
            Resource: '*'

  IdkInstallCodeBuild:
    Type: 'AWS::CodeBuild::Project'
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W32
            reason: "Using default AWS managed KMS key for this deployment pipeline"
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-CB4
            reason: "SDLC deployment pipeline uses AWS-managed key; CMK adoption tracked in security backlog"
    Properties:
      Name: app-sdlc
      ServiceRole: !If [CreateCodeBuildRole, !GetAtt CodeBuildRole.Arn, !Ref CodeBuildRoleArn]
      TimeoutInMinutes: 120
      VpcConfig:
        !If
          - DeployInVPC
          - VpcId: !Ref VpcId
            Subnets: !Ref PrivateSubnetIds
            SecurityGroupIds:
              - !Ref CodeBuildSecurityGroupId
          - !Ref AWS::NoValue
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_LARGE
        Image: aws/codebuild/standard:7.0
        # Required so the ZAP DAST probe can `docker run` the official OWASP ZAP
        # image (ghcr.io/zaproxy/zaproxy) against its own throwaway stack. The
        # publish/SAM container builds already assume a Docker daemon; this makes
        # it explicit. See validate_zap_dast in scripts/sdlc/codebuild_deployment.py.
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: SOURCE_BUCKET
            Value: !Sub '${BucketNamePrefix}-${AWS::AccountId}-${AWS::Region}'
          - Name: IDP_FAILURE_SNS_TOPIC
            Value: !Ref FailureNotificationTopic
          # Persistent CI test VPC ids consumed by the VPC-requiring probes
          # (headless, PRIVATE APIGW). Empty when CreateTestVpc=false — the
          # harness then skips those probes with a logged note.
          - Name: IDP_TEST_VPC_ID
            Value: !If [MakeTestVpc, !Ref TestVpc, '']
          - Name: IDP_TEST_PRIVATE_SUBNET_IDS
            Value: !If
              - MakeTestVpc
              - !Sub "${TestVpcPrivateSubnet1},${TestVpcPrivateSubnet2}"
              - ''
          - Name: IDP_TEST_LAMBDA_SG_ID
            Value: !If [MakeTestVpc, !Ref TestVpcLambdaSecurityGroup, '']
          - Name: IDP_TEST_APIGW_VPCE_ID
            Value: !If [MakeTestVpc, !Ref TestVpcExecuteApiEndpoint, '']
          # Agentic root-cause analysis on a failed run
          # (scripts/sdlc/failure_agent.py). Advisory only: it never decides
          # pass/fail, and when it cannot finish the harness falls back to the
          # single-shot Bedrock summary. Set IDP_FAILURE_AGENT=0 to disable
          # without a code change.
          - Name: IDP_FAILURE_AGENT
            Value: '1'
          # Read-only credentials the agent runs on. Built by convention from
          # the IAM stack's role name rather than imported, because that stack
          # (scripts/sdlc/cfn/sdlc-iam-role.yml) exports nothing and is deployed
          # independently of this one. If the assume fails the agent logs loudly
          # and degrades — it does NOT silently run on this role's credentials.
          - Name: IDP_FAILURE_AGENT_ROLE_ARN
            Value: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${FailureAgentRoleName}'
      Source:
        Type: CODEPIPELINE
        BuildSpec: |
          version: 0.2
          phases:
            install:
              runtime-versions:
                python: 3.12
              commands:
                - n 22.14.0 && node --version || { echo "Node setup failed"; exit 1; }
                - npm install -g npm@11 || echo "npm upgrade skipped, using bundled $(npm --version)"
                - pip install uv || { echo "uv installation failed"; exit 1; }
                - export IDP_ADMIN_EMAIL=$(aws s3api head-object --bucket ${SOURCE_BUCKET} --key deploy/code.zip --query 'Metadata."gitlab-user-email"' --output text 2>/dev/null || echo "")
                - make setup || { echo "IDP Common and IDP CLI installation failed"; exit 1; }
                - pip install rich scikit-learn || echo "Additional package installation failed, using fallbacks"
                - export PATH="$PWD/.venv/bin:$PATH"
                - which idp-cli || { echo "idp-cli not found in PATH"; exit 1; }
            build:
              commands:
                - python3 scripts/sdlc/codebuild_deployment.py
              finally:
                - echo "Cleanup handled by codebuild deployment script"

  DeploymentPipeline:
    Type: 'AWS::CodePipeline::Pipeline'
    Properties:
      Name: !Ref PipelineName
      RoleArn: !GetAtt CodePipelineRole.Arn
      ExecutionMode: PARALLEL
      PipelineType: V2
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
        EncryptionKey:
          Id: !If [CreateKMSKey, !GetAtt PipelineKMSKey.Arn, !Ref KMSKeyArn]
          Type: KMS
      Stages:
        - Name: Source
          Actions:
            - Name: SourceAction
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: S3
                Version: '1'
              Configuration:
                S3Bucket: !Sub '${BucketNamePrefix}-${AWS::AccountId}-${AWS::Region}'
                S3ObjectKey: !Ref FileKey
                PollForSourceChanges: false
              OutputArtifacts:
                - Name: SourceOutput
              RunOrder: 1
        - Name: Build
          Actions:
            - Name: BuildAction
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref IdkInstallCodeBuild
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildOutput
              RunOrder: 1

  CodeBuildRoleS3Policy:
    Type: 'AWS::IAM::Policy'
    Properties:
      PolicyName: CodeBuildS3Access
      Roles: 
        - !Ref CodeBuildRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - 's3:GetObject'
              - 's3:GetObjectVersion'
              - 's3:PutObject'
            Resource: 
              - !Sub 'arn:aws:s3:::${BucketNamePrefix}-${AWS::AccountId}-${AWS::Region}/*'
              - !Sub 'arn:aws:s3:::${ArtifactBucket}/*'
          - Effect: Allow
            Action:
              - 's3:ListBucket'
            Resource: 
              - !Sub 'arn:aws:s3:::${BucketNamePrefix}-${AWS::AccountId}-${AWS::Region}'
              - !Sub 'arn:aws:s3:::${ArtifactBucket}'

  CodeBuildLogsPolicy:
    Type: 'AWS::IAM::Policy'
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: F4
            reason: "logs:* used for CodeBuild to manage logs across multiple stacks with dynamic log group names"
          - id: W12
            reason: "Wildcard resource required for CloudWatch Logs to create log groups dynamically across different stacks"
    # checkov:skip=CKV_AWS_111: "CloudWatch Logs policies require write access for log creation"
    Properties:
      PolicyName: CodeBuildLogs
      Roles: 
        - !Ref CodeBuildRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - 'logs:*'
            Resource: '*'

  CodeBuildBedrockPolicy:
    Type: 'AWS::IAM::Policy'
    Properties:
      PolicyName: CodeBuildBedrockAccess
      Roles: 
        - !Ref CodeBuildRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - 'bedrock:InvokeModel'
              - 'bedrock:InvokeModelWithResponseStream'
            Resource:
              - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/*'
              - !Sub 'arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*'
          - Effect: Allow
            Action:
              - 'bedrock:ListBlueprints'
              - 'bedrock:ListDataAutomationProjects'
            Resource: '*'
          - Effect: Allow
            Action:
              - 'bedrock:CreateBlueprint'
              - 'bedrock:CreateBlueprintVersion'
              - 'bedrock:UpdateBlueprint'
              - 'bedrock:DeleteBlueprint'
              - 'bedrock:GetBlueprint'
              - 'bedrock:CreateDataAutomationProject'
              - 'bedrock:UpdateDataAutomationProject'
              - 'bedrock:GetDataAutomationProject'
              - 'bedrock:DeleteDataAutomationProject'
            Resource:
              - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:blueprint/*'
              - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:data-automation-project/*'
          - Effect: Allow
            Action:
              - 'bedrock:ListIngestionJobs'
              - 'bedrock:StopIngestionJob'
            Resource: '*'

  CodeBuildKMSPolicy:
    Type: 'AWS::IAM::Policy'
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: F4
            reason: "Broad KMS permissions required for stack life cycle in pipeline account"
          - id: W12
            reason: "KMS operations require wildcard resource for key discovery during stack deployment."
    # checkov:skip=CKV_AWS_111: "Write access required for KMS key management during stack deployment and teardown in SDLC pipeline"
    # checkov:skip=CKV_AWS_109: "Wildcard KMS permissions required for dynamic key discovery and management across multiple stacks in pipeline account"
    Properties:
      PolicyName: CodeBuildKMSAccess
      Roles: 
        - !Ref CodeBuildRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - 'kms:*'
            Resource: '*'

  # CloudWatch Events Rule to trigger pipeline on S3 changes
  PipelineTriggerRule:
    Type: AWS::Events::Rule
    Properties:
      Name: genaiic-sdlc-pipeline-trigger
      Description: Trigger CodePipeline on S3 object changes
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - Object Created
        detail:
          bucket:
            name:
              - !Sub '${BucketNamePrefix}-${AWS::AccountId}-${AWS::Region}'
          object:
            key:
              - !Ref FileKey
      State: ENABLED
      Targets:
        - Arn: !Sub 'arn:aws:codepipeline:${AWS::Region}:${AWS::AccountId}:${PipelineName}'
          Id: PipelineTrigger
          RoleArn: !GetAtt PipelineTriggerRole.Arn

  # IAM Role for CloudWatch Events to trigger CodePipeline
  PipelineTriggerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: genaiic-sdlc-pipeline-trigger-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: TriggerPipelinePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - codepipeline:StartPipelineExecution
                Resource: !Sub 'arn:aws:codepipeline:${AWS::Region}:${AWS::AccountId}:${PipelineName}'