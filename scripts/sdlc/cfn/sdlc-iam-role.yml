AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation template to create Limited IAM Policy and SDLC Role with PowerUser access. TODO: Refine this role to be least privilege'

Parameters:
  BuilderRoleName:
    Type: String
    Default: genaiic-sdlc-role
    Description: Name for the Builder Role

Resources:
  LimitedIAMAccessPolicy:
    Type: 'AWS::IAM::ManagedPolicy'
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: F40
            reason: "This policy is for SDLC role that needs to provision IAM resources during deployment"
          - id: W13
            reason: "This policy is specifically for provisioning IDP resources with controlled scope"
          - id: W28
            reason: "Explicit name required for cross-stack references and predictable resource naming"
    # checkov:skip=CKV_AWS_107: "This policy is required for SDLC role to provision IAM resources"
    # checkov:skip=CKV_AWS_109: "This policy needs permissions management capabilities for SDLC deployment"
    # checkov:skip=CKV_AWS_110: "This policy requires privilege escalation capabilities for SDLC deployment"
    Properties:
      Description: 'Policy for limited IAM access'
      ManagedPolicyName: 'LimitedIAMAccess'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: LimitedIAMaccess
            Effect: Allow
            Action:
              - iam:CreateInstanceProfile
              - iam:List*
              - iam:Untag*
              - iam:Tag*
              - iam:RemoveRoleFromInstanceProfile
              - iam:DeletePolicy
              - iam:CreateRole
              - iam:AttachRolePolicy
              - iam:PutRolePolicy
              - iam:AddRoleToInstanceProfile
              - iam:PassRole
              - iam:Get*
              - iam:DetachRolePolicy
              - iam:DeleteRolePolicy
              - iam:CreatePolicyVersion
              - iam:DeleteInstanceProfile
              - iam:DeleteRole
              - iam:UpdateRoleDescription
              - iam:CreatePolicy
              - iam:CreateServiceLinkedRole
              - iam:UpdateRole
              - iam:DeleteServiceLinkedRole
              - iam:DeletePolicyVersion
              - iam:SetDefaultPolicyVersion
              - iam:AttachUserPolicy
              - iam:DetachUserPolicy
              - iam:PutUserPolicy
              - iam:DeleteUserPolicy
              - iam:AddUserToGroup
              - iam:AttachGroupPolicy
              - iam:CreateGroup
              - iam:DeleteGroup
              - iam:DeleteGroupPolicy
              - iam:DetachGroupPolicy
              - iam:GetGroup
              - iam:GetGroupPolicy
              - iam:ListAttachedGroupPolicies
              - iam:ListGroupPolicies
              - iam:ListGroups
              - iam:ListGroupsForUser
              - iam:PutGroupPolicy
              - iam:RemoveUserFromGroup
              - iam:UpdateGroup
              - iam:GenerateServiceLastAccessedDetails
              - iam:UpdateAssumeRolePolicy
              - iam:UpdateAccessKey
            Resource: '*'

  BuilderRole:
    Type: 'AWS::IAM::Role'
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W44
            reason: "PowerUserAccess is required for this SDLC role to perform necessary deployment operations"
          - id: W28
            reason: "Explicit name required for cross-stack references and predictable resource naming"
      # checkov:skip=CKV_AWS_62:PowerUserAccess is required for SDLC pipeline deployment operations
      security-matrix:
        rules_to_suppress:
          - id: EC2-002
            reason: "PowerUserAccess is required for SDLC pipeline deployment operations"
    Properties:
      RoleName: !Ref BuilderRoleName
      Description: 'Role for application builders with PowerUser and Limited IAM access'
      MaxSessionDuration: 7200  # 2 hours for long-running CI/CD operations
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: 
                - ec2.amazonaws.com
                - codebuild.amazonaws.com
                - cloudformation.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      ManagedPolicyArns:
        - !Ref LimitedIAMAccessPolicy
        - 'arn:aws:iam::aws:policy/PowerUserAccess'
      Tags:
        - Key: Purpose
          Value: ApplicationBuilder

  # Credentials for the CI failure-analysis agent (scripts/sdlc/failure_agent.py).
  #
  # The BuilderRole above carries PowerUserAccess + broad IAM write, so an agent
  # inheriting CodeBuild's ambient credentials would already be able to mutate
  # anything in the account. This account is SHARED with concurrent pipelines
  # (the stale-resource reapers in codebuild_deployment.py are age-gated
  # specifically so "a concurrent pipeline's in-flight buckets are never
  # touched"), so an agent with write access could destroy another running
  # pipeline's stack. This role is the actual boundary: the agent assumes it and
  # therefore cannot mutate the account no matter what it decides to try.
  #
  # ReadOnlyAccess alone is NOT sufficient — bedrock:InvokeModel is not a
  # read-only action, so without the Bedrock statement below the agent can read
  # the evidence but cannot think about it.
  FailureAgentReadOnlyRole:
    Type: 'AWS::IAM::Role'
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: "Explicit name required so the pipeline can pass a predictable ARN to the agent"
    Properties:
      RoleName: !Sub '${BuilderRoleName}-failure-agent'
      Description: 'Read-only role for the CI failure-analysis agent. Cannot mutate the shared CI account.'
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Trusting the account root + an ArnLike condition, rather than naming
          # principals directly, because the caller is the PIPELINE stack's
          # CodeBuild role — `genaiic-sdlc-codepipeline-CodeBuildRole-<suffix>`,
          # a CloudFormation-generated name this stack cannot reference without
          # a cross-stack parameter that would break on every pipeline replace.
          # An earlier version named BuilderRole.Arn only; the pipeline does NOT
          # run as that role, so every assume failed and the agent silently fell
          # back to ambient PowerUser credentials — the exact posture this role
          # exists to prevent. Account-root trust alone grants nothing: the
          # caller still needs its own sts:AssumeRole grant (added to STSAccess
          # in codepipeline-s3.yml), so this is two-key, not open.
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action:
              - 'sts:AssumeRole'
            Condition:
              ArnLike:
                'aws:PrincipalArn':
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${BuilderRoleName}'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/*CodeBuildRole*'
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/ReadOnlyAccess'
      Policies:
        - PolicyName: BedrockInferenceForAgent
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Per the Claude Code on Amazon Bedrock docs: invoke + the two
              # inference-profile reads. GetInferenceProfile is not strictly
              # required (Claude Code retries with the alternate request shape
              # without it) but granting it avoids an extra round-trip per model.
              - Sid: BedrockInvoke
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock:ListInferenceProfiles
                  - bedrock:GetInferenceProfile
                Resource:
                  - !Sub 'arn:${AWS::Partition}:bedrock:*:*:inference-profile/*'
                  - !Sub 'arn:${AWS::Partition}:bedrock:*:*:application-inference-profile/*'
                  - !Sub 'arn:${AWS::Partition}:bedrock:*:*:foundation-model/*'
              # Belt and braces on top of ReadOnlyAccess: block the two paths
              # that would let a read-only session climb back out — assuming a
              # more privileged role, or reading a credential it could reuse.
              - Sid: DenyPrivilegeEscalationAndSecretReads
                Effect: Deny
                Action:
                  - sts:AssumeRole
                  - secretsmanager:GetSecretValue
                Resource: '*'

Outputs:
  LimitedIAMPolicyArn:
    Description: 'ARN of the created Limited IAM policy'
    Value: !Ref LimitedIAMAccessPolicy

  FailureAgentReadOnlyRoleArn:
    Description: 'ARN of the read-only role the CI failure-analysis agent assumes (set as IDP_FAILURE_AGENT_ROLE_ARN)'
    Value: !GetAtt FailureAgentReadOnlyRole.Arn

  BuilderRoleArn:
    Description: 'ARN of the created Builder Role'
    Value: !GetAtt BuilderRole.Arn

  BuilderRoleName:
    Description: 'Name of the created Builder Role'
    Value: !Ref BuilderRole