version = 1

[limits]
step_budget_multiple = 10
step_budget_floor = 30
documented_steps_max = 6
flow_usd = 4.00
flow_minutes = 12

[runs]
mr_stories = 2
mr_flows = 3
mr_runs = 4
job_usd = 10.00
extended_flow_usd = 6.00
deadline_minutes = 55
setup_minutes = 6
reserve_minutes = 12

[personas.new-analyst]
group = "Author"
background = "You joined document operations this week. You have read the release notes and nothing else, you are comfortable with web applications, and AWS is new to you."

[personas.team-lead]
group = "Viewer"
background = "You lead a team that checks processing results and answers questions about them. You were told your access is read-only."

[personas.platform-admin]
group = "Admin"
background = "You set this deployment up last month and look after its settings and extensions."

[personas.queue-annotator]
group = "Annotator"
background = "You joined the review team this week to check documents the system was unsure about. You were told work would be waiting for you when you signed in."

[personas.scoped-annotator]
group = "Annotator"
credentials = "Annotator-scoped"
background = "You review documents for one team, and you were told you can only work on that team's documents. You started this week."

[personas.reviewer]
group = "Reviewer"
background = "You check documents the system was unsure about before they go back to the business. You were told the production review work is yours to pick up, and test sets are someone else's job."

[fixtures.complete-document]
description = "a shipped sample (samples/lending_package.pdf) processed to COMPLETE"

[fixtures.reprocessed-document]
description = "a shipped sample processed, then reprocessed once it was complete, so idp-cli list-versions lists two versions"

[fixtures.evaluated-document]
description = "a shipped sample with a baseline, in a test set run with idp-cli process --test-set <test set ID>, the run finished"

[fixtures.test-run-documents]
description = "documents submitted by a Test Studio run, beside ordinary uploads"

[fixtures.unlabeled-documents]
description = "shipped samples uploaded without expected results"

[fixtures.feature-platform]
description = "the Feature Platform enabled and Sample: Health Insurance Review installed; its hook is at rule_validation.postHook of the inactive sample-health-insurance-review profile"

[fixtures.review-queue-item]
description = "a profile with HITL on, the Default queue listing the review stack's Annotators, and a shipped sample waiting in it unassigned"

[fixtures.assigned-review-item]
description = "a shipped sample waiting in the Default queue and assigned to the review stack's Annotator"

[fixtures.out-of-scope-review-item]
description = "a shipped sample waiting in the Default queue under a HITL profile outside the profile-limited Annotator's limit"

[fixtures.test-set-review-queue]
description = "a labelled test set with at least one unassigned document, its queue listing the review stack's Annotator in Eligible Annotators"

# ---- p0 ----------------------------------------------------------------------------

[[stories]]
id = "find-where-to-start"
title = "Find out where to start"
intent = "You were just given access to this application. Find out what it is for and how you would get your first document processed."
kind = "read"
documented_steps = 3
as = { new-analyst = "allowed" }
first_visit = true
tier = "p0"
since = "0.6.0"
origin = "smoke"

[stories.match]
docs = ["quick-start.md#web-ui", "web-ui.md#upload-documents"]
terms = ["welcome page"]

[[stories]]
id = "read-a-processed-document"
title = "Read what was extracted from a processed document"
intent = "Open a document that has finished processing and find out what information was extracted from it."
kind = "read"
documented_steps = 3
as = { new-analyst = "allowed", team-lead = "allowed", platform-admin = "allowed" }
needs = ["complete-document"]
tier = "p0"
since = "0.6.0"
origin = "smoke"
rbac = "View document details"

[stories.match]
docs = ["web-ui.md#document-list"]
terms = ["document details"]

[[stories]]
id = "find-extraction-model"
title = "Find which model reads the fields out of your documents"
intent = "Find out which model reads the fields out of your documents, and whether Claude Sonnet 5.5 is one of the models you could choose instead. Change nothing."
kind = "read"
documented_steps = 4
as = { new-analyst = "allowed", team-lead = "allowed" }
tier = "p0"
since = "0.6.12"
origin = "changelog"
rbac = "View config profiles"
claims = [{ lead = "Claude Sonnet 5.5 is selectable for every model-taking service." }]

[stories.match]
docs = ["configuration.md#pattern-configuration-via-web-ui"]
issues = [1455]
terms = ["Sonnet 5.5"]

[[stories]]
id = "route-folder-to-profile"
