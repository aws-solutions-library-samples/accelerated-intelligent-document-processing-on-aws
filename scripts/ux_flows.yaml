#
# User-experience flows for the UX test skill (.claude/skills/ux-test/SKILL.md).
#
# Each flow is something a person does, with an outcome that can be checked in a
# browser. The agent drives the UI and reports per-flow: does it work, and is it
# a good experience.
#
# Ids match the user stories in the ground-truth correction QA plan, so a finding
# can be referenced the same way in either place. That numbering exists so
# stories gathered in review can be logged against the same ids rather
# than described free-form and reported twice in different words. A flow for a
# feature outside that plan takes a short prefix instead: QS is Quick Start.
#
# This file is the FALLBACK and the memory — not the definition of scope. A
# review normally starts from whatever the user asks for at run time ("look at
# the annotation flow", "here are three things users struggled with"), and
# nothing here needs editing to review something new.
#
# What it holds that a runtime prompt cannot:
#   * Preconditions. 6.1 needs a *misclassified* document and no shipped test set
#     has one; someone asking for a classification review will not think to say
#     that, and without it the review only ever sees the happy path.
#   * Regression memory. The flows that broke before keep getting looked at even
#     when nobody remembers to ask.
#
# Add a recurring use case here AFTER reviewing it once, when you know what it
# actually needs. Written beforehand it tends to encode a guess.
#
# Fields:
#   id          Story id (see above). Stable — findings reference it.
#   title       What the person is trying to do.
#   persona     Which group to run as. The session helper creates this user.
#   priority    p0 = a blocking flow; p1 = important; p2 = nice.
#   paths       Optional. Globs of src/ui files whose change makes this flow
#               worth reviewing on an MR; absent means the MR selector never
#               picks it.
#   setup       Preconditions the agent must establish or verify before starting.
#   steps       What to do, in order, in the UI.
#   expect      Functional pass criteria. Objective — these are pass/fail.
#   ux_watch    What to judge as an experience. Subjective — these produce
#               suggestions, not failures. Absent means "apply the general
#               heuristics in the skill".

flows:
  - id: '5.1'
    title: Correct a wrong field value in the annotation queue
    persona: Admin
    priority: p0
    paths:
      - src/ui/src/components/test-studio/AnnotationWorkspace.tsx
      - src/ui/src/components/edit-screen/**
    setup:
      - A test set exists with at least one labeled document.
      - Reachable from Test Studio → Test sets → (set) → Annotate.
    steps:
      - Open the annotation queue for the test set.
      - Open the first document in the queue.
      - Change one field's value to something recognisably different.
      - Save, then choose Process Changes.
      - Reopen the same document.
    expect:
      - The queue lists documents and indicates which need review.
      - The edited value persisted across the reload.
      - The document is recorded as reviewed, and the queue reflects that.
    ux_watch:
      - Is it obvious which field is wrong and why it was flagged, or must the
        reviewer compare against something not on screen?
      - After saving, is it clear what happened and what to do next?
      - Is the reviewer ever unsure whether they are editing ground truth or
        model output? (These are different things and look similar.)

  - id: '6.1'
    title: See that a document's class is wrong
    persona: Admin
    priority: p0
    paths:
      - src/ui/src/components/document-details/**
      - src/ui/src/components/document-panel/**
      - src/ui/src/components/document-actions/**
      - src/ui/src/components/sections-panel/**
      - src/ui/src/components/pages-panel/**
      - src/ui/src/components/document-viewer/**
      - src/ui/src/components/edit-screen/SectionEditor.tsx
      - src/ui/src/components/edit-screen/use-section-evaluation.ts
    setup:
      # Do NOT create this by using flow 6.2 — that flow is currently broken and
      # drops the corrected class, so the fixture never appears and 6.1 looks
      # untestable. Edit the baseline directly instead:
      #
      #   aws s3 cp s3://<testset-bucket>/<set>/baseline/<doc>/sections/1/result.json .
      #   # change document_class.type to a different class, then put it back
      #   aws s3 cp result.json s3://<testset-bucket>/<set>/baseline/<doc>/sections/1/result.json
      #
      # That makes the ground-truth class disagree with what the pipeline
      # predicted, which is exactly the condition 6.1 is about.
      - A document whose baseline ground-truth class differs from the class the
        pipeline predicted. Create it by editing the baseline result.json in S3
        (see the comment above), not via flow 6.2.
    steps:
      - Open the document's detail page.
      - Choose Edit on the document page (or Edit Data in a section's ⋮ menu) and
        turn on Show Evaluation.
    expect:
      - The classification comparison is shown, naming both the expected and the
        predicted class.
      - A correctly-classified document does NOT show a mismatch.
    ux_watch:
      - Would a reviewer understand that the fields below were extracted with the
        wrong schema and are therefore untrustworthy — or would they start
        correcting individual fields one at a time?

  - id: '6.2'
    title: Correct a wrong class and re-extract
    persona: Admin
    priority: p0
    paths:
      - src/ui/src/components/test-studio/AnnotationWorkspace.tsx
      - src/ui/src/components/test-studio/classConfigVersion.ts
    setup:
      - A test set document whose class is wrong (see 6.1).
    steps:
      - Open the document in the annotation queue.
      - Change the class to the correct one.
      - Use the re-extract action offered.
      - Wait for it to finish.
    expect:
      - Only classes the document's own config version defines are offered
        (plus its current class, even if that class was later removed).
      - Re-extraction completes and the fields on screen are replaced.
      - The rest of the test set is unaffected and still reviewable.
    ux_watch:
      - Is it clear, before committing, what re-extracting will discard?
      - If it takes a while, is the wait explained or does the UI look stuck?

  - id: '11.1'
    title: Find which documents a test run misclassified
    persona: Admin
    priority: p0
    paths:
      - src/ui/src/components/test-studio/ClassificationErrorsPanel.tsx
      - src/ui/src/components/test-studio/TestResults.tsx
      - src/ui/src/components/test-studio/TestResultsList.tsx
    setup:
      - A completed test run over a set containing at least one misclassified
        document.
    steps:
      - Open Test Studio → Test runs → the run's results.
      - Locate the classification errors.
      - Follow a row through to the document.
    expect:
      - Misclassified documents are listed with expected and predicted class.
      - A run with no misclassifications shows no empty/broken panel.
      - The row links through to where the class can be corrected.
    ux_watch:
      - Is the relationship between this panel and the split-accuracy
        percentages clear, or do they look like two unrelated things?
      - Can the reader tell a wrong class from a page-order difference, and does
        the UI make clear only one of them invalidates the extracted fields?

  - id: '4.1'
    title: Work the queue worst-first
    persona: Annotator
    priority: p1
    paths:
      - src/ui/src/components/review-queues/MyQueuesPage.tsx
      - src/ui/src/components/test-studio/AnnotationWorkspace.tsx
    setup:
      - An annotator assigned to exactly one test set with several labeled
        documents of differing confidence.
    steps:
      - Sign in as the annotator.
      - Open the assigned queue.
      - Read the order the documents are presented in.
    expect:
      - Documents needing the most attention appear first.
      - Documents with authored ground truth are not presented as work.
      - The annotator sees only their assigned set, and no navigation to pages
        they cannot open.
    ux_watch:
      - Does the annotator understand *why* this document is first?
      - Is progress through the queue visible, so the work feels finite?

  - id: '12.1'
    title: A scoped annotator cannot reach anything else
    persona: Annotator
    priority: p1
    paths:
      - src/ui/src/routes/**
      - src/ui/src/components/genaiidp-layout/navigation.tsx
    setup:
      - The same annotator as 4.1.
    steps:
      - Attempt to reach Test Studio's set list, configuration, and another
        test set's queue by URL.
    expect:
      - Each attempt is refused or redirected, not partially rendered.
      - The refusal explains itself rather than showing a raw error.
    ux_watch:
      - Does a refused page leave the annotator somewhere useful, or stranded?

  - id: '4.2'
    title: Clear pending reviews in bulk, then follow the job
    persona: Admin
    priority: p1
    paths:
      - src/ui/src/components/review-bulk/**
      - src/ui/src/components/document-list/DocumentList.tsx
      - src/ui/src/components/document-list/documents-table-config.tsx
      - src/ui/src/components/review-queues/ReviewQueuePage.tsx
      - src/ui/src/components/edit-screen/direct-edit-model.tsx
    setup:
      - A configuration profile with a few documents pending review (legacy or
        in the Default queue), and one document that has finished review.
    steps:
      - Open the Document List, select the pending documents and the finished
        one, and choose Review › Skip All Reviews (N selected).
      - Read the dry-run summary, choose a reason, keep Resubmit ticked, and
        confirm.
      - Open Review › Skip All Reviews by profile…, choose the profile and a
        date range, and read the count.
      - Open a production queue's page, select an item waiting for review and
        choose More actions › Skip All Reviews (1).
      - Open Home › Jobs and the job the run created.
      - Open a skipped document and its Reports › History › Review Activity.
    expect:
      - The count in the menu leaves out the finished document, and the dry run
        reports it as Already finished.
      - The results show one outcome per document and can be exported.
      - The skipped rows show Review Skipped (or Review Completed for queue
        items) without reloading the list.
      - The run is listed under Home › Jobs with its status, counts and a
        working results table.
      - The queue page shows only Assign to… and Unassign as buttons; Move,
        Remove from queue and both Skip All Reviews actions are in More actions.
      - Review Activity lists the skip as Skipped (Skip All Reviews), with its
        reason and who skipped it, for a legacy document as well as a queue item.
    ux_watch:
      - Is it clear before confirming what will happen to each kind of
        document, and that a skip is recorded with the reason?
      - Does a by-profile run that becomes a background job leave the person
        somewhere they can follow it?

  - id: 'QS.1'
    title: Start setting up a new kind of document with Quick Start
    persona: Admin
    priority: p1
    paths:
      - src/ui/src/components/agent-chat/QuickStart*
      - src/ui/src/components/agent-chat/useQuickStartUpload.ts
      - src/ui/src/components/agent-chat/AgentChatLayout.tsx
      - src/ui/src/components/welcome/**
      - src/ui/src/contexts/guidedTour.tsx
    setup:
      - Nothing to seed. The review stack has the widget on (EnableQuickStartWidget).
      - Never send a message in Quick Start. Its agent creates and activates a
        configuration profile on the shared review stack once a draft is approved.
    steps:
      - Open Quick Start from the Welcome page if it shows, and from the Quick
        Start button at the top of the side navigation.
      - Read the panel's introduction and its suggested prompts.
      - Type a description of a document, such as paystubs with employer, pay
        period and net pay, and stop before sending it.
      - Minimize the panel, reopen it from the launcher, then close it.
    expect:
      - Each entry point opens the same Quick Start panel.
      - The message box accepts the typed description.
      - Minimizing keeps the typed text; the launcher appears only once the panel
        is minimized.
    ux_watch:
      - Before anything is sent, is it clear what Quick Start will create, and when
        it will make the result the active configuration?
      - Before files are attached, is it clear that they are saved into a new
        configuration profile, and that the user is asked before it becomes the
        active one?
      - Does the panel say which files can be attached, before the file chooser
        opens?
      - Does the panel cover controls on the page behind it?

# Flows still to add, gathered in review. Listed rather than
# invented so it is visible that they are known-missing rather than overlooked:
#
#   1.3   Creating a set from a partially-labelled folder is refused clearly.
#   2.1   Draft labeling skips already-labeled documents, visibly.
#   3.1   The review-effort estimate is legible and appropriately hedged.
#   5.3   A field's highlighted region matches the field clicked, including in
#         tables with repeating values. (Known-broken: occurrence_index.)
#   7.1   A machine draft is never styled as verified ground truth.
#   10.3  What a published version guarantees. (Known limitation: not immutable.)

  - id: 'RR.1'
    title: Add a routing rule and test it on a document
    persona: Admin
    priority: p1
    paths:
      - src/ui/src/components/config-routing/**
      - src/ui/src/components/configuration-layout/ConfigBuilder.tsx
    setup:
      - A configuration profile with at least one document class, and one
        document processed under it.
      - Never save the configuration. Everything on the Routing Rules tab stays
        in the editor until the configuration is saved.
    steps:
      - Open Configuration, choose the profile and open the Routing Rules tab.
      - Read the built-in routing rules, the Default outcome and Maximum
        placements in a row, and any warning above the table.
      - Choose Add routing rule, give it an id and a label, add a condition on
        the document class, send matching documents to the Default queue, and
        write a reason for the reviewer with a value inserted.
      - Move the new routing rule above the built-in routing rules.
      - Under Test on a document, enter the processed document's key and choose
        Test.
      - Export the table as DMN, then leave the page without saving.
    expect:
      - The dialog offers the profile's classes, fields and policy rules where
        an input takes one, guided controls for a condition's value, and
        refuses an id that is taken or malformed.
      - The reason field counts its length, and Insert value adds a placeholder
        where the cursor is.
      - The test shows the decision, the matched routing rule, the queue, the
        reason for the reviewer and the values the table read, and changes
        nothing on the document.
      - A routing rule that can never match, and a routing rule that names a
        queue that does not exist, are each reported on the tab.
      - The tab warns when Review Routing is off for the profile.
    ux_watch:
      - Is it clear that routing rules are tried in order and that the first
        match decides?
      - Does the person understand that nothing takes effect until the
        configuration is saved?
      - Is the difference between a routing rule and a policy rule clear from
        the words on the tab?
      - Is it clear what a placeholder in the reason will show the reviewer?

  - id: 'RR.2'
    title: Create a review queue and see which routing rules use it
    persona: Admin
    priority: p1
    paths:
      - src/ui/src/components/review-queues/QueuesPage.tsx
      - src/ui/src/components/review-queues/QueueDefinitionModal.tsx
      - src/ui/src/components/review-queues/QueueReferences.tsx
    setup:
      - Nothing to seed. Cancel the queue form; do not create a queue on the
        shared review stack.
    steps:
      - Open Review Studio › Review Management and choose Create queue.
      - Fill in an id and a name, read what the form says about the id and the
        Enabled switch, then cancel.
      - Open the Default queue's page and read Routing rules that use this
        queue.
      - Open the row menu of a production queue other than Default, choose
        Delete, read the confirmation, and cancel.
    expect:
      - The form says that routing rules name the queue by its id, and where
        documents go while a queue is disabled.
      - The queue's page lists the profiles and routing rules that send
        documents to it, each with a way to open that profile's Routing Rules
        tab.
      - The delete confirmation lists the same routing rules and says where
        their documents go afterwards.
    ux_watch:
      - Would an Admin know what to do next after creating a queue, given that a
        new queue receives nothing until a routing rule names it?

  - id: 'RR.3'
    title: End a review by completing it, sending it back or rejecting it
    persona: Admin
    priority: p1
    paths:
      - src/ui/src/components/review-queues/ReviewCompletionModal.tsx
      - src/ui/src/components/review-queues/RoutedBy.tsx
      - src/ui/src/components/review-queues/ReviewTaskContext.tsx
      - src/ui/src/components/run-plan/**
      - src/ui/src/components/edit-screen/production-item-edit-model.tsx
      - src/ui/src/components/edit-screen/EditPage.tsx
    setup:
      - A document waiting in a production review queue.
      - Cancel every dialog. Completing, sending back and rejecting all end the
        review of a document other people may be looking at.
    steps:
      - Open the document from its queue's page.
      - Read the Review Reason panel above the editor, which says which routing
        rule placed the document and gives its reason, and lists any failed
        policy rules and alerts.
      - Choose Process Changes, read both endings and the steps of the run under
        each, choose Send back for reprocessing, read its warning, and cancel.
      - Choose Reject, read the dialog and its reasons, and cancel.
    expect:
      - The Review Reason panel says which routing rule placed the item, or that
        the default outcome did, with the reason for the reviewer, and why it is
        in the Default queue when the routing rule named another.
      - Failed policy rules are listed under the reason, each with the reason
        policy rule validation gave, and a long text is shortened with a way to
        read all of it.
      - Process Changes asks how the review ends before anything happens, and
        offers no step to choose for either ending.
      - Each ending lists the steps of its run, the step it starts at and
        whether each step runs, is skipped or is not enabled.
      - Send back says that the review's corrections and any page regrouping
        are discarded and that processing starts again from classification.
      - Reject says what happens to the document and asks for a reason.
    ux_watch:
      - Is the difference between completing, sending back and rejecting clear
        before the person commits to one?
      - Is it clear that a send-back loses the corrections made so far?
      - Can the person tell from the list of steps what the run will do, without
        knowing the pipeline?
      - Does the Review Reason panel stay readable with a long reason and
        several failed policy rules?

  - id: 'RR.4'
    title: Reprocess a document from a later step and read the flow
    persona: Admin
    priority: p1
    paths:
      - src/ui/src/components/common/ReprocessDocumentModal.tsx
      - src/ui/src/components/run-plan/**
      - src/ui/src/components/step-function-flow/**
    setup:
      - A document that finished processing, and one that was reprocessed from a
        later step or whose review was completed.
      - Cancel the Reprocess dialog; do not start a run on the shared review
        stack.
    steps:
      - Open the finished document and choose More Actions › Reprocess.
      - Read the steps under Start at, and the reason shown for any step that is
        not available, then cancel.
      - Select two documents in the Document List, open Reprocess, read the
        steps, and cancel.
      - Open the other document's Reports › Processing Flow and read the steps
        marked Skipped.
    expect:
      - The dialog lists the steps of the document's processing mode and says
        what a run from the chosen step does again and what it keeps.
      - A step that is not available is greyed out with its reason; for several
        documents it says for how many.
      - The Processing Flow shows the steps the run left out as Skipped, in step
        order, with a note of where the run started.
    ux_watch:
      - Would a person know which step to choose for the change they made?
      - Is a Skipped step clearly different from a step the configuration turned
        off and from a step that failed?
