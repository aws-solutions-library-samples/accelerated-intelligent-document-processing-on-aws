AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  VPC Interface and Gateway Endpoints for IDP private AppSync deployment.
  Run scripts/check-vpc-endpoints.sh first to detect pre-existing endpoints
  and generate the exact deploy command. Deploy AFTER the IDP stack.

Parameters:
  VpcId:
    Type: String
    Description: VPC ID where the IDP application is deployed.

  SubnetIds:
    Type: CommaDelimitedList
    Description: >-
      Comma-separated subnet IDs for the VPC Interface Endpoints.
      Must match the LambdaSubnetIds used in the IDP application stack.

  LambdaSecurityGroupId:
    Type: String
    Description: >-
      Security Group ID exported from the IDP stack Output "LambdaVpcSecurityGroupId".
      This SG is attached to all Lambda functions; endpoints allow inbound HTTPS from it.

  RouteTableIds:
    Type: CommaDelimitedList
    Default: ""
    Description: >-
      (Optional) Comma-separated route table IDs for the private subnets.
      When provided, free S3 and DynamoDB Gateway endpoints are created.
      Leave empty to skip Gateway endpoints.

  IDPStackName:
    Type: String
    Description: Name of the IDP application CloudFormation stack (used for tagging).

  EnvironmentTag:
    Type: String
    Default: "private"
    Description: Value for the Environment tag applied to all resources.

  VpcCidr:
    Type: String
    Description: >-
      Primary CIDR block of the VPC (e.g. 10.1.0.0/16).
      Added to the VPC endpoint security group so that browsers running
      inside the VPC (WorkSpaces, VPN clients, bastions) can reach the
      AppSync and other Interface Endpoints directly on port 443.
      Auto-detected by deploy-vpc-endpoints.py if not supplied manually.

  # ──────────────────────────────────────────────────────────
  # Per-endpoint creation flags
  #
  # REQUIRED by the IDP application (15 endpoints):
  #   appsync-api, appsync, sqs, states, kms, logs,
  #   bedrock-runtime, ssm (Lambda→SSM Parameter Store calls),
  #   secretsmanager, lambda, events, athena,
  #   textract (OCR pattern — ocr/service.py calls Textract API),
  #   sts (BDA pattern — bda/bda_service.py and bda/blueprint_optimizer.py call STS for AssumeRole),
  #   monitoring (CloudWatch — workflow_tracker publishes metrics, dashboard_merger manages dashboards)
  #
  # REQUIRED only for SSM Session Manager testing bastion (2 endpoints):
  #   ssmmessages  — SSM Session Manager port-forwarding channel
  #   ec2messages  — SSM agent ↔ SSM service communication
  #   (If you are accessing the UI via VPN/Direct Connect in production,
  #    you do NOT need ssmmessages or ec2messages.)
  #
  # NOTE: Cognito endpoints (cognito-idp, cognito-identity) are NOT included.
  # AWS blocks PrivateLink when the User Pool has a domain configured.
  # Cognito auth traffic must flow through the NAT gateway.
  #
  # Set any flag to "false" if the endpoint already exists in the VPC.
  # Use scripts/check-vpc-endpoints.sh to auto-detect and generate the correct deploy command.
  # ──────────────────────────────────────────────────────────

  CreateExecuteApiEndpoint:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      Create the execute-api Interface endpoint. Required when the IDP stack is
      deployed with ApiGatewayVisibility=PRIVATE (the private REST API — which
      also serves the Web UI when WebUIHosting=APIGateway — is reachable only via
      this endpoint). Set to "false" if it already exists.

  CreateAppSyncApiEndpoint:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      DEPRECATED (AppSync removed; the UI/API transport is now a REST API — see
      CreateExecuteApiEndpoint). Left for backward compatibility; defaults off.

  CreateAppSyncControlEndpoint:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      DEPRECATED (AppSync removed). Left for backward compatibility; defaults off.

  CreateSqsEndpoint:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Create the sqs Interface endpoint. Set to "false" if already exists.

  CreateStatesEndpoint:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Create the states (Step Functions) Interface endpoint. Set to "false" if already exists.

  CreateKmsEndpoint:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Create the kms Interface endpoint. Set to "false" if already exists.

  CreateLogsEndpoint:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Create the logs (CloudWatch Logs) Interface endpoint. Set to "false" if already exists.

  CreateMonitoringEndpoint:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      Create the monitoring (CloudWatch) Interface endpoint. Required for the
      DashboardMerger custom-resource Lambda which calls cloudwatch:GetDashboard
      / PutDashboard during stack create/update. Set to "false" if already exists.

  CreateBedrockRuntimeEndpoint:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Create the bedrock-runtime Interface endpoint. Set to "false" if already exists.

  CreateSsmEndpoint:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Create the ssm Interface endpoint. Set to "false" if already exists.

  CreateSsmMessagesEndpoint:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Create the ssmmessages Interface endpoint. Required for SSM Session Manager port forwarding. Set to "false" if already exists.

  CreateEc2MessagesEndpoint:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Create the ec2messages Interface endpoint. Required for SSM Session Manager. Set to "false" if already exists.

  CreateSecretsManagerEndpoint:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Create the secretsmanager Interface endpoint. Set to "false" if already exists.

  CreateLambdaEndpoint:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Create the lambda Interface endpoint. Set to "false" if already exists.

  CreateEventsEndpoint:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Create the events (EventBridge) Interface endpoint. Set to "false" if already exists.

  CreateAthenaEndpoint:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Create the athena Interface endpoint. Set to "false" if already exists.

  CreateTextractEndpoint:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      Create the textract Interface endpoint. Required for OCR pattern Lambda functions
      that call the Textract API (ocr/service.py). Set to "false" if already exists.

  CreateStsEndpoint:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      Create the sts Interface endpoint. Required for BDA pattern Lambda functions
      that call STS AssumeRole (bda/bda_service.py, bda/blueprint_optimizer.py).
      Set to "false" if already exists.

  CreateMonitoringEndpoint:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      Create the monitoring (CloudWatch Metrics) Interface endpoint. Required for
      workflow_tracker Lambda (publishes custom metrics via put_metric_data) and
      dashboard_merger Lambda (manages CloudWatch dashboards).
      Set to "false" if already exists.

Conditions:
  CreateGatewayEndpoints: !Not
    - !Equals [ !Join [ "", !Ref RouteTableIds ], "" ]
  ShouldCreateExecuteApiEndpoint: !Equals [ !Ref CreateExecuteApiEndpoint, "true" ]
  ShouldCreateAppSyncApiEndpoint: !Equals [ !Ref CreateAppSyncApiEndpoint, "true" ]
  ShouldCreateAppSyncControlEndpoint: !Equals [ !Ref CreateAppSyncControlEndpoint, "true" ]
  ShouldCreateSqsEndpoint: !Equals [ !Ref CreateSqsEndpoint, "true" ]
  ShouldCreateStatesEndpoint: !Equals [ !Ref CreateStatesEndpoint, "true" ]
  ShouldCreateKmsEndpoint: !Equals [ !Ref CreateKmsEndpoint, "true" ]
  ShouldCreateLogsEndpoint: !Equals [ !Ref CreateLogsEndpoint, "true" ]
  ShouldCreateMonitoringEndpoint: !Equals [ !Ref CreateMonitoringEndpoint, "true" ]
  ShouldCreateBedrockRuntimeEndpoint: !Equals [ !Ref CreateBedrockRuntimeEndpoint, "true" ]
  ShouldCreateSsmEndpoint: !Equals [ !Ref CreateSsmEndpoint, "true" ]
  ShouldCreateSsmMessagesEndpoint: !Equals [ !Ref CreateSsmMessagesEndpoint, "true" ]
  ShouldCreateEc2MessagesEndpoint: !Equals [ !Ref CreateEc2MessagesEndpoint, "true" ]
  ShouldCreateSecretsManagerEndpoint: !Equals [ !Ref CreateSecretsManagerEndpoint, "true" ]
  ShouldCreateLambdaEndpoint: !Equals [ !Ref CreateLambdaEndpoint, "true" ]
  ShouldCreateEventsEndpoint: !Equals [ !Ref CreateEventsEndpoint, "true" ]
  ShouldCreateAthenaEndpoint: !Equals [ !Ref CreateAthenaEndpoint, "true" ]
  ShouldCreateTextractEndpoint: !Equals [ !Ref CreateTextractEndpoint, "true" ]
  ShouldCreateStsEndpoint: !Equals [ !Ref CreateStsEndpoint, "true" ]
  ShouldCreateMonitoringEndpoint: !Equals [ !Ref CreateMonitoringEndpoint, "true" ]

Resources:

  ##########################################################################
  # Endpoint Security Group
  # Allows inbound HTTPS (443) from:
  #   1. The Lambda security group (Lambda → AWS service calls)
  #   2. The VPC CIDR (browser clients inside the VPC — WorkSpaces, VPN,
  #      bastion — reaching the private REST API / Web UI via the execute-api
  #      Interface Endpoint)
  ##########################################################################

  VpcEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "VPC Endpoints for IDP stack ${IDPStackName}"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref LambdaSecurityGroupId
          Description: !Sub "Allow HTTPS from IDP Lambda functions (${IDPStackName})"
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr
          Description: "Allow HTTPS from VPC clients (WorkSpaces, VPN, bastion) reaching the private REST API / Web UI"
      # Explicit egress instead of the implicit allow-all-outbound that CFN adds
      # when SecurityGroupEgress is omitted (cfn-nag F1000). Interface-endpoint
      # ENIs only ever answer inbound 443, and security groups are stateful, so
      # replies to established connections need no egress rule of their own —
      # this pins outbound to HTTPS inside the VPC and nothing else.
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr
          Description: "Allow HTTPS to VPC-internal destinations only"
      Tags:
        - Key: Name
          Value: !Sub "${IDPStackName}-vpc-endpoints-sg"
        - Key: ManagedBy
          Value: "networking-team"
        - Key: IDPStack
          Value: !Ref IDPStackName
        - Key: Environment
          Value: !Ref EnvironmentTag

  # Egress rule on the Lambda SG allowing it to reach these VPC endpoints.
  # Required when the Lambda SG does not have a default 0.0.0.0/0 egress
  # (e.g. in hardened private-mode deployments where a restrictive egress rule
  # is the only one present).
  LambdaToVpcEndpointsEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref LambdaSecurityGroupId
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      DestinationSecurityGroupId: !Ref VpcEndpointSecurityGroup
      Description: !Sub "Allow HTTPS to VPC endpoints (${IDPStackName})"

  ##########################################################################
  # AppSync Endpoints
  ##########################################################################

  # execute-api endpoint — required for ApiGatewayVisibility=PRIVATE. The
  # private REST API (and the Web UI, when WebUIHosting=APIGateway) is reachable
  # only through this endpoint. PrivateDnsEnabled makes the regional execute-api
  # hostname resolve to it inside the VPC.
  ExecuteApiVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: ShouldCreateExecuteApiEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.execute-api"
      VpcEndpointType: Interface
      SubnetIds: !Ref SubnetIds
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      PrivateDnsEnabled: true
      Tags:
        - Key: Name
          Value: !Sub "${IDPStackName}-execute-api"
        - Key: IDPStack
          Value: !Ref IDPStackName
        - Key: Environment
          Value: !Ref EnvironmentTag

  AppSyncApiVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: ShouldCreateAppSyncApiEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.appsync-api"
      VpcEndpointType: Interface
      SubnetIds: !Ref SubnetIds
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      PrivateDnsEnabled: true
      Tags:
        - Key: Name
          Value: !Sub "${IDPStackName}-appsync-api"
        - Key: IDPStack
          Value: !Ref IDPStackName
        - Key: Environment
          Value: !Ref EnvironmentTag

  AppSyncControlVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: ShouldCreateAppSyncControlEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.appsync"
      VpcEndpointType: Interface
      SubnetIds: !Ref SubnetIds
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      PrivateDnsEnabled: true
      Tags:
        - Key: Name
          Value: !Sub "${IDPStackName}-appsync-control"
        - Key: IDPStack
          Value: !Ref IDPStackName
        - Key: Environment
          Value: !Ref EnvironmentTag

  ##########################################################################
  # AWS Service Interface Endpoints
  ##########################################################################

  SqsVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: ShouldCreateSqsEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.sqs"
      VpcEndpointType: Interface
      SubnetIds: !Ref SubnetIds
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      PrivateDnsEnabled: true
      Tags:
        - Key: Name
          Value: !Sub "${IDPStackName}-sqs"
        - Key: IDPStack
          Value: !Ref IDPStackName
        - Key: Environment
          Value: !Ref EnvironmentTag

  StatesVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: ShouldCreateStatesEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.states"
      VpcEndpointType: Interface
      SubnetIds: !Ref SubnetIds
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      PrivateDnsEnabled: true
      Tags:
        - Key: Name
          Value: !Sub "${IDPStackName}-states"
        - Key: IDPStack
          Value: !Ref IDPStackName
        - Key: Environment
          Value: !Ref EnvironmentTag

  KmsVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: ShouldCreateKmsEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.kms"
      VpcEndpointType: Interface
      SubnetIds: !Ref SubnetIds
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      PrivateDnsEnabled: true
      Tags:
        - Key: Name
          Value: !Sub "${IDPStackName}-kms"
        - Key: IDPStack
          Value: !Ref IDPStackName
        - Key: Environment
          Value: !Ref EnvironmentTag

  CloudWatchLogsVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: ShouldCreateLogsEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.logs"
      VpcEndpointType: Interface
      SubnetIds: !Ref SubnetIds
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      PrivateDnsEnabled: true
      Tags:
        - Key: Name
          Value: !Sub "${IDPStackName}-logs"
        - Key: IDPStack
          Value: !Ref IDPStackName
        - Key: Environment
          Value: !Ref EnvironmentTag

  MonitoringVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: ShouldCreateMonitoringEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.monitoring"
      VpcEndpointType: Interface
      SubnetIds: !Ref SubnetIds
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      PrivateDnsEnabled: true
      Tags:
        - Key: Name
          Value: !Sub "${IDPStackName}-monitoring"
        - Key: IDPStack
          Value: !Ref IDPStackName
        - Key: Environment
          Value: !Ref EnvironmentTag

  BedrockRuntimeVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: ShouldCreateBedrockRuntimeEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.bedrock-runtime"
      VpcEndpointType: Interface
      SubnetIds: !Ref SubnetIds
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      PrivateDnsEnabled: true
      Tags:
        - Key: Name
          Value: !Sub "${IDPStackName}-bedrock-runtime"
        - Key: IDPStack
          Value: !Ref IDPStackName
        - Key: Environment
          Value: !Ref EnvironmentTag

  SsmVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: ShouldCreateSsmEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ssm"
      VpcEndpointType: Interface
      SubnetIds: !Ref SubnetIds
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      PrivateDnsEnabled: true
      Tags:
        - Key: Name
          Value: !Sub "${IDPStackName}-ssm"
        - Key: IDPStack
          Value: !Ref IDPStackName
        - Key: Environment
          Value: !Ref EnvironmentTag

  SsmMessagesVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: ShouldCreateSsmMessagesEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ssmmessages"
      VpcEndpointType: Interface
      SubnetIds: !Ref SubnetIds
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      PrivateDnsEnabled: true
      Tags:
        - Key: Name
          Value: !Sub "${IDPStackName}-ssmmessages"
        - Key: IDPStack
          Value: !Ref IDPStackName
        - Key: Environment
          Value: !Ref EnvironmentTag

  Ec2MessagesVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: ShouldCreateEc2MessagesEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ec2messages"
      VpcEndpointType: Interface
      SubnetIds: !Ref SubnetIds
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      PrivateDnsEnabled: true
      Tags:
        - Key: Name
          Value: !Sub "${IDPStackName}-ec2messages"
        - Key: IDPStack
          Value: !Ref IDPStackName
        - Key: Environment
          Value: !Ref EnvironmentTag

  SecretsManagerVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: ShouldCreateSecretsManagerEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.secretsmanager"
      VpcEndpointType: Interface
